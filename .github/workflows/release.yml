name: Release

# Tag-driven: cut a release by pushing a `v*` tag, and nothing else.
#
# What a release of THIS project is: `dist/index.html` is a single self-contained
# offline file — no bundler, no CDN, no install — that a user opens in a browser.
# That is the artefact worth attaching, plus the source archive GitHub builds for
# free. The vendor SDK and datasheets are excluded from the archive by
# `.gitattributes` (`export-ignore`), because they are WCH's material and nobody
# needs them to run the app.
#
# The gate runs BEFORE the release is created, on the tagged commit. A release that
# is published and then found to have a red build is worse than no release, because
# the tag is what people pin.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: gate, then publish the tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The one job that writes: it creates the Release and uploads the asset.
      # Scoped here rather than at the workflow level, so no other workflow in this
      # repository inherits write access.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --generate-notes reads the history since the last tag

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install pyyaml

      - name: Validate MCU data
        run: python tools/validate_mcu.py

      - name: Check every SDK name each part claims
        run: python tools/verify_sdk_names.py

      - name: Build dist/index.html
        run: python build.py

      # The artefact is generated by build.py and committed, so a tag whose build
      # differs from the tree is a tag whose asset is not the code it claims to be.
      - name: The tagged tree builds what it says it builds
        run: |
          if ! git diff --quiet -- dist/index.html; then
            echo "::error::dist/index.html in the tagged commit is not what build.py produces - the release asset would not be this source"
            exit 1
          fi

      # Every suite that can run without PlatformIO. The firmware job in ci.yml is
      # what proves the generated C compiles; this is the correctness gate, and the
      # compile suites SKIP here with a printed reason rather than pretending.
      - name: Run tests
        run: node tests/run.js

      - name: Name the asset after the tag
        id: asset
        run: |
          tag="${GITHUB_REF_NAME}"
          cp dist/index.html "WCHCube-${tag}.html"
          echo "file=WCHCube-${tag}.html" >> "$GITHUB_OUTPUT"
          echo "asset is $(wc -c < "WCHCube-${tag}.html") bytes"

      # Built BEFORE the release is created, because `gh release create` takes the
      # asset list as arguments and would fail on a file that does not exist yet.
      - name: Source archive, without the vendor's material
        run: |
          # `git archive` honours .gitattributes `export-ignore`, which is why the SDK
          # and the datasheets are not in here. ~45 MB of WCH's files are not ours to
          # redistribute in a release tarball, and nobody needs them to run the app.
          git archive --format=tar.gz \
            --prefix="WCHCube-${{ github.ref_name }}/" \
            -o "WCHCube-${{ github.ref_name }}-source.tar.gz" \
            HEAD
          echo "source archive is $(wc -c < "WCHCube-${{ github.ref_name }}-source.tar.gz") bytes"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.asset.outputs.file }}" \
            "WCHCube-${{ github.ref_name }}-source.tar.gz#source archive (no vendor SDK)"
