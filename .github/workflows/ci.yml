name: CI

# Three jobs, in increasing cost, because the cheapest one catches most things:
#
#   test      ubuntu, no PlatformIO — data gates, build, the whole suite.
#   firmware  ubuntu + PlatformIO — really compiles the generated C. The `test`
#             job SKIPS the compile gate (there is no `pio` there), and a skip is
#             not a pass, so this job exists to make those checks run for real.
#   desktop   ubuntu + Rust — the Tauri shell builds and its unit tests pass.
#
# The `test` job runs on LINUX, and that is load-bearing rather than incidental.
# This repo is developed on Windows, where the filesystem is case-insensitive, so
# a path or an include spelled with the wrong capitals works locally and is dead
# here. Two defects of exactly that class have shipped: `codegen.header:
# ch32v00x.h` for a part whose header is `ch32v00X.h`, and `data/sources/V003/evt/`
# where the other parts and the tools say `Evt/`. `tests/source_paths.test.js` is
# the guard, and this filesystem is what makes it a guard rather than a formality.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing here writes to the repository, and no step needs a
# token with more reach than that.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PlatformIO is chatty and its progress bars are megabytes of ANSI in a log.
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'false'
  PYTHONIOENCODING: utf-8

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # BEFORE checkout, on purpose. GitHub's Windows image ships `core.autocrlf=true`, so every
      # LF file in this repo checks out as CRLF there: build.py then emits a CRLF dist, and the
      # fixtures no longer match `projectSerialize()`. The "up to date" step below is BLIND to
      # that - `git diff` normalises line endings before comparing - which is how 30 runs failed
      # at "Run tests" while every step before it was green. Harmless on Linux; symmetric on
      # purpose so the two jobs check out the same bytes. `longpaths`: the H417 EVT drop has a
      # 220-character path, 14 short of the Windows limit from the runner's D:\a\ prefix.
      - name: Check out the bytes that were committed (no autocrlf, long paths on)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install pyyaml

      # The MCU files are the product's data, and this is the gate that reads them
      # for internal consistency: geometry, pin existence, remap parity, I/O counts,
      # EXTI legality, HSE coupling, codegen names, DMA and NVIC.
      - name: Validate MCU data
        run: python tools/validate_mcu.py

      # A different question from the one above: does every SPL macro, function,
      # struct field and enum member an MCU file CLAIMS exist in that part's OWN
      # headers? A file that passes validate_mcu.py can still name a real,
      # correctly-spelled identifier belonging to a different chip — that is the
      # round-2 defect, and only this catches it. EVT first, PlatformIO as fallback.
      - name: Check every SDK name each part claims
        run: python tools/verify_sdk_names.py

      # A third question, and the one neither of the above can ask: has everything the
      # SOURCES say been said? Every function the datasheet puts on a pin, every RM
      # chapter and every SPL instance is a ledger row that is modelled, declared absent
      # with a citation, or OPEN - and a part meets its declared status (complete: 0 open;
      # in_extraction: exactly the recorded count, which may only go down). docs/COVERAGE.md.
      - name: Coverage ledger - every part meets its declared status
        run: python tools/coverage.py --gate

      - name: Build dist/index.html
        run: python build.py

      # build.py output is committed; a diff here means someone shipped a stale build.
      - name: dist/index.html is up to date
        run: |
          if ! git diff --quiet -- dist/index.html; then
            echo "::error file=dist/index.html::dist/index.html is stale - run 'python build.py' and commit the result"
            git diff --stat -- dist/index.html
            exit 1
          fi

      # The real-browser suites need a browser and SKIP loudly without one. Say
      # which one was found, rather than leaving a green run that quietly skipped
      # every layout, legibility and clock check.
      - name: Which browser the real-browser suites will use
        run: |
          for b in google-chrome chromium chromium-browser; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "found: $(command -v "$b") ($("$b" --version 2>/dev/null || echo 'version unknown'))"
              exit 0
            fi
          done
          echo "::warning::no Chrome or Chromium on this runner - the real-browser suites will SKIP. They are not a pass."

      # PlatformIO is deliberately absent here, so `tests/codegen_compile.test.js`,
      # `tests/generated_project.test.js` and `tests/firmware_native.test.js` SKIP
      # with a printed reason and the runner counts them. The `firmware` job below
      # runs the same suite with PlatformIO installed, which is where they run for
      # real. Every other suite is green here or the build fails.
      # The run's log needs a token to read; its ANNOTATIONS do not - they are public on a
      # public repo (GET /repos/{r}/check-runs/{id}/annotations). So on failure every
      # `  x <file>  <test>` line and every LOAD FAIL becomes a `::error` annotation, and the
      # failing test names can be read from outside without a login. Without this, 30 runs
      # failed at this step and the only readable fact was "Process completed with exit code 1".
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          node tests/run.js 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '^  x ' run.log | sed 's/^  x /::error title=test failed::/' || true
            grep -E 'LOAD FAIL' run.log | sed 's/^/::error title=load fail::/' || true
            grep -E '^[0-9]+ FAILED' run.log | sed 's/^/::error title=verdict::/' || true
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  firmware:
    name: firmware + generated project
    # **Windows, and it has to be.** The `ch32v` platform's registry metadata pins its
    # toolchain as `https://github.com/Community-PIO-CH32V/toolchain-riscv-windows.git`
    # - a WINDOWS-ONLY package - and its `tool-wlink` uploader is pinned to `#windows`
    # too. On ubuntu-latest `pio run` therefore fails in about one second, having
    # resolved a toolchain that has no Linux binaries, which is exactly the failure the
    # first two CI runs reported. That is not a mistake in this workflow; it is the
    # platform being Windows-only, and the honest fix is to run the job where the
    # toolchain exists rather than to drop the gate.
    #
    # This box is Windows too, which is why `pio run` has always worked locally and why
    # the problem only ever appeared on the runner.
    runs-on: windows-latest
    timeout-minutes: 40
    # Git Bash ships with the Windows runner and is the same shell the POSIX steps below
    # are written for. Without this the default is PowerShell, where `for f in ...; do`
    # is a syntax error rather than a loop.
    defaults:
      run:
        shell: bash
    steps:
      # See the same step in `test`: this runner's git defaults to autocrlf=true, and that is the
      # whole reason this job failed at "Run the tests" on every push while `pio run` passed.
      - name: Check out the bytes that were committed (no autocrlf, long paths on)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install pyyaml
          pip install platformio

      # ~/.platformio holds the ch32v platform, the WCH RISC-V toolchain and the
      # noneos-sdk framework — a few hundred MB. Without the cache every run
      # re-downloads all of it.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/AppData/Local/pip/cache
          key: pio-${{ runner.os }}-${{ hashFiles('data/firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: PlatformIO version and the toolchain it will install
        run: pio --version

      - name: Build the firmware for every part
        working-directory: data/firmware
        run: pio run

      # `pio run` builds every environment against the ONE configuration sitting in
      # the drop zone, so a file left there by a previous step fails each other
      # environment — correctly, and confusingly. Clear it before the gate below.
      - name: Empty the generated-code drop zone
        run: |
          rm -f data/firmware/lib/wchcube_generated/include/wchcube_init.h \
                data/firmware/lib/wchcube_generated/src/wchcube_init.c

      # Each fixture generates a whole standalone project and builds it with its own
      # environment. This is the half the `test` job cannot do.
      - name: Generate each fixture's project and build it
        run: |
          set -e
          for f in tests/fixtures/*.wchproj; do
            name="$(basename "$f" .wchproj)"
            out="$RUNNER_TEMP/gen/$name"
            rm -rf "$out"
            echo "=== $name ==="
            node tools/wchcube_cli.js --project "$f" --new-project "$out"
            ( cd "$out" && pio run )
          done

      # Build dist (the suite needs it) and run EVERYTHING, now with PlatformIO
      # present, so the compile-gate suites execute instead of skipping. This is the
      # only run in CI where "the generated C compiles" is a measured claim, and a
      # skip here would be the silence that let that claim stand unproven once before.
      - name: Build dist/index.html
        run: python build.py

      # Same tee-and-annotate as the `test` job: failing test names become public
      # `::error` annotations, readable without a token.
      - name: Run the tests with PlatformIO available
        run: |
          set -o pipefail
          node tests/run.js 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '^  x ' run.log | sed 's/^  x /::error title=test failed::/' || true
            grep -E 'LOAD FAIL' run.log | sed 's/^/::error title=load fail::/' || true
            grep -E '^[0-9]+ FAILED' run.log | sed 's/^/::error title=verdict::/' || true
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  desktop:
    name: tauri shell (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tauri 2's Linux prerequisites. `libappindicator3-dev` was renamed to
      # `libayatana-appindicator3-dev` when Ubuntu moved to the ayatana fork, so the
      # old name is not installable on 24.04; `libxdo-dev` is needed by
      # tauri-plugin-dialog's file picker; `patchelf` and `file` are needed to bundle.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libgtk-3-dev \
            build-essential curl wget file patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the web asset
        run: |
          pip install pyyaml
          python build.py

      # Cargo.lock IS committed (cargo 1.98.1 is on the dev box), so `--locked` is
      # what makes this a reproducible build rather than "resolve whatever is
      # current today". A dependency bump then has to be a deliberate commit.
      - name: Build the desktop app
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Run the Rust unit tests
        working-directory: src-tauri
        run: cargo test --release --locked
