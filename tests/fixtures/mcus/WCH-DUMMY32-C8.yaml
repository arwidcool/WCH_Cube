    remaps:
      - name: No remap
        pins: { CH1: PA6, CH2: PA7, CH3: PB0, CH4: PB1 }
      - name: Partial remap
        pins: { CH1: PB4, CH2: PB5, CH3: PB0, CH4: PB1 }

  TIM4:
