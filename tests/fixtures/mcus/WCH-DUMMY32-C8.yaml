          - { name: PWM Generation CH4, signals: [CH4] }
    remaps:
      - name: No remap
        pins: { CH1: PB6, CH2: PB7, CH3: PB8, CH4: PB9 }

  # ---------------- Connectivity ----------------
  USART1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
      - name: Hardware Flow Control (RS232)
        choices:
