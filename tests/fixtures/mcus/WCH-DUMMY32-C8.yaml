      - name: Partial remap 2
        pins: { CH1: PA0, ETR: PA0, CH2: PA1, CH3: PB10, CH4: PB11 }
      - name: Full remap
        pins: { CH1: PA15, ETR: PA15, CH2: PB3, CH3: PB10, CH4: PB11 }

  TIM3:
