# Package library
#
# kind: dual  -> pins on left and right sides only (SOP, TSSOP, SSOP, DIP)
# kind: quad  -> pins on all four sides (QFN, LQFP, TQFP)
#
# Numbering convention (both kinds): pin 1 is at the TOP of the LEFT side,
# counting DOWN the left side, then continues counter-clockwise
# (bottom left->right, right bottom->top, top right->left).
# That matches every WCH and ST package drawing.
#
# pins  : total pin count (quad packages must be divisible by 4)
# pitch : mm, informational
# body  : [width, height] mm, informational
# epad  : exposed pad present (drawn as a square in the middle)

packages:
  # ---- dual in line -------------------------------------------------------
  - { id: SOP8,     kind: dual, pins: 8,   pitch: 1.27, body: [4.9, 3.9] }
  - { id: SOP16,    kind: dual, pins: 16,  pitch: 1.27, body: [9.9, 3.9] }
  - { id: SOP20,    kind: dual, pins: 20,  pitch: 1.27, body: [12.8, 7.5] }
  - { id: SOP28,    kind: dual, pins: 28,  pitch: 1.27, body: [17.9, 7.5] }
  - { id: TSSOP20,  kind: dual, pins: 20,  pitch: 0.65, body: [6.5, 4.4] }
  - { id: TSSOP24,  kind: dual, pins: 24,  pitch: 0.65, body: [7.8, 4.4] }
  - { id: TSSOP28,  kind: dual, pins: 28,  pitch: 0.65, body: [9.7, 4.4] }
  - { id: SSOP20,   kind: dual, pins: 20,  pitch: 0.65, body: [7.2, 5.3] }
  - { id: SSOP28,   kind: dual, pins: 28,  pitch: 0.65, body: [10.2, 5.3] }
  - { id: QSOP24,   kind: dual, pins: 24,  pitch: 0.635, body: [8.7, 3.9] }
  - { id: MSOP10,   kind: dual, pins: 10,  pitch: 0.5,  body: [3.0, 3.0] }
  - { id: DIP8,     kind: dual, pins: 8,   pitch: 2.54, body: [9.3, 6.4] }
  - { id: DIP20,    kind: dual, pins: 20,  pitch: 2.54, body: [26.2, 6.4] }

  # ---- quad, no leads -----------------------------------------------------
  - { id: QFN12,    kind: quad, pins: 12,  pitch: 0.4,  body: [2, 2],  epad: true }
  - { id: QFN20,    kind: quad, pins: 20,  pitch: 0.5,  body: [3, 3],  epad: true }
  - { id: QFN24,    kind: quad, pins: 24,  pitch: 0.5,  body: [4, 4],  epad: true }
  - { id: QFN28,    kind: quad, pins: 28,  pitch: 0.5,  body: [4, 4],  epad: true }
  - { id: QFN32,    kind: quad, pins: 32,  pitch: 0.5,  body: [5, 5],  epad: true }
  - { id: QFN40,    kind: quad, pins: 40,  pitch: 0.5,  body: [6, 6],  epad: true }
  - { id: QFN48,    kind: quad, pins: 48,  pitch: 0.5,  body: [7, 7],  epad: true }
  - { id: QFN56,    kind: quad, pins: 56,  pitch: 0.5,  body: [8, 8],  epad: true }
  - { id: QFN64,    kind: quad, pins: 64,  pitch: 0.5,  body: [9, 9],  epad: true }
  - { id: QFN68,    kind: quad, pins: 68,  pitch: 0.4,  body: [8, 8],  epad: true }

  # ---- quad, leaded -------------------------------------------------------
  - { id: LQFP32,   kind: quad, pins: 32,  pitch: 0.8,  body: [7, 7] }
  - { id: LQFP44,   kind: quad, pins: 44,  pitch: 0.8,  body: [10, 10] }
  - { id: LQFP48,   kind: quad, pins: 48,  pitch: 0.5,  body: [7, 7] }
  - { id: LQFP64,   kind: quad, pins: 64,  pitch: 0.5,  body: [10, 10] }
  - { id: LQFP100,  kind: quad, pins: 100, pitch: 0.5,  body: [14, 14] }
  - { id: LQFP128,  kind: quad, pins: 128, pitch: 0.4,  body: [14, 14] }
  - { id: LQFP144,  kind: quad, pins: 144, pitch: 0.5,  body: [20, 20] }
  - { id: TQFP44,   kind: quad, pins: 44,  pitch: 0.8,  body: [10, 10] }

# Future: BGA / WLCSP need a grid layout (rows A..T x columns 1..n). Not needed for WCH yet.
