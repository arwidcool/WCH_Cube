        QSPIn_DMA request is genuinely bidirectional (the same example uses BOTH
        DMA_DIR_PeripheralSRC and _PeripheralDST on different calls) - default is the
        read direction, the user flips it for a write.
      SWPMI: >
        Word, confirmed on THIS part - SWPMI_MultiBUffering/Common/hardware.c:79-84,112-117.
      DAC: >
        Memory to peripheral, Half Word, Circular, confirmed on THIS part -
        DAC_DMA/Common/hardware.c:62-70 (targets DAC->R12BDHR1, a 32-bit register whose
        DMA transfer is nonetheless configured Half Word by the vendor's own example).
      DFSDM: >
