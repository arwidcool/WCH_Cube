      A3: [{ pin: PE14, af: 14 }, { pin: PE0, af: 0 }, { pin: PB8, af: 12 }]
      A4: [{ pin: PE15, af: 15 }, { pin: PB9, af: 12 }, { pin: PE1, af: 0 }]
