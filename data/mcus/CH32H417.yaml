          - { name: Big,    value: 1, sdk: ECDCExcuteEndian_Big }
        help: >
          R32_ECDC_CTRL RB_ECDC_DAT_MOD, bit 13 (CH32H417RM.md:60741-60752: "must be
          configured as big-endian mode for single 128-bit encryption/decryption
          operations"). Default matches ECDC_StructInit() (ch32h417_ecdc.c:83); the
          EVT's own RAM_Block example overrides it to Big regardless of that note
          (hardware.c) - this row lets a project match either.
      - key: key_31_0
        name: "Key[31:0] - REPLACE before use"
        struct: ECDC_KEY_TypeDef
        embed: key
        sdk_field: KEY_31T0
        type: int
        default: 0
        min: 0
        max: 4294967295
        help: "ch32h417_ecdc.h:73. ZERO IS A PLACEHOLDER, NOT A KEY - ECDC_Init() dereferences this struct unconditionally (ch32h417_ecdc.c:49), so it must be embedded with SOME value to avoid a NULL-pointer hard fault; the real key is the application's, set before first use."
      - key: key_63_32
