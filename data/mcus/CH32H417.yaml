          - { name: "10-bit", signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, HSYNC, VSYNC, PCLK] }
          - { name: "12-bit", signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, HSYNC, VSYNC, PCLK] }
    signal_pins:
      D0: [{ pin: PC6, af: 13 }, { pin: PE0, af: 11 }, { pin: PA9, af: 13 }]
      D1: [{ pin: PC7, af: 13 }, { pin: PE1, af: 11 }, { pin: PA10, af: 13 }]
      D10: [{ pin: PD6, af: 13 }, { pin: PB5, af: 13 }]
      D11: [{ pin: PD2, af: 13 }, { pin: PF0, af: 12 }, { pin: PF10, af: 13 }]
      D2: [{ pin: PC8, af: 13 }, { pin: PF4, af: 13 }, { pin: PE2, af: 13 }, { pin: PB13, af: 13 }]
      D3: [{ pin: PC9, af: 13 }, { pin: PF5, af: 13 }, { pin: PE3, af: 13 }]
      D4: [{ pin: PC11, af: 13 }, { pin: PD12, af: 13 }, { pin: PE4, af: 13 }]
      D5: [{ pin: PD13, af: 13 }, { pin: PD3, af: 13 }, { pin: PF14, af: 11 }, { pin: PB3, af: 13 }, { pin: PB6, af: 13 }]
      D6: [{ pin: PD14, af: 13 }, { pin: PE5, af: 13 }, { pin: PB8, af: 13 }]
      D7: [{ pin: PD15, af: 13 }, { pin: PE6, af: 13 }, { pin: PB9, af: 13 }]
      D8: [{ pin: PC10, af: 13 }, { pin: PF4, af: 11 }]
      D9: [{ pin: PC12, af: 13 }, { pin: PF3, af: 11 }]
      HSYNC: [{ pin: PB13, af: 8 }, { pin: PA4, af: 13 }]
      PCLK: [{ pin: PB12, af: 15 }, { pin: PA6, af: 13 }, { pin: PF13, af: 11 }]
      VSYNC: [{ pin: PA5, af: 11 }, { pin: PB14, af: 15 }, { pin: PF3, af: 13 }, { pin: PB7, af: 13 }]
    params:
      - key: datasize_8
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_8b
        depends_on: { setting: Mode, equals: 8-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:72). Fixed by the Mode row, which is what claims D8-D11."
      - key: datasize_10
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_10b
        depends_on: { setting: Mode, equals: 10-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:73). Fixed by the Mode row."
      - key: datasize_12
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_12b
        depends_on: { setting: Mode, equals: 12-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:74). Fixed by the Mode row."
      - key: hclk_pol
        name: PCLK edge
        struct: DVP_InitTypeDef
        sdk_field: DVP_HCLK_P
        type: enum
        default: Rising
        options:
          - { name: Rising , value: 0, sdk: DVP_Hclk_P_Rising }
          - { name: Falling, value: 1, sdk: DVP_Hclk_P_Falling }
        help: "DVP_CR0, the pixel-clock edge data is sampled on (ch32h417_dvp.h:77-78). DVP_StructInit() starts at Rising."
      - key: hsync_pol
        name: HSYNC polarity
        struct: DVP_InitTypeDef
        sdk_field: DVP_HSYNC_P
        type: enum
        default: Active low
        options:
          - { name: Active high, value: 0, sdk: DVP_Hsync_P_High }
          - { name: Active low , value: 1, sdk: DVP_Hsync_P_Low }
        help: >
          DVP_CR0 (ch32h417_dvp.h:81-82). The default follows the EVT drop rather than the
          macro that encodes 0: DVP_StructInit() sets DVP_Hsync_P_Low, whose value is 0x04.
      - key: vsync_pol
        name: VSYNC polarity
        struct: DVP_InitTypeDef
        sdk_field: DVP_VSYNC_P
        type: enum
        default: Active low
        options:
          - { name: Active low , value: 0, sdk: DVP_Vsync_P_Low }
          - { name: Active high, value: 1, sdk: DVP_Vsync_P_High }
        help: "DVP_CR0 (ch32h417_dvp.h:85-86). DVP_StructInit() starts at Low."
      - key: caprate
        name: Frame capture rate
        struct: DVP_InitTypeDef
        sdk_field: DVP_FrameCapRate
        type: enum
        default: Every frame
        options:
          - { name: Every frame   , value: 0, sdk: DVP_FrameCapRate_100P }
          - { name: Every 2nd frame, value: 1, sdk: DVP_FrameCapRate_50P }
          - { name: Every 4th frame, value: 2, sdk: DVP_FrameCapRate_25P }
        help: "DVP_CR1 (ch32h417_dvp.h:89-91). The SDK spells these 100P / 50P / 25P - the proportion of frames kept."
      - key: capmode
        name: Capture mode
        struct: DVP_InitTypeDef
        sdk_field: DVP_CaptureMode
        type: enum
        default: Snapshot
        options:
          - { name: Continuous, value: 0, sdk: DVP_CaptureMode_Continuous }
          - { name: Snapshot  , value: 1, sdk: DVP_CaptureMode_Snapshot }
        help: "DVP_CR1 (ch32h417_dvp.h:94-95). Snapshot is the EVT drop's own default (DVP_StructInit)."
      - key: jpeg
        name: JPEG mode
        struct: DVP_InitTypeDef
        sdk_field: DVP_JPEGMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR0 bit 6. The sensor sends a JPEG byte stream rather than raw pixels, so the row/column counts below stop describing the transfer."
      - key: rows
        name: Rows per frame
        struct: DVP_InitTypeDef
        sdk_field: DVP_ROW_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_ROW_NUM. The sensor's frame height in lines. 0 is the EVT drop's own starting value (DVP_StructInit) and means the field is left for your own code."
      - key: cols
        name: Bytes per row
        struct: DVP_InitTypeDef
        sdk_field: DVP_COL_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_COL_NUM. Counted in BYTES, not pixels, so an RGB565 line of 320 pixels is 640. 0 is DVP_StructInit()'s value."
      - key: crop
        name: Crop window
        struct: DVP_InitTypeDef
        sdk_field: DVP_Crop
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR1 bit 5. Captures a rectangle of the sensor's frame instead of all of it; the four window rows below apply only while it is on."
      - key: win_hoff
        name: Window horizontal offset
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_HOFFCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_HOFFCNT, in BYTES from the start of the line - the same unit as Bytes per row."
      - key: win_vst
        name: Window first line
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VST
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VST, the first line of the frame that is kept."
      - key: win_capcnt
        name: Window width
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_CAPCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_CAPCNT, bytes captured per line."
      - key: win_vline
        name: Window height
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VLine
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VLINE, lines captured per frame."
    notes: >
      Digital video port: a parallel camera interface. The Mode row picks the data width
      AND the pads it claims - 8-bit takes D0-D7, 10-bit adds D8-D9, 12-bit adds D10-D11 -
      and Parameter Settings writes the matching DVP_CR0.DATA_SIZE rather than offering the
      width a second time, so the pin plan and the register cannot disagree.
      THE TWO DMA BUFFER ADDRESSES ARE DELIBERATELY NOT ROWS. `DVP_DMA_BUF0_Addr` and
      `DVP_DMA_BUF1_Addr` (ch32h417_dvp.h:31-35) are pointers into your own program's
      memory - a symbol this tool has no way to know - so they are left at the struct's
      zero-initialiser, which is exactly what the vendor's own `DVP_StructInit()` sets them
      to (ch32h417_dvp.c). Assign `DVP->DMA_BUF0` / `DMA_BUF1` in the USER CODE block before
      `DVP_Cmd(ENABLE)`. Every other member of the struct is a row above.
  ECDC:
    category: System Core
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Enabled }
    pins: { none: true, source: "CH32H417DS0.md Table 2-1-1 and Tables 2-2-x: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    params:
      - key: excute_mode
        name: Operation
        struct: ECDC_InitTypeDef
        sdk_field: ExcuteMode
        type: enum
        default: RAM block encrypt
        options:
          - { name: RAM block encrypt,   value: 130, sdk: ECDC_RAM_Encrypt }
          - { name: RAM block decrypt,   value: 138, sdk: ECDC_RAM_Decrypt }
          - { name: Single 128-bit encrypt, value: 2, sdk: ECDC_SingleTime_Encrypt }
          - { name: Single 128-bit decrypt, value: 10, sdk: ECDC_SingleTime_Decrypt }
        help: >
          ch32h417_ecdc.h:52-57 (`ECDC_ExcuteMode_TypeDef`), packs RB_ECDC_MODE_SEL
          (bit 3, CH32H417RM.md:60801-60808, encrypt/decrypt) and RB_ECDC_NORMAL_EN
          (bit 1, :60809-60818) with RB_ECDC_WRSRAM_EN (bit 7, :60781-60789, RAM-to-RAM
          vs a single 128-bit register block) into one value written straight into
          R32_ECDC_CTRL. This is a per-operation call as much as an init - the EVT's
          own example calls `ECDC_Init()` a second time with only this field changed
          to switch from encrypt to decrypt (hardware.c) - so it is exposed as the
          engine's INITIAL mode; application code changes it again for later calls.
      - key: algorithm
        name: Algorithm
        struct: ECDC_InitTypeDef
        sdk_field: Algorithm
        type: enum
        default: SM4
        options:
          - { name: SM4, value: 0, sdk: ECDCAlgorithm_SM4 }
          - { name: AES, value: 1, sdk: ECDCAlgorithm_AES }
        help: "R32_ECDC_CTRL RB_ECDC_ALGRM_MOD, bit 8 (CH32H417RM.md:60774-60779). Default matches ECDC_StructInit() (ch32h417_ecdc.c:80)."
      - key: block_cipher_mode
        name: Block cipher mode
        struct: ECDC_InitTypeDef
        sdk_field: BlockCipherMode
        type: enum
        default: CTR
        options:
          - { name: CTR, value: 0, sdk: ECDCBlockCipherMode_CTR }
          - { name: ECB, value: 1, sdk: ECDCBlockCipherMode_ECB }
        help: "R32_ECDC_CTRL RB_ECDC_CIPHER_MOD, bit 9 (CH32H417RM.md:60767-60773). Default matches ECDC_StructInit() (ch32h417_ecdc.c:81)."
      - key: key_len
        name: Key length
        struct: ECDC_InitTypeDef
        sdk_field: KeyLen
        type: enum
        default: 128-bit
        options:
