        embed: key
        sdk_field: KEY_159T128
        type: int
        default: 0
        min: 0
        max: 4294967295
        help: "ch32h417_ecdc.h:77. Placeholder only. ECDC_SetKey() only writes this word when Key length is 192-bit or wider (ch32h417_ecdc.c:118-122)."
      - key: key_191_160
