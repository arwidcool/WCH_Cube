  LTDC:
    category: Graphics
    # THE OUTPUT WIDTH IS A WIRING CHOICE, NOT A REGISTER, and that is the whole reason
    # this row exists. RM 43.4.5: the global control register `R32_LTDC_GCR` carries four
    # polarity bits and an enable, and bits [27:1] are reserved - there is no field that
    # narrows the bus. The controller always drives a 24-bit parallel RGB port; a 16- or
    # 18-bit panel is wired to the HIGH bits of each channel and the low ones are simply
    # not connected. So the choice below is "how many lines did you wire", and every line
    # it does not claim stays an ordinary pin that any other peripheral may take.
    #
    # The subsets are the standard panel wiring (panel MSB to controller MSB), which is
    # also how the datasheet numbers the pads: R7/G7/B7 are the most significant.
    #
    #   RGB888  24 lines  R0-R7  G0-G7  B0-B7      frees nothing
    #   RGB666  18 lines  R2-R7  G2-G7  B2-B7      frees 6: R0-R1, G0-G1, B0-B1
    #   RGB565  16 lines  R3-R7  G2-G7  B3-B7      frees 8: R0-R2, G0-G1, B0-B2
    #
    # NOT the same thing as an "8-bit mode", which is a question people ask of this
    # controller and which has a different answer: `LTDC_LxPFCR.PF[2:0]` (RM 43.4.18)
    # offers L8, AL44 and AL88 - eight bits per pixel - but those describe the LAYER'S
    # FRAME BUFFER IN MEMORY. The pixel format converter expands every one of them to
    # ARGB8888 before the blender, so an 8-bit format saves RAM and frees no pin at all.
    # It IS selectable and it IS applied: `Pixel format` is a member of the per-layer
    # init below, written by `LTDC_LayerInit()` into `PFCR` beside the window geometry.
    # The two axes sit on one peripheral on purpose - the panel wiring and the buffer
    # format are the same planning decision - and neither one moves a pin the other owns.
    settings:
      - name: "Colour depth"
        choices:
          - { name: Disable }
          - { name: RGB888, signals: [R0, R1, R2, R3, R4, R5, R6, R7, G0, G1, G2, G3, G4, G5, G6, G7, B0, B1, B2, B3, B4, B5, B6, B7] }
          - { name: RGB666, signals: [R2, R3, R4, R5, R6, R7, G2, G3, G4, G5, G6, G7, B2, B3, B4, B5, B6, B7] }
          - { name: RGB565, signals: [R3, R4, R5, R6, R7, G2, G3, G4, G5, G6, G7, B3, B4, B5, B6, B7] }
      - name: "Sync and clock"
        choices:
          - { name: Disable }
          - { name: Enabled, signals: [CLK, HSYNC, VSYNC, DE] }
      - name: "Layer 1"
        choices:
          - { name: Disable }
          - { name: Enabled }
      - name: "Layer 2"
        choices:
          - { name: Disable }
          - { name: Enabled }
    signal_pins:
      B0: [{ pin: PF1, af: 8 }, { pin: PF3, af: 14 }, { pin: PE4, af: 14 }]
      B1: [{ pin: PD14, af: 8 }, { pin: PE0, af: 14 }, { pin: PA10, af: 14 }, { pin: PC10, af: 10 }, { pin: PD0, af: 14 }]
      B2: [{ pin: PA13, af: 8 }, { pin: PD6, af: 14 }, { pin: PF4, af: 14 }, { pin: PA3, af: 9 }, { pin: PC9, af: 14 }, { pin: PD2, af: 14 }]
      B3: [{ pin: PD10, af: 14 }, { pin: PD7, af: 14 }, { pin: PE0, af: 15 }, { pin: PF5, af: 14 }, { pin: PA8, af: 13 }]
      B4: [{ pin: PC11, af: 14 }, { pin: PE0, af: 9 }, { pin: PA10, af: 12 }, { pin: PE12, af: 14 }, { pin: PA15, af: 10 }, { pin: PE1, af: 15 }, { pin: PD4, af: 14 }]
      B5: [{ pin: PD5, af: 14 }, { pin: PF14, af: 15 }, { pin: PA3, af: 14 }, { pin: PB5, af: 3 }]
      B6: [{ pin: PA14, af: 14 }, { pin: PA15, af: 14 }, { pin: PB8, af: 14 }]
      B7: [{ pin: PD2, af: 9 }, { pin: PD8, af: 14 }, { pin: PB9, af: 14 }]
      CLK: [{ pin: PA15, af: 15 }, { pin: PB14, af: 14 }, { pin: PE14, af: 13 }, { pin: PF1, af: 14 }]
      DE: [{ pin: PE13, af: 14 }, { pin: PC12, af: 15 }, { pin: PC5, af: 14 }, { pin: PF10, af: 14 }]
      G0: [{ pin: PB1, af: 14 }, { pin: PB14, af: 6 }, { pin: PE5, af: 14 }]
      G1: [{ pin: PB0, af: 14 }, { pin: PE6, af: 14 }]
      G2: [{ pin: PD15, af: 7 }, { pin: PC0, af: 11 }, { pin: PA6, af: 14 }, { pin: PD5, af: 15 }]
      G3: [{ pin: PC9, af: 10 }, { pin: PD6, af: 15 }, { pin: PF4, af: 9 }, { pin: PE11, af: 14 }]
      G4: [{ pin: PB10, af: 14 }, { pin: PC8, af: 14 }, { pin: PD7, af: 15 }]
      G5: [{ pin: PB11, af: 14 }, { pin: PC1, af: 14 }, { pin: PF3, af: 15 }]
      G6: [{ pin: PC7, af: 14 }, { pin: PF4, af: 15 }]
      G7: [{ pin: PD3, af: 14 }, { pin: PF2, af: 14 }, { pin: PF5, af: 15 }, { pin: PB15, af: 14 }]
      HSYNC: [{ pin: PC10, af: 15 }, { pin: PC6, af: 14 }, { pin: PA6, af: 11 }]
      R0: [{ pin: PE1, af: 14 }, { pin: PA0, af: 14 }, { pin: PA14, af: 15 }]
      R1: [{ pin: PF0, af: 11 }, { pin: PA2, af: 14 }]
      R2: [{ pin: PD13, af: 3 }, { pin: PA1, af: 14 }, { pin: PC10, af: 14 }]
      R3: [{ pin: PD0, af: 15 }, { pin: PD12, af: 11 }, { pin: PA15, af: 9 }, { pin: PB0, af: 9 }]
      R4: [{ pin: PA5, af: 14 }, { pin: PD1, af: 15 }, { pin: PD11, af: 11 }, { pin: PA11, af: 14 }]
      R5: [{ pin: PA12, af: 14 }, { pin: PA9, af: 14 }, { pin: PC0, af: 14 }, { pin: PD2, af: 15 }]
      R6: [{ pin: PA8, af: 14 }, { pin: PE2, af: 14 }, { pin: PC12, af: 14 }, { pin: PB1, af: 9 }, { pin: PD3, af: 15 }]
      R7: [{ pin: PD4, af: 15 }, { pin: PE15, af: 14 }, { pin: PC4, af: 14 }, { pin: PF0, af: 14 }]
      VSYNC: [{ pin: PB12, af: 10 }, { pin: PC11, af: 15 }, { pin: PA4, af: 14 }, { pin: PA7, af: 14 }]
    # THE PANEL TIMING, and it is peripheral-level where the layer block above is
    # per-layer. `LTDC_Init(&s)` (ch32h417_ltdc.h:224) takes the struct alone - the
    # controller is a singleton, so `no_handle: true` - and every member below is one of
    # its fifteen. The four polarities are what a panel datasheet states; the eight
    # counters are its blanking diagram.
    #
    # THE COUNTERS ARE ACCUMULATED, NOT WIDTHS, and getting that wrong is the classic way
    # an LTDC brings up a blank panel. The header says so member by member
    # (ch32h417_ltdc.h:36-57): AccumulatedHBP ranges "from LTDC_HorizontalSync to 0xFFF",
    # AccumulatedActiveW "from LTDC_AccumulatedHBP", TotalWidth "from
    # LTDC_AccumulatedActiveW". So each is the running total from the start of the line,
    # minus one, and NOT the porch's own width:
    #
    #     HorizontalSync      = HSW - 1
    #     AccumulatedHBP      = HSW + HBP - 1
    #     AccumulatedActiveW  = HSW + HBP + ActiveWidth - 1
    #     TotalWidth          = HSW + HBP + ActiveWidth + HFP - 1
    #
    # and the same four vertically. The defaults are 0 because a timing this tool cannot
    # know is better left at the register's reset value than guessed: there is no
    # `LTDC_StructInit()` default worth copying here (it zeroes them too), and a plausible
    # 800x480 set would be a made-up panel presented as fact.
    params:
      - key: hs_polarity
        name: HSYNC polarity
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_HSPolarity
        type: enum
        default: Active low
        options:
          - { name: Active low , value: 0, sdk: LTDC_HSPolarity_AL }
          - { name: Active high, value: 1, sdk: LTDC_HSPolarity_AH }
        help: "LTDC_GCR.HSPOL (ch32h417_ltdc.h:159-160). Most parallel RGB panels are active low."
      - key: vs_polarity
        name: VSYNC polarity
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_VSPolarity
        type: enum
        default: Active low
        options:
          - { name: Active low , value: 0, sdk: LTDC_VSPolarity_AL }
          - { name: Active high, value: 1, sdk: LTDC_VSPolarity_AH }
        help: "LTDC_GCR.VSPOL (ch32h417_ltdc.h:163-164)."
      - key: de_polarity
        name: Data-enable polarity
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_DEPolarity
        type: enum
        default: Active low
        options:
          - { name: Active low , value: 0, sdk: LTDC_DEPolarity_AL }
          - { name: Active high, value: 1, sdk: LTDC_DEPolarity_AH }
        help: "LTDC_GCR.DEPOL (ch32h417_ltdc.h:167-168). The DE pad is claimed by the `Sync and clock` row."
      - key: pc_polarity
        name: Pixel-clock polarity
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_PCPolarity
        type: enum
        default: Not inverted
        options:
          - { name: Not inverted, value: 0, sdk: LTDC_PCPolarity_IPC }
          - { name: Inverted    , value: 1, sdk: LTDC_PCPolarity_IIPC }
        help: "LTDC_GCR.PCPOL (ch32h417_ltdc.h:171-172). The SDK spells these IPC and IIPC - input pixel clock, and inverted input pixel clock."
      - key: hsync
        name: HSYNC width - 1
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_HorizontalSync
        type: int
        default: 0
        min: 0
        max: 4095
        help: "LTDC_SSCR.HSW, 0x000-0xFFF. The panel's horizontal sync pulse width MINUS ONE - every counter in this block is a zero-based end position."
      - key: vsync
        name: VSYNC height - 1
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_VerticalSync
        type: int
        default: 0
        min: 0
        max: 2047
        help: "LTDC_SSCR.VSH, 0x000-0x7FF. Vertical sync pulse height minus one. Note the vertical counters are 11 bits where the horizontal ones are 12."
      - key: hbp
        name: Accumulated HBP
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_AccumulatedHBP
        type: int
        default: 0
        min: 0
        max: 4095
        help: "LTDC_BPCR.AHBP. HSYNC width + horizontal back porch - 1. The header requires it to be at least HSYNC width - 1 (ch32h417_ltdc.h:42-43), because it is a running total and not the porch on its own."
      - key: vbp
        name: Accumulated VBP
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_AccumulatedVBP
        type: int
        default: 0
        min: 0
        max: 2047
        help: "LTDC_BPCR.AVBP. VSYNC height + vertical back porch - 1."
      - key: active_w
        name: Accumulated active width
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_AccumulatedActiveW
        type: int
        default: 0
        min: 0
        max: 4095
        help: "LTDC_AWCR.AAW. HSYNC + HBP + the panel's pixel width - 1. Must be at least the accumulated HBP."
      - key: active_h
        name: Accumulated active height
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_AccumulatedActiveH
        type: int
        default: 0
        min: 0
        max: 2047
        help: "LTDC_AWCR.AAH. VSYNC + VBP + the panel's line count - 1."
      - key: total_w
        name: Total width
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_TotalWidth
        type: int
        default: 0
        min: 0
        max: 4095
        help: "LTDC_TWCR.TOTALW. The whole line including the front porch, minus one - so HSYNC + HBP + width + HFP - 1. This is what the pixel clock divides into to give the line rate."
      - key: total_h
        name: Total height
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_TotalHeigh
        type: int
        default: 0
        min: 0
        max: 2047
        help: "LTDC_TWCR.TOTALH, the whole frame including the vertical front porch, minus one. The SDK spells the member TotalHeigh, without the final t (ch32h417_ltdc.h:56)."
      - key: bg_red
        name: Background red
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_BackgroundRedValue
        type: int
        default: 0
        min: 0
        max: 255
        help: "LTDC_BCCR.BCRED. What the panel shows where no layer covers it - the colour behind both layers, not a layer's own default colour."
      - key: bg_green
        name: Background green
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_BackgroundGreenValue
        type: int
        default: 0
        min: 0
        max: 255
        help: "LTDC_BCCR.BCGREEN."
      - key: bg_blue
        name: Background blue
        struct: LTDC_InitTypeDef
        sdk_field: LTDC_BackgroundBlueValue
        type: int
        default: 0
        min: 0
        max: 255
        help: "LTDC_BCCR.BCBLUE."
    # THE LAYER INIT, ONE STRUCT FILLED ONCE PER LAYER - deliverable E's mechanism, and
    # this peripheral is why it was built. `LTDC_LayerInit(LTDC_Layerx, &s)`
    # (ch32h417_ltdc.h:225) keeps the FUNCTION and varies the HANDLE: `LTDC_Layer1` and
    # `LTDC_Layer2` are two register blocks (ch32h417.h:1770-1771), where a timer's four
    # channels vary the function and keep the handle. `instances:` names both per layer,
    # and `setting:` is what decides whether a layer is live at all - the `Layer 1` and
    # `Layer 2` rows above, which claim no pad because a layer is memory, not wiring.
    #
    # THE PIXEL FORMAT MOVED HERE, AND THAT IS THE POINT OF THE CHANGE. It shipped in
    # round 5 as two peripheral-level rows with `sdk_none:` and a long note explaining
    # that the SDK's only setter, `LTDC_LayerPixelFormat()`, is a RECONFIGURE call that
    # rescales `CFBLR` from a layer width that is still 0 before `LTDC_LayerInit()` has
    # run (ch32h417_ltdc.c:622-672) - so calling it from a generated init would write a
    # bogus frame-buffer line length. All of that was true, and the conclusion drawn from
    # it - record the choice, write no register - is now obsolete: `LTDC_PixelFormat` is
    # an ORDINARY MEMBER of the struct this block fills (ch32h417_ltdc.h:88), written by
    # `LTDC_LayerInit()` straight into `PFCR` beside the geometry it belongs with. One
    # row per layer, applied rather than commented, and the two planning-only rows are
    # deleted rather than left beside it saying something different.
    #
    # Every default below is the EVT drop's own `LTDC_LayerStructInit()`
    # (ch32h417_ltdc.c), not a guess: geometry and frame buffer 0, constant alpha 0xFF,
    # format ARGB8888, both blending factors PAxCA.
    channel_params:
      struct: LTDC_Layer_InitTypeDef
      applies_per: layer
      instances:
        1: { sdk_call: LTDC_LayerInit, handle: LTDC_Layer1, setting: "Layer 1", active_choices: [Enabled] }
        2: { sdk_call: LTDC_LayerInit, handle: LTDC_Layer2, setting: "Layer 2", active_choices: [Enabled] }
      params:
        - key: pixel_format
          name: Pixel format
          sdk_field: LTDC_PixelFormat
          type: enum
          default: ARGB8888
          options:
            - { name: ARGB8888, value: 0, sdk: LTDC_Pixelformat_ARGB8888 }
            - { name: RGB888,   value: 1, sdk: LTDC_Pixelformat_RGB888 }
            - { name: RGB565,   value: 2, sdk: LTDC_Pixelformat_RGB565 }
            - { name: ARGB1555, value: 3, sdk: LTDC_Pixelformat_ARGB1555 }
            - { name: ARGB4444, value: 4, sdk: LTDC_Pixelformat_ARGB4444 }
            - { name: L8,       value: 5, sdk: LTDC_Pixelformat_L8 }
            - { name: AL44,     value: 6, sdk: LTDC_Pixelformat_AL44 }
            - { name: AL88,     value: 7, sdk: LTDC_Pixelformat_AL88 }
          help: >
            LTDC_LxPFCR.PF[2:0] (RM 43.4.18) - the format of THIS LAYER's FRAME BUFFER IN
            MEMORY, which is a different axis from `Colour depth` above: the pixel format
            converter expands every one of these to ARGB8888 before the blender, so the
            format decides how much RAM a frame costs and frees NO pin. L8 is 8-bit
            indexed through the 256-entry CLUT; AL44 and AL88 are alpha+luminance.
        - key: h_start
          name: Window left edge
          sdk_field: LTDC_HorizontalStart
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_LxWHPCR.WHSTPOS, 0x000-0xFFF. Counted in pixel clocks from the end of the horizontal back porch, not from the panel edge - the SDK writes the value through unchanged."
        - key: h_stop
          name: Window right edge
          sdk_field: LTDC_HorizontalStop
          type: int
          default: 0
          min: 0
          max: 65535
          help: "LTDC_LxWHPCR.WHSPPOS. LTDC_LayerInit() shifts it left by 16 into the same register as the left edge (ch32h417_ltdc.c), so give it the POSITION, not a width."
        - key: v_start
          name: Window top edge
          sdk_field: LTDC_VerticalStart
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_LxWVPCR.WVSTPOS, 0x000-0xFFF, in lines from the end of the vertical back porch."
        - key: v_stop
          name: Window bottom edge
          sdk_field: LTDC_VerticalStop
          type: int
          default: 0
          min: 0
          max: 65535
          help: "LTDC_LxWVPCR.WVSPPOS, shifted left by 16 beside the top edge. A position, not a height."
        - key: alpha
          name: Constant alpha
          sdk_field: LTDC_ConstantAlpha
          type: int
          default: 255
          min: 0
          max: 255
          help: "LTDC_LxCACR.CONSTA. 255 is opaque and is LTDC_LayerStructInit()'s value. Used directly when the blending factors are CA, and multiplied by the pixel's own alpha when they are PAxCA."
        - key: bf1
          name: Blending factor 1
          sdk_field: LTDC_BlendingFactor_1
          type: enum
          default: Pixel alpha x constant alpha
          options:
            - { name: Constant alpha, value: 4, sdk: LTDC_BlendingFactor1_CA }
            - { name: Pixel alpha x constant alpha, value: 6, sdk: LTDC_BlendingFactor1_PAxCA }
          help: "LTDC_LxBFCR.BF1 (ch32h417_ltdc.h:211-212). How THIS layer is weighted in the blend. The `value:` figures are the macros' encodings in that field, 100b and 110b."
        - key: bf2
          name: Blending factor 2
          sdk_field: LTDC_BlendingFactor_2
          type: enum
          default: Pixel alpha x constant alpha
          options:
            - { name: Constant alpha, value: 5, sdk: LTDC_BlendingFactor2_CA }
            - { name: Pixel alpha x constant alpha, value: 7, sdk: LTDC_BlendingFactor2_PAxCA }
          help: "LTDC_LxBFCR.BF2 (ch32h417_ltdc.h:215-216). How what is UNDERNEATH is weighted. Both factors sit in one register and LTDC_LayerInit() ORs them together, which is why they are two rows and not one."
        - key: dc_red
          name: Default colour red
          sdk_field: LTDC_DefaultColorRed
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_LxDCCR.DCRED. What the layer shows OUTSIDE its window, where there is no frame-buffer pixel to fetch."
        - key: dc_green
          name: Default colour green
          sdk_field: LTDC_DefaultColorGreen
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_LxDCCR.DCGREEN."
        - key: dc_blue
          name: Default colour blue
          sdk_field: LTDC_DefaultColorBlue
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_LxDCCR.DCBLUE."
        - key: dc_alpha
          name: Default colour alpha
          sdk_field: LTDC_DefaultColorAlpha
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_LxDCCR.DCALPHA. 0 is the EVT drop's value and means the area outside the window is transparent, so the layer below shows through."
        - key: cfb_address
          name: Frame buffer address
          sdk_field: LTDC_CFBStartAdress
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: >
            LTDC_LxCFBAR.CFBADD, the address the layer scans out of. 0 is what the
            vendor's own LTDC_LayerStructInit() sets, and it means "not decided here":
            the buffer is usually a symbol in your program, so assign
            LTDC_Layerx->CFBAR in the USER CODE block - or give the address here if it
            is a fixed external SDRAM base.
        - key: cfb_line_length
          name: Frame buffer line length
          sdk_field: LTDC_CFBLineLength
          type: int
          default: 0
          min: 0
          max: 8191
          help: "LTDC_LxCFBLR.CFBLL, 0x0000-0x1FFF, in BYTES: window width in pixels x bytes per pixel, plus 3 for the fetch overhead. The SDK does not add the 3 for you."
        - key: cfb_pitch
          name: Frame buffer pitch
          sdk_field: LTDC_CFBPitch
          type: int
          default: 0
          min: 0
          max: 8191
          help: "LTDC_LxCFBLR.CFBP, in BYTES from one line of the buffer to the next. Equal to the line length for a tightly packed buffer, larger when the buffer is wider than the window. LTDC_LayerInit() shifts it left by 16 into the same register."
        - key: cfb_line_number
          name: Frame buffer lines
          sdk_field: LTDC_CFBLineNumber
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_LxCFBLNR.CFBLNBR, 0x000-0x7FF: how many lines the layer fetches per frame."
    notes: >
      Parallel RGB output, always 24 bits wide at the pad - the width you pick here is
      how many lines you WIRED, not a mode the silicon has (RM 43.4.5 gives the global
      control register no width field). A 16-bit panel takes the top five red, top six
      green and top five blue lines; an 18-bit panel the top six of each. Every line the
      chosen depth does not claim is released and can be assigned to another peripheral
      or used as GPIO - picking RGB565 hands back eight pins, RGB666 six.
      An "8-bit mode" is a different thing and does not free pins: L8, AL44 and AL88
      (RM 43.4.18) are eight-bit-per-pixel FRAME BUFFER formats, and the pixel format
      converter expands them to ARGB8888 before the output stage. Choosing one saves
      memory and changes no pin - and you CAN choose one, per layer, in the Layer 1 and
      Layer 2 blocks of Parameter Settings, so a buffer plan and a pin plan are made in
      the same place.
      TWO LAYERS, EACH WITH ITS OWN INIT. Switch a layer on with the `Layer 1` / `Layer 2`
      rows - they claim no pad, because a layer is a rectangle of memory composited onto
      the same RGB port the colour depth already wired - and its sixteen members are
      filled and applied by `LTDC_LayerInit(LTDC_Layerx, &s)`, once per layer that is on.
      The window edges are POSITIONS rather than sizes, counted from the end of the back
      porch, and the frame buffer's line length is in bytes with the RM's +3 fetch
      overhead included by you rather than by the SDK. The frame buffer ADDRESS defaults
      to 0, which is what the vendor's own `LTDC_LayerStructInit()` sets: the buffer is
      usually a symbol in your program, so assign `LTDC_Layerx->CFBAR` in the USER CODE
      block unless it is a fixed external SDRAM base you can type here.
  OPA:
    category: Analog
    settings:
      - name: "OPA1 positive input"
        choices:
          - { name: Disable }
          - { name: P0, signals: [P01] }
          - { name: P1, signals: [P11] }
      - name: "OPA1 negative input"
        choices:
          - { name: Disable }
          - { name: N0, signals: [N01] }
          - { name: N1, signals: [N11] }
      - name: "OPA1 output"
        choices:
          - { name: Disable }
          - { name: OUT0, signals: [OUT01] }
          - { name: OUT1, signals: [OUT11] }
      - name: "OPA2 positive input"
        choices:
          - { name: Disable }
          - { name: P0, signals: [P02] }
          - { name: P1, signals: [P12] }
      - name: "OPA2 negative input"
        choices:
          - { name: Disable }
          - { name: N0, signals: [N02] }
          - { name: N1, signals: [N12] }
      - name: "OPA2 output"
        choices:
          - { name: Disable }
          - { name: OUT0, signals: [OUT02] }
          - { name: OUT1, signals: [OUT12] }
      - name: "OPA3 positive input"
        choices:
          - { name: Disable }
          - { name: P0, signals: [P03] }
          - { name: P1, signals: [P13] }
      - name: "OPA3 negative input"
        choices:
          - { name: Disable }
          - { name: N0, signals: [N03] }
          - { name: N1, signals: [N13] }
      - name: "OPA3 output"
