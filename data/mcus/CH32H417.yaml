        depends_on: { setting: Mode, in: [Master Transmit, Master Receive] }
        help: "SPI_I2SPR MCKOE (ch32h417_spi.h:139). Not a separate row because the Mode row is what claims the MCK pad: the two master modes route it and the two slave modes do not, so a dropdown here could switch the driver off under a pad the project has claimed."
      - key: mclk_off
        name: Master clock output
        struct: I2S_InitTypeDef
        sdk_field: I2S_MCLKOutput
        const: I2S_MCLKOutput_Disable
        depends_on: { setting: Mode, in: [Slave Transmit, Slave Receive] }
        help: "SPI_I2SPR MCKOE (ch32h417_spi.h:140). A slave takes its clock from the other end, so MCK is not driven and the pad is not claimed."
      - key: standard
        name: Standard
        struct: I2S_InitTypeDef
        sdk_field: I2S_Standard
        type: enum
        default: Philips
        options:
          - { name: Philips      , value: 0, sdk: I2S_Standard_Phillips }
