      Its driver is a prebuilt libUHSIF.a (Evt/EXAM/UHSIF/UHSIF_SLAVE/Common) rather than
      SPL source, so UHSIF_GPIO_Init's body cannot be read and the per-mapping, per-width
      pad table is only in that folder's UHSIF Development Reference Manual PDF, which has
      no markdown conversion yet. Two consequences are recorded rather than guessed at:
      which pads each of the three data mappings and four clock mappings select, and how
      the 8/16/24/32-bit width narrows the 49-signal claim. Both are in TASKS.md.
