# -----------------------------------------------------------------------------
# GPIO capabilities.
#
# FOUR output speeds, and they are NAMED rather than given in MHz:
# `GPIOSpeed_TypeDef` in data/sources/H417/Evt/EXAM/SRC/Peripheral/inc/ch32h417_gpio.h
# lines 24-29 is { GPIO_Speed_Low = 0, GPIO_Speed_Medium, GPIO_Speed_High,
# GPIO_Speed_Very_High }. Low/Medium/High are the very names that were INVENTED for
# CH32V006 in round 3 and deleted in round 4 for not existing - and here they are
# real, on a different part. That is the whole argument for `gpio.speeds` being read
# from the data rather than assumed.
gpio:
  speeds:
    - { name: Low,       macro: GPIO_Speed_Low }
    - { name: Medium,    macro: GPIO_Speed_Medium }
    - { name: High,      macro: GPIO_Speed_High }
    - { name: Very high, macro: GPIO_Speed_Very_High }
  # All eight members of GPIOMode_TypeDef (ch32h417_gpio.h:32-41) are accounted for:
  # five here and three under input_modes. This part has open-drain in both forms.
  modes:
    - { name: Output Push Pull,              macro: GPIO_Mode_Out_PP, class: out }
    - { name: Output Open Drain,             macro: GPIO_Mode_Out_OD, class: out }
    - { name: Alternate Function Push Pull,  macro: GPIO_Mode_AF_PP,  class: out }
    - { name: Alternate Function Open Drain, macro: GPIO_Mode_AF_OD,  class: out }
    - { name: Analog,                        macro: GPIO_Mode_AIN,    class: analog }
  input_modes:
    - { name: No pull,   macro: GPIO_Mode_IN_FLOATING }
    - { name: Pull-up,   macro: GPIO_Mode_IPU }
    - { name: Pull-down, macro: GPIO_Mode_IPD }

# There is no `constraints:` block. The three shapes were checked against this part's
# sources and none has an instance in the twelve peripherals modelled here: no per-pin
# note on any GPIOMode member in ch32h417_gpio.h, no shorted pin groups on any of the
# three packages (the extractor reports "shorted groups none" for all three), and
# nothing that couples a peripheral's enable state to a pin's legality. The USB and
# SerDes pads are dedicated, not multiplexed GPIO, so they cannot be mis-configured.

# -----------------------------------------------------------------------------
codegen:
  # ch32h417.h, guard __CH32H417_H. Series `ch32h417`, which is also what the
  # PlatformIO board files say: genericCH32H417QEU6.json "spl_series": "ch32h417".
  header: ch32h417.h
  sdk:
    evt: H417
    series: ch32h417

  # The SDK does not spell the clock-refresh call the same way on every family, and
  # this part is the one that differs: System/ch32h417/{v3f,v5f}/system_ch32h417.h
  # declares `SystemAndCoreClockUpdate` - it refreshes BOTH cores - where every other
  # family here declares `SystemCoreClockUpdate`. The generated main.c reads this key,
  # so no part is named in app/engine/. Omitting it means the usual name.
  clock_update_fn: SystemAndCoreClockUpdate

  # printf over the WCH-Link SDI channel costs no pin and is what every other part's
  # generated main.c uses. **This part's Debug folder does not have it**: the whole of
  # framework-wch-noneos-sdk/Debug/ch32h417/debug.h is one printf entry point,
  # `USART_Printf_Init(uint32_t baudrate)`, which claims a USART and therefore two
  # pins. An empty value means "this part has no SDI printf", and the generator emits
  # a comment saying so instead of a call that would fail to link.
  sdi_printf_fn: ""

  # HB2, not PB2 and not APB2. This is the FOURTH spelling of the port clock enable in
  # four families - CH32V003 says APB2, CH32V005/V006 say PB2, CH32X035 says APB2, and
  # this part says HB2 (ch32h417_rcc.h:248-255, RCC_HB2PeriphClockCmd at :650).
  gpio_clock: { fn: RCC_HB2PeriphClockCmd, port: RCC_HB2Periph_GPIO$PORT, afio: RCC_HB2Periph_AFIO }

  speeds:
    Low:         GPIO_Speed_Low
    Medium:      GPIO_Speed_Medium
    High:        GPIO_Speed_High
    "Very high": GPIO_Speed_Very_High

  # THE THIRD REMAP STYLE. `register` writes an AFIO field per peripheral, `macro`
  # calls GPIO_PinRemapConfig per peripheral, and `af` calls GPIO_PinAFConfig per PIN.
  # `fields:` is deliberately absent and the validator rejects it alongside `style: af`:
  # this part's AFIO_PCFR1 still exists, but it carries only PD0_1_REMAP, UHSIF_CLK_RM,
  # the PIOC port map and four ADC trigger-SOURCE bits (TIM8 vs EXTI, not a pin), none
  # of which is peripheral pin muxing.
  remap:
    style: af
    fn: GPIO_PinAFConfig          # (GPIOx, GPIO_PinSource<n>, GPIO_AF<n>) - ch32h417_gpio.h:160
    macro: GPIO_AF$AF             # GPIO_AF0..GPIO_AF15 - ch32h417_gpio.h:129-145

  # RCC_CFGR0 - RM 3.4.2, offset 0x04, reset 0x00000000. Only the two fields the clock
  # tab below actually offers are encoded; the PLL, PPRE1/PPRE2 and the ADC muxes are
  # absent because the tree that would drive them is not modelled. The generator writes
  # what it is given and reports what it is not, so a missing field is a named TODO
  # rather than a wrong bit.
  rcc:
    register: "RCC->CFGR0"
    sw: { lsb: 0, bits: 2, values: { HSI: 0, HSE: 1, PLLCLK: 2 } }     # SW[1:0]; 11 is "not available"
    prescalers:
      # HPRE[3:0], and the run is NOT the CH32V00x one. Codes 0xxx all mean "no
      # prescaling", then 1000..1111 are /2, /4, /8, /16, /64, /128, /256, /512 -
      # **there is no /32**, the sequence jumps 16 to 64. Reading it as a doubling run
      # would put /32 on code 1100 and silently run the bus at half the asked-for speed.
      HB: { lsb: 4, bits: 4,
            values: { 1: 0, 2: 8, 4: 9, 8: 10, 16: 11, 64: 12, 128: 13, 256: 14, 512: 15 } }

  # Which SDK function applies each init struct, and what it applies it TO. The
  # generator refuses to derive a function name from a struct name, and I3C is why
  # that rule keeps earning its place here: `I3C_Ctrl_BusTypeDef` is applied by
  # `I3C_Ctrl_Init`, which takes the struct ALONE - there is no handle argument, the
  # same shape OPA_Init has on CH32V006. Every line below is from the EVT headers.
  init_structs:
    GPIO_InitTypeDef:        { fn: GPIO_Init }          # ch32h417_gpio.h:148
    USART_InitTypeDef:       { fn: USART_Init }         # ch32h417_usart.h:184
    SPI_InitTypeDef:         { fn: SPI_Init }           # ch32h417_spi.h:198
    I2C_InitTypeDef:         { fn: I2C_Init }           # ch32h417_i2c.h:302
    TIM_TimeBaseInitTypeDef: { fn: TIM_TimeBaseInit }   # ch32h417_tim.h:465
    I3C_Ctrl_BusTypeDef:     { fn: I3C_Ctrl_Init, no_handle: true }   # ch32h417_i3c.h:400

  periph_handle:
    USART1: USART1
    USART2: USART2
    USART3: USART3
    SPI1:   SPI1
    SPI2:   SPI2
    I2C1:   I2C1
    I2C2:   I2C2
    I3C:    I3C
    TIM1:   TIM1
    TIM2:   TIM2
    TIM3:   TIM3
    TIM4:   TIM4

  # Which enable register each peripheral's clock bit lives in. Bit numbers from
  # ch32h417_rcc.h:248-300 by taking log2 of each macro's value.
  periph_clock:
    HB2: { register: RCC_HB2PCENR, fn: RCC_HB2PeriphClockCmd, prefix: RCC_HB2Periph_,
           bits: { AFIO: 0, GPIOA: 2, GPIOB: 3, GPIOC: 4, GPIOD: 5, GPIOE: 6, GPIOF: 7,
                   TIM1: 11, SPI1: 12, USART1: 14, I3C: 31 } }
    HB1: { register: RCC_HB1PCENR, fn: RCC_HB1PeriphClockCmd, prefix: RCC_HB1Periph_,
           bits: { TIM2: 0, TIM3: 1, TIM4: 2, SPI2: 14, USART2: 17, USART3: 18,
                   I2C1: 21, I2C2: 22 } }
    notes: >
      Only the twelve peripherals this file models are listed. The part has a third
      domain, RCC_HBPeriphClockCmd, for the AHB masters (DMA, ETH, USB, LTDC, FMC and
      the rest), and it is absent here rather than half-filled because none of those
      peripherals is modelled yet.

# -----------------------------------------------------------------------------
# Clock tree. HSI and HSE are both 25 MHz on this part (ch32h417.h:23 and :29,
# HSE_VALUE and HSI_VALUE, both 25000000) - not the 24 MHz every CH32V00x uses.
# SYSCLK tops out at 400 MHz on the V5F core and 160 MHz on the V3F.
clock:
  sources:
    HSI: { mhz: 25, fixed: true }
    HSE: { mhz: 25, min_mhz: 4, max_mhz: 25 }
    LSI: { khz: 40, fixed: true }
    LSE: { khz: 32.768, fixed: true }
  sysclk:
    sources: [HSI, HSE, PLLCLK]
    max_mhz: 400
  prescalers:
    HB: { options: [1, 2, 4, 8, 16, 64, 128, 256, 512], max_mhz: 400,
          label: HB prescaler (HPRE) -> HCLK }
  # No hse_peripheral / hse_setting / hse_signals. Those three keys join the clock tab
  # to a PERIPHERAL setting that claims the crystal pins, and on this part XI and XO are
  # dedicated pads (DS Table 2-1-1, QFN128 pins 23 and 24) rather than GPIO that a
  # setting switches over. There is nothing for them to point at, and pointing them at
  # an RCC peripheral this file does not model would fail the validator's own check.
  notes: >
    The PLL, the bus prescalers and the per-domain clock tree are NOT modelled. RM ch.8
    gives this part several PLLs and a much deeper tree than any CH32V00x, and a
    partial `pll:` block would let the app compute and display a frequency that is
    wrong. Absent rather than approximated; see data/mcus/CH32H417.notes.md.
