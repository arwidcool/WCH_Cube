  notes: >
    MODELLED: the four oscillators; the SYS PLL (PLLSRC's six legal sources, the one shared
    1..64 divider, and all 32 PLLMUL factors from RM 3.4.3); the SYSCLK mux, now all four
    entries this file can compute (HSI, HSE, PLLCLK, and USBHS_PLL_CLK since 2026-09-14 -
    RM 3.4.3's other three, ETH_PLL/SERDES_PLL-div-2/USBSS_PLL, still cannot: see below);
    HPRE, FPRE, PPRE2 and the ADC prescaler; bus membership from the three clock-enable
    registers (RM 3.4.7-3.4.9); ALL FIVE PLLs (RM 3.3.4) - USBHS_PLL (2026-09-13), then
    ETH_PLL, USBSS_PLL and SERDES_PLL (2026-09-14); and, as of 2026-09-14, all EIGHT RM
    3.4.13 (RCC_CFGR2) peripheral clock muxes - USBFS (2026-09-13), then RNG, I2S2, I2S3,
    HSADC, UHSIF, LTDC and ETH1G.

    USBHS_PLL: fixed 480 MHz off HSI, RM:1733 and :1806-1811; its USBFS 48M tap proven
    against the RM's own worked example (:4048 USBFSSRC, :4055-4077 all sixteen USBFSDIV
    codes including the 7.5 a first draft omitted). Ships with ONE input (HSI) because
    `USBHSPLL_REFSEL[1:0]` (RM:4266-4274) makes 480 MHz conditional on the reference
    selection matching the real input, and only HSI's `fixed: true` 25 MHz makes REFSEL=00
    correct unconditionally - see the `plls.USBHS_PLL` comment for the three inputs left
    out and why each one specifically cannot be guaranteed.

    ETH_PLL (500 MHz), USBSS_PLL (125 MHz) and SERDES_PLL (multiplier, 16 codes) all ship
    with HSE as their ONLY input, for a reason WORSE than USBHS_PLL's REFSEL trap and
    stated plainly rather than smoothed over: HSE is NOT `fixed: true` on this part
    (`sources.HSE` is user-editable 4-25 MHz), so these three numbers hold ONLY WHILE HSE
    IS 25 MHz - a real, user-reachable misconfiguration this file cannot detect or refuse,
    unlike USBHS_PLL where the one input offered is unconditionally safe. Shipped this way
    on instruction (main, 2026-09-14), because the alternative (declining to model them)
    would also have kept ETH1G's own mux uncomputable, and every EVT example anchoring
    these numbers runs at HSE = 25 MHz, the value every one of this part's own reference
    designs uses. Each PLL's own comment states which parts of its citation are QUOTED RM
    text and which are INFERRED (an exhaustive register-absence read plus a clock-tree
    figure, not a sentence that says so directly, for ETH_PLL and SERDES_PLL specifically)
    - a citation that overstates its own certainty is how the next reader stops checking.

    The eight RM 3.4.13 muxes: RNG/I2S2/I2S3 (bare 2-way, SYSCLK/PLL_CLK, no divider
    field in the register at all) and HSADC (the same, four-way) needed nothing but the
    data once their PLLs existed. UHSIF is USBFS-shaped (bare 4-way mux + a plain /1..64
    `options:` divider). LTDC and ETH1G needed AGENT-2's mux-leg-divider mechanism (a
    `source:` list entry may be a name/source/div mapping instead of a bare string) - LTDC is
    ALSO a correction to an earlier two-choice description: RM:4082-4094 is a FOUR-way mux
    (PLL_CLK bare, SERDES_PLL/2 divided, ETH_PLL bare, USBHS_PLL bare), read directly
    rather than assumed from the survey that first flagged the divided leg. ETH1G's own
    two divided legs (ETH_PLL/4, SERDES_PLL/8) are anchored to real firmware, not just the
    RM: `eth_driver_RGMII.c:400-413` sets ETH1GSRC to ETH_PLL/4 for its own 125 MHz
    Gigabit link clock, which only works if ETH_PLL really is 500 MHz - the proof, from a
    shipped EVT, that the HSE-conditional number above is right for the silicon it ships
    on. Every leg-divider computation verified end to end, not just at its default:
    SERDES_PLL fed at its own default 25x multiplier (625 MHz off 25 MHz HSE) through
    BOTH divided legs at once (LTDC /2 = 312.5 MHz, ETH1G /8 = 78.125 MHz), same project.

    MCO (RM 3.3.5.5, eight sources) remains unmodelled - it is an RCC *setting* already
    present with all eight sources (`peripherals.RCC.settings`), not a `clock.prescalers`
    tap, and the register-field encoding to let codegen WRITE the chosen source is a
    separate, params/codegen-shaped gap (see the FINDING at `agents/BOARD.md`
    2026-09-14T02:10Z). Likewise, NO `codegen.rcc.extra` register encoding exists yet for
    ANY of RM 3.4.13's eight muxes or the four newly-modelled PLLs' own enable bits -
    `clock.plls`/`clock.prescalers` make the CLOCK TAB compute the right numbers (this
    file's stated acceptance bar, met the same way USBHS_PLL's was on 2026-09-13), but the
    generated C still names the gap out loud rather than writing nothing silently
    ("not written: ... Add a codegen.rcc.extra entry"). Landing that encoding is
    follow-on work, not blocked by anything above.

    A wrong clock number is worse than a missing one - round 5's rule. A computed 48 MHz
    that is really 24 reaches the generated C and the SDI banner as a stated fact, so a
    gap this file cannot close stays visible here and in TASKS.md rather than being filled
    with a guess - and where a number IS shipped despite a real precondition (the three
    HSE-only PLLs above), that precondition is named in the same breath as the number,
    not left for a reader to discover by disagreeing with the silicon.
