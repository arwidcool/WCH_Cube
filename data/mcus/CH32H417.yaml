        field: PL
        sdk_field: DMA_Priority
        default: Low
        options:
          - { name: Low,       value: 0, sdk: DMA_Priority_Low }
          - { name: Medium,    value: 1, sdk: DMA_Priority_Medium }
          - { name: High,      value: 2, sdk: DMA_Priority_High }
          - { name: Very high, value: 3, sdk: DMA_Priority_VeryHigh }
        help: "DMA_CFGRx PL[13:12] (RM:12970-12978). Ties broken by channel number, lowest wins (RM 10.1)."
      - key: mode
        name: Mode
        type: enum
        group: Basic
        field: CIRC
        sdk_field: DMA_Mode
        default: Normal
        options:
          - { name: Normal,   value: 0, sdk: DMA_Mode_Normal }
          - { name: Circular, value: 1, sdk: DMA_Mode_Circular }
        help: "DMA_CFGRx CIRC, bit 5 (RM:13011-13017). Circular is not available with memory-to-memory (RM 10.2, same rule as every other shipped part)."
      - key: pinc
        name: Increment peripheral address
        type: bool
        group: Basic
        field: PINC
        sdk_field: DMA_PeripheralInc
        default: false
        sdk_enabled: DMA_PeripheralInc_Enable
        sdk_disabled: DMA_PeripheralInc_Disable
        help: "DMA_CFGRx PINC, bit 6 (RM:13004-13010)."
      - key: minc
        name: Increment memory address
        type: bool
        group: Basic
        field: MINC
        sdk_field: DMA_MemoryInc
        default: true
        sdk_enabled: DMA_MemoryInc_Enable
        sdk_disabled: DMA_MemoryInc_Disable
        help: "DMA_CFGRx MINC, bit 7 (RM:12997-13003)."
      - key: psize
        name: Peripheral data width
        type: enum
        group: Basic
        field: PSIZE
        sdk_field: DMA_PeripheralDataSize
        default: Byte
        options:
          - { name: Byte,      value: 0, sdk: DMA_PeripheralDataSize_Byte }
          - { name: Half Word, value: 1, sdk: DMA_PeripheralDataSize_HalfWord }
          - { name: Word,      value: 2, sdk: DMA_PeripheralDataSize_Word }
          - { name: 256-bit,   value: 3, sdk: DMA_PeripheralDataSize_256 }
        help: "DMA_CFGRx PSIZE[9:8] (RM:12988-12996): 00 8-bit, 01 16-bit, 10 32-bit, 11 256-bit. The 4th option is new on this part (ch32h417_dma.h:85) - a genuine 256-bit/32-byte transfer, not a burst-count trick."
      - key: msize
        name: Memory data width
        type: enum
        group: Basic
        field: MSIZE
        sdk_field: DMA_MemoryDataSize
        default: Byte
        options:
          - { name: Byte,      value: 0, sdk: DMA_MemoryDataSize_Byte }
          - { name: Half Word, value: 1, sdk: DMA_MemoryDataSize_HalfWord }
          - { name: Word,      value: 2, sdk: DMA_MemoryDataSize_Word }
          - { name: 256-bit,   value: 3, sdk: DMA_MemoryDataSize_256 }
        help: "DMA_CFGRx MSIZE[11:10], same encoding as PSIZE (ch32h417_dma.h:91)."
      - key: m2m
        name: Memory to memory
        type: bool
        group: Advanced
        field: MEM2MEM
        sdk_field: DMA_M2M
        default: false
        sdk_enabled: DMA_M2M_Enable
        sdk_disabled: DMA_M2M_Disable
        help: "DMA_CFGRx MEM2MEM, bit 14 (RM:12963-12969). A hardware request must leave this off."
      - key: buffer_mode
        name: Double-buffer mode
        type: bool
        group: Advanced
        field: DOUBLE_MODE
        sdk_field: DMA_BufferMode
        default: false
        sdk_enabled: DMA_DoubleBufferMode
        sdk_disabled: DMA_SingleBufferMode
        help: "DMA_CFGRx DOUBLE_MODE, bit 15 (RM:12956-12962, new on this part). Enabling it auto-enters circular mode and switches between DMA_MADDRx/DMA_M1ADDRx after each cycle (RM 10.2.4). DMA_Memory1BaseAddr (the second pointer) is application-owned, same as DMA_Memory0BaseAddr - see codegen's own USER ACTION comment."
      - key: double_buffer_start
