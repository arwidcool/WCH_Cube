        type: enum
        group: Advanced
        field: FLAG_CUR_MEM
        sdk_field: DMA_DoubleBuffer_StartMemory
        default: Memory 0
        options:
          - { name: Memory 0, value: 0, sdk: DMA_DoubleBufferMode_Memory_0 }
          - { name: Memory 1, value: 1, sdk: DMA_DoubleBufferMode_Memory_1 }
        when: { param: buffer_mode, equals: true }
        help: "DMA_CFGRx FLAG_CUR_MEM, bit 16 (RM:12937-12955, new on this part). Which memory pointer the channel starts from; only meaningful with double-buffer mode on (DoubleBuffer_DMA/Common/hardware.c:119 sets DMA_DoubleBufferMode_Memory_0)."
