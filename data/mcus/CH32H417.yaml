# -----------------------------------------------------------------------------
# GPIO capabilities.
#
# FOUR output speeds, and they are NAMED rather than given in MHz:
# `GPIOSpeed_TypeDef` in data/sources/H417/Evt/EXAM/SRC/Peripheral/inc/ch32h417_gpio.h
# lines 24-29 is { GPIO_Speed_Low = 0, GPIO_Speed_Medium, GPIO_Speed_High,
# GPIO_Speed_Very_High }. Low/Medium/High are the very names that were INVENTED for
# CH32V006 in round 3 and deleted in round 4 for not existing - and here they are
# real, on a different part. That is the whole argument for `gpio.speeds` being read
# from the data rather than assumed.
  # =========================================================================
  #  Everything below this line was GENERATED by tools/gen_h417_peripherals.py
  #  and then reviewed. The pin data is mechanical: every `pin`/`af` pair comes
  #  from tools/extract_h417_pins.py, which parses DS Table 2-1-1, so none of it
  #  is transcribed by hand - 950 assignments cannot be hand-copied without an
  #  error, and a wrong AF code compiles and drives the wrong pin.
  #
  #  `settings:` are per peripheral TYPE, from the reference manual's functional
  #  description. `params:` are deliberately NOT generated: a parameter needs
  #  its init-struct field and its option macros checked against ch32h417_*.h,
  #  and inventing them would put names nobody compiled into data/.
  #
  #  Regenerate:  python tools/gen_h417_peripherals.py --splice
