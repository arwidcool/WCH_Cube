# -----------------------------------------------------------------------------
peripherals:

  # ---------------- System Core ----------------
  SYS:
    category: System Core
    # The debug pins are NOT AF-selected: DS Table 2-1-1 lists SWCLK on PB8 and
    # SWIO/SWDIO on PB9 with no (AFn) marker at all, because they are the reset-state
    # function of those pads rather than an alternate function. So these entries carry
    # a pin and no `af:`, and `codegen.skip_signals` (SYS by default) keeps the
    # generator away from them entirely - driving the debug interface or the reset pin
    # from GPIO_Init would be actively harmful.
    notes: >
      DS "Feature": "Support 1-wire (default) and 2-wire debugging modes". NRST is its
      own pad (DS Table 2-1-1, QFN128 pin 25) rather than a multiplexed GPIO, which is
      a change from every CH32V00x part in this repo - there is no RST_MODE option byte
      deciding whether a GPIO is the reset.
    settings:
      - name: Debug
        choices:
          - { name: No Debug }
          - { name: 1-wire SDI (SWIO), signals: [SWIO], default: true }
          - { name: 2-wire (SWIO + SWCLK), signals: [SWIO, SWCLK] }
    signal_pins:
      SWIO:  [{ pin: PB9, notes: "SWIO/SWDIO, DS Table 2-1-1 - no AF code: this is the pad's reset-state function" }]
      SWCLK: [{ pin: PB8, notes: "SWCLK, DS Table 2-1-1 - likewise" }]

  # ---------------- Connectivity ----------------
  USART1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
          - { name: Transmit only, signals: [TX] }
          - { name: Receive only, signals: [RX] }
          - { name: LIN, signals: [TX, RX] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS only, signals: [CTS] }
          - { name: RTS only, signals: [RTS] }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # DS Table 2-2-9. Each signal chooses independently - TX on PA9 with RX on PD12 is
    # legal, and so is every other combination of the four and four.
    signal_pins:
      CK: [{ pin: PD11, af: 14 }, { pin: PA8, af: 7 }]
      CTS: [{ pin: PD15, af: 14 }, { pin: PA11, af: 7 }]
      RTS: [{ pin: PD14, af: 14 }, { pin: PA12, af: 7 }]
      RX: [{ pin: PB15, af: 4 }, { pin: PD12, af: 14 }, { pin: PA10, af: 7 }, { pin: PB7, af: 7 }]
      TX: [{ pin: PB14, af: 4 }, { pin: PD13, af: 14 }, { pin: PA9, af: 7 }, { pin: PB6, af: 7 }]
    # THE WORD LENGTHS ARE NOT THE CH32V00x SET. ch32h417_usart.h:71-75 offers FIVE -
    # 5b, 6b, 7b, 8b and 9b - where every CH32V00x part in this repo has two.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 25000000
        unit: Bd
        help: "USART_BRR. Ceiling is fCK/16; this part's clock tree is not modelled yet, so the bound is the documented peripheral maximum rather than a computed one."
      - key: word
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: 8 bits
        options:
          - { name: 5 bits, value: 4, sdk: USART_WordLength_5b }
          - { name: 6 bits, value: 3, sdk: USART_WordLength_6b }
          - { name: 7 bits, value: 2, sdk: USART_WordLength_7b }
          - { name: 8 bits, value: 0, sdk: USART_WordLength_8b }
          - { name: 9 bits, value: 1, sdk: USART_WordLength_9b }
        help: "USART_CTLR1 M. Five lengths on this part; CH32V003/V005/V006 have only 8b and 9b."
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: "None"
        options:
          - { name: "None", value: 0, sdk: USART_Parity_No }
          - { name: Even  , value: 2, sdk: USART_Parity_Even }
          - { name: Odd   , value: 3, sdk: USART_Parity_Odd }
        help: "USART_CTLR1 PCE and PS. With parity on, the parity bit takes the last data bit."
      - key: stop
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "1"  , value: 0, sdk: USART_StopBits_1 }
          - { name: "0.5", value: 1, sdk: USART_StopBits_0_5 }
          - { name: "2"  , value: 2, sdk: USART_StopBits_2 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
        help: "USART_CTLR2 STOP[13:12], in register order: 00 = 1, 01 = 0.5, 10 = 2, 11 = 1.5."

  USART2:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
          - { name: Transmit only, signals: [TX] }
          - { name: Receive only, signals: [RX] }
          - { name: LIN, signals: [TX, RX] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS only, signals: [CTS] }
          - { name: RTS only, signals: [RTS] }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    signal_pins:
      CK: [{ pin: PA4, af: 7 }, { pin: PD7, af: 7 }]
      CTS: [{ pin: PA0, af: 7 }, { pin: PD3, af: 7 }]
      RTS: [{ pin: PA1, af: 7 }, { pin: PD4, af: 7 }]
      RX: [{ pin: PA3, af: 7 }, { pin: PD6, af: 7 }]
      TX: [{ pin: PA2, af: 7 }, { pin: PD5, af: 7 }]
    # THE WORD LENGTHS ARE NOT THE CH32V00x SET. ch32h417_usart.h:71-75 offers FIVE -
    # 5b, 6b, 7b, 8b and 9b - where every CH32V00x part in this repo has two.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 25000000
        unit: Bd
        help: "USART_BRR. Ceiling is fCK/16; this part's clock tree is not modelled yet, so the bound is the documented peripheral maximum rather than a computed one."
      - key: word
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: 8 bits
        options:
          - { name: 5 bits, value: 4, sdk: USART_WordLength_5b }
          - { name: 6 bits, value: 3, sdk: USART_WordLength_6b }
          - { name: 7 bits, value: 2, sdk: USART_WordLength_7b }
          - { name: 8 bits, value: 0, sdk: USART_WordLength_8b }
          - { name: 9 bits, value: 1, sdk: USART_WordLength_9b }
        help: "USART_CTLR1 M. Five lengths on this part; CH32V003/V005/V006 have only 8b and 9b."
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: "None"
        options:
          - { name: "None", value: 0, sdk: USART_Parity_No }
          - { name: Even  , value: 2, sdk: USART_Parity_Even }
          - { name: Odd   , value: 3, sdk: USART_Parity_Odd }
        help: "USART_CTLR1 PCE and PS. With parity on, the parity bit takes the last data bit."
      - key: stop
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "1"  , value: 0, sdk: USART_StopBits_1 }
          - { name: "0.5", value: 1, sdk: USART_StopBits_0_5 }
          - { name: "2"  , value: 2, sdk: USART_StopBits_2 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
        help: "USART_CTLR2 STOP[13:12], in register order: 00 = 1, 01 = 0.5, 10 = 2, 11 = 1.5."

  USART3:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
          - { name: Transmit only, signals: [TX] }
          - { name: Receive only, signals: [RX] }
          - { name: LIN, signals: [TX, RX] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS only, signals: [CTS] }
          - { name: RTS only, signals: [RTS] }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    signal_pins:
      CK: [{ pin: PB12, af: 7 }, { pin: PD10, af: 7 }, { pin: PA11, af: 4 }, { pin: PC12, af: 7 }]
      CTS: [{ pin: PB13, af: 7 }, { pin: PD11, af: 7 }, { pin: PA15, af: 4 }]
      RTS: [{ pin: PB14, af: 7 }, { pin: PD12, af: 7 }, { pin: PA12, af: 4 }]
      RX: [{ pin: PB11, af: 7 }, { pin: PD9, af: 7 }, { pin: PA14, af: 4 }, { pin: PC11, af: 7 }]
      TX: [{ pin: PB10, af: 7 }, { pin: PD8, af: 7 }, { pin: PA13, af: 4 }, { pin: PC10, af: 7 }]
    # THE WORD LENGTHS ARE NOT THE CH32V00x SET. ch32h417_usart.h:71-75 offers FIVE -
    # 5b, 6b, 7b, 8b and 9b - where every CH32V00x part in this repo has two.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 25000000
        unit: Bd
        help: "USART_BRR. Ceiling is fCK/16; this part's clock tree is not modelled yet, so the bound is the documented peripheral maximum rather than a computed one."
      - key: word
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: 8 bits
        options:
          - { name: 5 bits, value: 4, sdk: USART_WordLength_5b }
          - { name: 6 bits, value: 3, sdk: USART_WordLength_6b }
          - { name: 7 bits, value: 2, sdk: USART_WordLength_7b }
          - { name: 8 bits, value: 0, sdk: USART_WordLength_8b }
          - { name: 9 bits, value: 1, sdk: USART_WordLength_9b }
        help: "USART_CTLR1 M. Five lengths on this part; CH32V003/V005/V006 have only 8b and 9b."
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: "None"
        options:
          - { name: "None", value: 0, sdk: USART_Parity_No }
          - { name: Even  , value: 2, sdk: USART_Parity_Even }
          - { name: Odd   , value: 3, sdk: USART_Parity_Odd }
        help: "USART_CTLR1 PCE and PS. With parity on, the parity bit takes the last data bit."
      - key: stop
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "1"  , value: 0, sdk: USART_StopBits_1 }
          - { name: "0.5", value: 1, sdk: USART_StopBits_0_5 }
          - { name: "2"  , value: 2, sdk: USART_StopBits_2 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
        help: "USART_CTLR2 STOP[13:12], in register order: 00 = 1, 01 = 0.5, 10 = 2, 11 = 1.5."

  SPI1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Full-Duplex Master, signals: [SCK, MISO, MOSI] }
          - { name: Full-Duplex Slave, signals: [SCK, MISO, MOSI] }
          - { name: Half-Duplex Master, signals: [SCK, MOSI] }
          - { name: Half-Duplex Slave, signals: [SCK, MISO] }
          - { name: Receive Only Master, signals: [SCK, MISO] }
          - { name: Transmit Only Master, signals: [SCK, MOSI] }
      - name: Hardware NSS Signal
        choices:
          - { name: Disable (software NSS) }
          - { name: Hardware NSS Input, signals: [NSS] }
          - { name: Hardware NSS Output, signals: [NSS] }
    # DS Table 2-2-8. Note PF6/PF7 carry SPI1_NSS/SCK at AF3 while PA4/PA5 carry the
    # same two at AF5 - the AF code is a property of the PIN, not of the peripheral,
    # which is the fact `remaps:` has no way to hold.
    signal_pins:
      MISO: [{ pin: PF9, af: 3 }, { pin: PA6, af: 5 }, { pin: PF3, af: 5 }, { pin: PB4, af: 5 }]
      MOSI: [{ pin: PF8, af: 3 }, { pin: PA7, af: 5 }, { pin: PD7, af: 5 }, { pin: PB5, af: 5 }]
      NSS: [{ pin: PF6, af: 3 }, { pin: PA4, af: 5 }, { pin: PA15, af: 5 }, { pin: PF4, af: 5 }]
      SCK: [{ pin: PF7, af: 3 }, { pin: PA5, af: 5 }, { pin: PF5, af: 5 }, { pin: PB3, af: 5 }]
    # THE PRESCALER MACROS ARE NOT THE CH32V00x SET EITHER. ch32h417_spi.h:106-113
    # names them SPI_BaudRatePrescaler_Mode0..Mode7, not _2 / _4 / ... / _256. Which
    # divider each Mode selects depends on the SPI clock tree, which is not modelled
    # here, so the options carry the header's own names rather than a division this
    # file cannot yet prove. Copying CH32V006's list would fail verify_sdk_names.py.
    params:
      - key: prescaler
        name: Baud rate prescaler
        struct: SPI_InitTypeDef
        sdk_field: SPI_BaudRatePrescaler
        type: enum
        default: Mode 3
        options:
          - { name: Mode 0, value: 0, sdk: SPI_BaudRatePrescaler_Mode0 }
          - { name: Mode 1, value: 1, sdk: SPI_BaudRatePrescaler_Mode1 }
          - { name: Mode 2, value: 2, sdk: SPI_BaudRatePrescaler_Mode2 }
          - { name: Mode 3, value: 3, sdk: SPI_BaudRatePrescaler_Mode3 }
          - { name: Mode 4, value: 4, sdk: SPI_BaudRatePrescaler_Mode4 }
          - { name: Mode 5, value: 5, sdk: SPI_BaudRatePrescaler_Mode5 }
          - { name: Mode 6, value: 6, sdk: SPI_BaudRatePrescaler_Mode6 }
          - { name: Mode 7, value: 7, sdk: SPI_BaudRatePrescaler_Mode7 }
        help: "SPI_CTLR1 BR[5:3], codes 000..111. The header names these Mode0..Mode7 rather than by divider."
      - key: cpol
        name: Clock polarity (CPOL)
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPOL
        type: enum
        default: Low
        options:
          - { name: Low , value: 0, sdk: SPI_CPOL_Low }
          - { name: High, value: 1, sdk: SPI_CPOL_High }
        help: SPI_CTLR1 CPOL, bit 1.
      - key: cpha
        name: Clock phase (CPHA)
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPHA
        type: enum
        default: 1 Edge
        options:
          - { name: 1 Edge, value: 0, sdk: SPI_CPHA_1Edge }
          - { name: 2 Edge, value: 1, sdk: SPI_CPHA_2Edge }
        help: SPI_CTLR1 CPHA, bit 0.
      - key: datasize
        name: Data size
        struct: SPI_InitTypeDef
        sdk_field: SPI_DataSize
        type: enum
        default: 8 bits
        options:
          - { name: 8 bits , value: 0, sdk: SPI_DataSize_8b }
          - { name: 16 bits, value: 1, sdk: SPI_DataSize_16b }
        help: SPI_CTLR1 DFF, bit 11.
      - key: firstbit
        name: First bit
        struct: SPI_InitTypeDef
        sdk_field: SPI_FirstBit
        type: enum
        default: MSB First
        options:
          - { name: MSB First, value: 0, sdk: SPI_FirstBit_MSB }
          - { name: LSB First, value: 1, sdk: SPI_FirstBit_LSB }
        help: SPI_CTLR1 LSBFIRST, bit 7.

  SPI2:
    category: Connectivity
    notes: SPI2 shares its pads with I2S2; only the SPI half is modelled here (see the notes file).
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Full-Duplex Master, signals: [SCK, MISO, MOSI] }
          - { name: Full-Duplex Slave, signals: [SCK, MISO, MOSI] }
          - { name: Half-Duplex Master, signals: [SCK, MOSI] }
          - { name: Half-Duplex Slave, signals: [SCK, MISO] }
          - { name: Receive Only Master, signals: [SCK, MISO] }
