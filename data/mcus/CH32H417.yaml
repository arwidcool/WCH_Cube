  I3C:
    category: Connectivity
    notes: DS Table 2-2-7. Four pin choices per line, spread across ports C, D, E and F.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: I3C, signals: [SCL, SDA] }
    signal_pins:
      SCL: [{ pin: PF6, af: 5 }, { pin: PC4, af: 7 }, { pin: PE14, af: 3 }, { pin: PD9, af: 5 }]
      SDA: [{ pin: PF7, af: 5 }, { pin: PC5, af: 7 }, { pin: PE15, af: 3 }, { pin: PD10, af: 5 }]
    # I3C has NO single *_InitTypeDef the way USART and SPI do: ch32h417_i3c.h defines
    # seven structs (I3C_Ctrl_BusTypeDef, I3C_CtrlConfTypeDef, I3C_TgtConfTypeDef and
    # four more) split across controller, target and FIFO roles. The two bus-timing
    # members that are a configuration choice are modelled here against
    # I3C_Ctrl_BusTypeDef; the rest is protocol-stack state rather than pinout
    # configuration and is declared absent in the notes rather than half-filled.
    params:
      - key: sda_hold
        name: SDA hold time
        struct: I3C_Ctrl_BusTypeDef
        sdk_field: SDAHoldTime
        type: enum
        default: 0.5 cycle
        options:
          - { name: 0.5 cycle, value: 0, sdk: I3C_SDAHoldTime_0_5 }
          - { name: 1.5 cycle, value: 1, sdk: I3C_SDAHoldTime_1_5 }
        help: "ch32h417_i3c.h:246-247. How long SDA is held after the SCL falling edge."
      - key: wait_time
        name: Wait time before start
        struct: I3C_Ctrl_BusTypeDef
        sdk_field: WaitTime
        type: enum
        default: State 0
        options:
          - { name: State 0, value: 0, sdk: I3C_WaitTime_State_0 }
          - { name: State 1, value: 1, sdk: I3C_WaitTime_State_1 }
          - { name: State 2, value: 2, sdk: I3C_WaitTime_State_2 }
          - { name: State 3, value: 3, sdk: I3C_WaitTime_State_3 }
        help: "ch32h417_i3c.h:250-253. How long a controller waits before issuing a start."

  # ---------------- Timers ----------------
  TIM1:
    category: Timers
    notes: Advanced-control timer - 4 channels, 3 complementary outputs and TWO break inputs (DS Table 2-2-4).
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH1] }
          - { name: PWM Generation CH1, signals: [CH1] }
          - { name: PWM Generation CH1 CH1N, signals: [CH1, CH1N] }
          - { name: PWM Generation CH1N only, signals: [CH1N] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
          - { name: PWM Generation CH2 CH2N, signals: [CH2, CH2N] }
          - { name: PWM Generation CH2N only, signals: [CH2N] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
          - { name: PWM Generation CH3 CH3N, signals: [CH3, CH3N] }
          - { name: PWM Generation CH3N only, signals: [CH3N] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR (external), signals: [ETR] }
      # TWO break inputs, which no CH32V00x part in this repo has. Offered as one
      # setting with four states rather than two settings, because they are one feature.
      - name: Break Input
        choices:
          - { name: Disable }
          - { name: BKIN, signals: [BKIN] }
          - { name: BKIN2, signals: [BKIN2] }
          - { name: BKIN + BKIN2, signals: [BKIN, BKIN2] }
    signal_pins:
