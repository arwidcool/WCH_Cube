  # --- supplies, clocks and straps. Every number below is CH32H417DS0.md 1.4.3, which
  # gives each rail its own sentence; the ORDERING between them is a constraint the DS
  # states once at the end of the section (VDD33 >= VDD33A >= VDDIO >= VIO18), so it is
  # repeated on the rails it constrains rather than left to a table nobody reads.
  SSRXA: { type: sys, notes: "SerDes PHY receive, negative leg. Optional - leave unconnected when the SerDes block is unused." }
  SSRXB: { type: sys, notes: "SerDes PHY receive, positive leg. Optional - leave unconnected when the SerDes block is unused." }
  SSTXA: { type: sys, notes: "SerDes PHY transmit, negative leg. Optional - leave unconnected when the SerDes block is unused." }
  SSTXB: { type: sys, notes: "SerDes PHY transmit, positive leg. Optional - leave unconnected when the SerDes block is unused." }
  VBAT: { type: power, notes: "Optional backup supply 1.8-3.6 V. When VDD33 and VDD33A are off, an internal power switch runs the RTC and the external 32 kHz oscillator from here. VBAT is not constrained by the VDD33 >= VDD33A >= VDDIO order - it is a different domain, switched in only when the others are gone. (CH32H417DS0.md 1.4.3)" }
  VDD12A: { type: power, notes: "1.17-1.27 V for the USB 3.0 module and the TH PHY. Normally GENERATED by the internal LDO from VDD33 and output here, so it is a decoupling node: 0.1 uF + 2.2 uF. Feed it from an external DC-DC instead if the LDO's heat matters - then the external voltage must sit slightly ABOVE the LDO's output, and the LDO must be off. (CH32H417DS0.md 1.4.3)" }
  VDD33: { type: power, notes: "Main supply 2.4-3.6 V. Powers some I/O pins, the system LDO and the built-in USB2.0 and Ethernet PHYs. Use 3.15-3.45 V when USB2.0 or Ethernet is used, and not below 2.7 V in Stop mode or while VIO18 is being switched from low to high. Decouple 0.1 uF per pin plus 10 uF at the main pin. Highest rail: VDD33 >= VDD33A >= VDDIO >= VIO18. (CH32H417DS0.md 1.4.3)" }
  VDD33A: { type: power, notes: "Analog supply 1.8-3.6 V for the ADC, temperature sensor, HSADC, OPA, CMP, DAC and PLL. At least 3.0 V for HSADC and 2.4 V for the ADC and DAC. Match it to VDDIO when the OPA or DAC is used; otherwise it may be higher. Must not exceed VDD33. (CH32H417DS0.md 1.4.3)" }
  VDDIO: { type: power, notes: "I/O supply 1.65-3.6 V - sets the output high level of the regular I/O pins, and feeds the I/O LDO that produces VIO18. Must not exceed VDD33 or VDD33A. When VIO18 rises from low to high, VDDIO's capacitance must be much larger than VIO18's, or VIO18's inrush pulls VDDIO down: 0.1 uF per pin plus 10 uF at the main pin. (CH32H417DS0.md 1.4.3)" }
  VDDK: { type: power, notes: "1.17-1.27 V core supply. Normally GENERATED by the internal LDO from VDD33 and output here, so it is a decoupling node: 0.1 uF per pin plus 2.2 uF at the main pin. May be fed externally instead, at a voltage slightly above the LDO's output, to move the LDO's heat off the chip. (CH32H417DS0.md 1.4.3)" }
  VIO18: { type: power, notes: "1.1-3.6 V supply for the high-speed I/O pins. Normally GENERATED by the I/O LDO from VDDIO and set by software to 1.2, 1.8, 2.5 or 3.3 V - or switched off. The level after power-up is chosen by the pull-down resistor on the XO pin (Table 3-2); when low-voltage I/O is not needed, short this pin to VDDIO. 0.1 uF per pin plus 2.2 uF at the main pin. (CH32H417DS0.md 1.4.3)" }
  VREFP: { type: power, notes: "Reference input 2.4-3.6 V for the ADC, HSADC and DAC. Must not exceed VDD33A. Decouple 0.1 uF. There is no internal reference pad: with VREFP tied to VDD33A the conversions are ratiometric to the analog supply. (CH32H417DS0.md 1.4.3)" }
  VSS: { type: ground, notes: "Digital ground. One decoupling capacitor per supply pin, placed at the pin." }
  VSSA: { type: ground, notes: "Analog ground, the return for VDD33A and VREFP. Star it to VSS at the pin rather than along the digital ground path." }
  XI: { type: sys, notes: "HSE crystal input, or the clock input when the HSE source is BYPASS. A dedicated pad, not a GPIO on any package. (CH32H417DS0.md 1.4.3; RCC's High Speed Clock (HSE) setting)" }
  XO: { type: sys, notes: "HSE crystal output, or the clock input when the HSE source is BYPASS. A dedicated pad, not a GPIO. Its external pull-down at power-up also selects VIO18's default voltage (Table 3-2). (CH32H417DS0.md 1.4.3)" }


# -----------------------------------------------------------------------------
peripherals:

  # ---------------- System Core ----------------
  SYS:
    category: System Core
    # The debug pins are NOT AF-selected: DS Table 2-1-1 lists SWCLK on PB8 and
    # SWIO/SWDIO on PB9 with no (AFn) marker at all, because they are the reset-state
    # function of those pads rather than an alternate function. So these entries carry
    # a pin and no `af:`, and `codegen.skip_signals` (SYS by default) keeps the
    # generator away from them entirely - driving the debug interface or the reset pin
    # from GPIO_Init would be actively harmful.
    notes: >
      DS "Feature": "Support 1-wire (default) and 2-wire debugging modes". NRST is its
      own pad (DS Table 2-1-1, QFN128 pin 25) rather than a multiplexed GPIO, which is
      a change from every CH32V00x part in this repo - there is no RST_MODE option byte
      deciding whether a GPIO is the reset.
    settings:
      - name: Debug
        choices:
          - { name: No Debug }
          - { name: 1-wire SDI (SWIO), signals: [SWIO], default: true }
          - { name: 2-wire (SWIO + SWCLK), signals: [SWIO, SWCLK] }
    signal_pins:
      SWIO:  [{ pin: PB9, notes: "SWIO/SWDIO, DS Table 2-1-1 - no AF code: this is the pad's reset-state function" }]
      SWCLK: [{ pin: PB8, notes: "SWCLK, DS Table 2-1-1 - likewise" }]

  # ---------------- Connectivity ----------------
  USART1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
          - { name: Transmit only, signals: [TX] }
          - { name: Receive only, signals: [RX] }
          - { name: LIN, signals: [TX, RX] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS only, signals: [CTS] }
          - { name: RTS only, signals: [RTS] }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # DS Table 2-2-9. Each signal chooses independently - TX on PA9 with RX on PD12 is
    # legal, and so is every other combination of the four and four.
    signal_pins:
      CK: [{ pin: PD11, af: 14 }, { pin: PA8, af: 7 }]
      CTS: [{ pin: PD15, af: 14 }, { pin: PA11, af: 7 }]
      RTS: [{ pin: PD14, af: 14 }, { pin: PA12, af: 7 }]
      RX: [{ pin: PB15, af: 4 }, { pin: PD12, af: 14 }, { pin: PA10, af: 7 }, { pin: PB7, af: 7 }]
      TX: [{ pin: PB14, af: 4 }, { pin: PD13, af: 14 }, { pin: PA9, af: 7 }, { pin: PB6, af: 7 }]
    # THE WORD LENGTHS ARE NOT THE CH32V00x SET. ch32h417_usart.h:71-75 offers FIVE -
    # 5b, 6b, 7b, 8b and 9b - where every CH32V00x part in this repo has two.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 25000000
        unit: Bd
        help: "USART_BRR. Ceiling is fCK/16; this part's clock tree is not modelled yet, so the bound is the documented peripheral maximum rather than a computed one."
      - key: word
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: 8 bits
        options:
          - { name: 5 bits, value: 4, sdk: USART_WordLength_5b }
          - { name: 6 bits, value: 3, sdk: USART_WordLength_6b }
          - { name: 7 bits, value: 2, sdk: USART_WordLength_7b }
          - { name: 8 bits, value: 0, sdk: USART_WordLength_8b }
          - { name: 9 bits, value: 1, sdk: USART_WordLength_9b }
        help: "USART_CTLR1 M. Five lengths on this part; CH32V003/V005/V006 have only 8b and 9b."
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: "None"
        options:
          - { name: "None", value: 0, sdk: USART_Parity_No }
          - { name: Even  , value: 2, sdk: USART_Parity_Even }
          - { name: Odd   , value: 3, sdk: USART_Parity_Odd }
        help: "USART_CTLR1 PCE and PS. With parity on, the parity bit takes the last data bit."
      - key: stop
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "1"  , value: 0, sdk: USART_StopBits_1 }
          - { name: "0.5", value: 1, sdk: USART_StopBits_0_5 }
          - { name: "2"  , value: 2, sdk: USART_StopBits_2 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
        help: "USART_CTLR2 STOP[13:12], in register order: 00 = 1, 01 = 0.5, 10 = 2, 11 = 1.5."

  USART2:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
          - { name: Transmit only, signals: [TX] }
          - { name: Receive only, signals: [RX] }
          - { name: LIN, signals: [TX, RX] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS only, signals: [CTS] }
          - { name: RTS only, signals: [RTS] }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    signal_pins:
      CK: [{ pin: PA4, af: 7 }, { pin: PD7, af: 7 }]
      CTS: [{ pin: PA0, af: 7 }, { pin: PD3, af: 7 }]
      RTS: [{ pin: PA1, af: 7 }, { pin: PD4, af: 7 }]
      RX: [{ pin: PA3, af: 7 }, { pin: PD6, af: 7 }]
      TX: [{ pin: PA2, af: 7 }, { pin: PD5, af: 7 }]
    # THE WORD LENGTHS ARE NOT THE CH32V00x SET. ch32h417_usart.h:71-75 offers FIVE -
    # 5b, 6b, 7b, 8b and 9b - where every CH32V00x part in this repo has two.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 25000000
        unit: Bd
        help: "USART_BRR. Ceiling is fCK/16; this part's clock tree is not modelled yet, so the bound is the documented peripheral maximum rather than a computed one."
      - key: word
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: 8 bits
        options:
          - { name: 5 bits, value: 4, sdk: USART_WordLength_5b }
          - { name: 6 bits, value: 3, sdk: USART_WordLength_6b }
          - { name: 7 bits, value: 2, sdk: USART_WordLength_7b }
          - { name: 8 bits, value: 0, sdk: USART_WordLength_8b }
          - { name: 9 bits, value: 1, sdk: USART_WordLength_9b }
        help: "USART_CTLR1 M. Five lengths on this part; CH32V003/V005/V006 have only 8b and 9b."
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: "None"
        options:
          - { name: "None", value: 0, sdk: USART_Parity_No }
          - { name: Even  , value: 2, sdk: USART_Parity_Even }
          - { name: Odd   , value: 3, sdk: USART_Parity_Odd }
        help: "USART_CTLR1 PCE and PS. With parity on, the parity bit takes the last data bit."
      - key: stop
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "1"  , value: 0, sdk: USART_StopBits_1 }
          - { name: "0.5", value: 1, sdk: USART_StopBits_0_5 }
          - { name: "2"  , value: 2, sdk: USART_StopBits_2 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
        help: "USART_CTLR2 STOP[13:12], in register order: 00 = 1, 01 = 0.5, 10 = 2, 11 = 1.5."

