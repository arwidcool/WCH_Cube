      # THE TIMING STRUCT, applied per pointer member - one call, up to two blocks. Every
      # row's DEFAULT is the maximum value the header's own range allows (the slowest,
      # safest timing an unknown memory can be driven at) - not a guess at a real
      # memory's numbers, which only that memory's own datasheet has. Narrow every one
      # of these once the attached device is known; the header's own worked constants
      # (CH32H417 EVT ships none for FMC - unlike SDIO/SDMMC, no EXAM/FMC folder exists
      # to check a value against) do not exist to check against here.
      - key: rw_addrset
        name: "Address setup time (read/write)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: rw
        sdk_field: FMC_AddressSetupTime
        type: int
        default: 15
        min: 0
        max: 15
        help: "ch32h417_fmc.h:25-28, R32_FMC_BTRx ADDSET[3:0] (Table 40-18, CH32H417RM.md:57094-57112). Not used with synchronous NOR."
      - key: wr_addrset
        name: "Address setup time (write, extended mode)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: wr
        sdk_field: FMC_AddressSetupTime
        type: int
        default: 15
        min: 0
        max: 15
        when: { "Extended Mode": Enable }
        help: "Same field, the write-only timing set that applies when Extended mode is enabled (ch32h417_fmc.h:115)."
