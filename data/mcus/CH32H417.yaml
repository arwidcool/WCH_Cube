      CLK: [{ pin: PC0 }, { pin: PF14 }, { pin: PD9 }, { pin: PF11 }]
      # PORT0-7: UHSIF_PORT_RM[1:0] moves all eight together (CH32H417RM.md:11770-
      # 11801, same register as SDMMC_RM) - `signal_groups:` below says so. Three
      # slots each, index 0/1/2 = RM 00/01/1x, same order for every member (checked:
      # `validate_mcu.py` now verifies this). RM=00 and RM=01 give PORT0/1/2 the SAME
      # pin (PF12/PF13/PE7) - a real, repeated hardware fact, not dead data: only
      # RM=1x moves them (to PC1/PC2/PC3).
