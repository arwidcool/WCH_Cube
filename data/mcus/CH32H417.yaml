      A17: [{ pin: PD12, af: 12 }]
      A18: [{ pin: PD13, af: 12 }]
      A19: [{ pin: PE3, af: 12 }, { pin: PB10, af: 6 }]
      A2: [{ pin: PB4, af: 12 }, { pin: PE13, af: 15 }]
      A20: [{ pin: PE4, af: 12 }, { pin: PB11, af: 2 }]
      A21: [{ pin: PE5, af: 12 }, { pin: PB12, af: 3 }]
      A22: [{ pin: PE6, af: 12 }, { pin: PB13, af: 15 }]
      A23: [{ pin: PE2, af: 12 }, { pin: PB14, af: 0 }]
      A24: [{ pin: PE1, af: 12 }]
