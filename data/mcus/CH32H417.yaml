      - name: Master clock output
        choices:
          - { name: Disable }
          - { name: MCK, signals: [MCK] }
    signal_pins:
      MCK: [{ pin: PC6, af: 5 }]
      MISO: [{ pin: PC2, af: 5 }, { pin: PB14, af: 5 }]
      MOSI: [{ pin: PC1, af: 5 }, { pin: PC3, af: 5 }, { pin: PB15, af: 5 }]
      NSS: [{ pin: PB12, af: 5 }, { pin: PA11, af: 5 }, { pin: PB4, af: 7 }, { pin: PB9, af: 5 }]
      SCK: [{ pin: PB10, af: 5 }, { pin: PB13, af: 5 }, { pin: PA9, af: 5 }, { pin: PA12, af: 5 }, { pin: PD3, af: 5 }]
    # THE PRESCALER MACROS ARE NOT THE CH32V00x SET EITHER. ch32h417_spi.h:106-113
    # names them SPI_BaudRatePrescaler_Mode0..Mode7, not _2 / _4 / ... / _256. Which
    # divider each Mode selects depends on the SPI clock tree, which is not modelled
    # here, so the options carry the header's own names rather than a division this
    # file cannot yet prove. Copying CH32V006's list would fail verify_sdk_names.py.
    params:
      - key: prescaler
        name: Baud rate prescaler
        struct: SPI_InitTypeDef
        sdk_field: SPI_BaudRatePrescaler
        type: enum
        default: Mode 3
        options:
          - { name: Mode 0, value: 0, sdk: SPI_BaudRatePrescaler_Mode0 }
          - { name: Mode 1, value: 1, sdk: SPI_BaudRatePrescaler_Mode1 }
          - { name: Mode 2, value: 2, sdk: SPI_BaudRatePrescaler_Mode2 }
          - { name: Mode 3, value: 3, sdk: SPI_BaudRatePrescaler_Mode3 }
          - { name: Mode 4, value: 4, sdk: SPI_BaudRatePrescaler_Mode4 }
          - { name: Mode 5, value: 5, sdk: SPI_BaudRatePrescaler_Mode5 }
          - { name: Mode 6, value: 6, sdk: SPI_BaudRatePrescaler_Mode6 }
          - { name: Mode 7, value: 7, sdk: SPI_BaudRatePrescaler_Mode7 }
        help: "SPI_CTLR1 BR[5:3], codes 000..111. The header names these Mode0..Mode7 rather than by divider."
      - key: cpol
        name: Clock polarity (CPOL)
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPOL
        type: enum
        default: Low
        options:
          - { name: Low , value: 0, sdk: SPI_CPOL_Low }
          - { name: High, value: 1, sdk: SPI_CPOL_High }
        help: SPI_CTLR1 CPOL, bit 1.
      - key: cpha
        name: Clock phase (CPHA)
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPHA
        type: enum
        default: 1 Edge
        options:
          - { name: 1 Edge, value: 0, sdk: SPI_CPHA_1Edge }
          - { name: 2 Edge, value: 1, sdk: SPI_CPHA_2Edge }
        help: SPI_CTLR1 CPHA, bit 0.
      - key: datasize
        name: Data size
        struct: SPI_InitTypeDef
        sdk_field: SPI_DataSize
        type: enum
        default: 8 bits
        options:
          - { name: 8 bits , value: 0, sdk: SPI_DataSize_8b }
          - { name: 16 bits, value: 1, sdk: SPI_DataSize_16b }
        help: SPI_CTLR1 DFF, bit 11.
      - key: firstbit
        name: First bit
        struct: SPI_InitTypeDef
        sdk_field: SPI_FirstBit
        type: enum
        default: MSB First
        options:
          - { name: MSB First, value: 0, sdk: SPI_FirstBit_MSB }
          - { name: LSB First, value: 1, sdk: SPI_FirstBit_LSB }
        help: SPI_CTLR1 LSBFIRST, bit 7.

  I2C1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: I2C, signals: [SCL, SDA] }
          - { name: SMBus, signals: [SCL, SDA, SMBA] }
    signal_pins:
      SCL: [{ pin: PB6, af: 4 }, { pin: PB8, af: 4 }]
      SDA: [{ pin: PB7, af: 4 }, { pin: PB9, af: 4 }]
      SMBA: [{ pin: PB5, af: 4 }]
    params:
      - key: speed
        name: Clock speed
        struct: I2C_InitTypeDef
        sdk_field: I2C_ClockSpeed
        type: int
        default: 100000
        min: 1000
        max: 1000000
        unit: Hz
        help: "I2C_CKCFGR CCR together with F/S. Above 100 kHz the peripheral must be in fast mode."
      - key: duty
        name: Fast-mode duty cycle
        struct: I2C_InitTypeDef
        sdk_field: I2C_DutyCycle
        type: enum
        default: "2:1"
        options:
          - { name: "2:1" , value: 0, sdk: I2C_DutyCycle_2 }
          - { name: "16:9", value: 1, sdk: I2C_DutyCycle_16_9 }
        help: "I2C_CKCFGR DUTY, bit 14. Ignored below 100 kHz, where the peripheral runs in standard mode."
      - key: addrmode
        name: Addressing mode
        struct: I2C_InitTypeDef
        sdk_field: I2C_AcknowledgedAddress
        type: enum
        default: 7-bit
        options:
          - { name: 7-bit , value: 0, sdk: I2C_AcknowledgedAddress_7bit }
          - { name: 10-bit, value: 1, sdk: I2C_AcknowledgedAddress_10bit }
        help: I2C_OAR1 ADDMODE, bit 15.
      - key: addr
        name: Own address
        struct: I2C_InitTypeDef
        sdk_field: I2C_OwnAddress1
        type: int
        default: 0
        min: 0
        max: 1023
        help: "I2C_OAR1 ADD[9:0]. Only the low 7 bits are used in 7-bit addressing mode."

  I2C2:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: I2C, signals: [SCL, SDA] }
          - { name: SMBus, signals: [SCL, SDA, SMBA] }
    signal_pins:
      SCL: [{ pin: PC0, af: 9 }, { pin: PB10, af: 4 }]
      SDA: [{ pin: PC1, af: 9 }, { pin: PB11, af: 4 }]
      SMBA: [{ pin: PC2, af: 9 }, { pin: PB12, af: 4 }]
    params:
      - key: speed
        name: Clock speed
        struct: I2C_InitTypeDef
        sdk_field: I2C_ClockSpeed
        type: int
        default: 100000
        min: 1000
        max: 1000000
        unit: Hz
        help: "I2C_CKCFGR CCR together with F/S. Above 100 kHz the peripheral must be in fast mode."
      - key: duty
        name: Fast-mode duty cycle
        struct: I2C_InitTypeDef
        sdk_field: I2C_DutyCycle
        type: enum
        default: "2:1"
        options:
          - { name: "2:1" , value: 0, sdk: I2C_DutyCycle_2 }
          - { name: "16:9", value: 1, sdk: I2C_DutyCycle_16_9 }
        help: "I2C_CKCFGR DUTY, bit 14. Ignored below 100 kHz, where the peripheral runs in standard mode."
      - key: addrmode
        name: Addressing mode
        struct: I2C_InitTypeDef
        sdk_field: I2C_AcknowledgedAddress
        type: enum
        default: 7-bit
        options:
          - { name: 7-bit , value: 0, sdk: I2C_AcknowledgedAddress_7bit }
          - { name: 10-bit, value: 1, sdk: I2C_AcknowledgedAddress_10bit }
        help: I2C_OAR1 ADDMODE, bit 15.
      - key: addr
        name: Own address
        struct: I2C_InitTypeDef
        sdk_field: I2C_OwnAddress1
        type: int
        default: 0
        min: 0
        max: 1023
        help: "I2C_OAR1 ADD[9:0]. Only the low 7 bits are used in 7-bit addressing mode."

  I3C:
    category: Connectivity
    notes: DS Table 2-2-7. Four pin choices per line, spread across ports C, D, E and F.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: I3C, signals: [SCL, SDA] }
    signal_pins:
      SCL: [{ pin: PF6, af: 5 }, { pin: PC4, af: 7 }, { pin: PE14, af: 3 }, { pin: PD9, af: 5 }]
      SDA: [{ pin: PF7, af: 5 }, { pin: PC5, af: 7 }, { pin: PE15, af: 3 }, { pin: PD10, af: 5 }]
    # I3C has NO single *_InitTypeDef the way USART and SPI do: ch32h417_i3c.h defines
    # seven structs (I3C_Ctrl_BusTypeDef, I3C_CtrlConfTypeDef, I3C_TgtConfTypeDef and
    # four more) split across controller, target and FIFO roles. The two bus-timing
    # members that are a configuration choice are modelled here against
    # I3C_Ctrl_BusTypeDef; the rest is protocol-stack state rather than pinout
    # configuration and is declared absent in the notes rather than half-filled.
    params:
      - key: sda_hold
        name: SDA hold time
        struct: I3C_Ctrl_BusTypeDef
        sdk_field: SDAHoldTime
        type: enum
        default: 0.5 cycle
        options:
          - { name: 0.5 cycle, value: 0, sdk: I3C_SDAHoldTime_0_5 }
          - { name: 1.5 cycle, value: 1, sdk: I3C_SDAHoldTime_1_5 }
        help: "ch32h417_i3c.h:246-247. How long SDA is held after the SCL falling edge."
      - key: wait_time
        name: Wait time before start
        struct: I3C_Ctrl_BusTypeDef
        sdk_field: WaitTime
        type: enum
        default: State 0
        options:
          - { name: State 0, value: 0, sdk: I3C_WaitTime_State_0 }
          - { name: State 1, value: 1, sdk: I3C_WaitTime_State_1 }
          - { name: State 2, value: 2, sdk: I3C_WaitTime_State_2 }
          - { name: State 3, value: 3, sdk: I3C_WaitTime_State_3 }
        help: "ch32h417_i3c.h:250-253. How long a controller waits before issuing a start."

  # ---------------- Timers ----------------
  TIM1:
    category: Timers
    notes: Advanced-control timer - 4 channels, 3 complementary outputs and TWO break inputs (DS Table 2-2-4).
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH1] }
          - { name: PWM Generation CH1, signals: [CH1] }
          - { name: PWM Generation CH1 CH1N, signals: [CH1, CH1N] }
          - { name: PWM Generation CH1N only, signals: [CH1N] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
          - { name: PWM Generation CH2 CH2N, signals: [CH2, CH2N] }
          - { name: PWM Generation CH2N only, signals: [CH2N] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
          - { name: PWM Generation CH3 CH3N, signals: [CH3, CH3N] }
          - { name: PWM Generation CH3N only, signals: [CH3N] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR (external), signals: [ETR] }
      # TWO break inputs, which no CH32V00x part in this repo has. Offered as one
      # setting with four states rather than two settings, because they are one feature.
      - name: Break Input
        choices:
          - { name: Disable }
          - { name: BKIN, signals: [BKIN] }
          - { name: BKIN2, signals: [BKIN2] }
          - { name: BKIN + BKIN2, signals: [BKIN, BKIN2] }
    signal_pins:
      BKIN: [{ pin: PA6, af: 1 }, { pin: PE15, af: 1 }, { pin: PB12, af: 1 }]
      BKIN2: [{ pin: PE6, af: 1 }, { pin: PA5, af: 2 }, { pin: PA12, af: 12 }]
      CH1: [{ pin: PE9, af: 1 }, { pin: PA8, af: 1 }]
      CH1N: [{ pin: PA7, af: 1 }, { pin: PE8, af: 1 }, { pin: PB13, af: 1 }]
      CH2: [{ pin: PE11, af: 1 }, { pin: PA9, af: 1 }]
      CH2N: [{ pin: PB0, af: 1 }, { pin: PE10, af: 1 }, { pin: PB14, af: 1 }]
      CH3: [{ pin: PE13, af: 1 }, { pin: PA10, af: 1 }]
      CH3N: [{ pin: PB1, af: 1 }, { pin: PE12, af: 1 }, { pin: PB15, af: 1 }]
      CH4: [{ pin: PE14, af: 1 }, { pin: PA11, af: 1 }]
      ETR: [{ pin: PE7, af: 1 }, { pin: PA12, af: 1 }]
    params:
      - key: prescaler
        name: Prescaler (PSC)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Prescaler
        type: int
        default: 0
        min: 0
        max: 65535
        help: "TIMx_PSC. Counter clock = the timer's bus clock / (Prescaler + 1)."
      - key: period
        name: Counter period (ATRLR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Period
        type: int
        default: 65535
        min: 0
        max: 65535
        help: "TIMx_ATRLR, shown at its reset value. One period is (Counter period + 1) counter ticks."
      - key: counter
        name: Counter mode
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_CounterMode
        type: enum
        default: Up
        options:
          - { name: Up              , value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down            , value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center aligned 1, value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center aligned 2, value: 3, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center aligned 3, value: 4, sdk: TIM_CounterMode_CenterAligned3 }
        help: "TIMx_CTLR1 DIR (bit 4) and CMS[6:5]."
      - key: ckd
        name: Internal clock division
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        default: "1"
        options:
          - { name: "1", value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "2", value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "4", value: 2, sdk: TIM_CKD_DIV4 }
        help: "TIMx_CTLR1 CKD[9:8]. Divides the clock feeding the digital filters and the dead-time generator, not the counter."
      - key: arpe
        name: Auto-reload preload
        sdk_call: TIM_ARRPreloadConfig
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        sdk_note: "TIM_TimeBaseInitTypeDef has no auto-reload-preload member; it is a call after TIM_TimeBaseInit. ch32h417_tim.h:502."
        type: bool
        default: false
        help: "TIMx_CTLR1 ARPE, bit 7."
      - key: rcr
        name: Repetition counter (RPTCR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_RepetitionCounter
        type: int
        default: 0
        min: 0
        max: 255
        help: "TIM1_RPTCR. An update event happens every (value + 1) counter cycles. Advanced timer only, so it is ABSENT from TIM2/3/4 rather than offered and ignored."

  TIM2:
    category: Timers
    # CH1 and ETR are ONE pad in every option the datasheet lists, exactly as they are
    # on CH32V006, so they are modelled as one signal rather than two that would fight.
    notes: General-purpose timer. CH1 and ETR share a pad (DS Table 2-2-4 writes the pair as TIM2_CH1_ETR).
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH1_ETR] }
          - { name: PWM Generation CH1, signals: [CH1_ETR] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR (shares the CH1 pad), signals: [CH1_ETR] }
      - name: Encoder Mode
        choices:
