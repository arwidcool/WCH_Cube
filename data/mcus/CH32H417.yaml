# more - FT for 5 V tolerance, A for analog, SDP for the SerDes pads - and it is NOT
# extracted yet, so `analog:` and `five_volt_tolerant:` are absent rather than
# guessed. That is a declared gap in the notes, not an oversight: the column is
# split across lines by the PDF conversion and wants its own pass.
