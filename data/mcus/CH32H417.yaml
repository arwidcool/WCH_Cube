      Table 9-32 columns above, which is a DIFFERENT and now-answered question from
      "which physical pin does argument 2 select" - UHSIF_GPIO_Init takes the mapping
      as a plain callable argument, not an unwritable register field the way SDMMC_RM
      is, so once the physical mapping is confirmed this is a citation away from
      working end to end, not a second schema gap). The per-width claim (Mode's own
      choices, above) is answered: `tools/recover_h417_uhsif_pdf.py`, declared at
      `data/sources/H417/UHSIF_port_functions.yaml`.
