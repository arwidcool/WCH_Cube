    category: Connectivity
    settings:
      - name: Interface
        choices:
          - { name: Disable }
          - { name: "Internal PHY (built-in 10/100M)", signals: [MDIRN, MDIRP, MDITN, MDITP] }
          - { name: "RGMII (external 1Gbps PHY)", signals: [GTXC, RXC, RXD0, RXD1, RXD2, RXD3, RXDV, TXD0, TXD1, TXD2, TXD3, TXEN] }
      - name: "SMI (serial management interface)"
        choices:
          - { name: Disable }
          - { name: "MDC + MDIO", signals: [MDC, MDIO] }
      - name: "Status outputs"
        type: checkboxes
        choices:
          - { name: PHY_LED0, signals: [PHY_LED0] }
          - { name: PHY_LED1, signals: [PHY_LED1] }
          - { name: PHY_LED2, signals: [PHY_LED2] }
          - { name: PHY_LED3, signals: [PHY_LED3] }
          - { name: PHY_LED4, signals: [PHY_LED4] }
          - { name: "PPS (pulse per second)", signals: [PPS] }
    signal_pins:
      GTXC: [{ pin: PD15, af: 10 }]
      MDC: [{ pin: PC0, af: 1 }]
      MDIO: [{ pin: PC1, af: 1 }]
      MDIRN: [{ pin: MDIRN }]
      MDIRP: [{ pin: MDIRP }]
      MDITN: [{ pin: MDITN }]
      MDITP: [{ pin: MDITP }]
      PHY_LED0: [{ pin: PF0, af: 10 }]
      PHY_LED1: [{ pin: PF1, af: 10 }]
      PHY_LED2: [{ pin: PF2, af: 10 }]
      PHY_LED3: [{ pin: PB13, af: 10 }]
      PHY_LED4: [{ pin: PB14, af: 10 }]
      PPS: [{ pin: PC2, af: 1 }]
      RXC: [{ pin: PA15, af: 3 }]
      RXD0: [{ pin: PC9, af: 12 }]
      RXD1: [{ pin: PC8, af: 12 }]
      RXD2: [{ pin: PC7, af: 12 }]
      RXD3: [{ pin: PC6, af: 12 }]
      RXDV: [{ pin: PA14, af: 12 }]
      TXD0: [{ pin: PD13, af: 10 }]
      TXD1: [{ pin: PD12, af: 10 }]
      TXD2: [{ pin: PD11, af: 10 }]
      TXD3: [{ pin: PD10, af: 10 }]
      TXEN: [{ pin: PD14, af: 10 }]
    notes: >
      MAC plus a BUILT-IN 10/100M PHY: "Single chip can realize Ethernet communication",
      and "MAC and 100M PHY are fully integrated, and the periphery only needs
      capacitance" (CH32H417DS0.md 1.4.31, 1.2). So the ordinary configuration is the
      internal PHY - four media-dependent pads straight to the magnetics, with no
      MAC-to-PHY interface on pins at all, and nothing to select. RGMII is the OTHER
      supported configuration and the only interface the DS names: it is how an external
      1Gbps PHY is attached, which the DS calls "Optional Ethernet controller MAC +
      external 1Gbps PHY". MII and RMII are deliberately NOT offered. Neither word
      appears anywhere in this part's datasheet - its Ethernet section lists only RGMII -
      and a choice the silicon does not have is the defect class this project exists to
      remove. (Before this change the file offered MII and RMII, both invented.)
      The four pads are MDIRN/MDIRP (receive pair) and MDITN/MDITP (transmit pair), DS
      Table 2-1-1 at CH32H417DS0.md:3919-3930. They are dedicated pins rather than GPIO
      alternates, which is why they live in data/sources/H417/dedicated_pins.yaml where
      the generator can see them. Only 26 of ETH_InitTypeDef's 47 fields are modelled -
      the ones ETH_RegInit() (the only function that ever applies this struct) actually
      reads; see this peripheral's own extras comment for the full field split and the
      `dead_fields:` list that makes the other 21 a refused TODO, not a silent gap.
