        default: Snapshot
        options:
          - { name: Continuous, value: 0, sdk: DVP_CaptureMode_Continuous }
          - { name: Snapshot  , value: 1, sdk: DVP_CaptureMode_Snapshot }
        help: "DVP_CR1 (ch32h417_dvp.h:94-95). Snapshot is the EVT drop's own default (DVP_StructInit)."
      - key: jpeg
        name: JPEG mode
        struct: DVP_InitTypeDef
        sdk_field: DVP_JPEGMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR0 bit 6. The sensor sends a JPEG byte stream rather than raw pixels, so the row/column counts below stop describing the transfer."
      - key: rows
        name: Rows per frame
        struct: DVP_InitTypeDef
        sdk_field: DVP_ROW_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_ROW_NUM. The sensor's frame height in lines. 0 is the EVT drop's own starting value (DVP_StructInit) and means the field is left for your own code."
      - key: cols
        name: Bytes per row
        struct: DVP_InitTypeDef
        sdk_field: DVP_COL_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_COL_NUM. Counted in BYTES, not pixels, so an RGB565 line of 320 pixels is 640. 0 is DVP_StructInit()'s value."
      - key: crop
        name: Crop window
        struct: DVP_InitTypeDef
        sdk_field: DVP_Crop
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR1 bit 5. Captures a rectangle of the sensor's frame instead of all of it; the four window rows below apply only while it is on."
      - key: win_hoff
        name: Window horizontal offset
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_HOFFCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_HOFFCNT, in BYTES from the start of the line - the same unit as Bytes per row."
      - key: win_vst
        name: Window first line
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VST
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VST, the first line of the frame that is kept."
      - key: win_capcnt
        name: Window width
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_CAPCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_CAPCNT, bytes captured per line."
      - key: win_vline
        name: Window height
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VLine
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VLINE, lines captured per frame."
    notes: >
      Digital video port: a parallel camera interface. The Mode row picks the data width
      AND the pads it claims - 8-bit takes D0-D7, 10-bit adds D8-D9, 12-bit adds D10-D11 -
      and Parameter Settings writes the matching DVP_CR0.DATA_SIZE rather than offering the
      width a second time, so the pin plan and the register cannot disagree.
      THE TWO DMA BUFFER ADDRESSES ARE DELIBERATELY NOT ROWS. `DVP_DMA_BUF0_Addr` and
      `DVP_DMA_BUF1_Addr` (ch32h417_dvp.h:31-35) are pointers into your own program's
      memory - a symbol this tool has no way to know - so they are left at the struct's
      zero-initialiser, which is exactly what the vendor's own `DVP_StructInit()` sets them
      to (ch32h417_dvp.c). Assign `DVP->DMA_BUF0` / `DMA_BUF1` in the USER CODE block before
      `DVP_Cmd(ENABLE)`. Every other member of the struct is a row above.
  ECDC:
    category: System Core
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Enabled }
    pins: { none: true, source: "CH32H417DS0.md Table 2-1-1 and Tables 2-2-x: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    notes: This peripheral holds no pin on any package; it is configured
      through its own registers and the clock tree only.
  ETH:
    category: Connectivity
    notes: >
      MAC plus a BUILT-IN 10/100M PHY: "Single chip can realize Ethernet communication",
      and "MAC and 100M PHY are fully integrated, and the periphery only needs capacitance"
      (CH32H417DS0.md 1.4.31, 1.2). So the ordinary configuration is the internal PHY -
      four media-dependent pads straight to the magnetics, with no MAC-to-PHY interface on
      pins at all, and nothing to select.
      RGMII is the OTHER supported configuration and the only interface the DS names: it is
      how an external 1Gbps PHY is attached, which the DS calls "Optional Ethernet
      controller MAC + external 1Gbps PHY".
      MII and RMII are deliberately NOT offered. Neither word appears anywhere in this
      part's datasheet - its Ethernet section lists only RGMII - and a choice the silicon
      does not have is the defect class this project exists to remove. (Before this change
      the file offered MII and RMII, both invented.)
    settings:
      - name: Interface
        choices:
          - { name: Disable }
          - { name: "Internal PHY (built-in 10/100M)", signals: [MDIRN, MDIRP, MDITN, MDITP] }
          - { name: "RGMII (external 1Gbps PHY)", signals: [GTXC, RXC, RXD0, RXD1, RXD2, RXD3, RXDV, TXD0, TXD1, TXD2, TXD3, TXEN] }
      # SMI - MDC and MDIO - is how the controller reaches a PHY's registers, and the DS
      # describes it as the interface used "to configure and manage the external PHYs". So
      # it is a choice of its own rather than bundled into Interface: the internal PHY runs
      # without it, and an external one generally needs it.
      - name: "SMI (serial management interface)"
        choices:
          - { name: Disable }
          - { name: "MDC + MDIO", signals: [MDC, MDIO] }
      - name: "Status outputs"
        type: checkboxes
        choices:
          - { name: PHY_LED0, signals: [PHY_LED0] }
          - { name: PHY_LED1, signals: [PHY_LED1] }
          - { name: PHY_LED2, signals: [PHY_LED2] }
          - { name: PHY_LED3, signals: [PHY_LED3] }
          - { name: PHY_LED4, signals: [PHY_LED4] }
          - { name: "PPS (pulse per second)", signals: [PPS] }
    signal_pins:
      # The internal PHY's differential pairs. No `af:` and none is possible: these pads are
      # driven by the PHY block rather than by the GPIO cell, and DS Table 2-1-1 gives them
      # no (AFn) code. That is why ETH appears in `codegen.skip_signals` below. They are
      # routed here so the pin grid claims them and the conflict engine sees them.
      MDIRN: [{ pin: MDIRN }]
      MDIRP: [{ pin: MDIRP }]
      MDITN: [{ pin: MDITN }]
      MDITP: [{ pin: MDITP }]
      GTXC: [{ pin: PD15, af: 10 }]
      MDC: [{ pin: PC0, af: 1 }]
      MDIO: [{ pin: PC1, af: 1 }]
      PHY_LED0: [{ pin: PF0, af: 10 }]
      PHY_LED1: [{ pin: PF1, af: 10 }]
      PHY_LED2: [{ pin: PF2, af: 10 }]
      PHY_LED3: [{ pin: PB13, af: 10 }]
      PHY_LED4: [{ pin: PB14, af: 10 }]
      PPS: [{ pin: PC2, af: 1 }]
      RXC: [{ pin: PA15, af: 3 }]
      RXD0: [{ pin: PC9, af: 12 }]
      RXD1: [{ pin: PC8, af: 12 }]
      RXD2: [{ pin: PC7, af: 12 }]
      RXD3: [{ pin: PC6, af: 12 }]
      RXDV: [{ pin: PA14, af: 12 }]
      TXD0: [{ pin: PD13, af: 10 }]
      TXD1: [{ pin: PD12, af: 10 }]
      TXD2: [{ pin: PD11, af: 10 }]
      TXD3: [{ pin: PD10, af: 10 }]
      TXEN: [{ pin: PD14, af: 10 }]
  EXTI:
    category: System Core
