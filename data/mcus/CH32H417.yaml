        sdk_field: TIM_CounterMode
        type: enum
        default: Up
        options:
          - { name: Up              , value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down            , value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center aligned 1, value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center aligned 2, value: 3, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center aligned 3, value: 4, sdk: TIM_CounterMode_CenterAligned3 }
        help: "TIMx_CTLR1 DIR (bit 4) and CMS[6:5), RM 15.4.1 which covers x=2/3/4/5/9/10/11/12. Applied here by TIM9_12_TimeBaseInit(), which writes CTLR1 for every instance it is given."
      - key: ckd
        name: Internal clock division
        struct: TIM9_12_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        default: "1"
        options:
          - { name: "1", value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "2", value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "4", value: 2, sdk: TIM_CKD_DIV4 }
        help: "TIMx_CTLR1 CKD[9:8]. Divides the clock feeding the digital filters, not the counter."
      - key: arpe
        name: Auto-reload preload
        sdk_call: TIM_ARRPreloadConfig
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        sdk_note: "Neither time-base struct has an auto-reload-preload member; it is a call after the init. TIM_ARRPreloadConfig() takes any TIM_TypeDef* and writes CTLR1.ARPE unconditionally (ch32h417_tim.h:502)."
        type: bool
        default: false
        help: "TIMx_CTLR1 ARPE, bit 7."
  TKEY:
    category: Analog
    # TKEY HAS NO PAD OF ITS OWN, and this is the citation rather than an assumption from
    # a sibling part. RM ch.13 "Touch Key Detection (TKEY)" (CH32H417RM.md:15745): "The
    # detection channel reuses 16 external channels of the ADC, and the touch key
    # detection is realized through the single conversion mode of the ADC module", and
    # RM 13.1 (:15752): "For TKEY detection, the ADC module is needed. To enable TKEY,
    # ensure that ADC is powered on (ADON=1), then set the TKENABLE bit in the ADC_CTLR1
    # register to 1." The SPL agrees: ch32h417.h:1760-1761 defines TKey1 and TKey2 as
    # `ADC_TypeDef *` at ADC1_BASE and ADC2_BASE, and :1880 defines ADC_TKENABLE as an
    # ADC_CTLR1 bit. So the pads a touch design claims are ADC1/ADC2's IN0-IN15, and the
    # user claims them on the ADC's `Channels` row - the same pad offered twice would be
    # a conflict the silicon has not got. DS 1.4.13 and the model table's `ADC/TKey ...
    # Channels 16+2` row say the same thing from the datasheet side.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Enabled }
    pins:
      none: true
      source: "CH32H417RM.md:15745 (RM ch.13: the detection channels reuse the ADC's 16 external channels) and CH32H417DS0.md Table 2-1-1, which carries no TKEY function on any pin row"
    notes: >
      Touch-key capacitance detection: an operating mode of the two ADCs rather than a
      block with pads. Enabling it sets ADC_CTLR1.TKENABLE (ch32h417.h:1880) on an ADC
      that is already powered on, and the channel converted is the first of that ADC's
      regular sequence. Pick the pads on ADC1's or ADC2's `Channels` row; up to 16
      detection channels, one conversion at a time (RM 13.1).
      # No `params:` here - AGENT-3 confirmed ABSENT (tests/completeness.test.js's
      # 'CH32H417.TKEY.params'): no ch32h417_tkey.h exists at all, TKEY is realized
      # entirely as ADC_CTLR1.TKENABLE, and the only configuration - which pad(s) -
      # is already the ADC's own `Channels` row above. A prior draft added a
      # `sdk_manual` row for the TKENABLE bit itself; withdrawn, since the bit has
      # no independent user-facing choice left once the ADC channel is picked (it is
      # just "TKEY mode is on for this ADC", implied by claiming a touch channel at
      # all, not a second decision).
