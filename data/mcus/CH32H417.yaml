    params:
      - key: write_access
        name: Register write access
        sdk_call: IWDG_WriteAccessCmd
        sdk_args: [$VALUE]
        type: enum
        default: Enable before writing
        options:
          - { name: Enable before writing, value: 21845, sdk: IWDG_WriteAccess_Enable }
          - { name: Keep locked,           value: 0,     sdk: IWDG_WriteAccess_Disable }
        help: "ch32h417_iwdg.h:23-24. Unlocks IWDG_PSCR/IWDG_RLDR before either is written - a prescaler or reload written while locked is silently discarded (RM ch.5, IWDG). The two values are the literal key words 0x5555/0x0000."
      - key: prescaler
        name: Prescaler
        sdk_call: IWDG_SetPrescaler
        sdk_args: [$VALUE]
        type: enum
        default: "64"
        options:
          - { name: "4",   value: 0, sdk: IWDG_Prescaler_4 }
          - { name: "8",   value: 1, sdk: IWDG_Prescaler_8 }
          - { name: "16",  value: 2, sdk: IWDG_Prescaler_16 }
          - { name: "32",  value: 3, sdk: IWDG_Prescaler_32 }
          - { name: "64",  value: 4, sdk: IWDG_Prescaler_64 }
          - { name: "128", value: 5, sdk: IWDG_Prescaler_128 }
          - { name: "256", value: 6, sdk: IWDG_Prescaler_256 }
        help: "ch32h417_iwdg.h:27-33. Divides the LSI, this watchdog's only clock. The header stops at 256, same as every other CH32 part shipped here."
      - key: reload
        name: Reload value
        sdk_call: IWDG_SetReload
        sdk_args: [$VALUE]
        type: int
        default: 4095
