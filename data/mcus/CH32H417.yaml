      - name: Mode
        choices:
          - { name: Disable }
          - { name: Enabled }
    pins:
      none: true
      source: "CH32H417RM.md:15745 (RM ch.13: the detection channels reuse the ADC's 16 external channels) and CH32H417DS0.md Table 2-1-1, which carries no TKEY function on any pin row"
    notes: >
      Touch-key capacitance detection: an operating mode of the two ADCs rather than a
      block with pads. Enabling it sets ADC_CTLR1.TKENABLE (ch32h417.h:1880) on an ADC
      that is already powered on, and the channel converted is the first of that ADC's
      regular sequence. Pick the pads on ADC1's or ADC2's `Channels` row; up to 16
      detection channels, one conversion at a time (RM 13.1).
