        DFSDM_InternalStandardMode/Common/hardware.c:43-48.
      SDIO: >
        Word, confirmed on THIS part - SD_DMA_Config(), SDIO_SD/Common/sdio.c:2007-2021.
        Genuinely bidirectional (the direction is the function's own argument, called
        both ways at sdio.c:726/906 read and :1120/1362 write) - default is read.
      SAI: >
        Half Word, TX direction confirmed on THIS part - SAI_Play/Common/hardware.c:143-148.
        RX is the symmetric case (not independently exercised by the one shipped SAI
        example, which only plays audio out).
      ADC: >
        Peripheral to memory, Half Word, Normal, confirmed on THIS part -
        ADC_DMA/Common/hardware.c:114-122. Differs from CH32V006's own ADC1 default
        (Circular there) - this part's own shipped example uses Normal, and the two
        parts' data are not averaged; CH32V006's stays as its own citation states.
  - controller: DMA2
