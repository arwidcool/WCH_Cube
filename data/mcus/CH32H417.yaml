        # Ids 105,106,109,110,116-119 are omitted: RM Table 10-2 marks them "Reserved",
        # so offering them as a UI choice would be a fake request nothing drives.
    channel_params:
      - key: dir
        name: Direction
        type: enum
        group: Basic
        field: DIR
        sdk_field: DMA_DIR
        default: Peripheral to memory
        options:
          - { name: Peripheral to memory, value: 0, sdk: DMA_DIR_PeripheralSRC }
          - { name: Memory to peripheral, value: 1, sdk: DMA_DIR_PeripheralDST }
        help: "DMA_CFGRx DIR, bit 4 (RM:13018-13022). Same encoding as every other shipped part; ch32h417_dma.h keeps the SPL's PeripheralSRC/PeripheralDST naming."
      - key: priority
        name: Priority
        type: enum
