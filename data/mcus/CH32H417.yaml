dma:
  # CH32H417 has TWO DMA controllers (DMA1, DMA2, RM ch.10, CH32H417RM.md:12100-13370)
  # feeding a single 16-channel DMAMUX crossbar: DMAMUX channels 1-8 are DMA1's own
  # channels 1-8, DMAMUX channels 9-16 are DMA2's own channels 1-8 (RM 10.2.3,
  # CH32H417RM.md:12506-12514). Any of 123 named requests (RM Table 10-2,
  # CH32H417RM.md:12515-12564) can be routed onto ANY of the 16 channels via
  # DMA_MuxChannelConfig(DMA_MuxChannelx, DMA_Requestx) (ch32h417_dma.h:284,
  # implementation ch32h417_dma.c:610-645) - unlike every other shipped part's small,
  # silicon-fixed per-channel table, so this is `mux:`, not `requests:` (mechanism
  # landed by AGENT-2, agents/BOARD.md 2026-09-14T06:44Z; this block is the data half).
  #
  # Confirmed against TWO real EVT examples read end to end, not just the header:
  # USART_DMA/Common/hardware.c:118-191 (four channels, DMA_Cmd/USART_Cmd BEFORE
  # DMA_MuxChannelConfig - see the ordering note on codegen's own mux-before-struct-fill
  # choice, below) and DMA/DoubleBuffer_DMA/Common/hardware.c (double-buffer fields).
  #
  # DMA_InitTypeDef itself differs from every other shipped part's
  # (ch32h417_dma.h:23-67): `DMA_Memory0BaseAddr` (not `DMA_MemoryBaseAddr` - this part
  # has a SECOND memory pointer, `DMA_Memory1BaseAddr`, for double-buffer mode) and a
  # 4th data-width option (`_256`, a genuine 256-bit/32-byte transfer per DMAy_CFGRx
  # PSIZE/MSIZE `11` (RM:12979-12996), not a burst-count trick). Both are new
  # `channel_params:` rows below - no engine change needed for either (AGENT-2,
  # agents/BOARD.md 2026-09-14T06:44Z, items 1-2).
  #
  # ORDERING: codegen (app/engine/codegen.js dmaSection()) emits DMA_MuxChannelConfig
  # BEFORE the DMA_InitTypeDef struct fill and DMA_Cmd, which is NOT the order either
  # real EVT example uses (both call DMA_Init -> DMA_Cmd(ENABLE) -> ... ->
  # DMA_MuxChannelConfig -> the peripheral's own DMA-request-enable call, e.g.
  # USART_DMACmd/TIM_DMACmd). Checked this against the RM before trusting either
  # order: DMAMUX1_4_CFGR's CHANNELx_MUX field is 0-INDEXED (RM:13209-13228 -
  # "0000000: DMA request input 1") and ch32h417_dma.c:625 writes `DMA_Requestx - 1`,
  # so an UNCONFIGURED channel's mux resets to 0 = request 1 = TIM1_CH1, not "no
  # request". Both real examples enable their channel (DMA_Cmd) BEFORE routing it,
  # which is only safe because in both cases the peripheral generating TIM1_CH1's
  # request (TIM1) is not yet counting at that point (USART_DMA: TIM1 never
  # initialised at all; DoubleBuffer_DMA: TIM_Cmd(TIM1, ENABLE) is the LAST call,
  # after DMA_MuxChannelConfig). Configuring the mux FIRST, as codegen does, closes
  # that window outright instead of relying on TIM1 happening to be silent - SAFER
  # than the vendor's own order, not merely "still safe" as originally flagged for
  # review. No RM text states an ordering requirement either way.
  - controller: DMA1
    init_struct: DMA_InitTypeDef                    # ch32h417_dma.h:23-67
    register:
      name: DMA_CFGRx
      address: 0x40020008          # R32_DMA1_CFGR1, RM Table 10-4 (CH32H417RM.md:12590); offset 0x08+(x-1)*20
      stride: 20
      channel_macro: "DMA1_Channel$CH"
      fields:                      # RM 10.3.3, CH32H417RM.md:12915-13054
        EN:            { lsb: 0,  bits: 1 }
        TCIE:          { lsb: 1,  bits: 1 }
        HTIE:          { lsb: 2,  bits: 1 }
        TEIE:          { lsb: 3,  bits: 1 }
        DIR:           { lsb: 4,  bits: 1 }
        CIRC:          { lsb: 5,  bits: 1 }
        PINC:          { lsb: 6,  bits: 1 }
        MINC:          { lsb: 7,  bits: 1 }
        PSIZE:         { lsb: 8,  bits: 2 }
        MSIZE:         { lsb: 10, bits: 2 }
        PL:            { lsb: 12, bits: 2 }
        MEM2MEM:       { lsb: 14, bits: 1 }
        DOUBLE_MODE:   { lsb: 15, bits: 1 }   # new on this part - RM:12956-12962
        FLAG_CUR_MEM:  { lsb: 16, bits: 1 }   # new on this part - RM:12937-12955 (RW to pick the start memory; hardware-driven status flag once the channel is enabled)
    mux:
      base: 0             # DMA1's channels are global mux channels 1-8 (RM:12513-12514)
      count: 8
      sdk_call: DMA_MuxChannelConfig        # ch32h417_dma.h:284
      channel_macro: "DMA_MuxChannel$CH"    # ch32h417_dma.h:246-261 (global channel number, 0x00-0x0F);
                                             # confirmed against real calls, e.g.
                                             # DMA_MuxChannelConfig(DMA_MuxChannel7, 87) in
                                             # USART_DMA/Common/hardware.c:188 - never a bare integer
      requests:          # RM Table 10-2, CH32H417RM.md:12515-12564. Same catalogue on DMA2
                          # below - the RM states one shared request list for the whole crossbar,
                          # not a per-controller subset.
        TIM1_CH1: 1
        TIM1_CH2: 2
        TIM1_CH3: 3
        TIM1_CH4: 4
        TIM1_UP: 5
        TIM1_COM: 6
        TIM1_TRIG: 7
        TIM2_CH1: 8
        TIM2_CH2: 9
        TIM2_CH3: 10
        TIM2_CH4: 11
        TIM2_UP: 12
        TIM2_TRIG: 13
        TIM3_CH1: 14
        TIM3_CH2: 15
        TIM3_CH3: 16
        TIM3_CH4: 17
        TIM3_UP: 18
        TIM3_TRIG: 19
        TIM4_CH1: 20
        TIM4_CH2: 21
        TIM4_CH3: 22
        TIM4_CH4: 23
        TIM4_UP: 24
        TIM4_TRIG: 25
        TIM5_CH1: 26
        TIM5_CH2: 27
        TIM5_CH3: 28
        TIM5_CH4: 29
        TIM5_UP: 30
        TIM5_TRIG: 31
        TIM8_CH1: 32
