gpio:
  speeds:
    - { name: Low,       macro: GPIO_Speed_Low }
    - { name: Medium,    macro: GPIO_Speed_Medium }
    - { name: High,      macro: GPIO_Speed_High }
    - { name: Very high, macro: GPIO_Speed_Very_High }
  # All eight members of GPIOMode_TypeDef (ch32h417_gpio.h:32-41) are accounted for:
  # five here and three under input_modes. This part has open-drain in both forms.
  modes:
    - { name: Output Push Pull,              macro: GPIO_Mode_Out_PP, class: out }
    - { name: Output Open Drain,             macro: GPIO_Mode_Out_OD, class: out }
    - { name: Alternate Function Push Pull,  macro: GPIO_Mode_AF_PP,  class: out }
    - { name: Alternate Function Open Drain, macro: GPIO_Mode_AF_OD,  class: out }
    - { name: Analog,                        macro: GPIO_Mode_AIN,    class: analog }
  input_modes:
    - { name: No pull,   macro: GPIO_Mode_IN_FLOATING }
    - { name: Pull-up,   macro: GPIO_Mode_IPU }
    - { name: Pull-down, macro: GPIO_Mode_IPD }

# There is no `constraints:` block. The three shapes were checked against this part's
# sources and none has an instance in the twelve peripherals modelled here: no per-pin
# note on any GPIOMode member in ch32h417_gpio.h, no shorted pin groups on any of the
# three packages (the extractor reports "shorted groups none" for all three), and
# nothing that couples a peripheral's enable state to a pin's legality. The USB and
# SerDes pads are dedicated, not multiplexed GPIO, so they cannot be mis-configured.

# -----------------------------------------------------------------------------
codegen:
  # ch32h417.h, guard __CH32H417_H. Series `ch32h417`, which is also what the
  # PlatformIO board files say: genericCH32H417QEU6.json "spl_series": "ch32h417".
  header: ch32h417.h

  # Claims GPIO_Init must NOT touch. SYS is the default (the debug pair and NRST); RCC is
  # added here because its XI/XO are the HSE crystal pads - dedicated `sys` pins, not
  # AF-selected GPIOs - and GPIO_Init driving an oscillator pin is actively harmful. The
  # coupling itself is `clock.hse_peripheral`/`hse_setting`/`hse_signals`, which is what
  # claims the pins; this keeps them out of the generated GPIO setup.
  skip_signals: { SYS: true, RCC: true }
  sdk:
    evt: H417
    series: ch32h417

  # The SDK does not spell the clock-refresh call the same way on every family, and
  # this part is the one that differs: System/ch32h417/{v3f,v5f}/system_ch32h417.h
  # declares `SystemAndCoreClockUpdate` - it refreshes BOTH cores - where every other
  # family here declares `SystemCoreClockUpdate`. The generated main.c reads this key,
  # so no part is named in app/engine/. Omitting it means the usual name.
  clock_update_fn: SystemAndCoreClockUpdate

  # printf over the WCH-Link SDI channel costs no pin and is what every other part's
  # generated main.c uses. **This part's Debug folder does not have it**: the whole of
  # framework-wch-noneos-sdk/Debug/ch32h417/debug.h is one printf entry point,
  # `USART_Printf_Init(uint32_t baudrate)`, which claims a USART and therefore two
  # pins. An empty value means "this part has no SDI printf", and the generator emits
  # a comment saying so instead of a call that would fail to link.
  sdi_printf_fn: ""

  # HB2, not PB2 and not APB2. This is the FOURTH spelling of the port clock enable in
  # four families - CH32V003 says APB2, CH32V005/V006 say PB2, CH32X035 says APB2, and
  # this part says HB2 (ch32h417_rcc.h:248-255, RCC_HB2PeriphClockCmd at :650).
  gpio_clock: { fn: RCC_HB2PeriphClockCmd, port: RCC_HB2Periph_GPIO$PORT, afio: RCC_HB2Periph_AFIO }

  speeds:
    Low:         GPIO_Speed_Low
    Medium:      GPIO_Speed_Medium
    High:        GPIO_Speed_High
    "Very high": GPIO_Speed_Very_High

  # THE THIRD REMAP STYLE. `register` writes an AFIO field per peripheral, `macro`
  # calls GPIO_PinRemapConfig per peripheral, and `af` calls GPIO_PinAFConfig per PIN.
  # `fields:` is deliberately absent and the validator rejects it alongside `style: af`:
  # this part's AFIO_PCFR1 still exists, but it carries only PD0_1_REMAP, UHSIF_CLK_RM,
  # the PIOC port map and four ADC trigger-SOURCE bits (TIM8 vs EXTI, not a pin), none
  # of which is peripheral pin muxing.
  remap:
    style: af
    fn: GPIO_PinAFConfig          # (GPIOx, GPIO_PinSource<n>, GPIO_AF<n>) - ch32h417_gpio.h:160
    macro: GPIO_AF$AF             # GPIO_AF0..GPIO_AF15 - ch32h417_gpio.h:129-145

  # RCC_CFGR0 - RM 3.4.2, offset 0x04, reset 0x00000000. Only the two fields the clock
  # tab below actually offers are encoded; the PLL, PPRE1/PPRE2 and the ADC muxes are
  # absent because the tree that would drive them is not modelled. The generator writes
  # what it is given and reports what it is not, so a missing field is a named TODO
  # rather than a wrong bit.
  rcc:
    register: "RCC->CFGR0"
    sw: { lsb: 0, bits: 2, values: { HSI: 0, HSE: 1, PLLCLK: 2 } }     # SW[1:0]; 11 is "not available"
    prescalers:
      # HPRE[3:0], and the run is NOT the CH32V00x one. Codes 0xxx all mean "no
      # prescaling", then 1000..1111 are /2, /4, /8, /16, /64, /128, /256, /512 -
      # **there is no /32**, the sequence jumps 16 to 64. Reading it as a doubling run
      # would put /32 on code 1100 and silently run the bus at half the asked-for speed.
      HB: { lsb: 4, bits: 4,
            values: { 1: 0, 2: 8, 4: 9, 8: 10, 16: 11, 64: 12, 128: 13, 256: 14, 512: 15 } }

  # Which SDK function applies each init struct, and what it applies it TO. The
  # generator refuses to derive a function name from a struct name, and I3C is why
  # that rule keeps earning its place here: `I3C_Ctrl_BusTypeDef` is applied by
  # `I3C_Ctrl_Init`, which takes the struct ALONE - there is no handle argument, the
  # same shape OPA_Init has on CH32V006. Every line below is from the EVT headers.
  init_structs:
    GPIO_InitTypeDef:        { fn: GPIO_Init }          # ch32h417_gpio.h:148
    USART_InitTypeDef:       { fn: USART_Init }         # ch32h417_usart.h:184
    SPI_InitTypeDef:         { fn: SPI_Init }           # ch32h417_spi.h:198
    I2C_InitTypeDef:         { fn: I2C_Init }           # ch32h417_i2c.h:302
    TIM_TimeBaseInitTypeDef: { fn: TIM_TimeBaseInit }   # ch32h417_tim.h:465
    I3C_Ctrl_BusTypeDef:     { fn: I3C_Ctrl_Init, no_handle: true }   # ch32h417_i3c.h:400

  periph_handle:
    USART1: USART1
    USART2: USART2
    USART3: USART3
    SPI1:   SPI1
    SPI2:   SPI2
    I2C1:   I2C1
    I2C2:   I2C2
    I3C:    I3C
    TIM1:   TIM1
    TIM2:   TIM2
    TIM3:   TIM3
    TIM4:   TIM4

  # Which enable register each peripheral's clock bit lives in. Generated from
  # ch32h417_rcc.h: every RCC_HB*Periph_* macro, with the bit taken as log2 of its
  # value rather than read off a table - 73 macros is 73 chances to misread a bit
  # position, and a wrong bit turns the clock on for a DIFFERENT peripheral, which
  # on the board is a peripheral that does nothing for no stated reason.
  #
  # Three buses, three registers, three SPL functions (RM 3.4.7-3.4.9).
  #
  # NOTE the two keys that are NOT peripheral ids: `OTG_FS` (the USBFS bit) and `OPCM`
  # (the OPA/CMP bit). Those are the SPL's macro spellings - `RCC_HBPeriph_OTG_FS` and
  # `RCC_HB2Periph_OPCM` - and they have to stay, because codegen emits `prefix + key`
  # and renaming the key would produce a macro that does not exist. The cost is that
  # `clockBitOf('USBFS')` finds nothing, so codegen writes its documented "no clock
  # enable bit" comment for those two instead of guessing. That is the right failure
  # direction, and the schema gap it exposes is on TASKS.md.
  periph_clock:
    HB: { register: RCC_HBPCENR, fn: RCC_HBPeriphClockCmd, prefix: RCC_HBPeriph_,
           bits: { DMA1: 0, DMA2: 1, CRC: 6, FMC: 8, RNG: 9, SDMMC: 10, USBHS: 11, USBSS: 12, DVP: 13,
                   ETH: 14, OTG_FS: 17, UHSIF: 18, USBPD: 19, SERDES: 20, PIOC: 22 } }
    HB1: { register: RCC_HB1PCENR, fn: RCC_HB1PeriphClockCmd, prefix: RCC_HB1Periph_,
           bits: { TIM2: 0, TIM3: 1, TIM4: 2, TIM5: 3, TIM6: 4, TIM7: 5, USART6: 6, USART7: 7, USART8: 8,
                   LPTIM1: 9, LPTIM2: 10, WWDG: 11, QSPI1: 12, QSPI2: 13, SPI2: 14, SPI3: 15, SPI4: 16,
                   USART2: 17, USART3: 18, USART4: 19, USART5: 20, I2C1: 21, I2C2: 22, CAN3: 24, CAN1: 25,
                   CAN2: 26, BKP: 27, PWR: 28, DAC: 29, I2C3: 30, SWPMI: 31 } }
    HB2: { register: RCC_HB2PCENR, fn: RCC_HB2PeriphClockCmd, prefix: RCC_HB2Periph_,
           bits: { AFIO: 0, HSADC: 1, GPIOA: 2, GPIOB: 3, GPIOC: 4, GPIOD: 5, GPIOE: 6, GPIOF: 7, ADC1: 9,
                   ADC2: 10, TIM1: 11, SPI1: 12, TIM8: 13, USART1: 14, I2C4: 15, SAI: 16, SDIO: 18,
                   TIM9: 19, TIM10: 20, TIM11: 21, TIM12: 22, OPCM: 23, DFSDM: 25, ECDC: 26, GPHA: 27,
                   LTDC: 30, I3C: 31 } }

# -----------------------------------------------------------------------------
# Clock tree. HSI and HSE are both 25 MHz on this part (ch32h417.h:23 and :29,
# HSE_VALUE and HSI_VALUE, both 25000000) - not the 24 MHz every CH32V00x uses.
# SYSCLK tops out at 400 MHz on the V5F core and 160 MHz on the V3F.
clock:
  sources:
    HSI: { mhz: 25, fixed: true }
    HSE: { mhz: 25, min_mhz: 4, max_mhz: 25 }
    LSI: { khz: 40, fixed: true }
    LSE: { khz: 32.768, fixed: true }

  # The SYS PLL - RM 3.4.3 (RCC_PLLCFGR). PLLSRC picks the source and PLL_SRC_DIV is ONE
  # shared 6-bit divider (1..64) in front of it, so the CHOICE is the (source, divider)
  # pair. That is why each divider is its own `inputs:` entry: the engine's `pllIn` index
  # drives both mux and divider, and listing the pair is the only way the schema says it.
  pll:
    inputs:
      - { name: "HSI /1", source: HSI, div: 1 }
      - { name: "HSI /2", source: HSI, div: 2 }
      - { name: "HSI /3", source: HSI, div: 3 }
      - { name: "HSI /4", source: HSI, div: 4 }
      - { name: "HSI /5", source: HSI, div: 5 }
      - { name: "HSI /6", source: HSI, div: 6 }
      - { name: "HSI /7", source: HSI, div: 7 }
      - { name: "HSI /8", source: HSI, div: 8 }
      - { name: "HSI /10", source: HSI, div: 10 }
      - { name: "HSI /12", source: HSI, div: 12 }
      - { name: "HSI /16", source: HSI, div: 16 }
      - { name: "HSI /20", source: HSI, div: 20 }
      - { name: "HSI /24", source: HSI, div: 24 }
      - { name: "HSI /32", source: HSI, div: 32 }
      - { name: "HSI /48", source: HSI, div: 48 }
      - { name: "HSI /64", source: HSI, div: 64 }
      - { name: "HSE /1", source: HSE, div: 1 }
      - { name: "HSE /2", source: HSE, div: 2 }
      - { name: "HSE /3", source: HSE, div: 3 }
      - { name: "HSE /4", source: HSE, div: 4 }
      - { name: "HSE /5", source: HSE, div: 5 }
      - { name: "HSE /6", source: HSE, div: 6 }
      - { name: "HSE /7", source: HSE, div: 7 }
      - { name: "HSE /8", source: HSE, div: 8 }
      - { name: "HSE /10", source: HSE, div: 10 }
      - { name: "HSE /12", source: HSE, div: 12 }
      - { name: "HSE /16", source: HSE, div: 16 }
      - { name: "HSE /20", source: HSE, div: 20 }
      - { name: "HSE /24", source: HSE, div: 24 }
      - { name: "HSE /32", source: HSE, div: 32 }
      - { name: "HSE /48", source: HSE, div: 48 }
      - { name: "HSE /64", source: HSE, div: 64 }
    multipliers: [4, 6, 7, 8, 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12, 12.5, 13, 14, 15, 16, 17, 18, 19, 20, 22, 24, 26, 28, 30, 32, 34, 36, 38, 40, 59]

  sysclk: { sources: [HSI, HSE, PLLCLK], max_mhz: 400 }

  hse_peripheral: RCC
  hse_setting: High Speed Clock (HSE)
  hse_signals: [XI, XO]

  prescalers:
    # HPRE[3:0] - RM 3.4.2. **NOT a doubling run.** 0xxx = /1, then /2 /4 /8 /16 /64 /128
    # /256 /512: there is NO /32, so reading it as a doubling run puts /32 on code 1100
    # and halves every bus silently. That warning is in CH32H417.notes.md; this is the
    # same fact written where the engine reads it.
    HB:
      options: [1, 2, 4, 8, 16, 64, 128, 256, 512]
      max_mhz: 400
      label: "HB prescaler (HPRE) -> HCLK"
    # FPRE[1:0] - RM 3.4.2, the divider to CORE1 (the RISC-V5F core).
    FPRE:
      options: [1, 2, 4]
      source: HB
      label: "CORE1 prescaler (FPRE) -> the V5F core clock"
    # PPRE2[2:0] - RM 3.4.2, configures the PB2/HB2 bus. It ALSO serves as the low three
    # bits of the ADC prescaler when the ADC is clocked from USBHS_PLL, which is why the
    # ADC entry below spells out the HCLK half separately.
    HB2:
      options: [1, 2, 4, 8, 16]
      source: HB
      label: "APB2 prescaler (PPRE2) -> HB2 peripherals"
    # ADCPRE[1:0] + PPRE2[2:0] with HCLK as the source: /2 /4 /6 /8 (RM 3.4.2).
    ADC:
      options: [2, 4, 6, 8]
      source: HB
      max_mhz: 80
      label: "ADC prescaler (ADCPRE + PPRE2, HCLK source)"

  # Bus membership from those same three registers. A peripheral in the wrong list makes
  # its USART baud readout and its timer frequency wrong - numbers the UI prints as fact.
  buses:
    HB:
      - CRC
      - DMA1
      - DMA2
      - DVP
      - ETH
      - FMC
      - GPIO
      - PIOC
      - RNG
      - SDMMC
      - SERDES
      - UHSIF
      - USBHS
      - USBPD
      - USBSS
    HB1:
      - CAN1
      - CAN2
      - CAN3
      - DAC
      - I2C1
      - I2C2
      - I2C3
      - LPTIM1
      - LPTIM2
      - PWR
      - QSPI1
      - QSPI2
      - SPI2
      - SPI3
      - SPI4
      - SWPMI
      - TIM2
      - TIM3
      - TIM4
      - TIM5
      - TIM6
      - TIM7
      - USART2
      - USART3
      - USART4
      - USART5
      - USART6
      - USART7
      - USART8
      - WWDG
    HB2:
      - ADC1
      - ADC2
      - DFSDM
      - ECDC
      - GPHA
      - HSADC
      - I2C4
      - I3C
      - LTDC
      - OPA
      - CMP
      - SAI
      - SDIO
      - SPI1
      - TIM1
      - TIM8
      - TIM9
      - TIM10
      - TIM11
      - TIM12
      - USART1
      - RCC
      - EXTI
      - FLASH
      - SYS

  notes: >
    MODELLED: the four oscillators; the SYS PLL (PLLSRC's six legal sources, the one shared
    1..64 divider, and all 32 PLLMUL factors from RM 3.4.3); the SYSCLK mux; HPRE, FPRE,
    PPRE2 and the ADC prescaler; and bus membership from the three clock-enable registers
    (RM 3.4.7-3.4.9).

    NOT MODELLED, and declared rather than approximated. This part has FIVE PLLs (RM 3.3.4):
    SYS, USBHS (480 MHz), ETH (500 MHz), USBSS (125 MHz) and SERDES. Only SYS is here,
    because `clock.pll` is a SINGLE object - one `inputs` list, one `multipliers` list - so
    a second PLL has nowhere to go. That is also why `sysclk.sources` lists three entries
    and not the seven RM 3.4.3 allows: SYSPLL_SEL can additionally route USBHS_PLL,
    ETH_PLL, SERDES_PLL/2 and USBSS_PLL to the system clock, and until the schema can hold
    those four, offering them here would offer a source whose frequency nothing computes.

    The eight peripheral clock muxes in RM 3.4.13 (RCC_CFGR2) are absent for the same
    reason: RNG, I2S2, I2S3, USBFS 48M, LTDC, UHSIF, HSADC and ETH1G each choose between
    PLL_CLK, a secondary PLL and SYSCLK, several through their own 1..64 divider.
    `clock.prescalers` expresses one source per tap and cannot express a CHOICE of source,
    so an LTDC pixel clock or the USB 48 MHz clock cannot be computed. MCO (RM 3.3.5.5,
    eight sources) is unmodelled likewise.

    A wrong clock number is worse than a missing one - round 5's rule. A computed 48 MHz
    that is really 24 reaches the generated C and the SDI banner as a stated fact, so the
    gap stays visible here and in TASKS.md rather than being filled with a guess.
