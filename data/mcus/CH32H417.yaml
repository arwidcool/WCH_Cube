    2026-09-13T19:07Z) once the schema-and-layout blocker `agents/proposals/
    CH32H417_usbhs_pll.yaml` recorded was gone.

    NOT MODELLED, and declared rather than approximated. This part has FIVE PLLs (RM 3.3.4):
    SYS, USBHS, ETH (500 MHz), USBSS (125 MHz) and SERDES. `clock.plls` now holds more than
    one, so ETH/USBSS/SERDES are a data gap, not a schema one - each needs the same
    RM-line-by-line check USBHS_PLL got before it ships (`sysclk.sources` also lists three
    entries and not the seven RM 3.4.3 allows for the same reason: SYSPLL_SEL can
    additionally route USBHS_PLL, ETH_PLL, SERDES_PLL/2 and USBSS_PLL to the system clock,
    and USBHS_PLL could be added to that list now that it computes).

    USBHS_PLL's own other three inputs (HSE, SYS_PLL/N, ETHCLK_20M) stay out for the reason
    in the `plls.USBHS_PLL` comment above: `USBHSPLL_REFSEL[1:0]` (RM:4266-4274) makes
    480 MHz conditional on the reference selection matching the real input, and only HSI's
    `fixed: true` 25 MHz makes REFSEL=00 correct unconditionally.

    The other seven peripheral clock muxes in RM 3.4.13 (RCC_CFGR2) are absent for the same
    schema-shape reason USBFS's used to be: RNG, I2S2, I2S3, LTDC, UHSIF, HSADC and ETH1G
    each choose between PLL_CLK, a secondary PLL and SYSCLK, several through their own
    1..64 divider, and most need a PLL this file does not compute yet (ETH_PLL, SERDES_PLL)
    or a mux entry that carries its own extra divider (LTDC's choice 01 is "SERDES_PLL
    clock divided by 2", RM:4085-4089) - a shape `clock.prescalers` cannot express, per the
    REQUEST to AGENT-2 on `agents/BOARD.md` 2026-09-13T01:14Z. MCO (RM 3.3.5.5, eight
    sources) is unmodelled likewise.

    A wrong clock number is worse than a missing one - round 5's rule. A computed 48 MHz
    that is really 24 reaches the generated C and the SDI banner as a stated fact, so the
    gap stays visible here and in TASKS.md rather than being filled with a guess.
