    # UHSIF_GPIO_Init's 5th argument, disconnected from which pads were claimed - the
    # exact "do not duplicate a setting" trap (data/FORMAT.md): a project could pick
    # "Mode: Enabled" (claims all 49) and "Data bus width: 8-bit" (claims 8 via the
    # SDK argument alone) and the two would disagree about how many data pads are
    # really in use. Removed: `Mode`'s own choice names ARE the width now (below),
    # the single source for both the pin claim and (once UHSIF_GPIO_Init's five-
    # argument-in-one-call gap is closed, board 2026-09-13T01:14Z) the SDK argument.
