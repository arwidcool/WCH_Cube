        I3C_DMA_Controller/Common/hardware.c:210-215 (TX),:244-249 (RX).
      USART: >
        Byte on both sides, confirmed on THIS part - USART_DMA/Common/hardware.c:140-151
        (TX),:154-158 (RX).
      QSPI: >
