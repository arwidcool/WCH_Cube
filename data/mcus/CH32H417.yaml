  CMP:
    category: Analog
    # `CMP_InitTypeDef` (ch32h417_opa.h:145-151) is applied WHOLE by
    # `OPA_CMP_Init(CMP_InitTypeDef*)` (ch32h417_opa.h:169, ch32h417_opa.c:110-120,
    # writes R32_CMP_CTLR bits [12:0] in one go) - `no_handle: true`, this part has one
    # comparator (unlike CH32L103's three, so there is no `CMP_NUM` here at all - the
    # CH32L103 instance-fixing trap this comment used to warn about does not apply to
    # this part's silicon).
    #
    # `PSEL`/`NSEL` are NOT free-standing choices: they are DERIVED from the "Positive
    # input"/"Negative input" settings above, which already decide the pad (or the
    # internal OPA1/DAC2 tap) - offering them again as a second dropdown could disagree
    # with the pin picker (FORMAT.md "Do not duplicate a setting"). Each is a `const:`
    # row keyed by `depends_on:` to its setting's choice, the same shape DVP's data-width
    # rows use.
    #
    # `MODE[3:0]` (CH32H417RM.md:50694-50735) is bigger than the "Output" setting
    # models: 0000 is "drive the GPIO pad" (what "Output: OUT" claims), but 0001-1110
    # route the comparator result INTERNALLY to one of eleven timers'
    # break/capture inputs (TIM1_BKIN, TIM8_BKIN, TIMx_CH4 x8, LPTIM1/2_CH1) with NO pad
    # involved, and 1111 turns the output off entirely. Modelling only 0000 (const,
    # depends_on Output=OUT) rather than adding an eleven-target second setting that
    # could contradict the pin claim - TASKS.md line for the internal-routing capability,
    # not guessed into an unverified interaction with the pin picker.
    #
    # `OPA_CMP_Cmd(ENABLE)` (ch32h417_opa.c:149-159) is a SEPARATE call after
    # `OPA_CMP_Init()`, same gap as DAC's `DAC_Cmd` (comment above, `channel_params` /
    # plain `params:` have no slot for a required follow-up call) - the four real fields
    # below configure the comparator but do not yet enable it.
    settings:
      - name: "Positive input"
        choices:
          - { name: Disable }
          - { name: P0, signals: [P0] }
          - { name: P1, signals: [P1] }
          - { name: "P2 (OPA1 output, internal - claims no pin)" }
      - name: "Negative input"
        choices:
          - { name: Disable }
          - { name: N0, signals: [N0] }
          - { name: N1, signals: [N1] }
          - { name: "N2 (DAC channel 2 output, internal - claims no pin)" }
      - name: Output
        choices:
          - { name: Disable }
          - { name: OUT, signals: [OUT] }
    signal_pins:
      N0: [{ pin: PB1 }]
      N1: [{ pin: PC4 }]
      OUT: [{ pin: PB12, af: 13 }, { pin: PE15, af: 13 }, { pin: PE12, af: 13 }, { pin: PE6, af: 11 }, { pin: PA6, af: 10 }, { pin: PA8, af: 12 }, { pin: PC5, af: 13 }]
      P0: [{ pin: PB0 }]
      P1: [{ pin: PB2 }]
    params:
      - key: psel_p0
        name: Positive input select
        struct: CMP_InitTypeDef
        sdk_field: PSEL
        const: CMP_CHP_0
        depends_on: { setting: "Positive input", equals: P0 }
        help: "R32_CMP_CTLR PSEL[1:0]=00 (CH32H417RM.md:50767-50768). Derived from the Positive input setting, not a separate choice."
      - key: psel_p1
        name: Positive input select
        struct: CMP_InitTypeDef
        sdk_field: PSEL
        const: CMP_CHP_1
        depends_on: { setting: "Positive input", equals: P1 }
        help: "R32_CMP_CTLR PSEL[1:0]=01 (CH32H417RM.md:50769-50770)."
      - key: psel_p2
        name: Positive input select
        struct: CMP_InitTypeDef
        sdk_field: PSEL
        const: CMP_OPA1
        depends_on: { setting: "Positive input", equals: "P2 (OPA1 output, internal - claims no pin)" }
        help: "R32_CMP_CTLR PSEL[1:0]=10, OPA1 output (CH32H417RM.md:50771-50772)."
      - key: nsel_n0
        name: Negative input select
        struct: CMP_InitTypeDef
        sdk_field: NSEL
        const: CMP_CHN0
        depends_on: { setting: "Negative input", equals: N0 }
        help: "R32_CMP_CTLR NSEL[1:0]=00 (CH32H417RM.md:50756-50758)."
      - key: nsel_n1
        name: Negative input select
        struct: CMP_InitTypeDef
        sdk_field: NSEL
        const: CMP_CHN1
        depends_on: { setting: "Negative input", equals: N1 }
        help: "R32_CMP_CTLR NSEL[1:0]=01 (CH32H417RM.md:50759-50760)."
      - key: nsel_n2
        name: Negative input select
        struct: CMP_InitTypeDef
        sdk_field: NSEL
        const: CMP_DAC2
        depends_on: { setting: "Negative input", equals: "N2 (DAC channel 2 output, internal - claims no pin)" }
        help: >
          R32_CMP_CTLR NSEL[1:0]=10, "DAC2 output (PA5)" (CH32H417RM.md:50761-50762) -
          DAC CHANNEL 2's own output pin, not channel 1's (PA4). DISAGREEMENT: DS
          Table 2-2-22 reads "DAC1_OUT/CMP_N2" (CH32H417DS0.md:7368); the register-level
          RM text is followed here as the more specific source. Recorded, not averaged.
      - key: mode_gpio
        name: Output routing
        struct: CMP_InitTypeDef
        sdk_field: Mode
        const: OUT_TO_IO
        depends_on: { setting: Output, equals: OUT }
        help: >
          R32_CMP_CTLR MODE[3:0]=0000, "Connect to GPIO" (CH32H417RM.md:50694-50698).
          Derived from the Output setting. The other 15 MODE codes route the result to
          an internal timer break/capture input instead of a pad (CH32H417RM.md:
          50699-50734) - not modelled, TASKS.md line.
      - key: vref
        name: Internal bias voltage
        struct: CMP_InitTypeDef
        sdk_field: VREF
        type: enum
        default: Disabled
        options:
          - { name: Disabled,       value: 0, sdk: CMP_VREF_OFF }
          - { name: "1/4 VDD33A",   value: 1, sdk: CMP_VREF_25PER_VDD }
          - { name: "1/2 VDD33A",   value: 2, sdk: CMP_VREF_50PERT_VDD }
          - { name: "3/4 VDD33A",   value: 3, sdk: CMP_VREF_75PERC_VDD }
        help: "R32_CMP_CTLR VREF[1:0], CH32H417RM.md:50666-50677. Default matches the EVT's OPA_CMP_StructInit() (ch32h417_opa.c) and the register reset (both 0)."
      - key: hypsel
        name: Hysteresis voltage
        struct: CMP_InitTypeDef
        sdk_field: HYPSEL
        type: enum
        default: 0 mV
        options:
          - { name: 0 mV,  value: 0, sdk: CMP_HYPSEL_OFF }
          - { name: 10 mV, value: 1, sdk: CMP_HYPSEL_10mV }
          - { name: 20 mV, value: 2, sdk: CMP_HYPSEL_20mV }
          - { name: 30 mV, value: 3, sdk: CMP_HYPSEL_30mV }
        help: "R32_CMP_CTLR HYPSEL[1:0], CH32H417RM.md:50678-50689. Default matches the register reset (0)."
  CRC:
    category: System Core
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Enabled }
    pins: { none: true, source: "CH32H417DS0.md Table 2-1-1 and Tables 2-2-x: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    notes: This peripheral holds no pin on any package; it is configured
      through its own registers and the clock tree only.
  DAC:
    category: Analog
    # `DAC_InitTypeDef` (ch32h417_dac.h:22-38) is applied PER CHANNEL by
    # `DAC_Init(uint32_t DAC_Channel, DAC_InitTypeDef*)` (ch32h417_dac.h:104), the same
    # `channel_params`/`instances` shape this file already uses for SAI's two blocks -
    # here keyed to the two existing "Channel 1"/"Channel 2" settings rows instead of a
    # channel number.
    #
    # `output_buffer` IS A GENUINE DISAGREEMENT, recorded rather than picked quietly:
    # `R32_DAC_CTLR` resets to `0x00000000` (CH32H417RM.md:22064) and BOFF1's own bit
    # description reads "DAC channel1 output buffer disable control (Recommended to be
    # enabled)" (CH32H417RM.md:22318-22320) - both point at `DAC_OutputBuffer_Enable`
    # (value 0). The EVT's own example runs the opposite,
    # `DAC_OutputBuffer_Disable` (Evt/EXAM/DAC/DAC_Normal_OUT/Common/hardware.c:43).
    # Default here is Enable: two independent sources (the reset state and the RM's own
    # recommendation) against one example's runtime choice, and a board disabling the
    # buffer is plausibly a board fact, not a part fact - the user-visible row makes a
    # wrong default one click from fixed either way.
    #
    # `DAC_Cmd(DAC_Channel_x, ENABLE)` (ch32h417_dac.h:106) is a SEPARATE call the EVT
    # example always makes right after `DAC_Init()` (hardware.c:45) - `channel_params`
    # has no slot for a required follow-up call today, so selecting "Output on pin"
    # configures the channel's mode but does not yet emit the enable. Same class of gap
    # as SAI's Frame/Slot (comment above) and I3C's target/controller split: landing the
    # four real `DAC_InitTypeDef` fields rather than waiting on a mechanism that also
    # does not exist yet, cited here instead of silently shipping a channel that never
    # turns on. REQUEST to AGENT-2: `channel_params.instances.<n>` needs an optional
    # second call (`cmd_call`/`cmd_args`, or similar) emitted after `sdk_call` succeeds.
    # TASKS.md line.
    settings:
      - name: "Channel 1"
        choices:
          - { name: Disable }
          - { name: "Output on pin", signals: [OUT1] }
      - name: "Channel 2"
        choices:
          - { name: Disable }
          - { name: "Output on pin", signals: [OUT2] }
    signal_pins:
      OUT1: [{ pin: PA4 }]
      OUT2: [{ pin: PA5 }]
    channel_params:
      struct: DAC_InitTypeDef
      applies_per: channel
      instances:
        1: { sdk_call: DAC_Init, handle: DAC_Channel_1, setting: "Channel 1", active_choices: ["Output on pin"] }
        2: { sdk_call: DAC_Init, handle: DAC_Channel_2, setting: "Channel 2", active_choices: ["Output on pin"] }
      params:
        - key: trigger
          name: Trigger
          struct: DAC_InitTypeDef
          sdk_field: DAC_Trigger
          type: enum
          default: None (write DHR to convert)
          options:
            - { name: "None (write DHR to convert)", value: 0, sdk: DAC_Trigger_None }
            - { name: "TIM2 TRGO",  value: 1, sdk: DAC_Trigger_T2_TRGO }
            - { name: "TIM4 TRGO",  value: 2, sdk: DAC_Trigger_T4_TRGO }
            - { name: "TIM5 TRGO",  value: 3, sdk: DAC_Trigger_T5_TRGO }
            - { name: "TIM6 TRGO",  value: 4, sdk: DAC_Trigger_T6_TRGO }
            - { name: "TIM7 TRGO",  value: 5, sdk: DAC_Trigger_T7_TRGO }
            - { name: "TIM8 TRGO",  value: 6, sdk: DAC_Trigger_T8_TRGO }
            - { name: "EXTI line 9", value: 7, sdk: DAC_Trigger_Ext_IT9 }
            - { name: "Software",   value: 8, sdk: DAC_Trigger_Software }
          help: "ch32h417_dac.h:24-25. Default matches R32_DAC_CTLR reset (TEN1=0, CH32H417RM.md:22064) and the EVT example (hardware.c:40)."
        - key: wave
          name: Wave generation
          struct: DAC_InitTypeDef
          sdk_field: DAC_WaveGeneration
          type: enum
          default: None
          options:
            - { name: None,     value: 0, sdk: DAC_WaveGeneration_None }
            - { name: Noise,    value: 1, sdk: DAC_WaveGeneration_Noise }
            - { name: Triangle, value: 2, sdk: DAC_WaveGeneration_Triangle }
          help: "ch32h417_dac.h:27-28. Default matches R32_DAC_CTLR reset (WAVE1=00, CH32H417RM.md:22064) and the EVT example (hardware.c:41)."
        - key: lfsr_mask
          name: Noise mask / triangle amplitude
          struct: DAC_InitTypeDef
          sdk_field: DAC_LFSRUnmask_TriangleAmplitude
          type: enum
          default: "Bit 0 / amplitude 1"
          depends_on: { param: wave, ne: None }
          options:
            - { name: "Bit 0 / amplitude 1",         value: 0,  sdk: DAC_LFSRUnmask_Bit0 }
            - { name: "Bits 1:0 / amplitude 3",      value: 1,  sdk: DAC_LFSRUnmask_Bits1_0 }
            - { name: "Bits 2:0 / amplitude 7",      value: 2,  sdk: DAC_LFSRUnmask_Bits2_0 }
            - { name: "Bits 3:0 / amplitude 15",     value: 3,  sdk: DAC_LFSRUnmask_Bits3_0 }
            - { name: "Bits 4:0 / amplitude 31",     value: 4,  sdk: DAC_LFSRUnmask_Bits4_0 }
            - { name: "Bits 5:0 / amplitude 63",     value: 5,  sdk: DAC_LFSRUnmask_Bits5_0 }
            - { name: "Bits 6:0 / amplitude 127",    value: 6,  sdk: DAC_LFSRUnmask_Bits6_0 }
            - { name: "Bits 7:0 / amplitude 255",    value: 7,  sdk: DAC_LFSRUnmask_Bits7_0 }
            - { name: "Bits 8:0 / amplitude 511",    value: 8,  sdk: DAC_LFSRUnmask_Bits8_0 }
            - { name: "Bits 9:0 / amplitude 1023",   value: 9,  sdk: DAC_LFSRUnmask_Bits9_0 }
            - { name: "Bits 10:0 / amplitude 2047",  value: 10, sdk: DAC_LFSRUnmask_Bits10_0 }
            - { name: "Bits 11:0 / amplitude 4095",  value: 11, sdk: DAC_LFSRUnmask_Bits11_0 }
          help: "ch32h417_dac.h:31-32. One field serves both wave modes (ch32h417_dac.h:57-71 aliases the same values as DAC_TriangleAmplitude_*). Default matches R32_DAC_CTLR reset (MAMP1=0000, CH32H417RM.md:22064) and the EVT example (hardware.c:42)."
        - key: output_buffer
          name: Output buffer
          struct: DAC_InitTypeDef
          sdk_field: DAC_OutputBuffer
          type: enum
          default: Enable
          options:
            - { name: Enable,  value: 0, sdk: DAC_OutputBuffer_Enable }
            - { name: Disable, value: 2, sdk: DAC_OutputBuffer_Disable }
          help: >
            ch32h417_dac.h:36. DISAGREEMENT, recorded rather than averaged: R32_DAC_CTLR
            resets to BOFF1=0 = Enable (CH32H417RM.md:22064) and the RM's own bit text
            calls Enable "Recommended" (CH32H417RM.md:22318-22320); the EVT example runs
            Disable instead (Evt/EXAM/DAC/DAC_Normal_OUT/Common/hardware.c:43). Default
            here is Enable (reset state + RM recommendation outrank one unexplained
            example choice) - change it if your board needs otherwise.
  DBGMCU:
    category: System Core
    settings:
      - name: "Debug in low power"
        choices:
          - { name: Disable }
          - { name: Enabled }
    pins: { none: true, source: "CH32H417DS0.md Table 2-1-1 and Tables 2-2-x: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    notes: This peripheral holds no pin on any package; it is configured
      through its own registers and the clock tree only.
  DFSDM:
    category: Analog
    settings:
      - name: "Channel 0"
        choices:
          - { name: Disable }
          - { name: "External clock", signals: [CKIN0, DATIN0] }
          - { name: "Internal clock", signals: [DATIN0] }
      - name: "Channel 1"
        choices:
          - { name: Disable }
          - { name: "External clock", signals: [CKIN1, DATIN1] }
          - { name: "Internal clock", signals: [DATIN1] }
      - name: "Clock output"
        choices:
          - { name: Disable }
          - { name: "CKOUT enabled", signals: [CKOUT] }
    signal_pins:
      CKIN0: [{ pin: PC0, af: 3 }]
      CKIN1: [{ pin: PB13, af: 6 }, { pin: PC2, af: 3 }, { pin: PD7, af: 6 }, { pin: PB2, af: 4 }]
      CKOUT: [{ pin: PB0, af: 6 }, { pin: PC2, af: 6 }, { pin: PD10, af: 3 }, { pin: PD3, af: 3 }, { pin: PE9, af: 3 }]
      DATIN0: [{ pin: PC1, af: 3 }]
      DATIN1: [{ pin: PB1, af: 6 }, { pin: PB12, af: 6 }, { pin: PC3, af: 3 }, { pin: PD6, af: 4 }]
    channel_params:
      struct: DFSDM_ChannelInitTypeDef
      applies_per: channel
      instances:
        0: { sdk_call: DFSDM_ChannelInit, handle: DFSDM_Channel0, setting: "Channel 0", active_choices: ["External clock", "Internal clock"] }
        1: { sdk_call: DFSDM_ChannelInit, handle: DFSDM_Channel1, setting: "Channel 1", active_choices: ["External clock", "Internal clock"] }
      params:
        - key: datmpx
          name: Input data source
          sdk_field: DFSDM_ChDataMultiplexer
          type: enum
          default: Serial
          options:
            - { name: Serial,   value: 0,      sdk: DFSDM_SerialInput }
            - { name: ADC,      value: 4096,   sdk: DFSDM_ADCInput }
            - { name: Internal, value: 8192,   sdk: DFSDM_InternalInput }
          help: >
            CFGR1.DATMPX[13:12], ch32h417_dfsdm.h:154-157. Serial is the pin-routed path
            this peripheral's own signal_pins: (CKIN/DATIN) exist for; ADC/Internal read
            from ADC1/ADC2 or another on-chip source instead and claim no pad - offered
            here since the header defines real values for them, but this part's two
            modelled settings ("External clock"/"Internal clock") only route pins for
            the Serial case, so ADC/Internal need the setting active regardless
            (`active_choices`) even though the field itself can express more.
        - key: spiclksrc
          name: SPI clock source
          sdk_field: DFSDM_ChSPIClockSource
          type: enum
          default: External
          options:
            - { name: External,             value: 0,  sdk: DFSDM_ExternalClkIn }
            - { name: "Internal, output",    value: 4,  sdk: DFSDM_InternalClkOut }
            - { name: "Internal, falling",   value: 8,  sdk: DFSDM_InternalHalfFall }
            - { name: "Internal, rising",    value: 12, sdk: DFSDM_InternalHalfRise }
          help: >
            CFGR1.SPICKSEL[3:2], ch32h417_dfsdm.h:162-165 (register math confirmed
            against ch32h417_dfsdm.c:161-168 and ch32h417.h's own CFGR1_SPICKSEL mask
            0xC - see the peripheral comment for the vendor example's swapped field
            names, not repeated here). "External" is what the shipped SerialSPI example
            runs and matches this channel's own CKIN pin being routed.
        - key: siface
          name: Serial interface edge
          sdk_field: DFSDM_ChSerialInterface
          type: enum
          default: Rising
          options:
            - { name: Rising,  value: 0, sdk: DFSDM_SPIRising }
            - { name: Falling, value: 1, sdk: DFSDM_SPIFalling }
          help: "CFGR1.SITP[1:0], ch32h417_dfsdm.h:168-170. EVT DFSDM_SerialSPI example, value 0 either way (see peripheral comment)."
        - key: datpack
          name: Data packing
          sdk_field: DFSDM_ChDataPackMode
          type: enum
          default: Standard
          options:
            - { name: Standard,   value: 0,     sdk: DFSDM_StandardMode }
            - { name: Interleave, value: 16384, sdk: DFSDM_InterleaveMode }
            - { name: Dual,       value: 32768, sdk: DFSDM_DualMode }
          help: "CFGR1.DATPACK[15:14], ch32h417_dfsdm.h:149-152. EVT DFSDM_SerialSPI example: Standard (hardware.c:117)."
        - key: chinsel
          name: Input pin select
          sdk_field: DFSDM_ChInPinSelect
          type: enum
          default: This channel
          options:
            - { name: This channel, value: 0,   sdk: DFSDM_SelectCurrent }
            - { name: Next channel, value: 256, sdk: DFSDM_SelectNext }
          help: >
            CFGR1.CHINSEL, ch32h417_dfsdm.h:158-160. Lets channel y read the (y+1) pin
            pair instead of its own - EVT DFSDM_SerialSPI example: This channel
            (hardware.c:121).
        - key: ckabdet
          name: Clock absence detector
          sdk_field: DFSDM_ChClockAbsenceDetMode
          sdk_enabled: ENABLE
          sdk_disabled: DISABLE
          type: bool
          default: false
          help: "CFGR1.CKABEN (bit 6), ch32h417_dfsdm.h:63-64. EVT DFSDM_SerialSPI example: DISABLE (hardware.c:120)."
        - key: scddet
          name: Short-circuit detector
          sdk_field: DFSDM_ChShortCircuitDetMode
          sdk_enabled: ENABLE
          sdk_disabled: DISABLE
          type: bool
          default: true
          help: "CFGR1.SCDEN (bit 5), ch32h417_dfsdm.h:66-67. EVT DFSDM_SerialSPI example: ENABLE (hardware.c:119)."
        - key: scdthr
          name: Short-circuit detector threshold
          sdk_field: DFSDM_ChSCDCntthreshold
          type: int
          default: 220
          min: 0
          max: 255
          help: "AWSCDR.SCDT[7:0], ch32h417_dfsdm.h:56-57. EVT DFSDM_SerialSPI example: 220 (hardware.c:118)."
        - key: scdbksig
          name: Short-circuit break signal
          sdk_field: DFSDM_ChSCDBreakSignal
          type: enum
          default: None
          options:
            - { name: None,        value: 0,     sdk: DFSDM_SCD_BK_None }
            - { name: "BK0",       value: 4096,  sdk: DFSDM_SCD_BK_0 }
            - { name: "BK1",       value: 8192,  sdk: DFSDM_SCD_BK_1 }
            - { name: "BK0 + BK1", value: 12288, sdk: DFSDM_SCD_BK_0_1 }
          help: "AWSCDR.BKSCD[13:12], ch32h417_dfsdm.h:51-54. Not exercised by any shipped DFSDM example; default matches the reset/POR value (0)."
        - key: awdsincorder
          name: Watchdog Sinc filter order
          sdk_field: DFSDM_ChAWDSincFilterOrder
          type: enum
          default: FastSinc
          options:
            - { name: FastSinc, value: 0, sdk: DFSDM_AWD_FastSinc }
            - { name: Sinc1,    value: 1, sdk: DFSDM_AWD_Sinc1 }
            - { name: Sinc2,    value: 2, sdk: DFSDM_AWD_Sinc2 }
            - { name: Sinc3,    value: 3, sdk: DFSDM_AWD_Sinc3 }
          help: "AWSCDR.AWFORD[23:22], ch32h417_dfsdm.h:45-46. Not exercised by any shipped DFSDM example; default matches the reset/POR value (0)."
        - key: awdoversample
          name: Watchdog filter oversample ratio
          sdk_field: DFSDM_ChAWDFilterOverSample
          type: int
          default: 1
          min: 1
          max: 32
          help: >
            AWSCDR.AWFOSR[20:16], ch32h417_dfsdm.h:59-60. The driver writes
            `(value - 1) << offset` (ch32h417_dfsdm.c:183), so 1 (the header's own
            "bypassed" value, @ref AWD_Filter_Bypass) writes 0 - matches the reset/POR
            value; not exercised by any shipped DFSDM example.
        - key: rbitshift
          name: Data right bit-shift
          sdk_field: DFSDM_ChDataRightBitShift
          type: int
          default: 0
          min: 0
          max: 31
          help: "CFGR2.DTRBS[7:3], ch32h417_dfsdm.h:53-55. Not exercised by any shipped DFSDM example; default matches the reset/POR value (0)."
        - key: caliboffset
          name: Calibration offset
          sdk_field: DFSDM_ChCalibrationOffset
          type: int
          default: 0
          min: -8388608
          max: 8388607
          help: "CFGR2.CALIBOFF, ch32h417_dfsdm.h:23-25 (24-bit signed). Not exercised by any shipped DFSDM example; default matches the reset/POR value (0)."
  DMA1:
