    signal_pins:
      N01: [{ pin: PB1 }]
      N02: [{ pin: PE8 }]
      N03: [{ pin: PC3 }]
      N11: [{ pin: PA7 }]
      N12: [{ pin: PF12 }]
      N13: [{ pin: PA3 }]
      OUT01: [{ pin: PC4 }]
      OUT02: [{ pin: PE7 }]
      OUT03: [{ pin: PA0 }]
      OUT11: [{ pin: PA5 }]
      OUT12: [{ pin: PB1 }]
      OUT13: [{ pin: PA4 }]
      P01: [{ pin: PB0 }]
      P02: [{ pin: PE9 }]
      P03: [{ pin: PC2 }]
      P11: [{ pin: PA6 }]
      P12: [{ pin: PF11 }]
      P13: [{ pin: PA2 }]
  PIOC:
    category: Connectivity
    # NO SDK FUNCTION APPLIES ANY STRUCT HERE - there is no `ch32h417_pioc.c`, so no
    # `PIOC_Init()` and nothing else that takes a `PIOC_TypeDef*`. What this part calls
    # PIOC is a second, embedded CPU (RM ch.34, "Programmable Protocol I/O Microcontroller":
    # a RISC8B core with 66 of its OWN instructions and a 2048-word program ROM multiplexed
    # out of system SRAM), and its behaviour is set by loading a RISC8B assembly PROGRAM
    # into that ROM - a separate toolchain (`CHRISC8B.PDF`,
    # Evt/EXAM/PIOC/*/Common/Asm/*.ASM for this part's five shipped protocols: 1-Wire, I2C,
    # NEC, Single-Wire, UART) - not by filling an init struct this generator could emit.
    # `params:` is deliberately empty rather than filled with register-address rows no
    # `codegen.init_structs` entry could ever apply. TASKS.md carries the finding.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: "Programmable IO", signals: [IO0, IO1] }
    signal_pins:
      IO0: [{ pin: PC1, af: 7 }, { pin: PA0, af: 5 }, { pin: PE3, af: 5 }, { pin: PF12, af: 3 }, { pin: PB8, af: 5 }]
      IO1: [{ pin: PC0, af: 5 }, { pin: PC2, af: 8 }, { pin: PF14, af: 5 }, { pin: PE4, af: 4 }, { pin: PF13, af: 5 }, { pin: PB9, af: 7 }]
  PWR:
    category: System Core
    settings:
      - name: "Programmable Voltage Detector (PVD)"
        choices:
          - { name: Disable }
          - { name: Enabled }
      - name: "Low power mode"
        choices:
          - { name: None }
          - { name: Sleep }
          - { name: Stop }
          - { name: Standby }
    notes: This peripheral holds no pin on any package; it is configured
      through its own registers and the clock tree only.
    pins:
      none: true
      source: "CH32H417DS0.md Table 2-1-1 and Tables 2-2-x: no pin row carries a function of this peripheral (checked by tools/coverage.py)"
      # Seven rails, and the DS states an ORDER between four of them once at the end of
      # 1.4.3 rather than in a table: VDD33 >= VDD33A >= VDDIO >= VIO18. Two more
      # (VDD12A, VDDK) are normally OUTPUTS of internal LDOs and only become inputs if
      # the designer moves the heat off the chip, and VBAT stands outside the ordering
      # because it is switched in only when the others are gone. Modelling that as flat
      # rows would lose the part a designer most needs: which rail may be above which.
      supplies:
        - name: VDD33
          pins: [VDD33]
          range: "2.4-3.6 V (3.15-3.45 V with USB2.0 or Ethernet)"
          note: >
            Main supply, and the highest rail. Powers some I/O pins, the system LDO and the
            built-in USB2.0 and Ethernet PHYs. Must not fall below 2.7 V in Stop mode or
            while VIO18 is switched from low to high. Decouple 0.1 uF per pin plus 10 uF at
            the main pin, next to the Ethernet signals.
          source: "CH32H417DS0.md 1.4.3"
        - name: VDD33A
          pins: [VDD33A]
          range: "1.8-3.6 V (>= 3.0 V for HSADC, >= 2.4 V for ADC and DAC)"
          note: >
            Analog supply for the ADC, temperature sensor, HSADC, OPA, CMP, DAC and PLL.
            Match it to VDDIO when the OPA or DAC is used; otherwise it may be higher. Must
            not exceed VDD33.
          source: "CH32H417DS0.md 1.4.3"
        - name: VDDIO
          pins: [VDDIO]
          range: "1.65-3.6 V"
          note: >
            I/O supply: sets the output high level of the regular I/O pins and feeds the I/O
            LDO that produces VIO18. Must not exceed VDD33 or VDD33A. When VIO18 rises from
            low to high, VDDIO's capacitance must be much larger than VIO18's or the inrush
            pulls VDDIO down. 0.1 uF per pin plus 10 uF at the main pin.
          source: "CH32H417DS0.md 1.4.3"
        - name: VIO18
          pins: [VIO18]
          range: "1.1-3.6 V"
          note: >
            Supply for the high-speed I/O pins. Normally GENERATED by the I/O LDO from
            VDDIO and set by software to 1.2, 1.8, 2.5 or 3.3 V, or switched off. The level
            after power-up is chosen by the pull-down resistor on the XO pin. Short it to
            VDDIO when low-voltage I/O is not needed. 0.1 uF per pin plus 2.2 uF at the
            main pin.
          source: "CH32H417DS0.md 1.4.3, Table 3-2"
        - name: VDD12A
          pins: [VDD12A]
          range: "1.17-1.27 V"
          note: >
            For the USB 3.0 module and the TH PHY. Normally an LDO OUTPUT derived from
            VDD33, so the pin is a decoupling node: 0.1 uF + 2.2 uF. May be fed from an
            external DC-DC instead to move the LDO's heat off the chip - then the external
            voltage must sit slightly above the LDO's output, and the LDO must be off.
          source: "CH32H417DS0.md 1.4.3"
        - name: VDDK
          pins: [VDDK]
          range: "1.17-1.27 V"
          note: >
            Core supply, with the same double role as VDD12A: normally an LDO output from
            VDD33 and a decoupling node (0.1 uF per pin plus 2.2 uF at the main pin), or fed
            externally at a voltage slightly above the LDO's output.
          source: "CH32H417DS0.md 1.4.3"
        - name: VREFP
          pins: [VREFP]
          range: "2.4-3.6 V"
          note: >
            Reference input for the ADC, HSADC and DAC. Must not exceed VDD33A. Tie it to
            VDD33A for ratiometric conversions, or drive it from a reference - there is no
            internal reference pad.
          source: "CH32H417DS0.md 1.4.3"
        - name: VBAT
          pins: [VBAT]
          range: "1.8-3.6 V"
          note: >
            Optional backup supply, outside the VDD33 >= VDD33A >= VDDIO >= VIO18 ordering:
            it is only switched in when VDD33 and VDD33A are off, to run the RTC and the
            external 32 kHz oscillator.
          source: "CH32H417DS0.md 1.4.3"
        - name: VSS / VSSA
          pins: [VSS, VSSA]
          range: "0 V"
          note: >
            Ground, and the analog return for VDD33A and VREFP. Star VSSA to VSS at the pin
            rather than along the digital ground path.
          source: "CH32H417DS0.md Table 2-1-1"
