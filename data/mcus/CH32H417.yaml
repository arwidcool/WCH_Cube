        struct: FMC_NORSRAMTimingInitTypeDef
        embed: rw
        sdk_field: FMC_DataSetupTime
        type: int
        default: 255
        min: 0
        max: 255
        help: "ch32h417_fmc.h:35-38, R32_FMC_BTRx DATAST[15:8] (Table 40-18). SRAMs, ROMs and asynchronous muxed NOR Flash."
      - key: wr_datasetup
        name: "Data setup time (write, extended mode)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: wr
        sdk_field: FMC_DataSetupTime
        type: int
        default: 255
        min: 0
        max: 255
        when: { "Extended Mode": Enable }
        help: "Same field, the write-only timing set (ch32h417_fmc.h:115)."
      - key: rw_busturnaround
        name: "Bus turnaround duration (read/write)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: rw
        sdk_field: FMC_BusTurnAroundDuration
        type: int
        default: 15
        min: 0
        max: 15
        help: "ch32h417_fmc.h:40-43, R32_FMC_BTRx BUSTURN[19:16] (Table 40-18). Multiplexed NOR Flash only."
      - key: wr_busturnaround
        name: "Bus turnaround duration (write, extended mode)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: wr
        sdk_field: FMC_BusTurnAroundDuration
        type: int
        default: 15
        min: 0
        max: 15
        when: { "Extended Mode": Enable }
        help: "Same field, the write-only timing set (ch32h417_fmc.h:115)."
      - key: rw_clkdivision
        name: "CLK output division (read/write)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: rw
        sdk_field: FMC_CLKDivision
        type: int
        default: 1
        min: 1
        max: 15
        help: "ch32h417_fmc.h:45-47, R32_FMC_BTRx CLKDIV[23:20] (Table 40-18). Synchronous NOR Flash only - not used for asynchronous NOR/SRAM/ROM, which is why the minimum legal value (1) is the default rather than 0."
      - key: wr_clkdivision
        name: "CLK output division (write, extended mode)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: wr
        sdk_field: FMC_CLKDivision
        type: int
        default: 1
        min: 1
        max: 15
        when: { "Extended Mode": Enable }
        help: "Same field, the write-only timing set (ch32h417_fmc.h:115)."
      - key: rw_datalatency
        name: "Data latency (read/write)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: rw
        sdk_field: FMC_DataLatency
        type: int
        default: 0
        min: 0
        max: 15
        help: "ch32h417_fmc.h:49-56, R32_FMC_BTRx DATLAT[27:24] (Table 40-18). 0 for CRAM and for asynchronous NOR/SRAM/ROM; only synchronous burst NOR Flash needs a nonzero value."
      - key: wr_datalatency
