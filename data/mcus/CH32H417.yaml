        sdk_field: TIM_RepetitionCounter
        type: int
        default: 0
        min: 0
        max: 255
        help: "TIM8_RPTCR. An update event happens every (value + 1) counter cycles. Advanced timer only: TIM_TimeBaseInit() writes RPTCR for TIM1 and TIM8 and no other instance, so it is ABSENT from TIM2-TIM12 rather than offered and ignored."
