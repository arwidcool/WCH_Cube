# -----------------------------------------------------------------------------
# EMITTED. Pin TYPE is classified by name here: P<port><n> is io, V* is power or
# ground, and the rest (XI/XO, the Ethernet MDI pairs, the USB SuperSpeed pairs,
# NRST) are fixed-function pads. The DS's own "I/O characteristic" column carries
# more - FT for 5 V tolerance, A for analog, SDP for the SerDes pads - and it is NOT
# extracted yet, so `analog:` and `five_volt_tolerant:` are absent rather than
# guessed. That is a declared gap in the notes, not an oversight: the column is
# split across lines by the PDF conversion and wants its own pass.
pins:
  MDIRN: { type: sys, notes: "Ethernet PHY media-dependent interface, negative leg. Route as a controlled-impedance differential pair with MDIRP." }
  MDIRP: { type: sys, notes: "Ethernet PHY media-dependent interface, positive leg. Route as a controlled-impedance differential pair with MDIRN." }
  MDITN: { type: sys, notes: "Ethernet PHY media-dependent interface, negative leg. Route as a controlled-impedance differential pair with MDITP." }
  MDITP: { type: sys, notes: "Ethernet PHY media-dependent interface, positive leg. Route as a controlled-impedance differential pair with MDITN." }
  NRST: { type: reset, notes: "External reset, active low. On this part it is its own pad rather than a multiplexed GPIO, so there is no RST_MODE option byte to move it. (CH32H417DS0.md Table 2-1-1)" }
