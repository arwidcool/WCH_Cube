nvic:
  controller: PFIC
  scheme:
    register: { name: PFIC_IPRIOR, address: 0xE000E400, bits_per_vector: 8 }
    priority_bits: 4
    priority_lsb: 4
    max_nesting: 8
    groups:
      # The V5F core's four documented splits (core_riscv.h NVIC_SetPriority).
      # 'Nesting' is CSR 0x804 bit 1 plus bits [3:2]; nesting 0 = no preemption.
      - name: No nesting (4 bits of sub-priority)
        preempt: { bits: 0, lsb: 0, min: 0, max: 0 }
        sub:     { bits: 4, lsb: 4, min: 0, max: 15 }
      - name: 2 levels of nesting (1 preemption bit)
        default: true
        preempt: { bits: 1, lsb: 7, min: 0, max: 1 }
        sub:     { bits: 3, lsb: 4, min: 0, max: 7 }
      - name: 4 levels of nesting (2 preemption bits)
        preempt: { bits: 2, lsb: 6, min: 0, max: 3 }
        sub:     { bits: 2, lsb: 4, min: 0, max: 3 }
      - name: 8 levels of nesting (3 preemption bits)
        preempt: { bits: 3, lsb: 5, min: 0, max: 7 }
        sub:     { bits: 1, lsb: 4, min: 0, max: 1 }
  vectors:
