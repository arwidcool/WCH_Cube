        name: "Address hold time (read/write)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: rw
        sdk_field: FMC_AddressHoldTime
        type: int
        default: 15
        min: 0
        max: 15
        help: "ch32h417_fmc.h:30-33, R32_FMC_BTRx ADDHLD[7:4] (Table 40-18). Not used with synchronous NOR."
      - key: wr_addrhold
        name: "Address hold time (write, extended mode)"
        struct: FMC_NORSRAMTimingInitTypeDef
        embed: wr
        sdk_field: FMC_AddressHoldTime
        type: int
        default: 15
        min: 0
        max: 15
        when: { "Extended Mode": Enable }
        help: "Same field, the write-only timing set (ch32h417_fmc.h:115)."
      - key: rw_datasetup
