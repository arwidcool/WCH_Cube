      MAC plus a BUILT-IN 10/100M PHY: "Single chip can realize Ethernet communication",
      and "MAC and 100M PHY are fully integrated, and the periphery only needs
      capacitance" (CH32H417DS0.md 1.4.31, 1.2). So the ordinary configuration is the
      internal PHY - four media-dependent pads straight to the magnetics, with no
      MAC-to-PHY interface on pins at all, and nothing to select. RGMII is the OTHER
      supported configuration and the only interface the DS names: it is how an external
      1Gbps PHY is attached, which the DS calls "Optional Ethernet controller MAC +
      external 1Gbps PHY". MII and RMII are deliberately NOT offered. Neither word
      appears anywhere in this part's datasheet - its Ethernet section lists only RGMII -
