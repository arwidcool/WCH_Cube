        help: "R32_ECDC_CTRL RB_ECDC_KLEN_MASK[11:10] (CH32H417RM.md:60754-60766). AES only - SM4 is always 128-bit (RM 41.2). Default matches ECDC_StructInit() (ch32h417_ecdc.c:82)."
