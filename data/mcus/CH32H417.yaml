gpio:
  speeds:
    - { name: Low,       macro: GPIO_Speed_Low }
    - { name: Medium,    macro: GPIO_Speed_Medium }
    - { name: High,      macro: GPIO_Speed_High }
    - { name: Very high, macro: GPIO_Speed_Very_High }
  # All eight members of GPIOMode_TypeDef (ch32h417_gpio.h:32-41) are accounted for:
  # five here and three under input_modes. This part has open-drain in both forms.
  modes:
    - { name: Output Push Pull,              macro: GPIO_Mode_Out_PP, class: out }
    - { name: Output Open Drain,             macro: GPIO_Mode_Out_OD, class: out }
    - { name: Alternate Function Push Pull,  macro: GPIO_Mode_AF_PP,  class: out }
    - { name: Alternate Function Open Drain, macro: GPIO_Mode_AF_OD,  class: out }
    - { name: Analog,                        macro: GPIO_Mode_AIN,    class: analog }
  input_modes:
    - { name: No pull,   macro: GPIO_Mode_IN_FLOATING }
    - { name: Pull-up,   macro: GPIO_Mode_IPU }
    - { name: Pull-down, macro: GPIO_Mode_IPD }

# There is no `constraints:` block. The three shapes were checked against this part's
# sources and none has an instance in the twelve peripherals modelled here: no per-pin
# note on any GPIOMode member in ch32h417_gpio.h, no shorted pin groups on any of the
# three packages (the extractor reports "shorted groups none" for all three), and
# nothing that couples a peripheral's enable state to a pin's legality. The USB and
# SerDes pads are dedicated, not multiplexed GPIO, so they cannot be mis-configured.

# -----------------------------------------------------------------------------
codegen:
  # ch32h417.h, guard __CH32H417_H. Series `ch32h417`, which is also what the
  # PlatformIO board files say: genericCH32H417QEU6.json "spl_series": "ch32h417".
  header: ch32h417.h

  # Claims GPIO_Init must NOT touch. SYS is the default (the debug pair and NRST); RCC is
  # added here because its XI/XO are the HSE crystal pads - dedicated `sys` pins, not
  # AF-selected GPIOs - and GPIO_Init driving an oscillator pin is actively harmful. The
  # coupling itself is `clock.hse_peripheral`/`hse_setting`/`hse_signals`, which is what
  # claims the pins; this keeps them out of the generated GPIO setup.
  # Pads GPIO_Init and GPIO_PinAFConfig must not touch. SYS is the debug pair and RCC the
  # crystal; the three USB controllers are here for the same reason, and the vendor's own
  # driver is the evidence rather than an argument: `USBFS_RCC_Init()` in
  # `EXAM/IAP/USB_UART/CH32H417_APP/Common/USB/ch32h417_usbfs_device.c:54-70` enables
  # `RCC_HBPeriph_OTG_FS` and the GPIOA *clock* and configures no pin at all, and
  # `ch32h417_usbhs_device.c` contains no GPIO call of any kind. The transceivers are
  # hard-wired to their pads - which is also why DS Table 2-1-1 gives those functions no
  # `(AFn)` code. The pins are still CLAIMED, so the conflict engine sees USBHS taking the
  # debug pads; only the GPIO configuration is skipped.
  skip_signals:
    SYS: true
    RCC: true
    USBFS: [DP, DM, VBUS, ID]
    USBHS: [DP, DM]
    USBSS: [TXA, TXB, RXA, RXB]
    # SerDes is the fourth, on the same evidence: DS Table 2-1-1 gives SERDES_TXP/TXN/
    # RXP/RXN on PE3-PE6 no `(AFn)` code, and the vendor's own bring-up never configures
    # those pads. `sds_initial()` in EXAM/SerDes/FullDuxTrans/Common/hardware.c:65-67
    # enables RCC_HBPeriph_SERDES and the GPIOE *clock* and then calls no GPIO_Init for
    # PE3-PE6 at all - the differential pair is driven by the SerDes block, not by the
    # GPIO cell. EXAM/SerDes/AcquireConfig does the same. The pins stay CLAIMED, so the
    # conflict engine still sees SerDes taking PE3-PE6; only the GPIO setup is skipped.
    SERDES: [TXP, TXN, RXP, RXN]
    # ETH's media-dependent pairs, on the same evidence and for the same reason: the pads
    # are driven by the built-in 10/100M PHY, not by the GPIO cell, and DS Table 2-1-1 gives
    # them no (AFn) code. Without this the generator would emit an `af:` TODO for a pad that
    # can never have one. The RGMII signals are NOT here - those are genuine alternate
    # functions with real AF codes and must be configured normally.
    ETH: [MDIRN, MDIRP, MDITN, MDITP]

  # AN ANALOG PAD IS `GPIO_Mode_AIN`, NOT AN ALTERNATE FUNCTION, and without this list the
  # generator could not tell the difference. `analogClaim()` (app/engine/constraints.js:255)
  # reads this table; with no entry it falls back to "an Analog-category peripheral on a
  # pin flagged `analog:`", and this file flags no pin, so the fallback returned false and
  # `gpioEffectiveMode()` took the alternate-function branch: PA4, PB0, PB1 and PC4 came
  # out of the generator as `GPIO_Mode_AF_PP` where the silicon needs `GPIO_Mode_AIN`.
  # Wrong, and it compiles - the defect class this round exists to remove. Evidence and
  # the generated C: tests/evidence/round5/2026-09-12-analog-pads.md.
  #
  # Every line below is what the vendor's own examples do, not an inference from the
  # category:
  #   ADC1/ADC2  EXAM/ADC/ADC_DMA/Common/hardware.c:64-65      GPIO_Mode_AIN
  #   HSADC      EXAM/HSADC/.../Common/hardware.c:31           GPIO_Mode_AIN
  #   DAC        EXAM/DAC/DAC_DMA/Common/hardware.c:35         GPIO_Mode_AIN
  #   OPA        EXAM/OPA/OPA/Common/hardware.c:27,31          GPIO_Mode_AIN
  #   CMP        EXAM/OPA/CMP/Common/hardware.c:34-35          GPIO_Mode_AIN (PB1, PB2)
  #
  # CMP_OUT IS NOT IN THE LIST, and the same file is why: :26-31 gives PB12 GPIO_AF13 and
  # `GPIO_Mode_AF_PP`. The comparator's inputs are analog and its output is a digital
  # alternate function, so listing `OUT` here would take an AF code off a pad that needs
  # one. This is exactly the distinction the fallback cannot make, and the reason the
  # list is authoritative rather than a hint.
  #
  # SERDES is not here either - see `skip_signals:` above: those pads take no GPIO
  # configuration of any kind, analog or otherwise.
  # The SPL macro for each channel a `checkboxes` row can tick, for `sdk_repeat: channels`.
  # KEYED BY THE CHOICE NAME, not by the signal: `selectedChannels()` in
  # app/engine/codegen.js reads the ticked CHOICE names out of the settings, which is why
  # the two internal channels appear here under their full labels - they have no pad and
  # therefore no signal, and a ticked box with no macro is a TODO in the generated C.
  # ch32h417_adc.h:83-100 defines ADC_Channel_0..17, with ADC_Channel_16 aliased
  # ADC_Channel_TempSensor and ADC_Channel_17 aliased ADC_Channel_Vrefint (:102-103); the
  # numeric spelling is used so the list reads as the sequence the datasheet numbers.
  channel_macros:
    ADC1: { IN0: ADC_Channel_0, IN1: ADC_Channel_1, IN2: ADC_Channel_2, IN3: ADC_Channel_3,
            IN4: ADC_Channel_4, IN5: ADC_Channel_5, IN6: ADC_Channel_6, IN7: ADC_Channel_7,
            IN8: ADC_Channel_8, IN9: ADC_Channel_9, IN10: ADC_Channel_10, IN11: ADC_Channel_11,
            IN12: ADC_Channel_12, IN13: ADC_Channel_13, IN14: ADC_Channel_14, IN15: ADC_Channel_15,
            "IN16 (temperature sensor, internal)": ADC_Channel_16,
            "IN17 (internal reference voltage, internal)": ADC_Channel_17 }
    ADC2: { IN0: ADC_Channel_0, IN1: ADC_Channel_1, IN2: ADC_Channel_2, IN3: ADC_Channel_3,
            IN4: ADC_Channel_4, IN5: ADC_Channel_5, IN6: ADC_Channel_6, IN7: ADC_Channel_7,
            IN8: ADC_Channel_8, IN9: ADC_Channel_9, IN10: ADC_Channel_10, IN11: ADC_Channel_11,
            IN12: ADC_Channel_12, IN13: ADC_Channel_13, IN14: ADC_Channel_14, IN15: ADC_Channel_15,
            "IN16 (temperature sensor, internal)": ADC_Channel_16,
            "IN17 (internal reference voltage, internal)": ADC_Channel_17 }

  analog_signals:
    ADC1: [IN0, IN1, IN2, IN3, IN4, IN5, IN6, IN7, IN8, IN9, IN10, IN11, IN12, IN13, IN14, IN15]
    ADC2: [IN0, IN1, IN2, IN3, IN4, IN5, IN6, IN7, IN8, IN9, IN10, IN11, IN12, IN13, IN14, IN15]
    HSADC: [IN0, IN1, IN2, IN3, IN4, IN5, IN6]
    DAC: [OUT1, OUT2]
    OPA: [P01, P02, P03, P11, P12, P13,
          N01, N02, N03, N11, N12, N13,
          OUT01, OUT02, OUT03, OUT11, OUT12, OUT13]
    CMP: [P0, P1, N0, N1]
  sdk:
    evt: H417
    series: ch32h417

  # The SDK does not spell the clock-refresh call the same way on every family, and
  # this part is the one that differs: System/ch32h417/{v3f,v5f}/system_ch32h417.h
  # declares `SystemAndCoreClockUpdate` - it refreshes BOTH cores - where every other
  # family here declares `SystemCoreClockUpdate`. The generated main.c reads this key,
  # so no part is named in app/engine/. Omitting it means the usual name.
  clock_update_fn: SystemAndCoreClockUpdate

  # printf over the WCH-Link SDI channel costs no pin and is what every other part's
  # generated main.c uses. **This part's Debug folder does not have it**: the whole of
  # framework-wch-noneos-sdk/Debug/ch32h417/debug.h is one printf entry point,
  # `USART_Printf_Init(uint32_t baudrate)`, which claims a USART and therefore two
  # pins. An empty value means "this part has no SDI printf", and the generator emits
  # a comment saying so instead of a call that would fail to link.
  sdi_printf_fn: ""

  # HB2, not PB2 and not APB2. This is the FOURTH spelling of the port clock enable in
  # four families - CH32V003 says APB2, CH32V005/V006 say PB2, CH32X035 says APB2, and
  # this part says HB2 (ch32h417_rcc.h:248-255, RCC_HB2PeriphClockCmd at :650).
  gpio_clock: { fn: RCC_HB2PeriphClockCmd, port: RCC_HB2Periph_GPIO$PORT, afio: RCC_HB2Periph_AFIO }

  speeds:
    Low:         GPIO_Speed_Low
    Medium:      GPIO_Speed_Medium
    High:        GPIO_Speed_High
    "Very high": GPIO_Speed_Very_High

  # THE THIRD REMAP STYLE. `register` writes an AFIO field per peripheral, `macro`
  # calls GPIO_PinRemapConfig per peripheral, and `af` calls GPIO_PinAFConfig per PIN.
  # `fields:` is deliberately absent and the validator rejects it alongside `style: af`:
  # this part's AFIO_PCFR1 still exists, but it carries only PD0_1_REMAP, UHSIF_CLK_RM,
  # the PIOC port map and four ADC trigger-SOURCE bits (TIM8 vs EXTI, not a pin), none
  # of which is peripheral pin muxing.
  remap:
    style: af
    fn: GPIO_PinAFConfig          # (GPIOx, GPIO_PinSource<n>, GPIO_AF<n>) - ch32h417_gpio.h:160
    macro: GPIO_AF$AF             # GPIO_AF0..GPIO_AF15 - ch32h417_gpio.h:129-145

  # RCC_CFGR0 - RM 3.4.2, offset 0x04, reset 0x00000000. Only the two fields the clock
  # tab below actually offers are encoded; the PLL, PPRE1/PPRE2 and the ADC muxes are
  # absent because the tree that would drive them is not modelled. The generator writes
  # what it is given and reports what it is not, so a missing field is a named TODO
  # rather than a wrong bit.
  rcc:
    register: "RCC->CFGR0"
    sw: { lsb: 0, bits: 2, values: { HSI: 0, HSE: 1, PLLCLK: 2 } }     # SW[1:0]; 11 is "not available"
    prescalers:
      # HPRE[3:0], and the run is NOT the CH32V00x one. Codes 0xxx all mean "no
      # prescaling", then 1000..1111 are /2, /4, /8, /16, /64, /128, /256, /512 -
      # **there is no /32**, the sequence jumps 16 to 64. Reading it as a doubling run
      # would put /32 on code 1100 and silently run the bus at half the asked-for speed.
      HB: { lsb: 4, bits: 4,
            values: { 1: 0, 2: 8, 4: 9, 8: 10, 16: 11, 64: 12, 128: 13, 256: 14, 512: 15 } }

  # Which SDK function applies each init struct, and what it applies it TO. The
  # generator refuses to derive a function name from a struct name, and I3C is why
  # that rule keeps earning its place here: `I3C_Ctrl_BusTypeDef` is applied by
  # `I3C_Ctrl_Init`, which takes the struct ALONE - there is no handle argument, the
  # same shape OPA_Init has on CH32V006. Every line below is from the EVT headers.
  init_structs:
    GPIO_InitTypeDef:        { fn: GPIO_Init }          # ch32h417_gpio.h:148
    USART_InitTypeDef:       { fn: USART_Init }         # ch32h417_usart.h:184
    SPI_InitTypeDef:         { fn: SPI_Init }           # ch32h417_spi.h:198
    I2C_InitTypeDef:         { fn: I2C_Init }           # ch32h417_i2c.h:302
    ADC_InitTypeDef:         { fn: ADC_Init }          # ch32h417_adc.h:174
    # `no_handle: true` is the data saying the Init takes the struct ALONE - these three
    # peripherals are singletons on this part, so their base address is compiled into the
    # SDK function rather than passed to it. Getting this wrong is not a compile error on
    # one side: `DVP_Init(DVP, &s)` would fail to build, but omitting the flag makes the
    # generator emit `DVP_Init(<nothing>, &s)` as a TODO instead of the call.
    DVP_InitTypeDef:         { fn: DVP_Init,   no_handle: true }   # ch32h417_dvp.h:115
    LTDC_InitTypeDef:        { fn: LTDC_Init,  no_handle: true }   # ch32h417_ltdc.h:220
    SDIO_InitTypeDef:        { fn: SDIO_Init,  no_handle: true }   # ch32h417_sdio.h:232
    HSADC_InitTypeDef:       { fn: HSADC_Init, no_handle: true }   # ch32h417_hsadc.h:95
    # I2S_Init takes a SPI_TypeDef*, not an I2S one - the I2S is a MODE of the SPI block,
    # not a peripheral beside it (ch32h417_spi.h:199). So I2S2's handle is SPI2 and I2S3's
    # is SPI3, which is also why turning both halves of one block on at once is a
    # configuration the silicon cannot honour: one register set, two personalities.
    I2S_InitTypeDef:         { fn: I2S_Init }                      # ch32h417_spi.h:199
    # The LAYER struct is not in this table on purpose. It is applied per INSTANCE, so its
    # function and handle come from `channel_params.instances` - LTDC_LayerInit with
    # LTDC_Layer1 or LTDC_Layer2 (ch32h417_ltdc.h:225, ch32h417.h:1770-1771) - and an entry
    # here would be a second, unused answer to the same question.
    IPC_InitTypeDef:         { fn: IPC_Init,   no_handle: true }   # ch32h417_ipc.h:80
    SWPMI_InitTypeDef:       { fn: SWPMI_Init, no_handle: true }   # ch32h417_swpmi.h:78
    TIM_TimeBaseInitTypeDef: { fn: TIM_TimeBaseInit }   # ch32h417_tim.h:465
    # TIM9-TIM12 have their OWN time-base struct and their own init function, and this is
    # the line that keeps the two apart. ch32h417_tim.h:125-141 defines
    # TIM9_12_TimeBaseInitTypeDef with a 32-bit TIM_Period and no TIM_RepetitionCounter;
    # :556 declares TIM9_12_TimeBaseInit(), which writes ATRLR_32 where TIM_TimeBaseInit()
    # writes the 16-bit ATRLR - and whose CTLR1 guard names TIM1/2/3/4/5/8 only, so
    # passing a TIM9 through it would set no counter mode at all.
    TIM9_12_TimeBaseInitTypeDef: { fn: TIM9_12_TimeBaseInit }   # ch32h417_tim.h:556
    I3C_Ctrl_BusTypeDef:     { fn: I3C_Ctrl_Init, no_handle: true }   # ch32h417_i3c.h:400
    # QSPI splits interface config from per-command config into TWO structs, both taking
    # the same handle (unlike FMC, neither is reached only through a pointer inside the
    # other): QSPI_Init (ch32h417_qspi.h:107) and QSPI_ComConfig_Init (:108).
    QSPI_InitTypeDef:          { fn: QSPI_Init }            # ch32h417_qspi.h:107
    QSPI_ComConfig_InitTypeDef: { fn: QSPI_ComConfig_Init }  # ch32h417_qspi.h:108
    # SDMMC_Init takes the struct ALONE - this part has one SDMMC controller, so no
    # register-block pointer is passed (ch32h417_sdmmc.h:250).
    SDMMC_InitTypeDef:       { fn: SDMMC_Init, no_handle: true }   # ch32h417_sdmmc.h:250
    # FMC_NORSRAMInit takes the struct ALONE - the bank is a member, not an argument
    # (ch32h417_fmc.h:425). The two `FMC_NORSRAMTimingInitTypeDef*` members are reached
    # only by being pointed at from here, which is AGENT-2's `embed:` contract
    # (agents/BOARD.md 2026-09-13T19:07Z): the child struct's OWN init_structs entry
    # names which outer struct/member each embed key plugs into, instead of a `fn:`.
    FMC_NORSRAMInitTypeDef:  { fn: FMC_NORSRAMInit, no_handle: true }   # ch32h417_fmc.h:425
    FMC_NORSRAMTimingInitTypeDef:
      embed:
        rw: { into: FMC_NORSRAMInitTypeDef, member: FMC_ReadWriteTimingStruct }   # ch32h417_fmc.h:113
        wr: { into: FMC_NORSRAMInitTypeDef, member: FMC_WriteTimingStruct }       # ch32h417_fmc.h:115

  periph_handle:
    USART1: USART1
    USART2: USART2
    USART3: USART3
    # USART4-8, SPI3-4 and I2C3-4 got their `params:` this cycle, and a `params:` block
    # without a handle here is not half a feature - the generator emits
    # `/* TODO: nothing applies this struct */` beside a filled-in struct, which is
    # worse than no rows at all. Every name below is a define in ch32h417.h:
    # USART4/5 at :1738-1739, USART6/7/8 at :1724-1726, SPI3/4 at :1734-1735,
    # I2C3 at :1742 and I2C4 at :1767 - all `(USART_TypeDef *)` / `(SPI_TypeDef *)` /
    # `(I2C_TypeDef *)`, so USART_Init / SPI_Init / I2C_Init take them unchanged.
    USART4: USART4
    USART5: USART5
    USART6: USART6
    USART7: USART7
    USART8: USART8
    SPI1:   SPI1
    SPI2:   SPI2
    SPI3:   SPI3
    SPI4:   SPI4
    I2C1:   I2C1
    I2C2:   I2C2
    I2C3:   I2C3
    I2C4:   I2C4
    I3C:    I3C
    QSPI1:  QSPI1   # ch32h417.h:1815, (QSPI_TypeDef *)
    QSPI2:  QSPI2   # ch32h417.h:1816, (QSPI_TypeDef *)
    TIM1:   TIM1
    TIM2:   TIM2
    TIM3:   TIM3
    TIM4:   TIM4
    # ch32h417.h:1718-1723 (TIM2-TIM7), :1762/:1764/:1766 (TIM1, TIM8, TIM12) and
    # :1772-1774 (TIM9-TIM11): every one is a `(TIM_TypeDef *)`, including TIM9-TIM12,
    # whose SEPARATE init function TIM9_12_TimeBaseInit() also takes a TIM_TypeDef*. One
    # handle name per instance; which struct goes with it is init_structs' business.
    TIM5:   TIM5
    TIM6:   TIM6
    TIM7:   TIM7
    TIM8:   TIM8
    TIM9:   TIM9
    TIM10:  TIM10
    TIM11:  TIM11
    TIM12:  TIM12
    # ADC1/ADC2 are `(ADC_TypeDef *)` at ch32h417.h:1758-1759. The handle is needed twice
    # over here, and the second use is the one that is easy to forget: ADC's sampling time
    # is not a struct member but the first argument of ADC_RegularChannelConfig(ADCx, ...),
    # so without this key the per-channel calls are TODOs as well as the init struct.
    ADC1:   ADC1
    ADC2:   ADC2
    # LPTIM_TimeBaseInit(LPTIMx, &s) - ch32h417.h:1727 and :1732, both `(LPTIM_TypeDef *)`.
    LPTIM1: LPTIM1
    LPTIM2: LPTIM2
    I2S2:   SPI2
    I2S3:   SPI3

  # Which enable register each peripheral's clock bit lives in. Generated from
  # ch32h417_rcc.h: every RCC_HB*Periph_* macro, with the bit taken as log2 of its
  # value rather than read off a table - 73 macros is 73 chances to misread a bit
  # position, and a wrong bit turns the clock on for a DIFFERENT peripheral, which
  # on the board is a peripheral that does nothing for no stated reason.
  #
  # Three buses, three registers, three SPL functions (RM 3.4.7-3.4.9).
  #
  # NOTE the two peripherals whose bit is spelled differently in the SPL. The bit's key
  # is the PERIPHERAL name, because that is what codegen looks up (`clockBitOf('USBFS')`)
  # and what `validate_mcu.py` checks the key against. The macro is built from the key by
  # default, which is wrong for exactly two of them: the USB full-speed controller is the
  # peripheral `USBFS` but its bit is `RCC_HBPeriph_OTG_FS`, and `OPA` and `CMP` share the
  # `RCC_HB2Periph_OPCM` gate (RM ch.35 covers both in one block). So the domain carries
  # `sdk:` mapping the peripheral to the suffix the SPL actually defines. Keying these two
  # by their SPL spelling instead - which is what this file did first - left
  # `clockBitOf('USBFS')` finding nothing, so the generated C never enabled the USB clock
  # and said so only in a comment.
  #
  # I2S2 and I2S3 are the same shape and were found by the round-6 peripheral-map audit
  # in exactly that failure mode: they had no bit at all, so switching either on emitted
  # `I2S_Init(SPI2, &s)` under the comment "I2S2 has no clock enable bit in
  # codegen.periph_clock - none is written". It compiled and would have done nothing on
  # silicon. The I2S is a MODE of the SPI block, not a unit beside it (RM ch.23 is
  # "SPI/I2S"), so it shares the SPI's gate the way OPA and CMP share OPCM's - which is
  # what the EVT does, one line above its own I2S_Init:
  # `RCC_HB1PeriphClockCmd(RCC_HB1Periph_SPI2, ENABLE);`
  # (data/sources/H417/Evt/EXAM/DFSDM/DFSDM_I2S_Audio/Common/hardware.c:103, beside
  # :111 `I2S_Init(SPI2, &I2S_InitStructure)`). The bits are therefore SPI2's 14 and
  # SPI3's 15, deliberately duplicated under the I2S keys rather than aliased, because
  # `clockBitOf()` looks the PERIPHERAL up by name and there is no second lookup.
  #
  # RTC has NO entry here and that is not an absence - see the `notes:` on the RTC
  # peripheral. Its gate is two bits, `RCC_HB1Periph_PWR | RCC_HB1Periph_BKP`
  # (data/sources/H417/Evt/EXAM/RTC/RTC_Calendar/Common/hardware.c:94), and `bits:` maps
  # one peripheral to one bit. Writing BKP alone would be a half-enable that reads like a
  # whole one. TASKS.md carries it; REQUEST to AGENT-2 for the schema.
  periph_clock:
    HB: { register: RCC_HBPCENR, fn: RCC_HBPeriphClockCmd, prefix: RCC_HBPeriph_,
           sdk: { USBFS: OTG_FS },
           bits: { DMA1: 0, DMA2: 1, CRC: 6, FMC: 8, RNG: 9, SDMMC: 10, USBHS: 11, USBSS: 12, DVP: 13,
                   ETH: 14, USBFS: 17, UHSIF: 18, USBPD: 19, SERDES: 20, PIOC: 22 } }
    HB1: { register: RCC_HB1PCENR, fn: RCC_HB1PeriphClockCmd, prefix: RCC_HB1Periph_,
           sdk: { I2S2: SPI2, I2S3: SPI3 },
           bits: { TIM2: 0, TIM3: 1, TIM4: 2, TIM5: 3, TIM6: 4, TIM7: 5, USART6: 6, USART7: 7, USART8: 8,
                   LPTIM1: 9, LPTIM2: 10, WWDG: 11, QSPI1: 12, QSPI2: 13, SPI2: 14, SPI3: 15, SPI4: 16,
                   I2S2: 14, I2S3: 15,
                   USART2: 17, USART3: 18, USART4: 19, USART5: 20, I2C1: 21, I2C2: 22, CAN3: 24, CAN1: 25,
                   CAN2: 26, BKP: 27, PWR: 28, DAC: 29, I2C3: 30, SWPMI: 31 } }
    HB2: { register: RCC_HB2PCENR, fn: RCC_HB2PeriphClockCmd, prefix: RCC_HB2Periph_,
           sdk: { OPA: OPCM, CMP: OPCM },
           bits: { AFIO: 0, HSADC: 1, GPIOA: 2, GPIOB: 3, GPIOC: 4, GPIOD: 5, GPIOE: 6, GPIOF: 7, ADC1: 9,
                   ADC2: 10, TIM1: 11, SPI1: 12, TIM8: 13, USART1: 14, I2C4: 15, SAI: 16, SDIO: 18,
                   TIM9: 19, TIM10: 20, TIM11: 21, TIM12: 22, OPA: 23, CMP: 23, DFSDM: 25, ECDC: 26,
                   GPHA: 27, LTDC: 30, I3C: 31 } }

# -----------------------------------------------------------------------------
# Clock tree. HSI and HSE are both 25 MHz on this part (ch32h417.h:23 and :29,
# HSE_VALUE and HSI_VALUE, both 25000000) - not the 24 MHz every CH32V00x uses.
# SYSCLK tops out at 400 MHz on the V5F core and 160 MHz on the V3F.
clock:
  sources:
    HSI: { mhz: 25, fixed: true }
    HSE: { mhz: 25, min_mhz: 4, max_mhz: 25 }
    LSI: { khz: 40, fixed: true }
    LSE: { khz: 32.768, fixed: true }

  # The SYS PLL - RM 3.4.3 (RCC_PLLCFGR). PLLSRC picks the source and PLL_SRC_DIV is ONE
  # shared 6-bit divider (1..64) in front of it, so the CHOICE is the (source, divider)
  # pair. That is why each divider is its own `inputs:` entry: the engine's `pllIn` index
  # drives both mux and divider, and listing the pair is the only way the schema says it.
  pll:
    inputs:
      - { name: "HSI /1", source: HSI, div: 1 }
      - { name: "HSI /2", source: HSI, div: 2 }
      - { name: "HSI /3", source: HSI, div: 3 }
      - { name: "HSI /4", source: HSI, div: 4 }
      - { name: "HSI /5", source: HSI, div: 5 }
      - { name: "HSI /6", source: HSI, div: 6 }
      - { name: "HSI /7", source: HSI, div: 7 }
      - { name: "HSI /8", source: HSI, div: 8 }
      - { name: "HSI /10", source: HSI, div: 10 }
      - { name: "HSI /12", source: HSI, div: 12 }
      - { name: "HSI /16", source: HSI, div: 16 }
      - { name: "HSI /20", source: HSI, div: 20 }
      - { name: "HSI /24", source: HSI, div: 24 }
      - { name: "HSI /32", source: HSI, div: 32 }
      - { name: "HSI /48", source: HSI, div: 48 }
      - { name: "HSI /64", source: HSI, div: 64 }
      - { name: "HSE /1", source: HSE, div: 1 }
      - { name: "HSE /2", source: HSE, div: 2 }
      - { name: "HSE /3", source: HSE, div: 3 }
      - { name: "HSE /4", source: HSE, div: 4 }
      - { name: "HSE /5", source: HSE, div: 5 }
      - { name: "HSE /6", source: HSE, div: 6 }
      - { name: "HSE /7", source: HSE, div: 7 }
      - { name: "HSE /8", source: HSE, div: 8 }
      - { name: "HSE /10", source: HSE, div: 10 }
      - { name: "HSE /12", source: HSE, div: 12 }
      - { name: "HSE /16", source: HSE, div: 16 }
      - { name: "HSE /20", source: HSE, div: 20 }
      - { name: "HSE /24", source: HSE, div: 24 }
      - { name: "HSE /32", source: HSE, div: 32 }
      - { name: "HSE /48", source: HSE, div: 48 }
      - { name: "HSE /64", source: HSE, div: 64 }
    multipliers: [4, 6, 7, 8, 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12, 12.5, 13, 14, 15, 16, 17, 18, 19, 20, 22, 24, 26, 28, 30, 32, 34, 36, 38, 40, 59]

  sysclk: { sources: [HSI, HSE, PLLCLK], max_mhz: 400 }

  # ---- the secondary PLLs (RM 3.3.4) ----------------------------------------------
  # One of the five is modelled. The other four (ETH, USBSS, SERDES, and the three other
  # USBHS_PLL inputs) are declared in `notes:` below with the RM line that blocks each,
  # because modelling them needs a thing the schema cannot say yet.
  plls:
    USBHS_PLL:
      # Kept SHORT on purpose: the clock tree has no horizontal headroom at 1280x720
      # @125% - see the FINDING to AGENT-2 of 2026-09-13T02:10Z, closed by AGENT-2's
      # row-packing fix to renderClock() (agents/BOARD.md 2026-09-13T19:07Z: 1105px ->
      # 898px measured in real Chrome, 126px of margin). The RM name and the 480 MHz are
      # in `notes:` and in the comment below, where length costs nothing.
      label: USBHS PLL
      output: USBHS_PLL_CLK
      # FIXED by the silicon, not a multiplier the user picks: RM:1733 and :1806-1811.
      output_mhz: 480
      # ONE input, and the reason is USBHSPLL_REFSEL[1:0] (RM:4266-4274), which tells the
      # PLL what frequency its reference actually is: 00=25MHz 01=20MHz 10=24MHz 11=32MHz.
      # RM:1808 - "the clock frequency MUST MATCH the USBHS_PLL input clock". So 480 MHz
      # is CONDITIONAL on the reference selection agreeing with the real input, and the
      # three inputs left out are exactly the three where the file cannot guarantee it:
      #
      #   HSE       - editable 4..25 MHz (`sources.HSE`), and REFSEL encodes only
      #               20/24/25/32. HSE at 8 MHz is a legal setting on this part and
      #               there is no REFSEL code for it, so the PLL would not lock while
      #               the tab printed 480.
      #   SYS_PLL/N - USBHSPLL_IN_DIV[4:0] /1../32 of PLLCLK (RM:4227). PLLCLK moves
      #               with the user's own SYS PLL settings, so the same problem, one
      #               level further down.
      #   ETHCLK_20M- 20 MHz and would satisfy REFSEL=01, but it comes off the ETH PLL
      #               (RM:1392-1394), which this file does not model yet. It lands with
      #               the ETH PLL, not before.
      #
      # HSI is `fixed: true` at 25 MHz, so REFSEL=00 is correct for it unconditionally
      # and 480 MHz is simply true. Round 5's rule, applied literally: every choice the
      # app offers must be one the silicon can honour - so the app offers the one choice
      # it can honour, and the rest are declared here rather than shipped as a number
      # that is right only by luck.
      inputs:
        - { name: HSI, source: HSI, div: 1 }

  hse_peripheral: RCC
  hse_setting: High Speed Clock (HSE)
  hse_signals: [XI, XO]

  prescalers:
    # RCC_CFGR2's USBFS 48M tap (RM 3.4.13): USBHS_PLL_CLK or PLLCLK, divided down to the
    # 48 MHz USB full-speed clock. The only one of the eight RM 3.4.13 muxes this file can
    # compute today, because it is the only secondary PLL modelled above.
    USBFS:
      label: USBFS 48M
      source: [USBHS_PLL_CLK, PLLCLK]
      options: [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6, 6.5, 7.5, 8, 9.5, 10]
      default: 10
      default_source: USBHS_PLL_CLK
      target_mhz: 48
    # HPRE[3:0] - RM 3.4.2. **NOT a doubling run.** 0xxx = /1, then /2 /4 /8 /16 /64 /128
    # /256 /512: there is NO /32, so reading it as a doubling run puts /32 on code 1100
    # and halves every bus silently. That warning is in CH32H417.notes.md; this is the
    # same fact written where the engine reads it.
    HB:
      options: [1, 2, 4, 8, 16, 64, 128, 256, 512]
      max_mhz: 400
      label: "HB prescaler (HPRE) -> HCLK"
    # FPRE[1:0] - RM 3.4.2, the divider to CORE1 (the RISC-V5F core).
    FPRE:
      options: [1, 2, 4]
      source: HB
      label: "CORE1 prescaler (FPRE) -> the V5F core clock"
    # PPRE2[2:0] - RM 3.4.2, configures the PB2/HB2 bus. It ALSO serves as the low three
    # bits of the ADC prescaler when the ADC is clocked from USBHS_PLL, which is why the
    # ADC entry below spells out the HCLK half separately.
    HB2:
      options: [1, 2, 4, 8, 16]
      source: HB
      label: "APB2 prescaler (PPRE2) -> HB2 peripherals"
    # ADCPRE[1:0] + PPRE2[2:0] with HCLK as the source: /2 /4 /6 /8 (RM 3.4.2).
    ADC:
      options: [2, 4, 6, 8]
      source: HB
      max_mhz: 80
      label: "ADC prescaler (ADCPRE + PPRE2, HCLK source)"

  # Bus membership from those same three registers. A peripheral in the wrong list makes
  # its USART baud readout and its timer frequency wrong - numbers the UI prints as fact.
  buses:
    HB:
      - CRC
      - DMA1
      - DMA2
      - DVP
      - ETH
      - FMC
      - GPIO
      - PIOC
      - RNG
      - SDMMC
      - SERDES
      - UHSIF
      - USBHS
      - USBPD
      - USBSS
    HB1:
      - CAN1
      - CAN2
      - CAN3
      - DAC
      - I2C1
      - I2C2
      - I2C3
      - LPTIM1
      - LPTIM2
      - PWR
      - QSPI1
      - QSPI2
      - SPI2
      - SPI3
