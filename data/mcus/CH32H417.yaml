    request_notes:
      TIM: >
        Every TIMx_CH*/UP/COM/TRIG request defaults to Memory to peripheral, Half Word,
        confirmed on THIS part (not carried over from another): DoubleBuffer_DMA's
        TIM1_DMA_Init (Common/hardware.c:111-112) sets
        DMA_PeripheralDataSize_HalfWord/DMA_MemoryDataSize_HalfWord for a TIM1 channel
        feeding TIM1_CH2CVR. Input capture is the same request line read the other way;
        nothing in the data can decide which the user wants, so the default is the
        common (PWM/compare) case and the user flips `dir` for capture.
      SPI: >
        Half Word on both sides, confirmed on THIS part - SPI_DMA/Common/hardware.c:144-145,178-179.
      I2C: >
        Byte on both sides, confirmed on THIS part - I2C_DMA/Common/hardware.c:97-98,131-132.
