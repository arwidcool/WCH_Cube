    notes: >
      `IV` is not modelled - see the peripheral comment above: `ECDC_Init()` null-checks
      it before use, so leaving it unset is the SDK's own safe "not using CTR yet"
      state, unlike `Key` (embedded above, all placeholder zeros). `ECDC_SetKey()`
      is applied automatically by the embed; `ECDC_CTR_SetCounter()` is not modelled,
      for the same reason `IV`'s VALUE is not - real material, supplied by the
      application.
