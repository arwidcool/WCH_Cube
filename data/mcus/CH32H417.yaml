  SWPMI:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: "Single wire", signals: [IO] }
          - { name: "Single wire with supply", signals: [IO, SUP] }
          - { name: Loopback, signals: [IO, RX, TX] }
    signal_pins:
      IO: [{ pin: PC6, af: 11 }]
      RX: [{ pin: PC10, af: 11 }, { pin: PC8, af: 11 }]
      SUP: [{ pin: PC9, af: 11 }]
      TX: [{ pin: PC7, af: 11 }]
    params:
      - key: bitrate
        name: Bit rate divider
        struct: SWPMI_InitTypeDef
        sdk_field: BitRate
        type: int
        default: 0
        min: 0
        max: 255
        help: >
          SWPMI_BRR. The header states the relation rather than the frequency:
          SWPMI_freq = SWPMI_clk / ((BitRate + 1) * 4), with the resulting rate required to
          land between 100 kbit/s and 2 Mbit/s (ch32h417_swpmi.h:24-27). It is a DIVIDER
          and not a bit rate, which is why this row is a small integer; the clock tree that
          would let the tool compute the rate for you is not modelled on this part yet.
      - key: txbuf
        name: Transmit buffering
        struct: SWPMI_InitTypeDef
        sdk_field: TxBufferingMode
        type: enum
        default: None
        options:
          - { name: "None"  , value: 0, sdk: SWPMI_TxMode_Buffering_None }
          - { name: Single  , value: 2, sdk: SWPMI_TxMode_Buffering_Single }
          - { name: Multiple, value: 10, sdk: SWPMI_TxMode_Buffering_Multi }
        help: "ch32h417_swpmi.h:41-43. The `value:` figures are the macros' own encodings (0x0 / 0x2 / 0xA), which are NOT a dense 0/1/2 enum."
      - key: rxbuf
        name: Receive buffering
        struct: SWPMI_InitTypeDef
        sdk_field: RxBufferingMode
        type: enum
        default: None
        options:
          - { name: "None"  , value: 0, sdk: SWPMI_RxMode_Buffering_None }
          - { name: Single  , value: 1, sdk: SWPMI_RxMode_Buffering_Single }
          - { name: Multiple, value: 5, sdk: SWPMI_RxMode_Buffering_Multi }
        help: "ch32h417_swpmi.h:46-48. Encodings 0x0 / 0x1 / 0x5, again not dense."
      - key: loopback_off
        name: Loopback
        struct: SWPMI_InitTypeDef
        sdk_field: LoopBackMode
        const: DISABLE
        depends_on: { setting: Mode, ne: Loopback }
        help: "ch32h417_swpmi.h:34. Fixed by the Mode row: a live single-wire link is not in loopback."
      - key: loopback_on
        name: Loopback
        struct: SWPMI_InitTypeDef
        sdk_field: LoopBackMode
        const: ENABLE
        depends_on: { setting: Mode, equals: Loopback }
        help: "ch32h417_swpmi.h:34. Fixed by the Mode row: the transceiver is looped back for self-test and the pad carries nothing."
  TIM10:
    category: Timers
    settings:
      - name: Channel1
