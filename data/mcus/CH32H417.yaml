          does not use and cannot release. Defaulted to 32-bit because that is what the
          claim currently matches, and because it is what the EVT example uses
          (ch32h417_uhsif.c:35). Splitting the claim per width needs the pad table named
          in the Data pin mapping row above. FINDING on the board 2026-09-13T02:00Z.
