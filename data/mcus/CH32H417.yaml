# =============================================================================
#  CH32H417 - extracted from CH32H417/H416/H415 Datasheet V1.8 (DS), CH32H417
#  Reference Manual V1.7 (RM) and the EVT package, all under data/sources/H417/.
#
#  THIS IS THE FIRST AF-MUXED PART IN THE REPO, and it is why `signal_pins:` and
#  `codegen.remap.style: af` exist. Every other part here moves a whole peripheral's
#  pins with ONE register field (CH32V003/V005/V006) or ONE macro call (CH32X035).
#  This one gives every PIN four bits in `GPIOx_AFRL`/`AFRH` - `AFRy[3:0]` = AF0..AF15,
#  RM 9.3.2.2, applied by `GPIO_PinAFConfig` - so each signal picks its pin ALONE.
#  A `remaps:` list cannot express that: 70 % of this part's 418 signals reach more
#  than one pin, and enumerating the legal combinations would need 8.5e20 entries.
#  `python tools/extract_h417_pins.py --audit` prints the measurement.
#
#  The `packages:`, `pins:` and `signal_pins:` blocks below are EMITTED by
#  `tools/extract_h417_pins.py --yaml`, not transcribed. 284 package assignments and
#  950 pin-AF pairs cannot be hand-copied without an error, and an error here is
#  invisible: a wrong AF code compiles and the pin carries the wrong function.
#  Re-emit and diff after any change to the datasheet.
#
#  SCOPE. This part has ~47 peripheral families and a 68,330-line reference manual.
#  Twelve connectivity and timer peripherals are modelled here - enough to exercise
#  the mechanism on real silicon across five ports and AF codes 1..14. Everything
#  else is listed as absent-by-omission in data/mcus/CH32H417.notes.md rather than
#  half-modelled. See that file before adding to this one.
# =============================================================================

mcu:
  name: CH32H417
  vendor: WCH
  family: CH32H41x
  # DUAL CORE, and `core:` has room for one name. DS "Feature": "Dual-core structure:
  # QingKe RISC-V5F and RISC-V3F", "V5F up to 400MHz, V3F up to 160MHz". PlatformIO
  # models the split as separate board files per package (`_V5F` / `_V3F`), and how
  # this file should express it is an open question in the notes - so both cores are
  # named here rather than one being silently dropped.
  core: QingKe RISC-V5F (400 MHz) + RISC-V3F (160 MHz)
  flash_kb: 960
  sram_kb: 896
  vdd_v: [3.0, 3.6]
  max_sysclk_mhz: 400
  default_package: QFN128
  # DS p.1 model table for the resources; DS ch.4 ordering table and DS Table 2-1-1
  # for the part numbers. THE TWO DISAGREE about which family MEU6 and WEU6 belong to
  # - the model table calls them CH32H416 - and the disagreement is 3 sources to 1:
  # Table 2-1-1 is titled "CH32H417 Pin definitions" with columns H417WEU6/MEU6/QEU6,
  # ch.4 names them CH32H417MEU6/WEU6, and PlatformIO ships genericCH32H417{Q,M,W}EU6.
  # Recorded in full in the notes; AGENT-1 owns the final call.
  #
  # io_count is the model table's own "GPIO port number" row, and all three match the
  # extracted pin tables exactly (95 / 65 / 50) - which is what caught a parser bug in
  # the extractor rather than the other way round.
  variants:
    CH32H417QEU6: { package: QFN128, flash_kb: 960, sram_kb: 896, temp: 85, io_count: 95, pio_board: genericCH32H417QEU6 }
    CH32H417MEU6: { package: QFN88,  flash_kb: 960, sram_kb: 896, temp: 85, io_count: 65, pio_board: genericCH32H417MEU6,
                    notes: "DS p.1 calls this CH32H416MEU6; DS Table 2-1-1, DS ch.4 and PlatformIO all call it CH32H417. Unresolved - see the notes file." }
    CH32H417WEU6: { package: QFN68,  flash_kb: 960, sram_kb: 896, temp: 85, io_count: 50, pio_board: genericCH32H417WEU6,
                    notes: "Same naming disagreement as MEU6. No SDIO, no USBFS and one QSPI on this package (DS p.1 resource table)." }

