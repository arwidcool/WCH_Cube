  RCC:
    category: System Core
    # The HSE choice names match `clock.hse_setting` / `clock.hse_signals` above, so
    # picking HSE as a clock source switches the crystal on through the normal conflict
    # engine and claims XI/XO on the chip - the coupling CH32V006 established.
    #
    # `Hardware reset pin` is absent on purpose: unlike CH32V00x there is no RST_MODE
    # option byte here. NRST is its own pad (DS Table 2-1-1) rather than a GPIO that can
    # be reassigned, so there is no choice to offer.
    settings:
      - name: High Speed Clock (HSE)
        choices:
          - { name: Disable, default: true }
          - { name: BYPASS clock source }
          - { name: Crystal / ceramic resonator, signals: [XI, XO] }
      - name: Master Clock Output (MCO)
        # RM 3.4.2 MCO[3:0]: 00xx none, 0100 SYSCLK, 0101 HSI, 0110 HSE, 0111 PLL/2,
        # 1000 UTMI, 1001 USBSS_PLL/2, 1010 ETH_PLL/8, 1011 SERDES_PLL/16.
        choices:
          - { name: Disable, default: true }
          - { name: SYSCLK }
          - { name: HSI }
          - { name: HSE }
          - { name: PLLCLK/2 }
          - { name: UTMI clock }
          - { name: USBSS_PLL/2 }
          - { name: ETH_PLL/8 }
          - { name: SERDES_PLL/16 }
    signal_pins:
      MCO: [{ pin: PB0, af: 0, notes: "DS Table 2-1-1: MCO is AF0 on PB0" }]
      # XI/XO are dedicated oscillator pads (DS Table 2-1-1, `sys` in `pins:`), not
      # AF-selected GPIOs - so they carry a pin and no AF code, exactly like the debug
      # pair on SYS. `clock.hse_signals` names them, so picking HSE as a source claims
      # them through the normal conflict engine.
      XI: [{ pin: XI, notes: "dedicated HSE input pad; not a GPIO on any package" }]
      XO: [{ pin: XO, notes: "dedicated HSE output pad; not a GPIO on any package" }]
