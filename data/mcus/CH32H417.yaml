  - { name: GPHA, vector: 125, irqn: GPHA_IRQn, handler: GPHA_IRQHandler, peripheral: GPHA }
  - { name: DFSDM0, vector: 127, irqn: DFSDM0_IRQn, handler: DFSDM0_IRQHandler, peripheral: DFSDM }
  - { name: DFSDM1, vector: 128, irqn: DFSDM1_IRQn, handler: DFSDM1_IRQHandler, peripheral: DFSDM }
