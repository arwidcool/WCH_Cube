          - { name: Snapshot  , value: 1, sdk: DVP_CaptureMode_Snapshot }
        help: "DVP_CR1 (ch32h417_dvp.h:94-95). Snapshot is the EVT drop's own default (DVP_StructInit)."
      - key: jpeg
        name: JPEG mode
        struct: DVP_InitTypeDef
        sdk_field: DVP_JPEGMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR0 bit 6. The sensor sends a JPEG byte stream rather than raw pixels, so the row/column counts below stop describing the transfer."
      - key: rows
        name: Rows per frame
        struct: DVP_InitTypeDef
        sdk_field: DVP_ROW_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_ROW_NUM. The sensor's frame height in lines. 0 is the EVT drop's own starting value (DVP_StructInit) and means the field is left for your own code."
      - key: cols
        name: Bytes per row
        struct: DVP_InitTypeDef
        sdk_field: DVP_COL_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_COL_NUM. Counted in BYTES, not pixels, so an RGB565 line of 320 pixels is 640. 0 is DVP_StructInit()'s value."
      - key: crop
        name: Crop window
        struct: DVP_InitTypeDef
        sdk_field: DVP_Crop
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR1 bit 5. Captures a rectangle of the sensor's frame instead of all of it; the four window rows below apply only while it is on."
      - key: win_hoff
        name: Window horizontal offset
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_HOFFCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_HOFFCNT, in BYTES from the start of the line - the same unit as Bytes per row."
      - key: win_vst
        name: Window first line
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VST
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VST, the first line of the frame that is kept."
      - key: win_capcnt
        name: Window width
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_CAPCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_CAPCNT, bytes captured per line."
      - key: win_vline
        name: Window height
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VLine
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VLINE, lines captured per frame."
    notes: >
      Digital video port: a parallel camera interface. The Mode row picks the data width
      AND the pads it claims - 8-bit takes D0-D7, 10-bit adds D8-D9, 12-bit adds D10-D11 -
      and Parameter Settings writes the matching DVP_CR0.DATA_SIZE rather than offering the
      width a second time, so the pin plan and the register cannot disagree.
      THE TWO DMA BUFFER ADDRESSES ARE DELIBERATELY NOT ROWS. `DVP_DMA_BUF0_Addr` and
      `DVP_DMA_BUF1_Addr` (ch32h417_dvp.h:31-35) are pointers into your own program's
      memory - a symbol this tool has no way to know - so they are left at the struct's
      zero-initialiser, which is exactly what the vendor's own `DVP_StructInit()` sets them
      to (ch32h417_dvp.c). Assign `DVP->DMA_BUF0` / `DMA_BUF1` in the USER CODE block before
      `DVP_Cmd(ENABLE)`. Every other member of the struct is a row above.
