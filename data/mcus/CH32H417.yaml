      SCK: [{ pin: PA14, af: 1 }, { pin: PC10, af: 6 }, { pin: PB3, af: 6 }]
    # THE PRESCALER MACROS ARE NOT THE CH32V00x SET EITHER. ch32h417_spi.h:106-113 names
    # them SPI_BaudRatePrescaler_Mode0..Mode7, not _2 / _4 / ... / _256. Which divider each
    # Mode selects depends on the SPI clock tree, which is not modelled here, so the options
    # carry the header's own names rather than a division this file cannot yet prove.
    # Copying CH32V006's list would fail verify_sdk_names.py. Same block as SPI1/SPI2:
    # ch32h417.h:1734-1735 casts SPI3 and SPI4 to `SPI_TypeDef *`, and SPI_Init()
    # (ch32h417_spi.h:198) takes either.
    params:
      - key: prescaler
        name: Baud rate prescaler
        struct: SPI_InitTypeDef
        sdk_field: SPI_BaudRatePrescaler
        type: enum
        default: Mode 3
        options:
          - { name: Mode 0, value: 0, sdk: SPI_BaudRatePrescaler_Mode0 }
          - { name: Mode 1, value: 1, sdk: SPI_BaudRatePrescaler_Mode1 }
          - { name: Mode 2, value: 2, sdk: SPI_BaudRatePrescaler_Mode2 }
          - { name: Mode 3, value: 3, sdk: SPI_BaudRatePrescaler_Mode3 }
          - { name: Mode 4, value: 4, sdk: SPI_BaudRatePrescaler_Mode4 }
