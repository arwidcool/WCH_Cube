# =============================================================================
#  WCH-DUMMY32-C8 — a DUMMY part used to develop the UI.
#  Its pinout deliberately resembles a CH32V203C8 (LQFP48 / QFN48) with a
#  TSSOP20 / QFN20 variant, so it exercises remap groups, missing pins, etc.
#  Nothing here is verified against a real datasheet.
# =============================================================================
#
#  HOW THIS FILE WORKS
#  -------------------
#  * `packages`     maps pin NUMBER -> pin NAME for each package the part ships in.
#                   A pin name that is not present in a package simply doesn't exist
#                   there, and any peripheral remap that needs it becomes unavailable.
#  * `pins`         one entry per pin NAME: its type and free-text notes.
#                   Alternate functions are NOT listed here — they are derived from
#                   the `peripherals` section so there is one place to edit.
#  * `peripherals`  each has a `category` (left-hand tree), `settings` (the dropdowns /
#                   checkboxes shown in the centre panel), and `remaps` (which pin each
#                   signal lands on for each AFIO remap value).
#                   - a setting `choice` lists the `signals` it needs.
#                   - `type: checkboxes` renders each choice as a checkbox (ADC channels).
#                   - signals with no pin (e.g. internal temperature channel) are fine.
#  * `clock`        the clock tree used by the Clock Configuration tab.
#
#  Signal naming: "<PERIPHERAL>_<SIGNAL>" is displayed on the chip, e.g. USART1_TX.

mcu:
  name: WCH-DUMMY32-C8
  vendor: WCH (dummy data)
  family: DUMMY32
  core: RISC-V4B (QingKe)
  flash_kb: 64
  sram_kb: 20
  vdd_v: [2.7, 5.5]
  max_sysclk_mhz: 144
  default_package: LQFP48

