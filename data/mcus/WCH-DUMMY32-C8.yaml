# -----------------------------------------------------------------------------
peripherals:

  # ---------------- System Core ----------------
  SYS:
    category: System Core
    settings:
      - name: Debug
        choices:
          - { name: No Debug }
          - { name: Serial Wire, signals: [SWDIO, SWCLK] }
          - { name: JTAG (5 pins), signals: [JTMS, JTCK, JTDI, JTDO, NJTRST] }
      - name: System Wake-Up
        choices:
          - { name: Disable }
          - { name: WKUP pin, signals: [WKUP] }
    remaps:
      - name: Default
        pins: { SWDIO: PA13, SWCLK: PA14, JTMS: PA13, JTCK: PA14, JTDI: PA15, JTDO: PB3, NJTRST: PB4, WKUP: PA0 }

  RCC:
    category: System Core
    settings:
      - name: High Speed Clock (HSE)
        choices:
          - { name: Disable }
          - { name: BYPASS Clock Source, signals: [OSC_IN] }
          - { name: Crystal/Ceramic Resonator, signals: [OSC_IN, OSC_OUT] }
      - name: Low Speed Clock (LSE)
        choices:
          - { name: Disable }
          - { name: BYPASS Clock Source, signals: [OSC32_IN] }
          - { name: Crystal/Ceramic Resonator, signals: [OSC32_IN, OSC32_OUT] }
      - name: Master Clock Output
        choices:
          - { name: Disable }
          - { name: Enable, signals: [MCO] }
    remaps:
      - name: Default
        pins: { OSC_IN: PD0, OSC_OUT: PD1, OSC32_IN: PC14, OSC32_OUT: PC15, MCO: PA8 }

  IWDG:
    category: System Core
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]

  WWDG:
    category: System Core
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]

  DMA1:
    category: System Core
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]

  # ---------------- Analog ----------------
  ADC1:
    category: Analog
    settings:
      - name: Channels
        type: checkboxes
        choices:
          - { name: IN0, signals: [IN0] }
          - { name: IN1, signals: [IN1] }
          - { name: IN2, signals: [IN2] }
          - { name: IN3, signals: [IN3] }
          - { name: IN4, signals: [IN4] }
          - { name: IN5, signals: [IN5] }
          - { name: IN6, signals: [IN6] }
          - { name: IN7, signals: [IN7] }
          - { name: IN8, signals: [IN8] }
          - { name: IN9, signals: [IN9] }
          - { name: Temperature Sensor Channel }
          - { name: Vrefint Channel }
      - name: External Trigger
        choices:
          - { name: Disable }
          - { name: External trigger on EXTI11, signals: [EXTI11] }
    remaps:
      - name: Default
        pins: { IN0: PA0, IN1: PA1, IN2: PA2, IN3: PA3, IN4: PA4, IN5: PA5, IN6: PA6, IN7: PA7, IN8: PB0, IN9: PB1, EXTI11: PB11 }

  ADC2:
    category: Analog
    settings:
      - name: Channels
        type: checkboxes
        choices:
          - { name: IN0, signals: [IN0] }
          - { name: IN1, signals: [IN1] }
          - { name: IN2, signals: [IN2] }
          - { name: IN3, signals: [IN3] }
          - { name: IN4, signals: [IN4] }
          - { name: IN5, signals: [IN5] }
          - { name: IN6, signals: [IN6] }
          - { name: IN7, signals: [IN7] }
          - { name: IN8, signals: [IN8] }
          - { name: IN9, signals: [IN9] }
    remaps:
      - name: Default
        pins: { IN0: PA0, IN1: PA1, IN2: PA2, IN3: PA3, IN4: PA4, IN5: PA5, IN6: PA6, IN7: PA7, IN8: PB0, IN9: PB1 }

  OPA1:
    category: Analog
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Standalone, signals: [VINP, VINM, VOUT] }
    remaps:
      - name: Default
        pins: { VINP: PB1, VINM: PB0, VOUT: PA3 }

  # ---------------- Timers ----------------
  TIM1:
    category: Timers
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH1] }
          - { name: PWM Generation CH1, signals: [CH1] }
          - { name: PWM Generation CH1 CH1N, signals: [CH1, CH1N] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
          - { name: PWM Generation CH2 CH2N, signals: [CH2, CH2N] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
          - { name: PWM Generation CH3 CH3N, signals: [CH3, CH3N] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR2, signals: [ETR] }
      - name: Break Input
        choices:
          - { name: Disable }
          - { name: Activate-Break-Input, signals: [BKIN] }
    remaps:
      - name: No remap
        pins: { CH1: PA8, CH2: PA9, CH3: PA10, CH4: PA11, ETR: PA12, BKIN: PB12, CH1N: PB13, CH2N: PB14, CH3N: PB15 }
      - name: Partial remap
        pins: { CH1: PA8, CH2: PA9, CH3: PA10, CH4: PA11, ETR: PA12, BKIN: PA6, CH1N: PA7, CH2N: PB0, CH3N: PB1 }

  TIM2:
