# Every pin that exists on the die, not only the ones a package bonds.
pins:
  BOOT0: { type: boot }
  NRST: { type: reset }
  PA0: { type: io }
  PA1: { type: io }
  PA10: { type: io }
  PA11: { type: io }
  PA12: { type: io }
  PA13: { type: io }
  PA14: { type: io }
  PA15: { type: io }
  PA2: { type: io }
  PA3: { type: io }
  PA4: { type: io }
  PA5: { type: io }
  PA6: { type: io }
  PA7: { type: io }
  PA8: { type: io }
  PA9: { type: io }
  PB0: { type: io }
  PB1: { type: io }
  PB10: { type: io }
  PB11: { type: io }
  PB12: { type: io }
  PB13: { type: io }
  PB14: { type: io }
  PB15: { type: io }
  PB2: { type: io }
  PB3: { type: io }
  PB4: { type: io }
  PB5: { type: io }
  PB6: { type: io }
  PB7: { type: io }
  PB8: { type: io }
  PB9: { type: io }
  PC13: { type: io }
  PC14: { type: io }
  PC15: { type: io }
  PD0: { type: io }
  PD1: { type: io }
  VBAT: { type: power }
  VDD: { type: power }
  VDDA: { type: power }
  VSS: { type: ground }
  VSSA: { type: ground }

peripherals:
  SYS:
    category: System
    settings:
      - name: Debug (SDI)
        choices:
          - { name: No Debug }
          - { name: 2-wire SDI (SWDIO/SWCLK), signals: [SWDIO, SWCLK], default: true }
      - name: External reset pin
        choices:
          # choices[0] is the OFF state by convention. Here the factory state is the
          # pin ENABLED - DS pin table: NRST "Main function (After reset)" - so the
          # off choice is named first only because the engine needs an off state;
          # the pin really is claimed out of reset. `default: true` says which one
          # the user gets, exactly as CH32V006's RST_MODE setting does.
          - { name: Reset pin disabled - pin is GPIO, signals: [] }
          - { name: "RST enabled (factory default)", signals: [RST], default: true }
    remaps:
      - name: RST on NRST, SDI on PA13/PA14
        pins: { RST: NRST, SWDIO: PA13, SWCLK: PA14 }
    notes: >
      SYS claims the debug pins and the reset pin. Neither is ever configured with
      GPIO_Init: `codegen.skip_signals` names them, because driving the reset pin as
      a push-pull output is harmful and the debug port is controlled by the option
      bytes. SWDIO is PA13 and SWCLK is PA14 - the DS pinout figures print those pins
      as `PA13/SWDIO` and `PA14/SWCLK` on every package. The reset pin has no
      alternate location on this part, unlike CH32X035, whose RST moves with the
      package, so there is one remap entry and it names the real pins.

  RCC:
    category: System
    settings:
      - name: High Speed Clock (HSE)
        choices:
          - { name: Disable }
          - { name: BYPASS clock source, signals: [OSC_IN] }
          - { name: Crystal / ceramic resonator, signals: [OSC_IN, OSC_OUT], default: true }
      - name: Master Clock Output (MCO)
        choices:
          - { name: Disable }
          - { name: SYSCLK, signals: [MCO] }
          - { name: HSI,    signals: [MCO] }
          - { name: HSE,    signals: [MCO] }
          - { name: PLLCLK, signals: [MCO] }
      # RM 10.2.11.1: "When LSEON=0, the LSE oscillator pin OSC32_IN/OSC32_OUT
      # can be used as PC14/PC15 of GPIO respectively. When LSEON=1, it is used as
      # LSE pin." So the pad is a mode choice like the HSE crystal above, and it
      # lives on RCC because RCC_BDCTLR.LSEON is the bit that decides it.
      # NOTE: LSE is NOT in `clock.sources` below - the clock tree has no LSE node,
      # so this routes the pads and stops there. Recorded rather than half-modelled.
      - name: Low Speed Clock (LSE)
        choices:
          - { name: Disable }
          - { name: Crystal / ceramic resonator, signals: [OSC32_IN, OSC32_OUT] }
    # PD0/PD1 are the crystal pins out of reset and GPIO when AFIO_PCFR1[15] is set.
    # RM 10.3.2.2: "PD0 & PD1 remap bit ... 0: Pin is used as crystal pin; 1: Pin is
    # used as GPIO port." Index 0 is that reset state, so it has no macro.
    #
    # MCO (PA8), OSC32_IN/OSC32_OUT (PC14/PC15) and the LSE choice above are carried
    # in BOTH entries because neither is affected by PD0PD1_RM - a signal that sits
    # on the same pad under every value of the field belongs to every entry, and
    # omitting it from one would make the pin unavailable whenever that remap is
    # selected. Remap tables agree with each other about the signals they carry; an
    # index only differs in the PIN a shared signal sits on.
    remaps:
      - name: PD0/PD1 as crystal pins (reset state)
        pins: { OSC_IN: PD0, OSC_OUT: PD1, MCO: PA8, OSC32_IN: PC14, OSC32_OUT: PC15 }
      - name: PD0/PD1 as GPIO
        macro: GPIO_Remap_PD01
        pins: { OSC_IN: PD0, OSC_OUT: PD1, MCO: PA8, OSC32_IN: PC14, OSC32_OUT: PC15 }

  USART1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM 10.3.2.2 (USART1_RM, PCFR1[2]) x 10.3.2.8 (USART1_RM_H, PCFR2[20:19]).
    # The field is THREE bits, {USART1_RM_H, USART1_RM}, which is why there are five
    # macros and not three. Index = the field value; an index the RM calls Reserved
    # is simply absent, because `macro` style applies the macro and never writes the
    # index into a register.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 3000000
        unit: Bd
        help: "Ceiling is fCK/16. USART_BRR."
      - key: word_length
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: "8 bits"
        options:
          - { name: "8 bits", value: 0, sdk: USART_WordLength_8b }
          - { name: "9 bits", value: 1, sdk: USART_WordLength_9b }
      - key: stop_bits
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "0.5", value: 0, sdk: USART_StopBits_0_5 }
          - { name: "1",   value: 1, sdk: USART_StopBits_1 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
          - { name: "2",   value: 2, sdk: USART_StopBits_2 }
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: None
        options:
          - { name: None, value: 0, sdk: USART_Parity_No }
          - { name: Even, value: 1, sdk: USART_Parity_Even }
          - { name: Odd,  value: 3, sdk: USART_Parity_Odd }
      - key: mode
        name: Direction
        struct: USART_InitTypeDef
        sdk_field: USART_Mode
        type: enum
        default: "TX and RX"
        options:
          - { name: "TX only", value: 1, sdk: USART_Mode_Tx }
          - { name: "RX only", value: 2, sdk: USART_Mode_Rx }
          - { name: "TX and RX", value: 3, sdk: USART_Mode_Tx }
        sdk_note: >
          USART_Mode is a BIT MASK in this SDK - 0x0008 for TX, 0x0004 for RX - so
          "TX and RX" is both bits. The `value` here is the enumeration index the
          app stores; `sdk` is what is emitted, which is USART_Mode_Tx because the
          app composes it. USART_Init() is called with the stored bits.
      - key: flow
        name: Hardware flow control
        struct: USART_InitTypeDef
        sdk_field: USART_HardwareFlowControl
        type: enum
        default: None
        options:
          - { name: None,   value: 0, sdk: USART_HardwareFlowControl_None }
          - { name: RTS,    value: 1, sdk: USART_HardwareFlowControl_RTS }
          - { name: CTS,    value: 2, sdk: USART_HardwareFlowControl_CTS }
          - { name: "RTS and CTS", value: 3, sdk: USART_HardwareFlowControl_RTS_CTS }
        help: "The pins come from the Hardware Flow Control SETTING, not from here - a parameter never claims a pin."
    remaps:
      - name: Default (RM 000)
        pins: { TX: PA9, RX: PA10, CK: PA8, CTS: PA11, RTS: PA12 }
      - name: "Fully mapping (RM 001)"
        macro: GPIO_PartialRemap1_USART1
        pins: { TX: PB6, RX: PB7, CK: PA8, CTS: PA11, RTS: PA12 }
      - name: "Fully mapped (RM 010)"
        macro: GPIO_PartialRemap2_USART1
        pins: { TX: PA4, RX: PA5, CK: PA3, CTS: PA2, RTS: PA13 }
      - name: "Fully mapped (RM 011)"
        macro: GPIO_PartialRemap3_USART1
        pins: { TX: PA5, RX: PA4, CK: PA6, CTS: PB7, RTS: PB8 }
      - name: "Fully mapped (RM 100)"
        macro: GPIO_PartialRemap4_USART1
        pins: { TX: PB11, RX: PB9, CK: PA6, CTS: PA14, RTS: PA13 }
      - name: "Fully mapped (RM 101)"
        macro: GPIO_FullRemap_USART1
        pins: { TX: PB12, RX: PA12, CK: PB6, CTS: PB7, RTS: PB8 }

  USART2:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM: USART2_RM PCFR1[3] + USART2_RM_H PCFR2[18]. RM value 01 is Reserved, so it
    # is not offered - the header's PartialRemap1 encodes that value and is therefore
    # deliberately NOT used here.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 3000000
        unit: Bd
        help: "Ceiling is fCK/16. USART_BRR."
      - key: word_length
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: "8 bits"
        options:
          - { name: "8 bits", value: 0, sdk: USART_WordLength_8b }
          - { name: "9 bits", value: 1, sdk: USART_WordLength_9b }
      - key: stop_bits
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "0.5", value: 0, sdk: USART_StopBits_0_5 }
          - { name: "1",   value: 1, sdk: USART_StopBits_1 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
          - { name: "2",   value: 2, sdk: USART_StopBits_2 }
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: None
        options:
          - { name: None, value: 0, sdk: USART_Parity_No }
          - { name: Even, value: 1, sdk: USART_Parity_Even }
          - { name: Odd,  value: 3, sdk: USART_Parity_Odd }
      - key: mode
        name: Direction
        struct: USART_InitTypeDef
        sdk_field: USART_Mode
        type: enum
        default: "TX and RX"
        options:
          - { name: "TX only", value: 1, sdk: USART_Mode_Tx }
          - { name: "RX only", value: 2, sdk: USART_Mode_Rx }
          - { name: "TX and RX", value: 3, sdk: USART_Mode_Tx }
        sdk_note: >
          USART_Mode is a BIT MASK in this SDK - 0x0008 for TX, 0x0004 for RX - so
          "TX and RX" is both bits. The `value` here is the enumeration index the
          app stores; `sdk` is what is emitted, which is USART_Mode_Tx because the
          app composes it. USART_Init() is called with the stored bits.
      - key: flow
        name: Hardware flow control
        struct: USART_InitTypeDef
        sdk_field: USART_HardwareFlowControl
        type: enum
        default: None
        options:
          - { name: None,   value: 0, sdk: USART_HardwareFlowControl_None }
          - { name: RTS,    value: 1, sdk: USART_HardwareFlowControl_RTS }
          - { name: CTS,    value: 2, sdk: USART_HardwareFlowControl_CTS }
          - { name: "RTS and CTS", value: 3, sdk: USART_HardwareFlowControl_RTS_CTS }
        help: "The pins come from the Hardware Flow Control SETTING, not from here - a parameter never claims a pin."
    remaps:
      - name: Default (RM 00)
        pins: { TX: PA2, RX: PA3, CK: PA4, CTS: PA0, RTS: PA1 }
      - name: "Partial (RM 10)"
        macro: GPIO_PartialRemap2_USART2
        pins: { TX: PA11, RX: PA12, CK: PA4, CTS: PA0, RTS: PA1 }
      - name: "Partial (RM 11)"
        macro: GPIO_FullRemap_USART2
        pins: { TX: PA12, RX: PA11, CK: PA4, CTS: PA0, RTS: PA1 }

  USART3:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM 10.3.2.2: USART3_RM PCFR1[5:4]. Value 01 is Reserved.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 3000000
        unit: Bd
        help: "Ceiling is fCK/16. USART_BRR."
      - key: word_length
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: "8 bits"
        options:
          - { name: "8 bits", value: 0, sdk: USART_WordLength_8b }
          - { name: "9 bits", value: 1, sdk: USART_WordLength_9b }
      - key: stop_bits
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "0.5", value: 0, sdk: USART_StopBits_0_5 }
          - { name: "1",   value: 1, sdk: USART_StopBits_1 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
          - { name: "2",   value: 2, sdk: USART_StopBits_2 }
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: None
        options:
          - { name: None, value: 0, sdk: USART_Parity_No }
          - { name: Even, value: 1, sdk: USART_Parity_Even }
          - { name: Odd,  value: 3, sdk: USART_Parity_Odd }
      - key: mode
        name: Direction
        struct: USART_InitTypeDef
        sdk_field: USART_Mode
        type: enum
        default: "TX and RX"
        options:
          - { name: "TX only", value: 1, sdk: USART_Mode_Tx }
          - { name: "RX only", value: 2, sdk: USART_Mode_Rx }
          - { name: "TX and RX", value: 3, sdk: USART_Mode_Tx }
        sdk_note: >
          USART_Mode is a BIT MASK in this SDK - 0x0008 for TX, 0x0004 for RX - so
          "TX and RX" is both bits. The `value` here is the enumeration index the
          app stores; `sdk` is what is emitted, which is USART_Mode_Tx because the
          app composes it. USART_Init() is called with the stored bits.
      - key: flow
        name: Hardware flow control
        struct: USART_InitTypeDef
        sdk_field: USART_HardwareFlowControl
