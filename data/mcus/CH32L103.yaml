        default: 999
        min: 0
        max: 65535
      - key: counter_mode
        name: Counter mode
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_CounterMode
        type: enum
        default: Up
        options:
          - { name: Up,                value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down,              value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center Aligned 1,  value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center Aligned 2,  value: 3, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center Aligned 3,  value: 4, sdk: TIM_CounterMode_CenterAligned3 }
      - key: clock_division
        name: Clock division
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        default: "tDTS = tCK_INT"
        options:
          - { name: "tDTS = tCK_INT",      value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "tDTS = 2 x tCK_INT",  value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "tDTS = 4 x tCK_INT",  value: 2, sdk: TIM_CKD_DIV4 }
    remaps:
      - name: Default (RM 000)
        pins: { CH1_ETR: PA0, CH2: PA1, CH3: PA2, CH4: PA3 }
      - name: "Partial (RM 001)"
        macro: GPIO_PartialRemap1_TIM2
        pins: { CH1_ETR: PA15, CH2: PB3, CH3: PA2, CH4: PA3 }
      - name: "Partial (RM 010)"
        macro: GPIO_PartialRemap2_TIM2
        pins: { CH1_ETR: PA0, CH2: PA1, CH3: PB10, CH4: PB11 }
      - name: "Fully mapping (RM 011)"
        macro: GPIO_PartialRemap3_TIM2
        pins: { CH1_ETR: PA15, CH2: PB3, CH3: PB10, CH4: PB11 }
      - name: "Fully mapping (RM 100)"
        macro: GPIO_PartialRemap4_TIM2
        pins: { CH1_ETR: PA3, CH2: PA2, CH3: PB12, CH4: PA6 }
      - name: "Fully mapping (RM 101)"
        macro: GPIO_PartialRemap5_TIM2
        pins: { CH1_ETR: PA12, CH2: PA2, CH3: PB12, CH4: PA6 }
      - name: "Fully mapping (RM 111)"
        macro: GPIO_FullRemap_TIM2
        pins: { CH1_ETR: PA12, CH2: PB8, CH3: PA5, CH4: PA4 }

