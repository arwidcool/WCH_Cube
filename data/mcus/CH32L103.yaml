      - name: Output Compare
        choices:
          - { name: Disable }
          - { name: Output Compare, signals: [OC] }
    # RM 10.3.2.8: LPTIM_RM PCFR2[25]. One bit.
    params:
      - key: clock_prescaler
        name: Clock prescaler
        struct: LPTIM_TimeBaseInitTypeDef
        sdk_field: LPTIM_ClockPrescaler
        type: enum
        default: "1"
