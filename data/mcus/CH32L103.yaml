          - { name: "RTS and CTS", value: 3, sdk: USART_HardwareFlowControl_RTS_CTS }
        help: "The pins come from the Hardware Flow Control SETTING, not from here - a parameter never claims a pin."
    remaps:
      - name: Default (RM 00)
        pins: { TX: PB10, RX: PB11, CK: PB12, CTS: PB13, RTS: PB14 }
      - name: "Partial (RM 10)"
        macro: GPIO_PartialRemap_USART3
        pins: { TX: PD1, RX: PD0, CK: PB12, CTS: PB13, RTS: PB14 }
      - name: "Partial (RM 11)"
        macro: GPIO_FullRemap_USART3
        pins: { TX: PD0, RX: PD1, CK: PB12, CTS: PB13, RTS: PB14 }

  USART4:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM 10.3.2.8: USART4_RM PCFR2[16].
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 3000000
        unit: Bd
        help: "Ceiling is fCK/16. USART_BRR."
      - key: word_length
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: "8 bits"
        options:
          - { name: "8 bits", value: 0, sdk: USART_WordLength_8b }
          - { name: "9 bits", value: 1, sdk: USART_WordLength_9b }
      - key: stop_bits
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "0.5", value: 0, sdk: USART_StopBits_0_5 }
          - { name: "1",   value: 1, sdk: USART_StopBits_1 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
          - { name: "2",   value: 2, sdk: USART_StopBits_2 }
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: None
        options:
          - { name: None, value: 0, sdk: USART_Parity_No }
          - { name: Even, value: 1, sdk: USART_Parity_Even }
          - { name: Odd,  value: 3, sdk: USART_Parity_Odd }
      - key: mode
        name: Direction
        struct: USART_InitTypeDef
        sdk_field: USART_Mode
        type: enum
        default: "TX and RX"
        options:
          - { name: "TX only", value: 1, sdk: USART_Mode_Tx }
          - { name: "RX only", value: 2, sdk: USART_Mode_Rx }
          - { name: "TX and RX", value: 3, sdk: USART_Mode_Tx }
        sdk_note: >
          USART_Mode is a BIT MASK in this SDK - 0x0008 for TX, 0x0004 for RX - so
          "TX and RX" is both bits. The `value` here is the enumeration index the
          app stores; `sdk` is what is emitted, which is USART_Mode_Tx because the
          app composes it. USART_Init() is called with the stored bits.
      - key: flow
        name: Hardware flow control
        struct: USART_InitTypeDef
        sdk_field: USART_HardwareFlowControl
        type: enum
        default: None
        options:
          - { name: None,   value: 0, sdk: USART_HardwareFlowControl_None }
          - { name: RTS,    value: 1, sdk: USART_HardwareFlowControl_RTS }
          - { name: CTS,    value: 2, sdk: USART_HardwareFlowControl_CTS }
          - { name: "RTS and CTS", value: 3, sdk: USART_HardwareFlowControl_RTS_CTS }
        help: "The pins come from the Hardware Flow Control SETTING, not from here - a parameter never claims a pin."
    remaps:
      - name: Default (RM 0)
        pins: { TX: PB0, RX: PB1, CK: PB2, CTS: PB3, RTS: PB4 }
      - name: "Fully mapping (RM 1)"
        macro: GPIO_Remap_USART4
        pins: { TX: PA5, RX: PB5, CK: PA6, CTS: PA7, RTS: PA15 }

  SPI1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Full-Duplex Master, signals: [NSS, SCK, MISO, MOSI] }
          - { name: Full-Duplex Slave, signals: [NSS, SCK, MISO, MOSI] }
    # RM: SPI1_RM PCFR1[0] + SPI1_RM_H PCFR2[24]. Two bits, four states.
    params:
      - key: direction
        name: Direction
        struct: SPI_InitTypeDef
        sdk_field: SPI_Direction
        type: enum
        default: Full-duplex
        options:
          - { name: Full-duplex,    value: 0, sdk: SPI_Direction_2Lines_FullDuplex }
          - { name: "Receive only", value: 1, sdk: SPI_Direction_2Lines_RxOnly }
          - { name: "1 line RX",    value: 2, sdk: SPI_Direction_1Line_Rx }
          - { name: "1 line TX",    value: 3, sdk: SPI_Direction_1Line_Tx }
      - key: mode
        name: Mode
        struct: SPI_InitTypeDef
        sdk_field: SPI_Mode
        type: enum
        default: Master
        options:
          - { name: Master, value: 1, sdk: SPI_Mode_Master }
          - { name: Slave,  value: 0, sdk: SPI_Mode_Slave }
      - key: data_size
        name: Data size
        struct: SPI_InitTypeDef
        sdk_field: SPI_DataSize
        type: enum
        default: "8 bits"
        options:
          - { name: "8 bits",  value: 0, sdk: SPI_DataSize_8b }
          - { name: "16 bits", value: 1, sdk: SPI_DataSize_16b }
      - key: cpol
        name: Clock polarity
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPOL
        type: enum
        default: Low
        options:
          - { name: Low,  value: 0, sdk: SPI_CPOL_Low }
          - { name: High, value: 1, sdk: SPI_CPOL_High }
      - key: cpha
        name: Clock phase
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPHA
        type: enum
        default: "1 Edge"
        options:
          - { name: "1 Edge", value: 0, sdk: SPI_CPHA_1Edge }
          - { name: "2 Edge", value: 1, sdk: SPI_CPHA_2Edge }
      - key: nss
        name: NSS
        struct: SPI_InitTypeDef
        sdk_field: SPI_NSS
        type: enum
        default: Software
        options:
          - { name: Software, value: 1, sdk: SPI_NSS_Soft }
          - { name: Hardware, value: 0, sdk: SPI_NSS_Hard }
      - key: prescaler
        name: Baud rate prescaler
        struct: SPI_InitTypeDef
        sdk_field: SPI_BaudRatePrescaler
        type: enum
        default: "2"
        options:
          - { name: "2",   value: 0, sdk: SPI_BaudRatePrescaler_2 }
          - { name: "4",   value: 1, sdk: SPI_BaudRatePrescaler_4 }
          - { name: "8",   value: 2, sdk: SPI_BaudRatePrescaler_8 }
          - { name: "16",  value: 3, sdk: SPI_BaudRatePrescaler_16 }
          - { name: "32",  value: 4, sdk: SPI_BaudRatePrescaler_32 }
          - { name: "64",  value: 5, sdk: SPI_BaudRatePrescaler_64 }
          - { name: "128", value: 6, sdk: SPI_BaudRatePrescaler_128 }
          - { name: "256", value: 7, sdk: SPI_BaudRatePrescaler_256 }
      - key: first_bit
        name: First bit
        struct: SPI_InitTypeDef
        sdk_field: SPI_FirstBit
        type: enum
        default: MSB
        options:
          - { name: MSB, value: 0, sdk: SPI_FirstBit_MSB }
          - { name: LSB, value: 1, sdk: SPI_FirstBit_LSB }
      - key: crc
        name: CRC polynomial
        struct: SPI_InitTypeDef
        sdk_field: SPI_CRCPolynomial
        type: int
        default: 7
        min: 0
        max: 65535
        help: "SPI_InitTypeDef has a polynomial member but no CRC ENABLE member, so turning CRC on is a call after SPI_Init. The generator does not invent that call."
    remaps:
      - name: Default (RM 00)
        pins: { NSS: PA4, SCK: PA5, MISO: PA6, MOSI: PA7 }
      - name: "Full (RM 01)"
        macro: GPIO_PartialRemap1_SPI1
        pins: { NSS: PA15, SCK: PB3, MISO: PB4, MOSI: PB5 }
      - name: "Fully mapped (RM 10)"
        macro: GPIO_PartialRemap2_SPI1
        pins: { NSS: PA12, SCK: PB6, MISO: PB8, MOSI: PB7 }
      - name: "Fully mapped (RM 11)"
        macro: GPIO_FullRemap_SPI1
        pins: { NSS: PB12, SCK: PB6, MISO: PB8, MOSI: PB7 }

  I2C1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: I2C, signals: [SCL, SDA] }
          - { name: I2C with SMBus alert, signals: [SCL, SDA, SMBA] }
    # RM: I2C1_RM PCFR1[1] + I2C1_RM_H PCFR2[23]. RM value 01 is Reserved. The RM
    # also lists SMBA/PB5 on every mapping; it is a separate signal the SPL reaches
    # through the same macro, so it is modelled as a second choice rather than a
    # fourth pin that would have to be claimed to use I2C at all.
    params:
      - key: clock_speed
        name: Clock speed
        struct: I2C_InitTypeDef
        sdk_field: I2C_ClockSpeed
        type: int
        default: 100000
        min: 1000
        max: 400000
        unit: Hz
        help: "I2C_Init derives I2C_CKCFGR from this and the PB1 clock."
      - key: mode
        name: Mode
        struct: I2C_InitTypeDef
        sdk_field: I2C_Mode
        type: enum
        default: I2C
        options:
          - { name: I2C,         value: 0, sdk: I2C_Mode_I2C }
          - { name: SMBusDevice, value: 1, sdk: I2C_Mode_SMBusDevice }
          - { name: SMBusHost,   value: 5, sdk: I2C_Mode_SMBusHost }
      - key: duty_cycle
        name: Fast mode duty cycle
        struct: I2C_InitTypeDef
        sdk_field: I2C_DutyCycle
        type: enum
        default: "2:1"
        options:
          - { name: "2:1",  value: 0, sdk: I2C_DutyCycle_2 }
          - { name: "16:9", value: 1, sdk: I2C_DutyCycle_16_9 }
      - key: own_address
        name: Own address 1
        struct: I2C_InitTypeDef
        sdk_field: I2C_OwnAddress1
        type: int
        default: 0
        min: 0
        max: 1023
      - key: ack
        name: Acknowledge
        struct: I2C_InitTypeDef
        sdk_field: I2C_Ack
        type: enum
        default: Enable
        options:
          - { name: Disable, value: 0, sdk: I2C_Ack_Disable }
          - { name: Enable,  value: 1, sdk: I2C_Ack_Enable }
      - key: ack_address
        name: Acknowledged address
        struct: I2C_InitTypeDef
        sdk_field: I2C_AcknowledgedAddress
        type: enum
        default: "7-bit"
        options:
          - { name: "7-bit",  value: 0, sdk: I2C_AcknowledgedAddress_7bit }
          - { name: "10-bit", value: 1, sdk: I2C_AcknowledgedAddress_10bit }
    remaps:
      - name: Default (RM 00)
        pins: { SCL: PB6, SDA: PB7, SMBA: PB5 }
      - name: "Fully mapping (RM 10)"
        macro: GPIO_PartialRemap1_I2C1
        pins: { SCL: PA13, SDA: PA12, SMBA: PB5 }
      - name: "Fully mapped (RM 11)"
        macro: GPIO_FullRemap_I2C1
        pins: { SCL: PB9, SDA: PB11, SMBA: PB5 }

  TIM1:
    category: Timers
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH1] }
          - { name: PWM Generation CH1, signals: [CH1] }
          - { name: PWM Generation CH1 CH1N, signals: [CH1, CH1N] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
          - { name: PWM Generation CH2 CH2N, signals: [CH2, CH2N] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
          - { name: PWM Generation CH3 CH3N, signals: [CH3, CH3N] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR, signals: [ETR] }
      - name: Break Input
        choices:
          - { name: Disable }
          - { name: Activate-Break-Input, signals: [BKIN] }
    # RM: TIM1_RM PCFR1[7:6] + TIM1_RM_H PCFR2[22] = THREE bits, six macros.
    # Value 110 is not documented by the RM (the table goes 101 then 111), and 111
    # "controls LSI inputs only" - a clock function, not a pin route - so neither is
    # offered here.
    params:
      - key: prescaler
        name: Prescaler (PSC)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Prescaler
        type: int
        default: 47
        min: 0
        max: 65535
        help: "CK_CNT = TIMxCLK / (PSC + 1)."
      - key: period
        name: Counter period (ARR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Period
        type: int
        default: 999
        min: 0
        max: 65535
      - key: counter_mode
        name: Counter mode
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_CounterMode
        type: enum
        default: Up
        options:
          - { name: Up,                value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down,              value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center Aligned 1,  value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center Aligned 2,  value: 3, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center Aligned 3,  value: 4, sdk: TIM_CounterMode_CenterAligned3 }
      - key: clock_division
        name: Clock division
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        default: "tDTS = tCK_INT"
        options:
          - { name: "tDTS = tCK_INT",      value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "tDTS = 2 x tCK_INT",  value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "tDTS = 4 x tCK_INT",  value: 2, sdk: TIM_CKD_DIV4 }
      - key: repetition
        name: Repetition counter (RCR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_RepetitionCounter
        type: int
        default: 0
        min: 0
        max: 255
        help: "TIM1 is the advanced-control timer and has a repetition counter. TIM2/3/4 do not, which is a difference in the STRUCT, so this parameter is not offered on them."
    remaps:
      - name: Default (RM 000)
        pins: { ETR: PA12, CH1: PA8, CH2: PA9, CH3: PA10, CH4: PA11, BKIN: PB12, CH1N: PB13, CH2N: PB14, CH3N: PB15 }
      - name: "Fully mapped (RM 001)"
        macro: GPIO_PartialRemap1_TIM1
        pins: { ETR: PA12, CH1: PA8, CH2: PA9, CH3: PA10, CH4: PA11, BKIN: PA6, CH1N: PA7, CH2N: PB0, CH3N: PB1 }
      - name: "Fully mapping (RM 010)"
        macro: GPIO_PartialRemap2_TIM1
        pins: { ETR: PB6, CH1: PA1, CH2: PA7, CH3: PA14, CH4: PB1, BKIN: PA13, CH1N: PB11, CH2N: PB0, CH3N: PB9 }
      - name: "Fully mapped (RM 011)"
        macro: GPIO_PartialRemap3_TIM1
        pins: { ETR: PA3, CH1: PA1, CH2: PA7, CH3: PA14, CH4: PB1, BKIN: PA13, CH1N: PB11, CH2N: PB0, CH3N: PB9 }
      - name: "Fully mapped (RM 100)"
        macro: GPIO_PartialRemap4_TIM1
        pins: { ETR: PB6, CH1: PB7, CH2: PB8, CH3: PB12, CH4: PA2, BKIN: PA12, CH1N: PA14, CH2N: PB1, CH3N: PB9 }
      - name: "Fully mapped (RM 101)"
        macro: GPIO_PartialRemap5_TIM1
        pins: { ETR: PA13, CH1: PB1, CH2: PB8, CH3: PB6, CH4: PA3, BKIN: PA12, CH1N: PA14, CH2N: PA1, CH3N: PB7 }

  TIM2:
    category: Timers
