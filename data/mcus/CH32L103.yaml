# CH32L103.yaml — WCH CH32L103, extracted from its own datasheet, reference manual and EVT
#
# Sources: `data/sources/l103/Datasheets/CH32L103DS0.md` (DS V2.1),
# `CH32L103RM.md` (RM V2.2) and the EVT package under `data/sources/l103/Evt/`.
# Every fact cites one of them here or in `CH32L103.notes.md`.
#
# !!! READ `CH32L103.notes.md` BEFORE EDITING. It records what this part does NOT
# have, which open questions are open, and the DS defect that the pin tables were
# recovered from. It is NOT a small CH32V003 and it is NOT a CH32V00x with USB.
#
# Things that differ from every part already in `data/mcus/`, each cited below:
#   * THREE GPIO output speeds and EIGHT GPIO modes (so the speed control is a real
#     choice here, for the first time in this repo);
#   * remaps by named SDK MACRO (`GPIO_PinRemapConfig`), not by an AFIO register word;
#   * the remap FIELD is split across two registers (`AFIO_PCFR1` + `AFIO_PCFR2`),
#     so e.g. TIM1_RM is 3 bits and has six macros;
#   * CAN, RTC, LPTIM and a Low-power timer this repo has never modelled;
#   * per-vector EXTI for lines 0-4, grouped for 5-15 — a third EXTI shape.

mcu:
  name: CH32L103
  vendor: WCH
  family: CH32L10x
  # DS "Core": QingKe RISC-V4C, RV32IMA(F)C. Not the V00x's RISC-V2A.
  core: QingKe RISC-V4C (RV32IMAFC)
  flash_kb: 64
  sram_kb: 20
  # DS ch.1: rated 3.3 V; the operating range is stated on the cover page as 1.8~3.6 V.
  vdd_v: [1.8, 3.6]
  # DS cover: "CPU main frequency Max: 96MHz".
  max_sysclk_mhz: 96
  default_package: QFN32
  # DS "Model / Resource" table. `io_count` is the DS's OWN `GPIO port number` row,
  # which is what `tools/recover_l103_pins_from_pdf.py` checks every package against.
  variants:
    CH32L103C8T6: { package: LQFP48, flash_kb: 64, sram_kb: 20, temp: 85, io_count: 37, pio_board: genericCH32L103C8T6 }
    CH32L103K8U6: { package: QFN32,  flash_kb: 64, sram_kb: 20, temp: 85, io_count: 31, pio_board: genericCH32L103K8U6 }
    CH32L103K8U7: { package: QFN32,  flash_kb: 64, sram_kb: 20, temp: 105, io_count: 31, pio_board: genericCH32L103K8U6,
                    notes: "Identical to K8U6 except the temperature range - DS ch.1 note. The board file is the 85 C one, which is what PlatformIO ships; the app does not substitute it silently, it names it here." }
    CH32L103G8R6: { package: QSOP28, flash_kb: 64, sram_kb: 20, temp: 85, io_count: 26, pio_board: genericCH32L103G8R6 }
    CH32L103F8U6: { package: QFN20,  flash_kb: 64, sram_kb: 20, temp: 85, io_count: 19, pio_board: genericCH32L103F8U6 }
    CH32L103F8P6: { package: TSSOP20, flash_kb: 64, sram_kb: 20, temp: 85, io_count: 16, pio_board: genericCH32L103F8P6 }

# Pin number -> pin name, one table per package.
# Recovered from DS Table 2-1-1 (PDF) by `tools/recover_l103_pins_from_pdf.py`,
# which checks pin numbering and each package's GPIO count against the DS model
# table's own `GPIO port number` row - all five packages reconcile exactly.
# Cell corrections the conversion dropped are cited in
# `data/sources/l103/Datasheets/CH32L103_pin_corrections.yaml`.
#
# A LIST is more than one port name on ONE package pin, which the datasheet
# shows by listing two rows with the same number for that column (and its pinout
# figures print, e.g. QFN20 pin 11 as `PB6/CC1/PB13/T1CH1N`). The app treats them
# as one physical pin, the same as a shorted pair.
