          - { name: "1",   value: 0, sdk: LPTIM_TClockPrescaler_DIV1 }
          - { name: "2",   value: 1, sdk: LPTIM_TClockPrescaler_DIV2 }
          - { name: "4",   value: 2, sdk: LPTIM_TClockPrescaler_DIV4 }
          - { name: "8",   value: 3, sdk: LPTIM_TClockPrescaler_DIV8 }
          - { name: "16",  value: 4, sdk: LPTIM_TClockPrescaler_DIV16 }
          - { name: "32",  value: 5, sdk: LPTIM_TClockPrescaler_DIV32 }
          - { name: "64",  value: 6, sdk: LPTIM_TClockPrescaler_DIV64 }
          - { name: "128", value: 7, sdk: LPTIM_TClockPrescaler_DIV128 }
      - key: period
        name: Period
        struct: LPTIM_TimeBaseInitTypeDef
        sdk_field: LPTIM_Period
        type: int
        default: 65535
        min: 1
        max: 65535
      - key: pulse
        name: Pulse
        struct: LPTIM_TimeBaseInitTypeDef
        sdk_field: LPTIM_Pulse
        type: int
        default: 32767
        min: 1
        max: 65535
    remaps:
      - name: Default (RM 0)
        pins: { CH1: PB12, CH2: PB13, ETR: PB14, OC: PB15 }
      - name: "Remapping (RM 1)"
