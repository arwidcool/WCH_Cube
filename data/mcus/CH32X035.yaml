  ADC1:
    category: Analog
    notes: >
      Fourteen EXTERNAL channels plus ONE internal channel, DS0.md 1.4.12
      (CH32X035DS0.md:578-585): "providing up to 14 external channels and 1 internal
      channel sample... ADC internal channels are internal reference supply voltage
      sampling channels." RM:6029-6031 names it precisely - "VREFINT internal reference
      voltage: connected to ADC_IN15 channel" - confirmed against ch32x035_adc.h:88,90
      (ADC_Channel_15, aliased ADC_Channel_Vrefint) and modelled below as the
      "IN15 (Vrefint, internal)" choice, pinless like CH32H417's own IN16/IN17 and
      CH32V006's IN8/IN9 - but ONE internal channel here, not two: this part's OPA
      output reaches the ADC through a DIFFERENT mechanism (OPA_CTLR1's MODEx field
      selecting the OPA's output onto an EXISTING external I/O pin, RM ch.17.2.1,
      CH32X035RM.md:13628-13631), not a dedicated internal channel number - a separate
      modelling question, not this one. DS note 1 is a SILICON-REVISION caveat, not a
      package or variant fact: "Channel 3, channel 7, channel 11, channel 15 and I2C
      functions of the ADC are not available for products with a lot number with a
      penultimate 5 digit of 0" (CH32X035DS0.md:589-590) - channel 15 IS the Vrefint
      channel above, so on affected silicon the internal channel is unavailable too, not
      only the four external ones. Cannot be expressed per package or per variant and we
      cannot know which lot a user has, so it is recorded here and neither silently
      applied nor dropped.
    settings:
      - name: Channels
        type: checkboxes
        choices:
          - { name: IN0, signals: [IN0] }
          - { name: IN1, signals: [IN1] }
          - { name: IN2, signals: [IN2] }
          - { name: IN3, signals: [IN3] }
          - { name: IN4, signals: [IN4] }
          - { name: IN5, signals: [IN5] }
          - { name: IN6, signals: [IN6] }
          - { name: IN7, signals: [IN7] }
          - { name: IN8, signals: [IN8] }
          - { name: IN9, signals: [IN9] }
          - { name: IN10, signals: [IN10] }
          - { name: IN11, signals: [IN11] }
          - { name: IN12, signals: [IN12] }
          - { name: IN13, signals: [IN13] }
          - { name: "IN15 (Vrefint, internal)" }
    params:
      # CH32V006's macro names DO NOT EXIST HERE, and neither do its cycle counts. That
      # part spells them ADC_SampleTime_CyclesMode0..7 and means 3.5 .. 239.5 cycles;
      # CH32X035 spells them ADC_SampleTime_4Cycles .. _11Cycles and means exactly that -
      # four to eleven, one per code (ch32x035_adc.h). The parameter was ported from
      # CH32V006 and verify_sdk_names.py rejected all eight options, which is the whole
      # reason porting behind a gate is acceptable and porting without one is not.
      - key: sample
        name: Sampling time
        sdk_call: ADC_RegularChannelConfig
        sdk_args: [$HANDLE, $CHANNEL, $RANK, $VALUE]
        sdk_repeat: channels
        sdk_note: "ADC_InitTypeDef has no sample-time member here either. Sample time is the fourth argument of ADC_RegularChannelConfig(ADCx, channel, rank, ADC_SampleTime), so it is set per CHANNEL, not per peripheral."
        type: enum
        default: 11 cycles
        options:
          - { name: 4 cycles,  value: 0, sdk: ADC_SampleTime_4Cycles }
          - { name: 5 cycles,  value: 1, sdk: ADC_SampleTime_5Cycles }
          - { name: 6 cycles,  value: 2, sdk: ADC_SampleTime_6Cycles }
          - { name: 7 cycles,  value: 3, sdk: ADC_SampleTime_7Cycles }
          - { name: 8 cycles,  value: 4, sdk: ADC_SampleTime_8Cycles }
          - { name: 9 cycles,  value: 5, sdk: ADC_SampleTime_9Cycles }
          - { name: 10 cycles, value: 6, sdk: ADC_SampleTime_10Cycles }
          - { name: 11 cycles, value: 7, sdk: ADC_SampleTime_11Cycles }
        help: "Eight codes, 4 to 11 ADC clocks - a much shorter range than the CH32V00x family's 3.5 to 239.5. The names say the count, so there is nothing to convert."
      - key: lowpower
        name: Low power mode
        sdk_none: true
        sdk_note: "ch32x035_adc.h exposes nothing for the low-power bit - no struct member and no function. Same position as CH32V006, re-checked against THIS header rather than assumed to carry across: codegen writes the register or leaves it alone."
        type: bool
        default: false
        help: "ADC_CTLR3 ADC_LP, bit 0. Changes what three of the sampling-time codes mean - see that row."
      - key: cont
        name: Continuous conversion
        struct: ADC_InitTypeDef
        sdk_field: ADC_ContinuousConvMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: ADC_CTLR2 CONT, bit 1.
      - key: scan
        name: Scan conversion
        struct: ADC_InitTypeDef
        sdk_field: ADC_ScanConvMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: ADC_CTLR1 SCAN, bit 8.
      - key: align
        name: Data alignment
        struct: ADC_InitTypeDef
        sdk_field: ADC_DataAlign
        type: enum
        default: Right
        options:
          - { name: Right, value: 0, sdk: ADC_DataAlign_Right }
          - { name: Left , value: 1, sdk: ADC_DataAlign_Left }
        help: ADC_CTLR2 ALIGN, bit 11.
    remaps:
      - name: No remap
        pins: { IN0: PA0, IN1: PA1, IN10: PC0, IN11: PC1, IN12: PC2, IN13: PC3, IN2: PA2, IN3: PA3, IN4: PA4, IN5: PA5, IN6: PA6, IN7: PA7, IN8: PB0, IN9: PB1 }

  CMP1:
    category: Analog
    settings:
      - name: Positive input
        choices:
          - { name: Disable }
          - { name: P0, signals: [P0] }
          - { name: P1, signals: [P1] }
      - name: Negative input
        choices:
          - { name: Disable }
          - { name: N0, signals: [N0] }
          - { name: N1, signals: [N1] }
      - name: Output
        choices:
          - { name: Disable }
          - { name: OUT, signals: [OUT] }
    remaps:
      - name: No remap
        pins: { N0: PC3, N1: PA23, OUT: PA1, P0: PC19, P1: PA0 }

  CMP2:
    category: Analog
    settings:
      - name: Positive input
        choices:
          - { name: Disable }
          - { name: P0, signals: [P0] }
          - { name: P1, signals: [P1] }
      - name: Negative input
        choices:
          - { name: Disable }
          - { name: N0, signals: [N0] }
          - { name: N1, signals: [N1] }
      - name: Output
        choices:
          - { name: Disable }
          - { name: OUT, signals: [OUT] }
    remaps:
      - name: No remap
        pins: { N0: PA22, N1: PC3, OUT: PB2, P0: PA12, P1: PA11 }

  CMP3:
    category: Analog
    settings:
      - name: Positive input
        choices:
          - { name: Disable }
          - { name: P0, signals: [P0] }
          - { name: P1, signals: [P1] }
      - name: Negative input
        choices:
          - { name: Disable }
          - { name: N0, signals: [N0] }
          - { name: N1, signals: [N1] }
      - name: Output
        choices:
          - { name: Disable }
          - { name: OUT, signals: [OUT] }
    remaps:
      - name: No remap
        pins: { N0: PA2, N1: PC3, OUT: PB3, P0: PA13, P1: PA14 }

  OPA1:
    category: Analog
    settings:
      - name: Positive input
        choices:
          - { name: Disable }
          - { name: P0, signals: [P0] }
          - { name: P1, signals: [P1] }
          - { name: P2, signals: [P2] }
      - name: Negative input
        choices:
          - { name: Disable }
          - { name: N0, signals: [N0] }
          - { name: N1, signals: [N1] }
          - { name: N2, signals: [N2] }
      - name: Output
        choices:
          - { name: Disable }
          - { name: O0, signals: [O0] }
          - { name: O1, signals: [O1] }
    remaps:
      - name: No remap
        pins: { N0: PA6, N1: PB6, N2: PA1, O0: PA3, O1: PB5, P0: PB0, P1: PB8, P2: PB4 }

  OPA2:
    category: Analog
    settings:
      - name: Positive input
        choices:
          - { name: Disable }
          - { name: P0, signals: [P0] }
          - { name: P1, signals: [P1] }
          - { name: P2, signals: [P2] }
      - name: Negative input
        choices:
          - { name: Disable }
          - { name: N0, signals: [N0] }
          - { name: N1, signals: [N1] }
          - { name: N2, signals: [N2] }
      - name: Output
        choices:
          - { name: Disable }
          - { name: O0, signals: [O0] }
          - { name: O1, signals: [O1] }
    remaps:
      - name: No remap
        pins: { N0: PA5, N1: PB1, N2: PA1, O0: PA4, O1: PA2, P0: PA7, P1: PB3, P2: PB7 }

  PIOC:
    category: System Core
    notes: >
      The programmable I/O controller. Its two pins are shared with the SDI debug
      interface (PC18/PC19 are DIO/DCK), which is why enabling it and keeping SDI are
      a genuine conflict rather than a warning. `GPIO_Remap_PIOC` moves them.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Activated, signals: [IO0, IO1] }
    remaps:
      - name: No remap
        pins: { IO0: PC18, IO1: PC19 }
      - name: Partial remap 1
        macro: GPIO_Remap_PIOC
        pins: { IO0: PC7 }

  PWR:
    category: System Core
    pins:
      none: true
      source: "CH32X035DS0.md Table 2-1: no pin row carries a function of this peripheral (checked by tools/coverage.py)"
      supplies:
        - name: VDD
          pins: [VDD]
          range: "2-5.5 V (2.5 V minimum for the ADC or USB PD)"
          note: >
            The only rail. Powers the I/O pins and the internal regulator, and is the ADC's
            reference. The floor is set by two different blocks: a conversion needs 2.5 V,
            and so does the USB PD transmitter, which has to drive a compliant CC level.
          source: "CH32X035DS0.md 1.4.4"
        - name: GND
          pins: [GND]
          range: "0 V"
          note: >
            Ground, and the return for VDD. One decoupling capacitor per supply pin,
            placed at the pin.
          source: "CH32X035DS0.md Table 2-1"
    notes: >
      Power control. The PVD thresholds are named twice in the header - PWR_PVDLevel_0..3
      and the aliases PWR_PVDLevel_2V1/2V3/3V0/4V0 pointing at the same four values
      (ch32x035_pwr.h). The voltage aliases are used here because a threshold a user picks
      should read as a voltage, and the numeric form is the same constant.
    settings:
      - name: Programmable Voltage Detector (PVD)
        choices:
          - { name: Disable }
          - { name: Enabled }
      # DS Features: "Low power modes: Sleep, Stop, Standby", and the SPL has
      # PWR_EnterSTOPMode(PWR_STOPEntry) and PWR_EnterSTANDBYMode() (ch32x035_pwr.h).
      # Sleep is WFI/WFE on the core and needs no PWR call, which is why it is a choice
      # here and not a param. None of these claims a pin.
      - name: Low power mode
        choices:
          - { name: None }
          - { name: Sleep }
          - { name: Stop }
          - { name: Standby }
    params:
      - key: stop_entry
        name: Stop mode entry
        sdk_call: PWR_EnterSTOPMode
        sdk_args: [$VALUE]
        type: enum
        group: Advanced
        default: WFI
        options:
          - { name: WFI, value: 1, sdk: PWR_STOPEntry_WFI }
          - { name: WFE, value: 2, sdk: PWR_STOPEntry_WFE }
        help: "Which instruction puts the core to sleep when entering Stop. Only meaningful when the low power mode is Stop."
        when: { setting: Low power mode, is: Stop }
      - key: pvd_level
        name: PVD threshold
        sdk_call: PWR_PVDLevelConfig
        sdk_args: [$VALUE]
        type: enum
        group: Basic
        default: 2.3 V
        options:
          - { name: 2.1 V, value: 0,  sdk: PWR_PVDLevel_2V1 }
          - { name: 2.3 V, value: 32, sdk: PWR_PVDLevel_2V3 }
          - { name: 3.0 V, value: 64, sdk: PWR_PVDLevel_3V0 }
          - { name: 4.0 V, value: 96, sdk: PWR_PVDLevel_4V0 }
        help: "PWR_CTLR PLS. The values are the register encodings, not indices."

  FLASH:
    category: System Core
    pins: { none: true, source: "CH32X035DS0.md Table 2-1: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    notes: >
      Only the user option bytes are offered. The programming API (unlock, erase,
      program) is a runtime concern rather than a configuration, and the write-protection
      words WRPR0-3 are one bit per pair of sectors, which this format cannot express -
      the same call CH32V006 made, recorded there in FLASH's notes for the same reason.
    settings:
      - name: Independent watchdog start (IWDG_SW)
        choices:
          - { name: Started by software (factory default) }
          - { name: Started by hardware }
      - name: Reset on entering Standby (STANDY_RST)
        choices:
          - { name: No reset (factory default) }
          - { name: Reset }
      # A user option byte CH32V006 DOES NOT HAVE. RM v1.9 USER byte, bit 1: "System
      # reset control in Stop mode: 1: Disable, system will not be reset when entering
      # Stop mode; 0: Enable". Reset value 1. Found by auditing the USER byte against
      # CH32V006's, which has STANDBY_RST but no Stop-mode equivalent.
      - name: Reset on entering Stop (STOP_RST)
        choices:
          - { name: No reset (factory default) }
          - { name: Reset }

  EXTI:
    category: System Core
    pins: { none: true, source: "CH32X035DS0.md Table 2-1: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    notes: >
      THIRTY lines, not the 26 the grouped vectors cover. Lines 0-25 reach pins through
      AFIO_EXTICR and are served by the three grouped vectors EXTI7_0 / EXTI15_8 /
      EXTI25_16; lines 26-29 are INTERNAL events with their own vectors - 26 PVD, 27
      auto-wake-up, 28 USBFS wake-up, 29 USBPD wake-up (ch32x035_exti.h). Only the trigger
      edge is configurable here; which pin a line watches is a pin question and lives in
      the top-level `exti:` block where the conflict engine can see it.
    settings:
      - name: EXTI trigger edge
        choices:
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }

  AWU:
    category: System Core
    pins: { none: true, source: "CH32X035DS0.md Table 2-1: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    notes: >
      Automatic wake-up. Nothing here claims a pin: the AWU runs from the internal
      low-speed clock and its event reaches the core through EXTI line 27. A peripheral
      CH32V006 does not have at all.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Activated }
    params:
      - key: prescaler
        name: Prescaler
        sdk_call: AWU_SetPrescaler
        sdk_args: [$VALUE]
        type: enum
        group: Basic
        default: "4096"
        options:
          - { name: "1",     value: 0,  sdk: AWU_Prescaler_1 }
          - { name: "2",     value: 2,  sdk: AWU_Prescaler_2 }
          - { name: "4",     value: 3,  sdk: AWU_Prescaler_4 }
          - { name: "8",     value: 4,  sdk: AWU_Prescaler_8 }
          - { name: "16",    value: 5,  sdk: AWU_Prescaler_16 }
          - { name: "32",    value: 6,  sdk: AWU_Prescaler_32 }
          - { name: "64",    value: 7,  sdk: AWU_Prescaler_64 }
          - { name: "128",   value: 8,  sdk: AWU_Prescaler_128 }
          - { name: "256",   value: 9,  sdk: AWU_Prescaler_256 }
          - { name: "512",   value: 10, sdk: AWU_Prescaler_512 }
          - { name: "1024",  value: 11, sdk: AWU_Prescaler_1024 }
          - { name: "2048",  value: 12, sdk: AWU_Prescaler_2048 }
          - { name: "4096",  value: 13, sdk: AWU_Prescaler_4096 }
          - { name: "10240", value: 14, sdk: AWU_Prescaler_10240 }
          - { name: "61440", value: 15, sdk: AWU_Prescaler_61440 }
        help: >
          Divides the low-speed clock. Note the encoding is NOT a power-of-two index: /1 is
          0 and /2 is 2, so 1 is skipped, and the last two steps are 10240 and 61440 rather
          than 8192 and 16384. Read off ch32x035_awu.h rather than derived.
      - key: window
        name: Window value
        sdk_call: AWU_SetWindowValue
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 63
        min: 0
        max: 63
        help: "6-bit compare value; the wake-up period is prescaler x (window + 1) low-speed clocks."

  # ---------------- Connectivity ----------------
  USBFS:
    category: Connectivity
    notes: >
      Full-speed USB, host AND device (ch32x035_usb.h; the vector is USBFS_IRQn with a
      separate USBFSWakeUp_IRQn). UDM is PC16 and UDP is PC17 in DS Table 2-1's
      main-function column. Its clock bit is on AHB - `RCC_AHBPeriph_USBFS`
      (ch32x035_rcc.h) - not APB, which is a domain no CH32V006 peripheral uses.
      NOTE DS note 4: PC16 and PC17 are shorted to PC11 and PC10 inside every package
      except QFN20 and QFN12, and in USB applications PC10/PC11 must be left as
      floating inputs. That coupling is real and is recorded in the notes; it is not
      expressible in `settings:` yet.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Device (FS), signals: [UDM, UDP] }
          - { name: Host (FS),   signals: [UDM, UDP] }
    remaps:
      - name: Default
        pins: { UDM: PC16, UDP: PC17 }

  USBPD:
    category: Connectivity
    notes: >
      USB Power Delivery over Type-C. CC1 is PC14 and CC2 is PC15 (DS Table 2-1). The
      DS model table advertises source, sink and DRP for every variant. Clock bit
      `RCC_AHBPeriph_USBPD` on AHB; vectors USBPD_IRQn and USBPDWakeUp_IRQn.
      This is the part's headline feature and the CC pins are ordinary pins as far as
      the conflict engine is concerned.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Sink,   signals: [CC1, CC2] }
          - { name: Source, signals: [CC1, CC2] }
          - { name: DRP (dual role), signals: [CC1, CC2] }
    remaps:
      - name: Default
        pins: { CC1: PC14, CC2: PC15 }

# -----------------------------------------------------------------------------
# DMA1 - EIGHT channels, against CH32V006's seven (RM 9.2: "The DMA controller
# provides 8 channels"; ch32x035.h defines DMA1_Channel1_BASE .. DMA1_Channel8_BASE).
#
# THE REQUEST MAP IS PARTIAL AND EVERY ENTRY IS CITED. RM Table 9-2's request-mapping
# table is one of the places the PDF conversion did real damage: the peripheral rows
# survive but the COLUMN POSITIONS are gone, so "USART1 USART1_TX USART1_RX" says which
# requests exist and no longer says which channels they sit on. Reading a channel number
# off that is exactly the guess this round bans.
#
# What IS here comes from WCH's own EVT examples, which name the channel in code and
# often in a comment beside it - the top authority, and unambiguous:
#
#   ADC1        ch1    EXAM/ADC/ADC_DMA/User/main.c
#   SPI1_RX     ch2    EXAM/SPI/SPI_DMA/User/main.c:221  DMA_Rx_Init(DMA1_Channel2, &SPI1->DATAR)
#   SPI1_TX     ch3    EXAM/SPI/SPI_DMA/User/main.c:220  DMA_Tx_Init(DMA1_Channel3, &SPI1->DATAR)
#   USART3_TX   ch2    EXAM/USART/USART_DMA/User/main.c:123  /* USART3 Tx */
#   USART3_RX   ch3    EXAM/USART/USART_DMA/User/main.c:124  /* USART3 Rx */
#   USART2_RX   ch6    EXAM/USART/USART_DMA/User/main.c:122  /* USART2 Rx */
#   USART2_TX   ch7    EXAM/USART/USART_DMA/User/main.c:121  /* USART2 Tx */
#   I2C1_TX     ch6    EXAM/I2C/I2C_DMA/User/main.c:192  DMA_Tx_Init(DMA1_Channel6, &I2C1->DATAR)
#   I2C1_RX     ch7    EXAM/I2C/I2C_DMA/User/main.c:215  DMA_Rx_Init(DMA1_Channel7, &I2C1->DATAR)
#
# Those also tell us something about the mangled table: the RM lists each peripheral's
# requests LEFT TO RIGHT IN CHANNEL ORDER. "USART2 USART2_RX USART2_TX" is RX then TX and
# the example confirms 6 then 7; "USART3 USART3_TX USART3_RX" is TX then RX and the
# example confirms 2 then 3. So the row ORDER survived and only the column POSITIONS were
# lost - which is why the remaining rows are recoverable in principle but not yet.
#
# STILL OPEN, recorded rather than guessed, and tracked in CH32X035.notes.md:
# USART1_TX/RX, USART4_TX/RX, and every TIM1 and TIM2 request. The PDF recovery for the
# lost columns now exists - agents/proposals/x035_dma_requests.py, agreeing with the
# markdown row order and nine EVT anchors on all 27 requests - but it is a PROPOSAL and
# not merged here. See the board.
dma:
  controller: DMA1
  channels: 8

  requests:
    1: [ADC1]
    2: [SPI1_RX, USART3_TX]
    3: [SPI1_TX, USART3_RX]
    6: [USART2_RX, I2C1_TX]
    7: [USART2_TX, I2C1_RX]

  init_struct: DMA_InitTypeDef

  # MISSING ENTIRELY until 2026-09-14 - a real defect, not cosmetic: with no
  # `register:` block, `dmaChannelHandle()` (app/engine/codegen.js) has no
  # `channel_macro` to build a handle from, so EVERY configured DMA request on this
  # part emitted a TODO ("dma.register.channel_macro — the SPL name of a channel")
  # instead of DMA_Init()/DMA_Cmd() - even after the SEPARATE `cmd:` gap below is
  # fixed, since `if (spec.fn && handle)` needs both. Confirmed by generating real C
  # for a configured ADC1 request. The `channel_params:` rows below already reference
  # `field: DIR`/`field: PL`/etc - clearly written expecting this block to exist -
  # so this was an omission, not a choice. Address and field layout confirmed
  # against THIS part's own header/RM (DMA1_Channel1_BASE = AHBPERIPH_BASE + 0x0008 =
  # 0x40020008, ch32x035.h:602,625; offset 0x08 + (x-1)*20, CH32X035RM.md:1492) -
  # identical to CH32V006's, same family, checked rather than assumed to carry over.
  register:
    name: DMA_CFGRx
    address: 0x40020008
    stride: 20
    channel_macro: DMA1_Channel$CH
    fields:
      EN:      { lsb: 0,  bits: 1 }
      TCIE:    { lsb: 1,  bits: 1 }
      HTIE:    { lsb: 2,  bits: 1 }
      TEIE:    { lsb: 3,  bits: 1 }
      DIR:     { lsb: 4,  bits: 1 }
      CIRC:    { lsb: 5,  bits: 1 }
      PINC:    { lsb: 6,  bits: 1 }
      MINC:    { lsb: 7,  bits: 1 }
      PSIZE:   { lsb: 8,  bits: 2 }
      MSIZE:   { lsb: 10, bits: 2 }
      PL:      { lsb: 12, bits: 2 }
      MEM2MEM: { lsb: 14, bits: 1 }

  # Ported from CH32V006 - DMA_InitTypeDef is member-for-member identical between
  # the two families - and re-checked against the X035 headers by verify_sdk_names.
  channel_params:
    - key: dir
      name: Direction
      type: enum
      group: Basic
      field: DIR
      sdk_field: DMA_DIR
      default: Peripheral to memory
      options:
        - { name: Peripheral to memory, value: 0, sdk: DMA_DIR_PeripheralSRC }
        - { name: Memory to peripheral, value: 1, sdk: DMA_DIR_PeripheralDST }
      help: "DMA_CFGRx DIR, bit 4: 0 reads from the peripheral, 1 reads from memory. The SDK names it after what the PERIPHERAL is - PeripheralSRC is peripheral-to-memory."
    - key: priority
      name: Priority
      type: enum
      group: Basic
      field: PL
      sdk_field: DMA_Priority
      default: Low
      options:
        - { name: Low,       value: 0, sdk: DMA_Priority_Low }
        - { name: Medium,    value: 1, sdk: DMA_Priority_Medium }
        - { name: High,      value: 2, sdk: DMA_Priority_High }
        - { name: Very high, value: 3, sdk: DMA_Priority_VeryHigh }
      help: "DMA_CFGRx PL[13:12]. Software priority; ties are broken by channel number, lowest wins (RM 8.2)."
    - key: mode
      name: Mode
      type: enum
      group: Basic
      field: CIRC
      sdk_field: DMA_Mode
      default: Normal
      options:
        - { name: Normal,   value: 0, sdk: DMA_Mode_Normal }
        - { name: Circular, value: 1, sdk: DMA_Mode_Circular }
      help: "DMA_CFGRx CIRC, bit 5. Circular reloads the transfer count and runs forever - what a continuously sampling ADC or a repeating PWM pattern wants. RM 8.2.4: circular mode is NOT available in memory-to-memory mode."
    - key: pinc
      name: Increment peripheral address
      type: bool
      group: Basic
      field: PINC
      sdk_field: DMA_PeripheralInc
      default: false
      sdk_enabled: DMA_PeripheralInc_Enable
      sdk_disabled: DMA_PeripheralInc_Disable
      help: "DMA_CFGRx PINC, bit 6. Off for a normal peripheral: its data register is one fixed address."
    - key: minc
      name: Increment memory address
      type: bool
      group: Basic
      field: MINC
      sdk_field: DMA_MemoryInc
      default: true
      sdk_enabled: DMA_MemoryInc_Enable
      sdk_disabled: DMA_MemoryInc_Disable
      help: "DMA_CFGRx MINC, bit 7. On for a buffer - off would rewrite one variable over and over."
    - key: psize
      name: Peripheral data width
      type: enum
      group: Basic
      field: PSIZE
      sdk_field: DMA_PeripheralDataSize
      default: Byte
      options:
        - { name: Byte,      value: 0, sdk: DMA_PeripheralDataSize_Byte }
        - { name: Half Word, value: 1, sdk: DMA_PeripheralDataSize_HalfWord }
        - { name: Word,      value: 2, sdk: DMA_PeripheralDataSize_Word }
      help: "DMA_CFGRx PSIZE[9:8]: 00 8-bit, 01 16-bit, 10 32-bit. 11 is reserved, which is why there are three options and not four. Match the peripheral's own register width."
    - key: msize
      name: Memory data width
      type: enum
      group: Basic
      field: MSIZE
      sdk_field: DMA_MemoryDataSize
      default: Byte
      options:
        - { name: Byte,      value: 0, sdk: DMA_MemoryDataSize_Byte }
        - { name: Half Word, value: 1, sdk: DMA_MemoryDataSize_HalfWord }
        - { name: Word,      value: 2, sdk: DMA_MemoryDataSize_Word }
      help: "DMA_CFGRx MSIZE[11:10], same encoding as PSIZE. Widths may differ from the peripheral's; the DMA packs or unpacks between them."
    - key: m2m
      name: Memory to memory
      type: bool
      group: Advanced
      field: MEM2MEM
      sdk_field: DMA_M2M
      default: false
      sdk_enabled: DMA_M2M_Enable
      sdk_disabled: DMA_M2M_Disable
      help: "DMA_CFGRx MEM2MEM, bit 14. A hardware peripheral request must leave this off: the channel would ignore the request line and run from a software trigger instead."

  # Interrupt-enable bits in the same register. They are not user parameters - the app
  # turns them on when the matching NVIC vector is enabled - but codegen needs the names.

  request_defaults:
    ADC1:      { dir: Peripheral to memory, psize: Half Word, msize: Half Word, mode: Circular }
    SPI1_RX:   { dir: Peripheral to memory }
    SPI1_TX:   { dir: Memory to peripheral }
    USART2_RX: { dir: Peripheral to memory }
    USART2_TX: { dir: Memory to peripheral }
    USART3_RX: { dir: Peripheral to memory }
    USART3_TX: { dir: Memory to peripheral }
    I2C1_RX:   { dir: Peripheral to memory }
    I2C1_TX:   { dir: Memory to peripheral }

  notes: >
    The ADC default is half-word both sides and circular for the same reason as on
    CH32V006 - ADC_RDATAR is 12 bits in a 16-bit field, so a byte transfer truncates
    every sample, and a one-shot ADC rarely needs DMA at all. USART and I2C data
    registers are 8 bits, so byte/byte is right there.

# -----------------------------------------------------------------------------
# Clock tree.
#
# **NO HSE, AND NO PLL.** The only source is the internal 48 MHz RC oscillator.
# `grep -c HSE data/sources/X035/Evt/EXAM/SRC/Peripheral/inc/ch32x035_rcc.h` returns 0,
# and EVT's system_ch32x035.c offers exactly five SYSCLK settings, every one of them
# HSI: SYSCLK_FREQ_8MHz_HSI / 12 / 16 / 24 / 48, with 48 the default (lines 19-23).
#
# So there is no `hse_peripheral`, no `hse_setting`, no `hse_signals` and no crystal
# pins on this part, and there must be no HSE box in the clock tab. Round 2's rule was
# that a control is justified by the MCU data or it does not exist; this is the first
# part that tests the rule from the other direction.
#
# HCLK comes from RCC_HCLKConfig(RCC_SYSCLK_DivN) with N in 1..8, 16, 32, 64, 128, 256
# (ch32x035_rcc.h:31-43). There is no separate APB1/APB2 prescaler function and no
# ADCCLK prescaler function in the header, and `RCC_ClocksTypeDef` has only SYSCLK,
# HCLK, PCLK1 and PCLK2 - no ADCCLK_Frequency, unlike CH32V00x.
clock:
  sources:
    HSI: { mhz: 48, fixed: true }
  sysclk:
    sources: [HSI]
    max_mhz: 48
  buses:
    HB: [DMA1, USBFS, USBPD, SYS, RCC, IWDG, WWDG]
  prescalers:
    HB: { options: [1, 2, 3, 4, 5, 6, 7, 8, 16, 32, 64, 128, 256], max_mhz: 48,
          label: "HB prescaler (HPRE) -> HCLK" }

# -----------------------------------------------------------------------------
# Interrupt vectors. FORTY-FIVE of them, and both EVT sources agree on every one:
# `IRQn_Type` in ch32x035.h and the `.word` table in EXAM/SRC/Startup/startup_ch32x035.S
# give the same number, the same name and a handler for every enum entry, with nothing
# on one side only. CH32V006 has 29.
#
# Two things worth reading before assuming this is CH32V006 with more rows:
#
#   * **There is no RCC vector.** Number 19 is a gap in the enum and a `.word 0` in the
#     table, where CH32V006 has RCC_IRQn = 19. "Every family has an RCC interrupt" is
#     exactly the sort of assumption this part exists to break.
#   * **The EXTI vectors are GROUPED.** Three vectors cover twenty-six EXTI lines, so
#     each carries a `lines: [first, last]` range, inclusive. The NVIC tab lists three
#     rows, not twenty-six, and the EXTI tab finds a line's vector by looking for the
#     range containing it. ch32x035_exti.h defines THIRTY lines: 26-29 are internal
#     events (PVD, auto-wake-up, USBFS wake-up, USBPD wake-up) and have their own
#     vectors, so they are not covered by the grouped three.
nvic:
  controller: PFIC

  # THE PRIORITY SCHEME IS NOT CH32V006'S, and the round brief was right to say so.
  # CH32X035 is a QingKe V4C; CH32V006 is a V2A. Read from THIS manual's PFIC chapter
  # (RM v1.9 7.5.2.37, PFIC_IPRIORx) rather than carried across:
  #
  #   CH32V006 (V2A): bits [7:6] are the priority control bits - TWO - and [5:0] are
  #                   "reserved, fixed to 0, write invalid".
  #   CH32X035 (V4C): bits **[7:5]** are the priority control bits - **THREE** - and
  #                   [4:0] are "Reserved, fixed to 0, write invalid".
  #
  # So this part has EIGHT priority levels where CH32V006 has four, and a spinner that
  # hardcodes either part's range is wrong on the other.
  #
  # Nesting, same section plus RM 7.1 ("maximum nesting depth 2 levels"): with no
  # nesting configured there are no preemption bits at all and all three are plain
  # priority; with 2-level nesting "bit 7 is the preemption bit", leaving [6:5] as
  # sub-priority. "The smaller the priority value, the higher the priority."
  #
  # As on CH32V006, WHERE the nesting depth is selected is not in this register and no
  # register write is claimed for the switch itself - it is offered as a labelled choice
  # and nothing more. Do not invent one.
  scheme:
    register: { name: PFIC_IPRIORx, address: 0xE000E400, bits_per_vector: 8 }
    priority_bits: 3
    priority_lsb: 5
    max_nesting: 2
    groups:
      - name: No nesting (3 priority bits, no preemption)
        default: true
        preempt: { bits: 0, min: 0, max: 0 }
        sub:     { bits: 3, lsb: 5, min: 0, max: 7 }
      - name: 2 levels of nesting (1 preemption bit, 2 sub-priority bits)
        preempt: { bits: 1, lsb: 7, min: 0, max: 1 }
        sub:     { bits: 2, lsb: 5, min: 0, max: 3 }

  vectors:
    - { name: NonMaskableInt, vector: 2 , irqn: NonMaskableInt_IRQn, handler: NMI_Handler             , system: true, fixed: true }
    - { name: EXC           , vector: 3 , irqn: EXC_IRQn           , handler: HardFault_Handler       , system: true, fixed: true }
    - { name: Ecall_M_Mode  , vector: 5 , irqn: Ecall_M_Mode_IRQn  , handler: Ecall_M_Mode_Handler    , system: true }
    - { name: Ecall_U_Mode  , vector: 8 , irqn: Ecall_U_Mode_IRQn  , handler: Ecall_U_Mode_Handler    , system: true }
    - { name: Break_Point   , vector: 9 , irqn: Break_Point_IRQn   , handler: Break_Point_Handler     , system: true }
    - { name: SysTick       , vector: 12, irqn: SysTick_IRQn       , handler: SysTick_Handler         , system: true }
    - { name: Software      , vector: 14, irqn: Software_IRQn      , handler: SW_Handler              , system: true }
    - { name: WWDG          , vector: 16, irqn: WWDG_IRQn          , handler: WWDG_IRQHandler         , peripheral: WWDG }
    - { name: PVD           , vector: 17, irqn: PVD_IRQn           , handler: PVD_IRQHandler          , peripheral: PWR }
    - { name: FLASH         , vector: 18, irqn: FLASH_IRQn         , handler: FLASH_IRQHandler        , peripheral: FLASH }
    - { name: EXTI7_0       , vector: 20, irqn: EXTI7_0_IRQn       , handler: EXTI7_0_IRQHandler      , lines: [0, 7], peripheral: EXTI }
    - { name: AWU           , vector: 21, irqn: AWU_IRQn           , handler: AWU_IRQHandler          , peripheral: AWU }
    - { name: DMA1_CH1      , vector: 22, irqn: DMA1_Channel1_IRQn , handler: DMA1_Channel1_IRQHandler, peripheral: DMA1, channel: 1 }
    - { name: DMA1_CH2      , vector: 23, irqn: DMA1_Channel2_IRQn , handler: DMA1_Channel2_IRQHandler, peripheral: DMA1, channel: 2 }
    - { name: DMA1_CH3      , vector: 24, irqn: DMA1_Channel3_IRQn , handler: DMA1_Channel3_IRQHandler, peripheral: DMA1, channel: 3 }
    - { name: DMA1_CH4      , vector: 25, irqn: DMA1_Channel4_IRQn , handler: DMA1_Channel4_IRQHandler, peripheral: DMA1, channel: 4 }
    - { name: DMA1_CH5      , vector: 26, irqn: DMA1_Channel5_IRQn , handler: DMA1_Channel5_IRQHandler, peripheral: DMA1, channel: 5 }
    - { name: DMA1_CH6      , vector: 27, irqn: DMA1_Channel6_IRQn , handler: DMA1_Channel6_IRQHandler, peripheral: DMA1, channel: 6 }
    - { name: DMA1_CH7      , vector: 28, irqn: DMA1_Channel7_IRQn , handler: DMA1_Channel7_IRQHandler, peripheral: DMA1, channel: 7 }
    - { name: ADC1          , vector: 29, irqn: ADC1_IRQn          , handler: ADC1_IRQHandler         , peripheral: ADC1 }
    - { name: I2C1_EV       , vector: 30, irqn: I2C1_EV_IRQn       , handler: I2C1_EV_IRQHandler      , peripheral: I2C1 }
    - { name: I2C1_ER       , vector: 31, irqn: I2C1_ER_IRQn       , handler: I2C1_ER_IRQHandler      , peripheral: I2C1 }
    - { name: USART1        , vector: 32, irqn: USART1_IRQn        , handler: USART1_IRQHandler       , peripheral: USART1 }
    - { name: SPI1          , vector: 33, irqn: SPI1_IRQn          , handler: SPI1_IRQHandler         , peripheral: SPI1 }
    - { name: TIM1_BRK      , vector: 34, irqn: TIM1_BRK_IRQn      , handler: TIM1_BRK_IRQHandler     , peripheral: TIM1 }
    - { name: TIM1_UP       , vector: 35, irqn: TIM1_UP_IRQn       , handler: TIM1_UP_IRQHandler      , peripheral: TIM1 }
    - { name: TIM1_TRG_COM  , vector: 36, irqn: TIM1_TRG_COM_IRQn  , handler: TIM1_TRG_COM_IRQHandler , peripheral: TIM1 }
    - { name: TIM1_CC       , vector: 37, irqn: TIM1_CC_IRQn       , handler: TIM1_CC_IRQHandler      , peripheral: TIM1 }
    - { name: TIM2_UP       , vector: 38, irqn: TIM2_UP_IRQn       , handler: TIM2_UP_IRQHandler      , peripheral: TIM2 }
    - { name: USART2        , vector: 39, irqn: USART2_IRQn        , handler: USART2_IRQHandler       , peripheral: USART2 }
    - { name: EXTI15_8      , vector: 40, irqn: EXTI15_8_IRQn      , handler: EXTI15_8_IRQHandler     , lines: [8, 15], peripheral: EXTI }
    - { name: EXTI25_16     , vector: 41, irqn: EXTI25_16_IRQn     , handler: EXTI25_16_IRQHandler    , lines: [16, 25], peripheral: EXTI }
    - { name: USART3        , vector: 42, irqn: USART3_IRQn        , handler: USART3_IRQHandler       , peripheral: USART3 }
    - { name: USART4        , vector: 43, irqn: USART4_IRQn        , handler: USART4_IRQHandler       , peripheral: USART4 }
    - { name: DMA1_CH8      , vector: 44, irqn: DMA1_Channel8_IRQn , handler: DMA1_Channel8_IRQHandler, peripheral: DMA1, channel: 8 }
    - { name: USBFS         , vector: 45, irqn: USBFS_IRQn         , handler: USBFS_IRQHandler        , peripheral: USBFS }
    - { name: USBFSWakeUp   , vector: 46, irqn: USBFSWakeUp_IRQn   , handler: USBFSWakeUp_IRQHandler  , peripheral: USBFS }
    - { name: PIOC          , vector: 47, irqn: PIOC_IRQn          , handler: PIOC_IRQHandler         , peripheral: PIOC }
    - { name: OPA           , vector: 48, irqn: OPA_IRQn           , handler: OPA_IRQHandler          , peripheral: OPA1 }
    - { name: USBPD         , vector: 49, irqn: USBPD_IRQn         , handler: USBPD_IRQHandler        , peripheral: USBPD }
    - { name: USBPDWakeUp   , vector: 50, irqn: USBPDWakeUp_IRQn   , handler: USBPDWakeUp_IRQHandler  , peripheral: USBPD }
    - { name: TIM2_CC       , vector: 51, irqn: TIM2_CC_IRQn       , handler: TIM2_CC_IRQHandler      , peripheral: TIM2 }
    - { name: TIM2_TRG_COM  , vector: 52, irqn: TIM2_TRG_COM_IRQn  , handler: TIM2_TRG_COM_IRQHandler , peripheral: TIM2 }
    - { name: TIM2_BRK      , vector: 53, irqn: TIM2_BRK_IRQn      , handler: TIM2_BRK_IRQHandler     , peripheral: TIM2 }
    - { name: TIM3          , vector: 54, irqn: TIM3_IRQn          , handler: TIM3_IRQHandler         , peripheral: TIM3 }
# -----------------------------------------------------------------------------
# Code generation - the family-level names, every one checked against the X035 EVT
# headers by tools/verify_sdk_names.py.
codegen:
  header: ch32x035.h

  sdk:
    evt: X035            # data/sources/X035/Evt
    series: ch32x035     # framework-wch-noneos-sdk/Peripheral/<series>/inc

  # APB2, not the PB2 that CH32V00x uses (ch32x035_rcc.h). Two live spellings in the
  # repo is the point: neither can be hardcoded in the generator.
  gpio_clock: { fn: RCC_APB2PeriphClockCmd, port: RCC_APB2Periph_GPIO$PORT, afio: RCC_APB2Periph_AFIO }

  # REMAPS ARE NAMED MACROS ON THIS FAMILY, not raw register fields.
  #
  # CH32V006 writes AFIO->PCFR1 directly and `codegen.remap` carries lsb/bits per
  # peripheral. CH32X035's EVT exposes 40 named macros applied with one call:
  # `GPIO_PinRemapConfig(GPIO_FullRemap_USART2, ENABLE)`. `style:` says which route this
  # part takes, so neither family is special-cased and the generator does not guess.
  #
  # Why macro rather than raw fields here: the EVT examples all use GPIO_PinRemapConfig,
  # so it is the spelling a user reading WCH's own code recognises; the macro packs
  # register position AND value into one constant that the SDK decodes, so building the
  # mask by hand means re-deriving an encoding the SDK already knows; and a wrong macro
  # name fails to compile and is caught by verify_sdk_names.py first, where a wrong
  # hand-built mask is silent. Posted to AGENT-2 on the board before being filled.
  #
  # An index with no `macro:` emits nothing - which is how "No remap" stays silent.
  remap:
    style: macro
    fn: GPIO_PinRemapConfig
    enable: ENABLE

  init_structs:
    GPIO_InitTypeDef:        { fn: GPIO_Init }
    USART_InitTypeDef:       { fn: USART_Init }
    SPI_InitTypeDef:         { fn: SPI_Init }
    I2C_InitTypeDef:         { fn: I2C_Init }
    ADC_InitTypeDef:         { fn: ADC_Init }
    # `cmd:`/`deinit:` MISSING until 2026-09-14 - a real, SILENT defect, not cosmetic:
    # DMA_Init() was called and applied but DMA_Cmd() (the channel's EN bit) was never
    # emitted, no complaint, no shipped fixture ever configured a live request to
    # exercise it. Same gap found on CH32H417 (agents/BOARD.md 2026-09-14), fixed here
    # too rather than left for the next person to rediscover per part.
    DMA_InitTypeDef:         { fn: DMA_Init, cmd: DMA_Cmd, deinit: DMA_DeInit }   # ch32x035_dma.h:168,169,171
    TIM_TimeBaseInitTypeDef: { fn: TIM_TimeBaseInit }
    TIM_BDTRInitTypeDef:     { fn: TIM_BDTRConfig }

  # USBFS has TWO handles at the SAME base address - `USBFSD` for device mode and
  # `USBFSH` for host (ch32x035.h:676-677, both at USBFS_BASE). Which one a call takes
  # depends on the mode the user picked, so a single `periph_handle` entry cannot be
  # right for both; the device handle is named here because Device is the common case,
  # and the host case is an open question in CH32X035.notes.md rather than a guess.
  periph_handle:
    DMA1:   DMA1
    USBFS:  USBFSD
    USART1: USART1
    USART2: USART2
    USART3: USART3
    USART4: USART4
    SPI1:   SPI1
    I2C1:   I2C1
    TIM1:   TIM1
    TIM2:   TIM2
    TIM3:   TIM3
    ADC1:   ADC1

  # RCC_CFGR0 - RM v1.9 3.4.2, offset 0x04, reset 0x00000050.
  #
  # **THERE IS NO `sw` FIELD.** CH32V006's block has SW[1:0] to pick between HSI, HSE
  # and PLLCLK; this register has none, because this part has exactly one clock source
  # and nothing to switch between. The absence is the fact - a generator that assumes
  # every RCC has a source mux has nothing to write here, and correctly writes nothing.
  # Bits [23:8] and [3:0] are Reserved; only MCO and HPRE are user fields.
  rcc:
    register: "RCC->CFGR0"
    # MCO[2:0], RM 3.4.2: "100: System clock (SYSCLK) output; 101: HIS clock output;
    # Other: No clock output." Only two real sources, which is the no-HSE shape showing
    # up a second time. Keys are the choice names of peripherals.RCC's MCO setting.
    mco:
      peripheral: RCC
      setting: Master Clock Output (MCO)
      lsb: 24
      bits: 3
      values: { Disable: 0, SYSCLK: 4, HSI: 5 }
    prescalers:
      # HPRE[3:0]. The RM gives TWO encodings for /2, /4 and /8 (0001/1000, 0011/1001,
      # 0111/1010); these are the ones from the 0000..0111 run, plus 1011..1111 for the
      # larger dividers - the same choice CH32V006 made, for the same reason.
      #
      # Worth knowing and not guessable: the RESET value of this field is 0101b, so HCLK
      # comes out of reset at SYSCLK/6 = 8 MHz, not 48. The register's reset value
      # 0x00000050 says the same thing.
      HB: { lsb: 4, bits: 4,
            values: { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 7,
                      16: 11, 32: 12, 64: 13, 128: 14, 256: 15 } }

  # ONE speed, and it is 50 MHz here where CH32V006's one speed is 30
  # (ch32x035_gpio.h:25 - GPIOSpeed_TypeDef has the single member GPIO_Speed_50MHz).
  # That CH32V006's fix was data-driven rather than a special case is proved by this
  # part needing a different macro and no code change.
  speeds:
    "50 MHz": GPIO_Speed_50MHz

  periph_clock:
    AHB:
      register: RCC_AHBPCENR
      fn: RCC_AHBPeriphClockCmd
      prefix: RCC_AHBPeriph_
      bits: { DMA1: 0, USBFS: 12, USBPD: 17 }
    APB2:
      register: RCC_APB2PCENR
      fn: RCC_APB2PeriphClockCmd
      prefix: RCC_APB2Periph_
      bits: { AFIO: 0, GPIOA: 2, GPIOB: 3, GPIOC: 4, ADC1: 9, TIM1: 11, SPI1: 12, USART1: 14 }
    APB1:
      register: RCC_APB1PCENR
      fn: RCC_APB1PeriphClockCmd
      prefix: RCC_APB1Periph_
      bits: { TIM2: 0, TIM3: 1, WWDG: 11, USART2: 17, USART3: 18, USART4: 19, I2C1: 21, PWR: 28 }
    notes: >
      Only the peripherals this file actually models are listed. The header also defines
      RCC_AHBPeriph_SRAM and RCC_AHBPeriph_IO2W (the 1-wire controller) and
      RCC_APB1Periph_PWR - they go in with their peripherals, not before them, so that a
      clock enable can never name hardware the tree does not offer. Every bit number here
      is the bit position of the macro in ch32x035_rcc.h, not a guess: RCC_APB1Periph_I2C1
      is 0x00200000, which is bit 21.

  # Signal name -> SDK macro, for ADC1's `sample` param (sdk_repeat: channels,
  # ADC_RegularChannelConfig). THIS BLOCK DID NOT EXIST until 2026-09-14, which meant
  # ticking ANY ADC1 channel - not just the internal one - compiled to a TODO
  # (`codegen.channel_macros.ADC1 — no macro for any channel`, confirmed by generating
  # real C for a throwaway project with IN0/IN3 ticked before writing this: `wchcube_cli.js
  # --format c` on tests/fixtures/CH32X035_QFN28_full.wchproj with Channels: [IN0, IN3]
  # gave exactly that TODO). Found chasing the Vrefint gap, not the reason for it - IN0..
  # IN13 are the ordinary external channels (ch32x035_adc.h:73-86, ADC_Channel_0..13);
  # IN15 is the internal Vrefint channel this cycle's own work added the settings choice
  # for (see ADC1's own `notes:` for the citations) - ADC_Channel_14 is a real macro in
  # the header (0x0E) but the datasheet documents only "1 internal channel" (Vrefint), so
  # it is not modelled: a 15th name with no datasheet meaning would be exactly the
  # plausible-looking guess this repo exists to refuse.
  channel_macros:
    ADC1: { IN0: ADC_Channel_0, IN1: ADC_Channel_1, IN2: ADC_Channel_2, IN3: ADC_Channel_3,
            IN4: ADC_Channel_4, IN5: ADC_Channel_5, IN6: ADC_Channel_6, IN7: ADC_Channel_7,
            IN8: ADC_Channel_8, IN9: ADC_Channel_9, IN10: ADC_Channel_10, IN11: ADC_Channel_11,
            IN12: ADC_Channel_12, IN13: ADC_Channel_13,
            "IN15 (Vrefint, internal)": ADC_Channel_15 }

  # Without this, ADC1's pads get GPIO_Mode_AIN correctly (`category: Analog` +
  # `pins.<pin>.analog` is a working fallback) but the generated C says so with
  # "analog mode inferred — add codegen.analog_signals to be certain" on every ADC1 pin -
  # confirmed by generating C for a throwaway project before writing this. Not a defect
  # (the mode was already right), just not authoritative - closed while in the file for
  # the channel_macros fix, since both are the same "declare it, don't let the generator
  # guess" question. IN15 (Vrefint) is deliberately absent: it has no pin (no `signals:`
  # entry on its own settings choice), so it is not a signal any GPIO mode applies to.
  analog_signals:
    ADC1: [IN0, IN1, IN2, IN3, IN4, IN5, IN6, IN7, IN8, IN9, IN10, IN11, IN12, IN13]

# What this part offers, so no renderer has to know a part name.
gpio:
  speeds:
    - { name: "50 MHz", macro: GPIO_Speed_50MHz }

  # SIX modes, not eight. **This part has NO OPEN-DRAIN AT ALL** - GPIOMode_TypeDef
  # (ch32x035_gpio.h) has exactly AIN, IN_FLOATING, IPD, IPU, Out_PP and AF_PP. There
  # is no GPIO_Mode_Out_OD and no GPIO_Mode_AF_OD on this silicon, so the GPIO table
  # must not offer "Output Open Drain" or "Alternate Function Open Drain" here.
  # I wrote both in from CH32V006 out of habit and verify_sdk_names.py rejected them,
  # which is the whole argument for the gate: they are real, correctly spelled SPL
  # names that belong to a different chip.
  #
  # `class:` is WHICH PART OF THE CHIP drives the pin, and it exists so a constraint can
  # say "no output function" once rather than list mode names that go stale the day a mode
  # is added. Closed set: `out` (the GPIO output register drives it), `af` (a peripheral
  # drives it), `analog`, `in`. Input is not listed here - it is the implicit fourth mode
  # and its class is always `in`; `input_modes` is the pull list under it.
  #
  # `out` and `af` are SEPARATE on purpose, and the DS's shorted-pin notes are why they
  # had to be. Those notes prohibit an "output function", which is the GPIO output
  # register, not a peripheral driving its own pin. Reading it the other way refuses
  # `GPIO_Mode_AF_PP` on PC16/PC17 - which USBFS needs, because its own remap puts
  # UDM/UDP exactly there, and DS Note 4 says in the same breath that PC10/PC11 must be
  # floating inputs "in USB applications". The EVT's own USB examples configure no GPIO
  # at all on those pins. So the shorted-pair rule blocks `out` only; the entries below
  # say which classes each one means.
  modes:
    - { name: Output Push Pull,             macro: GPIO_Mode_Out_PP, class: out }
    - { name: Alternate Function Push Pull, macro: GPIO_Mode_AF_PP, class: af }
    - { name: Analog,                       macro: GPIO_Mode_AIN,    class: analog }

  # Mode `Input` folds the PULL setting into the macro, so these are keyed by pull name.
  #
  # **Pull-down is NOT available on every pin.** The header says so in a comment on the
  # member itself: "Only PA0--PA15 and PC16--PC17 support input pull-down"
  # (ch32x035_gpio.h:33). That is a per-PIN capability. It used to be recorded here as a
  # human `pins_note:` because nothing in data/mcus/ could express it; it is now a real
  # entry in `constraints:` below, which is the same fact stated in a form the GPIO
  # table, the conflict engine and codegen can all act on.
  input_modes:
    - { name: No pull,   macro: GPIO_Mode_IN_FLOATING }
    - { name: Pull-up,   macro: GPIO_Mode_IPU }
    - { name: Pull-down, macro: GPIO_Mode_IPD }

# =============================================================================
# Constraints - a choice the app must NOT offer, on some pins or in some state.
#
# The mechanism is documented in data/FORMAT.md under `constraints`; read it there
# before adding an entry. Nothing here names a part and nothing in app/ knows this part
# exists - the whole point of round 5 is that this is a data job.
#
# Semantics are PROHIBITION ONLY. One entry restricts one control, and:
#   only_on: [pins]   the choice is legal ONLY on these pins; refused everywhere else
#   not_on:  [pins]   the choice is refused on exactly these pins
# `packages:` scopes the entry to those packages - omitted means every package - and
# `when:` makes the refusal conditional on another peripheral being enabled. A pin that
# is not bonded on the current package cannot be configured at all, so an entry naming
# it is simply inert there.
#
# The three shapes the round asked for are all below and none folds into another:
# case 1 is an allow-list, case 2 is a deny-list that applies on some packages only,
# case 3 is conditional on a peripheral's state. Everything here is transcribed from a
# named source; where a source is quoted the quote is verbatim.
constraints:

  # ---- Case 1: the choice exists on some pins and not others -------------------
  #
  # Two sources say the same thing. The EVT header is cited first because a name the
  # software uses outranks a datasheet; the DS is cited because it covers the pins the
  # header does not enumerate (it says "the remaining pins do not support pull-down").
  - id: pull-down-only-on-pa0-pa15-pc16-pc17
    option: gpio.pull
    choices: [Pull-down]
    only_on: [PA0, PA1, PA2, PA3, PA4, PA5, PA6, PA7, PA8, PA9, PA10, PA11, PA12, PA13, PA14, PA15, PC16, PC17]
    reason: "Pull-down is available on PA0-PA15 and PC16-PC17 only; every other pin has no pull-down resistor."
    source: "ch32x035_gpio.h:33 + CH32X035DS0.md ch.1.4.19 (p.11)"

  # ---- Case 2: a shorted pair may not be an output function --------------------
  #
  # Note 4 excludes CH32X035F8U6 (QFN20) and CH32X035D8U6 (QFN12) BY NAME, so this is
  # the instance that is genuinely per-PACKAGE rather than per-die: on those two, PC16
  # and PC17 are bonded and NOT shorted, and driving them is legal. Scoping the entry is
  # therefore not bookkeeping - leaving it unscoped would refuse a choice the silicon
  # honours, which is the same defect as offering one it does not.
  #
  # `classes: [out]` is the GPIO output register only, NOT `af`. See the note on `class:`
  # above: the DS prohibits an "output function", and its own USB guidance for this very
  # pin pair requires USBFS to drive PC16/PC17. Blocking `af` too made USBFS fail
  # `--strict` on five of seven packages - a rule that refused a choice the silicon
  # honours, found by AGENT-2's measurement, not by reading. It cost a cycle and it is
  # the reason the class split exists.
  - id: shorted-pc10-pc11-pc16-pc17-not-output
    option: gpio.mode
    classes: [out]
    not_on: [PC10, PC11, PC16, PC17]
    packages: [LQFP64M, LQFP48, QFN28, QSOP28, TSSOP20]
    reason: "PC10 and PC17 are short-joined inside the chip, as are PC11 and PC16; neither pin of a shorted pair may be configured as a GPIO output. A peripheral may still drive it."
    source: "CH32X035DS0.md Note 4 (p.19)"

  - id: shorted-pb1-pb5-not-output
    option: gpio.mode
    classes: [out]
    not_on: [PB1, PB5]
    packages: [QFN28, QSOP28]
    reason: "PB1 and PB5 are shorted and sealed inside the chip; neither may be configured as a GPIO output."
    source: "CH32X035DS0.md Note 5 (p.19)"

  - id: shorted-pa12-pc14-pa13-pc15-not-output
    option: gpio.mode
    classes: [out]
    not_on: [PA12, PC14, PA13, PC15]
    packages: [QSOP28]
    reason: "PA12 and PC14 are shorted and sealed inside the chip, as are PA13 and PC15; neither pin of either pair may be configured as a GPIO output."
    source: "CH32X035DS0.md Note 6 (p.19)"

  - id: shorted-pa7-pc7-not-output
    option: gpio.mode
    classes: [out]
    not_on: [PA7, PC7]
    packages: [QFN12]
    reason: "PA7 and PC7 are short-circuited inside the chip; neither may be configured as a GPIO output."
    source: "CH32X035DS0.md Note 7 (p.19)"

  # ---- Case 3: the choice is illegal while another peripheral is on ------------
  #
  # The DS states the CONSEQUENCE - "in USB applications, the PC10 and PC11 pins should
  # be configured in floating input mode (default value after reset)". Two prohibitions
  # state it as a rule: no output or analog mode, and no pull. What is left is exactly
  # Input + No pull, which is what floating input means - and, as the DS notes
  # parenthetically, what the pins already are out of reset.
  #
  # PC16/PC17 carry the USB data lines themselves, so this only bites on a package where
  # PC10/PC11 are bonded, and there the shorted-pair rule above already makes PC10/PC11
  # unusable while USBFS holds PC16/PC17. This entry is what names the REASON as USB and
  # not merely "the pin is shared", which is the difference between a warning the user
  # can act on and one they cannot.
  - id: usb-pc10-pc11-not-driven
    option: gpio.mode
    classes: [out, af, analog]
    not_on: [PC10, PC11]
    when: { peripheral: USBFS, enabled: true }
    reason: "PC10 and PC11 are short-joined to the USBFS data pins, so while USBFS is enabled they must stay floating inputs."
    source: "CH32X035DS0.md Note 4 (p.19)"

  - id: usb-pc10-pc11-no-pull
    option: gpio.pull
    choices: [Pull-up, Pull-down]
    not_on: [PC10, PC11]
    when: { peripheral: USBFS, enabled: true }
    reason: "PC10 and PC11 are short-joined to the USBFS data pins, so while USBFS is enabled they must stay floating inputs and carry no pull."
    source: "CH32X035DS0.md Note 4 (p.19)"
