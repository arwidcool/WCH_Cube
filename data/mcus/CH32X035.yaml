# =============================================================================
#  CH32X035 — a 48 MHz QingKe RISC-V4C with USB-FS and USB PD.
#
#  Sources, in the precedence order data/sources/README.md sets out:
#    EVT   data/sources/X035/Evt/EXAM/SRC/Peripheral/inc/*.h   (highest, for NAMES)
#    RM    data/sources/X035/Datasheets/CH32X035RM.md
#    DS    data/sources/X035/Datasheets/CH32X035DS0.md  v2.2
#  Every fact cites one of them here or in CH32X035.notes.md.
#
#  THIS IS NOT A CH32V006 WITH DIFFERENT NUMBERS. Read CH32X035.notes.md before
#  editing: the ports are 24 bits wide, port C is not a contiguous range, there is no
#  HSE at all, remaps are named SDK macros rather than register field values, and the
#  clock domains are AHB/APB1/APB2 rather than HB/PB1/PB2.
#
#  The package tables below were re-derived from DS Table 2-1 by
#  tools/extract_pins.py and diff to 0 differences against the DS model table's own
#  I/O column on all seven packages. Two rows the PDF conversion destroyed are
#  declared in data/sources/X035/Datasheets/CH32X035_pin_corrections.yaml.
# =============================================================================

mcu:
  name: CH32X035
  vendor: WCH
  family: CH32X035
  core: QingKe RISC-V4C (RV32IMAC)
  flash_kb: 62
  sram_kb: 20
  vdd_v: [2.0, 5.5]
  max_sysclk_mhz: 48
  default_package: QFN28        # the only variant with a data/firmware environment

  # DS v2.2 ch.1 model table (lines 113-120). io_count is the DS's own I/O column and
  # validate_mcu.py cross-checks it against the package table below, which is what
  # catches a dropped or duplicated row.
  #
  # pio_board / pio_env: see data/FORMAT.md. Six of the seven packages have a board in
  # the installed ch32v platform; **QFN12 (D8U6) has none**, so it says nothing rather
  # than borrowing a neighbour's - the same position CH32V006F4U6 and D8U7 are in, and
  # the reason a generated project must refuse that variant by name.
  #
  # CH32X033F8P6 is in the same DS model table and is NOT here. It has its own pin
  # table (DS Table 2-2), so it is a different pinout rather than a variant of this
  # part, and it belongs in its own file. Reason recorded in CH32X035.notes.md.
  variants:
    CH32X035R8T6: { package: LQFP64M, flash_kb: 62, sram_kb: 20, temp: 85, io_count: 60, pio_board: genericCH32X035R8T6 }
    CH32X035C8T6: { package: LQFP48,  flash_kb: 62, sram_kb: 20, temp: 85, io_count: 46, pio_board: genericCH32X035C8T6 }
    CH32X035G8U6: { package: QFN28,   flash_kb: 62, sram_kb: 20, temp: 85, io_count: 27, pio_board: genericCH32X035G8U6, pio_env: CH32X035G8U6 }
    CH32X035G8R6: { package: QSOP28,  flash_kb: 62, sram_kb: 20, temp: 85, io_count: 26, pio_board: genericCH32X035G8R6 }
    CH32X035F8U6: { package: QFN20,   flash_kb: 62, sram_kb: 20, temp: 85, io_count: 19, pio_board: genericCH32X035F8U6 }
    CH32X035F7P6: { package: TSSOP20, flash_kb: 62, sram_kb: 20, temp: 85, io_count: 18, pio_board: genericCH32X035F7P6, notes: "DS calls this F7P6, not F8P6 - the 7 is not a typo" }
    CH32X035D8U6: { package: QFN12,   flash_kb: 62, sram_kb: 20, temp: 85, io_count: 11, notes: "No PlatformIO board ships for a D8U6 part, so no project can be generated for it." }

