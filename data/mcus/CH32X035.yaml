# -----------------------------------------------------------------------------
# Every pin name that exists on the die. Type comes from DS Table 2-1's "Pin type"
# column (note 1: I = Schmitt input, O = tri-state output, A = analog, P = power).
#
# THE SHAPE OF THESE PORTS IS THE POINT. Port A is PA0-PA23 and port B is PB0-PB21,
# both contiguous and both TWENTY-FOUR AND TWENTY-TWO pins wide rather than sixteen -
# `GPIO_Pin_0 .. GPIO_Pin_23` are all defined and the mask type is uint32_t
# (ch32x035_gpio.h:76-83). Port C is NOT a contiguous range: PC0-PC7, PC10-PC11,
# PC14-PC19, with holes at PC8-PC9 and PC12-PC13. Those four names appear in no row of
# DS Table 2-1 and nowhere in the RM. Anything iterating 0..max over a port invents them.
pins:
  VDD:   { type: power }
  GND:   { type: ground }
  # Port A: 24 pins, PA0-PA23, contiguous
  PA0:   { type: io, analog: true }
  PA1:   { type: io, analog: true }
  PA2:   { type: io, analog: true }
  PA3:   { type: io, analog: true }
  PA4:   { type: io, analog: true }
  PA5:   { type: io, analog: true }
  PA6:   { type: io, analog: true }
  PA7:   { type: io, analog: true }
  PA8:   { type: io }
  PA9:   { type: io }
  PA10:  { type: io }
  PA11:  { type: io, analog: true }
  PA12:  { type: io, analog: true }
  PA13:  { type: io, analog: true }
  PA14:  { type: io, analog: true }
  PA15:  { type: io }
  PA16:  { type: io }
  PA17:  { type: io }
  PA18:  { type: io }
  PA19:  { type: io }
  PA20:  { type: io }
  PA21:  { type: io }
  PA22:  { type: io, analog: true }
  PA23:  { type: io, analog: true }

  # Port B: 22 pins, PB0-PB21, contiguous
  PB0:   { type: io, analog: true }
  PB1:   { type: io, analog: true }
  PB2:   { type: io, analog: true }
  PB3:   { type: io, analog: true }
  PB4:   { type: io, analog: true }
  PB5:   { type: io, analog: true }
  PB6:   { type: io, analog: true }
  PB7:   { type: io, analog: true }
  PB8:   { type: io, analog: true }
  PB9:   { type: io }
  PB10:  { type: io }
  PB11:  { type: io }
  PB12:  { type: io }
  PB13:  { type: io }
  PB14:  { type: io }
  PB15:  { type: io }
  PB16:  { type: io }
  PB17:  { type: io }
  PB18:  { type: io }
  PB19:  { type: io }
  PB20:  { type: io }
  PB21:  { type: io }

  # Port C: 16 pins, PC0-PC19, HOLES at PC8, PC9, PC12, PC13
  PC0:   { type: io, analog: true }
  PC1:   { type: io, analog: true }
  PC2:   { type: io, analog: true }
  PC3:   { type: io, analog: true }
  PC4:   { type: io }
  PC5:   { type: io }
  PC6:   { type: io }
  PC7:   { type: io }
  PC10:  { type: io, notes: "Shorted to PC17 inside every package except QFN20 and QFN12 (DS note 4); has no column of its own in Table 2-1. In USB applications it must be left a floating input." }
  PC11:  { type: io, notes: "Shorted to PC16 inside every package except QFN20 and QFN12 (DS note 4); has no column of its own in Table 2-1. In USB applications it must be left a floating input." }
  PC14:  { type: io, analog: true }
  PC15:  { type: io, analog: true }
  PC16:  { type: io, analog: true }
  PC17:  { type: io, analog: true }
  PC18:  { type: io }
  PC19:  { type: io, analog: true }

# -----------------------------------------------------------------------------
# Peripherals. THIS IS A PARTIAL SET AND SAYS SO: the pin-bearing peripherals whose
# remap tables still need deriving from DS Table 2-3 are absent rather than stubbed,
# per the round rule that a partial part beats a fake one. What is missing and why is
# tracked in CH32X035.notes.md under "Not modelled yet".
peripherals:

  # ---------------- System Core ----------------
  SYS:
    category: System Core
    notes: >
      The two-wire serial debug interface. PC18 is DIO and PC19 is DCK (DS Table 2-1
      main-function column). Both also carry PIOC_IO0/PIOC_IO1, so switching SDI off
      is what frees them - which is why this is a choice and not a fixed claim.
      `GPIO_Remap_SWJ_Disable` (ch32x035_gpio.h:125) is the macro that does it.
    settings:
      - name: Debug interface
        choices:
          - { name: Serial Wire (SDI), signals: [DIO, DCK] }
          - { name: Disable }
    remaps:
      - name: Default
        pins: { DIO: PC18, DCK: PC19 }

  RCC:
    category: System Core
    notes: >
      **There is no HSE on this part.** `grep -c HSE ch32x035_rcc.h` is 0: the only
      oscillator is the internal 48 MHz RC. So this peripheral offers no crystal, no
      bypass and no oscillator pins, and the clock tree below has no HSE source. That
      is also why MCO offers only two real sources rather than four.
    settings:
      - name: Master Clock Output (MCO)
        choices:
          - { name: Disable }
          - { name: SYSCLK, signals: [MCO] }
          - { name: HSI,    signals: [MCO] }
    remaps:
      - name: Default
        pins: { MCO: PB9 }

  DMA1:
    category: System Core
    notes: "EIGHT channels (DMA1_Channel1_BASE..DMA1_Channel8_BASE, ch32x035.h), against CH32V006's seven."
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]

  IWDG:
    category: System Core
    # Same API as CH32V006 - free functions taking scalars, no init struct and no
    # handle (ch32x035_iwdg.h). ORDER IS LOAD-BEARING: write_access first, because
    # IWDG_PSCR and IWDG_RLDR are write-protected until 0x5555 reaches IWDG_CTLR and a
    # value written while locked is discarded silently. Same finding as CH32V006, and
    # the reason it is stated again here rather than assumed to carry across.
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]
    params:
      - key: write_access
        name: Register write access
        sdk_call: IWDG_WriteAccessCmd
        sdk_args: [$VALUE]
        type: enum
        group: Advanced
        default: Enable before writing
        options:
          - { name: Enable before writing, value: 21845, sdk: IWDG_WriteAccess_Enable }
          - { name: Keep locked,           value: 0,     sdk: IWDG_WriteAccess_Disable }
        help: "Unlocks IWDG_PSCR and IWDG_RLDR and must be written BEFORE either of them."
      - key: prescaler
        name: Prescaler
        sdk_call: IWDG_SetPrescaler
        sdk_args: [$VALUE]
        type: enum
        group: Basic
        default: "64"
        options:
          - { name: "4",   value: 0, sdk: IWDG_Prescaler_4 }
          - { name: "8",   value: 1, sdk: IWDG_Prescaler_8 }
          - { name: "16",  value: 2, sdk: IWDG_Prescaler_16 }
          - { name: "32",  value: 3, sdk: IWDG_Prescaler_32 }
          - { name: "64",  value: 4, sdk: IWDG_Prescaler_64 }
          - { name: "128", value: 5, sdk: IWDG_Prescaler_128 }
          - { name: "256", value: 6, sdk: IWDG_Prescaler_256 }
        help: "Divides the LSI. The header stops at 256 on this part too."
      - key: reload
        name: Reload value
        sdk_call: IWDG_SetReload
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 4095
        min: 0
        max: 4095
        help: "12-bit down-counter, so 4095 is the ceiling."

  WWDG:
    category: System Core
    # WWDG_Enable(uint8_t Counter) TAKES the counter, so switching it on and setting the
    # counter are one call - hence `counter` names WWDG_Enable, not WWDG_SetCounter.
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]
    params:
      - key: prescaler
        name: Prescaler
        sdk_call: WWDG_SetPrescaler
        sdk_args: [$VALUE]
        type: enum
        group: Basic
        default: "1"
        options:
          - { name: "1", value: 0, sdk: WWDG_Prescaler_1 }
          - { name: "2", value: 1, sdk: WWDG_Prescaler_2 }
          - { name: "4", value: 2, sdk: WWDG_Prescaler_4 }
          - { name: "8", value: 3, sdk: WWDG_Prescaler_8 }
        help: "Divides HCLK/4096. Four options - the header stops at 8."
      - key: window
        name: Window value
        sdk_call: WWDG_SetWindowValue
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 127
        min: 64
        max: 127
        help: "Refreshing EARLIER than this resets the part. Bit 6 must stay set, so the range starts at 64."
      - key: counter
        name: Counter start value
        sdk_call: WWDG_Enable
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 127
        min: 64
        max: 127
        help: "WWDG_Enable takes the counter, so this value and switching the watchdog on are one call."

  # ---------------- Connectivity ----------------
  USBFS:
    category: Connectivity
    notes: >
      Full-speed USB, host AND device (ch32x035_usb.h; the vector is USBFS_IRQn with a
      separate USBFSWakeUp_IRQn). UDM is PC16 and UDP is PC17 in DS Table 2-1's
      main-function column. Its clock bit is on AHB - `RCC_AHBPeriph_USBFS`
      (ch32x035_rcc.h) - not APB, which is a domain no CH32V006 peripheral uses.
      NOTE DS note 4: PC16 and PC17 are shorted to PC11 and PC10 inside every package
      except QFN20 and QFN12, and in USB applications PC10/PC11 must be left as
      floating inputs. That coupling is real and is recorded in the notes; it is not
      expressible in `settings:` yet.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Device (FS), signals: [UDM, UDP] }
          - { name: Host (FS),   signals: [UDM, UDP] }
    remaps:
      - name: Default
        pins: { UDM: PC16, UDP: PC17 }

  USBPD:
    category: Connectivity
    notes: >
      USB Power Delivery over Type-C. CC1 is PC14 and CC2 is PC15 (DS Table 2-1). The
      DS model table advertises source, sink and DRP for every variant. Clock bit
      `RCC_AHBPeriph_USBPD` on AHB; vectors USBPD_IRQn and USBPDWakeUp_IRQn.
      This is the part's headline feature and the CC pins are ordinary pins as far as
      the conflict engine is concerned.
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Sink,   signals: [CC1, CC2] }
          - { name: Source, signals: [CC1, CC2] }
          - { name: DRP (dual role), signals: [CC1, CC2] }
    remaps:
      - name: Default
        pins: { CC1: PC14, CC2: PC15 }

# -----------------------------------------------------------------------------
# Clock tree.
#
# **NO HSE, AND NO PLL.** The only source is the internal 48 MHz RC oscillator.
# `grep -c HSE data/sources/X035/Evt/EXAM/SRC/Peripheral/inc/ch32x035_rcc.h` returns 0,
# and EVT's system_ch32x035.c offers exactly five SYSCLK settings, every one of them
# HSI: SYSCLK_FREQ_8MHz_HSI / 12 / 16 / 24 / 48, with 48 the default (lines 19-23).
#
# So there is no `hse_peripheral`, no `hse_setting`, no `hse_signals` and no crystal
# pins on this part, and there must be no HSE box in the clock tab. Round 2's rule was
# that a control is justified by the MCU data or it does not exist; this is the first
# part that tests the rule from the other direction.
#
# HCLK comes from RCC_HCLKConfig(RCC_SYSCLK_DivN) with N in 1..8, 16, 32, 64, 128, 256
# (ch32x035_rcc.h:31-43). There is no separate APB1/APB2 prescaler function and no
# ADCCLK prescaler function in the header, and `RCC_ClocksTypeDef` has only SYSCLK,
# HCLK, PCLK1 and PCLK2 - no ADCCLK_Frequency, unlike CH32V00x.
clock:
  sources:
    HSI: { mhz: 48, fixed: true }
  sysclk:
    sources: [HSI]
    max_mhz: 48
  buses:
    HB: [DMA1, USBFS, USBPD, SYS, RCC, IWDG, WWDG]
  prescalers:
    HB: { options: [1, 2, 3, 4, 5, 6, 7, 8, 16, 32, 64, 128, 256], max_mhz: 48,
          label: "HB prescaler (HPRE) -> HCLK" }

# -----------------------------------------------------------------------------
# Interrupt vectors. FORTY-FIVE of them, and both EVT sources agree on every one:
# `IRQn_Type` in ch32x035.h and the `.word` table in EXAM/SRC/Startup/startup_ch32x035.S
# give the same number, the same name and a handler for every enum entry, with nothing
# on one side only. CH32V006 has 29.
#
# Two things worth reading before assuming this is CH32V006 with more rows:
#
#   * **There is no RCC vector.** Number 19 is a gap in the enum and a `.word 0` in the
#     table, where CH32V006 has RCC_IRQn = 19. "Every family has an RCC interrupt" is
#     exactly the sort of assumption this part exists to break.
#   * **The EXTI vectors are GROUPED.** Three vectors cover twenty-six EXTI lines, so
#     each carries a `lines: [first, last]` range, inclusive. The NVIC tab lists three
#     rows, not twenty-six, and the EXTI tab finds a line's vector by looking for the
#     range containing it. ch32x035_exti.h defines THIRTY lines: 26-29 are internal
#     events (PVD, auto-wake-up, USBFS wake-up, USBPD wake-up) and have their own
#     vectors, so they are not covered by the grouped three.
nvic:
  controller: PFIC
  vectors:
    - { name: NonMaskableInt, vector: 2 , irqn: NonMaskableInt_IRQn, handler: NMI_Handler             , system: true, fixed: true }
    - { name: EXC           , vector: 3 , irqn: EXC_IRQn           , handler: HardFault_Handler       , system: true, fixed: true }
    - { name: Ecall_M_Mode  , vector: 5 , irqn: Ecall_M_Mode_IRQn  , handler: Ecall_M_Mode_Handler    , system: true }
    - { name: Ecall_U_Mode  , vector: 8 , irqn: Ecall_U_Mode_IRQn  , handler: Ecall_U_Mode_Handler    , system: true }
    - { name: Break_Point   , vector: 9 , irqn: Break_Point_IRQn   , handler: Break_Point_Handler     , system: true }
    - { name: SysTick       , vector: 12, irqn: SysTick_IRQn       , handler: SysTick_Handler         , system: true }
    - { name: Software      , vector: 14, irqn: Software_IRQn      , handler: SW_Handler              , system: true }
    - { name: WWDG          , vector: 16, irqn: WWDG_IRQn          , handler: WWDG_IRQHandler         , peripheral: WWDG }
    - { name: DMA1_CH1      , vector: 22, irqn: DMA1_Channel1_IRQn , handler: DMA1_Channel1_IRQHandler, peripheral: DMA1, channel: 1 }
    - { name: DMA1_CH2      , vector: 23, irqn: DMA1_Channel2_IRQn , handler: DMA1_Channel2_IRQHandler, peripheral: DMA1, channel: 2 }
    - { name: DMA1_CH3      , vector: 24, irqn: DMA1_Channel3_IRQn , handler: DMA1_Channel3_IRQHandler, peripheral: DMA1, channel: 3 }
    - { name: DMA1_CH4      , vector: 25, irqn: DMA1_Channel4_IRQn , handler: DMA1_Channel4_IRQHandler, peripheral: DMA1, channel: 4 }
    - { name: DMA1_CH5      , vector: 26, irqn: DMA1_Channel5_IRQn , handler: DMA1_Channel5_IRQHandler, peripheral: DMA1, channel: 5 }
    - { name: DMA1_CH6      , vector: 27, irqn: DMA1_Channel6_IRQn , handler: DMA1_Channel6_IRQHandler, peripheral: DMA1, channel: 6 }
    - { name: DMA1_CH7      , vector: 28, irqn: DMA1_Channel7_IRQn , handler: DMA1_Channel7_IRQHandler, peripheral: DMA1, channel: 7 }
    - { name: DMA1_CH8      , vector: 44, irqn: DMA1_Channel8_IRQn , handler: DMA1_Channel8_IRQHandler, peripheral: DMA1, channel: 8 }
    - { name: USBFS         , vector: 45, irqn: USBFS_IRQn         , handler: USBFS_IRQHandler        , peripheral: USBFS }
    - { name: USBFSWakeUp   , vector: 46, irqn: USBFSWakeUp_IRQn   , handler: USBFSWakeUp_IRQHandler  , peripheral: USBFS }
    - { name: USBPD         , vector: 49, irqn: USBPD_IRQn         , handler: USBPD_IRQHandler        , peripheral: USBPD }
    - { name: USBPDWakeUp   , vector: 50, irqn: USBPDWakeUp_IRQn   , handler: USBPDWakeUp_IRQHandler  , peripheral: USBPD }

# -----------------------------------------------------------------------------
# Code generation - the family-level names, every one checked against the X035 EVT
# headers by tools/verify_sdk_names.py.
codegen:
  header: ch32x035.h

  sdk:
    evt: X035            # data/sources/X035/Evt
    series: ch32x035     # framework-wch-noneos-sdk/Peripheral/<series>/inc

  # APB2, not the PB2 that CH32V00x uses (ch32x035_rcc.h). Two live spellings in the
  # repo is the point: neither can be hardcoded in the generator.
  gpio_clock: { fn: RCC_APB2PeriphClockCmd, port: RCC_APB2Periph_GPIO$PORT, afio: RCC_APB2Periph_AFIO }

  init_structs:
    GPIO_InitTypeDef: { fn: GPIO_Init }

  # USBFS has TWO handles at the SAME base address - `USBFSD` for device mode and
  # `USBFSH` for host (ch32x035.h:676-677, both at USBFS_BASE). Which one a call takes
  # depends on the mode the user picked, so a single `periph_handle` entry cannot be
  # right for both; the device handle is named here because Device is the common case,
  # and the host case is an open question in CH32X035.notes.md rather than a guess.
  periph_handle:
    DMA1:  DMA1
    USBFS: USBFSD

  # RCC_CFGR0 - RM v1.9 3.4.2, offset 0x04, reset 0x00000050.
  #
  # **THERE IS NO `sw` FIELD.** CH32V006's block has SW[1:0] to pick between HSI, HSE
  # and PLLCLK; this register has none, because this part has exactly one clock source
  # and nothing to switch between. The absence is the fact - a generator that assumes
  # every RCC has a source mux has nothing to write here, and correctly writes nothing.
  # Bits [23:8] and [3:0] are Reserved; only MCO and HPRE are user fields.
  rcc:
    register: "RCC->CFGR0"
    # MCO[2:0], RM 3.4.2: "100: System clock (SYSCLK) output; 101: HIS clock output;
    # Other: No clock output." Only two real sources, which is the no-HSE shape showing
    # up a second time. Keys are the choice names of peripherals.RCC's MCO setting.
    mco:
      peripheral: RCC
      setting: Master Clock Output (MCO)
      lsb: 24
      bits: 3
      values: { Disable: 0, SYSCLK: 4, HSI: 5 }
    prescalers:
      # HPRE[3:0]. The RM gives TWO encodings for /2, /4 and /8 (0001/1000, 0011/1001,
      # 0111/1010); these are the ones from the 0000..0111 run, plus 1011..1111 for the
      # larger dividers - the same choice CH32V006 made, for the same reason.
      #
      # Worth knowing and not guessable: the RESET value of this field is 0101b, so HCLK
      # comes out of reset at SYSCLK/6 = 8 MHz, not 48. The register's reset value
      # 0x00000050 says the same thing.
      HB: { lsb: 4, bits: 4,
            values: { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 7,
                      16: 11, 32: 12, 64: 13, 128: 14, 256: 15 } }

  # ONE speed, and it is 50 MHz here where CH32V006's one speed is 30
  # (ch32x035_gpio.h:25 - GPIOSpeed_TypeDef has the single member GPIO_Speed_50MHz).
  # That CH32V006's fix was data-driven rather than a special case is proved by this
  # part needing a different macro and no code change.
  speeds:
    "50 MHz": GPIO_Speed_50MHz

  periph_clock:
    AHB:
      register: RCC_AHBPCENR
      fn: RCC_AHBPeriphClockCmd
      prefix: RCC_AHBPeriph_
      bits: { DMA1: 0, USBFS: 12, USBPD: 17 }
    APB2:
      register: RCC_APB2PCENR
      fn: RCC_APB2PeriphClockCmd
      prefix: RCC_APB2Periph_
      bits: { AFIO: 0, GPIOA: 2, GPIOB: 3, GPIOC: 4 }
    APB1:
      register: RCC_APB1PCENR
      fn: RCC_APB1PeriphClockCmd
      prefix: RCC_APB1Periph_
      bits: { WWDG: 11 }
    notes: >
      Only the peripherals this file actually models are listed. The header also
      defines RCC_AHBPeriph_SRAM/IO2W and RCC_APB2Periph_ADC1/TIM1/SPI1/USART1 and
      RCC_APB1Periph_TIM2/TIM3/USART2/USART3/USART4/I2C1/PWR - they go in with their
      peripherals, not before them, so that a clock enable can never name hardware the
      tree does not offer.

# What this part offers, so no renderer has to know a part name.
gpio:
  speeds:
    - { name: "50 MHz", macro: GPIO_Speed_50MHz }

  # SIX modes, not eight. **This part has NO OPEN-DRAIN AT ALL** - GPIOMode_TypeDef
  # (ch32x035_gpio.h) has exactly AIN, IN_FLOATING, IPD, IPU, Out_PP and AF_PP. There
  # is no GPIO_Mode_Out_OD and no GPIO_Mode_AF_OD on this silicon, so the GPIO table
  # must not offer "Output Open Drain" or "Alternate Function Open Drain" here.
  # I wrote both in from CH32V006 out of habit and verify_sdk_names.py rejected them,
  # which is the whole argument for the gate: they are real, correctly spelled SPL
  # names that belong to a different chip.
  modes:
    - { name: Output Push Pull,             macro: GPIO_Mode_Out_PP }
    - { name: Alternate Function Push Pull, macro: GPIO_Mode_AF_PP }
    - { name: Analog,                       macro: GPIO_Mode_AIN }

  # Mode `Input` folds the PULL setting into the macro, so these are keyed by pull name.
  #
  # **Pull-down is NOT available on every pin.** The header says so in a comment on the
  # member itself: "Only PA0--PA15 and PC16--PC17 support input pull-down"
  # (ch32x035_gpio.h, GPIO_Mode_IPD). That is a per-PIN capability, which nothing in
  # data/mcus/ has ever had to express - no part here has had a pull that works on some
  # pins and not others. `pins_note` records the constraint until the schema can carry
  # it properly; see CH32X035.notes.md, and AGENT-2/AGENT-3 have it on the board.
  input_modes:
    - { name: No pull,   macro: GPIO_Mode_IN_FLOATING }
    - { name: Pull-up,   macro: GPIO_Mode_IPU }
    - { name: Pull-down, macro: GPIO_Mode_IPD,
        pins_note: "Only PA0-PA15 and PC16-PC17 support input pull-down (ch32x035_gpio.h)" }
