# -----------------------------------------------------------------------------
# Peripherals.
#
# Every `remaps:` block below is GENERATED from DS Table 2-3 by
# tools/extract_x035_remaps.py - 60 pins, 101 tokens, 101 decoded, 0 refused - and
# cross-checked against the EVT macro counts in ch32x035_gpio.h from the opposite
# direction: Table 2-3 says which remap INDICES a pin appears under, the header says how
# many remap MACROS a peripheral has, index 0 is the default and has no macro, so N
# macros must give N+1 indices. Ten peripherals, ten agreements, zero disagreements.
#
# `settings:` are hand-written, because which signals a MODE needs is a judgement about
# the peripheral rather than something Table 2-3 states.
#
# STILL ABSENT, deliberately, and tracked in CH32X035.notes.md: AWU, PWR, FLASH, EXTI
# and TouchKey. No "Activated" stubs - a peripheral with nothing configurable is a dead
# control, and TouchKey in particular must not be modelled until it is known whether it
# is a mode of the ADC here as it turned out to be on CH32V006.
peripherals:

  # ---------------- System Core ----------------
  SYS:
    category: System Core
    notes: >
      The two-wire serial debug interface. PC18 is DIO and PC19 is DCK (DS Table 2-1
      main-function column). Both also carry PIOC_IO0/PIOC_IO1, so switching SDI off
      is what frees them - which is why this is a choice and not a fixed claim.
      `GPIO_Remap_SWJ_Disable` (ch32x035_gpio.h:125) is the macro that does it.
    settings:
      - name: Debug interface
        choices:
          - { name: Serial Wire (SDI), signals: [DIO, DCK] }
          - { name: Disable }
      # Option byte USER[4:3] = RST_MODE, RM v1.9 20.3.8 / the USER byte table:
      #   00: RST multiplexing enabled  -  the pin IS the external reset
      #   11: multiplexing off, PA21/PC3/PB7 for GPIO function
      # Reset value is 11b, so unlike CH32V006 - whose factory RST_MODE is 10b and holds
      # the pin - a blank CH32X035 leaves the pin as GPIO and the user opts IN. That is
      # why "Disabled" is choices[0] here and the enabled choice is not the default; on
      # CH32V006 it is the other way round and validate_mcu warns about it on purpose.
      - name: External reset pin
        choices:
          - { name: "RST disabled - pin is GPIO (RST_MODE=11, factory default)" }
          - { name: "RST enabled (RST_MODE=00)", signals: [RST] }
    # WHICH pin is the reset depends on the package, exactly as on CH32V006.
    #   PA21 - RM USER-byte note: "PA21 can be multiplexed as an external reset pin in
    #          64-pin R8T6 and 48-pin C8T6 packages". PA21 is bonded only on those two.
    #   PC3  - DS:2583: "The RST function on pin PC3 is only available for the CH32X035
    #          in the QSOP28 package and TSSOP20 package."
    # PB7 also carries RST in DS Table 2-3, but DS:2584 says that is CH32X033 in TSSOP20
    # - a different part - so it is NOT offered here. That one was found by the remap
    # collision check reporting RST on three pins at index 0.
    #
    # QFN28, QFN20 and QFN12 are NOT in remap_by_package: PA21 is not bonded on any of
    # them and neither source says PC3 is the reset there. An absent entry is the honest
    # answer - see CH32X035.notes.md. Do not fill them in by analogy.
    remaps:
      - name: RST on PA21 (LQFP64M / LQFP48)
        pins: { DIO: PC18, DCK: PC19, RST: PA21 }
      - name: RST on PC3 (QSOP28 / TSSOP20)
        pins: { DIO: PC18, DCK: PC19, RST: PC3 }
    remap_by_package: { LQFP64M: 0, LQFP48: 0, QSOP28: 1, TSSOP20: 1 }

  RCC:
    category: System Core
    notes: >
      **There is no HSE on this part.** `grep -c HSE ch32x035_rcc.h` is 0: the only
      oscillator is the internal 48 MHz RC. So this peripheral offers no crystal, no
      bypass and no oscillator pins, and the clock tree below has no HSE source. That
      is also why MCO offers only two real sources rather than four.
    settings:
      - name: Master Clock Output (MCO)
        choices:
          - { name: Disable }
          - { name: SYSCLK, signals: [MCO] }
          - { name: HSI,    signals: [MCO] }
    remaps:
      - name: Default
        pins: { MCO: PB9 }

  DMA1:
    category: System Core
    pins: { none: true, source: "CH32X035DS0.md Table 2-1: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    notes: "EIGHT channels (DMA1_Channel1_BASE..DMA1_Channel8_BASE, ch32x035.h), against CH32V006's seven."
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]

  IWDG:
    category: System Core
    pins: { none: true, source: "CH32X035DS0.md Table 2-1: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    # Same API as CH32V006 - free functions taking scalars, no init struct and no
    # handle (ch32x035_iwdg.h). ORDER IS LOAD-BEARING: write_access first, because
    # IWDG_PSCR and IWDG_RLDR are write-protected until 0x5555 reaches IWDG_CTLR and a
    # value written while locked is discarded silently. Same finding as CH32V006, and
    # the reason it is stated again here rather than assumed to carry across.
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]
    params:
      - key: write_access
        name: Register write access
        sdk_call: IWDG_WriteAccessCmd
        sdk_args: [$VALUE]
        type: enum
        group: Advanced
        default: Enable before writing
        options:
          - { name: Enable before writing, value: 21845, sdk: IWDG_WriteAccess_Enable }
          - { name: Keep locked,           value: 0,     sdk: IWDG_WriteAccess_Disable }
        help: "Unlocks IWDG_PSCR and IWDG_RLDR and must be written BEFORE either of them."
      - key: prescaler
        name: Prescaler
        sdk_call: IWDG_SetPrescaler
        sdk_args: [$VALUE]
        type: enum
        group: Basic
        default: "64"
        options:
          - { name: "4",   value: 0, sdk: IWDG_Prescaler_4 }
          - { name: "8",   value: 1, sdk: IWDG_Prescaler_8 }
          - { name: "16",  value: 2, sdk: IWDG_Prescaler_16 }
          - { name: "32",  value: 3, sdk: IWDG_Prescaler_32 }
          - { name: "64",  value: 4, sdk: IWDG_Prescaler_64 }
          - { name: "128", value: 5, sdk: IWDG_Prescaler_128 }
          - { name: "256", value: 6, sdk: IWDG_Prescaler_256 }
        help: "Divides the LSI. The header stops at 256 on this part too."
      - key: reload
        name: Reload value
        sdk_call: IWDG_SetReload
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 4095
        min: 0
        max: 4095
        help: "12-bit down-counter, so 4095 is the ceiling."

  WWDG:
    category: System Core
    pins: { none: true, source: "CH32X035DS0.md Table 2-1: no pin row carries a function of this peripheral (checked by tools/coverage.py)" }
    # WWDG_Enable(uint8_t Counter) TAKES the counter, so switching it on and setting the
    # counter are one call - hence `counter` names WWDG_Enable, not WWDG_SetCounter.
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]
    params:
      - key: prescaler
        name: Prescaler
        sdk_call: WWDG_SetPrescaler
        sdk_args: [$VALUE]
        type: enum
        group: Basic
        default: "1"
        options:
          - { name: "1", value: 0, sdk: WWDG_Prescaler_1 }
          - { name: "2", value: 1, sdk: WWDG_Prescaler_2 }
          - { name: "4", value: 2, sdk: WWDG_Prescaler_4 }
          - { name: "8", value: 3, sdk: WWDG_Prescaler_8 }
        help: "Divides HCLK/4096. Four options - the header stops at 8."
      - key: window
        name: Window value
        sdk_call: WWDG_SetWindowValue
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 127
        min: 64
        max: 127
        help: "Refreshing EARLIER than this resets the part. Bit 6 must stay set, so the range starts at 64."
      - key: counter
        name: Counter start value
        sdk_call: WWDG_Enable
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 127
        min: 64
        max: 127
        help: "WWDG_Enable takes the counter, so this value and switching the watchdog on are one call."

  USART1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
      - name: Hardware Flow Control (RS232)
        choices:
          - { name: Disable }
          - { name: CTS Only, signals: [CTS] }
          - { name: RTS Only, signals: [RTS] }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 3000000
        unit: Bd
        help: "Ceiling is fCK/16, so 3 MBd at the 48 MHz maximum and 1.5 MBd at the 24 MHz reset clock. USART_BRR."
      - key: word
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: 8 bits
        options:
          - { name: 8 bits, value: 0, sdk: USART_WordLength_8b }
          - { name: 9 bits, value: 1, sdk: USART_WordLength_9b }
        help: "USART_CTLR1 M, bit 12. With parity enabled the parity bit takes the last data bit, so 8 data bits plus parity needs a 9-bit word."
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: "None"
        options:
          - { name: "None", value: 0, sdk: USART_Parity_No }
          - { name: Even  , value: 2, sdk: USART_Parity_Even }
          - { name: Odd   , value: 3, sdk: USART_Parity_Odd }
        help: "USART_CTLR1 PCE (bit 10) and PS (bit 9): None = PCE 0; Even = PCE 1, PS 0; Odd = PCE 1, PS 1."
      - key: stop
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "1"  , value: 0, sdk: USART_StopBits_1 }
          - { name: "0.5", value: 1, sdk: USART_StopBits_0_5 }
          - { name: "2"  , value: 2, sdk: USART_StopBits_2 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
        help: "USART_CTLR2 STOP[13:12], listed in register order: 00 = 1, 01 = 0.5, 10 = 2, 11 = 1.5."
      # LIN / SmartCard / IrDA: DS ch.1.4.9 mode flags, each set by its own SPL command,
      # so `sdk_call` rather than a struct member. See CH32X035.notes.md for the two
