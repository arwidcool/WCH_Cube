# =============================================================================
#  CH32V005 — derived from CH32V006. Same die, same pinout, fewer peripherals.
#
#  Sources: CH32V006/005 Datasheet V2.0 (DS) §1 model table lines 106-109 and
#  Table 2-2 "CH32V005 Pin definitions"; CH32V00X Reference Manual V1.4 (RM).
#
#  This file lists ONLY what differs from CH32V006. `mcu.inherits` pulls in the
#  parent's packages, pins, peripherals, exti, dma and clock; see
#  app/engine/inherit.js for the merge rules. The short version:
#      maps merge key by key and the child wins
#      lists REPLACE wholesale — never concatenate
#      mcu.variants replaces, because a derived part shares no part numbers
#      mcu.remove takes dotted paths and errors if one matches nothing
#
#  Why a list replaces instead of merging matters here: a `remaps:` index IS the
#  AFIO_PCFR1 field value, so appending to an inherited remap list would silently
#  re-number every mapping. That is also why this file never touches `remaps:`.
#
#  What the DS actually says is different (model table columns, lines 106-109,
#  compared against the CH32V006 rows directly above them):
#      flash 32K not 62K, SRAM 6K not 8K, 85 °C only, no QFN32 part
#      Capacitive touchkey column: "-"     -> no TKEY          (DS note, 3 places)
#      TIM3 column:                "-"     -> no TIM3          (DS note, 3 places)
#      OPA polling column:         "-"     -> OPA has no polling mode (RM 14, line 14330:
#                                             "CH32V005 products do not have OPA polling
#                                             functionality")
#      OPA itself:                 "1"     -> OPA is present, so OPA1 stays
#      ADC 8+2, serial 2, I2C 1, SPI 1     -> identical to CH32V006
#
#  Pinout: verified equal to CH32V006 for all four shared packages with
#  `python tools/extract_pins.py --table "Table 2-2 CH32V005 Pin definitions"
#   --columns QFN12,TSSOP20,QFN20,QSOP24 --yaml data/mcus/CH32V005.yaml`.
#  See CH32V005.notes.md for the result and the rows that tool could not read.
# =============================================================================

mcu:
  name: CH32V005
  inherits: CH32V006
  flash_kb: 32
  sram_kb: 6
  default_package: TSSOP20

  # Dotted paths into the PARENT document, applied BEFORE the child is merged onto it
  # (AGENT-2, round-3 C4). Each must match something in the parent or the load fails, so
  # a parent rename cannot leave a stale removal silently doing nothing. Because removal
  # now precedes the merge, a path that is removed AND redefined below keeps the child's
  # version — which is the way anyone reads it, and was not true before round 3.
  remove:
    - packages.QFN32                        # no QFN32 orderable part exists for V005
    - peripherals.TKEY                      # DS: "CH32V005 no TouchKey,TIM3"
    - peripherals.TIM3                      # same note
    - peripherals.SYS.remap_by_package.QFN32   # the package it pointed at is gone
    # The parent's codegen block mentions both dropped peripherals. Left inherited, the
    # generator would mark TouchKey pins analog and emit a TIM3 clock enable on a part
    # that has neither. Found by validate_mcu.py's codegen name check, round 2.
    - codegen.analog_signals.TKEY
    - codegen.periph_clock.PB1.bits.TIM3
    # Starting values for two requests this part does not have. The child does not
    # redefine `dma.request_defaults`, it only inherits it, so this is a plain removal.
    - dma.request_defaults.TIM3_CH3
    - dma.request_defaults.TIM3_CH4

  # DS §1 model table, lines 106-109. Replaces the parent's list outright.
  # PlatformIO mapping - see the note on the parent's `variants:`. This part is the happy
  # case: every orderable variant is an 85 degC grade and the platform ships a board for
  # all four under exactly its own part number, so no grade substitution is needed here.
  # Only F6P6 has an environment in data/firmware/platformio.ini today.
  variants:
    CH32V005E6R6: { package: QSOP24,  flash_kb: 32, sram_kb: 6, temp: 85, io_count: 22, pio_board: genericCH32V005E6R6 }
    CH32V005F6U6: { package: QFN20,   flash_kb: 32, sram_kb: 6, temp: 85, io_count: 18, pio_board: genericCH32V005F6U6 }
    CH32V005F6P6: { package: TSSOP20, flash_kb: 32, sram_kb: 6, temp: 85, io_count: 18, pio_board: genericCH32V005F6P6, pio_env: CH32V005F6P6 }
    CH32V005D6U6: { package: QFN12,   flash_kb: 32, sram_kb: 6, temp: 85, io_count: 11, pio_board: genericCH32V005D6U6 }

# -----------------------------------------------------------------------------
peripherals:

  # OPA is present but cannot poll its positive inputs (RM ch.14). `settings` is a list,
  # so it replaces the parent's wholesale — which means every OPA1 setting has to be
  # restated here, not just the one that changed. The P0..P3 / N0..N2 / OUT0..OUT1 pin
  # assignments come from the parent's `remaps:` and are untouched.
  OPA1:
    notes: OPA/PGA/CMP. No polling mode on CH32V005 (RM ch.14) — one positive input at a time.
    settings:
      - name: Positive input (PSEL)
        choices:
          - { name: Disable }
          - { name: P0 — PA2, signals: [P0] }
          - { name: P1 — PD7, signals: [P1] }
          - { name: P2 — PD3, signals: [P2] }
          - { name: P3 — PD1, signals: [P3] }
      - name: Negative input (NSEL)
        choices:
          - { name: Disable }
          - { name: N0 — PA1, signals: [N0] }
          - { name: N1 — PD0, signals: [N1] }
          - { name: N2 — PA4, signals: [N2] }
          - { name: PGA internal feedback (no pin) }
      - name: Output
        choices:
          - { name: Disable }
          - { name: OUT0 — PD4, signals: [OUT0] }
          - { name: OUT1 — PA5, signals: [OUT1] }
          - { name: Internal to ADC IN9 only }
    # Restated for the same reason as `settings:` above - a list replaces wholesale, so
    # this drops the parent's two POLLING parameters on a part that cannot poll.
    # `poll_trigger` would have been worse than merely useless here: three of its five
    # options are TIM3 events and CH32V005 has no TIM3 either. This is the hazard
    # data/FORMAT.md names under `mcu.inherits` - a new entry in the parent is a new
    # entry in every child - and it is why adding to the parent is worth a thought about
    # what the derived part actually has.
    params:
      - key: setup_cfg
        name: ADC conversion interval
        struct: OPA_InitTypeDef
        sdk_field: SETUP_CFG
        type: enum
        group: Advanced
        default: Setting 0
        options:
          - { name: Setting 0, value: 0, sdk: OPA_SETUP_CFG_0 }
          - { name: Setting 1, value: 1, sdk: OPA_SETUP_CFG_1 }
          - { name: Setting 2, value: 3, sdk: OPA_SETUP_CFG_2 }
        help: "How long the OPA is given to settle before the ADC samples it. The enum skips value 2: OPA_SETUP_CFG_2 is 3, not 2."
      - key: highspeed
        name: High speed mode
        struct: OPA_InitTypeDef
        sdk_field: OPA_HS
        type: enum
        group: Advanced
        default: "Off"
        options:
          - { name: "Off", value: 0, sdk: HS_OFF }
          - { name: "On",  value: 1, sdk: HS_ON }
        help: "Faster slew at a higher supply current."
      - key: out_ie
        name: Output interrupt
        struct: OPA_InitTypeDef
        sdk_field: OUT_IE
        type: enum
        group: Advanced
        default: "Off"
        options:
          - { name: "Off", value: 0, sdk: OUT_IE_OFF }
          - { name: "On",  value: 1, sdk: OUT_IE_ON }
        help: "Interrupt on the comparator output changing."
      - key: nmi_ie
        name: Output NMI
        struct: OPA_InitTypeDef
        sdk_field: NMI_IE
        type: enum
        group: Advanced
        default: "Off"
        options:
          - { name: "Off", value: 0, sdk: NMI_IE_OFF }
          - { name: "On",  value: 1, sdk: NMI_IE_ON }
        help: "Route the output to the non-maskable interrupt instead."

# -----------------------------------------------------------------------------
# DMA1 — the parent's map with every TIM3 request dropped (RM Table 8-2 note 2 applies
# to CH32V006/V007; CH32V005 has no TIM3 at all). Channel numbering is unchanged.
#
# `dma.requests` is deliberately NOT in `mcu.remove` above, and the reason has changed.
# It used to be a hazard: `mcu.remove` ran AFTER the parent merge, so removing a path the
# child also redefined deleted the child's own version, and this part shipped for a while
# with no DMA request map at all and dead channel-clash warnings. AGENT-2 closed that in
# round 3 (C4, BOARD 14:21Z) — `mcu.remove` now runs BEFORE the merge, so remove-and-
# redefine keeps the CHILD's version and either spelling would work.
#
# It stays out because it is still the clearer of the two. Maps merge key by key and the
# child wins, so the seven channels listed below already replace the parent's seven
# outright; adding a removal would say the same thing twice and give the next reader a
# reason to wonder which one is load-bearing. Note the second half of C4: a `remove:`
# path the PARENT does not define is now a hard error, which is what catches a rename.
dma:
  requests:
    1: [ADC1, TIM2_CH3]
    2: [SPI1_RX, TIM1_CH1, TIM2_UP]
    3: [SPI1_TX, TIM1_CH2]
    4: [USART1_TX, TIM1_TRIG, TIM1_COM, TIM1_CH4]
    5: [USART1_RX, TIM2_CH1, TIM1_UP]
    6: [I2C1_TX, TIM1_CH3, USART2_TX]
    7: [I2C1_RX, TIM2_CH2, TIM2_CH4, USART2_RX]

# -----------------------------------------------------------------------------
# Clock tree is identical (DS 1.3 Figure 1-3 is drawn for "CH32V005, CH32V006", and RM
# Figure 3-3 likewise). Only the bus membership list changes, and a list replaces.
clock:
  buses:
    HB: [TIM1, TIM2, GPIO, AFIO, USART1, USART2, I2C1, SPI1, ADC1, DMA1, WWDG, OPA1, PWR]
