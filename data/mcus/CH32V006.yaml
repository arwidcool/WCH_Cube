# =============================================================================
#  CH32V006 — extracted from CH32V006 Datasheet V2.0 (DS) and CH32V00X
#  Reference Manual V1.4 (RM).  Sources are noted next to each block.
#
#  Package pin numbers: DS Table 2-1-1.  Pin 0 = exposed pad (QFN).
#  A pin number may list several names (e.g. [PD7, PA4]) — those GPIOs are
#  shorted together inside the package (DS notes 3 and 4). The app treats them
#  as ONE physical pin: a signal on either name claims the pin.
#  Remap tables: RM 7.2.11 (Tables 7-8, 7-9-1, 7-10, 7-11, 7-12, 7-13-1, 7-14, 7-15).
#  Remap index in each list == value of the AFIO_PCFR1 field (0 = default).
# =============================================================================

mcu:
  name: CH32V006
  vendor: WCH
  family: CH32V00x
  core: QingKe RISC-V2A (RV32EmC)
  flash_kb: 62
  sram_kb: 8
  vdd_v: [2.0, 5.5]
  max_sysclk_mhz: 48
  default_package: TSSOP20
  # DS model table (CH32V006DS0 §1, the "General Description" model list).
  # io_count is the datasheet's own I/O column. `tools/validate_mcu.py` counts the io
  # pins in each package table and fails if the two disagree, which is what catches a
  # dropped or duplicated row in `packages:` below. A pair of internally shorted GPIOs
  # (DS notes 3 and 4) is one physical pin and counts once.
  # PlatformIO mapping per orderable part, for the Project Manager's Toolchain panel.
  # AGENT-3 asked for this rather than deriving it, and they were right to: the obvious
  # derivation prints an environment that does not exist.
  #
  #   pio_board  the board id the ch32v platform ships, in ~/.platformio/platforms/ch32v/
  #              boards/. A checkable fact about the installed platform.
  #   pio_env    the environment in data/firmware/platformio.ini - present ONLY where one
  #              is actually defined today. A part with a board but no environment says
  #              nothing here rather than naming one that would fail to build.
  #
  # Why they are not the part number: **the board files are the 85 degC grades and half of
  # this list is 105 degC.** CH32V006F8P7 builds with `genericCH32V006F8P6`. That is
  # correct, not a fudge - a board file carries clock, flash, RAM, march/mabi and the -D
  # flags, and no temperature field at all (genericCH32V006F8P6.json: mcu ch32v006f8p6,
  # extra_flags -DCH32V006F8, spl_series ch32v00Xx). Temperature grade is a binning
  # property of the die, not something the compiler is told.
  #
  # Two variants map to NOTHING and say so by omission: CH32V006F4U6 (the platform ships
  # F4P6 and F8U6, but no F4U6) and CH32V006D8U7 (no D8U board at all). The panel should
  # say the part has no PlatformIO board rather than invent the nearest one - picking a
  # neighbouring board would hand the user the wrong flash size.
  variants:
    CH32V006K8U7: { package: QFN32,   flash_kb: 62, sram_kb: 8, temp: 105, io_count: 31, pio_board: genericCH32V006K8U6, pio_env: CH32V006K8U6 }
    CH32V006E8R6: { package: QSOP24,  flash_kb: 62, sram_kb: 8, temp: 85,  io_count: 22, pio_board: genericCH32V006E8R6 }
    CH32V006E8R7: { package: QSOP24,  flash_kb: 62, sram_kb: 8, temp: 105, io_count: 22, pio_board: genericCH32V006E8R6 }
    CH32V006F8U7: { package: QFN20,   flash_kb: 62, sram_kb: 8, temp: 105, io_count: 18, pio_board: genericCH32V006F8U6 }
    CH32V006F4U6: { package: QFN20,   flash_kb: 16, sram_kb: 4, temp: 85,  io_count: 18, notes: "no OPA, no TouchKey; DS Table 2-1-2 is its own pin table. No PlatformIO board: the platform ships F4P6 and F8U6, neither of which is this part." }
    CH32V006F8P7: { package: TSSOP20, flash_kb: 62, sram_kb: 8, temp: 105, io_count: 18, pio_board: genericCH32V006F8P6, pio_env: CH32V006F8P6 }
    CH32V006D8U7: { package: QFN12,   flash_kb: 62, sram_kb: 8, temp: 105, io_count: 11, notes: "ADC 4+2 channels and TouchKey 4-channel only — the other inputs have no pin. No PlatformIO board ships for a D8U part." }

# -----------------------------------------------------------------------------
packages:
  QFN32:                          # CH32V006K8U7 — DS note 5: PA7 is the reset pin
    0: VSS                        # exposed pad
    1: PB3
    2: PA5
    3: PA6
    4: PA7
    5: PA0
    6: PA1
    7: PA2
    8: PD0
    9: PA3
    10: PB0
    11: PB1
    12: PB2
    13: PC0
    14: PC1
    15: PC2
    16: PC3
    17: VDD
    18: PC4
    19: PC5
    20: PC6
    21: PC7
    22: PB4
    23: PD1
    24: PD2
    25: PD3
    26: PD4
    27: PD5
    28: PD6
    29: PB5
    30: PB6
    31: PD7
    32: PA4

  QSOP24:                         # CH32V006E8R6/R7 — DS note 5: PC5 is the reset pin
    1: PD1
    2: PC0
    3: PC1
    4: PC2
    5: VSS
    6: VDD
    7: PC5
    8: PC4
    9: PD2
    10: PD3
    11: PD4
    12: PD5
    13: PD6
    14: PD7
    15: PA4
    16: PA5
    17: [PA1, PA6]                # DS note 3: shorted internally, never both outputs
    18: PA0
    19: PA2
    20: PD0
    21: PA3
    22: PB0
    23: PB1
    24: PB3

  QFN20:                          # CH32V006F8U7 / F4U6 — reset pin PD7
    0: VSS
    1: [PD7, PA4]                 # DS note 4: shorted internally
    2: PA1
    3: PA2
    4: VSS
    5: PD0
    6: VDD
    7: PC0
    8: PC1
    9: PC2
    10: PC3
    11: PC4
    12: PC5
    13: PC6
    14: PC7
    15: PD1
    16: PD2
    17: PD3
    18: PD4
    19: PD5
    20: PD6

  TSSOP20:                        # CH32V006F8P7 — reset pin PD7
    1: PD4
    2: PD5
    3: PD6
    4: [PD7, PA4]                 # DS note 4: shorted internally
    5: PA1
    6: PA2
    7: VSS
    8: PD0
    9: VDD
    10: PC0
    11: PC1
    12: PC2
    13: PC3
    14: PC4
    15: PC5
    16: PC6
    17: PC7
    18: PD1
    19: PD2
    20: PD3

  QFN12:                          # CH32V006D8U7 — reset pin PD7
    0: VSS
    1: PA1
    2: PA2
    3: PD0
    4: VDD
    5: PC0
    6: PC3
    7: PC4
    8: PC6
    9: PC7
    10: PD1
    11: PD4
    12: [PD7, PA4]                # DS note 4: shorted internally

# -----------------------------------------------------------------------------
# DS Table 2-1-1 — pin type and "main function after reset"
pins:
  VDD:  { type: power }
  VSS:  { type: ground }
  PA0:  { type: io }
  PA1:  { type: io, analog: true, notes: XI when HSE used (AFIO PA12_RM) }
  PA2:  { type: io, analog: true, notes: XO when HSE used (AFIO PA12_RM) }
  PA3:  { type: io }
  PA4:  { type: io, analog: true }
  PA5:  { type: io, analog: true }
  PA6:  { type: io }
  PA7:  { type: io, notes: RST after reset on QFN32 }
  PB0:  { type: io }
  PB1:  { type: io }
  PB2:  { type: io }
  PB3:  { type: io, notes: SWCLK in 2-wire debug mode }
  PB4:  { type: io }
  PB5:  { type: io }
  PB6:  { type: io }
  PC0:  { type: io }
  PC1:  { type: io }
  PC2:  { type: io, analog: true }
  PC3:  { type: io }
  PC4:  { type: io, analog: true }
  PC5:  { type: io, notes: RST after reset on QSOP24 }
  PC6:  { type: io }
  PC7:  { type: io }
  PD0:  { type: io, analog: true }
  PD1:  { type: io, analog: true, notes: SWIO after reset — debug interface is ON by default }
  PD2:  { type: io, analog: true }
  PD3:  { type: io, analog: true }
  PD4:  { type: io, analog: true }
  PD5:  { type: io, analog: true }
  PD6:  { type: io, analog: true }
  PD7:  { type: io, analog: true, notes: RST after reset on QFN12/QFN20/TSSOP20 }

# -----------------------------------------------------------------------------
peripherals:

  # ---------------- System Core ----------------
  SYS:
    category: System Core
    settings:
      - name: Debug (SDI)
        choices:
          - { name: No Debug }
          - { name: 1-wire SDI (SWIO), signals: [SWIO], default: true }     # DS 1.4.18 — default after reset
          - { name: 2-wire SDI (SWIO + SWCLK), signals: [SWIO, SWCLK] }
      # Option byte USER[4:3] = RST_MODE, RM Table 18-4 (ch.18).
      # Reset value on CH32V006 is 10b, so the external reset pin is ACTIVE on a blank
      # part and the pin is not yours until you reprogram the option byte. The three
      # enabled values differ only in how long the pin is ignored after the alternate
      # function turns on, which is a glitch filter, not a different pin.
      # RM 18 writes this value as "PD7 for I/O function"; the pin is actually the
      # package's reset pin — PA7 on QFN32 and PC5 on QSOP24 (DS note 5, see `remaps`).
      #
      # `validate_mcu.py` warns that choices[0] here carries a signal, because the engine
      # reads choices[0] as a peripheral's "off" state. That is deliberate and must stay:
      # the factory option byte is RST_MODE=10, so a blank part really does hold the reset
      # pin, and the pin is not available until the option byte is reprogrammed. Reordering
      # these to silence the warning would tell the user the pin is free when it is not.
      - name: External reset pin
        choices:
          - { name: "RST enabled — ignore 12 ms (RST_MODE=10, factory default)", signals: [RST], default: true }
          - { name: "RST enabled — ignore 1 ms (RST_MODE=01)", signals: [RST] }
          - { name: "RST enabled — ignore 128 us (RST_MODE=00)", signals: [RST] }
          - { name: "RST disabled — pin is GPIO (RST_MODE=11)" }
    # RST location depends on package (DS note 5); the app picks the remap per package.
    remaps:
      - name: RST on PD7 (QFN12 / QFN20 / TSSOP20)
        pins: { SWIO: PD1, SWCLK: PB3, RST: PD7 }
      - name: RST on PC5 (QSOP24)
        pins: { SWIO: PD1, SWCLK: PB3, RST: PC5 }
      - name: RST on PA7 (QFN32)
        pins: { SWIO: PD1, SWCLK: PB3, RST: PA7 }
    remap_by_package: { QFN12: 0, QFN20: 0, TSSOP20: 0, QSOP24: 1, QFN32: 2 }

  RCC:
    category: System Core
    settings:
      - name: High Speed Clock (HSE)
        choices:
          - { name: Disable }
          - { name: BYPASS clock source, signals: [XI] }
          - { name: Crystal / ceramic resonator, signals: [XI, XO] }
      - name: Master Clock Output (MCO)
        choices:
          - { name: Disable }
          - { name: SYSCLK, signals: [MCO] }
          - { name: HSI, signals: [MCO] }
          - { name: HSE, signals: [MCO] }
          - { name: PLLCLK, signals: [MCO] }
    remaps:
      - name: Default
        pins: { XI: PA1, XO: PA2, MCO: PC4 }     # DS pin table; AFIO PA12_RM selects XI/XO on PA1/PA2

  DMA1:
    category: System Core
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated (7 channels) } ]

  IWDG:
    category: System Core
    # The independent watchdog has NO init struct and NO handle: every setting is its own
    # call and the peripheral is a singleton. ch32v00X_iwdg.h declares
    # IWDG_SetPrescaler(uint8_t), IWDG_SetReload(uint16_t) and IWDG_Enable(void) - not one
    # of them takes an IWDG_TypeDef*. So `sdk_args` here is [$VALUE] with no $HANDLE, and
    # there is no `struct:` to name. There is no IWDG_InitTypeDef on this part.
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]
    # ORDER IS LOAD-BEARING HERE, and it was wrong until AGENT-2 asked (BOARD 16:30Z).
    # The generator emits `sdk_call` parameters in the order this list gives them, so
    # `write_access` MUST come first: IWDG_PSCR and IWDG_RLDR are write-protected until
    # 0x5555 is written to IWDG_CTLR, and a prescaler or reload written while locked is
    # discarded with no error anywhere. RM 4.2 says it twice - "Operation method: first
    # write 0x5555 to the IWDG_CTLR register, and then modify the frequency division
    # value in the IWDG_PSCR register", and the same sentence again for IWDG_RLDR - and
    # WCH's own example agrees: EXAM/IWDG/IWDG/User/main.c:83-87 is
    # IWDG_WriteAccessCmd(IWDG_WriteAccess_Enable) then SetPrescaler then SetReload.
    #
    # Listed before `prescaler` rather than given an ordering key, because one list read
    # top to bottom is easier to keep right than a second mechanism that says when to
    # ignore it. If a part ever needs a value set both before and after something else,
    # that is when an explicit key earns its place - not before.
    params:
      - key: write_access
        name: Register write access
        sdk_call: IWDG_WriteAccessCmd
        sdk_args: [$VALUE]
        type: enum
        group: Advanced
        default: Enable before writing
        options:
          - { name: Enable before writing, value: 21845, sdk: IWDG_WriteAccess_Enable }
          - { name: Keep locked,           value: 0,     sdk: IWDG_WriteAccess_Disable }
        help: "Unlocks IWDG_PSCR and IWDG_RLDR, and must be written BEFORE either of them - a prescaler or reload written while locked is silently discarded (RM 4.2). The two values are the literal key words 0x5555 and 0x0000, not a flag."
      - key: prescaler
        name: Prescaler
        sdk_call: IWDG_SetPrescaler
        sdk_args: [$VALUE]
        type: enum
        group: Basic
        default: "64"
        options:
          - { name: "4",   value: 0, sdk: IWDG_Prescaler_4 }
          - { name: "8",   value: 1, sdk: IWDG_Prescaler_8 }
          - { name: "16",  value: 2, sdk: IWDG_Prescaler_16 }
          - { name: "32",  value: 3, sdk: IWDG_Prescaler_32 }
          - { name: "64",  value: 4, sdk: IWDG_Prescaler_64 }
          - { name: "128", value: 5, sdk: IWDG_Prescaler_128 }
          - { name: "256", value: 6, sdk: IWDG_Prescaler_256 }
        help: "Divides the LSI, which is the only clock this watchdog has. The header stops at 256 - there is no IWDG_Prescaler_512 on this part, however familiar that name is elsewhere."
      - key: reload
        name: Reload value
        sdk_call: IWDG_SetReload
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 4095
        min: 0
        max: 4095
        help: "12-bit down-counter, so 4095 is the ceiling. Timeout is (prescaler x (reload + 1)) / f_LSI."

  WWDG:
    category: System Core
    # Also struct-free and handle-free (ch32v00X_wwdg.h). Note WWDG_Enable(uint8_t Counter)
    # TAKES the counter, so "switch it on" and "set the counter" are one call rather than
    # two - which is why `counter` below names WWDG_Enable and not WWDG_SetCounter.
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]
    params:
      - key: prescaler
        name: Prescaler
        sdk_call: WWDG_SetPrescaler
        sdk_args: [$VALUE]
        type: enum
        group: Basic
        default: "1"
        options:
          - { name: "1", value: 0, sdk: WWDG_Prescaler_1 }
          - { name: "2", value: 1, sdk: WWDG_Prescaler_2 }
          - { name: "4", value: 2, sdk: WWDG_Prescaler_4 }
          - { name: "8", value: 3, sdk: WWDG_Prescaler_8 }
        help: "Divides HCLK/4096. Four options only - the header stops at 8."
      - key: window
        name: Window value
        sdk_call: WWDG_SetWindowValue
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 127
        min: 64
        max: 127
        help: "Refreshing EARLIER than this resets the part, which is the whole point of a windowed watchdog. The counter's bit 6 must stay set, so the usable range starts at 64."
      - key: counter
        name: Counter start value
        sdk_call: WWDG_Enable
        sdk_args: [$VALUE]
        type: int
        group: Basic
        default: 127
        min: 64
        max: 127
        help: "WWDG_Enable takes the counter as its argument, so this value and switching the watchdog on are the same call. Below 64 the counter has already underflowed and the part resets at once."

  # RM ch.2. Nothing here claims a pin: the supply monitor and the auto-wake-up are
  # internal, and their interrupts reach the core over EXTI lines 8 and 9, which have no
  # pins either (see `exti.internal`). It is still a real configuration - PVD threshold,
  # regulator mode and the wake-up period are all choices with consequences.
  PWR:
    category: System Core
    settings:
      - name: Power voltage detector (PVD)
        choices:
          - { name: Disable }
          - { name: Enable }                      # PWR_CTLR PVDE, bit 4
      - name: Auto wake-up (AWU)
        choices:
          - { name: Disable }
          - { name: Enable }                      # PWR_AWUCSR AWUEN, bit 1
      - name: Low-power mode entered on WFI/WFE
        choices:
          - { name: Sleep }                       # PWR_CTLR PDDS = 0
          - { name: Standby }                     # PWR_CTLR PDDS = 1
    params:
      - key: pvd_level
        name: PVD threshold
        type: enum
        group: Basic
        default: 2.43 V rising / 2.41 V falling
        options:
          - { name: 1.87 V rising / 1.85 V falling, value: 0 }
          - { name: 2.23 V rising / 2.21 V falling, value: 1 }
          - { name: 2.43 V rising / 2.41 V falling, value: 2 }
          - { name: 2.66 V rising / 2.60 V falling, value: 3 }
        when:
          Power voltage detector (PVD): Enable
        help: "PWR_CTLR PLS[6:5]. The two figures are the rising and falling thresholds - the gap is the comparator's hysteresis, not a tolerance. RM 2.4.1 notes these levels apply to CH32V002/005/006/007 and M007."
      - key: ldo_mode
        name: Voltage regulator mode
        type: enum
        group: Advanced
        default: Normal - LDO 1.2 V
        options:
          - { name: Normal - LDO 1.2 V,        value: 2 }
          - { name: Low power - LDO 1.0 V,     value: 1 }
          - { name: Energy saving - LDO 1.0 V, value: 3 }
        help: "PWR_CTLR LDO_MODE[3:2], reset 10b. Code 00 is documented as \"unable to configure\" and is deliberately not offered. RM 2.4.1: standby turns low-power mode on in hardware regardless, and running code from flash in energy-saving mode is not recommended."
      - key: awu_prescaler
        name: Auto wake-up prescaler
        type: enum
        group: Basic
        default: /4096
        options:
          - { name: Off,     value: 0 }
          - { name: /2,      value: 2 }
          - { name: /4,      value: 3 }
          - { name: /8,      value: 4 }
          - { name: /16,     value: 5 }
          - { name: /32,     value: 6 }
          - { name: /64,     value: 7 }
          - { name: /128,    value: 8 }
          - { name: /256,    value: 9 }
          - { name: /512,    value: 10 }
          - { name: /1024,   value: 11 }
          - { name: /2048,   value: 12 }
          - { name: /4096,   value: 13 }
          - { name: /10240,  value: 14 }
          - { name: /61440,  value: 15 }
        when:
          Auto wake-up (AWU): Enable
        help: "PWR_AWUPSC[3:0], counting off the 128 kHz LSI. Codes 0000 and 0001 both mean \"prescaler off\", so only one Off entry is offered. The last two steps are 10240 and 61440, not the powers of two the rest of the list suggests."
      - key: awu_window
        name: Auto wake-up window
        type: int
        group: Basic
        default: 63
        min: 0
        max: 63
        unit: counts
        when:
          Auto wake-up (AWU): Enable
        help: "PWR_AWUWR[5:0], reset 0x3F. The wake-up period is (window + 1) prescaled LSI ticks - RM 2.4.4 is explicit that the hardware adds the one."

  # RM ch.18. Two different things live here and both are real: the wait-state setting the
  # core needs at speed (FLASH_ACTLR, changed at runtime) and the user option bytes, which
  # are programmed once and take effect at the next power-on. RST_MODE is the third option
  # byte and is deliberately NOT here - it decides whether a PIN is a reset, so it belongs
  # to SYS where the conflict engine can see it. Modelling it twice would let the two
  # disagree.
  FLASH:
    category: System Core
    settings:
      - name: Independent watchdog start (IWDG_SW)
        choices:
          - { name: "Started by software (IWDG_SW = 1, factory default)" }
          - { name: "Started by hardware at power-on (IWDG_SW = 0)" }
      - name: Reset on entering Standby (STANDBY_RST)
        choices:
          - { name: "No reset (STANDBY_RST = 1, factory default)" }
          - { name: "System reset (STANDBY_RST = 0)" }
      - name: Power-on start mode (START_MODE)
        choices:
          - { name: "Boot from BOOT area (START_MODE = 1, factory default)" }
          - { name: "Boot from user area (START_MODE = 0)" }
      - name: Read protection (RDPR)
        choices:
          - { name: "Unprotected (RDPR = 0xA5, factory default)" }
          - { name: "Read-protected (any other value)" }
    params:
      - key: latency
        name: Wait states
        type: enum
        group: Basic
        default: 2 wait states
        options:
          - { name: 0 wait states, value: 0 }
          - { name: 1 wait state,  value: 1 }
          - { name: 2 wait states, value: 2 }
        help: "FLASH_ACTLR LATENCY[1:0]. RM 18.3.1 recommends 0 up to 15 MHz, 1 above 15 up to 24, and 2 above 24 up to 48. Code 11 is reserved. Too few wait states at speed is a fetch that returns garbage, so the default here is the value that is safe at every SYSCLK this part offers."
    notes: >
      Wait states are the one setting on this part that has to follow the clock tree. The
      app does not couple them yet: it neither recomputes LATENCY when SYSCLK changes nor
      reddens a value that is too low for the selected clock. Until it does, the default
      is the conservative one. WRPR0-WRPR3 (write protection, one bit per 2 sectors) and
      Data0/Data1 (two user bytes) are the remaining option bytes and are not modelled -
      they are per-project values rather than a configuration choice, and the format has
      nothing to express "one bit per sector" with.

  # RM 6.4. Which PIN each line watches is `exti:` at the top level, because AFIO_EXTICR
  # picks one port per line and that is a pin question the conflict engine has to see.
  # What is configurable here is what each line does once it has a pin: whether it fires,
  # and on which edge (EXTI_RTENR / EXTI_FTENR, RM 6.4.3). No signals, so nothing here
  # claims a pin - the pin arrives when a GPIO is set to an interrupt mode.
  # RM chapter 20. Found missing by tests/completeness.test.js (AGENT-4, BOARD 14:42Z):
  # the chapter was neither modelled nor on this file's declared-absence list, so it was
  # an undeclared fifth gap. Modelled rather than declared absent, because TIM2_DMA_REMAP
  # is not cosmetic - it changes which DMA request TIM2_CH4 uses, which is a map this app
  # renders and a conflict it detects.
  #
  # There is no SPL driver for this unit: EVT ships no ch32v00X_exten.h, so every setting
  # here is a direct register write, like ADC's low-power bit. The RM and the EVT header
  # agree exactly on all three bits, which is worth recording because they did not on the
  # TIM3 vector:
  #   EXTEN_LOCKUP_EN        0x00000040  bit 6   ch32v00X.h:2516   RM 20.2.1
  #   EXTEN_LOCKUP_RSTF      0x00000080  bit 7   ch32v00X.h:2517   RM 20.2.1
  #   EXTEN_TIM2_DMA_REMAP   0x00010000  bit 16  ch32v00X.h:2519   RM 20.2.1
  # The register block is `EXTEN` with one member, `EXTEN_CTR` (ch32v00X.h:385, 470).
  #
  # LKUPRST is deliberately NOT offered. It is a write-1-to-clear STATUS flag reporting
  # that a lock-up already reset the part; it is something firmware reads at startup, not
  # something a configurator sets, and offering it would be offering a control that does
  # nothing useful at init time.
  EXTEN:
    category: System Core
    notes: >
      Extended configuration unit (RM ch.20). Clocked from HB and reset only by a system
      reset. No SPL driver exists, so generated code writes EXTEN->EXTEN_CTR directly.
    settings:
      - name: Lock-up reset
        choices:
          - { name: Disable }
          - { name: Reset the chip on CPU lock-up }
      - name: TIM2 channel 4 DMA
        choices:
          - { name: Own request (TIM2_CH4) }
          - { name: Share the TIM2 update request }
    params:
      - key: lockup
        name: Lock-up monitoring
        sdk_none: true
        sdk_note: "EVT ships no ch32v00X_exten.h and ch32v00X.h declares no function for this unit, so it is a direct write of EXTEN_LOCKUP_EN into EXTEN->EXTEN_CTR. Nothing to call."
        type: bool
        group: Basic
        default: false
        help: "RM 20.1: with LKUPEN set, a CPU lock-up resets the system and sets LKUPRST. LKUPRST itself is a write-1-to-clear status flag that firmware reads after reset, so it is not offered here."

  EXTI:
    category: System Core
    settings:
      - name: EXTI line 0 trigger
        choices:
          - { name: Disable }
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }
      - name: EXTI line 1 trigger
        choices:
          - { name: Disable }
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }
      - name: EXTI line 2 trigger
        choices:
          - { name: Disable }
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }
      - name: EXTI line 3 trigger
        choices:
          - { name: Disable }
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }
      - name: EXTI line 4 trigger
        choices:
          - { name: Disable }
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }
      - name: EXTI line 5 trigger
        choices:
          - { name: Disable }
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }
      - name: EXTI line 6 trigger
        choices:
          - { name: Disable }
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }
      - name: EXTI line 7 trigger
        choices:
          - { name: Disable }
          - { name: Rising edge }
          - { name: Falling edge }
          - { name: Both edges }
    notes: >
      All eight lines share one vector, EXTI7_0 (RM Table 6-1), so the NVIC tab shows a
      single entry however many lines are on. Lines 8 and 9 are internal - PVD and the
      auto-wake-up - and are configured on PWR, not here; they are listed in
      `exti.internal` because they occupy lines but can never conflict over a pin.
      Interrupt versus event (EXTI_INTENR versus EXTI_EVENR, RM 6.4.2) is not modelled:
      an event wakes the core from WFE without running a handler, which is a code
      decision rather than a pinout one.

  # ---------------- Analog ----------------
  ADC1:
    category: Analog
    # 12-bit, fixed in silicon: RM 9.2 says "12-bit data" and "the actual converted 12-bit
    # digital value", and ADC_RDATAR is DATA[11:0]. The CH32V006 datasheet heading 3.3.14
    # still reads "10-bit ADC Characteristics" — that is a stale heading left from another
    # part; its own body text and all three other mentions say 12-bit. Do not "correct" it.
    notes: 12-bit SAR, up to 3 Msps, 8 external channels plus Vrefint and the OPA output (DS 1.4.11).
    settings:
      - name: Channels
        type: checkboxes
        choices:
          - { name: IN0, signals: [IN0] }
          - { name: IN1, signals: [IN1] }
          - { name: IN2, signals: [IN2] }
          - { name: IN3, signals: [IN3] }
          - { name: IN4, signals: [IN4] }
          - { name: IN5, signals: [IN5] }
          - { name: IN6, signals: [IN6] }
          - { name: IN7, signals: [IN7] }
          - { name: "IN8 (Vrefint, internal)" }
          - { name: "IN9 (OPA output, internal)" }
      - name: Regular group external trigger      # RM Table 7-15, ADC_ETRGREG_RM
        choices:
          - { name: Disable }
          - { name: External pin PD3 (ETRGREG_RM=0), signals: [RETR0] }
          - { name: External pin PC2 (ETRGREG_RM=1), signals: [RETR1] }
      - name: Injected group external trigger     # RM Table 7-14, ADC_ETRGINJ_RM
        choices:
          - { name: Disable }
          - { name: External pin PD1 (ETRGINJ_RM=0), signals: [IETR0] }
          - { name: External pin PA2 (ETRGINJ_RM=1), signals: [IETR1] }
    remaps:
      - name: Default
        pins: { IN0: PA2, IN1: PA1, IN2: PC4, IN3: PD2, IN4: PD3, IN5: PD5, IN6: PD6, IN7: PD4,
                RETR0: PD3, RETR1: PC2, IETR0: PD1, IETR1: PA2 }

    # Parameters - RM 9.3 (ADC_CTLR1 / CTLR2 / CTLR3, ADC_SAMPTR1/2).
    # Resolution is not a parameter: it is fixed at 12 bits in silicon and the schema has
    # no read-only flag, so it is stated in `notes` above instead of offered as a choice.
    params:
      - key: sample
        name: Sampling time
        sdk_call: ADC_RegularChannelConfig
        sdk_args: [$HANDLE, $CHANNEL, $RANK, $VALUE]
        sdk_repeat: channels
        sdk_note: "ADC_InitTypeDef has NO sample-time member. Sample time is the fourth argument of ADC_RegularChannelConfig(ADCx, channel, rank, ADC_SampleTime), so it is set per CHANNEL, not per peripheral. ch32v00X_adc.h:165."
        type: enum
        default: 11.5 cycles
        options:
          - { name: 3.5 cycles  , value: 0, sdk: ADC_SampleTime_CyclesMode0 }
          - { name: 7.5 cycles  , value: 1, sdk: ADC_SampleTime_CyclesMode1 }
          - { name: 11.5 cycles , value: 2, sdk: ADC_SampleTime_CyclesMode2 }
          - { name: 19.5 cycles , value: 3, sdk: ADC_SampleTime_CyclesMode3 }
          - { name: 35.5 cycles , value: 4, sdk: ADC_SampleTime_CyclesMode4 }
          - { name: 55.5 cycles , value: 5, sdk: ADC_SampleTime_CyclesMode5 }
          - { name: 71.5 cycles , value: 6, sdk: ADC_SampleTime_CyclesMode6 }
          - { name: 239.5 cycles, value: 7, sdk: ADC_SampleTime_CyclesMode7 }
        help: "ADC_SAMPTR1/2 SMPx[2:0], codes 000..111 in this order. These are the NORMAL-mode figures; in low-power mode codes 010/011/100 mean 13.5/28.5/41.5 cycles instead (RM 9.3.4). Total conversion = sampling + 12.5 ADC clocks."
      - key: lowpower
        name: Low power mode
        sdk_none: true
        sdk_note: ch32v00X_adc.h exposes NOTHING for the low-power bit - no struct member and no function (grepped the whole header). It is ADC_CTLR1 ADC_LP, so codegen must write the register or leave it alone - and must not invent a low-power command function, because none exists to call.
        type: bool
        default: false
        help: "ADC_CTLR3 ADC_LP, bit 0. Changes what three of the sampling-time codes mean - see that row."
      - key: cont
        name: Continuous conversion
        struct: ADC_InitTypeDef
        sdk_field: ADC_ContinuousConvMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: ADC_CTLR2 CONT, bit 1.
      - key: scan
        name: Scan conversion
        struct: ADC_InitTypeDef
        sdk_field: ADC_ScanConvMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: ADC_CTLR1 SCAN, bit 8.
      - key: align
        name: Data alignment
        struct: ADC_InitTypeDef
        sdk_field: ADC_DataAlign
        type: enum
        default: Right
        options:
          - { name: Right, value: 0, sdk: ADC_DataAlign_Right }
          - { name: Left , value: 1, sdk: ADC_DataAlign_Left }
        help: ADC_CTLR2 ALIGN, bit 11.


  TKEY:
    category: Analog
    notes: Touchkey channels reuse the ADC input pins (DS 1.4.11). Not on CH32V005.
    settings:
      - name: Channels
        type: checkboxes
        choices:
          - { name: CH0, signals: [CH0] }
          - { name: CH1, signals: [CH1] }
          - { name: CH2, signals: [CH2] }
          - { name: CH3, signals: [CH3] }
          - { name: CH4, signals: [CH4] }
          - { name: CH5, signals: [CH5] }
          - { name: CH6, signals: [CH6] }
          - { name: CH7, signals: [CH7] }
    remaps:
      - name: Default
        pins: { CH0: PA2, CH1: PA1, CH2: PC4, CH3: PD2, CH4: PD3, CH5: PD5, CH6: PD6, CH7: PD4 }

  OPA1:
    category: Analog
    notes: >
      OPA/PGA/CMP. Pin assignment from DS pin table (OPA_P0..P3, OPA_N0..N2, OPA_OUT0/1);
      selection via OPA_CTLR1 PSEL/NSEL/MODE. The polling set below was Medium confidence
      until the EVT package landed and is now settled - see the notes file.
    settings:
      # POLLING: the EVT header is explicit and it corrects what this file used to offer.
      # `OPA_InitTypeDef` has POLL_NUM of type OPA_PSEL_POLL_NUM_TypeDef, whose members are
      # CHP_POLL_NUM_1, _2 and _3 - **three is the maximum**, so the old
      # "Polling P0/P1/P2/P3" choice asked for hardware that does not exist and is gone.
      # Each slot is independent: POLL_CH1/CH2/CH3 are OPA_POLL_CH1/2/3_TypeDef and every
      # one of them offers PA2 / PD7 / PD3 / PD1, i.e. any of P0..P3. So the thing that
      # decides which PINS are claimed is the SET of channels polled, and every set of two
      # or three distinct channels is legal - all ten are listed rather than the single
      # arbitrary P0/P1/P2 this file used to hardcode.
      # A one-channel "poll" claims the same pin as simply selecting it, so it is not
      # listed separately. POLL_NUM and POLL_CH1..3 are DERIVED from the chosen set by the
      # generator; they are deliberately not user parameters, because a user-set POLL_NUM
      # could contradict the set and then the pins and the register would disagree.
      # Source: data/sources/V006/Evt/EXAM/SRC/Peripheral/inc/ch32v00X_opa.h.
      - name: Positive input (PSEL)
        choices:
          - { name: Disable }
          - { name: P0 — PA2, signals: [P0] }
          - { name: P1 — PD7, signals: [P1] }
          - { name: P2 — PD3, signals: [P2] }
          - { name: P3 — PD1, signals: [P3] }
          - { name: Polling P0/P1, signals: [P0, P1] }
          - { name: Polling P0/P2, signals: [P0, P2] }
          - { name: Polling P0/P3, signals: [P0, P3] }
          - { name: Polling P1/P2, signals: [P1, P2] }
          - { name: Polling P1/P3, signals: [P1, P3] }
          - { name: Polling P2/P3, signals: [P2, P3] }
          - { name: Polling P0/P1/P2, signals: [P0, P1, P2] }
          - { name: Polling P0/P1/P3, signals: [P0, P1, P3] }
          - { name: Polling P0/P2/P3, signals: [P0, P2, P3] }
          - { name: Polling P1/P2/P3, signals: [P1, P2, P3] }
      - name: Negative input (NSEL)
        choices:
          - { name: Disable }
          - { name: N0 — PA1, signals: [N0] }
          - { name: N1 — PD0, signals: [N1] }
          - { name: N2 — PA4, signals: [N2] }
          - { name: PGA internal feedback (no pin) }
      - name: Output
        choices:
          - { name: Disable }
          - { name: OUT0 — PD4, signals: [OUT0] }
          - { name: OUT1 — PA5, signals: [OUT1] }
          - { name: Internal to ADC IN9 only }
    # Everything here is a NON-pin setting, deliberately: what decides a pin lives in
    # `settings:` above where the conflict engine can see it. Every struct, field and
    # enum member read out of ch32v00X_opa.h and checked by tools/verify_sdk_names.py.
    params:
      - key: poll_trigger
        name: Poll trigger
        struct: OPA_InitTypeDef
        sdk_field: POLL_SEL
        type: enum
        group: Basic
        default: Software
        options:
          - { name: Software,  value: 0, sdk: OPA_POLL_SEL_SOFT }
          - { name: TIM1_CH4,  value: 1, sdk: OPA_POLL_SEL_TIM1_CH4 }
          - { name: TIM2_CH4,  value: 2, sdk: OPA_POLL_SEL_TIM2_CH4 }
          - { name: TIM3_CH1,  value: 3, sdk: OPA_POLL_SEL_TIM3_CH1 }
          - { name: TIM3_CH2,  value: 4, sdk: OPA_POLL_SEL_TIM3_CH2 }
        help: "What advances the poll to the next channel. Only meaningful when the positive input is a polling set. The three TIM3 options do not exist on CH32V005, which has no TIM3."
      - key: poll_auto
        name: Automatic polling
        struct: OPA_InitTypeDef
        sdk_field: POLL_AT
        type: enum
        group: Basic
        default: "Off"
        options:
          - { name: "Off", value: 0, sdk: OPA_POLL_AUTO_OFF }
          - { name: "On",  value: 1, sdk: OPA_POLL_AUTO_ON }
        help: "Advance the poll without software help once it is started."
      - key: setup_cfg
        name: ADC conversion interval
        struct: OPA_InitTypeDef
        sdk_field: SETUP_CFG
        type: enum
        group: Advanced
        default: Setting 0
        options:
          - { name: Setting 0, value: 0, sdk: OPA_SETUP_CFG_0 }
          - { name: Setting 1, value: 1, sdk: OPA_SETUP_CFG_1 }
          - { name: Setting 2, value: 3, sdk: OPA_SETUP_CFG_2 }
        help: "How long the OPA is given to settle before the ADC samples it. The enum skips value 2: OPA_SETUP_CFG_2 is 3, not 2, so the option index is NOT the register value here."
      - key: highspeed
        name: High speed mode
        struct: OPA_InitTypeDef
        sdk_field: OPA_HS
        type: enum
        group: Advanced
        default: "Off"
        options:
          - { name: "Off", value: 0, sdk: HS_OFF }
          - { name: "On",  value: 1, sdk: HS_ON }
        help: "Faster slew at a higher supply current."
      - key: out_ie
        name: Output interrupt
        struct: OPA_InitTypeDef
        sdk_field: OUT_IE
        type: enum
        group: Advanced
        default: "Off"
        options:
          - { name: "Off", value: 0, sdk: OUT_IE_OFF }
          - { name: "On",  value: 1, sdk: OUT_IE_ON }
        help: "Interrupt on the comparator output changing."
      - key: nmi_ie
        name: Output NMI
        struct: OPA_InitTypeDef
        sdk_field: NMI_IE
        type: enum
        group: Advanced
        default: "Off"
        options:
          - { name: "Off", value: 0, sdk: NMI_IE_OFF }
          - { name: "On",  value: 1, sdk: NMI_IE_ON }
        help: "Route the output to the non-maskable interrupt instead. RM Table 6-1 gives this part no OPA vector of its own, which is consistent with the output arriving as NMI."
    remaps:
      - name: Default
        pins: { P0: PA2, P1: PD7, P2: PD3, P3: PD1, N0: PA1, N1: PD0, N2: PA4, OUT0: PD4, OUT1: PA5 }

  # ---------------- Timers ----------------
  TIM1:
    category: Timers
    notes: Advanced timer, 4 channels + 3 complementary outputs + break input (RM ch.11).
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH1] }
          - { name: PWM Generation CH1, signals: [CH1] }
          - { name: PWM Generation CH1 CH1N, signals: [CH1, CH1N] }
          - { name: PWM Generation CH1N only, signals: [CH1N] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
          - { name: PWM Generation CH2 CH2N, signals: [CH2, CH2N] }
          - { name: PWM Generation CH2N only, signals: [CH2N] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
          - { name: PWM Generation CH3 CH3N, signals: [CH3, CH3N] }
          - { name: PWM Generation CH3N only, signals: [CH3N] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR (external), signals: [ETR] }
      - name: Break Input
        choices:
          - { name: Disable }
          - { name: Activate break input, signals: [BKIN] }
      # RM Table 7-8 note + RM 7.3.2.2 AFIO_PCFR1[13:10]: TIM1_RM = 11xx routes the
      # channel-1 INPUT to the internal LSI instead of a pin, for LSI calibration.
      # It is a value of the same TIM1_RM field, but it claims no pin, so it is a
      # setting here rather than an 11th entry in `remaps` (index == register value).
      - name: Channel 1 input source
        choices:
          - { name: "CH1 pin (TIM1_RM = 0000..1001)" }
          - { name: "Internal LSI for calibration (TIM1_RM = 11xx — frees the CH1 pin)" }
    # RM Table 7-8, TIM1_RM[3:0] — index == register value
    # OUTPUT COMPARE, per channel. AGENT-2 asked for the shape (BOARD 16:30Z) and this is
    # it: `channel_params` is a MAP carrying the struct and the call table, and its
    # `params:` list uses exactly the same entry schema as `dma.channel_params`, so the
    # existing per-channel editors and the existing verifier both work unchanged.
    #
    # It needs its own shape for two reasons the other init structs do not have:
    #
    #  1. It is PER CHANNEL, not per peripheral. A TIM has one time base and up to four
    #     independent compare units, so one TIM_OCInitTypeDef is filled and applied once
    #     for each channel that is configured.
    #  2. **Four different functions apply it** - TIM_OC1Init .. TIM_OC4Init
    #     (ch32v00X_tim.h:432-435), one per channel. `codegen.init_structs` maps a struct
    #     to a single `fn` and cannot express that, so the call table lives here instead.
    #     `sdk_calls` is written out rather than left as `TIM_OC${n}Init`: deriving a
    #     function name by pasting a number together is the same class of guess as
    #     deriving one from a struct name, which the generator already refuses to do.
    #
    # Struct member order is the header's own (tim.h:54-85). Every macro below is checked
    # by tools/verify_sdk_names.py against GPIOMode-style enum membership.
    channel_params:
      struct: TIM_OCInitTypeDef
      applies_per: channel
      sdk_calls: { 1: TIM_OC1Init, 2: TIM_OC2Init, 3: TIM_OC3Init, 4: TIM_OC4Init }
      params:
        - key: ocmode
          name: Output compare mode
          sdk_field: TIM_OCMode
          type: enum
          group: Basic
          default: PWM mode 1
          options:
            - { name: Frozen,          value: 0, sdk: TIM_OCMode_Timing }
            - { name: Active on match, value: 1, sdk: TIM_OCMode_Active }
            - { name: Inactive on match, value: 2, sdk: TIM_OCMode_Inactive }
            - { name: Toggle,          value: 3, sdk: TIM_OCMode_Toggle }
            - { name: PWM mode 1,      value: 6, sdk: TIM_OCMode_PWM1 }
            - { name: PWM mode 2,      value: 7, sdk: TIM_OCMode_PWM2 }
          help: "TIMx_CHCTLRn OCxM. The option values are the register encodings, so PWM mode 1 is 6 rather than 4 - modes 4 and 5 are the forced-low/forced-high settings, which TIM_ForcedAction* sets rather than this struct."
        - key: pulse
          name: Pulse (compare value)
          sdk_field: TIM_Pulse
          type: int
          group: Basic
          default: 0
          min: 0
          max: 65535
          help: "TIMx_CHnCVR. With PWM mode 1 and an up-counter the output is active while the counter is below this, so duty is pulse / (period + 1)."
        - key: ocpolarity
          name: Output polarity
          sdk_field: TIM_OCPolarity
          type: enum
          group: Basic
          default: High
          options:
            - { name: High, value: 0, sdk: TIM_OCPolarity_High }
            - { name: Low,  value: 1, sdk: TIM_OCPolarity_Low }
          help: "TIMx_CHCTLR CCxP. The only member of this struct the header does not mark as TIM1/TIM2 only."
        - key: outputstate
          name: Output state
          sdk_field: TIM_OutputState
          type: enum
          group: Basic
          default: Enable
          options:
            - { name: Disable, value: 0, sdk: TIM_OutputState_Disable }
            - { name: Enable,  value: 1, sdk: TIM_OutputState_Enable }
          help: "TIMx_CCER CCxE - whether the compare unit reaches the pin at all."
        - key: outputnstate
          name: Complementary output state
          sdk_field: TIM_OutputNState
          type: enum
          group: Advanced
          default: Disable
          options:
            - { name: Disable, value: 0, sdk: TIM_OutputNState_Disable }
            - { name: Enable,  value: 1, sdk: TIM_OutputNState_Enable }
          help: "TIMx_CCER CCxNE. The header marks this valid only for TIM1 and TIM2."
        - key: ocnpolarity
          name: Complementary output polarity
          sdk_field: TIM_OCNPolarity
          type: enum
          group: Advanced
          default: High
          options:
            - { name: High, value: 0, sdk: TIM_OCNPolarity_High }
            - { name: Low,  value: 1, sdk: TIM_OCNPolarity_Low }
          help: "TIMx_CCER CCxNP. The header marks this valid only for TIM1 and TIM2."
        - key: ocidlestate
          name: Idle state
          sdk_field: TIM_OCIdleState
          type: enum
          group: Advanced
          default: Reset
          options:
            - { name: Reset, value: 0, sdk: TIM_OCIdleState_Reset }
            - { name: Set,   value: 1, sdk: TIM_OCIdleState_Set }
          help: "TIMx_CTLR2 OISx - the level the pin takes when the outputs are disabled by the break input or by MOE. The header marks it valid ONLY for TIM1, so it is absent from TIM2 rather than offered and ignored."
        - key: ocnidlestate
          name: Complementary idle state
          sdk_field: TIM_OCNIdleState
          type: enum
          group: Advanced
          default: Reset
          options:
            - { name: Reset, value: 0, sdk: TIM_OCNIdleState_Reset }
            - { name: Set,   value: 1, sdk: TIM_OCNIdleState_Set }
          help: "TIMx_CTLR2 OISxN. TIM1 only, like the member above."
    remaps:
      - { name: "0000 Default",  pins: { ETR: PC5, CH1: PD2, CH2: PA1, CH3: PC3, CH4: PC4, BKIN: PC2, CH1N: PD0, CH2N: PA2, CH3N: PD1 } }
      - { name: "0001 Partial",  pins: { ETR: PD4, CH1: PD2, CH2: PA1, CH3: PC3, CH4: PC4, BKIN: PC2, CH1N: PD0, CH2N: PA2, CH3N: PD1 } }
      - { name: "0010 Partial",  pins: { ETR: PC5, CH1: PC6, CH2: PC7, CH3: PC0, CH4: PD3, BKIN: PC1, CH1N: PC3, CH2N: PC4, CH3N: PD1 } }
      - { name: "0011 Full",     pins: { ETR: PC2, CH1: PC4, CH2: PC7, CH3: PC5, CH4: PD4, BKIN: PC1, CH1N: PC3, CH2N: PD2, CH3N: PC6 } }
      - { name: "0100 Partial",  pins: { ETR: PD4, CH1: PA3, CH2: PB0, CH3: PB1, CH4: PD1, BKIN: PB3, CH1N: PA0, CH2N: PA2, CH3N: PD0 } }
