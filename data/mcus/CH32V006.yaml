  TIM2:
    category: Timers
    # RM 12.3.9: TIM2 can output 2 complementary pairs with dead-time, and when it does,
    # "channels 3 and 4 act as channel 1 and channel 2 complementary output channels".
    # So CH1N lives on the CH3 pin and CH2N on the CH4 pin — there are no extra pins, which
    # is why `remaps` below has only 4 signals. Selecting a complementary output and a plain
    # CH3/CH4 output at the same time is a genuine conflict and the engine will flag it.
    notes: Channels 3 and 4 double as CH1N and CH2N when complementary output is enabled (RM 12.3.9).
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH1_ETR] }
          - { name: PWM Generation CH1, signals: [CH1_ETR] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR (shares the CH1 pin), signals: [CH1_ETR] }
      - name: Encoder Mode
        choices:
          - { name: Disable }
          - { name: Encoder CH1/CH2, signals: [CH1_ETR, CH2] }
      - name: Complementary Outputs        # RM 12.3.9 — CH1N/CH2N reuse the CH3/CH4 pins
        choices:
          - { name: Disable }
          - { name: CH1N on the CH3 pin, signals: [CH3] }
          - { name: CH2N on the CH4 pin, signals: [CH4] }
          - { name: CH1N + CH2N on the CH3/CH4 pins, signals: [CH3, CH4] }
    # RM Table 7-9-1 (CH32V002/004/005/006), TIM2_RM[2:0]
    # OUTPUT COMPARE, per channel. AGENT-2 asked for the shape (BOARD 16:30Z) and this is
    # it: `channel_params` is a MAP carrying the struct and the call table, and its
    # `params:` list uses exactly the same entry schema as `dma.channel_params`, so the
    # existing per-channel editors and the existing verifier both work unchanged.
    #
    # It needs its own shape for two reasons the other init structs do not have:
    #
    #  1. It is PER CHANNEL, not per peripheral. A TIM has one time base and up to four
    #     independent compare units, so one TIM_OCInitTypeDef is filled and applied once
    #     for each channel that is configured.
    #  2. **Four different functions apply it** - TIM_OC1Init .. TIM_OC4Init
    #     (ch32v00X_tim.h:432-435), one per channel. `codegen.init_structs` maps a struct
    #     to a single `fn` and cannot express that, so the call table lives here instead.
    #     `sdk_calls` is written out rather than left as `TIM_OC${n}Init`: deriving a
    #     function name by pasting a number together is the same class of guess as
    #     deriving one from a struct name, which the generator already refuses to do.
    #
    # Struct member order is the header's own (tim.h:54-85). Every macro below is checked
    # by tools/verify_sdk_names.py against GPIOMode-style enum membership.
    channel_params:
      struct: TIM_OCInitTypeDef
      applies_per: channel
      sdk_calls: { 1: TIM_OC1Init, 2: TIM_OC2Init, 3: TIM_OC3Init, 4: TIM_OC4Init }
      params:
        - key: ocmode
          name: Output compare mode
          sdk_field: TIM_OCMode
          type: enum
          group: Basic
          default: PWM mode 1
          options:
            - { name: Frozen,          value: 0, sdk: TIM_OCMode_Timing }
            - { name: Active on match, value: 1, sdk: TIM_OCMode_Active }
            - { name: Inactive on match, value: 2, sdk: TIM_OCMode_Inactive }
            - { name: Toggle,          value: 3, sdk: TIM_OCMode_Toggle }
            - { name: PWM mode 1,      value: 6, sdk: TIM_OCMode_PWM1 }
            - { name: PWM mode 2,      value: 7, sdk: TIM_OCMode_PWM2 }
          help: "TIMx_CHCTLRn OCxM. The option values are the register encodings, so PWM mode 1 is 6 rather than 4 - modes 4 and 5 are the forced-low/forced-high settings, which TIM_ForcedAction* sets rather than this struct."
        - key: pulse
          name: Pulse (compare value)
          sdk_field: TIM_Pulse
          type: int
          group: Basic
          default: 0
          min: 0
          max: 65535
          help: "TIMx_CHnCVR. With PWM mode 1 and an up-counter the output is active while the counter is below this, so duty is pulse / (period + 1)."
        - key: ocpolarity
          name: Output polarity
          sdk_field: TIM_OCPolarity
          type: enum
          group: Basic
          default: High
          options:
            - { name: High, value: 0, sdk: TIM_OCPolarity_High }
            - { name: Low,  value: 1, sdk: TIM_OCPolarity_Low }
          help: "TIMx_CHCTLR CCxP. The only member of this struct the header does not mark as TIM1/TIM2 only."
        - key: outputstate
          name: Output state
          sdk_field: TIM_OutputState
          type: enum
          group: Basic
          default: Enable
          options:
            - { name: Disable, value: 0, sdk: TIM_OutputState_Disable }
            - { name: Enable,  value: 1, sdk: TIM_OutputState_Enable }
          help: "TIMx_CCER CCxE - whether the compare unit reaches the pin at all."
        - key: outputnstate
          name: Complementary output state
          sdk_field: TIM_OutputNState
          type: enum
          group: Advanced
          default: Disable
          options:
            - { name: Disable, value: 0, sdk: TIM_OutputNState_Disable }
            - { name: Enable,  value: 1, sdk: TIM_OutputNState_Enable }
          help: "TIMx_CCER CCxNE. The header marks this valid only for TIM1 and TIM2."
        - key: ocnpolarity
          name: Complementary output polarity
          sdk_field: TIM_OCNPolarity
          type: enum
          group: Advanced
          default: High
          options:
            - { name: High, value: 0, sdk: TIM_OCNPolarity_High }
            - { name: Low,  value: 1, sdk: TIM_OCNPolarity_Low }
          help: "TIMx_CCER CCxNP. The header marks this valid only for TIM1 and TIM2."
    remaps:
      - { name: "000 Default", pins: { CH1_ETR: PD4, CH2: PD3, CH3: PC0, CH4: PD7 } }
      - { name: "001 Partial", pins: { CH1_ETR: PC1, CH2: PD3, CH3: PC0, CH4: PD7 } }
      - { name: "010 Full",    pins: { CH1_ETR: PC5, CH2: PC2, CH3: PD2, CH4: PC1 } }
      - { name: "011 Full",    pins: { CH1_ETR: PC1, CH2: PC7, CH3: PD6, CH4: PD5 } }
      - { name: "100 Full",    pins: { CH1_ETR: PC0, CH2: PC1, CH3: PC3, CH4: PB6 } }
      - { name: "101 Full",    pins: { CH1_ETR: PA0, CH2: PA1, CH3: PA2, CH4: PA3 } }
      - { name: "110 Full",    pins: { CH1_ETR: PB1, CH2: PA1, CH3: PA2, CH4: PA3 } }
      - { name: "111 Full",    pins: { CH1_ETR: PD3, CH2: PD4, CH3: PA2, CH4: PA3 } }

    # Parameters - RM timer chapter. The control bits are all in TIM2_CTLR1.
    params:
      - key: prescaler
        name: Prescaler (PSC)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Prescaler
        type: int
        default: 0
        min: 0
        max: 65535
        help: "TIM2_PSC. Counter clock = HCLK / (Prescaler + 1)."
      - key: period
        name: Counter period (ATRLR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Period
        type: int
        default: 65535
        min: 0
        max: 65535
        help: "TIM2_ATRLR, shown at its reset value. One period is (Counter period + 1) counter ticks."
      - key: counter
        name: Counter mode
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_CounterMode
        type: enum
        default: Up
        options:
          - { name: Up              , value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down            , value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center aligned 1, value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center aligned 2, value: 3, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center aligned 3, value: 4, sdk: TIM_CounterMode_CenterAligned3 }
        help: "TIM2_CTLR1 DIR (bit 4) and CMS[6:5]."
      - key: ckd
        name: Internal clock division
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        default: "1"
        options:
          - { name: "1", value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "2", value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "4", value: 2, sdk: TIM_CKD_DIV4 }
        help: "TIM2_CTLR1 CKD[9:8]. Divides the clock feeding the digital filters and the dead-time generator, not the counter."
      - key: arpe
        name: Auto-reload preload
        sdk_call: TIM_ARRPreloadConfig
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        sdk_note: "TIM_TimeBaseInitTypeDef has NO auto-reload-preload member; it is a call after TIM_TimeBaseInit. ch32v00X_tim.h:468."
        type: bool
        default: false
        help: "TIM2_CTLR1 ARPE, bit 7."


  TIM3:
    category: Timers
    notes: >
      Streamlined timer - output compare only, no external pins (RM ch.13). Not on CH32V005.
      It shares the full TIM driver, so its time base is TIM_TimeBaseInitTypeDef exactly like
      TIM1 and TIM2; what it lacks is pins, not registers. No repetition-counter or dead-time
      parameter here: RCR and BDTR belong to the advanced-control timer, TIM1. And note that
      RM Table 6-1 gives this part NO TIM3 interrupt vector - confirmed against the EVT
      IRQn_Type enum and the startup table, see CH32V006.notes.md.
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]
    params:
      - key: prescaler
        name: Prescaler
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Prescaler
        type: int
        group: Basic
        default: 0
        min: 0
        max: 65535
        help: "TIMx_PSC. The counter is clocked at f_TIM / (prescaler + 1)."
      - key: period
        name: Counter period (auto-reload)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Period
        type: int
        group: Basic
        default: 65535
        min: 0
        max: 65535
        help: "TIMx_ATRLR. 16-bit, so 65535 is the ceiling."
      - key: counter
        name: Counter mode
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_CounterMode
        type: enum
        group: Basic
        default: Up
        options:
          - { name: Up,               value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down,             value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center aligned 1, value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center aligned 2, value: 4, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center aligned 3, value: 6, sdk: TIM_CounterMode_CenterAligned3 }
        help: "TIMx_CTLR1 DIR and CMS. The option values are the register encodings, which is why they run 0/1/2/4/6 rather than 0..4."
      - key: ckd
        name: Clock division
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        group: Advanced
        default: "1"
        options:
          - { name: "1", value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "2", value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "4", value: 2, sdk: TIM_CKD_DIV4 }
        help: "TIMx_CTLR1 CKD - the ratio between the timer clock and the digital filter sampling clock."
      - key: arpe
        name: Auto-reload preload
        sdk_call: TIM_ARRPreloadConfig
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        group: Advanced
        default: false
        help: "Buffers writes to the auto-reload register until the next update event. Not a member of TIM_TimeBaseInitTypeDef - it is a call after TIM_TimeBaseInit (ch32v00X_tim.h:468)."

  # ---------------- Connectivity ----------------
  USART1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
          - { name: Transmit only, signals: [TX] }
          - { name: Receive only, signals: [RX] }
          - { name: LIN, signals: [TX, RX] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS only, signals: [CTS] }
          - { name: RTS only, signals: [RTS] }
