          - { name: "2"  , value: 2, sdk: USART_StopBits_2 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
        help: "USART_CTLR2 STOP[13:12], listed in register order: 00 = 1, 01 = 0.5, 10 = 2, 11 = 1.5."


  SPI1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Full-Duplex Master, signals: [SCK, MISO, MOSI] }
          - { name: Full-Duplex Slave, signals: [SCK, MISO, MOSI] }
          - { name: Half-Duplex Master, signals: [SCK, MOSI] }
          - { name: Half-Duplex Slave, signals: [SCK, MISO] }
          - { name: Receive Only Master, signals: [SCK, MISO] }
          - { name: Receive Only Slave, signals: [SCK, MOSI] }
          - { name: Transmit Only Master, signals: [SCK, MOSI] }
          - { name: Transmit Only Slave, signals: [SCK, MISO] }
      - name: Hardware NSS Signal
        choices:
          - { name: Disable (software NSS) }
          - { name: Hardware NSS Input, signals: [NSS] }
          - { name: Hardware NSS Output, signals: [NSS] }
    # RM Table 7-12, SPI_RM[2:0]
    remaps:
      - { name: "000 Default", pins: { NSS: PC1, SCK: PC5, MISO: PC7, MOSI: PC6 } }
      - { name: "001",         pins: { NSS: PC0, SCK: PC5, MISO: PC7, MOSI: PC6 } }
      - { name: "010",         pins: { NSS: PC4, SCK: PD2, MISO: PB3, MOSI: PD3 } }
      - { name: "011",         pins: { NSS: PB0, SCK: PB1, MISO: PB2, MOSI: PC0 } }
      - { name: "100",         pins: { NSS: PD3, SCK: PD4, MISO: PD5, MOSI: PD6 } }
      - { name: "101",         pins: { NSS: PC1, SCK: PA1, MISO: PB5, MOSI: PA2 } }
      - { name: "110",         pins: { NSS: PC4, SCK: PB5, MISO: PC7, MOSI: PB4 } }

    # Parameters - RM 16 (SPI). Every one of these is a field of SPI_CTLR1.
    # There is no `mode: [Motorola, TI]` here: the CH32V00X RM has no FRF bit and no
    # mention of TI frame format, so this family cannot do it.
    params:
      - key: prescaler
        name: Baud rate prescaler
        struct: SPI_InitTypeDef
        sdk_field: SPI_BaudRatePrescaler
        type: enum
        default: "16"
        options:
          - { name: "2"  , value: 0, sdk: SPI_BaudRatePrescaler_2 }
          - { name: "4"  , value: 1, sdk: SPI_BaudRatePrescaler_4 }
          - { name: "8"  , value: 2, sdk: SPI_BaudRatePrescaler_8 }
          - { name: "16" , value: 3, sdk: SPI_BaudRatePrescaler_16 }
          - { name: "32" , value: 4, sdk: SPI_BaudRatePrescaler_32 }
          - { name: "64" , value: 5, sdk: SPI_BaudRatePrescaler_64 }
          - { name: "128", value: 6, sdk: SPI_BaudRatePrescaler_128 }
          - { name: "256", value: 7, sdk: SPI_BaudRatePrescaler_256 }
        help: "SPI_CTLR1 BR[5:3], codes 000..111 in this order. Divides HCLK - this family has one bus frequency, not a separate peripheral clock."
      - key: cpol
        name: Clock polarity (CPOL)
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPOL
        type: enum
        default: Low
        options:
          - { name: Low , value: 0, sdk: SPI_CPOL_Low }
          - { name: High, value: 1, sdk: SPI_CPOL_High }
        help: SPI_CTLR1 CPOL, bit 1.
      - key: cpha
        name: Clock phase (CPHA)
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPHA
        type: enum
        default: 1 Edge
        options:
          - { name: 1 Edge, value: 0, sdk: SPI_CPHA_1Edge }
          - { name: 2 Edge, value: 1, sdk: SPI_CPHA_2Edge }
        help: SPI_CTLR1 CPHA, bit 0.
      - key: datasize
        name: Data size
        struct: SPI_InitTypeDef
        sdk_field: SPI_DataSize
        type: enum
        default: 8 bits
        options:
          - { name: 8 bits , value: 0, sdk: SPI_DataSize_8b }
          - { name: 16 bits, value: 1, sdk: SPI_DataSize_16b }
        help: SPI_CTLR1 DFF, bit 11.
      - key: firstbit
        name: First bit
        struct: SPI_InitTypeDef
        sdk_field: SPI_FirstBit
        type: enum
        default: MSB First
        options:
          - { name: MSB First, value: 0, sdk: SPI_FirstBit_MSB }
          - { name: LSB First, value: 1, sdk: SPI_FirstBit_LSB }
        help: SPI_CTLR1 LSBFIRST, bit 7.
      - key: crc
        name: CRC calculation
        sdk_call: SPI_CalculateCRC
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        sdk_note: "SPI_InitTypeDef has SPI_CRCPolynomial (the polynomial) but no CRC ENABLE member; enabling it is a call after SPI_Init. ch32v00X_spi.h:53 and :140."
        type: bool
        default: false
        help: SPI_CTLR1 CRCEN, bit 13. The polynomial lives in SPI_CRCR and defaults to 7.


  I2C1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: I2C, signals: [SCL, SDA] }
    # RM Table 7-13-1 (CH32V002/004/005/006), I2C_RM[2:0]
    remaps:
      - { name: "000 Default", pins: { SCL: PC2, SDA: PC1 } }
      - { name: "001",         pins: { SCL: PD1, SDA: PD0 } }
      - { name: "010",         pins: { SCL: PC5, SDA: PC6 } }
      - { name: "011",         pins: { SCL: PB5, SDA: PB6 } }
      - { name: "1xx",         pins: { SCL: PB3, SDA: PD1 } }

    # Parameters - RM 17 (I2C).
    params:
      - key: speed
        name: Clock speed
        struct: I2C_InitTypeDef
        sdk_field: I2C_ClockSpeed
        type: int
        default: 100000
        min: 1000
        max: 400000
        unit: Hz
        help: "I2C_CKCFGR CCR[11:0] together with F/S (bit 15). Above 100 kHz the peripheral must be in fast mode."
      - key: duty
        name: Fast-mode duty cycle
        struct: I2C_InitTypeDef
        sdk_field: I2C_DutyCycle
        type: enum
        default: "2:1"
        options:
          - { name: "2:1" , value: 0, sdk: I2C_DutyCycle_2 }
          - { name: "16:9", value: 1, sdk: I2C_DutyCycle_16_9 }
        help: "I2C_CKCFGR DUTY, bit 14. Ignored below 100 kHz, where the peripheral runs in standard mode."
      - key: addrmode
        name: Addressing mode
        struct: I2C_InitTypeDef
        sdk_field: I2C_AcknowledgedAddress
        type: enum
        default: 7-bit
        options:
          - { name: 7-bit , value: 0, sdk: I2C_AcknowledgedAddress_7bit }
          - { name: 10-bit, value: 1, sdk: I2C_AcknowledgedAddress_10bit }
        help: I2C_OAR1 ADDMODE, bit 15.
      - key: addr
        name: Own address
        struct: I2C_InitTypeDef
        sdk_field: I2C_OwnAddress1
        type: int
        default: 0
        min: 0
        max: 1023
        help: "I2C_OAR1 ADD[9:0]. Only the low 7 bits are used in 7-bit addressing mode."


# -----------------------------------------------------------------------------
# External interrupts — RM 6.4.4 Table 6-2, register AFIO_EXTICR (RM 7.3.2.1).
#
# EXTI is not a peripheral in the `peripherals:` sense: it has eight INDEPENDENT
# 4-way selectors, one per line, whereas a `remaps:` entry switches every signal of a
# peripheral at once. So it lives here as plain data. The app ignores unknown
# top-level keys, so this block is inert until AGENT-2 wires it in.
#
# Line x can only ever reach pin number x — EXTI3 reaches PA3/PB3/PC3/PD3 and nothing
# else. The key is the 2-bit AFIO_EXTICR field value for that line.
exti:
  register: { name: AFIO_EXTICR, address: 0x40010008, bits_per_line: 2, reset: 0x00000000 }
  lines:
    EXTI0: { "00": PA0, "01": PB0, "10": PC0, "11": PD0 }
    EXTI1: { "00": PA1, "01": PB1, "10": PC1, "11": PD1 }
    EXTI2: { "00": PA2, "01": PB2, "10": PC2, "11": PD2 }
    EXTI3: { "00": PA3, "01": PB3, "10": PC3, "11": PD3 }
    EXTI4: { "00": PA4, "01": PB4, "10": PC4, "11": PD4 }
    EXTI5: { "00": PA5, "01": PB5, "10": PC5, "11": PD5 }
    EXTI6: { "00": PA6, "01": PB6, "10": PC6, "11": PD6 }
    EXTI7: { "00": PA7,             "10": PC7, "11": PD7 }   # no PB7 on CH32V00x — 01 selects nothing
  internal:                       # RM Table 6-2 — no pin, cannot conflict
    EXTI8: { event: PVD — supply crossed the voltage-monitoring threshold }
    EXTI9: { event: Automatic wake-up }
  interrupt: EXTI7_0 — one vector for lines 0-7 (RM Table 6-1, vector 20)

# -----------------------------------------------------------------------------
# DMA — RM 8.2 Table 8-2 and Figure 8-1. Seven channels; a channel serves several
# peripherals, so two peripherals on the same channel is a conflict the app can warn
# about. No pins are involved, so this never affects the pinout.
#
# Confidence: HIGH. Table 8-2 and Figure 8-1 are two separate renderings of the same
# map in the source and they agree on every entry, which is why this is not marked
# provisional despite Table 8-2 being badly mangled by the PDF-to-markdown conversion.
dma:
  controller: DMA1
  channels: 7
  requests:
    1: [ADC1, TIM2_CH3, TIM3_CH3]
    2: [SPI1_RX, TIM1_CH1, TIM2_UP]
    3: [SPI1_TX, TIM1_CH2]
    4: [USART1_TX, TIM1_TRIG, TIM1_COM, TIM1_CH4, TIM3_CH4]
    5: [USART1_RX, TIM2_CH1, TIM1_UP]
    6: [I2C1_TX, TIM1_CH3, USART2_TX]
    7: [I2C1_RX, TIM2_CH2, TIM2_CH4, USART2_RX]
  # --- Configuration, RM 8.3.3 (DMA_CFGRx) -------------------------------------------
  # A request is not just "which channel": it is a direction, a priority, two data widths
  # and two increment flags, and all of them land in one register. The UI builds its DMA
  # Settings tab from `channel_params`, which is deliberately the SAME schema as a
  # peripheral's `params:` (key / name / type / default / options with `value`), so the
  # Parameter Settings editors render it with no new UI code.
  init_struct: DMA_InitTypeDef
  register:
    name: DMA_CFGRx
    address: 0x40020008          # channel 1; RM 8.3.3 "offset 0x08 + (x-1)*20"
    stride: 20
    channel_macro: DMA1_Channel$CH
    fields:
      EN:      { lsb: 0,  bits: 1 }
      TCIE:    { lsb: 1,  bits: 1 }
      HTIE:    { lsb: 2,  bits: 1 }
      TEIE:    { lsb: 3,  bits: 1 }
      DIR:     { lsb: 4,  bits: 1 }
      CIRC:    { lsb: 5,  bits: 1 }
      PINC:    { lsb: 6,  bits: 1 }
      MINC:    { lsb: 7,  bits: 1 }
      PSIZE:   { lsb: 8,  bits: 2 }
      MSIZE:   { lsb: 10, bits: 2 }
      PL:      { lsb: 12, bits: 2 }
      MEM2MEM: { lsb: 14, bits: 1 }

  # Every field of DMA_InitTypeDef the user chooses. The addresses and the transfer count
  # are not here on purpose: DMA_PeripheralBaseAddr, DMA_MemoryBaseAddr and
  # DMA_BufferSize are the application's buffer, not a configuration choice, and CubeMX
  # does not ask for them either. The generator emits them as named TODOs.
  #
  # `value` is the register encoding and comes from RM 8.3.3 - certain. `sdk` is the EVT
  # SDK macro and follows the standard WCH/SPL spelling; no ch32v00x EVT copy exists in
  # this repo to confirm it against (same open question as gpio_clock, HUMAN_TODO 5), so
  # a generator that cannot find the macro should fall back to the register value, which
  # is never in doubt.
  channel_params:
    - key: dir
      name: Direction
      type: enum
      group: Basic
      field: DIR
      sdk_field: DMA_DIR
      default: Peripheral to memory
      options:
        - { name: Peripheral to memory, value: 0, sdk: DMA_DIR_PeripheralSRC }
        - { name: Memory to peripheral, value: 1, sdk: DMA_DIR_PeripheralDST }
      help: "DMA_CFGRx DIR, bit 4: 0 reads from the peripheral, 1 reads from memory. The SDK names it after what the PERIPHERAL is - PeripheralSRC is peripheral-to-memory."
    - key: priority
      name: Priority
      type: enum
      group: Basic
      field: PL
      sdk_field: DMA_Priority
      default: Low
      options:
        - { name: Low,       value: 0, sdk: DMA_Priority_Low }
        - { name: Medium,    value: 1, sdk: DMA_Priority_Medium }
        - { name: High,      value: 2, sdk: DMA_Priority_High }
        - { name: Very high, value: 3, sdk: DMA_Priority_VeryHigh }
      help: "DMA_CFGRx PL[13:12]. Software priority; ties are broken by channel number, lowest wins (RM 8.2)."
    - key: mode
      name: Mode
      type: enum
      group: Basic
      field: CIRC
      sdk_field: DMA_Mode
      default: Normal
      options:
        - { name: Normal,   value: 0, sdk: DMA_Mode_Normal }
        - { name: Circular, value: 1, sdk: DMA_Mode_Circular }
      help: "DMA_CFGRx CIRC, bit 5. Circular reloads the transfer count and runs forever - what a continuously sampling ADC or a repeating PWM pattern wants. RM 8.2.4: circular mode is NOT available in memory-to-memory mode."
    - key: pinc
      name: Increment peripheral address
      type: bool
      group: Basic
      field: PINC
      sdk_field: DMA_PeripheralInc
      default: false
      sdk_enabled: DMA_PeripheralInc_Enable
      sdk_disabled: DMA_PeripheralInc_Disable
      help: "DMA_CFGRx PINC, bit 6. Off for a normal peripheral: its data register is one fixed address."
    - key: minc
      name: Increment memory address
      type: bool
      group: Basic
      field: MINC
      sdk_field: DMA_MemoryInc
      default: true
      sdk_enabled: DMA_MemoryInc_Enable
      sdk_disabled: DMA_MemoryInc_Disable
      help: "DMA_CFGRx MINC, bit 7. On for a buffer - off would rewrite one variable over and over."
    - key: psize
      name: Peripheral data width
      type: enum
      group: Basic
      field: PSIZE
      sdk_field: DMA_PeripheralDataSize
      default: Byte
      options:
        - { name: Byte,      value: 0, sdk: DMA_PeripheralDataSize_Byte }
        - { name: Half Word, value: 1, sdk: DMA_PeripheralDataSize_HalfWord }
        - { name: Word,      value: 2, sdk: DMA_PeripheralDataSize_Word }
      help: "DMA_CFGRx PSIZE[9:8]: 00 8-bit, 01 16-bit, 10 32-bit. 11 is reserved, which is why there are three options and not four. Match the peripheral's own register width."
    - key: msize
      name: Memory data width
      type: enum
      group: Basic
      field: MSIZE
      sdk_field: DMA_MemoryDataSize
      default: Byte
      options:
        - { name: Byte,      value: 0, sdk: DMA_MemoryDataSize_Byte }
        - { name: Half Word, value: 1, sdk: DMA_MemoryDataSize_HalfWord }
        - { name: Word,      value: 2, sdk: DMA_MemoryDataSize_Word }
      help: "DMA_CFGRx MSIZE[11:10], same encoding as PSIZE. Widths may differ from the peripheral's; the DMA packs or unpacks between them."
    - key: m2m
      name: Memory to memory
      type: bool
      group: Advanced
      field: MEM2MEM
      sdk_field: DMA_M2M
      default: false
      sdk_enabled: DMA_M2M_Enable
      sdk_disabled: DMA_M2M_Disable
      help: "DMA_CFGRx MEM2MEM, bit 14. A hardware peripheral request must leave this off: the channel would ignore the request line and run from a software trigger instead."

  # Interrupt-enable bits in the same register. They are not user parameters - the app
  # turns them on when the matching NVIC vector is enabled - but codegen needs the names.
  interrupt_fields: { transfer_complete: TCIE, half_transfer: HTIE, transfer_error: TEIE }

  # Per-request starting values, applied when the user adds a request. Only the fields
  # that differ from the `default` above are listed; everything else takes the default.
  # These are the values the hardware actually needs, not preferences - a USART data
  # register is 8 bits wide, so a 16-bit transfer to it is a bug, not a choice.
  request_defaults:
    ADC1:       { dir: Peripheral to memory, psize: Half Word, msize: Half Word, mode: Circular }
    USART1_TX:  { dir: Memory to peripheral }
    USART1_RX:  { dir: Peripheral to memory }
    USART2_TX:  { dir: Memory to peripheral }
    USART2_RX:  { dir: Peripheral to memory }
    SPI1_TX:    { dir: Memory to peripheral }
    SPI1_RX:    { dir: Peripheral to memory }
    I2C1_TX:    { dir: Memory to peripheral }
    I2C1_RX:    { dir: Peripheral to memory }
    TIM1_UP:    { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM1_TRIG:  { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM1_COM:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM1_CH1:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM1_CH2:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM1_CH3:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM1_CH4:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM2_UP:    { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM2_CH1:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM2_CH2:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM2_CH3:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM2_CH4:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM3_CH3:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
    TIM3_CH4:   { dir: Memory to peripheral, psize: Half Word, msize: Half Word }
  # How a setting changes the DMA request map. TIM2_DMA_REMAP (RM 20.1 item 2) lets
  # TIM2_CH4's DMA request share the TIM2 update channel instead of using its own, so the
  # channel a user sees for TIM2_CH4 depends on a setting of a DIFFERENT peripheral. That
  # is the same coupling shape as clock.hse_peripheral / hse_setting, and it is stated
  # here rather than hardcoded anywhere.
  #
  # AGENT-2: with the remap ON, TIM2_CH4 is served by the channel that carries TIM2_UP
  # (channel 2) and its own entry on channel 7 no longer applies. `dma.requests` in this
  # file is the remap-OFF map, which is the reset state (EXTEN_CTR resets to 0x00000400,
  # bit 16 clear).
  remaps:
    - peripheral: EXTEN
      setting: TIM2 channel 4 DMA
      when: Share the TIM2 update request
      register: "EXTEN->EXTEN_CTR"
      macro: EXTEN_TIM2_DMA_REMAP
      lsb: 16
      bits: 1
      moves: { request: TIM2_CH4, from_channel: 7, to_channel: 2 }
      note: >
        RM 20.1: "The updated DMA channel can be shared between the DMA request of TIM2
        channel 4 and the updated DMA request." Channel 2 is where TIM2_UP lives in
        dma.requests; channel 7 is TIM2_CH4's own.

  request_notes:
    ADC1: >
      ADC_RDATAR is 12-bit data in a 16-bit field, so both widths are half-word; a byte
      transfer would silently truncate every sample. Circular is the default because a
      one-shot ADC rarely needs DMA at all - the reason to wire it up is continuous
      conversion into a buffer.
    TIM: >
      The timer registers this can target (CCRx, ARR, CNT) are 16-bit, hence half-word on
      both sides. Direction is the interesting one: memory-to-peripheral is the common
      case (feeding compare values for PWM), but the SAME request serves input capture,
      which reads CCRx and therefore runs peripheral-to-memory. The default is the
      common case and the user changes it; nothing in the data can decide it, because
      TIMx_CHy names an event, not a direction.
    USART: >
      USART_DATAR is 8 significant bits in the default 8-bit word length, so byte/byte.
      A 9-bit word length makes the register half-word; the app does not couple the two
      automatically, because the buffer layout is the application's call.
    SPI1: >
      Byte/byte matches SPI1's default 8-bit data size. If the `datasize` parameter is
      set to 16 bits, both widths should be half-word - this is the one place where a
      peripheral parameter and a DMA parameter have to agree, and today nothing enforces
      it. Worth a warning in the engine rather than a silent mismatch.

  notes: >
    RM Table 8-2 note (2): on CH32V006 the TIM3 CH3 event can trigger only DMA channel 1
    and the TIM3 CH4 event only channel 4. The wider TIM3 fan-out in the table
    (channels 1-3 and 4-6) applies to CH32M007, not to this part.
    TIM1_TRIG, TIM1_COM and TIM1_CH4 share channel 4 as one hardware request line.


# -----------------------------------------------------------------------------
# Interrupts - RM Table 6-1 (the CH32V00X vector table) and RM 6.5.2.21
# (PFIC_IPRIORx). Every vector the part owns, grouped by the peripheral that owns
# it, so each peripheral's NVIC Settings tab lists only its own and the NVIC panel
# in System Core can list them all.
#
# THE PRIORITY SCHEME IS NOT THE CORTEX-M ONE. Anyone arriving from STM32CubeMX
# expects 4 priority bits and a configurable group split. The PFIC has TWO usable
# bits: PFIC_IPRIORx gives each interrupt a byte, but only [7:6] are implemented and
# [5:0] are "reserved, fixed to 0, write invalid" (RM 6.5.2.21). Maximum nesting
# depth is 2 (RM 6.1.1), and the register description spells out what the two bits
# mean in each case:
#   nesting off -> both bits are plain priority, 4 levels, nothing preempts
#   nesting on  -> bit 7 is the preemption level (2), bit 6 the sub-priority (2)
# So "preemption priority 0-1, sub priority 0-1" is the whole range. A UI offering
# 0-15 would be offering settings the silicon discards.
nvic:
  controller: PFIC
  scheme:
    register: { name: PFIC_IPRIORx, address: 0xE000E400, bits_per_vector: 8 }
    priority_bits: 2                  # [7:6]; [5:0] are reserved and write-invalid
    priority_lsb: 6
    max_nesting: 2                    # RM 6.1.1
    groups:
      - name: 2 levels of nesting (1 preemption bit, 1 sub-priority bit)
        default: true
        preempt: { bits: 1, lsb: 7, min: 0, max: 1 }
        sub:     { bits: 1, lsb: 6, min: 0, max: 1 }
      - name: No nesting (2 priority bits, no preemption)
        preempt: { bits: 0, min: 0, max: 0 }
        sub:     { bits: 2, lsb: 6, min: 0, max: 3 }
    enable:  { register: PFIC_IENR1, address: 0xE000E100, note: "one bit per vector number; IENR2 covers 32-40" }
    disable: { register: PFIC_IRER1, address: 0xE000E180 }
    notes: >
      Where the nesting depth itself is configured is NOT in this reference manual.
      PFIC_CFGR (RM 6.5.2.6) is only KEYCODE and RSTSYS, and no other PFIC register
      carries it; on this core it is a CSR of the QingKe V2 core, documented in the
      core manual rather than here. The two groups above are therefore offered as a
      choice with the meaning of the bits spelled out, and no register write is
      claimed for the switch itself. Do not invent one.
  vectors:
    # `vector` is the No. column of RM Table 6-1 - the index into the vector table,
    # which is also what the SDK's IRQn enum uses.
    #
    # TWO names per vector, because the SDK uses two and they are NOT interchangeable:
    #   irqn     the IRQn_Type member, what NVIC_InitStructure.NVIC_IRQChannel takes
    #   handler  the symbol in the startup vector table, what the user's ISR must be
    #            called to be linked in (it is `.weak` and defaults to an endless loop)
    #
    # The vendor is not consistent between the two and neither may we pretend to be:
    # vector 29 is `ADC_IRQn` in the enum but `ADC1_IRQHandler` in the startup table,
    # and vector 2 is `NonMaskableInt_IRQn` but `NMI_Handler`. This file claimed
    # `ADC1_IRQn`, which exists in NEITHER - generated NVIC code naming it would not
    # have compiled. Found by tools/verify_sdk_names.py, round 3.
    #
    # Every pair below is taken mechanically from the EVT package, not transcribed:
    #   irqn     IRQn_Type in data/sources/V006/Evt/EXAM/SRC/Peripheral/inc/ch32v00X.h:45-82
    #   handler  the .word table in .../Evt/EXAM/SRC/Startup/startup_ch32v00X.S:19-58
    # The two sources agree on all 29 vector NUMBERS, which is an independent check on
    # RM Table 6-1 - and both confirm the contradiction recorded in the notes:
    # **there is no TIM3 vector**, although this part has a TIM3. The enum ends at
    # OPCM_IRQn = 40 and the startup table ends at OPCM_IRQHandler. Nothing invented.
    - { name: NMI,       vector: 2,  irqn: NonMaskableInt_IRQn, handler: NMI_Handler,              system: true, fixed: true, description: Non-maskable interrupt }
    - { name: HardFault, vector: 3,  irqn: HardFault_IRQn,      handler: HardFault_Handler,        system: true, fixed: true, description: Abnormal interrupt (exception) }
    - { name: SysTick,   vector: 12, irqn: SysTick_IRQn,        handler: SysTick_Handler,          system: true, description: System timer interrupt }
    - { name: SW,        vector: 14, irqn: Software_IRQn,       handler: SW_Handler,               system: true, description: Software interrupt }
    - { name: WWDG,      vector: 16, irqn: WWDG_IRQn,           handler: WWDG_IRQHandler,          peripheral: WWDG, description: Window watchdog timer interrupt }
    - { name: PVD,       vector: 17, irqn: PVD_IRQn,            handler: PVD_IRQHandler,           peripheral: PWR, description: Supply voltage detection interrupt (through EXTI line 8) }
    - { name: FLASH,     vector: 18, irqn: FLASH_IRQn,          handler: FLASH_IRQHandler,         peripheral: FLASH, description: Flash global interrupt }
    - { name: RCC,       vector: 19, irqn: RCC_IRQn,            handler: RCC_IRQHandler,           peripheral: RCC, description: Reset and clock control interrupt }
    - { name: EXTI7_0,   vector: 20, irqn: EXTI7_0_IRQn,        handler: EXTI7_0_IRQHandler,       peripheral: EXTI, description: EXTI line 0-7 interrupt (one vector for all eight lines) }
    - { name: AWU,       vector: 21, irqn: AWU_IRQn,            handler: AWU_IRQHandler,           peripheral: PWR, description: Automatic wake-up interrupt (through EXTI line 9) }
    - { name: DMA1_CH1,  vector: 22, irqn: DMA1_Channel1_IRQn,  handler: DMA1_Channel1_IRQHandler, peripheral: DMA1, channel: 1, description: DMA1 channel 1 global interrupt }
    - { name: DMA1_CH2,  vector: 23, irqn: DMA1_Channel2_IRQn,  handler: DMA1_Channel2_IRQHandler, peripheral: DMA1, channel: 2, description: DMA1 channel 2 global interrupt }
    - { name: DMA1_CH3,  vector: 24, irqn: DMA1_Channel3_IRQn,  handler: DMA1_Channel3_IRQHandler, peripheral: DMA1, channel: 3, description: DMA1 channel 3 global interrupt }
    - { name: DMA1_CH4,  vector: 25, irqn: DMA1_Channel4_IRQn,  handler: DMA1_Channel4_IRQHandler, peripheral: DMA1, channel: 4, description: DMA1 channel 4 global interrupt }
    - { name: DMA1_CH5,  vector: 26, irqn: DMA1_Channel5_IRQn,  handler: DMA1_Channel5_IRQHandler, peripheral: DMA1, channel: 5, description: DMA1 channel 5 global interrupt }
    - { name: DMA1_CH6,  vector: 27, irqn: DMA1_Channel6_IRQn,  handler: DMA1_Channel6_IRQHandler, peripheral: DMA1, channel: 6, description: DMA1 channel 6 global interrupt }
    - { name: DMA1_CH7,  vector: 28, irqn: DMA1_Channel7_IRQn,  handler: DMA1_Channel7_IRQHandler, peripheral: DMA1, channel: 7, description: DMA1 channel 7 global interrupt }
    - { name: ADC,       vector: 29, irqn: ADC_IRQn,            handler: ADC1_IRQHandler,          peripheral: ADC1, description: ADC global interrupt }
    - { name: I2C1_EV,   vector: 30, irqn: I2C1_EV_IRQn,        handler: I2C1_EV_IRQHandler,       peripheral: I2C1, description: I2C1 event interrupt }
    - { name: I2C1_ER,   vector: 31, irqn: I2C1_ER_IRQn,        handler: I2C1_ER_IRQHandler,       peripheral: I2C1, description: I2C1 error interrupt }
    - { name: USART1,    vector: 32, irqn: USART1_IRQn,         handler: USART1_IRQHandler,        peripheral: USART1, description: USART1 global interrupt }
    - { name: SPI1,      vector: 33, irqn: SPI1_IRQn,           handler: SPI1_IRQHandler,          peripheral: SPI1, description: SPI1 global interrupt }
    - { name: TIM1BRK,   vector: 34, irqn: TIM1_BRK_IRQn,       handler: TIM1_BRK_IRQHandler,      peripheral: TIM1, description: TIM1 break interrupt }
    - { name: TIM1UP,    vector: 35, irqn: TIM1_UP_IRQn,        handler: TIM1_UP_IRQHandler,       peripheral: TIM1, description: TIM1 update interrupt }
    - { name: TIM1TRG,   vector: 36, irqn: TIM1_TRG_COM_IRQn,   handler: TIM1_TRG_COM_IRQHandler,  peripheral: TIM1, description: TIM1 trigger and commutation interrupt }
    - { name: TIM1CC,    vector: 37, irqn: TIM1_CC_IRQn,        handler: TIM1_CC_IRQHandler,       peripheral: TIM1, description: TIM1 capture/compare interrupt }
    - { name: TIM2,      vector: 38, irqn: TIM2_IRQn,           handler: TIM2_IRQHandler,          peripheral: TIM2, description: TIM2 global interrupt }
    - { name: USART2,    vector: 39, irqn: USART2_IRQn,         handler: USART2_IRQHandler,        peripheral: USART2, description: USART2 global interrupt }
    - { name: OPCM,      vector: 40, irqn: OPCM_IRQn,           handler: OPCM_IRQHandler,          peripheral: OPA1, description: Operational amplifier and comparator global interrupt }
  notes: >
    RM Table 6-1 ends at vector 40 and lists NO TIM3 interrupt, while CH32V006 does
    have TIM3 (RM Table 8-2 note 2 describes its DMA requests on this very part).
    Either the table is written for the base family and V006 adds a vector the
    manual does not print, or TIM3 on this part is usable only through DMA and
    polling. The table is the only statement available, so no TIM3 vector is
    invented here; see CH32V006.notes.md. If a WCH SDK header for ch32v00x turns up,
    this is the first thing to check.

# -----------------------------------------------------------------------------
# GPIO capabilities — what the pin actually offers, so the UI does not offer more.
#
# This part has exactly ONE output speed. `GPIOx_CFGLR.MODEy` is a single bit
# (RM v1.4 7.3.1.1: "1: Output mode, maximum speed 30MHz; 0: Input mode"), and the
# EVT SDK agrees: `GPIOSpeed_TypeDef` in
# data/sources/V006/Evt/EXAM/SRC/Peripheral/inc/ch32v00X_gpio.h lines 23-26 has a
# single member, `GPIO_Speed_30MHz = 1`. There is no 2 MHz, 10 MHz or 50 MHz on this
# silicon; those are the CH32V10x/20x/30x spellings and they do not compile here.
#
# FORMAT.md: a `speeds:` list with ONE entry means the control is NOT SHOWN — the
# value is displayed as fixed text. It does not mean "shown disabled".
gpio:
  speeds:
    - { name: "30 MHz", macro: GPIO_Speed_30MHz }

  # The SPL macro for each GPIO-table mode, so the generator stops carrying its own
  # table. Same reasoning as `speeds` above and the same defect class: `GPIOMode_TypeDef`
  # is per family, and a mode macro from another CH32 part is a name that compiles
  # nowhere. All EIGHT members of the enum in
  # data/sources/V006/Evt/EXAM/SRC/Peripheral/inc/ch32v00X_gpio.h lines 28-38 are
  # accounted for below - five here, three under `input_modes`.
  modes:
    - { name: Output Push Pull,              macro: GPIO_Mode_Out_PP }
    - { name: Output Open Drain,             macro: GPIO_Mode_Out_OD }
    - { name: Alternate Function Push Pull,  macro: GPIO_Mode_AF_PP }
    - { name: Alternate Function Open Drain, macro: GPIO_Mode_AF_OD }
    - { name: Analog,                        macro: GPIO_Mode_AIN }

  # Mode `Input` does not have one macro: the SPL folds the PULL setting into the mode,
  # so which of these three applies is decided by the GPIO table's Pull-up/Pull-down
  # column, not by a fourth mode entry. Keyed by the pull name for that reason.
  input_modes:
    - { name: No pull,   macro: GPIO_Mode_IN_FLOATING }
    - { name: Pull-up,   macro: GPIO_Mode_IPU }
    - { name: Pull-down, macro: GPIO_Mode_IPD }

# -----------------------------------------------------------------------------
# Code generation — register encodings the C generator cannot derive from the model.
# Requested by AGENT-2 (BOARD 05:43Z / 05:44Z). Every number below was read off the
# reference manual directly, not copied from the request; the one disagreement that
# found is called out where it occurs.
codegen:
  # ch32v00X.h — CAPITAL X. `ch32v00x.h` is the CH32V003 header, a different part with
  # a different register map; it resolved here only because NTFS ignores case, and it
  # fails outright on Linux. Confirmed: EVT
  # data/sources/V006/Evt/EXAM/SRC/Peripheral/inc/ch32v00X.h line 2 "File Name : ch32v00X.h",
  # guard `__CH32V00X_H` line 12.
  header: ch32v00X.h

  # Which SDK this part's names must be checked against. NOT guessable from the part
  # number - CH32V005/CH32V006 are series `ch32v00Xx` while CH32V003 is `ch32v00x`, and
  # both are installed side by side. `tools/verify_sdk_names.py` reads this, prefers the
  # EVT drop, and falls back to the PlatformIO package.
  sdk:
    evt: V006          # data/sources/<evt>/Evt   - the EVT package covering this part
    series: ch32v00Xx  # framework-wch-noneos-sdk/Peripheral/<series>/inc

  # RM 3.4.7: the GPIO ports and AFIO sit in RCC_PB2PCENR — AFIOEN bit 0, IOPAEN..IOPDEN
  # bits 2..5. The register really is named "PB2" on this family, not "APB2" (RM Table
  # 3-x, R32_RCC_PB2PCENR at 0x40021018), which is why the macro spelling below reads
  # PB2. CONFIRMED against EVT, HUMAN_TODO item 5 closed:
  # data/sources/V006/Evt/EXAM/SRC/Peripheral/inc/ch32v00X_rcc.h declares
  # RCC_PB2PeriphClockCmd (line 157), RCC_PB2Periph_AFIO (88) and
  # RCC_PB2Periph_GPIOA..GPIOD (89-92). The `APB2` spelling belongs to CH32X035.
  gpio_clock: { fn: RCC_PB2PeriphClockCmd, port: RCC_PB2Periph_GPIO$PORT, afio: RCC_PB2Periph_AFIO }

  # GPIO-table speed name -> SPL macro. The authoritative list of speeds this part
  # OFFERS is `gpio.speeds` above; this map only translates a stored name to a macro.
  # Low/Medium/High are here as ALIASES so a .wchproj saved before the one-speed fix
  # still generates code that compiles — they are not an offer, and the UI must read
  # `gpio.speeds`, never these keys. AGENT-2: once emission is driven by gpio.speeds,
  # this whole map becomes redundant and should go.
  speeds:
    "30 MHz": GPIO_Speed_30MHz
    Low:      GPIO_Speed_30MHz    # legacy alias
    Medium:   GPIO_Speed_30MHz    # legacy alias
    High:     GPIO_Speed_30MHz    # legacy alias

  # AFIO_PCFR1 — RM 7.3.2.2. Bit layout row, high half then low half:
  #   [31:27] Reserved  [26:24] SWCFG  23 Reserved  [22:20] USART2_RM  19 ADC_ETRGREG_RM
  #   18 ADC_ETRGINJ_RM  17 PA1PA2_RM  16 TIM2_RM[2]
  #   [15:14] TIM2_RM[1:0]  [13:10] TIM1_RM  [9:6] USART1_RM  [5:3] I2C1_RM  [2:0] SPI1_RM
  #
  # Only peripherals whose `remaps:` index IS the register field value belong here.
  # SYS is deliberately absent: its remap list selects the package's reset pin, not an
  # AFIO field, so putting SWCFG here would write the package index into the register.
  # ADC1, TKEY, OPA1 and RCC each have a single "Default" remap for the same reason.
  remap:
    register: "AFIO->PCFR1"
    fields:
      SPI1:   [{ lsb: 0,  bits: 3 }]
      I2C1:   [{ lsb: 3,  bits: 3 }]
      USART1: [{ lsb: 6,  bits: 4 }]
      TIM1:   [{ lsb: 10, bits: 4 }]
      # TIM2_RM is three contiguous bits, [16:14]. It is written as two slices because
      # the RM's bit diagram splits the field across its two half-rows and the engine
      # supports that shape; [{lsb:14,bits:3}] would encode identically.
      TIM2:   [{ lsb: 14, bits: 2 }, { lsb: 16, bits: 1, from: 2 }]
      USART2: [{ lsb: 20, bits: 3 }]

  # Which SDK function applies each init struct, and what it applies it TO. AGENT-2's
  # generator refuses to derive a function name from a struct name, which is right: the
  # pairing is not mechanical. Every line confirmed in the EVT headers.
  init_structs:
    GPIO_InitTypeDef:          { fn: GPIO_Init }          # ch32v00X_gpio.h:138
    USART_InitTypeDef:         { fn: USART_Init }         # ch32v00X_usart.h:121
    SPI_InitTypeDef:           { fn: SPI_Init }           # ch32v00X_spi.h:129
    I2C_InitTypeDef:           { fn: I2C_Init }           # ch32v00X_i2c.h:287
    ADC_InitTypeDef:           { fn: ADC_Init }           # ch32v00X_adc.h:156
    DMA_InitTypeDef:           { fn: DMA_Init }           # ch32v00X_dma.h:162
    TIM_TimeBaseInitTypeDef:   { fn: TIM_TimeBaseInit }   # ch32v00X_tim.h:431
    # NOT TIM_TimeBaseInit, and not derivable from the struct name either. The dead-time
    # parameter lives in this struct and only TIM_BDTRConfig applies it.
    TIM_BDTRInitTypeDef:       { fn: TIM_BDTRConfig }     # ch32v00X_tim.h:438
    # OPA is a SINGLE-INSTANCE peripheral and `OPA_Init` takes the struct ALONE - there is
    # no handle argument (ch32v00X_opa.h:352). `no_handle` says so explicitly rather than
    # leaving the generator to emit OPA_Init(OPA, &s), which would not compile.
    OPA_InitTypeDef:           { fn: OPA_Init, no_handle: true }

  # The SPL name of each peripheral's register block - the first argument of the functions
  # above. Confirmed in ch32v00X.h: TIM2 444, I2C1 447, ADC1 455, TIM1 456, SPI1 457,
  # USART1 458, DMA1 459, USART2 472, TIM3 474.
  #
  # Note OPA: the block is named `OPA`, not `OPA1` (ch32v00X.h:473), so the tree id and the
  # SDK name differ. It is listed for completeness; OPA_Init does not take it.
  periph_handle:
    USART1: USART1
    USART2: USART2
    SPI1:   SPI1
    I2C1:   I2C1
    TIM1:   TIM1
    TIM2:   TIM2
    TIM3:   TIM3
    ADC1:   ADC1
    DMA1:   DMA1
    OPA1:   OPA

  # Signal name -> SDK macro, for a `sdk_repeat: channels` call. ADC_RegularChannelConfig
  # takes a channel and a rank, so sampling time is set per CHANNEL rather than once per
  # peripheral, and the generator needs the macro for each. ch32v00X_adc.h lines 67-76
  # define ADC_Channel_0..9; this part bonds IN0..IN7, and IN8/IN9 are the internal
  # references, which is why the list stops at 7 and does not simply mirror the header.
  channel_macros:
    ADC1: { IN0: ADC_Channel_0, IN1: ADC_Channel_1, IN2: ADC_Channel_2, IN3: ADC_Channel_3,
            IN4: ADC_Channel_4, IN5: ADC_Channel_5, IN6: ADC_Channel_6, IN7: ADC_Channel_7 }

  # Which signals want GPIO_Mode_AIN rather than AF_PP. Without this the generator has
  # to guess from the peripheral's category, and it cannot tell ADC1_IN4 from
  # ADC1_RETR0 — they share PD3 and only IN4 is analog. The triggers (RETR0/RETR1/
  # IETR0/IETR1) are digital edge inputs and are correctly absent here.
  analog_signals:
    ADC1: [IN0, IN1, IN2, IN3, IN4, IN5, IN6, IN7]
    TKEY: [CH0, CH1, CH2, CH3, CH4, CH5, CH6, CH7]
    OPA1: [P0, P1, P2, P3, N0, N1, N2, OUT0, OUT1]

  # RCC_CFGR0 — RM 3.4.2, offset 0x04, reset 0x00000020.
  rcc:
    register: "RCC->CFGR0"
    sw:     { lsb: 0,  bits: 2, values: { HSI: 0, HSE: 1, PLLCLK: 2 } }   # SW[1:0]
    pllsrc: { lsb: 16, bits: 1, values: { HSI: 0, HSE: 1 } }              # PLLSRC
    # MCO[2:0] — RM 3.4.2. The field is not a dense enum: 0xx all mean "no clock output",
    # so Disable encodes as 0 and the four real sources start at 100b. Keys are the choice
    # names of peripherals.RCC "Master Clock Output (MCO)", so a rename there has to be
    # made here too — validate_mcu.py checks that they still line up.
    mco:
      peripheral: RCC
      setting: Master Clock Output (MCO)
      lsb: 24
      bits: 3
      values: { Disable: 0, SYSCLK: 4, HSI: 5, HSE: 6, PLLCLK: 7 }
    prescalers:
      # HPRE[3:0]. The RM gives two encodings for /2, /4 and /8; these are the ones from
      # the 0000..0111 run, which covers every divider the clock tree offers below 16.
      HB:  { lsb: 4,  bits: 4,
             values: { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 7,
                       16: 11, 32: 12, 64: 13, 128: 14, 256: 15 } }
      # ADCPRE[4:0]. The encoding is not a plain divider index: bits [4:3] pick a base
      # (00 = /2, 01 = /4, 10 = /6, 11 = /8) and bits [2:0] scale it (0-3 = x1, 4 = x2,
      # 5 = x4, 6 = x8, 7 = x16). Several dividers therefore have two legal codes; the
      # values below are one valid code each, checked against the RM's own 21-line list.
      #
      # NOTE for whoever compares this against BOARD 05:43Z: that request proposed
      # 6 -> 8. Code 8 is 01000, which is base /4 x1 = /4, so it would have run the ADC
      # at 1.5x the requested clock. /6 is 10000 = 16. Every other value in the request
      # checked out.
      #
      # /1 is deliberately absent. There is no ADCPRE code for it: undivided HB clock is
      # ADC_CLK_MODE, bit 31 of this same register, a separate field. Mapping /1 onto
      # the /2 code would silently halve the ADC clock, so the generator is left to
      # report "no encoding for 1" until it can write bit 31 too. See BOARD.
      ADC: { lsb: 11, bits: 5,
             values: { 2: 0, 4: 4, 6: 16, 8: 12, 12: 20, 16: 28,
                       24: 21, 32: 29, 48: 22, 64: 30, 96: 23, 128: 31 } }

  # RCC_CTLR — RM 3.4.1, offset 0x00, reset 0x0050XX83. The oscillator ENABLES live here,
  # not in CFGR0, so selecting HSE takes two registers: SW/PLLSRC in CFGR0 and HSEON here.
  # `hse_choices` is keyed by the choice names of peripherals.RCC "High Speed Clock (HSE)".
  # Write order matters: RM 3.4.1 bit 18 says HSEBYP may only be written while HSEON is 0,
  # so a generator clears HSEON, writes HSEBYP, then sets HSEON and polls HSERDY.
  ctlr:
    register: "RCC->CTLR"
    fields:
      HSION:  { lsb: 0,  bits: 1 }
      HSIRDY: { lsb: 1,  bits: 1, access: ro }
      HSEON:  { lsb: 16, bits: 1 }
      HSERDY: { lsb: 17, bits: 1, access: ro }
      HSEBYP: { lsb: 18, bits: 1 }
      CSSON:  { lsb: 19, bits: 1 }
      PLLON:  { lsb: 24, bits: 1 }
      PLLRDY: { lsb: 25, bits: 1, access: ro }
    hse_choices:
      Disable:                     { HSEON: 0, HSEBYP: 0 }
      BYPASS clock source:         { HSEON: 1, HSEBYP: 1 }
      Crystal / ceramic resonator: { HSEON: 1, HSEBYP: 0 }
    # PLLON is not a user setting: it follows from the clock tree. Set it whenever PLLCLK
    # feeds SYSCLK or the MCO, and poll PLLRDY before switching SW to 10b.
    pll_follows_tree: true

  # Not consumed by the generator yet — data first, so it is ready when it is.
  # Which enable register each peripheral's clock bit lives in (RM 3.4.6 / 3.4.7 / 3.4.8).
  # This is NOT a frequency split: there is only one prescaler (HPRE), so HB, PB1 and PB2
  # all run at HCLK. It is purely about which RCC_*PCENR register to write.
  periph_clock:
    HB:  { register: RCC_HBPCENR,  fn: RCC_HBPeriphClockCmd,  prefix: RCC_HBPeriph_,
           bits: { DMA1: 0, SRAM: 2 } }
    PB2: { register: RCC_PB2PCENR, fn: RCC_PB2PeriphClockCmd, prefix: RCC_PB2Periph_,
           bits: { AFIO: 0, GPIOA: 2, GPIOB: 3, GPIOC: 4, GPIOD: 5, ADC1: 9,
                   TIM1: 11, SPI1: 12, USART2: 13, USART1: 14 } }
    PB1: { register: RCC_PB1PCENR, fn: RCC_PB1PeriphClockCmd, prefix: RCC_PB1Periph_,
           bits: { TIM2: 0, TIM3: 2, WWDG: 11, I2C1: 21, PWR: 28 } }
    notes: >
      TKEY and OPA have no enable bit of their own in RM 3.4.6-3.4.8. TouchKey shares the
      ADC block and OPA is documented as always-on analog, but neither is stated outright,
      so neither is listed rather than guessed at.

# -----------------------------------------------------------------------------
# Clock tree — DS 1.3 Figure 1-3, RM 3 (RCC_CFGR0 HPRE / ADCPRE / MCO / PLLSRC)
clock:
  sources:
    HSI: { mhz: 24, fixed: true }
    # DS Table 3-9 (from an external high-speed clock) and Table 3-10 (crystal / ceramic
    # resonator) both give 3 / 24 / 32 MHz as min / typ / max, so the ceiling is 32.
    # This said 25 before round 2 and that number is in neither table: 25 MHz appears
    # only in Table 3-10 note 1, an ESR recommendation for a 25 MHz crystal, not a limit.
    # Nothing is loosened by the fix - sysclk.max_mhz still reddens HSE x2 above 24.
    HSE: { mhz: 24, min_mhz: 3, max_mhz: 32 }
    LSI: { khz: 128, fixed: true }
  pll:
    inputs:
      - { name: HSI, source: HSI, div: 1 }
      - { name: HSE, source: HSE, div: 1 }
    multipliers: [2]
  sysclk:
    sources: [HSI, HSE, PLLCLK]
    max_mhz: 48

  # Picking HSE anywhere in the clock tree must switch the RCC crystal on and let it claim
  # its pins, the way CubeMX does (round-2 P0). These three keys name the setting that
  # represents "HSE is wired up" and the signals its crystal choice claims, so the engine
  # never hardcodes XI/XO - the dummy part calls the same two pins OSC_IN/OSC_OUT.
  # The engine must never do the reverse: switching SYSCLK away from HSE leaves RCC alone.
  hse_peripheral: RCC                    # -> peripherals.RCC
  hse_setting: High Speed Clock (HSE)    # -> that peripheral's settings[] entry, by name
  hse_signals: [XI, XO]                  # the crystal choice claims both; BYPASS claims XI only

  prescalers:
    HB:  { options: [1, 2, 3, 4, 5, 6, 7, 8, 16, 32, 64, 128, 256], max_mhz: 48, label: HB prescaler (HPRE) → HCLK }
    ADC: { options: [1, 2, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128], source: HB, min_mhz: 16, max_mhz: 48,
           label: "ADC prescaler (ADCPRE; /1 = ADC_CLK_MODE)" }
  derived:                          # informational taps off HCLK
    - { name: Flash time base, source: HB, div: 3 }
    - { name: Core SysTick, source: HB, div: 8 }
  buses:
    HB: [TIM1, TIM2, TIM3, GPIO, AFIO, USART1, USART2, I2C1, SPI1, ADC1, TKEY, DMA1, WWDG, OPA1, PWR]
  notes: >
    One frequency domain: HPRE is the only bus prescaler, so every peripheral runs at
    HCLK and `buses.HB` lists them all. That is a statement about frequency only — the
    part does have three separate clock ENABLE registers (RCC_HBPCENR, RCC_PB2PCENR,
    RCC_PB1PCENR, RM 3.4.6-3.4.8), and which one a peripheral sits in is in
    `codegen.periph_clock`. An earlier version of this note said "no APB1/APB2 split",
    which read as though PB1 and PB2 did not exist at all; they do.
    IWDG runs from LSI. MCO on PC4 can output SYSCLK, HSI, HSE or PLLCLK.
