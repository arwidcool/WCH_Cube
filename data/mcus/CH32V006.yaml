          - { name: Odd   , value: 3, sdk: USART_Parity_Odd }
        help: "USART_CTLR1 PCE (bit 10) and PS (bit 9): None = PCE 0; Even = PCE 1, PS 0; Odd = PCE 1, PS 1."
      - key: stop
