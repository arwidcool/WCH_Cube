    # RM Table 7-10, USART1_RM[3:0]
    remaps:
      - { name: "0000 Default", pins: { TX: PD5, RX: PD6, CTS: PD3, RTS: PC2 } }
      - { name: "0001",         pins: { TX: PD6, RX: PD5, CTS: PC6, RTS: PC7 } }
      - { name: "0010",         pins: { TX: PD0, RX: PD1, CTS: PC3, RTS: PC2 } }
      - { name: "0011",         pins: { TX: PC0, RX: PC1, CTS: PC6, RTS: PC7 } }
      - { name: "0100",         pins: { TX: PD1, RX: PB3, CTS: PD7, RTS: PA5 } }
      - { name: "0101",         pins: { TX: PB3, RX: PD1, CTS: PD7, RTS: PA5 } }
      - { name: "0110",         pins: { TX: PC5, RX: PC6, CTS: PC7, RTS: PB4 } }
      - { name: "0111",         pins: { TX: PB5, RX: PB6, CTS: PC7, RTS: PB4 } }
      - { name: "1000",         pins: { TX: PA0, RX: PA1, CTS: PD2, RTS: PD3 } }
      - { name: "1001",         pins: { TX: PA0, RX: PC4, CTS: PD5, RTS: PD4 } }

    # Parameters - RM 15 (USART). Schema: app/assets/params.stub.yaml.
    # `flow` is deliberately NOT a parameter: hardware flow control decides whether CTS
    # and RTS claim pins, so it is a `settings` entry above. A parameter must never move
    # a pin - that separation is what lets the conflict engine ignore this block.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 3000000
        unit: Bd
        help: "Ceiling is fCK/16, so 3 MBd at the 48 MHz maximum and 1.5 MBd at the 24 MHz reset clock. USART_BRR."
      - key: word
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: 8 bits
        options:
          - { name: 8 bits, value: 0, sdk: USART_WordLength_8b }
          - { name: 9 bits, value: 1, sdk: USART_WordLength_9b }
        help: "USART_CTLR1 M, bit 12. With parity enabled the parity bit takes the last data bit, so 8 data bits plus parity needs a 9-bit word."
      - key: parity
