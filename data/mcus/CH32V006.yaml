# =============================================================================
#  CH32V006 — extracted from CH32V006 Datasheet V2.0 (DS) and CH32V00X
#  Reference Manual V1.4 (RM).  Sources are noted next to each block.
#
#  Package pin numbers: DS Table 2-1-1.  Pin 0 = exposed pad (QFN).
#  A pin number may list several names (e.g. [PD7, PA4]) — those GPIOs are
#  shorted together inside the package (DS notes 3 and 4). The app treats them
#  as ONE physical pin: a signal on either name claims the pin.
#  Remap tables: RM 7.2.11 (Tables 7-8, 7-9-1, 7-10, 7-11, 7-12, 7-13-1, 7-14, 7-15).
#  Remap index in each list == value of the AFIO_PCFR1 field (0 = default).
# =============================================================================

mcu:
  name: CH32V006
  vendor: WCH
  family: CH32V00x
  core: QingKe RISC-V2A (RV32EmC)
  flash_kb: 62
  sram_kb: 8
  vdd_v: [2.0, 5.5]
  max_sysclk_mhz: 48
  default_package: TSSOP20
  # DS model table (CH32V006DS0 §1, the "General Description" model list).
  # io_count is the datasheet's own I/O column. `tools/validate_mcu.py` counts the io
  # pins in each package table and fails if the two disagree, which is what catches a
  # dropped or duplicated row in `packages:` below. A pair of internally shorted GPIOs
  # (DS notes 3 and 4) is one physical pin and counts once.
  variants:
    CH32V006K8U7: { package: QFN32,   flash_kb: 62, sram_kb: 8, temp: 105, io_count: 31 }
    CH32V006E8R6: { package: QSOP24,  flash_kb: 62, sram_kb: 8, temp: 85,  io_count: 22 }
    CH32V006E8R7: { package: QSOP24,  flash_kb: 62, sram_kb: 8, temp: 105, io_count: 22 }
    CH32V006F8U7: { package: QFN20,   flash_kb: 62, sram_kb: 8, temp: 105, io_count: 18 }
    CH32V006F4U6: { package: QFN20,   flash_kb: 16, sram_kb: 4, temp: 85,  io_count: 18, notes: "no OPA, no TouchKey; DS Table 2-1-2 is its own pin table" }
    CH32V006F8P7: { package: TSSOP20, flash_kb: 62, sram_kb: 8, temp: 105, io_count: 18 }
    CH32V006D8U7: { package: QFN12,   flash_kb: 62, sram_kb: 8, temp: 105, io_count: 11, notes: "ADC 4+2 channels and TouchKey 4-channel only — the other inputs have no pin" }

# -----------------------------------------------------------------------------
packages:
  QFN32:                          # CH32V006K8U7 — DS note 5: PA7 is the reset pin
    0: VSS                        # exposed pad
    1: PB3
    2: PA5
    3: PA6
    4: PA7
    5: PA0
    6: PA1
    7: PA2
    8: PD0
    9: PA3
    10: PB0
    11: PB1
    12: PB2
    13: PC0
    14: PC1
    15: PC2
    16: PC3
    17: VDD
    18: PC4
    19: PC5
    20: PC6
    21: PC7
    22: PB4
    23: PD1
    24: PD2
    25: PD3
    26: PD4
    27: PD5
    28: PD6
    29: PB5
    30: PB6
    31: PD7
    32: PA4

  QSOP24:                         # CH32V006E8R6/R7 — DS note 5: PC5 is the reset pin
    1: PD1
    2: PC0
    3: PC1
    4: PC2
    5: VSS
    6: VDD
    7: PC5
    8: PC4
    9: PD2
    10: PD3
    11: PD4
    12: PD5
    13: PD6
    14: PD7
    15: PA4
    16: PA5
    17: [PA1, PA6]                # DS note 3: shorted internally, never both outputs
    18: PA0
    19: PA2
    20: PD0
    21: PA3
    22: PB0
    23: PB1
    24: PB3

  QFN20:                          # CH32V006F8U7 / F4U6 — reset pin PD7
    0: VSS
    1: [PD7, PA4]                 # DS note 4: shorted internally
    2: PA1
    3: PA2
    4: VSS
    5: PD0
    6: VDD
    7: PC0
    8: PC1
    9: PC2
    10: PC3
    11: PC4
    12: PC5
    13: PC6
    14: PC7
    15: PD1
    16: PD2
    17: PD3
    18: PD4
    19: PD5
    20: PD6

  TSSOP20:                        # CH32V006F8P7 — reset pin PD7
    1: PD4
    2: PD5
    3: PD6
    4: [PD7, PA4]                 # DS note 4: shorted internally
    5: PA1
    6: PA2
    7: VSS
    8: PD0
    9: VDD
    10: PC0
    11: PC1
    12: PC2
    13: PC3
    14: PC4
    15: PC5
    16: PC6
    17: PC7
    18: PD1
    19: PD2
    20: PD3

  QFN12:                          # CH32V006D8U7 — reset pin PD7
    0: VSS
    1: PA1
    2: PA2
    3: PD0
    4: VDD
    5: PC0
    6: PC3
    7: PC4
    8: PC6
    9: PC7
    10: PD1
    11: PD4
    12: [PD7, PA4]                # DS note 4: shorted internally

# -----------------------------------------------------------------------------
# DS Table 2-1-1 — pin type and "main function after reset"
pins:
  VDD:  { type: power }
  VSS:  { type: ground }
  PA0:  { type: io }
  PA1:  { type: io, analog: true, notes: XI when HSE used (AFIO PA12_RM) }
  PA2:  { type: io, analog: true, notes: XO when HSE used (AFIO PA12_RM) }
  PA3:  { type: io }
  PA4:  { type: io, analog: true }
  PA5:  { type: io, analog: true }
  PA6:  { type: io }
  PA7:  { type: io, notes: RST after reset on QFN32 }
  PB0:  { type: io }
  PB1:  { type: io }
  PB2:  { type: io }
  PB3:  { type: io, notes: SWCLK in 2-wire debug mode }
  PB4:  { type: io }
  PB5:  { type: io }
  PB6:  { type: io }
  PC0:  { type: io }
  PC1:  { type: io }
  PC2:  { type: io, analog: true }
  PC3:  { type: io }
  PC4:  { type: io, analog: true }
  PC5:  { type: io, notes: RST after reset on QSOP24 }
  PC6:  { type: io }
  PC7:  { type: io }
  PD0:  { type: io, analog: true }
  PD1:  { type: io, analog: true, notes: SWIO after reset — debug interface is ON by default }
  PD2:  { type: io, analog: true }
  PD3:  { type: io, analog: true }
  PD4:  { type: io, analog: true }
  PD5:  { type: io, analog: true }
  PD6:  { type: io, analog: true }
  PD7:  { type: io, analog: true, notes: RST after reset on QFN12/QFN20/TSSOP20 }

# -----------------------------------------------------------------------------
peripherals:

  # ---------------- System Core ----------------
  SYS:
    category: System Core
    settings:
      - name: Debug (SDI)
        choices:
          - { name: No Debug }
          - { name: 1-wire SDI (SWIO), signals: [SWIO], default: true }     # DS 1.4.18 — default after reset
          - { name: 2-wire SDI (SWIO + SWCLK), signals: [SWIO, SWCLK] }
      # Option byte USER[4:3] = RST_MODE, RM Table 18-4 (ch.18).
      # Reset value on CH32V006 is 10b, so the external reset pin is ACTIVE on a blank
      # part and the pin is not yours until you reprogram the option byte. The three
      # enabled values differ only in how long the pin is ignored after the alternate
      # function turns on, which is a glitch filter, not a different pin.
      # RM 18 writes this value as "PD7 for I/O function"; the pin is actually the
      # package's reset pin — PA7 on QFN32 and PC5 on QSOP24 (DS note 5, see `remaps`).
      #
      # `validate_mcu.py` warns that choices[0] here carries a signal, because the engine
      # reads choices[0] as a peripheral's "off" state. That is deliberate and must stay:
      # the factory option byte is RST_MODE=10, so a blank part really does hold the reset
      # pin, and the pin is not available until the option byte is reprogrammed. Reordering
      # these to silence the warning would tell the user the pin is free when it is not.
      - name: External reset pin
        choices:
          - { name: "RST enabled — ignore 12 ms (RST_MODE=10, factory default)", signals: [RST], default: true }
          - { name: "RST enabled — ignore 1 ms (RST_MODE=01)", signals: [RST] }
          - { name: "RST enabled — ignore 128 us (RST_MODE=00)", signals: [RST] }
          - { name: "RST disabled — pin is GPIO (RST_MODE=11)" }
    # RST location depends on package (DS note 5); the app picks the remap per package.
    remaps:
      - name: RST on PD7 (QFN12 / QFN20 / TSSOP20)
        pins: { SWIO: PD1, SWCLK: PB3, RST: PD7 }
      - name: RST on PC5 (QSOP24)
        pins: { SWIO: PD1, SWCLK: PB3, RST: PC5 }
      - name: RST on PA7 (QFN32)
        pins: { SWIO: PD1, SWCLK: PB3, RST: PA7 }
    remap_by_package: { QFN12: 0, QFN20: 0, TSSOP20: 0, QSOP24: 1, QFN32: 2 }

  RCC:
    category: System Core
    settings:
      - name: High Speed Clock (HSE)
        choices:
          - { name: Disable }
          - { name: BYPASS clock source, signals: [XI] }
          - { name: Crystal / ceramic resonator, signals: [XI, XO] }
      - name: Master Clock Output (MCO)
        choices:
          - { name: Disable }
          - { name: SYSCLK, signals: [MCO] }
          - { name: HSI, signals: [MCO] }
          - { name: HSE, signals: [MCO] }
          - { name: PLLCLK, signals: [MCO] }
    remaps:
      - name: Default
        pins: { XI: PA1, XO: PA2, MCO: PC4 }     # DS pin table; AFIO PA12_RM selects XI/XO on PA1/PA2

  DMA1:
    category: System Core
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated (7 channels) } ]

  IWDG:
    category: System Core
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]

  WWDG:
    category: System Core
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]

  # ---------------- Analog ----------------
  ADC1:
    category: Analog
    settings:
      - name: Channels
        type: checkboxes
        choices:
          - { name: IN0, signals: [IN0] }
          - { name: IN1, signals: [IN1] }
          - { name: IN2, signals: [IN2] }
          - { name: IN3, signals: [IN3] }
          - { name: IN4, signals: [IN4] }
          - { name: IN5, signals: [IN5] }
          - { name: IN6, signals: [IN6] }
          - { name: IN7, signals: [IN7] }
          - { name: "IN8 (Vrefint, internal)" }
          - { name: "IN9 (OPA output, internal)" }
      - name: Regular group external trigger      # RM Table 7-15, ADC_ETRGREG_RM
        choices:
          - { name: Disable }
          - { name: External pin PD3 (ETRGREG_RM=0), signals: [RETR0] }
          - { name: External pin PC2 (ETRGREG_RM=1), signals: [RETR1] }
      - name: Injected group external trigger     # RM Table 7-14, ADC_ETRGINJ_RM
        choices:
          - { name: Disable }
          - { name: External pin PD1 (ETRGINJ_RM=0), signals: [IETR0] }
          - { name: External pin PA2 (ETRGINJ_RM=1), signals: [IETR1] }
    remaps:
      - name: Default
        pins: { IN0: PA2, IN1: PA1, IN2: PC4, IN3: PD2, IN4: PD3, IN5: PD5, IN6: PD6, IN7: PD4,
                RETR0: PD3, RETR1: PC2, IETR0: PD1, IETR1: PA2 }
    # Parameters - RM 9.3 (ADC_CTLR1 / CTLR2 / CTLR3, ADC_SAMPTRx).
    params:
      - { name: Resolution, type: int, default: 12, unit: bits, group: Basic, readonly: true,
          register: "ADC_RDATAR DATA[11:0]",
          notes: "Fixed in silicon, shown so it is not guessed at. RM 9.2 says 12-bit twice; the
                  CH32V006 DS heading 3.3.14 still reads '10-bit ADC Characteristics', which is a
                  stale heading - its own body text and every other mention say 12-bit." }
      - name: Sampling Time
        type: enum
        default: 11.5 cycles
        group: Basic
        register: "ADC_SAMPTR1/2 SMPx[2:0]"
        notes: "Cycle counts are for normal mode. In LOW-POWER mode codes 010/011/100 mean
                13.5/28.5/41.5 cycles instead (RM 9.3.4). Total conversion = sampling + 12.5 cycles."
        options:
          - { name: 3.5 cycles,   value: 0 }
          - { name: 7.5 cycles,   value: 1 }
          - { name: 11.5 cycles,  value: 2 }
          - { name: 19.5 cycles,  value: 3 }
          - { name: 35.5 cycles,  value: 4 }
          - { name: 55.5 cycles,  value: 5 }
          - { name: 71.5 cycles,  value: 6 }
          - { name: 239.5 cycles, value: 7 }
      - { name: Low Power Mode, type: bool, default: false, group: Advanced,
          register: "ADC_CTLR3 ADC_LP (bit 0)",
          notes: Changes what three of the Sampling Time codes mean - see that row }
      - { name: Continuous Conversion, type: bool, default: false, group: Basic,
          register: "ADC_CTLR2 CONT (bit 1)" }
      - { name: Scan Conversion, type: bool, default: false, group: Basic,
          register: "ADC_CTLR1 SCAN (bit 8)" }
      - name: Data Alignment
        type: enum
        default: Right
        group: Advanced
        register: "ADC_CTLR2 ALIGN (bit 11)"
        options:
          - { name: Right, value: 0 }
          - { name: Left,  value: 1 }


  TKEY:
    category: Analog
    notes: Touchkey channels reuse the ADC input pins (DS 1.4.11). Not on CH32V005.
    settings:
      - name: Channels
        type: checkboxes
        choices:
          - { name: CH0, signals: [CH0] }
          - { name: CH1, signals: [CH1] }
          - { name: CH2, signals: [CH2] }
          - { name: CH3, signals: [CH3] }
          - { name: CH4, signals: [CH4] }
          - { name: CH5, signals: [CH5] }
          - { name: CH6, signals: [CH6] }
          - { name: CH7, signals: [CH7] }
    remaps:
      - name: Default
        pins: { CH0: PA2, CH1: PA1, CH2: PC4, CH3: PD2, CH4: PD3, CH5: PD5, CH6: PD6, CH7: PD4 }

  OPA1:
    category: Analog
    notes: OPA/PGA/CMP. Pin assignment from DS pin table (OPA_P0..P3, OPA_N0..N2, OPA_OUT0/1); selection via OPA_CTLR1 PSEL/NSEL/MODE.
    settings:
      - name: Positive input (PSEL)
        choices:
          - { name: Disable }
          - { name: P0 — PA2, signals: [P0] }
          - { name: P1 — PD7, signals: [P1] }
          - { name: P2 — PD3, signals: [P2] }
          - { name: P3 — PD1, signals: [P3] }
          - { name: Polling P0/P1/P2, signals: [P0, P1, P2] }
          - { name: Polling P0/P1/P2/P3, signals: [P0, P1, P2, P3] }
      - name: Negative input (NSEL)
        choices:
          - { name: Disable }
          - { name: N0 — PA1, signals: [N0] }
          - { name: N1 — PD0, signals: [N1] }
          - { name: N2 — PA4, signals: [N2] }
          - { name: PGA internal feedback (no pin) }
      - name: Output
        choices:
          - { name: Disable }
          - { name: OUT0 — PD4, signals: [OUT0] }
          - { name: OUT1 — PA5, signals: [OUT1] }
          - { name: Internal to ADC IN9 only }
    remaps:
      - name: Default
        pins: { P0: PA2, P1: PD7, P2: PD3, P3: PD1, N0: PA1, N1: PD0, N2: PA4, OUT0: PD4, OUT1: PA5 }

  # ---------------- Timers ----------------
  TIM1:
    category: Timers
    notes: Advanced timer, 4 channels + 3 complementary outputs + break input (RM ch.11).
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH1] }
          - { name: PWM Generation CH1, signals: [CH1] }
          - { name: PWM Generation CH1 CH1N, signals: [CH1, CH1N] }
          - { name: PWM Generation CH1N only, signals: [CH1N] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
          - { name: PWM Generation CH2 CH2N, signals: [CH2, CH2N] }
          - { name: PWM Generation CH2N only, signals: [CH2N] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
          - { name: PWM Generation CH3 CH3N, signals: [CH3, CH3N] }
          - { name: PWM Generation CH3N only, signals: [CH3N] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR (external), signals: [ETR] }
      - name: Break Input
        choices:
          - { name: Disable }
          - { name: Activate break input, signals: [BKIN] }
      # RM Table 7-8 note + RM 7.3.2.2 AFIO_PCFR1[13:10]: TIM1_RM = 11xx routes the
      # channel-1 INPUT to the internal LSI instead of a pin, for LSI calibration.
      # It is a value of the same TIM1_RM field, but it claims no pin, so it is a
      # setting here rather than an 11th entry in `remaps` (index == register value).
      - name: Channel 1 input source
        choices:
          - { name: "CH1 pin (TIM1_RM = 0000..1001)" }
          - { name: "Internal LSI for calibration (TIM1_RM = 11xx — frees the CH1 pin)" }
    # RM Table 7-8, TIM1_RM[3:0] — index == register value
    remaps:
      - { name: "0000 Default",  pins: { ETR: PC5, CH1: PD2, CH2: PA1, CH3: PC3, CH4: PC4, BKIN: PC2, CH1N: PD0, CH2N: PA2, CH3N: PD1 } }
      - { name: "0001 Partial",  pins: { ETR: PD4, CH1: PD2, CH2: PA1, CH3: PC3, CH4: PC4, BKIN: PC2, CH1N: PD0, CH2N: PA2, CH3N: PD1 } }
      - { name: "0010 Partial",  pins: { ETR: PC5, CH1: PC6, CH2: PC7, CH3: PC0, CH4: PD3, BKIN: PC1, CH1N: PC3, CH2N: PC4, CH3N: PD1 } }
      - { name: "0011 Full",     pins: { ETR: PC2, CH1: PC4, CH2: PC7, CH3: PC5, CH4: PD4, BKIN: PC1, CH1N: PC3, CH2N: PD2, CH3N: PC6 } }
      - { name: "0100 Partial",  pins: { ETR: PD4, CH1: PA3, CH2: PB0, CH3: PB1, CH4: PD1, BKIN: PB3, CH1N: PA0, CH2N: PA2, CH3N: PD0 } }
      - { name: "0101 Partial",  pins: { ETR: PD4, CH1: PA3, CH2: PB0, CH3: PC3, CH4: PD1, BKIN: PB3, CH1N: PA0, CH2N: PA2, CH3N: PD0 } }
      - { name: "0110 Partial",  pins: { ETR: PD4, CH1: PA3, CH2: PB0, CH3: PB1, CH4: PB2, BKIN: PA7, CH1N: PA0, CH2N: PA2, CH3N: PD0 } }
      - { name: "0111 Full",     pins: { ETR: PB4, CH1: PC4, CH2: PC5, CH3: PC6, CH4: PC7, BKIN: PB2, CH1N: PC0, CH2N: PC1, CH3N: PC2 } }
      - { name: "1000 Full",     pins: { ETR: PB4, CH1: PC4, CH2: PC5, CH3: PC6, CH4: PC7, BKIN: PB2, CH1N: PA3, CH2N: PB0, CH3N: PB1 } }
      - { name: "1001 Partial",  pins: { ETR: PB4, CH1: PA0, CH2: PA1, CH3: PA2, CH4: PA3, BKIN: PB2, CH1N: PC0, CH2N: PC1, CH3N: PC2 } }
    # Parameters - RM timer chapter; the control bits are all in TIM1_CTLR1.
    params:
      - { name: Prescaler, type: int, default: 0, min: 0, max: 65535, group: Basic,
          register: TIM1_PSC, notes: "Counter clock = HCLK / (Prescaler + 1)" }
      - { name: Counter Period, type: int, default: 65535, min: 0, max: 65535, group: Basic,
          register: TIM1_ATRLR, notes: "Auto-reload; one period is (Counter Period + 1) counter ticks" }
      - name: Counter Mode
        type: enum
        default: Up
        group: Basic
        register: "TIM1_CTLR1 DIR (bit 4), CMS[6:5]"
        options:
          - { name: Up,               value: 0 }
          - { name: Down,             value: 1 }
          - { name: Center-aligned 1, value: 2 }
          - { name: Center-aligned 2, value: 3 }
          - { name: Center-aligned 3, value: 4 }
      - name: Internal Clock Division
        type: enum
        default: "1"
        group: Advanced
        register: "TIM1_CTLR1 CKD[9:8]"
        notes: Divides the clock feeding the digital filters and the dead-time generator, not the counter
        options:
          - { name: "1", value: 0 }
          - { name: "2", value: 1 }
          - { name: "4", value: 2 }
      - { name: Auto-Reload Preload, type: bool, default: false, group: Advanced,
          register: "TIM1_CTLR1 ARPE (bit 7)" }
      - { name: Repetition Counter, type: int, default: 0, min: 0, max: 255, group: Advanced,
          register: TIM1_RPTCR,
          notes: "Update event every (Repetition Counter + 1) cycles - advanced timer only" }
      - { name: Dead Time, type: int, default: 0, min: 0, max: 255, group: Advanced,
          register: "TIM1_BDTR DTG[7:0]",
          notes: Inserted between a channel and its complementary output }


  TIM2:
    category: Timers
    # RM 12.3.9: TIM2 can output 2 complementary pairs with dead-time, and when it does,
    # "channels 3 and 4 act as channel 1 and channel 2 complementary output channels".
    # So CH1N lives on the CH3 pin and CH2N on the CH4 pin — there are no extra pins, which
    # is why `remaps` below has only 4 signals. Selecting a complementary output and a plain
    # CH3/CH4 output at the same time is a genuine conflict and the engine will flag it.
    notes: Channels 3 and 4 double as CH1N and CH2N when complementary output is enabled (RM 12.3.9).
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH1_ETR] }
          - { name: PWM Generation CH1, signals: [CH1_ETR] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR (shares the CH1 pin), signals: [CH1_ETR] }
      - name: Encoder Mode
        choices:
          - { name: Disable }
          - { name: Encoder CH1/CH2, signals: [CH1_ETR, CH2] }
      - name: Complementary Outputs        # RM 12.3.9 — CH1N/CH2N reuse the CH3/CH4 pins
        choices:
          - { name: Disable }
          - { name: CH1N on the CH3 pin, signals: [CH3] }
          - { name: CH2N on the CH4 pin, signals: [CH4] }
          - { name: CH1N + CH2N on the CH3/CH4 pins, signals: [CH3, CH4] }
    # RM Table 7-9-1 (CH32V002/004/005/006), TIM2_RM[2:0]
    remaps:
      - { name: "000 Default", pins: { CH1_ETR: PD4, CH2: PD3, CH3: PC0, CH4: PD7 } }
      - { name: "001 Partial", pins: { CH1_ETR: PC1, CH2: PD3, CH3: PC0, CH4: PD7 } }
      - { name: "010 Full",    pins: { CH1_ETR: PC5, CH2: PC2, CH3: PD2, CH4: PC1 } }
      - { name: "011 Full",    pins: { CH1_ETR: PC1, CH2: PC7, CH3: PD6, CH4: PD5 } }
      - { name: "100 Full",    pins: { CH1_ETR: PC0, CH2: PC1, CH3: PC3, CH4: PB6 } }
      - { name: "101 Full",    pins: { CH1_ETR: PA0, CH2: PA1, CH3: PA2, CH4: PA3 } }
      - { name: "110 Full",    pins: { CH1_ETR: PB1, CH2: PA1, CH3: PA2, CH4: PA3 } }
      - { name: "111 Full",    pins: { CH1_ETR: PD3, CH2: PD4, CH3: PA2, CH4: PA3 } }
    # Parameters - RM timer chapter; the control bits are all in TIM2_CTLR1.
    params:
      - { name: Prescaler, type: int, default: 0, min: 0, max: 65535, group: Basic,
          register: TIM2_PSC, notes: "Counter clock = HCLK / (Prescaler + 1)" }
      - { name: Counter Period, type: int, default: 65535, min: 0, max: 65535, group: Basic,
          register: TIM2_ATRLR, notes: "Auto-reload; one period is (Counter Period + 1) counter ticks" }
      - name: Counter Mode
        type: enum
        default: Up
        group: Basic
        register: "TIM2_CTLR1 DIR (bit 4), CMS[6:5]"
        options:
          - { name: Up,               value: 0 }
          - { name: Down,             value: 1 }
          - { name: Center-aligned 1, value: 2 }
          - { name: Center-aligned 2, value: 3 }
          - { name: Center-aligned 3, value: 4 }
      - name: Internal Clock Division
        type: enum
        default: "1"
        group: Advanced
        register: "TIM2_CTLR1 CKD[9:8]"
        notes: Divides the clock feeding the digital filters and the dead-time generator, not the counter
        options:
          - { name: "1", value: 0 }
          - { name: "2", value: 1 }
          - { name: "4", value: 2 }
      - { name: Auto-Reload Preload, type: bool, default: false, group: Advanced,
          register: "TIM2_CTLR1 ARPE (bit 7)" }


  TIM3:
    category: Timers
    notes: Streamlined timer — output compare only, no external pins (RM ch.13). Not on CH32V005.
    settings:
      - name: Mode
        choices: [ { name: Disable }, { name: Activated } ]

  # ---------------- Connectivity ----------------
  USART1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
          - { name: Transmit only, signals: [TX] }
          - { name: Receive only, signals: [RX] }
          - { name: LIN, signals: [TX, RX] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS only, signals: [CTS] }
          - { name: RTS only, signals: [RTS] }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM Table 7-10, USART1_RM[3:0]
    remaps:
      - { name: "0000 Default", pins: { TX: PD5, RX: PD6, CTS: PD3, RTS: PC2 } }
      - { name: "0001",         pins: { TX: PD6, RX: PD5, CTS: PC6, RTS: PC7 } }
      - { name: "0010",         pins: { TX: PD0, RX: PD1, CTS: PC3, RTS: PC2 } }
      - { name: "0011",         pins: { TX: PC0, RX: PC1, CTS: PC6, RTS: PC7 } }
      - { name: "0100",         pins: { TX: PD1, RX: PB3, CTS: PD7, RTS: PA5 } }
      - { name: "0101",         pins: { TX: PB3, RX: PD1, CTS: PD7, RTS: PA5 } }
      - { name: "0110",         pins: { TX: PC5, RX: PC6, CTS: PC7, RTS: PB4 } }
      - { name: "0111",         pins: { TX: PB5, RX: PB6, CTS: PC7, RTS: PB4 } }
      - { name: "1000",         pins: { TX: PA0, RX: PA1, CTS: PD2, RTS: PD3 } }
      - { name: "1001",         pins: { TX: PA0, RX: PC4, CTS: PD5, RTS: PD4 } }
    # Parameters - RM USART chapter. Every row cites the register field it drives.
    params:
      - { name: Baud Rate, type: int, default: 115200, min: 300, max: 3000000, unit: bps,
          group: Basic, register: "USART_BRR (12-bit mantissa + 4-bit fraction)",
          notes: "Ceiling is HCLK/16 at the 48 MHz maximum; the achievable rate is quantised by BRR" }
      - name: Word Length
        type: enum
        default: 8 bits
        group: Basic
        register: "USART_CTLR1 M (bit 12)"
        notes: With parity on, the parity bit takes the last data bit, so 8 data bits plus parity needs a 9-bit word
        options:
          - { name: 8 bits, value: 0 }
          - { name: 9 bits, value: 1 }
      - name: Parity
        type: enum
        default: "None"
        group: Basic
        register: "USART_CTLR1 PCE (bit 10), PS (bit 9)"
        options:
          - { name: "None", value: 0 }
          - { name: Even,   value: 2 }
          - { name: Odd,    value: 3 }
      - name: Stop Bits
        type: enum
        default: "1"
        group: Basic
        register: "USART_CTLR2 STOP[13:12]"
        options:
          - { name: "1",   value: 0 }
          - { name: "0.5", value: 1 }
          - { name: "2",   value: 2 }
          - { name: "1.5", value: 3 }


  USART2:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Single Wire (Half-Duplex), signals: [TX] }
          - { name: Transmit only, signals: [TX] }
          - { name: Receive only, signals: [RX] }
          - { name: LIN, signals: [TX, RX] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS only, signals: [CTS] }
          - { name: RTS only, signals: [RTS] }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM Table 7-11, USART2_RM[2:0]
    remaps:
      - { name: "000 Default", pins: { TX: PA7, RX: PB3, CTS: PA4, RTS: PA5 } }
      - { name: "001",         pins: { TX: PA4, RX: PA5, CTS: PA7, RTS: PB3 } }
      - { name: "010",         pins: { TX: PA2, RX: PA3, CTS: PA0, RTS: PA1 } }
      - { name: "011",         pins: { TX: PD2, RX: PD3, CTS: PA0, RTS: PA1 } }
      - { name: "100",         pins: { TX: PB0, RX: PB1, CTS: PB6, RTS: PA1 } }
      - { name: "101",         pins: { TX: PC4, RX: PD1, CTS: PA4, RTS: PA1 } }
      - { name: "110",         pins: { TX: PA6, RX: PA5, CTS: PA7, RTS: PB3 } }
    # Parameters - RM USART chapter. Every row cites the register field it drives.
    params:
      - { name: Baud Rate, type: int, default: 115200, min: 300, max: 3000000, unit: bps,
          group: Basic, register: "USART_BRR (12-bit mantissa + 4-bit fraction)",
          notes: "Ceiling is HCLK/16 at the 48 MHz maximum; the achievable rate is quantised by BRR" }
      - name: Word Length
        type: enum
        default: 8 bits
        group: Basic
        register: "USART_CTLR1 M (bit 12)"
        notes: With parity on, the parity bit takes the last data bit, so 8 data bits plus parity needs a 9-bit word
        options:
          - { name: 8 bits, value: 0 }
          - { name: 9 bits, value: 1 }
      - name: Parity
        type: enum
        default: "None"
        group: Basic
        register: "USART_CTLR1 PCE (bit 10), PS (bit 9)"
        options:
          - { name: "None", value: 0 }
          - { name: Even,   value: 2 }
          - { name: Odd,    value: 3 }
      - name: Stop Bits
        type: enum
        default: "1"
        group: Basic
        register: "USART_CTLR2 STOP[13:12]"
        options:
          - { name: "1",   value: 0 }
          - { name: "0.5", value: 1 }
          - { name: "2",   value: 2 }
          - { name: "1.5", value: 3 }


  SPI1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Full-Duplex Master, signals: [SCK, MISO, MOSI] }
          - { name: Full-Duplex Slave, signals: [SCK, MISO, MOSI] }
          - { name: Half-Duplex Master, signals: [SCK, MOSI] }
          - { name: Half-Duplex Slave, signals: [SCK, MISO] }
          - { name: Receive Only Master, signals: [SCK, MISO] }
          - { name: Receive Only Slave, signals: [SCK, MOSI] }
          - { name: Transmit Only Master, signals: [SCK, MOSI] }
          - { name: Transmit Only Slave, signals: [SCK, MISO] }
      - name: Hardware NSS Signal
        choices:
          - { name: Disable (software NSS) }
          - { name: Hardware NSS Input, signals: [NSS] }
          - { name: Hardware NSS Output, signals: [NSS] }
    # RM Table 7-12, SPI_RM[2:0]
    remaps:
      - { name: "000 Default", pins: { NSS: PC1, SCK: PC5, MISO: PC7, MOSI: PC6 } }
      - { name: "001",         pins: { NSS: PC0, SCK: PC5, MISO: PC7, MOSI: PC6 } }
      - { name: "010",         pins: { NSS: PC4, SCK: PD2, MISO: PB3, MOSI: PD3 } }
      - { name: "011",         pins: { NSS: PB0, SCK: PB1, MISO: PB2, MOSI: PC0 } }
      - { name: "100",         pins: { NSS: PD3, SCK: PD4, MISO: PD5, MOSI: PD6 } }
      - { name: "101",         pins: { NSS: PC1, SCK: PA1, MISO: PB5, MOSI: PA2 } }
      - { name: "110",         pins: { NSS: PC4, SCK: PB5, MISO: PC7, MOSI: PB4 } }
    # Parameters - RM SPI chapter; all of these live in SPI_CTLR1.
    params:
      - name: Baud Rate Prescaler
        type: enum
        default: "/16"
        group: Basic
        register: "SPI_CTLR1 BR[5:3]"
        notes: Divides HCLK directly - this family has one bus frequency, there is no separate peripheral clock
        options:
          - { name: "/2",   value: 0 }
          - { name: "/4",   value: 1 }
          - { name: "/8",   value: 2 }
          - { name: "/16",  value: 3 }
          - { name: "/32",  value: 4 }
          - { name: "/64",  value: 5 }
          - { name: "/128", value: 6 }
          - { name: "/256", value: 7 }
      - name: Clock Polarity (CPOL)
        type: enum
        default: Low
        group: Basic
        register: "SPI_CTLR1 CPOL (bit 1)"
        options:
          - { name: Low,  value: 0 }
          - { name: High, value: 1 }
      - name: Clock Phase (CPHA)
        type: enum
        default: 1 Edge
        group: Basic
        register: "SPI_CTLR1 CPHA (bit 0)"
        options:
          - { name: 1 Edge, value: 0 }
          - { name: 2 Edge, value: 1 }
      - name: Data Size
        type: enum
        default: 8 bits
        group: Basic
        register: "SPI_CTLR1 DFF (bit 11)"
        options:
          - { name: 8 bits,  value: 0 }
          - { name: 16 bits, value: 1 }
      - name: First Bit
        type: enum
        default: MSB First
        group: Basic
        register: "SPI_CTLR1 LSBFIRST (bit 7)"
        options:
          - { name: MSB First, value: 0 }
          - { name: LSB First, value: 1 }
      - { name: CRC Calculation, type: bool, default: false, group: Advanced,
          register: "SPI_CTLR1 CRCEN (bit 13)" }
      - { name: CRC Polynomial, type: int, default: 7, min: 1, max: 65535, group: Advanced,
          register: SPI_CRCR, depends_on: { param: CRC Calculation, equals: true } }


  I2C1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: I2C, signals: [SCL, SDA] }
    # RM Table 7-13-1 (CH32V002/004/005/006), I2C_RM[2:0]
    remaps:
      - { name: "000 Default", pins: { SCL: PC2, SDA: PC1 } }
      - { name: "001",         pins: { SCL: PD1, SDA: PD0 } }
      - { name: "010",         pins: { SCL: PC5, SDA: PC6 } }
      - { name: "011",         pins: { SCL: PB5, SDA: PB6 } }
      - { name: "1xx",         pins: { SCL: PB3, SDA: PD1 } }
    # Parameters - RM I2C chapter.
    params:
      - { name: Clock Speed, type: int, default: 100000, min: 1000, max: 400000, unit: Hz,
          group: Basic, register: "I2C_CKCFGR CCR[11:0] with F/S (bit 15)",
          notes: "Above 100 kHz the peripheral must run in fast mode (F/S = 1)" }
      - name: Fast Mode Duty Cycle
        type: enum
        default: "2:1"
        group: Advanced
        register: "I2C_CKCFGR DUTY (bit 14)"
        notes: Ignored in standard mode
        options:
          - { name: "2:1",  value: 0 }
          - { name: "16:9", value: 1 }
      - name: Addressing Mode
        type: enum
        default: 7-bit
        group: Basic
        register: "I2C_OAR1 ADDMODE (bit 15)"
        options:
          - { name: 7-bit,  value: 0 }
          - { name: 10-bit, value: 1 }
      - { name: Own Address, type: int, default: 0, min: 0, max: 1023, group: Basic,
          register: "I2C_OAR1 ADD[9:0]" }


# -----------------------------------------------------------------------------
# External interrupts — RM 6.4.4 Table 6-2, register AFIO_EXTICR (RM 7.3.2.1).
#
# EXTI is not a peripheral in the `peripherals:` sense: it has eight INDEPENDENT
# 4-way selectors, one per line, whereas a `remaps:` entry switches every signal of a
# peripheral at once. So it lives here as plain data. The app ignores unknown
# top-level keys, so this block is inert until AGENT-2 wires it in.
#
# Line x can only ever reach pin number x — EXTI3 reaches PA3/PB3/PC3/PD3 and nothing
# else. The key is the 2-bit AFIO_EXTICR field value for that line.
exti:
  register: { name: AFIO_EXTICR, address: 0x40010008, bits_per_line: 2, reset: 0x00000000 }
  lines:
    EXTI0: { "00": PA0, "01": PB0, "10": PC0, "11": PD0 }
    EXTI1: { "00": PA1, "01": PB1, "10": PC1, "11": PD1 }
    EXTI2: { "00": PA2, "01": PB2, "10": PC2, "11": PD2 }
    EXTI3: { "00": PA3, "01": PB3, "10": PC3, "11": PD3 }
    EXTI4: { "00": PA4, "01": PB4, "10": PC4, "11": PD4 }
    EXTI5: { "00": PA5, "01": PB5, "10": PC5, "11": PD5 }
    EXTI6: { "00": PA6, "01": PB6, "10": PC6, "11": PD6 }
    EXTI7: { "00": PA7,             "10": PC7, "11": PD7 }   # no PB7 on CH32V00x — 01 selects nothing
  internal:                       # RM Table 6-2 — no pin, cannot conflict
    EXTI8: { event: PVD — supply crossed the voltage-monitoring threshold }
    EXTI9: { event: Automatic wake-up }
  interrupt: EXTI7_0 — one vector for lines 0-7 (RM Table 6-1, vector 20)

# -----------------------------------------------------------------------------
# DMA — RM 8.2 Table 8-2 and Figure 8-1. Seven channels; a channel serves several
# peripherals, so two peripherals on the same channel is a conflict the app can warn
# about. No pins are involved, so this never affects the pinout.
#
# Confidence: HIGH. Table 8-2 and Figure 8-1 are two separate renderings of the same
# map in the source and they agree on every entry, which is why this is not marked
# provisional despite Table 8-2 being badly mangled by the PDF-to-markdown conversion.
dma:
  controller: DMA1
  channels: 7
  requests:
    1: [ADC1, TIM2_CH3, TIM3_CH3]
    2: [SPI1_RX, TIM1_CH1, TIM2_UP]
    3: [SPI1_TX, TIM1_CH2]
    4: [USART1_TX, TIM1_TRIG, TIM1_COM, TIM1_CH4, TIM3_CH4]
    5: [USART1_RX, TIM2_CH1, TIM1_UP]
    6: [I2C1_TX, TIM1_CH3, USART2_TX]
    7: [I2C1_RX, TIM2_CH2, TIM2_CH4, USART2_RX]
  notes: >
    RM Table 8-2 note (2): on CH32V006 the TIM3 CH3 event can trigger only DMA channel 1
    and the TIM3 CH4 event only channel 4. The wider TIM3 fan-out in the table
    (channels 1-3 and 4-6) applies to CH32M007, not to this part.
    TIM1_TRIG, TIM1_COM and TIM1_CH4 share channel 4 as one hardware request line.


# -----------------------------------------------------------------------------
# Code generation — register encodings the C generator cannot derive from the model.
# Requested by AGENT-2 (BOARD 05:43Z / 05:44Z). Every number below was read off the
# reference manual directly, not copied from the request; the one disagreement that
# found is called out where it occurs.
codegen:
  header: ch32v00x.h

  # RM 3.4.7: the GPIO ports and AFIO sit in RCC_PB2PCENR — AFIOEN bit 0, IOPAEN..IOPDEN
  # bits 2..5. The register really is named "PB2" on this family, not "APB2" (RM Table
  # 3-x, R32_RCC_PB2PCENR at 0x40021018), which is why the macro spelling below reads
  # PB2. Confirming the EVT SDK uses the same spelling for the *function* is HUMAN_TODO
  # item 5; the register name itself is settled.
  gpio_clock: { fn: RCC_PB2PeriphClockCmd, port: RCC_PB2Periph_GPIO$PORT, afio: RCC_PB2Periph_AFIO }
  speeds: { Low: GPIO_Speed_2MHz, Medium: GPIO_Speed_10MHz, High: GPIO_Speed_50MHz }

  # AFIO_PCFR1 — RM 7.3.2.2. Bit layout row, high half then low half:
  #   [31:27] Reserved  [26:24] SWCFG  23 Reserved  [22:20] USART2_RM  19 ADC_ETRGREG_RM
  #   18 ADC_ETRGINJ_RM  17 PA1PA2_RM  16 TIM2_RM[2]
  #   [15:14] TIM2_RM[1:0]  [13:10] TIM1_RM  [9:6] USART1_RM  [5:3] I2C1_RM  [2:0] SPI1_RM
  #
  # Only peripherals whose `remaps:` index IS the register field value belong here.
  # SYS is deliberately absent: its remap list selects the package's reset pin, not an
  # AFIO field, so putting SWCFG here would write the package index into the register.
  # ADC1, TKEY, OPA1 and RCC each have a single "Default" remap for the same reason.
  remap:
    register: "AFIO->PCFR1"
    fields:
      SPI1:   [{ lsb: 0,  bits: 3 }]
      I2C1:   [{ lsb: 3,  bits: 3 }]
      USART1: [{ lsb: 6,  bits: 4 }]
      TIM1:   [{ lsb: 10, bits: 4 }]
      # TIM2_RM is three contiguous bits, [16:14]. It is written as two slices because
      # the RM's bit diagram splits the field across its two half-rows and the engine
      # supports that shape; [{lsb:14,bits:3}] would encode identically.
      TIM2:   [{ lsb: 14, bits: 2 }, { lsb: 16, bits: 1, from: 2 }]
      USART2: [{ lsb: 20, bits: 3 }]

  # Which signals want GPIO_Mode_AIN rather than AF_PP. Without this the generator has
  # to guess from the peripheral's category, and it cannot tell ADC1_IN4 from
  # ADC1_RETR0 — they share PD3 and only IN4 is analog. The triggers (RETR0/RETR1/
  # IETR0/IETR1) are digital edge inputs and are correctly absent here.
  analog_signals:
    ADC1: [IN0, IN1, IN2, IN3, IN4, IN5, IN6, IN7]
    TKEY: [CH0, CH1, CH2, CH3, CH4, CH5, CH6, CH7]
    OPA1: [P0, P1, P2, P3, N0, N1, N2, OUT0, OUT1]

  # RCC_CFGR0 — RM 3.4.2, offset 0x04, reset 0x00000020.
  rcc:
    register: "RCC->CFGR0"
    sw:     { lsb: 0,  bits: 2, values: { HSI: 0, HSE: 1, PLLCLK: 2 } }   # SW[1:0]
    pllsrc: { lsb: 16, bits: 1, values: { HSI: 0, HSE: 1 } }              # PLLSRC
    prescalers:
      # HPRE[3:0]. The RM gives two encodings for /2, /4 and /8; these are the ones from
      # the 0000..0111 run, which covers every divider the clock tree offers below 16.
      HB:  { lsb: 4,  bits: 4,
             values: { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 7,
                       16: 11, 32: 12, 64: 13, 128: 14, 256: 15 } }
      # ADCPRE[4:0]. The encoding is not a plain divider index: bits [4:3] pick a base
      # (00 = /2, 01 = /4, 10 = /6, 11 = /8) and bits [2:0] scale it (0-3 = x1, 4 = x2,
      # 5 = x4, 6 = x8, 7 = x16). Several dividers therefore have two legal codes; the
      # values below are one valid code each, checked against the RM's own 21-line list.
      #
      # NOTE for whoever compares this against BOARD 05:43Z: that request proposed
      # 6 -> 8. Code 8 is 01000, which is base /4 x1 = /4, so it would have run the ADC
      # at 1.5x the requested clock. /6 is 10000 = 16. Every other value in the request
      # checked out.
      #
      # /1 is deliberately absent. There is no ADCPRE code for it: undivided HB clock is
      # ADC_CLK_MODE, bit 31 of this same register, a separate field. Mapping /1 onto
      # the /2 code would silently halve the ADC clock, so the generator is left to
      # report "no encoding for 1" until it can write bit 31 too. See BOARD.
      ADC: { lsb: 11, bits: 5,
             values: { 2: 0, 4: 4, 6: 16, 8: 12, 12: 20, 16: 28,
                       24: 21, 32: 29, 48: 22, 64: 30, 96: 23, 128: 31 } }

  # Not consumed by the generator yet — data first, so it is ready when it is.
  # Which enable register each peripheral's clock bit lives in (RM 3.4.6 / 3.4.7 / 3.4.8).
  # This is NOT a frequency split: there is only one prescaler (HPRE), so HB, PB1 and PB2
  # all run at HCLK. It is purely about which RCC_*PCENR register to write.
  periph_clock:
    HB:  { register: RCC_HBPCENR,  fn: RCC_HBPeriphClockCmd,  prefix: RCC_HBPeriph_,
           bits: { DMA1: 0, SRAM: 2 } }
    PB2: { register: RCC_PB2PCENR, fn: RCC_PB2PeriphClockCmd, prefix: RCC_PB2Periph_,
           bits: { AFIO: 0, GPIOA: 2, GPIOB: 3, GPIOC: 4, GPIOD: 5, ADC1: 9,
                   TIM1: 11, SPI1: 12, USART2: 13, USART1: 14 } }
    PB1: { register: RCC_PB1PCENR, fn: RCC_PB1PeriphClockCmd, prefix: RCC_PB1Periph_,
           bits: { TIM2: 0, TIM3: 2, WWDG: 11, I2C1: 21, PWR: 28 } }
    notes: >
      TKEY and OPA have no enable bit of their own in RM 3.4.6-3.4.8. TouchKey shares the
      ADC block and OPA is documented as always-on analog, but neither is stated outright,
      so neither is listed rather than guessed at.

# -----------------------------------------------------------------------------
# Clock tree — DS 1.3 Figure 1-3, RM 3 (RCC_CFGR0 HPRE / ADCPRE / MCO / PLLSRC)
clock:
  sources:
    HSI: { mhz: 24, fixed: true }
    HSE: { mhz: 24, min_mhz: 3, max_mhz: 25 }
    LSI: { khz: 128, fixed: true }
  pll:
    inputs:
      - { name: HSI, source: HSI, div: 1 }
      - { name: HSE, source: HSE, div: 1 }
    multipliers: [2]
  sysclk:
    sources: [HSI, HSE, PLLCLK]
    max_mhz: 48
  prescalers:
    HB:  { options: [1, 2, 3, 4, 5, 6, 7, 8, 16, 32, 64, 128, 256], max_mhz: 48, label: HB prescaler (HPRE) → HCLK }
    ADC: { options: [1, 2, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128], source: HB, min_mhz: 16, max_mhz: 48,
           label: "ADC prescaler (ADCPRE; /1 = ADC_CLK_MODE)" }
  derived:                          # informational taps off HCLK
    - { name: Flash time base, source: HB, div: 3 }
    - { name: Core SysTick, source: HB, div: 8 }
  buses:
    HB: [TIM1, TIM2, TIM3, GPIO, AFIO, USART1, USART2, I2C1, SPI1, ADC1, TKEY, DMA1, WWDG, OPA1, PWR]
  notes: >
    One frequency domain: HPRE is the only bus prescaler, so every peripheral runs at
    HCLK and `buses.HB` lists them all. That is a statement about frequency only — the
    part does have three separate clock ENABLE registers (RCC_HBPCENR, RCC_PB2PCENR,
    RCC_PB1PCENR, RM 3.4.6-3.4.8), and which one a peripheral sits in is in
    `codegen.periph_clock`. An earlier version of this note said "no APB1/APB2 split",
    which read as though PB1 and PB2 did not exist at all; they do.
    IWDG runs from LSI. MCO on PC4 can output SYSCLK, HSI, HSE or PLLCLK.
