; =============================================================================
;  WCHCube firmware — PlatformIO project
;
;  The firmware half of this repository. The configurator in ../../app generates
;  `wchcube_init.c/.h`; this project is where that generated code is compiled,
;  linked and flashed, on the real toolchain, for a real part.
;
;  Platform:  ch32v (Community-PIO-CH32V), a copy of its source is in
;             ../Pio Source/platform-ch32v-develop for reference — PlatformIO
;             uses the INSTALLED copy in ~/.platformio/platforms/ch32v.
;
;             Pinned by GIT URL, not by name. `platform = ch32v` does NOT resolve:
;             the platform is not published in the PlatformIO registry (the registry
;             API answers 404, and `pio pkg search ch32v` finds nothing), so that
;             spelling only ever worked on a machine where the platform had been
;             installed by hand — which is every machine this repo was built on, and
;             no machine CI uses. It failed in about two seconds, before any download.
;             The URL below is the same remote this box's installed copy came from.
;  Framework: noneos-sdk = the WCH EVT Standard Peripheral Library, no OS.
;
;  Architecture, layering and which agent owns what: see ARCHITECTURE.md.
;  Build/flash/debug instructions: see README.md.
; =============================================================================

[platformio]
default_envs = CH32V006F8P6
src_dir      = src
include_dir  = include
lib_dir      = lib
test_dir     = test

; -----------------------------------------------------------------------------
;  Everything every environment shares. Per-part facts live in the [env:*]
;  sections and come from the platform's own board JSON — never from this file.
; -----------------------------------------------------------------------------
[env]
platform  = https://github.com/Community-PIO-CH32V/platform-ch32v.git
framework = noneos-sdk

; The LDF does not evaluate __has_include, so lib/wchcube_generated would never
; be discovered from src/main.c's optional include. It is named in lib_deps
; below instead, which puts its include/ on the path whether or not anything has
; been generated yet.
lib_ldf_mode = chain+

; Named explicitly so that EVERY component is compiled on every build, even one
; the application does not include yet. A component that only builds when
; someone happens to include it is a component that rots. `util` is the reason
; this list exists.
lib_deps =
    board
    wch_hal
    util
    wchcube_generated

build_flags =
    ; printf() over the WCH-Link debug interface (SDI). Chosen as the default
    ; because it claims NO pin: routing printf to USART1 would silently occupy
    ; PD5 and fight whatever the configurator assigned there.
    ; Set -DSDI_PRINT=0 and -DDEBUG=DEBUG_UART1_NoRemap to use the UART instead.
    -D SDI_PRINT=1

; Stricter warnings for OUR code only. The vendor SDK is compiled with the
; platform's own flags; turning -Wextra on globally would bury our warnings
; under the SDK's.
build_src_flags =
    -Wextra
    -Wshadow
    -Wundef

upload_protocol = wch-link
debug_tool      = wch-link
monitor_speed   = 115200

check_tool        = cppcheck
check_src_filters = +<src/> +<lib/> +<include/>
check_flags       = cppcheck: --enable=warning,style --inline-suppr --suppress=missingIncludeSystem

; -----------------------------------------------------------------------------
;  Parts. One environment per (MCU, package) the configurator can also describe,
;  so a .wchproj and a build target name the same physical part.
;
;   env name            configurator part     package   board JSON
;   CH32V006F8P6        CH32V006F8P7          TSSOP20   genericCH32V006F8P6
;   CH32V006K8U6        CH32V006K8U7          QFN32     genericCH32V006K8U6
;   CH32V005F6P6        CH32V005F6P6          TSSOP20   genericCH32V005F6P6
;   CH32V003F4P6        CH32V003F4P6          TSSOP20   genericCH32V003F4P6
;   CH32X035G8U6        CH32X035G8U6          QFN28     genericCH32X035G8U6
;
;  The trailing digit differs on the V006 rows: data/mcus/CH32V006.yaml lists the
;  105 °C grades (…U7/…P7) from DS §1, the platform ships the 85 °C board files
;  (…U6/…P6). Same die, same pinout, same build — only the temperature grade
;  differs, and nothing in the build depends on it.
; -----------------------------------------------------------------------------

[env:CH32V006F8P6]
board = genericCH32V006F8P6
build_flags =
    ${env.build_flags}
    -D BOARD_NAME=CH32V006F8P6-TSSOP20

[env:CH32V006K8U6]
board = genericCH32V006K8U6
build_flags =
    ${env.build_flags}
    -D BOARD_NAME=CH32V006K8U6-QFN32

[env:CH32V005F6P6]
board = genericCH32V005F6P6
build_flags =
    ${env.build_flags}
    -D BOARD_NAME=CH32V005F6P6-TSSOP20

; CH32V003 — the third family, and the smallest: RV32EC (no multiply, no
; compressed-float extensions), 16 KB flash, 2 KB SRAM, 18 I/O on TSSOP20. It is
; a different core from the V00x parts, which is why it has its own environment
; rather than a build flag: a firmware built for it must not silently link a
; V006 binary. `data/mcus/CH32V003.yaml` describes it, so the configurator can
; generate for it like any other part.
[env:CH32V003F4P6]
board = genericCH32V003F4P6
build_flags =
    ${env.build_flags}
    -D BOARD_NAME=CH32V003F4P6-TSSOP20

; CH32X035 — the second family, read from its own DS v2.2 and RM v1.9 and checked
; against its own 2 239-file EVT package. `data/mcus/CH32X035.yaml` describes it
; with 7 packages and 8 variants, and `tests/codegen_compile.test.js` generates from
; it and builds it here.
[env:CH32X035G8U6]
board = genericCH32X035G8U6
build_flags =
    ${env.build_flags}
    -D BOARD_NAME=CH32X035G8U6

; CH32L103 — the fifth family, and the first with THREE GPIO output speeds, so
; `gpio.speeds` is a real choice here rather than a one-entry fixed value. It is
; also the first to reach the backup domain (RTC + BKP) and to carry a CAN
; controller. `data/mcus/CH32L103.yaml` describes it; this environment is what makes
; "the generated code compiles for CH32L103" checkable rather than asserted.
;
; The board id is the part's own: the platform ships genericCH32L103<package>
; files, and QFN32 is the default package in the MCU file.
[env:CH32L103K8U6]
board = genericCH32L103K8U6
build_flags =
    ${env.build_flags}
    -D BOARD_NAME=CH32L103K8U6

; CH32H417 — the fourth family, and the first that muxes its alternate functions
; PER PIN (GPIOx_AFRL/AFRH, AFRy[3:0] = AF0..AF15) instead of moving a whole
; peripheral with one AFIO field. `data/mcus/CH32H417.yaml` describes it with
; `signal_pins:` and `codegen.remap.style: af`, and this environment is what makes
; the claim "the generated GPIO_PinAFConfig calls compile" checkable instead of
; asserted.
;
; The platform ships THREE board files per package — genericCH32H417QEU6 and the
; same id with a `_V3F` / `_V5F` suffix — because this part has two cores. The
; plain id is used here; which core a generated project targets is an open question
; in `data/mcus/CH32H417.notes.md` and is not something this file should decide
; silently by picking a suffix.
[env:CH32H417QEU6]
board = genericCH32H417QEU6
build_flags =
    ${env.build_flags}
    -D BOARD_NAME=CH32H417QEU6-QFN128

; ---------------------------------------------------------------------------
; Host-side unit tests for lib/util. (D6)
;
;     pio test -e native
;
; `util` is the one component that compiles for the host: its library.json
; declares no framework and no platform, it allocates nothing and it never
; includes an SDK header (ARCHITECTURE.md, "Layers"). This environment is what
; makes that constraint pay -- the ring buffer's wrap-around and full/empty
; cases are ordinary C logic, and testing them on a chip would be slower,
; flakier and no more truthful.
;
; It needs a HOST compiler (gcc/clang/MSVC). There is none on the Windows box
; this was written on, so `pio test -e native` does not run here and the QA gate
; skips with that reason printed rather than passing quietly. It runs unchanged
; anywhere a host toolchain exists -- a Linux CI job in particular.
;
; test_build_src is off: main.c is target firmware and must not be linked into a
; host test binary. Only lib/ and test/ are compiled.
; Nothing here inherits from [env]: `framework = noneos-sdk` and the ch32v
; lib_deps are target-only, and letting them through is what makes PlatformIO
; ask for a `board` on a host build. So every key [env] sets is overridden.
[env:native]
platform = native
framework =
test_framework = unity
; Only `util` — `board` and `wch_hal` include SDK headers by design and cannot
; compile for the host. If this list ever needs a second entry, that entry has
; to be hardware-free too.
lib_deps = util
lib_ldf_mode = chain+
; main.c is target firmware; it must never be linked into a host test binary.
test_build_src = no
build_flags = -std=c11 -Wall -Wextra
build_src_flags =
