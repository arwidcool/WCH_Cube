# Coverage ledger declarations for CH32H417 - docs/COVERAGE.md is the rule, the schema and
# the loop.
#
#   python tools/coverage.py CH32H417        # every open row, with the datasheet line to read
#
# Every ledger row on this part is now modelled by a named signal, declared absent with a
# citation, or recorded as a difference between the datasheet's two readings with both
# sides cited. That is what `status: complete` claims and what `tools/coverage.py --gate`
# re-checks against the sources on every run; it is NOT a claim that every peripheral is
# fully parameterised (see TASKS.md for `params:` and `codegen.analog_signals`).
part: CH32H417
status: complete

sources:
  ds: data/sources/H417/Datasheets/CH32H417DS0.md
  rm: data/sources/H417/Datasheets/CH32H417RM.md
  header: data/sources/H417/Evt/EXAM/SRC/Peripheral/inc/ch32h417.h

# Table 2-1-1 is CH32H417 on QFN68/88/128; 2-1-2 and 2-1-3 are CH32H416 and CH32H415.
pin_tables:
  - { start: "Table 2-1-1 CH32H417 Pin definitions", end: "Table 2-1-2" }
# Tables 2-2-1 .. 2-2-31 are the signal-first reading: one table per peripheral family.
signal_table: { kind: signal_rows, start: "Table 2-2-1 ADC Pin functions", end: "## Chapter 3" }

# Pad types this datasheet uses that are not the I/O/A/P/FT alphabet. Each names a
# DEDICATED pad, and the parser needs them to see the row at all: `USB3.0` is the four
# USB 3.0 SuperSpeed pads (SSTXA/SSTXB/SSRXA/SSRXB, DS Table 2-1-1 pins 1/2/4/5 on QFN68)
# and `ETH` the four Ethernet MDI pads (MDIRN/MDIRP/MDITN/MDITP, pins 8-11).
pin_types: [USB3.0, ETH]

aliases:
  # The file models the memory controller as FMC (the SPL header is ch32h417_fmc.h); the
  # datasheet writes its pins under three headings.
  SDRAM_*: FMC_*
  FSMC_*: FMC_*
  # The DS spells the CAN pins CAN_RX/CAN_TX where the controller is the first one; Table
  # 2-2-13 attributes both to CAN1 (tools/gen_h417_peripherals.py MERGE).
  CAN_*: CAN1_*
  # RGMII pins belong to the Ethernet MAC; the pin-first table names the data lines RXD/TXD
  # and the signal-first table RD/TD.
  RGMII_RD*: ETH_RXD*
  RGMII_TD*: ETH_TXD*
  RGMII_*: ETH_*
  SWP_*: SWPMI_*
  # PC6 is the I2S2 master clock under both readings; only the spelling differs (Table
  # 2-1-1 `SPI2_MCK(AF5)`, Table 2-2-8 `I2S2_MCK PC6(AF5), PB5(AF8)`). SPI has no
  # master-clock output on this family - MCK belongs to the I2S mode of the SPI block
  # (RM ch.23) - so the file routes it under I2S2 and this maps the other spelling onto it.
  # tools/gen_h417_peripherals.py SIGNAL_FIX does the same on the generator's side.
  SPI2_MCK: I2S2_MCK
  # The I2S data line, same pad and same AF in both readings, spelled `I2S2_SD` in Table
  # 2-1-1 and `SPI2_MOSI/I2S2_SDO` in Table 2-2-8 (PB15, PC1, PC3, all AF5). The file uses
  # `SD`, which is what CH32V006 and CH32L103 call it and what the tree's I2S settings
  # name; the SPL settles nothing here, because I2S on this family has no pin-level names
  # at all - it drives the SPI registers (ch32h417_spi.h: I2S_InitTypeDef, I2S_Mode_*).
  # So this is a spelling, not a second pad.
  I2S2_SDO: I2S2_SD
  SWDIO: SYS_SWIO
  # Both ADCs sample the same sixteen pads (CH32H417.notes.md), so one DS token stands for two.
  ADC_IN*: [ADC1_IN*, ADC2_IN*]
  DAC{1}_OUT: DAC_OUT{1}
  # The generator moves the OPA unit digit to the end so one flat name space holds all
  # three units: OPA1_P0 is P01 (tools/gen_h417_peripherals.py, _opa_settings).
  OPA{1}_P{2}: OPA_P{2}{1}
  OPA{1}_N{2}: OPA_N{2}{1}
  OPA{1}_OUT{2}: OPA_OUT{2}{1}
  # The USB full-speed controller is OTG_FS in the datasheet and USBFS in the SPL header
  # and the tree (DS Table 2-2-18; ch32h417.h defines USBFSD/USBFSH at the OTG_FS base).
  OTG_DP: USBFS_DP
  OTG_DM: USBFS_DM
  OTG_VBUS: USBFS_VBUS
  OTG_ID: USBFS_ID
  # The USB 3.0 SuperSpeed pads carry their own name as their function (DS Table 2-1-1,
  # pin type USB3.0); the file names the signals after the pads, minus the SS prefix.
  SSTXA: USBSS_TXA
  SSTXB: USBSS_TXB
  SSRXA: USBSS_RXA
  SSRXB: USBSS_RXB

corrections:
  - pin: PC2
    token: SDRAM_CS_NO
    replace_with: [SDRAM_CS_N0]
    reason: "letter O for digit 0 in the conversion; Table 2-2-15 prints SDRAM_CS_N0 on PC2"
    source: "CH32H417DS0.md Table 2-1-1 PC2 row (vs Table 2-2-15)"
absent:
  # PB6 carries A5 TWICE: `FSMC_A5(AF1)` and `SDRAM_A5(AF11)` on the same row of Table
  # 2-1-1, and Table 2-2-15 confirms `SDRAM_A5 PB6(AF11), PC13(AF12), PB10(AF0)`. Both are
  # real, and they are different pads-worth of silicon reached through the same wire: RM
  # ch.40 has one controller with a static-memory interface and an SDRAM interface, and
  # this file models it as ONE peripheral `FMC` (the SPL header is ch32h417_fmc.h), so the
  # aliases `FSMC_*` and `SDRAM_*` both land on `FMC_A5`. `signal_pins:` is keyed by PIN
  # and takes one AF code per pin, so PB6 keeps AF1 and the AF11 reading has nowhere to go.
  # NOT a disagreement - the two readings agree - and not a wrong pin: it is the one place
  # the single-name-space model loses a fact. Splitting FMC's static and SDRAM interfaces
  # into two name spaces is the fix, and it is a TASKS.md line, not a declaration.
  - { token: SDRAM_A5, pin: PB6, reason: "FSMC_A5(AF1) and SDRAM_A5(AF11) are the same address line on one pad through the two interfaces of one controller (RM ch.40); the file models FMC as one name space and signal_pins takes one AF per pin, so PB6 keeps FSMC's AF1", source: "CH32H417DS0.md:5386 and :5391 (Table 2-1-1 PB6), Table 2-2-15 SDRAM_A5" }
  # DMAMUX is not a peripheral a user configures: it is the request router that sits
  # between the peripherals and the two DMA controllers, inside RM ch.10 (already mapped to
  # DMA1/DMA2 in `chapters:` below). RM 10.2.3 (CH32H417RM.md:12513): "The DMA controller
  # provides 16 channels, where DMAMUX channels 1 through 8 are connected to DMA1 channels
  # 1 through 8, and DMAMUX channels 9 through 16 are connected to DMA2 channels 1 through
  # 8." One register block serving both, so mapping the instance onto either controller
  # alone would be half true. What a user picks is a REQUEST per channel - now modelled
  # as `dma[0].mux`/`dma[1].mux` (both controllers' `requests:`, RM Table 10-2's full
  # 123-entry catalogue, `data/mcus/CH32H417.yaml` top-level `dma:`), landed after this
  # row was first written. DMAMUX stays declared absent here for the SAME reason as
  # before, unchanged by that: it is still not a `peripherals:` entry a user switches on
  # or off - it is configured entirely through DMA1's/DMA2's own channels.
  - { instance: DMAMUX, reason: "the DMA request multiplexer: one register block routing peripheral requests into DMA1's and DMA2's channels (RM 10.2.3), not a peripheral of its own - the per-channel request selection it configures is modelled on dma[].mux, not as a peripheral block", source: "CH32H417RM.md:12508-12514 and Table 10-6 (:12678)" }
# The DS reads the same silicon twice - Table 2-1-1 pin-first, Tables 2-2-x
# signal-first - and where the two answers differ, BOTH are recorded here and
# neither is averaged. Every entry names the line of each reading. One entry closes
# both rows a difference produces: "the DS puts this function on this pin and the
# file does not route it there" and "the two readings differ" are the same fact.
disagreements:
  - { pin: PB8, token: SDRAM_CKE0,
      reason: "Table 2-2-15 gives SDRAM_CKE0 four pads - PC5(AF12), PC3(AF12), PB8(AF3), PF3(AF4); the file's CKE0 has PC5, PC3, PF3 but PE5(AF9) where Table 2-2-15 says PB8 - and PE5's own Table 2-1-1 row genuinely reads SDRAM_CKE0(AF9) (CH32H417DS0.md:3816), so this is not a parse error on the file's side. No tie-breaker settles it: both of this part's SDRAM EVT examples exercise CKE0 only on PF3(AF4) and PC5(AF12), neither touches PB8 or PE5, and CH32H417RM.md has zero hits for SDRAM_CKE0 - this reference manual carries no per-pin mux table at all. Recorded, not averaged; the file keeps PE5 (Table 2-1-1, its usual reading everywhere else on this part)",
      source: "CH32H417DS0.md:7177 (Table 2-2-15 SDRAM_CKE0 row) vs CH32H417DS0.md:3816 (Table 2-1-1 PE5 row, AF9 = SDRAM_CKE0)" }
  - { pin: PC11, token: SDRAM_DQM2,
      reason: "Table 2-2-15 gives SDRAM_DQM2 five pads - PC10(AF0), PA6(AF6), PA0(AF15), PC11(AF1), PE6(AF7); the file's DQM2 has PC10, PA6, PA0 but PB9(AF3) where Table 2-2-15 also lists PC11 and PE6 - and PB9's own Table 2-1-1 row genuinely reads SDRAM_DQM2(AF3), so this is not a parse error either. Same tie-breaker gap as CKE0 above: neither SDRAM EVT example touches PC11, PE6 or PB9 for DQM2, and CH32H417RM.md has zero hits for SDRAM_DQM2. Recorded, not averaged; the file keeps PB9 (Table 2-1-1)",
      source: "CH32H417DS0.md:7184 (Table 2-2-15 SDRAM_DQM2 row) vs CH32H417DS0.md:5447-5450 (Table 2-1-1 PB9 row, AF3 = SDRAM_DQM2)" }
  - { pin: PE9, token: USART8_RTS,
      reason: "Table 2-2-9 gives USART8_RTS two pads, PE9(AF11) and PF8(AF7); the file has PF8(AF7) and PF9(AF11) - it agrees on PF8/AF7 and differs only on the AF11 candidate (PF9 vs PE9). PF9's own Table 2-1-1 row genuinely reads USART8_RTS(AF11) (CH32H417DS0.md:3969, under the PF9 heading at :3964), so again not a parse error. No EVT example for USART8 exists anywhere in this part's Evt tree to arbitrate, and CH32H417RM.md has zero hits for USART8_RTS - no per-pin mux table there either. Recorded, not averaged; the file keeps PF9 (Table 2-1-1)",
      source: "CH32H417DS0.md:7027 (Table 2-2-9 USART8_RTS row) vs CH32H417DS0.md:3964-3969 (Table 2-1-1 PF9 row, AF11 = USART8_RTS)" }
  - { pin: PE10, token: USART8_CTS,
      reason: "Table 2-2-9 gives USART8_CTS two pads, PE10(AF11) and PF9(AF7); the file has PF9(AF7) and PF10(AF11) - agrees on PF9/AF7, differs on the AF11 candidate (PF10 vs PE10). PF10's own Table 2-1-1 row genuinely reads USART8_CTS(AF11) (CH32H417DS0.md:4008, under the PF10 heading at :4005). Same absence of a tie-breaker as the other three: no USART8 EVT example, no CH32H417RM.md hits for USART8_CTS. Recorded, not averaged; the file keeps PF10 (Table 2-1-1)",
      source: "CH32H417DS0.md:7028 (Table 2-2-9 USART8_CTS row) vs CH32H417DS0.md:4005-4008 (Table 2-1-1 PF10 row, AF11 = USART8_CTS)" }
  - { pin: PB12, token: LPTIM2_CH2,
      reason: "Table 2-2-5 gives LPTIM2_CH2 two pads, PD11(AF3) and PB12(AF13); PB12's own Table 2-1-1 row is a complete, gapless AF0-15 enumeration in which AF13 is CMP_OUT, not LPTIM2_CH2 - the two tables flatly disagree and there is no third source (EVT/RM register text) that names LPTIM2_CH2's pad to break the tie. Neither is averaged; the file follows pin-first (Table 2-1-1) as it does everywhere else on this part, so LPTIM2_CH2 has only PD11 and PB12(AF13) stays CMP_OUT's (CH32H417.yaml:2359). A board built to Table 2-2-5 instead would wire LPTIM2_CH2 onto the comparator output pad",
      source: "CH32H417DS0.md:6911 (Table 2-2-5 LPTIM2_CH2 row) vs CH32H417DS0.md:4522-4533 (Table 2-1-1 PB12 row, AF13 = CMP_OUT)" }
  - { pin: PE3, token: SERDES_TXP,
      reason: "Table 2-1-1 and Table 2-2-20 SWAP the SerDes transmit and receive pairs: pin-first reads PE3/PE4 = TXP/TXN and PE5/PE6 = RXP/RXN, signal-first reads PE3/PE4 = RXP/RXN and PE5/PE6 = TXP/TXN. Neither is averaged; the file follows pin-first (Table 2-1-1), which is where every other pad on this part comes from. A board built to the wrong reading has both differential pairs crossed, so this one wants silicon to settle it",
      source: "CH32H417DS0.md:3791 (Table 2-1-1 PE3 row: SERDES_TXP) vs CH32H417DS0.md:7341 (Table 2-2-20: SERDES_RXP on PE3)" }
