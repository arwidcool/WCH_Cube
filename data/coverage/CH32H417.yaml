# Coverage ledger declarations for CH32H417 - docs/COVERAGE.md is the rule, the schema and
# the loop. This part is IN EXTRACTION: its open rows are counted in `open_rows:` below,
# the count may only go down, and the part is not done while it is above zero.
#
#   python tools/coverage.py CH32H417        # the open rows, with the datasheet line to read
part: CH32H417
status: in_extraction
owner: AGENT-1
task: "CH32H417: close the coverage ledger"
open_rows: 104

sources:
  ds: data/sources/H417/Datasheets/CH32H417DS0.md
  rm: data/sources/H417/Datasheets/CH32H417RM.md
  header: data/sources/H417/Evt/EXAM/SRC/Peripheral/inc/ch32h417.h

# Table 2-1-1 is CH32H417 on QFN68/88/128; 2-1-2 and 2-1-3 are CH32H416 and CH32H415.
pin_tables:
  - { start: "Table 2-1-1 CH32H417 Pin definitions", end: "Table 2-1-2" }
# Tables 2-2-1 .. 2-2-31 are the signal-first reading: one table per peripheral family.
signal_table: { kind: signal_rows, start: "Table 2-2-1 ADC Pin functions", end: "## Chapter 3" }

# Pad types this datasheet uses that are not the I/O/A/P/FT alphabet. Each names a
# DEDICATED pad, and the parser needs them to see the row at all: `USB3.0` is the four
# USB 3.0 SuperSpeed pads (SSTXA/SSTXB/SSRXA/SSRXB, DS Table 2-1-1 pins 1/2/4/5 on QFN68)
# and `ETH` the four Ethernet MDI pads (MDIRN/MDIRP/MDITN/MDITP, pins 8-11).
pin_types: [USB3.0, ETH]

aliases:
  # The file models the memory controller as FMC (the SPL header is ch32h417_fmc.h); the
  # datasheet writes its pins under three headings.
  SDRAM_*: FMC_*
  FSMC_*: FMC_*
  # The DS spells the CAN pins CAN_RX/CAN_TX where the controller is the first one; Table
  # 2-2-13 attributes both to CAN1 (tools/gen_h417_peripherals.py MERGE).
  CAN_*: CAN1_*
  # RGMII pins belong to the Ethernet MAC; the pin-first table names the data lines RXD/TXD
  # and the signal-first table RD/TD.
  RGMII_RD*: ETH_RXD*
  RGMII_TD*: ETH_TXD*
  RGMII_*: ETH_*
  SWP_*: SWPMI_*
  SWDIO: SYS_SWIO
  # Both ADCs sample the same sixteen pads (CH32H417.notes.md), so one DS token stands for two.
  ADC_IN*: [ADC1_IN*, ADC2_IN*]
  DAC{1}_OUT: DAC_OUT{1}
  # The generator moves the OPA unit digit to the end so one flat name space holds all
  # three units: OPA1_P0 is P01 (tools/gen_h417_peripherals.py, _opa_settings).
  OPA{1}_P{2}: OPA_P{2}{1}
  OPA{1}_N{2}: OPA_N{2}{1}
  OPA{1}_OUT{2}: OPA_OUT{2}{1}
  # The USB full-speed controller is OTG_FS in the datasheet and USBFS in the SPL header
  # and the tree (DS Table 2-2-18; ch32h417.h defines USBFSD/USBFSH at the OTG_FS base).
  OTG_DP: USBFS_DP
  OTG_DM: USBFS_DM
  OTG_VBUS: USBFS_VBUS
  OTG_ID: USBFS_ID
  # The USB 3.0 SuperSpeed pads carry their own name as their function (DS Table 2-1-1,
  # pin type USB3.0); the file names the signals after the pads, minus the SS prefix.
  SSTXA: USBSS_TXA
  SSTXB: USBSS_TXB
  SSRXA: USBSS_RXA
  SSRXB: USBSS_RXB

corrections:
  - pin: PC2
    token: SDRAM_CS_NO
    replace_with: [SDRAM_CS_N0]
    reason: "letter O for digit 0 in the conversion; Table 2-2-15 prints SDRAM_CS_N0 on PC2"
    source: "CH32H417DS0.md Table 2-1-1 PC2 row (vs Table 2-2-15)"
