      reason: "Table 2-1-1 CONTRADICTS ITSELF here and Table 2-2-25 does not: pin-first gives QSPI2_SIOX1(AF11) to BOTH PB12 (:4530) and PB14 (:4558) and SIOX0(AF11) to PB13 (:4545), leaving SIOX2 and SIOX3 on no pad at AF11 at all; signal-first reads PB11/PB12/PB13/PB14 = SIOX0/1/2/3, four consecutive pins in order. The file follows pin-first, because the whole AF map is derived from Table 2-1-1 and reading one signal from the other table would make the map incoherent. Recorded, not averaged: this one needs the vendor or a board to settle",
      source: "CH32H417DS0.md:4558 (Table 2-1-1 PB14 row: QSPI2_SIOX1) vs CH32H417DS0.md:7453 (Table 2-2-25: QSPI2_SIOX3 on PB14)" }
