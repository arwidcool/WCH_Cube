# Every pin that exists on the die, not only the ones a package bonds.
pins:
  BOOT0: { type: boot }
  NRST: { type: reset }
  PA0: { type: io }
  PA1: { type: io }
  PA10: { type: io }
  PA11: { type: io }
  PA12: { type: io }
  PA13: { type: io }
  PA14: { type: io }
  PA15: { type: io }
  PA2: { type: io }
  PA3: { type: io }
  PA4: { type: io }
  PA5: { type: io }
  PA6: { type: io }
  PA7: { type: io }
  PA8: { type: io }
  PA9: { type: io }
  PB0: { type: io }
  PB1: { type: io }
  PB10: { type: io }
  PB11: { type: io }
  PB12: { type: io }
  PB13: { type: io }
  PB14: { type: io }
  PB15: { type: io }
  PB2: { type: io }
  PB3: { type: io }
  PB4: { type: io }
  PB5: { type: io }
  PB6: { type: io }
  PB7: { type: io }
  PB8: { type: io }
  PB9: { type: io }
  PC13: { type: io }
  PC14: { type: io }
  PC15: { type: io }
  PD0: { type: io }
  PD1: { type: io }
  VBAT: { type: power }
  VDD: { type: power }
  VDDA: { type: power }
  VSS: { type: ground }
  VSSA: { type: ground }

peripherals:
  SYS:
    category: System
    settings:
      - name: Debug (SDI)
        choices:
          - { name: No Debug }
          - { name: 2-wire SDI (SWDIO/SWCLK), signals: [SWDIO, SWCLK], default: true }
      - name: External reset pin
        choices:
          # choices[0] is the OFF state by convention. Here the factory state is the
          # pin ENABLED - DS pin table: NRST "Main function (After reset)" - so the
          # off choice is named first only because the engine needs an off state;
          # the pin really is claimed out of reset. `default: true` says which one
          # the user gets, exactly as CH32V006's RST_MODE setting does.
          - { name: Reset pin disabled - pin is GPIO, signals: [] }
          - { name: "RST enabled (factory default)", signals: [RST], default: true }
    remaps:
      - name: RST on NRST, SDI on PA13/PA14
        pins: { RST: NRST, SWDIO: PA13, SWCLK: PA14 }
    notes: >
      SYS claims the debug pins and the reset pin. Neither is ever configured with
      GPIO_Init: `codegen.skip_signals` names them, because driving the reset pin as
      a push-pull output is harmful and the debug port is controlled by the option
      bytes. SWDIO is PA13 and SWCLK is PA14 - the DS pinout figures print those pins
      as `PA13/SWDIO` and `PA14/SWCLK` on every package. The reset pin has no
      alternate location on this part, unlike CH32X035, whose RST moves with the
      package, so there is one remap entry and it names the real pins.

  RCC:
    category: System
    settings:
      - name: High Speed Clock (HSE)
        choices:
          - { name: Disable }
          - { name: BYPASS clock source, signals: [OSC_IN] }
          - { name: Crystal / ceramic resonator, signals: [OSC_IN, OSC_OUT], default: true }
      - name: Master Clock Output (MCO)
        choices:
          - { name: Disable }
          - { name: SYSCLK }
          - { name: HSI }
          - { name: HSE }
          - { name: PLLCLK }
    # PD0/PD1 are the crystal pins out of reset and GPIO when AFIO_PCFR1[15] is set.
    # RM 10.3.2.2: "PD0 & PD1 remap bit ... 0: Pin is used as crystal pin; 1: Pin is
    # used as GPIO port." Index 0 is that reset state, so it has no macro.
    remaps:
      - name: PD0/PD1 as crystal pins (reset state)
        pins: { OSC_IN: PD0, OSC_OUT: PD1 }
      - name: PD0/PD1 as GPIO
        macro: GPIO_Remap_PD01
        pins: { OSC_IN: PD0, OSC_OUT: PD1 }

  GPIO:
    category: System
    notes: >
      The GPIO table's own entry. It carries no settings or remaps because the table
      is driven by `gpio:` below and by the per-pin assignments in `S.gpio`.

  USART1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM 10.3.2.2 (USART1_RM, PCFR1[2]) x 10.3.2.8 (USART1_RM_H, PCFR2[20:19]).
    # The field is THREE bits, {USART1_RM_H, USART1_RM}, which is why there are five
    # macros and not three. Index = the field value; an index the RM calls Reserved
    # is simply absent, because `macro` style applies the macro and never writes the
    # index into a register.
    remaps:
      - name: Default (RM 000)
        pins: { TX: PA9, RX: PA10, CK: PA8, CTS: PA11, RTS: PA12 }
      - name: "Fully mapping (RM 001)"
        macro: GPIO_PartialRemap1_USART1
        pins: { TX: PB6, RX: PB7, CK: PA8, CTS: PA11, RTS: PA12 }
      - name: "Fully mapped (RM 010)"
        macro: GPIO_PartialRemap2_USART1
        pins: { TX: PA4, RX: PA5, CK: PA3, CTS: PA2, RTS: PA13 }
      - name: "Fully mapped (RM 011)"
        macro: GPIO_PartialRemap3_USART1
        pins: { TX: PA5, RX: PA4, CK: PA6, CTS: PB7, RTS: PB8 }
      - name: "Fully mapped (RM 100)"
        macro: GPIO_PartialRemap4_USART1
        pins: { TX: PB11, RX: PB9, CK: PA6, CTS: PA14, RTS: PA13 }
      - name: "Fully mapped (RM 101)"
        macro: GPIO_FullRemap_USART1
        pins: { TX: PB12, RX: PA12, CK: PB6, CTS: PB7, RTS: PB8 }

  USART2:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM: USART2_RM PCFR1[3] + USART2_RM_H PCFR2[18]. RM value 01 is Reserved, so it
    # is not offered - the header's PartialRemap1 encodes that value and is therefore
    # deliberately NOT used here.
    remaps:
      - name: Default (RM 00)
        pins: { TX: PA2, RX: PA3, CK: PA4, CTS: PA0, RTS: PA1 }
      - name: "Partial (RM 10)"
        macro: GPIO_PartialRemap2_USART2
        pins: { TX: PA11, RX: PA12, CK: PA4, CTS: PA0, RTS: PA1 }
      - name: "Partial (RM 11)"
        macro: GPIO_FullRemap_USART2
        pins: { TX: PA12, RX: PA11, CK: PA4, CTS: PA0, RTS: PA1 }

  USART3:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM 10.3.2.2: USART3_RM PCFR1[5:4]. Value 01 is Reserved.
    remaps:
      - name: Default (RM 00)
        pins: { TX: PB10, RX: PB11, CK: PB12, CTS: PB13, RTS: PB14 }
      - name: "Partial (RM 10)"
        macro: GPIO_PartialRemap_USART3
        pins: { TX: PD1, RX: PD0, CK: PB12, CTS: PB13, RTS: PB14 }
      - name: "Partial (RM 11)"
        macro: GPIO_FullRemap_USART3
        pins: { TX: PD0, RX: PD1, CK: PB12, CTS: PB13, RTS: PB14 }

  USART4:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Asynchronous, signals: [TX, RX] }
          - { name: Synchronous, signals: [TX, RX, CK] }
      - name: Hardware Flow Control
        choices:
          - { name: Disable }
          - { name: CTS/RTS, signals: [CTS, RTS] }
    # RM 10.3.2.8: USART4_RM PCFR2[16].
    remaps:
      - name: Default (RM 0)
        pins: { TX: PB0, RX: PB1, CK: PB2, CTS: PB3, RTS: PB4 }
      - name: "Fully mapping (RM 1)"
        macro: GPIO_Remap_USART4
        pins: { TX: PA5, RX: PB5, CK: PA6, CTS: PA7, RTS: PA15 }

  SPI1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Full-Duplex Master, signals: [NSS, SCK, MISO, MOSI] }
          - { name: Full-Duplex Slave, signals: [NSS, SCK, MISO, MOSI] }
    # RM: SPI1_RM PCFR1[0] + SPI1_RM_H PCFR2[24]. Two bits, four states.
    remaps:
      - name: Default (RM 00)
        pins: { NSS: PA4, SCK: PA5, MISO: PA6, MOSI: PA7 }
      - name: "Full (RM 01)"
        macro: GPIO_PartialRemap1_SPI1
        pins: { NSS: PA15, SCK: PB3, MISO: PB4, MOSI: PB5 }
      - name: "Fully mapped (RM 10)"
        macro: GPIO_PartialRemap2_SPI1
        pins: { NSS: PA12, SCK: PB6, MISO: PB8, MOSI: PB7 }
      - name: "Fully mapped (RM 11)"
        macro: GPIO_FullRemap_SPI1
        pins: { NSS: PB12, SCK: PB6, MISO: PB8, MOSI: PB7 }

  I2C1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: I2C, signals: [SCL, SDA] }
    # RM: I2C1_RM PCFR1[1] + I2C1_RM_H PCFR2[23]. RM value 01 is Reserved. The RM
    # also lists SMBA/PB5 on every mapping; it is a separate signal the SPL reaches
    # through the same macro, so it is modelled as a second choice rather than a
    # fourth pin that would have to be claimed to use I2C at all.
    remaps:
      - name: Default (RM 00)
        pins: { SCL: PB6, SDA: PB7 }
      - name: "Fully mapping (RM 10)"
        macro: GPIO_PartialRemap1_I2C1
        pins: { SCL: PA13, SDA: PA12 }
      - name: "Fully mapped (RM 11)"
        macro: GPIO_FullRemap_I2C1
        pins: { SCL: PB9, SDA: PB11 }

  TIM1:
    category: Timers
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH1] }
          - { name: PWM Generation CH1, signals: [CH1] }
          - { name: PWM Generation CH1 CH1N, signals: [CH1, CH1N] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
          - { name: PWM Generation CH2 CH2N, signals: [CH2, CH2N] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
          - { name: PWM Generation CH3 CH3N, signals: [CH3, CH3N] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR, signals: [ETR] }
      - name: Break Input
        choices:
          - { name: Disable }
          - { name: Activate-Break-Input, signals: [BKIN] }
    # RM: TIM1_RM PCFR1[7:6] + TIM1_RM_H PCFR2[22] = THREE bits, six macros.
    # Value 110 is not documented by the RM (the table goes 101 then 111), and 111
    # "controls LSI inputs only" - a clock function, not a pin route - so neither is
    # offered here.
    remaps:
      - name: Default (RM 000)
        pins: { ETR: PA12, CH1: PA8, CH2: PA9, CH3: PA10, CH4: PA11, BKIN: PB12, CH1N: PB13, CH2N: PB14, CH3N: PB15 }
      - name: "Fully mapped (RM 001)"
        macro: GPIO_PartialRemap1_TIM1
        pins: { ETR: PA12, CH1: PA8, CH2: PA9, CH3: PA10, CH4: PA11, BKIN: PA6, CH1N: PA7, CH2N: PB0, CH3N: PB1 }
      - name: "Fully mapping (RM 010)"
        macro: GPIO_PartialRemap2_TIM1
        pins: { ETR: PB6, CH1: PA1, CH2: PA7, CH3: PA14, CH4: PB1, BKIN: PA13, CH1N: PB11, CH2N: PB0, CH3N: PB9 }
      - name: "Fully mapped (RM 011)"
        macro: GPIO_PartialRemap3_TIM1
        pins: { ETR: PA3, CH1: PA1, CH2: PA7, CH3: PA14, CH4: PB1, BKIN: PA13, CH1N: PB11, CH2N: PB0, CH3N: PB9 }
      - name: "Fully mapped (RM 100)"
        macro: GPIO_PartialRemap4_TIM1
        pins: { ETR: PB6, CH1: PB7, CH2: PB8, CH3: PB12, CH4: PA2, BKIN: PA12, CH1N: PA14, CH2N: PB1, CH3N: PB9 }
      - name: "Fully mapped (RM 101)"
        macro: GPIO_PartialRemap5_TIM1
        pins: { ETR: PA13, CH1: PB1, CH2: PB8, CH3: PB6, CH4: PA3, BKIN: PA12, CH1N: PA14, CH2N: PA1, CH3N: PB7 }

  TIM2:
    category: Timers
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH1_ETR] }
          - { name: PWM Generation CH1, signals: [CH1_ETR] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH2] }
          - { name: PWM Generation CH2, signals: [CH2] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH3] }
          - { name: PWM Generation CH3, signals: [CH3] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: Input Capture direct mode, signals: [CH4] }
          - { name: PWM Generation CH4, signals: [CH4] }
    # RM: TIM2_RM PCFR1[9:8] + TIM2_RM_H PCFR2[21] = THREE bits. Channel 1 and ETR
    # are one physical pin on every mapping, so they are ONE signal - the same call
    # CH32V006 makes, and for the same reason.
    remaps:
      - name: Default (RM 000)
        pins: { CH1_ETR: PA0, CH2: PA1, CH3: PA2, CH4: PA3 }
      - name: "Partial (RM 001)"
        macro: GPIO_PartialRemap1_TIM2
        pins: { CH1_ETR: PA15, CH2: PB3, CH3: PA2, CH4: PA3 }
      - name: "Partial (RM 010)"
        macro: GPIO_PartialRemap2_TIM2
        pins: { CH1_ETR: PA0, CH2: PA1, CH3: PB10, CH4: PB11 }
      - name: "Fully mapping (RM 011)"
        macro: GPIO_PartialRemap3_TIM2
        pins: { CH1_ETR: PA15, CH2: PB3, CH3: PB10, CH4: PB11 }
      - name: "Fully mapping (RM 100)"
        macro: GPIO_PartialRemap4_TIM2
        pins: { CH1_ETR: PA3, CH2: PA2, CH3: PB12, CH4: PA6 }
      - name: "Fully mapping (RM 101)"
        macro: GPIO_PartialRemap5_TIM2
        pins: { CH1_ETR: PA12, CH2: PA2, CH3: PB12, CH4: PA6 }
      - name: "Fully mapping (RM 111)"
        macro: GPIO_FullRemap_TIM2
        pins: { CH1_ETR: PA12, CH2: PB8, CH3: PA5, CH4: PA4 }

  TIM3:
    category: Timers
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: PWM Generation CH1, signals: [CH1] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: PWM Generation CH2, signals: [CH2] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: PWM Generation CH3, signals: [CH3] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: PWM Generation CH4, signals: [CH4] }
    # RM 10.3.2.2: TIM3_RM PCFR1[10]. One bit. Note CH3/CH4 do not move.
    remaps:
      - name: Default (RM 0)
        pins: { CH1: PA6, CH2: PA7, CH3: PB0, CH4: PB1 }
      - name: "Remapping (RM 1)"
        macro: GPIO_Remap_TIM3
        pins: { CH1: PB4, CH2: PB5, CH3: PB0, CH4: PB1 }

  TIM4:
    category: Timers
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: PWM Generation CH1, signals: [CH1] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: PWM Generation CH2, signals: [CH2] }
      - name: Channel3
        choices:
          - { name: Disable }
          - { name: PWM Generation CH3, signals: [CH3] }
      - name: Channel4
        choices:
          - { name: Disable }
          - { name: PWM Generation CH4, signals: [CH4] }
    # RM 10.3.2.2: TIM4_RM PCFR1[12]. CH3/CH4 do not move.
    remaps:
      - name: Default (RM 0)
        pins: { CH1: PB6, CH2: PB7, CH3: PB8, CH4: PB9 }
      - name: "Remapping (RM 1)"
        macro: GPIO_Remap_TIM4
        pins: { CH1: PB10, CH2: PB11, CH3: PB8, CH4: PB9 }

  LPTIM:
    category: Timers
    settings:
      - name: Channel1
        choices:
          - { name: Disable }
          - { name: PWM Generation CH1, signals: [CH1] }
      - name: Channel2
        choices:
          - { name: Disable }
          - { name: PWM Generation CH2, signals: [CH2] }
      - name: Clock Source
        choices:
          - { name: Internal Clock }
          - { name: ETR, signals: [ETR] }
      - name: Output Compare
        choices:
          - { name: Disable }
          - { name: Output Compare, signals: [OC] }
    # RM 10.3.2.8: LPTIM_RM PCFR2[25]. One bit.
    remaps:
      - name: Default (RM 0)
        pins: { CH1: PB12, CH2: PB13, ETR: PB14, OC: PB15 }
      - name: "Remapping (RM 1)"
        macro: GPIO_Remap_LPTIM
        pins: { CH1: PB5, CH2: PB7, ETR: PB6, OC: PB2 }

  CAN1:
    category: Connectivity
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Normal, signals: [RX, TX] }
    # RM: CAN1_RM PCFR1[14:13]. RM value 01 is Reserved, so the header's Remap1_CAN1
    # (which encodes 01) is not offered. GPIO_Remap1_CAN1 covers RM 10.
    remaps:
      - name: Default (RM 00)
        pins: { RX: PA11, TX: PA12 }
      - name: "Remapping (RM 10)"
        macro: GPIO_Remap1_CAN1
        pins: { RX: PB8, TX: PB9 }
      - name: "Remapping (RM 11)"
        macro: GPIO_Remap2_CAN1
        pins: { RX: PD0, TX: PD1 }

  ADC1:
    category: Analog
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Independent, signals: [] }
    notes: >
      Analog peripheral: its channels are pins, not alternate functions, so they are
      modelled as `codegen.analog_signals` rather than as remaps. The DS reserves
      ADC channels 10 to 12 as internal (temperature, Vrefint, VBAT) on the L103.
      The channel to pin map is NOT yet extracted - see CH32L103.notes.md, open
      questions. Nothing here claims a pin, so the figure above is honest about it.

  OPA1:
    category: Analog
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Operational amplifier, signals: [P0, P1, N0, N1] }

  CMP1:
    category: Analog
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Comparator, signals: [P0, P1, N1] }

  IWDG:
    category: Watchdog
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Independent watchdog, signals: [] }

  WWDG:
    category: Watchdog
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Window watchdog, signals: [] }

  PWR:
    category: System
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Power interface, signals: [] }

  FLASH:
    category: System
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Flash interface, signals: [] }

  EXTI:
    category: System
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: External interrupt controller, signals: [] }
    notes: >
      The EXTI controller itself claims no pins; individual lines are claimed by the
      pins configured as `GPIO_EXTI` in the GPIO table, and the `exti:` block below
      is what maps a pin number to a line.

  DMA1:
    category: System
    settings:
      - name: Mode
        choices:
          - { name: Disable }
          - { name: Direct memory access, signals: [] }

gpio:
  # DS/EVT ch32l103_gpio.h:25-27 - THREE speeds. Unlike CH32V006 (one) and
  # CH32X035 (one), this part really offers a choice, so the GPIO table renders a
  # selector with exactly these three.
  speeds:
    - { name: "10 MHz", macro: GPIO_Speed_10MHz }
    - { name: "2 MHz",  macro: GPIO_Speed_2MHz }
    - { name: "50 MHz", macro: GPIO_Speed_50MHz }

  # ch32l103_gpio.h:33-40 - EIGHT members, the full set, INCLUDING the two
  # open-drain modes CH32X035 does not have. `class:` is the direction the mode
  # drives, so a constraint can say "no output function" once.
  modes:
    - { name: Output Push Pull,             macro: GPIO_Mode_Out_PP, class: out }
    - { name: Output Open Drain,            macro: GPIO_Mode_Out_OD, class: out }
    - { name: Alternate Function Push Pull, macro: GPIO_Mode_AF_PP, class: out }
    - { name: Alternate Function Open Drain, macro: GPIO_Mode_AF_OD, class: out }
    - { name: Analog,                       macro: GPIO_Mode_AIN,    class: analog }

  # Mode `Input` folds the PULL into the macro, so these are keyed by pull name.
  input_modes:
    - { name: No pull,   macro: GPIO_Mode_IN_FLOATING }
    - { name: Pull-up,   macro: GPIO_Mode_IPU }
    - { name: Pull-down, macro: GPIO_Mode_IPD }

codegen:
  header: ch32l103.h
  sdk:
    evt: l103
    series: ch32l103
  # ch32l103_rcc.h:120-124,200-202. HB / PB2 / PB1 - NOT APB2. This is the field
  # that has already been wrong once in this repo on a sibling part.
  gpio_clock: { fn: RCC_PB2PeriphClockCmd, port: RCC_PB2Periph_GPIO$PORT, afio: RCC_PB2Periph_AFIO }
  # ch32l103_gpio.h:170 - GPIO_PinRemapConfig(GPIO_Remap, NewState). Macro style,
  # like CH32X035: the macro packs the register AND the value, and an entry with no
  # macro emits nothing.
  remap:
    style: macro
    fn: GPIO_PinRemapConfig
    enable: ENABLE
  # A translation table for stored speed names, NOT the offer - `gpio.speeds` is the
  # offer. Kept so a .wchproj written elsewhere still generates code that compiles.
  speeds:
    "10 MHz": GPIO_Speed_10MHz
    "2 MHz": GPIO_Speed_2MHz
    "50 MHz": GPIO_Speed_50MHz
    Low: GPIO_Speed_2MHz
    Medium: GPIO_Speed_10MHz
    High: GPIO_Speed_50MHz
  # The debug interface and the reset pin are option-byte controlled. Never driven.
  skip_signals:
    SYS: true

clock:
  # RM 3.3.2: "HSI is a high-speed clock signal generated by the RC oscillator of
  # 8MHz in the system" - an internal RC, not adjustable.
  sources:
    HSI: { mhz: 8, fixed: true }
    # RM 3.3.2: "An external 3-25MHz external oscillator". Bounded by the DS
    # electrical tables, which name the same range.
    HSE: { mhz: 8, min_mhz: 3, max_mhz: 25 }
    LSI: { khz: 40, fixed: true }
  pll:
    # RM 3.3.2 / 3.3.3: the PLL supports three configurations - 48, 72 and 96 MHz -
    # and USB needs one of exactly those three.
    inputs:
      - { name: HSI, source: HSI, div: 1 }
      - { name: HSE, source: HSE, div: 1 }
    multipliers: [6, 9, 12]
  sysclk:
    sources: [HSI, HSE, PLLCLK]
    max_mhz: 96
  prescalers:
    HB:  { options: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512], max_mhz: 96,
           label: "HB prescaler (HPRE) -> HCLK" }
    PB2: { options: [1, 2, 4, 8], source: HB, max_mhz: 96,
           label: "PB2 prescaler (PPRE2) -> APB2" }
    PB1: { options: [1, 2, 4, 8, 16], source: HB, max_mhz: 96,
           label: "PB1 prescaler (PPRE1) -> APB1" }
    # RM 3.3: "The ADC clock should not exceed 48MHz".
    ADC: { options: [1, 2, 4, 6, 8], source: HB, max_mhz: 48,
           label: "ADC prescaler (ADCPRE)" }
  hse_peripheral: RCC
  hse_setting: High Speed Clock (HSE)
  # The crystal pins are PD0 and PD1 on this part - their default function is
  # OSC_IN/OSC_OUT and their GPIO name is PD0/PD1 (DS pinout figures print
  # `OSC_IN/PD0`; RM AFIO_PCFR1[15] PD0PD1_RM says which one the pin is).
  hse_signals: [OSC_IN, OSC_OUT]
  notes: >
    Domains on this part are HB, PB2 and PB1, and the clock-enable functions carry
    those names (RCC_HBPeriphClockCmd / RCC_PB2PeriphClockCmd / RCC_PB1PeriphClockCmd),
    which is why `codegen.gpio_clock` says RCC_PB2PeriphClockCmd rather than
    RCC_APB2PeriphClockCmd. The PLL multiplier list is the three configurations the
    RM names for USB; the register encodings behind them are NOT yet read, so
    `codegen.rcc` is deliberately absent and the generated C emits a TODO naming it
    rather than a guessed bit position.
