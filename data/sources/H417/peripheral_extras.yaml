      # `width_bit` used to be a SEPARATE dropdown carrying "8/16/24/32-bit" only for
      # UHSIF_GPIO_Init's 5th argument, disconnected from which pads were claimed - the
      # exact "do not duplicate a setting" trap (data/FORMAT.md): a project could pick
      # "Mode: Enabled" (claims all 49) and "Data bus width: 8-bit" (claims 8 via the
      # SDK argument alone) and the two would disagree about how many data pads are
      # really in use. Removed: `Mode`'s own choice names ARE the width now (below),
      # the single source for both the pin claim and (once UHSIF_GPIO_Init's five-
      # argument-in-one-call gap is closed, board 2026-09-13T01:14Z) the SDK argument.
      signal_pins:
        CLK: [{ pin: PC0 }, { pin: PF14 }, { pin: PD9 }, { pin: PF11 }]
        # PORT0-7: UHSIF_PORT_RM[1:0] moves all eight together (CH32H417RM.md:11770-
        # 11801, same register as SDMMC_RM) - `signal_groups:` below says so. Three
        # slots each, index 0/1/2 = RM 00/01/1x, same order for every member (checked:
        # `validate_mcu.py` now verifies this). RM=00 and RM=01 give PORT0/1/2 the SAME
        # pin (PF12/PF13/PE7) - a real, repeated hardware fact, not dead data: only
        # RM=1x moves them (to PC1/PC2/PC3).
        PORT0: [{ pin: PF12 }, { pin: PF12 }, { pin: PC1 }]
        PORT1: [{ pin: PF13 }, { pin: PF13 }, { pin: PC2 }]
        PORT2: [{ pin: PE7 }, { pin: PE7 }, { pin: PC3 }]
        PORT3: [{ pin: PE8 }, { pin: PC1 }, { pin: PB0 }]
        PORT4: [{ pin: PE9 }, { pin: PC2 }, { pin: PB1 }]
        PORT5: [{ pin: PE10 }, { pin: PC3 }, { pin: PE10 }]
        PORT6: [{ pin: PE11 }, { pin: PB0 }, { pin: PE11 }]
        PORT7: [{ pin: PE12 }, { pin: PB1 }, { pin: PE12 }]
        PORT8: [{ pin: PE13 }]
        PORT9: [{ pin: PE14 }]
        PORT10: [{ pin: PE15 }]
        PORT11: [{ pin: PB10 }]
        PORT12: [{ pin: PB11 }]
        PORT13: [{ pin: PB12 }]
        PORT14: [{ pin: PB13 }]
        PORT15: [{ pin: PB14 }]
        PORT16: [{ pin: PD10 }]
        PORT17: [{ pin: PD11 }]
        PORT18: [{ pin: PD12 }]
        PORT19: [{ pin: PD13 }]
        PORT20: [{ pin: PD14 }]
        PORT21: [{ pin: PD15 }]
        PORT22: [{ pin: PF0 }]
        PORT23: [{ pin: PF1 }]
        PORT24: [{ pin: PF2 }]
        PORT25: [{ pin: PC6 }]
        PORT26: [{ pin: PC7 }]
        PORT27: [{ pin: PC8 }]
        PORT28: [{ pin: PC9 }]
        PORT29: [{ pin: PA13 }]
        PORT30: [{ pin: PA14 }]
        PORT31: [{ pin: PA15 }]
        PORT32: [{ pin: PC10 }]
        PORT33: [{ pin: PC11 }]
        PORT34: [{ pin: PC12 }]
        PORT35: [{ pin: PD0 }]
        PORT36: [{ pin: PD1 }]
        PORT37: [{ pin: PD2 }]
        PORT38: [{ pin: PD3 }]
        PORT39: [{ pin: PD4 }]
        PORT40: [{ pin: PD5 }]
        PORT41: [{ pin: PD6 }]
        PORT42: [{ pin: PD7 }]
        PORT43: [{ pin: PF3 }]
        PORT44: [{ pin: PF4 }]
        PORT45: [{ pin: PF5 }]
        PORT46: [{ pin: PE0 }]
        PORT47: [{ pin: PE1 }]
      # `remap_by_package:` - the RM states a per-package recommendation outright, not
      # left to be inferred from bonding alone: CH32H417RM.md:11839-11845, right after
      # Table 9-33's own three mapping columns - "Note: The chip packaged with 56/68
      # pins is recommended to use the mapping configuration of 01b; It is recommended
      # to use 1xb mapping configuration for chips packaged as 88 pins." Index 0 (RM=00,
      # this part's reset default) bonds NONE of PORT0-7 on QFN68 at all (its pins are
      # PF12/PF13/PE7/PE8/PE9/PE10/PE11/PE12, none of which exist on that package -
      # checked against data/packages/packages.yaml's own QFN68 pin list). Index 1
      # (RM=01) still leaves PORT0-2 unbonded there (PF12/PF13/PE7 again), but bonds
      # PORT3-7 (PC1/PC2/PC3/PB0/PB1, all real QFN68 pads) - the RM's own recommendation,
      # not a full fix, and not claimed as one. Index 2 (RM=1x) is a full fix on QFN88:
      # PC1/PC2/PC3/PB0/PB1/PE10/PE11/PE12 are ALL bonded there, checked the same way.
      # QFN128 needs no override - its own bonding already has every RM=00 pin, matching
      # the reset default it would otherwise silently rely on.
      signal_groups:
        - signals: [PORT0, PORT1, PORT2, PORT3, PORT4, PORT5, PORT6, PORT7]
          remap_by_package: { QFN68: 1, QFN88: 2 }
      notes: >
        Its driver is a prebuilt libUHSIF.a (Evt/EXAM/UHSIF/UHSIF_SLAVE/Common) rather than
        SPL source, so UHSIF_GPIO_Init's body cannot be read directly - `uhsif_port_rm`/
        `uhsif_clk_rmm`'s physical-pad question stays open (board 2026-09-14T02:20Z: the
        file's own PORT0-7 candidates are now grouped and RM-ordered per the recovered
        Table 9-32 columns above, which is a DIFFERENT and now-answered question from
        "which physical pin does argument 2 select" - UHSIF_GPIO_Init takes the mapping
        as a plain callable argument, not an unwritable register field the way SDMMC_RM
        is, so once the physical mapping is confirmed this is a citation away from
        working end to end, not a second schema gap). The per-width claim (Mode's own
        choices, above) is answered: `tools/recover_h417_uhsif_pdf.py`, declared at
        `data/sources/H417/UHSIF_port_functions.yaml`.

  # SERDES - RM ch.20, "Serial-parallel Interconversion Controller and Transceiver". Unlike
  # UHSIF, its driver IS in the SPL: ch32h417_serdes.h/.c under Peripheral/inc and /src.
  #
  # ONE differential pad set (SERDES_TXP/TXN/RXP/RXN, already routed above) is driven by TWO
  # independent register-block controllers, SDS1 and SDS2 (ch32h417.h:1827-1828, base
  # 0x40027C00 / 0x40027C40 - RM ch.20 intro, CH32H417RM.md:23641-23642). Each controller is
  # configured by its OWN SDS_Config(SDSx, &cfg) call (ch32h417_serdes.h:81) with its own
  # SDS_CFG_TypeDef, and the EVT's own full-duplex example calls it twice - once per
  # controller, with different RxEn/TxEn/RxPowerUp/TxPowerUp - to pair one controller with the
  # PHY's Tx channel and the other with its Rx channel:
  # Evt/EXAM/SerDes/FullDuxTrans/Common/hardware.c:16,33-44 (`#define SDS1_TX__SDS2_RX`,
  # `SDS_TypeDef *TxSDS = SDS1; *RxSDS = SDS2;`) and :64,95-120,188,192 (`sds_initial(TxSDS,
  # 1)` sets TxEn/TxPowerUp, `sds_initial(RxSDS, 0)` sets RxEn/RxPowerUp). That is
  # `channel_params.instances` - deliverable E's mechanism, built for LTDC's two layers and
  # exactly this shape: one struct, one function, the HANDLE varying per instance - not a
  # flat `params:` block, which could only ever apply to one of the two controllers.
  SERDES:
    yaml: |
      channel_params:
        struct: SDS_CFG_TypeDef
        applies_per: controller
        instances:
          1: { sdk_call: SDS_Config, handle: SDS1, setting: Mode, active_choices: [Enabled] }
          2: { sdk_call: SDS_Config, handle: SDS2, setting: Mode, active_choices: [Enabled] }
        params:
          # Every field is a 1-bit member of SDS_CFG_TypeDef (ch32h417_serdes.h:62-79, struct
          # order preserved here) and every default is the REGISTER's own reset value
          # (R32_SERDESx_CTRL, RM 20.3.1, CH32H417RM.md:23785-23864, reset 0x00041207) - not a
          # guess. The role-defining fields (rx_en/tx_en/rx_power_up/tx_power_up) reset to
          # 0/disabled on BOTH controllers, so a fresh project claims the pads and drives
          # nothing until the user picks a role for each controller - which is what this
          # per-instance editor is for.
          - key: clear_all
            name: Clear interrupt flags and FIFO
            sdk_field: ClearALL
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: true
            help: "R32_SERDESx_CTRL.CLR_ALL, CH32H417RM.md:23859-23864. Reset value 1."
          - key: reset_link
            name: Reset link layer
            sdk_field: ResetLink
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: true
            help: "R32_SERDESx_CTRL.RESET_LINK, CH32H417RM.md:23852-23858. Reset value 1."
          - key: reset_phy
            name: Reset physical layer
            sdk_field: ResetPHY
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: true
            help: "R32_SERDESx_CTRL.RESET_PHY, CH32H417RM.md:23842-23851. Reset value 1."
          - key: int_busy_en
            name: Auto-pause before transmit-complete flag clears
            sdk_field: INIBusy_En
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: "R32_SERDESx_CTRL.INT_BUSY_EN, CH32H417RM.md:23833-23841. Reset value 0."
          - key: rx_polarity
            name: Swap RXP/RXN polarity
            sdk_field: SwitchRxPolarity
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: "R32_SERDESx_CTRL.RX_POLARITY, CH32H417RM.md:23832. Reset value 0."
          - key: rx_en
            name: Receive enable
            sdk_field: RxEn
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: >
              R32_SERDESx_CTRL.RX_EN, CH32H417RM.md:23825-23831. Reset value 0 - this is the
              field the EVT's receive-role controller sets to 1
              (hardware.c:117, `.RxEn = 1` inside `sds_initial(RxSDS, 0)`).
          - key: tx_en
            name: Transmit enable
            sdk_field: TxEn
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: >
              R32_SERDESx_CTRL.TX_EN, CH32H417RM.md:23818-23824. Reset value 0 - this is the
              field the EVT's transmit-role controller sets to 1
              (hardware.c:103, `.TxEn = 1` inside `sds_initial(TxSDS, 1)`).
          - key: dma_enable
            name: DMA enable
            sdk_field: DMA_Enable
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: >
              R32_SERDESx_CTRL.DMA_EN, CH32H417RM.md:23811-23817. Reset value 0; the EVT sets
              it 1 on both controllers (hardware.c:96,111).
          - key: rx_power_up
            name: Receive module power-up
            sdk_field: RxPowerUp
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: "R32_SERDESx_CTRL.RX_PWR_UP, CH32H417RM.md:23803-23809. Reset value 0."
          - key: tx_power_up
            name: Transmit module power-up
            sdk_field: TxPowerUp
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: "R32_SERDESx_CTRL.TX_PWR_UP, CH32H417RM.md:23796-23802. Reset value 0."
          - key: cont_en
            name: Replace idle SYNC with CONT + scrambling
            sdk_field: ReplaceSYNCwithCONT
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: "R32_SERDESx_CTRL.CONT_EN, CH32H417RM.md:23788-23792. Reduces EMI while idle. Reset value 0."
          - key: align_en
            name: Insert ALIGN signal when transmitting
            sdk_field: InsertAlign
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: true
            help: "R32_SERDESx_CTRL.ALIGN_EN, CH32H417RM.md:23787. Corrects frequency offset. Reset value 1."
      notes: >
        SDS1/SDS2 are the two independent controllers behind the one differential pad set
        (ch32h417.h:1827-1828); `channel_params` fills and applies SDS_CFG_TypeDef once per
        controller via SDS_Config() (ch32h417_serdes.h:81), so enabling `Mode` emits BOTH
        calls and the user picks each controller's role with rx_en/tx_en. The RM's own
        bring-up sequence (20.2.1/20.2.2, CH32H417RM.md:23653-23706) sets these bits across
        MORE THAN ONE register write, waiting for PLL lock between them; one struct fill per
        controller covers the steady-state configuration a single SDS_Config() call can
        express, not that multi-step sequence - recorded rather than modelled as a sequence,
        since `channel_params` applies one struct once. SDS_RTX_Ctrl, SDS_DMA_Tx_CFG,
        SDS_DMA_Rx_CFG and the interrupt-config/read calls are runtime/data-path APIs with no
        init-time analogue and are not modelled here.

  # PIOC - checked and NOT a UHSIF-shaped gap; a DIFFERENT one. `ch32h417_pioc.h` is the
  # only file: no `ch32h417_pioc.c` exists anywhere under Peripheral/src, so there is no
  # `PIOC_Init()` and NO function of any kind that takes `PIOC_TypeDef*`. What the header
  # gives instead is raw register-address macros (`R8_PORT_DIR`, `R8_SYS_CFG`, ...) and one
  # struct with the same layout for direct access - and RM ch.34 (CH32H417RM.md:49360-49399)
  # explains why: PIOC is not a peripheral in the usual sense, it is a SECOND, EMBEDDED CPU
  # ("Programmable Protocol I/O Microcontroller" - RISC8B core, 66 own instructions, a
  # 2048-word program ROM multiplexed out of system SRAM, its own 6-level stack). What it
  # DOES when switched on is defined by a PROGRAM loaded into that ROM - written in RISC8B
  # assembly against a SEPARATE toolchain (`CHRISC8B.PDF`, `Evt/EXAM/PIOC/*/Common/Asm/*.ASM`
  # for the five protocols this part's EVT ships: 1-Wire, I2C, NEC IR, Single-Wire, UART) -
  # not by filling an init struct. The handful of host-side control bits that exist
  # (`RB_MST_CLK_GATE`, `RB_MST_RESET`, `RB_MST_IO_EN0/1`, `ch32h417_pioc.h:88-92`) are real,
  # but there is no SDK call to set them either, and modelling them alone - with no way to
  # load the program that makes them mean anything - would be `params:` that fills fields no
  # `codegen.init_structs` entry could ever apply, since none of this is a function call.
  # Not modelled; TASKS.md line, and the wording of AGENT-1's cycle brief that promised "all
  # five targets have real SPL drivers ... so the task keeps its normal shape" was right for
  # four of five and wrong for this one - corrected here rather than forced to fit.
  PIOC:
    comment: |
      NO SDK FUNCTION APPLIES ANY STRUCT HERE - there is no `ch32h417_pioc.c`, so no
      `PIOC_Init()` and nothing else that takes a `PIOC_TypeDef*`. What this part calls
      PIOC is a second, embedded CPU (RM ch.34, "Programmable Protocol I/O Microcontroller":
      a RISC8B core with 66 of its OWN instructions and a 2048-word program ROM multiplexed
      out of system SRAM), and its behaviour is set by loading a RISC8B assembly PROGRAM
      into that ROM - a separate toolchain (`CHRISC8B.PDF`,
      Evt/EXAM/PIOC/*/Common/Asm/*.ASM for this part's five shipped protocols: 1-Wire, I2C,
      NEC, Single-Wire, UART) - not by filling an init struct this generator could emit.
      `params:` is deliberately empty rather than filled with register-address rows no
      `codegen.init_structs` entry could ever apply. TASKS.md carries the finding.

  # ECDC - RM ch.41 "Encryption Module". `ECDC_Init(ECDC_InitTypeDef*)`
  # (ch32h417_ecdc.h:115) takes the struct alone - one engine on this part - `no_handle:
  # true`, the DVP/LTDC/SDIO/IPC/SDMMC shape. Routes no pin (`pins: none` above): a pure
  # internal block, key/plaintext/ciphertext all move over the bus, not a pad.
  #
  # `Key` (ECDC_KEY_TypeDef*, ch32h417_ecdc.h:91) MUST be embedded, not left unmodelled -
  # this is FMC's null-timing-pointer defect again, found by reading the SDK rather than
  # by guessing: `ECDC_Init()` (ch32h417_ecdc.c:49) calls `ECDC_SetKey(ECDC_InitStruct->
  # Key)` UNCONDITIONALLY, and `ECDC_SetKey()` (:112-118) dereferences that pointer with
  # NO null check on any of its four unconditional words. A generated call with `Key`
  # left at the struct's `{0}` NULL is not a missing feature, it is a guaranteed NULL
  # dereference / hard fault the instant this peripheral is switched on - worse than the
  # TODO an unresolved `embed:` would leave. Embedded via AGENT-2's contract with every
  # field defaulted to 0 (`agents/BOARD.md` 2026-09-13T19:07Z), and the four upper words
  # only actually matter above 128-bit (`ECDC_SetKey()`'s own KLEN_MASK checks).
  # ZERO IS NOT A KEY: every field's help says so, loudly, because leaving a placeholder
  # here is required to avoid the crash while the real value is exactly the thing this
  # tool must never guess at - the application supplies its own key before first use.
  #
  # `IV` (ECDC_IV_TypeDef*, :92) is the opposite case and correctly stays unmodelled:
  # `ECDC_Init()` (:51) checks `... && ECDC_InitStruct->IV != NULL` before dereferencing
  # it, so a NULL IV is the SDK's own safe, intentional "not using CTR yet" state, not a
  # crash - the application supplies one when it is ready, same as Key but without the
  # forced placeholder. `ECDC_CTR_SetCounter()` (:117) is not modelled for the same
  # reason `Key`'s VALUE is not: real material, supplied by the application.
  ECDC:
    yaml: |
      params:
        - key: excute_mode
          name: Operation
          struct: ECDC_InitTypeDef
          sdk_field: ExcuteMode
          type: enum
          default: RAM block encrypt
          options:
            - { name: RAM block encrypt,   value: 130, sdk: ECDC_RAM_Encrypt }
            - { name: RAM block decrypt,   value: 138, sdk: ECDC_RAM_Decrypt }
            - { name: Single 128-bit encrypt, value: 2, sdk: ECDC_SingleTime_Encrypt }
            - { name: Single 128-bit decrypt, value: 10, sdk: ECDC_SingleTime_Decrypt }
          help: >
            ch32h417_ecdc.h:52-57 (`ECDC_ExcuteMode_TypeDef`), packs RB_ECDC_MODE_SEL
            (bit 3, CH32H417RM.md:60801-60808, encrypt/decrypt) and RB_ECDC_NORMAL_EN
            (bit 1, :60809-60818) with RB_ECDC_WRSRAM_EN (bit 7, :60781-60789, RAM-to-RAM
            vs a single 128-bit register block) into one value written straight into
            R32_ECDC_CTRL. This is a per-operation call as much as an init - the EVT's
            own example calls `ECDC_Init()` a second time with only this field changed
            to switch from encrypt to decrypt (hardware.c) - so it is exposed as the
            engine's INITIAL mode; application code changes it again for later calls.
        - key: algorithm
          name: Algorithm
          struct: ECDC_InitTypeDef
          sdk_field: Algorithm
          type: enum
          default: SM4
          options:
            - { name: SM4, value: 0, sdk: ECDCAlgorithm_SM4 }
            - { name: AES, value: 1, sdk: ECDCAlgorithm_AES }
          help: "R32_ECDC_CTRL RB_ECDC_ALGRM_MOD, bit 8 (CH32H417RM.md:60774-60779). Default matches ECDC_StructInit() (ch32h417_ecdc.c:80)."
        - key: block_cipher_mode
          name: Block cipher mode
          struct: ECDC_InitTypeDef
          sdk_field: BlockCipherMode
          type: enum
          default: CTR
          options:
            - { name: CTR, value: 0, sdk: ECDCBlockCipherMode_CTR }
            - { name: ECB, value: 1, sdk: ECDCBlockCipherMode_ECB }
          help: "R32_ECDC_CTRL RB_ECDC_CIPHER_MOD, bit 9 (CH32H417RM.md:60767-60773). Default matches ECDC_StructInit() (ch32h417_ecdc.c:81)."
        - key: key_len
          name: Key length
          struct: ECDC_InitTypeDef
          sdk_field: KeyLen
          type: enum
          default: 128-bit
          options:
            - { name: 128-bit, value: 0, sdk: ECDCKeyLen_128b }
            - { name: 192-bit, value: 1, sdk: ECDCKeyLen_192b }
            - { name: 256-bit, value: 2, sdk: ECDCKeyLen_256b }
          help: "R32_ECDC_CTRL RB_ECDC_KLEN_MASK[11:10] (CH32H417RM.md:60754-60766). AES only - SM4 is always 128-bit (RM 41.2). Default matches ECDC_StructInit() (ch32h417_ecdc.c:82)."
        - key: excute_endian
          name: Data endianness
          struct: ECDC_InitTypeDef
          sdk_field: ExcuteEndian
          type: enum
          default: Little
          options:
            - { name: Little, value: 0, sdk: ECDCExcuteEndian_Little }
            - { name: Big,    value: 1, sdk: ECDCExcuteEndian_Big }
          help: >
            R32_ECDC_CTRL RB_ECDC_DAT_MOD, bit 13 (CH32H417RM.md:60741-60752: "must be
            configured as big-endian mode for single 128-bit encryption/decryption
            operations"). Default matches ECDC_StructInit() (ch32h417_ecdc.c:83); the
            EVT's own RAM_Block example overrides it to Big regardless of that note
            (hardware.c) - this row lets a project match either.
        - key: key_31_0
          name: "Key[31:0] - REPLACE before use"
          struct: ECDC_KEY_TypeDef
          embed: key
          sdk_field: KEY_31T0
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_ecdc.h:73. ZERO IS A PLACEHOLDER, NOT A KEY - ECDC_Init() dereferences this struct unconditionally (ch32h417_ecdc.c:49), so it must be embedded with SOME value to avoid a NULL-pointer hard fault; the real key is the application's, set before first use."
        - key: key_63_32
          name: "Key[63:32] - REPLACE before use"
          struct: ECDC_KEY_TypeDef
          embed: key
          sdk_field: KEY_63T32
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_ecdc.h:74. Placeholder only, see Key[31:0]."
        - key: key_95_64
          name: "Key[95:64] - REPLACE before use"
          struct: ECDC_KEY_TypeDef
          embed: key
          sdk_field: KEY_95T64
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_ecdc.h:75. Placeholder only, see Key[31:0]."
        - key: key_127_96
          name: "Key[127:96] - REPLACE before use"
          struct: ECDC_KEY_TypeDef
          embed: key
          sdk_field: KEY_127T96
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_ecdc.h:76. Placeholder only, see Key[31:0]."
        - key: key_159_128
          name: "Key[159:128] - REPLACE before use (192/256-bit only)"
          struct: ECDC_KEY_TypeDef
          embed: key
          sdk_field: KEY_159T128
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_ecdc.h:77. Placeholder only. ECDC_SetKey() only writes this word when Key length is 192-bit or wider (ch32h417_ecdc.c:118-122)."
        - key: key_191_160
          name: "Key[191:160] - REPLACE before use (192/256-bit only)"
          struct: ECDC_KEY_TypeDef
          embed: key
          sdk_field: KEY_191T160
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_ecdc.h:78. Placeholder only, see Key[159:128]."
        - key: key_223_192
          name: "Key[223:192] - REPLACE before use (256-bit only)"
          struct: ECDC_KEY_TypeDef
          embed: key
          sdk_field: KEY_223T192
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_ecdc.h:79. Placeholder only. ECDC_SetKey() only writes this word when Key length is 256-bit (ch32h417_ecdc.c:123-126)."
        - key: key_255_224
          name: "Key[255:224] - REPLACE before use (256-bit only)"
          struct: ECDC_KEY_TypeDef
          embed: key
          sdk_field: KEY_255T224
          type: int
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_ecdc.h:80. Placeholder only, see Key[223:192]."
      notes: >
        `IV` is not modelled - see the peripheral comment above: `ECDC_Init()` null-checks
        it before use, so leaving it unset is the SDK's own safe "not using CTR yet"
        state, unlike `Key` (embedded above, all placeholder zeros). `ECDC_SetKey()`
        is applied automatically by the embed; `ECDC_CTR_SetCounter()` is not modelled,
        for the same reason `IV`'s VALUE is not - real material, supplied by the
        application.
