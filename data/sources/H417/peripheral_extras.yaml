          struct: FMC_SDRAM_TimingTypeDef
          embed: timing
          sdk_field: FMC_SelfRefreshTime
          type: int
          default: 15
          min: 0
          max: 15
          help: "ch32h417_fmc.h:186-187."
        - key: sdram_rowcycledelay
          name: Row cycle delay
          struct: FMC_SDRAM_TimingTypeDef
          embed: timing
          sdk_field: FMC_RowCycleDelay
          type: int
          default: 15
          min: 0
          max: 15
          help: "ch32h417_fmc.h:189-190."
        - key: sdram_writerecoverytime
          name: Write recovery time
          struct: FMC_SDRAM_TimingTypeDef
          embed: timing
          sdk_field: FMC_WriteRecoveryTime
          type: int
          default: 15
          min: 0
          max: 15
          help: "ch32h417_fmc.h:192-193."
        - key: sdram_rpdelay
          name: Row precharge delay
          struct: FMC_SDRAM_TimingTypeDef
          embed: timing
          sdk_field: FMC_RPDelay
          type: int
          default: 15
          min: 0
          max: 15
          help: "ch32h417_fmc.h:195-196."
        - key: sdram_rcddelay
          name: Row to column delay
          struct: FMC_SDRAM_TimingTypeDef
          embed: timing
          sdk_field: FMC_RCDDelay
          type: int
          default: 15
          min: 0
          max: 15
          help: "ch32h417_fmc.h:198-199."
      notes: >
        Flexible memory controller. The data and address buses are picked by WIDTH rather
        than switched on whole, because the width is a real register field
        (`FMC_BCRx.MWID[5:4]`, RM 40 Table 40-17; `FMC_MemoryDataWidth_8b/_16b/_32b` in
        ch32h417_fmc.h:278-280) and because a narrow bus is the common case, not the
        exception. An 8080 8-bit parallel TFT wants `Data bus width: 8-bit`,
        `Address lines: A0 only` (A0 is the panel's RS/DC - on an 8-bit bus A0 is the byte
        address, so the command register sits at the bank base and the data register one
        byte above), `Chip select: NE1`, and `NOR/PSRAM and NAND control: Read/write
        strobes` for the panel's RD and WR. That is eleven pins; switching the whole
        controller on used to claim 103. The panel's RESET and backlight are ordinary
        GPIO outputs and are not FSMC signals.
        `FMC_NORSRAMInit()` now emits, through AGENT-2's `embed:` mechanism
        (`agents/BOARD.md` 2026-09-13T19:07Z) for the two pointer-nested
        `FMC_NORSRAMTimingInitTypeDef` blocks. It covers Bank1/NE1 only (see the `bank`
        param's own comment - the "Chip select" row above is a checkbox, so more than one
        bank can be wired at once and this generator does not yet emit one call per bank),
        and it covers the NOR/PSRAM/SRAM controller only: `ETH`, `FMC_NAND` and
        `FMC_SDRAM` (SDRAM control above) are separate structs behind the same `embed:`
        contract, not modelled this cycle. Every timing default is the SLOWEST value the
        header's own range allows, not a real memory's number - CH32H417's own EVT ships
        no FMC example to check one against, unlike SDIO/SDMMC. Narrow every timing once
        the attached device's own datasheet is in hand.

  TKEY:
    comment: |
      TKEY HAS NO PAD OF ITS OWN, and this is the citation rather than an assumption from
      a sibling part. RM ch.13 "Touch Key Detection (TKEY)" (CH32H417RM.md:15745): "The
      detection channel reuses 16 external channels of the ADC, and the touch key
      detection is realized through the single conversion mode of the ADC module", and
      RM 13.1 (:15752): "For TKEY detection, the ADC module is needed. To enable TKEY,
      ensure that ADC is powered on (ADON=1), then set the TKENABLE bit in the ADC_CTLR1
      register to 1." The SPL agrees: ch32h417.h:1760-1761 defines TKey1 and TKey2 as
      `ADC_TypeDef *` at ADC1_BASE and ADC2_BASE, and :1880 defines ADC_TKENABLE as an
      ADC_CTLR1 bit. So the pads a touch design claims are ADC1/ADC2's IN0-IN15, and the
      user claims them on the ADC's `Channels` row - the same pad offered twice would be
      a conflict the silicon has not got. DS 1.4.13 and the model table's `ADC/TKey ...
      Channels 16+2` row say the same thing from the datasheet side.
    yaml: |
      pins:
        none: true
        source: "CH32H417RM.md:15745 (RM ch.13: the detection channels reuse the ADC's 16 external channels) and CH32H417DS0.md Table 2-1-1, which carries no TKEY function on any pin row"
      notes: >
        Touch-key capacitance detection: an operating mode of the two ADCs rather than a
        block with pads. Enabling it sets ADC_CTLR1.TKENABLE (ch32h417.h:1880) on an ADC
        that is already powered on, and the channel converted is the first of that ADC's
        regular sequence. Pick the pads on ADC1's or ADC2's `Channels` row; up to 16
        detection channels, one conversion at a time (RM 13.1).

  PWR:
    yaml: |
      pins:
        none: true
        source: "CH32H417DS0.md Table 2-1-1 and Tables 2-2-x: no pin row carries a function of this peripheral (checked by tools/coverage.py)"
        # Seven rails, and the DS states an ORDER between four of them once at the end of
        # 1.4.3 rather than in a table: VDD33 >= VDD33A >= VDDIO >= VIO18. Two more
        # (VDD12A, VDDK) are normally OUTPUTS of internal LDOs and only become inputs if
        # the designer moves the heat off the chip, and VBAT stands outside the ordering
        # because it is switched in only when the others are gone. Modelling that as flat
        # rows would lose the part a designer most needs: which rail may be above which.
        supplies:
          - name: VDD33
            pins: [VDD33]
            range: "2.4-3.6 V (3.15-3.45 V with USB2.0 or Ethernet)"
            note: >
              Main supply, and the highest rail. Powers some I/O pins, the system LDO and the
              built-in USB2.0 and Ethernet PHYs. Must not fall below 2.7 V in Stop mode or
              while VIO18 is switched from low to high. Decouple 0.1 uF per pin plus 10 uF at
              the main pin, next to the Ethernet signals.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDD33A
            pins: [VDD33A]
            range: "1.8-3.6 V (>= 3.0 V for HSADC, >= 2.4 V for ADC and DAC)"
            note: >
              Analog supply for the ADC, temperature sensor, HSADC, OPA, CMP, DAC and PLL.
              Match it to VDDIO when the OPA or DAC is used; otherwise it may be higher. Must
              not exceed VDD33.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDDIO
            pins: [VDDIO]
            range: "1.65-3.6 V"
            note: >
              I/O supply: sets the output high level of the regular I/O pins and feeds the I/O
              LDO that produces VIO18. Must not exceed VDD33 or VDD33A. When VIO18 rises from
              low to high, VDDIO's capacitance must be much larger than VIO18's or the inrush
              pulls VDDIO down. 0.1 uF per pin plus 10 uF at the main pin.
            source: "CH32H417DS0.md 1.4.3"
          - name: VIO18
            pins: [VIO18]
            range: "1.1-3.6 V"
            note: >
              Supply for the high-speed I/O pins. Normally GENERATED by the I/O LDO from
              VDDIO and set by software to 1.2, 1.8, 2.5 or 3.3 V, or switched off. The level
              after power-up is chosen by the pull-down resistor on the XO pin. Short it to
              VDDIO when low-voltage I/O is not needed. 0.1 uF per pin plus 2.2 uF at the
              main pin.
            source: "CH32H417DS0.md 1.4.3, Table 3-2"
          - name: VDD12A
            pins: [VDD12A]
            range: "1.17-1.27 V"
            note: >
              For the USB 3.0 module and the TH PHY. Normally an LDO OUTPUT derived from
              VDD33, so the pin is a decoupling node: 0.1 uF + 2.2 uF. May be fed from an
              external DC-DC instead to move the LDO's heat off the chip - then the external
              voltage must sit slightly above the LDO's output, and the LDO must be off.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDDK
            pins: [VDDK]
            range: "1.17-1.27 V"
            note: >
              Core supply, with the same double role as VDD12A: normally an LDO output from
              VDD33 and a decoupling node (0.1 uF per pin plus 2.2 uF at the main pin), or fed
              externally at a voltage slightly above the LDO's output.
            source: "CH32H417DS0.md 1.4.3"
          - name: VREFP
            pins: [VREFP]
            range: "2.4-3.6 V"
            note: >
              Reference input for the ADC, HSADC and DAC. Must not exceed VDD33A. Tie it to
              VDD33A for ratiometric conversions, or drive it from a reference - there is no
              internal reference pad.
            source: "CH32H417DS0.md 1.4.3"
          - name: VBAT
            pins: [VBAT]
            range: "1.8-3.6 V"
            note: >
              Optional backup supply, outside the VDD33 >= VDD33A >= VDDIO >= VIO18 ordering:
              it is only switched in when VDD33 and VDD33A are off, to run the RTC and the
              external 32 kHz oscillator.
            source: "CH32H417DS0.md 1.4.3"
          - name: VSS / VSSA
            pins: [VSS, VSSA]
            range: "0 V"
            note: >
              Ground, and the analog return for VDD33A and VREFP. Star VSSA to VSS at the pin
              rather than along the digital ground path.
            source: "CH32H417DS0.md Table 2-1-1"

  # UHSIF - the one peripheral on this part whose driver is NOT in the SPL.
  #
  # There is no ch32h417_uhsif.h in Evt/EXAM/SRC/Peripheral/inc. The driver ships as a
  # PREBUILT STATIC LIBRARY, Evt/EXAM/UHSIF/UHSIF_SLAVE/Common/libUHSIF.a, with its public
  # header beside it in the same folder. `tools/verify_sdk_names.py` was taught to index
  # driver headers that sit next to a `.a` (2026-09-13) precisely so these names are
  # CHECKED rather than trusted - without that the gate would have called every name below
  # non-existent, and the cheap way out would have been to leave UHSIF unmodelled: a
  # peripheral holding 49 pads and reaching no generated code.
  #
  # THE API IS ONE FIVE-ARGUMENT CALL, not an init struct:
  #   UHSIF_GPIO_Init( mode_select, uhsif_port_rm, uhsif_clk_rmm, clk_div, width_bit )
  #   ch32h417_uhsif.h:181, argument ranges documented at :169-180.
  #
  # WHY EVERY ROW IS `sdk_none:` DESPITE THAT CALL EXISTING. `sdk_args:` resolves
  # $HANDLE, $VALUE, $CHANNEL, $RANK and $INDEX (data/FORMAT.md "Say where in the SDK each
  # parameter goes"). There is no placeholder for ANOTHER PARAMETER'S VALUE, so a call
  # whose five arguments come from five different rows cannot be emitted: writing
  # `sdk_call: UHSIF_GPIO_Init` on each row would emit the call five times, each with one
  # real argument and four wrong ones. That is plausible-looking wrong code, which the
  # generator is forbidden to produce, so the rows carry the values and the C names the
  # gap. REQUEST to AGENT-2 on the board 2026-09-13T02:00Z.
  UHSIF:
    yaml: |
      params:
        - key: mode_select
          name: Mode
          sdk_none: true
          sdk_note: >
            UHSIF_GPIO_Init argument 1 (ch32h417_uhsif.h:181). See the peripheral comment:
            sdk_args has no placeholder for another parameter's value, so this five-argument
            call cannot be emitted from five rows.
          type: enum
          default: "Slave, FPGA"
          options:
            - { name: "Slave, FPGA", value: 0, sdk: DEF_UHSIF_SLAVE_FPGA_MODE }
            - { name: "Slave, SOC",  value: 1, sdk: DEF_UHSIF_SLAVE_SOC_MODE }
            - { name: "Master",      value: 2, sdk: DEF_UHSIF_MASTER_MODE }
          help: "ch32h417_uhsif.h:24-27. Master drives CLK; both slave modes receive it."

        - key: uhsif_port_rm
          name: Data pin mapping
          sdk_none: true
          sdk_note: "UHSIF_GPIO_Init argument 2 (ch32h417_uhsif.h:181)."
          type: enum
          default: "Mapping 0"
          options:
            - { name: "Mapping 0", value: 0, sdk: DEF_UHSIF_PINREMAP0 }
            - { name: "Mapping 1", value: 1, sdk: DEF_UHSIF_PINREMAP1 }
            - { name: "Mapping 2", value: 2, sdk: DEF_UHSIF_PINREMAP2 }
          help: >
            ch32h417_uhsif.h:35-37. WHICH PADS EACH MAPPING USES IS NOT MODELLED - the pin
            table is in Evt/EXAM/UHSIF/CH32H417 UHSIF Development Reference Manual-EN.pdf,
            which has no markdown conversion, and UHSIF_GPIO_Init itself is inside
            libUHSIF.a, so no readable source answers it. Until that is extracted,
            `signal_pins:` carries one fixed mapping and this row changes the generated
            argument only. The EVT's own example uses Mapping 2 (ch32h417_uhsif.c:35).

        - key: uhsif_clk_rmm
          name: Clock pin mapping
          sdk_none: true
          sdk_note: "UHSIF_GPIO_Init argument 3 (ch32h417_uhsif.h:181)."
          type: enum
          default: "Mapping 0"
          options:
