  # DVP - THE DATA WIDTH IS ALREADY A SETTING, so it is not offered a second time as a
  # dropdown that could disagree with it. `Mode` (Disable / 8-bit / 10-bit / 12-bit) is what
  # claims D8-D11, and `DVP_CR0.DATA_SIZE` has to say the same thing, so the member is
  # written as three `const:` rows with one dependency each - exactly one applies. A
  # separate editable width would let a project claim twelve pads and configure eight.
  dvp: &dvp_params |
    params:
      - key: datasize_8
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_8b
        depends_on: { setting: Mode, equals: 8-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:72). Fixed by the Mode row, which is what claims D8-D11."
      - key: datasize_10
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_10b
        depends_on: { setting: Mode, equals: 10-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:73). Fixed by the Mode row."
      - key: datasize_12
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_12b
        depends_on: { setting: Mode, equals: 12-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:74). Fixed by the Mode row."
      - key: hclk_pol
        name: PCLK edge
        struct: DVP_InitTypeDef
        sdk_field: DVP_HCLK_P
        type: enum
        default: Rising
        options:
          - { name: Rising , value: 0, sdk: DVP_Hclk_P_Rising }
          - { name: Falling, value: 1, sdk: DVP_Hclk_P_Falling }
        help: "DVP_CR0, the pixel-clock edge data is sampled on (ch32h417_dvp.h:77-78). DVP_StructInit() starts at Rising."
      - key: hsync_pol
        name: HSYNC polarity
        struct: DVP_InitTypeDef
        sdk_field: DVP_HSYNC_P
        type: enum
        default: Active low
        options:
          - { name: Active high, value: 0, sdk: DVP_Hsync_P_High }
          - { name: Active low , value: 1, sdk: DVP_Hsync_P_Low }
        help: >
          DVP_CR0 (ch32h417_dvp.h:81-82). The default follows the EVT drop rather than the
          macro that encodes 0: DVP_StructInit() sets DVP_Hsync_P_Low, whose value is 0x04.
      - key: vsync_pol
        name: VSYNC polarity
        struct: DVP_InitTypeDef
        sdk_field: DVP_VSYNC_P
        type: enum
        default: Active low
        options:
          - { name: Active low , value: 0, sdk: DVP_Vsync_P_Low }
          - { name: Active high, value: 1, sdk: DVP_Vsync_P_High }
        help: "DVP_CR0 (ch32h417_dvp.h:85-86). DVP_StructInit() starts at Low."
      - key: caprate
        name: Frame capture rate
        struct: DVP_InitTypeDef
        sdk_field: DVP_FrameCapRate
        type: enum
        default: Every frame
        options:
          - { name: Every frame   , value: 0, sdk: DVP_FrameCapRate_100P }
          - { name: Every 2nd frame, value: 1, sdk: DVP_FrameCapRate_50P }
          - { name: Every 4th frame, value: 2, sdk: DVP_FrameCapRate_25P }
        help: "DVP_CR1 (ch32h417_dvp.h:89-91). The SDK spells these 100P / 50P / 25P - the proportion of frames kept."
      - key: capmode
        name: Capture mode
        struct: DVP_InitTypeDef
        sdk_field: DVP_CaptureMode
        type: enum
        default: Snapshot
        options:
          - { name: Continuous, value: 0, sdk: DVP_CaptureMode_Continuous }
          - { name: Snapshot  , value: 1, sdk: DVP_CaptureMode_Snapshot }
        help: "DVP_CR1 (ch32h417_dvp.h:94-95). Snapshot is the EVT drop's own default (DVP_StructInit)."
      - key: jpeg
        name: JPEG mode
        struct: DVP_InitTypeDef
        sdk_field: DVP_JPEGMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR0 bit 6. The sensor sends a JPEG byte stream rather than raw pixels, so the row/column counts below stop describing the transfer."
      - key: rows
        name: Rows per frame
        struct: DVP_InitTypeDef
        sdk_field: DVP_ROW_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_ROW_NUM. The sensor's frame height in lines. 0 is the EVT drop's own starting value (DVP_StructInit) and means the field is left for your own code."
      - key: cols
        name: Bytes per row
        struct: DVP_InitTypeDef
        sdk_field: DVP_COL_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_COL_NUM. Counted in BYTES, not pixels, so an RGB565 line of 320 pixels is 640. 0 is DVP_StructInit()'s value."
      - key: crop
        name: Crop window
        struct: DVP_InitTypeDef
        sdk_field: DVP_Crop
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR1 bit 5. Captures a rectangle of the sensor's frame instead of all of it; the four window rows below apply only while it is on."
      - key: win_hoff
        name: Window horizontal offset
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_HOFFCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_HOFFCNT, in BYTES from the start of the line - the same unit as Bytes per row."
      - key: win_vst
        name: Window first line
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VST
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VST, the first line of the frame that is kept."
      - key: win_capcnt
        name: Window width
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_CAPCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_CAPCNT, bytes captured per line."
      - key: win_vline
        name: Window height
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VLine
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VLINE, lines captured per frame."
    notes: >
      Digital video port: a parallel camera interface. The Mode row picks the data width
      AND the pads it claims - 8-bit takes D0-D7, 10-bit adds D8-D9, 12-bit adds D10-D11 -
      and Parameter Settings writes the matching DVP_CR0.DATA_SIZE rather than offering the
      width a second time, so the pin plan and the register cannot disagree.
      THE TWO DMA BUFFER ADDRESSES ARE DELIBERATELY NOT ROWS. `DVP_DMA_BUF0_Addr` and
      `DVP_DMA_BUF1_Addr` (ch32h417_dvp.h:31-35) are pointers into your own program's
      memory - a symbol this tool has no way to know - so they are left at the struct's
      zero-initialiser, which is exactly what the vendor's own `DVP_StructInit()` sets them
      to (ch32h417_dvp.c). Assign `DVP->DMA_BUF0` / `DMA_BUF1` in the USER CODE block before
      `DVP_Cmd(ENABLE)`. Every other member of the struct is a row above.

  # IPC - the inter-processor channel between the V5F and V3F cores. It holds no pad (the
  # generator's `pins: { none: true }` stands), but it is not parameterless: which of the
  # four channels this core owns, and which of the two core IDs it sends to and listens on,
  # are exactly the planning decisions a two-core project has to write down somewhere.
  ipc: &ipc_params |
    params:
      - key: channel
        name: Channel
        struct: IPC_InitTypeDef
        sdk_field: IPC_CH
        type: enum
        default: Channel 0
        options:
          - { name: Channel 0, value: 0, sdk: IPC_CH0 }
          - { name: Channel 1, value: 1, sdk: IPC_CH1 }
          - { name: Channel 2, value: 2, sdk: IPC_CH2 }
          - { name: Channel 3, value: 3, sdk: IPC_CH3 }
        help: "IPC_Channel_TypeDef, ch32h417_ipc.h:23-29. Four independent channels; this block configures one of them."
      - key: txcid
        name: Transmit core ID
        struct: IPC_InitTypeDef
        sdk_field: TxCID
        type: enum
        default: CID0
        options:
          - { name: CID0, value: 0, sdk: IPC_TxCID0 }
          - { name: CID1, value: 1, sdk: IPC_TxCID1 }
        help: "IPC_TxCID_TypeDef, ch32h417_ipc.h:32-36. Which core this channel's messages are addressed to."
      - key: rxcid
        name: Receive core ID
        struct: IPC_InitTypeDef
        sdk_field: RxCID
        type: enum
        default: CID0
        options:
          - { name: CID0, value: 0, sdk: IPC_RxCID0 }
          - { name: CID1, value: 1, sdk: IPC_RxCID1 }
        help: "IPC_RxCID_TypeDef, ch32h417_ipc.h:39-43. Which core's messages this channel listens for."
      - key: txie
        name: Transmit interrupt
        struct: IPC_InitTypeDef
        sdk_field: TxIER
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "IPC_InitTypeDef.TxIER (ch32h417_ipc.h:51). Raises the channel's interrupt when the message has been taken."
      - key: rxie
        name: Receive interrupt
        struct: IPC_InitTypeDef
        sdk_field: RxIER
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "IPC_InitTypeDef.RxIER (ch32h417_ipc.h:52). Raises the channel's interrupt when a message arrives."
      - key: auto
        name: Auto acknowledge
        struct: IPC_InitTypeDef
        sdk_field: AutoEN
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "IPC_InitTypeDef.AutoEN (ch32h417_ipc.h:53)."

  # SWPMI - the single-wire protocol master. `LoopBackMode` is NOT an editable row: the
  # `Mode` setting already offers Loopback beside the two live wirings, so the member is
  # two `const:` rows with one dependency each and the two cannot contradict.
  swpmi: &swpmi_params |
    notes: >
      "Single wire with supply" (IO+SUP together) is not offered as a Mode choice.
      DS Table 2-2-26 marks SWP_SUP "-" under its own 1-wire column, and
      CH32H417RM.md:11003 scopes SUP explicitly to "Non-1-wire mode" - two independent
      sources agreeing, and no register bit or SWPMI EVT example found either
      confirming or denying the combination. "Every choice the app offers must be one
      the silicon can honour", so the combination is withheld rather than guessed at;
      if a register bit or example ever turns up either way, this is where to look.
      SUP stays claimable under Loopback instead - a genuine non-1-wire mode where
      Table 2-2-26's other column gives it a real pad (PC9, AF11).
    params:
      - key: bitrate
        name: Bit rate divider
        struct: SWPMI_InitTypeDef
        sdk_field: BitRate
        type: int
        default: 0
        min: 0
        max: 255
        help: >
          SWPMI_BRR. The header states the relation rather than the frequency:
          SWPMI_freq = SWPMI_clk / ((BitRate + 1) * 4), with the resulting rate required to
          land between 100 kbit/s and 2 Mbit/s (ch32h417_swpmi.h:24-27). It is a DIVIDER
          and not a bit rate, which is why this row is a small integer; the clock tree that
          would let the tool compute the rate for you is not modelled on this part yet.
      - key: txbuf
        name: Transmit buffering
        struct: SWPMI_InitTypeDef
        sdk_field: TxBufferingMode
        type: enum
        default: None
        options:
          - { name: "None"  , value: 0, sdk: SWPMI_TxMode_Buffering_None }
          - { name: Single  , value: 2, sdk: SWPMI_TxMode_Buffering_Single }
          - { name: Multiple, value: 10, sdk: SWPMI_TxMode_Buffering_Multi }
        help: "ch32h417_swpmi.h:41-43. The `value:` figures are the macros' own encodings (0x0 / 0x2 / 0xA), which are NOT a dense 0/1/2 enum."
      - key: rxbuf
        name: Receive buffering
        struct: SWPMI_InitTypeDef
        sdk_field: RxBufferingMode
        type: enum
        default: None
        options:
          - { name: "None"  , value: 0, sdk: SWPMI_RxMode_Buffering_None }
          - { name: Single  , value: 1, sdk: SWPMI_RxMode_Buffering_Single }
          - { name: Multiple, value: 5, sdk: SWPMI_RxMode_Buffering_Multi }
        help: "ch32h417_swpmi.h:46-48. Encodings 0x0 / 0x1 / 0x5, again not dense."
      - key: loopback_off
        name: Loopback
        struct: SWPMI_InitTypeDef
        sdk_field: LoopBackMode
        const: DISABLE
        depends_on: { setting: Mode, ne: Loopback }
        help: "ch32h417_swpmi.h:34. Fixed by the Mode row: a live single-wire link is not in loopback."
      - key: loopback_on
        name: Loopback
        struct: SWPMI_InitTypeDef
        sdk_field: LoopBackMode
        const: ENABLE
        depends_on: { setting: Mode, equals: Loopback }
        help: "ch32h417_swpmi.h:34. Fixed by the Mode row: the transceiver is looped back for self-test and the pad carries nothing."

  # I2S - THE MODE ROW ALREADY DECIDES TWO STRUCT MEMBERS, so neither is offered again.
  # `Mode` is Master/Slave x Transmit/Receive, which IS `I2S_Mode` (ch32h417_spi.h:120-123),
  # and it is also what decides whether the MCK pad is claimed - master modes claim it,
  # slave modes do not - which IS `I2S_MCLKOutput` (:139-140). So both members are `const:`
  # rows keyed off that one row, and a project cannot claim the MCK pad while telling the
  # silicon not to drive it.
  i2s: &i2s_params |
    params:
      - key: mode_mtx
        name: I2S mode
        struct: I2S_InitTypeDef
        sdk_field: I2S_Mode
        const: I2S_Mode_MasterTx
        depends_on: { setting: Mode, equals: Master Transmit }
        help: "SPI_I2SCFGR I2SCFG (ch32h417_spi.h:122). Fixed by the Mode row."
      - key: mode_mrx
        name: I2S mode
        struct: I2S_InitTypeDef
        sdk_field: I2S_Mode
        const: I2S_Mode_MasterRx
        depends_on: { setting: Mode, equals: Master Receive }
        help: "SPI_I2SCFGR I2SCFG (ch32h417_spi.h:123). Fixed by the Mode row."
      - key: mode_stx
        name: I2S mode
        struct: I2S_InitTypeDef
        sdk_field: I2S_Mode
        const: I2S_Mode_SlaveTx
        depends_on: { setting: Mode, equals: Slave Transmit }
        help: "SPI_I2SCFGR I2SCFG (ch32h417_spi.h:120). Fixed by the Mode row."
      - key: mode_srx
        name: I2S mode
        struct: I2S_InitTypeDef
        sdk_field: I2S_Mode
        const: I2S_Mode_SlaveRx
        depends_on: { setting: Mode, equals: Slave Receive }
        help: "SPI_I2SCFGR I2SCFG (ch32h417_spi.h:121). Fixed by the Mode row."
      - key: mclk_on
        name: Master clock output
        struct: I2S_InitTypeDef
        sdk_field: I2S_MCLKOutput
        const: I2S_MCLKOutput_Enable
        depends_on: { setting: Mode, in: [Master Transmit, Master Receive] }
        help: "SPI_I2SPR MCKOE (ch32h417_spi.h:139). Not a separate row because the Mode row is what claims the MCK pad: the two master modes route it and the two slave modes do not, so a dropdown here could switch the driver off under a pad the project has claimed."
      - key: mclk_off
        name: Master clock output
        struct: I2S_InitTypeDef
        sdk_field: I2S_MCLKOutput
        const: I2S_MCLKOutput_Disable
        depends_on: { setting: Mode, in: [Slave Transmit, Slave Receive] }
        help: "SPI_I2SPR MCKOE (ch32h417_spi.h:140). A slave takes its clock from the other end, so MCK is not driven and the pad is not claimed."
      - key: standard
        name: Standard
        struct: I2S_InitTypeDef
        sdk_field: I2S_Standard
        type: enum
        default: Philips
        options:
          - { name: Philips      , value: 0, sdk: I2S_Standard_Phillips }
          - { name: MSB justified, value: 1, sdk: I2S_Standard_MSB }
          - { name: LSB justified, value: 2, sdk: I2S_Standard_LSB }
          - { name: PCM short    , value: 3, sdk: I2S_Standard_PCMShort }
          - { name: PCM long     , value: 4, sdk: I2S_Standard_PCMLong }
        help: "SPI_I2SCFGR I2SSTD and PCMSYNC (ch32h417_spi.h:126-130). The macro is spelled `Phillips`, with two l's, in the vendor header; the label here is the correct spelling and the `sdk:` is the header's."
      - key: dataformat
        name: Data format
        struct: I2S_InitTypeDef
        sdk_field: I2S_DataFormat
        type: enum
        default: 16-bit
        options:
          - { name: 16-bit                , value: 0, sdk: I2S_DataFormat_16b }
          - { name: 16-bit in a 32-bit frame, value: 1, sdk: I2S_DataFormat_16bextended }
          - { name: 24-bit                , value: 3, sdk: I2S_DataFormat_24b }
          - { name: 32-bit                , value: 5, sdk: I2S_DataFormat_32b }
        help: "SPI_I2SCFGR DATLEN and CHLEN (ch32h417_spi.h:133-136). The `value:` figures are the macros' own encodings, which are NOT dense - 16b extended is 1 and 24b is 3, because the two fields are packed together."
      - key: audiofreq
        name: Audio sampling frequency
        struct: I2S_InitTypeDef
        sdk_field: I2S_AudioFreq
        type: enum
        default: 48 kHz
        options:
          - { name: 8 kHz    , value: 8000,   sdk: I2S_AudioFreq_8k }
          - { name: 11.025 kHz, value: 11025, sdk: I2S_AudioFreq_11k }
          - { name: 16 kHz   , value: 16000,  sdk: I2S_AudioFreq_16k }
          - { name: 22.05 kHz, value: 22050,  sdk: I2S_AudioFreq_22k }
          - { name: 32 kHz   , value: 32000,  sdk: I2S_AudioFreq_32k }
          - { name: 44.1 kHz , value: 44100,  sdk: I2S_AudioFreq_44k }
          - { name: 48 kHz   , value: 48000,  sdk: I2S_AudioFreq_48k }
          - { name: 96 kHz   , value: 96000,  sdk: I2S_AudioFreq_96k }
          - { name: 192 kHz  , value: 192000, sdk: I2S_AudioFreq_192k }
        help: >
          The rate the prescaler is computed for (ch32h417_spi.h:143-151). Unlike most
          enums in this file the macro IS the number - I2S_AudioFreq_48k is 48000 - so the
          `value:` column is the frequency itself and not a register code. The header also
          defines I2S_AudioFreq_Default as 2, which is a prescaler sentinel rather than a
          rate and is deliberately not offered here.
      - key: cpol
        name: Clock idle state
        struct: I2S_InitTypeDef
        sdk_field: I2S_CPOL
        type: enum
        default: Low
        options:
          - { name: Low , value: 0, sdk: I2S_CPOL_Low }
          - { name: High, value: 1, sdk: I2S_CPOL_High }
        help: "SPI_I2SCFGR CKPOL (ch32h417_spi.h:155-156). The level CK sits at between frames."

  # QSPI1 and QSPI2 are the SAME register block type - ch32h417.h:1815-1816 cast both to
  # `QSPI_TypeDef *` - so one template, shared. TWO structs apply, because the SDK splits
  # the interface config from the per-command config: QSPI_Init() (ch32h417_qspi.h:107,
  # QSPI_InitTypeDef) sets the clock/flash-geometry side of R32_QSPIx_CR/DCR, and
  # QSPI_ComConfig_Init() (:108, QSPI_ComConfig_InitTypeDef) sets one command's frame shape
  # in R32_QSPIx_CCR - unlike FMC, NEITHER struct is reached only through a pointer inside
  # the other, so both are ordinary `struct:`/`sdk_field:` rows the generator already knows
  # how to apply, each to its own `codegen.init_structs` entry, same handle.
  qspi: &qspi_params |
    params:
      - key: prescaler
        name: Clock prescaler
        struct: QSPI_InitTypeDef
        sdk_field: QSPI_Prescaler
        type: int
        default: 0
        min: 0
        max: 255
        help: "R32_QSPIx_CR.PRESCALER[31:24], CH32H417RM.md:53779-53790. SCK = HCLK/(prescaler+1); 0 bypasses the divider (FSCK = FHCLK)."
      - key: ckmode
        name: Clock mode
        struct: QSPI_InitTypeDef
        sdk_field: QSPI_CKMode
        type: enum
        default: Mode 0
        options:
          - { name: Mode 0, value: 0, sdk: QSPI_CKMode_Mode0 }
          - { name: Mode 3, value: 1, sdk: QSPI_CKMode_Mode3 }
        help: "R32_QSPIx_DCR.CKMODE, CH32H417RM.md:54088-54098. Mode 0: SCK idles low between commands; Mode 3: SCK idles high."
      - key: csht
        name: Chip select high time
        struct: QSPI_InitTypeDef
        sdk_field: QSPI_CSHTime
        type: enum
        default: 1 cycle
        options:
          - { name: 1 cycle,   value: 0, sdk: QSPI_CSHTime_1Cycle }
          - { name: 2 cycles,  value: 1, sdk: QSPI_CSHTime_2Cycle }
          - { name: 3 cycles,  value: 2, sdk: QSPI_CSHTime_3Cycle }
          - { name: 4 cycles,  value: 3, sdk: QSPI_CSHTime_4Cycle }
          - { name: 5 cycles,  value: 4, sdk: QSPI_CSHTime_5Cycle }
          - { name: 6 cycles,  value: 5, sdk: QSPI_CSHTime_6Cycle }
          - { name: 7 cycles,  value: 6, sdk: QSPI_CSHTime_7Cycle }
          - { name: 8 cycles,  value: 7, sdk: QSPI_CSHTime_8Cycle }
        help: "R32_QSPIx_DCR.CSHT[10:8], CH32H417RM.md:54051-54070. Minimum SCK cycles nCS stays high between FLASH commands, CSHT+1."
      - key: fsize
        name: Flash size
        struct: QSPI_InitTypeDef
        sdk_field: QSPI_FSize
        type: int
        default: 0
        min: 0
        max: 31
        help: "R32_QSPIx_DCR.FSIZE[20:16], CH32H417RM.md:54036-54049. The FLASH holds 2^(FSIZE+1) bytes; FSIZE+1 is the address width the QSPI drives."
      - key: fselect
        name: Flash select
        struct: QSPI_InitTypeDef
        sdk_field: QSPI_FSelect
        type: enum
        default: FLASH1
        options:
          - { name: FLASH1, value: 0, sdk: QSPI_FSelect_1 }
          - { name: FLASH2, value: 1, sdk: QSPI_FSelect_2 }
        help: "R32_QSPIx_CR.FSEL, CH32H417RM.md:53912-53918. Ignored once Dual flash mode is enabled below."
      - key: dflash
        name: Dual flash mode
        struct: QSPI_InitTypeDef
        sdk_field: QSPI_DFlash
        sdk_enabled: QSPI_DFlash_Enable
        sdk_disabled: QSPI_DFlash_Disable
        type: bool
        default: false
        help: "R32_QSPIx_CR.DFM, CH32H417RM.md:53922-53925. Splits every access across two FLASH devices at once, doubling the effective bus width."
      - key: com_fmode
        name: "Command: functional mode"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_FMode
        type: enum
        default: Indirect write
        options:
          - { name: Indirect write, value: 0, sdk: QSPI_ComConfig_FMode_Indirect_Write }
          - { name: Indirect read,  value: 1, sdk: QSPI_ComConfig_FMode_Indirect_Read }
          - { name: Auto polling,   value: 2, sdk: QSPI_ComConfig_FMode_Auto_Polling }
          - { name: Memory mapped,  value: 3, sdk: QSPI_ComConfig_FMode_Memory_Mapped }
        help: "R32_QSPIx_CCR.FMODE[27:26], CH32H417RM.md:54296-54309."
      - key: com_sioo
        name: "Command: send instruction only once"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_SIOOMode
        sdk_enabled: QSPI_ComConfig_SIOOMode_Enable
        sdk_disabled: QSPI_ComConfig_SIOOMode_Disable
        type: bool
        default: false
        help: "R32_QSPIx_CCR.SIOO, CH32H417RM.md:54287-54295. Inactive when Instruction mode below is 'No instruction'."
      - key: com_dmode
        name: "Command: data mode"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_DMode
        type: enum
        default: No data
        options:
          - { name: No data, value: 0, sdk: QSPI_ComConfig_DMode_NoData }
          - { name: 1-wire,  value: 1, sdk: QSPI_ComConfig_DMode_1Line }
          - { name: 2-wire,  value: 2, sdk: QSPI_ComConfig_DMode_2Line }
          - { name: 4-wire,  value: 3, sdk: QSPI_ComConfig_DMode_4Line }
        help: "R32_QSPIx_CCR.DMODE[25:24], CH32H417RM.md:54310-54327. Also shapes the empty data phase when 'No data' is chosen."
      - key: com_dummy
        name: "Command: dummy cycles"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_DummyCycles
        type: int
        default: 0
        min: 0
        max: 31
        help: "R32_QSPIx_CCR.DCYC[22:18], CH32H417RM.md:54328-54336. SCK cycles of the empty instruction (dummy) phase in SDR mode."
      - key: com_absize
        name: "Command: alternate byte size"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_ABSize
        type: enum
        default: 8-bit
        options:
          - { name: 8-bit,  value: 0, sdk: QSPI_ComConfig_ABSize_8bit }
          - { name: 16-bit, value: 1, sdk: QSPI_ComConfig_ABSize_16bit }
          - { name: 24-bit, value: 2, sdk: QSPI_ComConfig_ABSize_24bit }
          - { name: 32-bit, value: 3, sdk: QSPI_ComConfig_ABSize_32bit }
        help: "R32_QSPIx_CCR.ABSIZE[17:16], CH32H417RM.md:54337-54350."
      - key: com_abmode
        name: "Command: alternate byte mode"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_ABMode
        type: enum
        default: No alternate byte
        options:
          - { name: No alternate byte, value: 0, sdk: QSPI_ComConfig_ABMode_NoAlternateByte }
          - { name: 1-wire, value: 1, sdk: QSPI_ComConfig_ABMode_1Line }
          - { name: 2-wire, value: 2, sdk: QSPI_ComConfig_ABMode_2Line }
          - { name: 4-wire, value: 3, sdk: QSPI_ComConfig_ABMode_4Line }
        help: "R32_QSPIx_CCR.ABMODE[15:14], CH32H417RM.md:54351-54364."
      - key: com_adsize
        name: "Command: address size"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_ADSize
        type: enum
        default: 8-bit
        options:
          - { name: 8-bit,  value: 0, sdk: QSPI_ComConfig_ADSize_8bit }
          - { name: 16-bit, value: 1, sdk: QSPI_ComConfig_ADSize_16bit }
          - { name: 24-bit, value: 2, sdk: QSPI_ComConfig_ADSize_24bit }
          - { name: 32-bit, value: 3, sdk: QSPI_ComConfig_ADSize_32bit }
        help: "R32_QSPIx_CCR.ADSIZE[13:12], CH32H417RM.md:54365-54378."
      - key: com_admode
        name: "Command: address mode"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_ADMode
        type: enum
        default: No address
        options:
          - { name: No address, value: 0, sdk: QSPI_ComConfig_ADMode_NoAddress }
          - { name: 1-wire, value: 1, sdk: QSPI_ComConfig_ADMode_1Line }
          - { name: 2-wire, value: 2, sdk: QSPI_ComConfig_ADMode_2Line }
          - { name: 4-wire, value: 3, sdk: QSPI_ComConfig_ADMode_4Line }
        help: "R32_QSPIx_CCR.ADMODE[11:10], CH32H417RM.md:54379-54392."
      - key: com_imode
        name: "Command: instruction mode"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_IMode
        type: enum
        default: No instruction
        options:
          - { name: No instruction, value: 0, sdk: QSPI_ComConfig_IMode_NoInstruction }
          - { name: 1-wire, value: 1, sdk: QSPI_ComConfig_IMode_1Line }
          - { name: 2-wire, value: 2, sdk: QSPI_ComConfig_IMode_2Line }
          - { name: 4-wire, value: 3, sdk: QSPI_ComConfig_IMode_4Line }
        help: "R32_QSPIx_CCR.IMODE[9:8], CH32H417RM.md:54393-54408."
      - key: com_ins
        name: "Command: instruction byte"
        struct: QSPI_ComConfig_InitTypeDef
        sdk_field: QSPI_ComConfig_Ins
        type: int
        default: 0
        min: 0
        max: 255
        help: "R32_QSPIx_CCR.INSTRUCTION[7:0], CH32H417RM.md:54409-54415. The command byte sent to the FLASH; meaning is device-specific (e.g. common SPI NOR flash: 0x03 = Read)."

extras:

  # DFSDM - two REAL register-block instances, DFSDM_Channel0/DFSDM_Channel1
  # (ch32h417.h:1781-1782), each its own base address, not one peripheral with a channel
  # count field. `DFSDM_ChannelInit(DFSDM_Channely, &struct)` (ch32h417_dfsdm.h:316) takes
  # the instance as its first argument - `channel_params.instances`, E's mechanism, exactly
  # the SERDES/OPA shape, keyed 0/1 to match this part's own "Channel 0"/"Channel 1"
  # settings (already in the generated block) rather than SERDES/OPA's 1-based numbering.
  #
  # THREE MORE STRUCTS EXIST AND ARE NOT MODELLED HERE, DELIBERATELY:
  # `DFSDM_FilterInitTypeDef`/`DFSDM_RcInitTypeDef`/`DFSDM_JcInitTypeDef`, each applied by
  # its own function taking a DFSDM_FLTx handle (`DFSDM_FilterInit`/`RcInit`/`JcInit`,
  # ch32h417_dfsdm.h:317-319) - THREE separate structs landing on the SAME instance
  # (DFSDM_FLT0 or DFSDM_FLT1), which is SAI's exact unresolved gap (board,
  # peripheral_extras.yaml SAI comment): `channel_params:` holds exactly ONE `struct:` per
  # peripheral, so a second per-instance struct has nowhere to go. Not a new REQUEST -
  # consolidating with SAI's, since it is the identical schema question and a second open
  # one would just be the same gap asked twice. `params:` stays at just the Channel struct
  # until that mechanism exists; TASKS.md line names all three.
  #
  # A REAL FIELD-NAMING BUG FOUND IN THE VENDOR'S OWN EXAMPLE, NOT COPIED HERE: the shipped
  # `DFSDM_SerialSPI` example (Evt/EXAM/DFSDM/DFSDM_SerialSPI/Common/hardware.c:118-119)
  # assigns `DFSDM_ChSerialInterface = DFSDM_ExternalClkIn` and
  # `DFSDM_ChSPIClockSource = DFSDM_SPIRising` - the two fields hold each OTHER's value
  # group (`DFSDM_ExternalClkIn` is an SPI_Clock_Selection constant; `DFSDM_SPIRising` is a
  # Serial_Interface_Type constant). Invisible in the example because both chosen constants
  # are 0x0000, so the register write is bit-identical either way - confirmed by reading
  # `DFSDM_ChannelInit()` itself (ch32h417_dfsdm.c:161-174): `ChSPIClockSource` ORs
  # straight into `CFGR1_SPICKSEL` (bits[3:2], mask 0xC - only the SPI_Clock_Selection
  # macros are pre-shifted to fit it: ExternalClkIn/InternalClkOut/InternalHalfFall/
  # InternalHalfRise = 0x0/0x4/0x8/0xC) and `ChSerialInterface` straight into `CFGR1_SITP`
  # (bits[1:0], mask 0x3 - only SPIRising/SPIFalling = 0x0/0x1 fit it). The header's own
  # doc comments (ch32h417_dfsdm.h:36-42) already state this correct pairing; modelled to
  # match the REGISTER, not the example's swapped field names.
  DFSDM:
    yaml: |
      channel_params:
        struct: DFSDM_ChannelInitTypeDef
        applies_per: channel
        instances:
          0: { sdk_call: DFSDM_ChannelInit, handle: DFSDM_Channel0, setting: "Channel 0", active_choices: ["External clock", "Internal clock"] }
          1: { sdk_call: DFSDM_ChannelInit, handle: DFSDM_Channel1, setting: "Channel 1", active_choices: ["External clock", "Internal clock"] }
        params:
          - key: datmpx
            name: Input data source
            sdk_field: DFSDM_ChDataMultiplexer
            type: enum
            default: Serial
            options:
              - { name: Serial,   value: 0,      sdk: DFSDM_SerialInput }
              - { name: ADC,      value: 4096,   sdk: DFSDM_ADCInput }
              - { name: Internal, value: 8192,   sdk: DFSDM_InternalInput }
            help: >
              CFGR1.DATMPX[13:12], ch32h417_dfsdm.h:154-157. Serial is the pin-routed path
              this peripheral's own signal_pins: (CKIN/DATIN) exist for; ADC/Internal read
              from ADC1/ADC2 or another on-chip source instead and claim no pad - offered
              here since the header defines real values for them, but this part's two
              modelled settings ("External clock"/"Internal clock") only route pins for
              the Serial case, so ADC/Internal need the setting active regardless
              (`active_choices`) even though the field itself can express more.
          - key: spiclksrc
            name: SPI clock source
            sdk_field: DFSDM_ChSPIClockSource
            type: enum
            default: External
            options:
              - { name: External,             value: 0,  sdk: DFSDM_ExternalClkIn }
              - { name: "Internal, output",    value: 4,  sdk: DFSDM_InternalClkOut }
              - { name: "Internal, falling",   value: 8,  sdk: DFSDM_InternalHalfFall }
              - { name: "Internal, rising",    value: 12, sdk: DFSDM_InternalHalfRise }
            help: >
              CFGR1.SPICKSEL[3:2], ch32h417_dfsdm.h:162-165 (register math confirmed
              against ch32h417_dfsdm.c:161-168 and ch32h417.h's own CFGR1_SPICKSEL mask
              0xC - see the peripheral comment for the vendor example's swapped field
              names, not repeated here). "External" is what the shipped SerialSPI example
              runs and matches this channel's own CKIN pin being routed.
          - key: siface
            name: Serial interface edge
            sdk_field: DFSDM_ChSerialInterface
            type: enum
            default: Rising
            options:
              - { name: Rising,  value: 0, sdk: DFSDM_SPIRising }
              - { name: Falling, value: 1, sdk: DFSDM_SPIFalling }
            help: "CFGR1.SITP[1:0], ch32h417_dfsdm.h:168-170. EVT DFSDM_SerialSPI example, value 0 either way (see peripheral comment)."
          - key: datpack
            name: Data packing
            sdk_field: DFSDM_ChDataPackMode
            type: enum
            default: Standard
            options:
              - { name: Standard,   value: 0,     sdk: DFSDM_StandardMode }
              - { name: Interleave, value: 16384, sdk: DFSDM_InterleaveMode }
              - { name: Dual,       value: 32768, sdk: DFSDM_DualMode }
            help: "CFGR1.DATPACK[15:14], ch32h417_dfsdm.h:149-152. EVT DFSDM_SerialSPI example: Standard (hardware.c:117)."
          - key: chinsel
            name: Input pin select
            sdk_field: DFSDM_ChInPinSelect
            type: enum
            default: This channel
            options:
              - { name: This channel, value: 0,   sdk: DFSDM_SelectCurrent }
              - { name: Next channel, value: 256, sdk: DFSDM_SelectNext }
            help: >
              CFGR1.CHINSEL, ch32h417_dfsdm.h:158-160. Lets channel y read the (y+1) pin
              pair instead of its own - EVT DFSDM_SerialSPI example: This channel
              (hardware.c:121).
          - key: ckabdet
            name: Clock absence detector
            sdk_field: DFSDM_ChClockAbsenceDetMode
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: false
            help: "CFGR1.CKABEN (bit 6), ch32h417_dfsdm.h:63-64. EVT DFSDM_SerialSPI example: DISABLE (hardware.c:120)."
          - key: scddet
            name: Short-circuit detector
            sdk_field: DFSDM_ChShortCircuitDetMode
            sdk_enabled: ENABLE
            sdk_disabled: DISABLE
            type: bool
            default: true
            help: "CFGR1.SCDEN (bit 5), ch32h417_dfsdm.h:66-67. EVT DFSDM_SerialSPI example: ENABLE (hardware.c:119)."
          - key: scdthr
            name: Short-circuit detector threshold
            sdk_field: DFSDM_ChSCDCntthreshold
            type: int
            default: 220
            min: 0
            max: 255
            help: "AWSCDR.SCDT[7:0], ch32h417_dfsdm.h:56-57. EVT DFSDM_SerialSPI example: 220 (hardware.c:118)."
          - key: scdbksig
            name: Short-circuit break signal
            sdk_field: DFSDM_ChSCDBreakSignal
            type: enum
            default: None
            options:
              - { name: None,        value: 0,     sdk: DFSDM_SCD_BK_None }
              - { name: "BK0",       value: 4096,  sdk: DFSDM_SCD_BK_0 }
              - { name: "BK1",       value: 8192,  sdk: DFSDM_SCD_BK_1 }
              - { name: "BK0 + BK1", value: 12288, sdk: DFSDM_SCD_BK_0_1 }
            help: "AWSCDR.BKSCD[13:12], ch32h417_dfsdm.h:51-54. Not exercised by any shipped DFSDM example; default matches the reset/POR value (0)."
          - key: awdsincorder
            name: Watchdog Sinc filter order
            sdk_field: DFSDM_ChAWDSincFilterOrder
            type: enum
            default: FastSinc
            options:
              - { name: FastSinc, value: 0, sdk: DFSDM_AWD_FastSinc }
              - { name: Sinc1,    value: 1, sdk: DFSDM_AWD_Sinc1 }
              - { name: Sinc2,    value: 2, sdk: DFSDM_AWD_Sinc2 }
              - { name: Sinc3,    value: 3, sdk: DFSDM_AWD_Sinc3 }
            help: "AWSCDR.AWFORD[23:22], ch32h417_dfsdm.h:45-46. Not exercised by any shipped DFSDM example; default matches the reset/POR value (0)."
          - key: awdoversample
            name: Watchdog filter oversample ratio
            sdk_field: DFSDM_ChAWDFilterOverSample
            type: int
            default: 1
            min: 1
            max: 32
            help: >
              AWSCDR.AWFOSR[20:16], ch32h417_dfsdm.h:59-60. The driver writes
              `(value - 1) << offset` (ch32h417_dfsdm.c:183), so 1 (the header's own
              "bypassed" value, @ref AWD_Filter_Bypass) writes 0 - matches the reset/POR
              value; not exercised by any shipped DFSDM example.
          - key: rbitshift
            name: Data right bit-shift
            sdk_field: DFSDM_ChDataRightBitShift
            type: int
            default: 0
            min: 0
            max: 31
            help: "CFGR2.DTRBS[7:3], ch32h417_dfsdm.h:53-55. Not exercised by any shipped DFSDM example; default matches the reset/POR value (0)."
          - key: caliboffset
            name: Calibration offset
            sdk_field: DFSDM_ChCalibrationOffset
            type: int
            default: 0
            min: -8388608
            max: 8388607
            help: "CFGR2.CALIBOFF, ch32h417_dfsdm.h:23-25 (24-bit signed). Not exercised by any shipped DFSDM example; default matches the reset/POR value (0)."

  # USBHS/USBSS/USBPD - no *_InitTypeDef exists for any of the three (ch32h417_usb*.h
  # has descriptor structs only), so bring-up is a FIXED sequence of raw register
  # writes in each EVT example's own Common/ch32h417_usb{hs,ss}_device.c or
  # PD_Process.c - `sdk_manual: true`, one row each, the note transcribing the actual
  # writes/values/file:lines rather than describing them, so a reader can act on it
  # without reopening the EVT (main's condition: "set by firmware" alone is
  # `sdk_none:`'s failure wearing a better label). `const:` fits all three - checked,
  # not assumed: md5-diffed every shipped device example's own bring-up function
  # before writing any of this (AGENT-3, board 2026-09-13T22:54Z) - USBHS identical
  # across all 8 device examples, USBSS identical to its second (UVC-DVP) example,
  # USBPD's PD_Init() identical between USBPD_SRC and USBPD_SNK (the Source/Sink pull
  # direction that DOES differ is already the existing Mode setting, not this row).
  USBHS:
    yaml: |
      params:
        - key: bringup
          name: Device bring-up
          const: "fixed register sequence, see sdk_note"
          sdk_manual: true
          sdk_note: >
            RCC_HBPeriphClockCmd(RCC_HBPeriph_USBHS, ENABLE) [:183]; RCC_UTMIcmd(ENABLE)
            [:181]; USBHSD->CONTROL = USBHS_UD_RST_LINK|USBHS_UD_PHY_SUSPENDM [:208];
            USBHSD->INT_EN = USBHS_UDIE_BUS_RST|USBHS_UDIE_SUSPEND|USBHS_UDIE_BUS_SLEEP|
            USBHS_UDIE_LPM_ACT|USBHS_UDIE_TRANSFER|USBHS_UDIE_LINK_RDY [:209];
            USBHSD->BASE_MODE = USBHS_UD_SPEED_HIGH [:211]; USBHSD->CONTROL =
            USBHS_UD_DEV_EN|USBHS_UD_DMA_EN|USBHS_UD_LPM_EN|USBHS_UD_PHY_SUSPENDM [:212].
            Evt/EXAM/USBHS/DEVICE/CH372Device/Common/ch32h417_usbhs_device.c,
            USBHS_RCC_Init (:166-194) + USBHS_Device_Init (:203-221); identical in all
            8 shipped USBHS device examples (md5-checked).

  USBSS:
    yaml: |
      params:
        - key: bringup
          name: Device bring-up
          const: "fixed register sequence, see sdk_note"
          sdk_manual: true
          sdk_note: >
            RCC_HBPeriphClockCmd(RCC_HBPeriph_USBSS, ENABLE) [:36]; RCC_UTMIcmd(ENABLE)
            [:38]; RCC_USBSS_PLLCmd(ENABLE) [:39]; USBSSD->LINK_CFG =
            LINK_RX_EQ_EN|LINK_TX_DEEMPH_MASK|LINK_PHY_RESET [:65]; USBSSD->LINK_CTRL =
            LINK_P2_MODE|LINK_GO_DISABLED [:66]; USBSSD->LINK_CFG =
            LINK_RX_EQ_EN|LINK_TX_DEEMPH_MASK|LINK_LTSSM_MODE|LINK_TOUT_MODE [:67];
            USBSSD->USB_CONTROL = USBSS_UIE_TRANSFER|USBSS_UDIE_SETUP|USBSS_UDIE_STATUS|
            USBSS_DMA_EN|USBSS_SETUP_FLOW [:91]. Evt/EXAM/USBSS/DEVICE/CH372Device/
            Common/ch32h417_usbss_device.c, USBSS_RCC_Init (:31-51) + USBSS_Device_Init
            (:59-...); identical to the UVC-DVP device example (md5-checked). ~20 more
            LINK_* writes exist between :67 and :97 (U1/U2 allow, wake timers,
            compliance) - the six above are the ones that actually gate device-mode
            operation, listed in the file itself for the rest.

  USBPD:
    yaml: |
      params:
        - key: bringup
          name: Device bring-up
          const: "fixed register sequence, see sdk_note"
          sdk_manual: true
          sdk_note: >
            RCC_HBPeriphClockCmd(RCC_HBPeriph_USBPD, ENABLE) [:184]; USBPD->CONFIG =
            PD_DMA_EN [:192]; USBPD->STATUS =
            BUF_ERR|IF_RX_BIT|IF_RX_BYTE|IF_RX_ACT|IF_RX_RESET|IF_TX_END [:193].
            Evt/EXAM/USBPD/USBPD_SNK/Common/PD_Process.c, PD_Init() (:180-193);
            identical bring-up in USBPD_SRC/Common/PD_Process.c. The Source/Sink pull
            direction (PORT_CC1/2 = CC_CMP_66|CC_PU_330 vs CC_CMP_66|CC_PD) is NOT part
            of this fixed sequence - it is the existing Mode setting (Source/Sink/DRP),
            PD_SRC_Init/PD_SINK_Init at :135-160, not a separate param.

  # USBFS - a DIFFERENT shape from the three above, checked rather than assumed the
  # same: no *_InitTypeDef/Init() exists for the USBFSD/USBFSH block either
  # (ch32h417_usb.h has only descriptor structs), but unlike USBHS/USBSS/USBPD its
  # bring-up is NOT one fixed sequence - `md5sum` across all 8 shipped USBFS device
  # examples (CH372Device, CompatibilityHID, CompositeKM, CompositeKM_LowSpeed,
  # MSC_CD-ROM, MSC_U-Disk, SimulateCDC, SimulateCDC-HID) returns 8 DIFFERENT hashes:
  # USBFS_Device_Endp_Init() hard-codes endpoint modes and DMA buffer addresses/sizes
  # specific to whichever USB class that example implements, so this generator cannot
  # safely write it for an arbitrary configuration - `const:` would claim a single
  # fixed recipe that does not exist here, so it is NOT used (unlike the three above).
  # Two bits ARE confirmed the same shape as a real, editable choice rather than a
  # fixed recipe - checked across all 8 examples, not assumed from one:
  # `USBFS_UC_DEV_PU_EN` is set identically in EVERY example (grepped all 8 device.c
  # files' own `USBFSD->BASE_CTRL = ...` line); `USBFS_UC_LOW_SPEED` is CLEAR in 7 of 8
  # and SET in exactly the one named for it (`CompositeKM_LowSpeed/Common/
  # ch32h417_usbfs_device.c:111`) - a real per-project toggle, not a constant, which is
  # why it gets `default:` and a `type: bool`, not `const:`.
  USBFS:
    yaml: |
      notes: >
        No *_InitTypeDef/Init() exists for the USBFSD/USBFSH register block at all
        (ch32h417_usb.h has only USB descriptor structs) - device bring-up (endpoint
        mode, DMA buffer addresses/sizes) is DIFFERENT in every one of this part's 8
        shipped USBFS device examples (md5-different across CH372Device,
        CompatibilityHID, CompositeKM, CompositeKM_LowSpeed, MSC_CD-ROM, MSC_U-Disk,
        SimulateCDC, SimulateCDC-HID - Evt/EXAM/USBFS/DEVICE/*/Common/
        ch32h417_usbfs_device.c), because USBFS_Device_Endp_Init() hard-codes endpoint
        modes and DMA buffers specific to whichever USB class that example implements.
        This generator does not choose a USB class for you - write
        USBFS_RCC_Init/USBFS_Device_Endp_Init/USBFS_Device_Init yourself, following
        the shipped example closest to your device class. The two params below are
        the only part of bring-up confirmed the SAME regardless of class.
      params:
        - key: lowspeed
          name: Low speed mode
          sdk_manual: true
          type: bool
          default: false
          sdk_note: >
            R8_USB_CTRL.USBFS_UC_LOW_SPEED (0x40, ch32h417_usb.h:1006). 7 of 8 shipped
            device examples leave it clear (full speed); the eighth,
            CompositeKM_LowSpeed, sets it (Common/ch32h417_usbfs_device.c:111,
            `USBFSD->BASE_CTRL = ... | USBFS_UC_LOW_SPEED`) - a real per-project
            choice, checked across every example rather than assumed constant.
        - key: pullup
          name: Device pull-up
          sdk_manual: true
          type: bool
          default: true
          sdk_note: >
            R8_USB_CTRL.USBFS_UC_DEV_PU_EN (0x20, ch32h417_usb.h:1007) - presents the
            D+ pull-up so a host detects the device. Set identically in all 8 shipped
            device examples (e.g. Evt/EXAM/USBFS/DEVICE/CH372Device/Common/
            ch32h417_usbfs_device.c:127, `USBFSD->BASE_CTRL = USBFS_UC_DEV_PU_EN | ...`).

  SDIO:
    comment: |
      THE BUS WIDTH IS THE MODE ROW, and that is why `SDIO_BusWide` is not a second
      dropdown. `Mode` offers SD 1-bit / 4-bit / 8-bit, and those are what claim D0, D0-D3
      and D0-D7 respectively - so a width chosen separately could configure a four-bit bus
      on a project that only wired one data line, which is the offered-but-impossible
      defect in its usual direction. The three `const:` rows below each depend on one of
      those choices, so exactly one is written.
    yaml: |
      params:
        - key: width_1b
          name: Bus width
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_BusWide
          const: SDIO_BusWide_1b
          depends_on: { setting: Mode, equals: SD 1-bit }
          help: "SDIO_CLKCR WIDBUS (ch32h417_sdio.h:103). Fixed by the Mode row, which is what claims the data pads."
        - key: width_4b
          name: Bus width
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_BusWide
          const: SDIO_BusWide_4b
          depends_on: { setting: Mode, equals: SD 4-bit }
          help: "SDIO_CLKCR WIDBUS (ch32h417_sdio.h:104). Fixed by the Mode row."
        - key: width_8b
          name: Bus width
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_BusWide
          const: SDIO_BusWide_8b
          depends_on: { setting: Mode, equals: SD 8-bit }
          help: "SDIO_CLKCR WIDBUS (ch32h417_sdio.h:105). Fixed by the Mode row."
        - key: clkdiv
          name: Clock divider
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_ClockDiv
          type: int
          default: 118
          min: 0
          max: 255
          help: >
            SDIO_CLKCR CLKDIV, 0x00-0xFF. SDIO_CK = SDIOCLK / (CLKDIV + 2), so 118 gives
            the 400 kHz identification clock from a 48 MHz SDIOCLK and is the value every
            card needs until it is initialised. Raise it afterwards in your own code - the
            card's own CSD says how far.
        - key: clkedge
          name: Clock edge
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_ClockEdge
          type: enum
          default: Rising
          options:
            - { name: Rising , value: 0, sdk: SDIO_ClockEdge_Rising }
            - { name: Falling, value: 1, sdk: SDIO_ClockEdge_Falling }
          help: "SDIO_CLKCR NEGEDGE (ch32h417_sdio.h:91-92). Which edge of SDIO_CK the bus is sampled on."
        - key: clkbypass
          name: Clock divider bypass
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_ClockBypass
          type: enum
          default: Disabled
          options:
            - { name: Disabled, value: 0, sdk: SDIO_ClockBypass_Disable }
            - { name: Enabled , value: 1, sdk: SDIO_ClockBypass_Enable }
          help: "SDIO_CLKCR BYPASS (ch32h417_sdio.h:95-96). Feeds SDIOCLK straight to the card and makes the divider above irrelevant - far too fast for identification, so leave it off until the card is up."
        - key: clkpwrsave
          name: Clock power save
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_ClockPowerSave
          type: enum
          default: Disabled
          options:
            - { name: Disabled, value: 0, sdk: SDIO_ClockPowerSave_Disable }
            - { name: Enabled , value: 1, sdk: SDIO_ClockPowerSave_Enable }
          help: "SDIO_CLKCR PWRSAV (ch32h417_sdio.h:99-100). Stops SDIO_CK while the bus is idle. Some cards want a running clock, so the default is off."
        - key: flowctrl
          name: Hardware flow control
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_HardwareFlowControl
          type: enum
          default: Disabled
          options:
            - { name: Disabled, value: 0, sdk: SDIO_HardwareFlowControl_Disable }
            - { name: Enabled , value: 1, sdk: SDIO_HardwareFlowControl_Enable }
          help: "SDIO_CLKCR HWFC_EN (ch32h417_sdio.h:108-109). Stalls the clock rather than overrunning the FIFO."

  SDMMC:
    comment: |
      THE BUS WIDTH IS THE MODE ROW, same shape as SDIO just above: `Mode` offers SD
      1-bit/4-bit/8-bit and those are what claim D0, D0-D3 and D0-D7, so `SDMMC_BusWidth`
      is three `const:` rows keyed off that same choice, not a second dropdown a project
      could set wider than the pads it claimed. `SDMMC_Init(SDMMC_InitTypeDef*)`
      (ch32h417_sdmmc.h:250) takes no register-block pointer - this part has one SDMMC
      controller - so it is `no_handle: true`, the DVP/LTDC/SDIO/IPC shape.

      FOUR more structs this driver defines are NOT modelled here, each for a different
      reason. `SDMMC_CMDInitTypeDef` (applied by `SDMMC_CommandConfig`) carries the
      ARGUMENT and INDEX of one specific SD/MMC command - a runtime call issued per
      transaction, the same class as SerDes's `SDS_RTX_Ctrl`, not a one-time init.
      `SDMMC_TranModeTypeDef` (`SDMMC_TranMode_Init`) sets the DMA DIRECTION and
      dual-buffer bookkeeping for one transfer, which varies transfer to transfer for the
      same reason. `SDMMC_IOInputDelayDDRTypeDef` and `SDMMC_IOOutputDelayDDRTypeDef`
      (`SDMMC_IOInputDelayDDRInit` / `SDMMC_IOOutputDelayDDRInit`) tune eight per-line
      signal-integrity delays that matter only in DDR mode (ch32h417_sdmmc.h:111-177) -
      real init-time settings, but neither of this part's own SD/eMMC examples
      (Evt/EXAM/SDMMC/SDMMC_SD, SDMMC_eMMC, SDMMC_eMMC_DDR) ever calls them, so there is no
      worked default to check eight raw 4-bit taps against. Left unmodelled rather than
      guessed; TASKS.md line.

      `af:` IS DELIBERATELY ABSENT ON EVERY SDMMC PIN, and it is not a gap - see this
      part's `dedicated_pins.yaml` for the finding in full: `AFIO_PCFR1.SDMMC_RM[1:0]`
      (CH32H417RM.md:11741-11768, Table 9-32) is a genuine register remap moving EVERY
      SDMMC signal to one of three pin sets at once, the `remaps:` shape
      (data/FORMAT.md:220-244) - not the per-pin `af:` mux every other signal on this
      part uses. This part's `codegen.remap.style` is `af` and `style: af` FORBIDS
      `codegen.remap.fields` (data/FORMAT.md:654-657): no emitter exists that could
      ever WRITE SDMMC_RM, confirmed against the vendor's own `SD_GPIO_Init()`
      (`Evt/EXAM/SDMMC/SDMMC_SD/Common/sdmmc_sd.c:93-113`), which calls
      `GPIO_Init(..., GPIO_Mode_AF_PP, ...)` and never `GPIO_PinAFConfig()` - the pad
      reaches SDMMC through the register field, not the AFRL/AFRH nibble
      `GPIO_PinAFConfig` writes.

      `remaps:` BELOW REPLACES THE GENERATOR'S OWN `signal_pins:` wholesale - AGENT-2's
      ruling (board 2026-09-13T23:23Z), reversing this file's own earlier RM=00-only
      narrowing (which this comment used to describe and which broke
      `tests/h417_dedicated.test.js`'s DS-completeness check the moment it landed,
      restored by AGENT-3 immediately after). `remaps:` is the CORRECT shape here, not a
      style choice: `AFIO_PCFR1.SDMMC_RM[1:0]` moves EVERY SDMMC signal to one of three
      pin sets AT ONCE (CH32H417RM.md:11741-11768, Table 9-32) - the exact "one register
      field moves every signal of a peripheral at once" case `remaps:` exists for
      (data/FORMAT.md's opening section), and `signal_pins:` is the OPPOSITE model
      (independent per-signal choice) - a `signal_pins:` list per signal would let the
      picker offer `CMD` from RM=00 together with `D0` from RM=01, a combination the
      silicon cannot produce. All three RM values are real, DS-cited pin sets (Table
      9-32); RM=00 is byte-identical to what shipped before, RM=01/1x are the same
      table's other two columns. `remap_unwritable:` records WHY codegen cannot write
      any choice but the default: this part's `codegen.remap.style` is `af`, and
      `style: af` FORBIDS `codegen.remap.fields` (data/FORMAT.md:654-657) - no emitter
      exists that could ever WRITE SDMMC_RM, confirmed against the vendor's own
      `SD_GPIO_Init()` (`Evt/EXAM/SDMMC/SDMMC_SD/Common/sdmmc_sd.c:93-113`), which calls
      `GPIO_Init(..., GPIO_Mode_AF_PP, ...)` and never `GPIO_PinAFConfig()` - the pad
      reaches SDMMC through the register field, not the AFRL/AFRH nibble
      `GPIO_PinAFConfig` writes. Selecting RM=00 (index 0) still generates exactly what
      it always did (the reset value, no write, no TODO); selecting RM=01/1x is now
      OFFERED for planning (pin grid, export, collision checking, all real) and
      generates one explicit, cited TODO instead of either silent nothing or a
      misleading "add a fields entry" hint. `af:` stays absent on every SDMMC pin
      throughout - not a gap, see above.
    yaml: |
      remaps:
        - name: "SDMMC_RM=00 (default)"
          pins: { D0: PC8, D1: PC9, D2: PC10, D3: PC11, D4: PA14, D5: PA15, D6: PC6, D7: PC7,
                  CMD: PD2, STR: PD3, STS: PD2, SDCK: PC12, SLVCK: PC12 }
        - name: "SDMMC_RM=01"
          pins: { D0: PB13, D1: PC9, D2: PB10, D3: PB11, D4: PA14, D5: PA15, D6: PC6, D7: PC7,
                  CMD: PD12, STR: PD10, STS: PD12, SDCK: PD11, SLVCK: PD11 }
        - name: "SDMMC_RM=1x"
          pins: { D0: PD0, D1: PD1, D2: PD2, D3: PD3, D4: PD4, D5: PD5, D6: PD6, D7: PD7,
                  CMD: PC10, STR: PC11, STS: PC10, SDCK: PC12, SLVCK: PC12 }
      remap_unwritable: >
        AFIO_PCFR1.SDMMC_RM[1:0] (CH32H417RM.md:11741-11768, Table 9-32) is a real
        register field, but this part's codegen.remap.style: af has no per-peripheral
        field to write it (style: af forbids codegen.remap.fields, data/FORMAT.md:
        654-657) and the SDK exposes no macro for it either (SD_GPIO_Init(),
        Evt/EXAM/SDMMC/SDMMC_SD/Common/sdmmc_sd.c:93-113, calls GPIO_Init(Mode_AF_PP)
        and never GPIO_PinAFConfig()). RM=01/1x must be set by hand to match the plan.
      params:
        - key: width_1b
          name: Bus width
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_BusWidth
          const: SDMMC_BusWidth_1
          depends_on: { setting: Mode, equals: SD 1-bit }
          help: "R16_EMMC_CONTROL RB_EMMC_LW_MASK[1:0], CH32H417RM.md:48759-48768. Fixed by the Mode row, which is what claims the data pads."
        - key: width_4b
          name: Bus width
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_BusWidth
          const: SDMMC_BusWidth_4
          depends_on: { setting: Mode, equals: SD 4-bit }
          help: "R16_EMMC_CONTROL RB_EMMC_LW_MASK[1:0], CH32H417RM.md:48759-48768. Fixed by the Mode row."
        - key: width_8b
          name: Bus width
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_BusWidth
          const: SDMMC_BusWidth_8
          depends_on: { setting: Mode, equals: SD 8-bit }
          help: "R16_EMMC_CONTROL RB_EMMC_LW_MASK[1:0], CH32H417RM.md:48759-48768. Fixed by the Mode row."
        - key: mode
          name: Controller mode
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_Mode
          type: enum
          default: Host
          options:
            - { name: Host,  value: 0, sdk: SDMMC_Mode_Host }
            - { name: Slave, value: 1, sdk: SDMMC_Mode_Slave }
          help: "R16_EMMC_CONTROL RB_SLV_MODE, CH32H417RM.md:48715-48721. Slave mode takes SDCK as an input instead of driving it; both of the part's own SD/eMMC examples use Host (sdmmc_sd.c:186, sdmmc_emmc.c:223)."
        - key: phase_inv
          name: Clock phase invert
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_PhaseInv
          type: enum
          default: No inverse
          options:
            - { name: No inverse, value: 0, sdk: SDMMC_Phase_No_Inverse }
            - { name: Inverse,    value: 1, sdk: SDMMC_Phase_Inverse }
          help: "R16_EMMC_CLK_DIV RB_EMMC_PHASEINV, CH32H417RM.md:49207. Inverts the SDCK output phase."
        - key: clock_speed
          name: Clock speed mode
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_ClockSpeed
          type: enum
          default: Low
          options:
            - { name: Low,  value: 0, sdk: SDMMC_ClockSpeed_Low }
            - { name: High, value: 1, sdk: SDMMC_ClockSpeed_High }
          help: >
            R16_EMMC_CLK_DIV RB_EMMC_CLKMode, CH32H417RM.md:49208-49214: 0 = below 5 MHz,
            1 = 25-200 MHz (register reset value is 1). Changes what the Clock divider
            below divides by (RB_EMMC_DIV_MASK's own /1 vs /64 factor,
            CH32H417RM.md:49224-49236). Defaulted to Low, overriding the register's own
            reset, because both of this part's SD/eMMC examples set it explicitly for card
            identification (sdmmc_sd.c:191, sdmmc_emmc.c:228) and raise it afterwards in
            application code, which this row does not do for you.
        - key: clock_edge
          name: Sample clock edge
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_ClockEdge
          type: enum
          default: Rising
          options:
            - { name: Rising,  value: 0, sdk: SDMMC_SampleClock_Rising }
            - { name: Falling, value: 1, sdk: SDMMC_SampleClock_Falling }
          help: >
            R16_EMMC_CONTROL RB_EMMC_NEGSMP, CH32H417RM.md:48723-48729. Reset value 0
            (Rising), which is what the eMMC example uses (sdmmc_emmc.c:224); the SD
            example uses Falling instead (sdmmc_sd.c:187) - the two disagree and the choice
            is left to the project rather than picked for it.
        - key: clock_div
          name: Clock divider
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_ClockDiv
          type: int
          default: 31
          min: 0
          max: 31
          help: >
            R16_EMMC_CLK_DIV RB_EMMC_DIV_MASK[4:0], CH32H417RM.md:49224-49236 (0x00-0x1F per
            ch32h417_sdmmc.h:41-42). SDCLK = SYSPLL_SEL / ClockDiv (High speed) or
            SYSPLL_SEL / ClockDiv / 64 (Low speed); the RM states the minimum usable value
            is 2 and that 1 disables the clock. Defaulted to 31 (0x1F), the maximum divider
            and so the slowest, safest identification clock, overriding the register's own
            reset of 0x13 - both SD/eMMC examples set it to exactly this value via their own
            `RB_SDMMC_DIV_MASK` constant (sdmmc_sd.c:192, sdmmc_emmc.c:229).
        - key: timeout
          name: Response/data timeout
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_TimeOut
          type: int
          default: 12
          min: 0
          max: 15
          help: >
            R8_EMMC_TIMEOUT RB_EMMC_TOCNT_MASK[3:0], CH32H417RM.md:48775-48793 (0x0-0x0F per
            ch32h417_sdmmc.h:44-45). Timeout = SDCLK period * 4194304 * this value; 0
            disables the timeout. Default 12 (0xC) is the register's own reset value and
            matches both SD/eMMC examples (sdmmc_sd.c:193, sdmmc_emmc.c:230).
        - key: slave_force_crc_err
          name: Force CRC error (slave mode)
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_SlaveForceCrc_ERR
          sdk_enabled: ENABLE
          sdk_disabled: DISABLE
          type: bool
          default: false
          help: "R16_EMMC_CONTROL RB_SLV_FORCE_ERR, CH32H417RM.md:48707-48714. Test hook: forces an invalid data-block CRC while acting as a slave. Reset value 0; not set by either example."
        - key: dma_en
          name: DMA enable
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_DMA_EN
          sdk_enabled: ENABLE
          sdk_disabled: DISABLE
          type: bool
          default: true
          help: "R16_EMMC_CONTROL RB_EMMC_DMAEN, CH32H417RM.md:48742-48748. Reset value 0, but both SD/eMMC examples set it to 1 (sdmmc_sd.c:188, sdmmc_emmc.c:225) - the FIFO-only path has no worked example to default to instead."
        - key: clock_oe
          name: Clock output enable
          struct: SDMMC_InitTypeDef
          sdk_field: SDMMC_Clock_OE
          sdk_enabled: ENABLE
          sdk_disabled: DISABLE
          type: bool
          default: false
          help: >
            R16_EMMC_CLK_DIV RB_EMMC_CLKOE, CH32H417RM.md:49215-49221. Reset value 0 and
            left unset (zero) by both examples, which start SDCK through the separate
            runtime call `SDMMC_ClockCmd(ENABLE)` instead (sdmmc_sd.c:185,195;
            sdmmc_emmc.c:222,232) - a runtime enable, not this struct's field, and not
            modelled here.
      notes: >
        `SDMMC_CommandConfig`, `SDMMC_TranMode_Init`, `SDMMC_IOInputDelayDDRInit` and
        `SDMMC_IOOutputDelayDDRInit` are not modelled - see the peripheral comment above.

  SAI:
    comment: |
      TWO HARDWARE BLOCKS, ONE TREE PERIPHERAL, same shape as LTDC's two layers:
      `SAI_Block_A`/`SAI_Block_B` are two register blocks (ch32h417.h:1775-1776) and the
      settings above already have independent `Block A`/`Block B` rows deciding whether
      each is live - exactly `channel_params.instances`, keyed to those two settings
      rather than a channel number.

      `SAI_InitTypeDef` (applied by `SAI_Init(SAI_Block_x, &s)`, ch32h417_sai.h:241) is
      the primary struct. The driver defines TWO MORE per-block init structs -
      `SAI_FrameInitTypeDef` via `SAI_FrameInit()` and `SAI_SlotInitTypeDef` via
      `SAI_SlotInit()` - and the part's own example calls all three for the one block it
      uses (Evt/EXAM/SAI/SAI_Play/Common/hardware.c:103,110,116). Frame/Slot are NOT a
      later nicety: the header itself says their fields are "ignored ... when AC'97 or
      SPDIF protocols are selected", meaning they matter precisely in Free Protocol, which
      is what the EVT example configures (SAI_Free_Protocol, hardware.c:96) and what a
      typical I2S/TDM use of this block would be.

      LANDED 2026-09-14 on AGENT-2's multi-struct `channel_params` mechanism (board
      2026-09-13T19:25Z, `node tests/run.js "channel_multi_struct"` 5/5) - a
      `channel_params.params:` row may now carry `struct:` naming a DIFFERENT struct
      than the block's primary one, applied via `codegen.init_structs.<that struct>.fn`
      using the SAME instance handle. This fits SAI exactly because `SAI_FrameInit`/
      `SAI_SlotInit` take the SAME `SAI_Block_x` handle `SAI_Init` does - only the
      function varies, not the register block. (DFSDM's Filter/Rc/Jc structs do NOT fit
      this shape - they want a genuinely DIFFERENT handle axis, `DFSDM_FLTx` rather than
      `DFSDM_Channely` - see the DFSDM peripheral comment; do not treat this landing as
      having answered that one too.)
    yaml: |
      channel_params:
        struct: SAI_InitTypeDef
        applies_per: block
        instances:
          1: { sdk_call: SAI_Init, handle: SAI_Block_A, setting: "Block A", active_choices: [Asynchronous, Synchronous] }
          2: { sdk_call: SAI_Init, handle: SAI_Block_B, setting: "Block B", active_choices: [Asynchronous, Synchronous] }
        params:
          - key: mode
            name: Audio mode
            sdk_field: SAI_AudioMode
            type: enum
            default: Master transmitter
            options:
              - { name: Master transmitter, value: 0, sdk: SAI_Mode_MasterTx }
              - { name: Master receiver,    value: 1, sdk: SAI_Mode_MasterRx }
              - { name: Slave transmitter,  value: 2, sdk: SAI_Mode_SlaveTx }
              - { name: Slave receiver,     value: 3, sdk: SAI_Mode_SlaveRx }
            help: "R32_SAI_xCFGR1.MODE[1:0], CH32H417RM.md:52423-52440. The EVT's own example uses Master transmitter (hardware.c:95)."
          - key: protocol
            name: Protocol
            sdk_field: SAI_Protocol
            type: enum
            default: Free protocol
            options:
              - { name: Free protocol, value: 0, sdk: SAI_Free_Protocol }
              - { name: SPDIF,         value: 1, sdk: SAI_SPDIF_Protocol }
              - { name: AC'97,         value: 2, sdk: SAI_AC97_Protocol }
            help: >
              R32_SAI_xCFGR1.PRTCFG[1:0], CH32H417RM.md:52399-52418. Free protocol leaves
              the frame/slot structure to the Frame and Slot init calls (not modelled -
              see the peripheral comment); SPDIF forces Master transmitter regardless of
              the Audio mode row above (RM note under MODE[1:0]).
          - key: data_size
            name: Data size
            sdk_field: SAI_DataSize
            type: enum
            default: 16 bits
            options:
              - { name: 8 bits,  value: 2, sdk: SAI_DataSize_8b }
              - { name: 10 bits, value: 3, sdk: SAI_DataSize_10b }
              - { name: 16 bits, value: 4, sdk: SAI_DataSize_16b }
              - { name: 20 bits, value: 5, sdk: SAI_DataSize_20b }
              - { name: 24 bits, value: 6, sdk: SAI_DataSize_24b }
              - { name: 32 bits, value: 7, sdk: SAI_DataSize_32b }
            help: "R32_SAI_xCFGR1.DS[2:0], CH32H417RM.md:52370-52392. Ignored for AC'97/SPDIF. The EVT's own example uses 16 bits (hardware.c:97)."
          - key: first_bit
            name: Bit order
            sdk_field: SAI_FirstBit
            type: enum
            default: MSB first
            options:
              - { name: MSB first, value: 0, sdk: SAI_FirstBit_MSB }
              - { name: LSB first, value: 1, sdk: SAI_FirstBit_LSB }
            help: "R32_SAI_xCFGR1.LSBFIRST, CH32H417RM.md:52353-52368. Ignored for AC'97/SPDIF."
          - key: clock_strobing
            name: Clock strobing edge
            sdk_field: SAI_ClockStrobing
            type: enum
            default: Rising edge
            options:
              - { name: Falling edge, value: 0, sdk: SAI_ClockStrobing_FallingEdge }
              - { name: Rising edge,  value: 1, sdk: SAI_ClockStrobing_RisingEdge }
            help: "R32_SAI_xCFGR1.CKSTR, CH32H417RM.md:52338-52351. The EVT's own example uses Rising edge (hardware.c:99)."
          - key: synchro
            name: Synchronisation
            sdk_field: SAI_Synchro
            type: enum
            default: Asynchronous
            options:
              - { name: Asynchronous, value: 0, sdk: SAI_Asynchronous }
              - { name: Synchronous,  value: 1, sdk: SAI_Synchronous }
            help: >
              R32_SAI_xCFGR1.SYNCEN[1:0], CH32H417RM.md:52313-52335. Synchronous makes this
              block track the OTHER block's bit/frame clock, and the RM requires the
              tracking block to be in a slave Audio mode when it does. The EVT's own
              example uses Asynchronous (hardware.c:100).
          - key: out_drive
            name: Output drive timing
            sdk_field: SAI_OutDRIV
            const: 0
            help: >
              ch32h417_sai.h:46-47. The struct member exists and `SAI_Init()` OR's it
              straight into CFGR1 (ch32h417_sai.c:55), but the header's own doc comment
              points at "@ref SAI_Block_Output_Drive" and NO SUCH GROUP IS DEFINED anywhere
              in this header - unlike every other `@ref` on this struct, which all resolve.
              Fixed at 0 because that is what a zero-initialised struct gives it and what
              this part's own SAI_Play example leaves it at (never assigns
              `.SAI_OutDRIV`); there is no documented alternative to offer instead.
          - key: no_divider
            name: Master clock divider
            sdk_field: SAI_NoDivider
            type: enum
            default: Enabled
            options:
              - { name: Enabled,  value: 0, sdk: SAI_MasterDivider_Enabled }
              - { name: Disabled, value: 1, sdk: SAI_MasterDivider_Disabled }
            help: "R32_SAI_xCFGR1.NODIV, CH32H417RM.md:52262-52272. Disabled feeds the master clock straight through and makes the divider row below inactive."
          - key: master_divider
            name: Master clock divider value
            sdk_field: SAI_MasterDivider
            type: int
            default: 0
            min: 0
            max: 63
            help: >
              R32_SAI_xCFGR1.MCKDIV[5:0], CH32H417RM.md:52245-52261. 0 divides by 1;
              non-zero values divide by the RM's own formula. Ignored when Master clock
              divider above is Disabled. The EVT's own example computes this at runtime
              from a target sample rate (hardware.c:80-91, `tmpdiv`) rather than using a
              fixed constant, so 0 is the only value this file can cite without inventing
              a target rate.
          - key: fifo_threshold
            name: FIFO threshold
            sdk_field: SAI_FIFOThreshold
            type: enum
            default: FIFO empty
            options:
              - { name: FIFO empty,             value: 0, sdk: SAI_Threshold_FIFOEmpty }
              - { name: "1/4 full",             value: 1, sdk: SAI_FIFOThreshold_1QuarterFull }
              - { name: Half full,              value: 2, sdk: SAI_FIFOThreshold_HalfFull }
              - { name: "3/4 full",             value: 3, sdk: SAI_FIFOThreshold_3QuartersFull }
              - { name: Full,                   value: 4, sdk: SAI_FIFOThreshold_Full }
            help: "R32_SAI_xCFGR2.FTH[2:0], CH32H417RM.md:52563-52579. The EVT's own example uses FIFO empty (hardware.c:101)."
          # Frame/Slot - landed 2026-09-14 on AGENT-2's multi-struct channel_params
          # mechanism (board 2026-09-13T19:25Z, verified: node tests/run.js
          # "channel_multi_struct" 5/5). Both `SAI_FrameInit(SAI_Block_x, &s)` and
          # `SAI_SlotInit(SAI_Block_x, &s)` (ch32h417_sai.h:242-243) take the SAME
          # handle as the block's own `SAI_Init` - the case this mechanism fits exactly
          # (unlike DFSDM's Filter/Rc/Jc, which need a SECOND, DIFFERENT handle axis -
          # see the DFSDM peripheral comment; not the same gap, not landed by this).
          # `codegen.init_structs` needs SAI_FrameInitTypeDef/SAI_SlotInitTypeDef
          # entries (below `data/mcus/CH32H417.yaml`'s `codegen:` block, hand-edited -
          # that section is outside the generator's own scope, same as LPTIM/DFSDM).
          - key: frame_length
            name: Frame length
            struct: SAI_FrameInitTypeDef
            sdk_field: SAI_FrameLength
            type: int
            default: 32
            min: 8
            max: 256
            help: "R32_SAI_xFRCR.FRL[7:0]+1, ch32h417_sai.h:67-70, CH32H417RM.md 23.5.6 (SAI_xFRCR). EVT SAI_Play example: 32 (hardware.c:104)."
          - key: active_frame_length
            name: Frame sync active length
            struct: SAI_FrameInitTypeDef
            sdk_field: SAI_ActiveFrameLength
            type: int
            default: 16
            min: 1
            max: 128
            help: "R32_SAI_xFRCR.FSALL[6:0]+1, ch32h417_sai.h:72-76. EVT SAI_Play example: 16 (hardware.c:105)."
          - key: fs_definition
            name: Frame sync definition
            struct: SAI_FrameInitTypeDef
            sdk_field: SAI_FSDefinition
            type: enum
            default: Start of frame
            options:
              - { name: Start of frame,            value: 0,              sdk: SAI_FS_StartFrame }
              - { name: Start + channel identify,  value: 16777216,       sdk: I2S_FS_ChannelIdentification }
            help: "R32_SAI_xFRCR.FSDEF, ch32h417_sai.h:78-80. EVT SAI_Play example: Start of frame (hardware.c:106)."
          - key: fs_polarity
            name: Frame sync polarity
            struct: SAI_FrameInitTypeDef
            sdk_field: SAI_FSPolarity
            type: enum
            default: Active high
            options:
              - { name: Active low,  value: 0,        sdk: SAI_FS_ActiveLow }
              - { name: Active high, value: 33554432,  sdk: SAI_FS_ActiveHigh }
            help: "R32_SAI_xFRCR.FSPOL, ch32h417_sai.h:82-84. EVT SAI_Play example: Active high (hardware.c:107)."
          - key: fs_offset
            name: Frame sync offset
            struct: SAI_FrameInitTypeDef
            sdk_field: SAI_FSOffset
            type: enum
            default: Before first bit
            options:
              - { name: On first bit,        value: 0,        sdk: SAI_FS_FirstBit }
              - { name: Before first bit,     value: 67108864, sdk: SAI_FS_BeforeFirstBit }
            help: "R32_SAI_xFRCR.FSOFF, ch32h417_sai.h:86-90. EVT SAI_Play example: Before first bit (hardware.c:108)."
          - key: slot_first_bit_offset
            name: Slot first-bit offset
            struct: SAI_SlotInitTypeDef
            sdk_field: SAI_FirstBitOffset
            type: int
            default: 0
            min: 0
            max: 24
            help: "R32_SAI_xSLOTR.FBOFF[4:0], ch32h417_sai.h:99-101. EVT SAI_Play example: 0 (hardware.c:110)."
          - key: slot_size
            name: Slot size
            struct: SAI_SlotInitTypeDef
            sdk_field: SAI_SlotSize
            type: enum
            default: 16 bits
            options:
              - { name: Same as Data size, value: 0,   sdk: SAI_SlotSize_DataSize }
              - { name: 16 bits,           value: 64,  sdk: SAI_SlotSize_16b }
              - { name: 32 bits,           value: 128, sdk: SAI_SlotSize_32b }
            help: "R32_SAI_xSLOTR.SLOTSZ[1:0], ch32h417_sai.h:103-105. EVT SAI_Play example: 16 bits (hardware.c:111)."
          - key: slot_number
            name: Number of slots
            struct: SAI_SlotInitTypeDef
            sdk_field: SAI_SlotNumber
            type: int
            default: 2
            min: 1
            max: 16
            help: "R32_SAI_xSLOTR.NBSLOT[3:0]+1, ch32h417_sai.h:107-109. EVT SAI_Play example: 2 (hardware.c:112)."
          - key: slot_active
            name: Active slots (bitmask, bit N = slot N)
            struct: SAI_SlotInitTypeDef
            sdk_field: SAI_SlotActive
            type: int
            default: 4294901760
            min: 0
            max: 4294901760
            help: >
              R32_SAI_xSLOTR.SLOTEN[15:0], ch32h417_sai.h:111-113 - the header's own
              macros are PRE-SHIFTED into bits[31:16] (`SAI_SlotActive_0` = 0x00010000,
              one bit per slot up to `SAI_SlotActive_15` = 0x80000000), so this value is
              written to the struct member directly, no shift needed here. EVT SAI_Play
              example: `SAI_SlotActive_ALL` = 0xFFFF0000, all 16 slots (hardware.c:113).
      notes: >
        `SAI_FrameInitTypeDef`/`SAI_SlotInitTypeDef` landed 2026-09-14 via
        `channel_params`'s multi-struct mechanism (both share the block's own handle -
        `SAI_FrameInit(SAI_Block_x, ...)`/`SAI_SlotInit(SAI_Block_x, ...)`).

  HSADC:
    comment: |
      ONLY THE THREE MEMBERS THAT ARE A CONFIGURATION ARE ROWS. `HSADC_InitTypeDef` has
      eleven, and the other eight describe a DMA transfer in progress rather than the
      converter: two 32-bit receive ADDRESSES, three transfer LENGTHS, and the DMA,
      dual-buffer and burst-mode switches that only mean anything once those addresses
      point at real buffers (ch32h417_hsadc.h:22-56). Those are firmware state, not a pin
      or clock plan, and a buffer address is a symbol this tool cannot know - so they are
      left at the struct's zero-initialiser and named in `notes:` rather than offered as
      rows that would write zeros over whatever the user set up.
    yaml: |
      params:
        - key: datasize
          name: Data size
          struct: HSADC_InitTypeDef
          sdk_field: HSADC_DataSize
          type: enum
          default: 16-bit
          options:
            - { name: 16-bit, value: 0, sdk: HSADC_DataSize_16b }
            - { name: 8-bit , value: 1, sdk: HSADC_DataSize_8b }
          help: "ch32h417_hsadc.h:67-68. How wide each sample is in the receive buffer - 8-bit halves the memory a burst costs and throws away the low byte."
        - key: firstcycle
          name: First conversion cycle
          struct: HSADC_InitTypeDef
          sdk_field: HSADC_FirstConversionCycle
          type: enum
          default: "8"
          options:
            - { name: "8" , value: 0, sdk: HSADC_First_Conversion_Cycle_8 }
            - { name: "9" , value: 1, sdk: HSADC_First_Conversion_Cycle_9 }
            - { name: "10", value: 2, sdk: HSADC_First_Conversion_Cycle_10 }
          help: "ch32h417_hsadc.h:60-63. How many cycles the converter takes before its first sample is valid; the three the header offers are 8, 9 and 10."
        - key: clkdiv
          name: Clock division
          struct: HSADC_InitTypeDef
          sdk_field: HSADC_ClockDivision
          type: int
          default: 0
          min: 0
          max: 63
          help: "ch32h417_hsadc.h:32-33, a number between 0x00 and 0x3F. The high-speed ADC's own divider off its clock source; the clock tree that would let this tool show you the resulting sample rate is not modelled on this part yet."
      notes: >
        High-speed ADC. Pick its pads on the `Channels` row - IN0 to IN6, seven dedicated
        analog inputs - and its converter setup in Parameter Settings.
        THE EIGHT DMA MEMBERS OF `HSADC_InitTypeDef` ARE DELIBERATELY NOT ROWS:
        `HSADC_RxAddress0` and `HSADC_RxAddress1` are buffer addresses, symbols in your own
        program that this tool cannot know; `HSADC_BurstMode_TransferLen`,
        `HSADC_BurstMode_DMA_LastTransferLen` and `HSADC_DMA_TransferLen` are the lengths
        of a transfer into them; and `HSADC_DMA`, `HSADC_DualBuffer` and `HSADC_BurstMode`
        only mean anything once those addresses point somewhere real
        (ch32h417_hsadc.h:22-56). They stay at the struct's zero-initialiser, so set them
        in the USER CODE block before starting a conversion. The three rows above are the
        whole of what is a configuration rather than a transfer.

  USART4: { yaml: *usart_params }
  USART5: { yaml: *usart_params }
  USART6: { yaml: *usart_params }
  USART7: { yaml: *usart_params }
  USART8: { yaml: *usart_params }

  SPI3: { yaml: *spi_params }
  SPI4: { yaml: *spi_params }

  I2C3: { yaml: *i2c_params }
  I2S2: { yaml: *i2s_params }
  I2S3: { yaml: *i2s_params }
  I2C4: { yaml: *i2c_params }

  TIM5:  { yaml: *tim_gp16_params }
  TIM6:  { yaml: *tim_basic_params }
  TIM7:  { yaml: *tim_basic_params }
  TIM8:  { yaml: *tim_adv_params }
  TIM9:  { yaml: *tim_gp32_params }
  TIM10: { yaml: *tim_gp32_params }
  TIM11: { yaml: *tim_gp32_params }
  TIM12: { yaml: *tim_gp32_params }

  ADC1: { yaml: *adc_params }
  ADC2: { yaml: *adc_params }

  CAN1: { yaml: *can_params }
  CAN2: { yaml: *can_params }
  CAN3: { yaml: *can_params }

  DVP:   { yaml: *dvp_params }
  IPC:   { yaml: *ipc_params }

  LPTIM1: { yaml: *lptim_params }
  LPTIM2: { yaml: *lptim_params }
  # "Single wire with supply" (IO+SUP together) is NOT offered - main's ruling, board
  # 2026-09-14, on AGENT-3's finding: `SUP` (SWP_SUP) has NO PAD AT ALL in 1-wire mode.
  # DS Table 2-2-26 marks it "-" under its own "Optional pins (1-wire mode)" column
  # (CH32H417DS0.md, SWPMI Pin Functions), and the RM scopes `SUP` explicitly to
  # "Non-1-wire mode" (CH32H417RM.md:11003) - two independent sources agreeing, no
  # register bit and no SWPMI EVT example anywhere in this part's tree to check either
  # way. Full citation is in the peripheral's own `notes:` above (swpmi_params), so it
  # ships to the app as well as to whoever reads this file next.
  SWPMI: { yaml: *swpmi_params }

  QSPI1: { yaml: *qspi_params }
  QSPI2: { yaml: *qspi_params }

  # ETH's `notes:` were hand-added to the GENERATED block on 2026-09-12 (commit 9a502ae,
  # AGENT-4), where `--splice --refresh` deletes them - the generator's loss guard reported
  # "ETH.notes: dropped" on the next run. Moved here, with the four MDI pads moved to
  # dedicated_pins.yaml, so a refresh reproduces both instead of losing them once. The
  # reasoning below is that commit's, kept word for word because it is cited work.
  ETH:
    yaml: |
      notes: >
        MAC plus a BUILT-IN 10/100M PHY: "Single chip can realize Ethernet communication",
        and "MAC and 100M PHY are fully integrated, and the periphery only needs
        capacitance" (CH32H417DS0.md 1.4.31, 1.2). So the ordinary configuration is the
        internal PHY - four media-dependent pads straight to the magnetics, with no
        MAC-to-PHY interface on pins at all, and nothing to select. RGMII is the OTHER
        supported configuration and the only interface the DS names: it is how an external
        1Gbps PHY is attached, which the DS calls "Optional Ethernet controller MAC +
        external 1Gbps PHY". MII and RMII are deliberately NOT offered. Neither word
        appears anywhere in this part's datasheet - its Ethernet section lists only RGMII -
        and a choice the silicon does not have is the defect class this project exists to
        remove. (Before this change the file offered MII and RMII, both invented.)
        The four pads are MDIRN/MDIRP (receive pair) and MDITN/MDITP (transmit pair), DS
        Table 2-1-1 at CH32H417DS0.md:3919-3930. They are dedicated pins rather than GPIO
        alternates, which is why they live in data/sources/H417/dedicated_pins.yaml where
        the generator can see them.

  CMP:
    comment: |
      `CMP_InitTypeDef` (ch32h417_opa.h:145-151) is applied WHOLE by
      `OPA_CMP_Init(CMP_InitTypeDef*)` (ch32h417_opa.h:169, ch32h417_opa.c:110-120,
      writes R32_CMP_CTLR bits [12:0] in one go) - `no_handle: true`, this part has one
      comparator (unlike CH32L103's three, so there is no `CMP_NUM` here at all - the
      CH32L103 instance-fixing trap this comment used to warn about does not apply to
      this part's silicon).

      `PSEL`/`NSEL` are NOT free-standing choices: they are DERIVED from the "Positive
      input"/"Negative input" settings above, which already decide the pad (or the
      internal OPA1/DAC2 tap) - offering them again as a second dropdown could disagree
      with the pin picker (FORMAT.md "Do not duplicate a setting"). Each is a `const:`
      row keyed by `depends_on:` to its setting's choice, the same shape DVP's data-width
      rows use.

      `MODE[3:0]` (CH32H417RM.md:50694-50735) is bigger than the "Output" setting
      models: 0000 is "drive the GPIO pad" (what "Output: OUT" claims), but 0001-1110
      route the comparator result INTERNALLY to one of eleven timers'
      break/capture inputs (TIM1_BKIN, TIM8_BKIN, TIMx_CH4 x8, LPTIM1/2_CH1) with NO pad
      involved, and 1111 turns the output off entirely. Modelling only 0000 (const,
      depends_on Output=OUT) rather than adding an eleven-target second setting that
      could contradict the pin claim - TASKS.md line for the internal-routing capability,
      not guessed into an unverified interaction with the pin picker.

      `OPA_CMP_Cmd(ENABLE)` (ch32h417_opa.c:149-159) is a SEPARATE call after
      `OPA_CMP_Init()`, same gap as DAC's `DAC_Cmd` (comment above, `channel_params` /
      plain `params:` have no slot for a required follow-up call) - the four real fields
      below configure the comparator but do not yet enable it.
    yaml: |
      params:
        - key: psel_p0
          name: Positive input select
          struct: CMP_InitTypeDef
          sdk_field: PSEL
          const: CMP_CHP_0
          depends_on: { setting: "Positive input", equals: P0 }
          help: "R32_CMP_CTLR PSEL[1:0]=00 (CH32H417RM.md:50767-50768). Derived from the Positive input setting, not a separate choice."
        - key: psel_p1
          name: Positive input select
          struct: CMP_InitTypeDef
          sdk_field: PSEL
          const: CMP_CHP_1
          depends_on: { setting: "Positive input", equals: P1 }
          help: "R32_CMP_CTLR PSEL[1:0]=01 (CH32H417RM.md:50769-50770)."
        - key: psel_p2
          name: Positive input select
          struct: CMP_InitTypeDef
          sdk_field: PSEL
          const: CMP_OPA1
          depends_on: { setting: "Positive input", equals: "P2 (OPA1 output, internal - claims no pin)" }
          help: "R32_CMP_CTLR PSEL[1:0]=10, OPA1 output (CH32H417RM.md:50771-50772)."
        - key: nsel_n0
          name: Negative input select
          struct: CMP_InitTypeDef
          sdk_field: NSEL
          const: CMP_CHN0
          depends_on: { setting: "Negative input", equals: N0 }
          help: "R32_CMP_CTLR NSEL[1:0]=00 (CH32H417RM.md:50756-50758)."
        - key: nsel_n1
          name: Negative input select
          struct: CMP_InitTypeDef
          sdk_field: NSEL
          const: CMP_CHN1
          depends_on: { setting: "Negative input", equals: N1 }
          help: "R32_CMP_CTLR NSEL[1:0]=01 (CH32H417RM.md:50759-50760)."
        - key: nsel_n2
          name: Negative input select
          struct: CMP_InitTypeDef
          sdk_field: NSEL
          const: CMP_DAC2
          depends_on: { setting: "Negative input", equals: "N2 (DAC channel 2 output, internal - claims no pin)" }
          help: >
            R32_CMP_CTLR NSEL[1:0]=10, "DAC2 output (PA5)" (CH32H417RM.md:50761-50762) -
            DAC CHANNEL 2's own output pin, not channel 1's (PA4). DISAGREEMENT: DS
            Table 2-2-22 reads "DAC1_OUT/CMP_N2" (CH32H417DS0.md:7368); the register-level
            RM text is followed here as the more specific source. Recorded, not averaged.
        - key: mode_gpio
          name: Output routing
          struct: CMP_InitTypeDef
          sdk_field: Mode
          const: OUT_TO_IO
          depends_on: { setting: Output, equals: OUT }
          help: >
            R32_CMP_CTLR MODE[3:0]=0000, "Connect to GPIO" (CH32H417RM.md:50694-50698).
            Derived from the Output setting. The other 15 MODE codes route the result to
            an internal timer break/capture input instead of a pad (CH32H417RM.md:
            50699-50734) - not modelled, TASKS.md line.
        - key: vref
          name: Internal bias voltage
          struct: CMP_InitTypeDef
          sdk_field: VREF
          type: enum
          default: Disabled
          options:
            - { name: Disabled,       value: 0, sdk: CMP_VREF_OFF }
            - { name: "1/4 VDD33A",   value: 1, sdk: CMP_VREF_25PER_VDD }
            - { name: "1/2 VDD33A",   value: 2, sdk: CMP_VREF_50PERT_VDD }
            - { name: "3/4 VDD33A",   value: 3, sdk: CMP_VREF_75PERC_VDD }
          help: "R32_CMP_CTLR VREF[1:0], CH32H417RM.md:50666-50677. Default matches the EVT's OPA_CMP_StructInit() (ch32h417_opa.c) and the register reset (both 0)."
        - key: hypsel
          name: Hysteresis voltage
          struct: CMP_InitTypeDef
          sdk_field: HYPSEL
          type: enum
          default: 0 mV
          options:
            - { name: 0 mV,  value: 0, sdk: CMP_HYPSEL_OFF }
            - { name: 10 mV, value: 1, sdk: CMP_HYPSEL_10mV }
            - { name: 20 mV, value: 2, sdk: CMP_HYPSEL_20mV }
            - { name: 30 mV, value: 3, sdk: CMP_HYPSEL_30mV }
          help: "R32_CMP_CTLR HYPSEL[1:0], CH32H417RM.md:50678-50689. Default matches the register reset (0)."

  OPA:
    comment: |
      `OPA_InitTypeDef` (ch32h417_opa.h:76-83) is applied PER INSTANCE by
      `OPA_Init(OPA_Num_TypeDef OPAx, OPA_InitTypeDef*)` (ch32h417_opa.c:40-53, writes
      R32_OPA_CTLR<n> whole in one go) - `channel_params.instances`, same shape as DAC's
      two channels, keyed to the three existing "OPA<n> ..." setting rows instead of a
      channel number. `OPA1`/`OPA2`/`OPA3` (ch32h417_opa.h:24-28) select the register via
      `OPA_BASE + (OPAx << 2)` (ch32h417_opa.c:44-45) - R32_OPA_CTLR1/2/3
      (CH32H417RM.md:50363-50365).

      `PSEL`/`NSEL`/`Mode` LANDED 2026-09-14 on AGENT-2's `depends_on: {
      instance_setting: ... }` mechanism (`app/tests/instance_setting.test.js`, 4
      tests, verified here before landing). Each field is DERIVED from a setting whose
      NAME differs per instance ("OPA1 positive input" vs "OPA2 positive input" vs
      "OPA3 positive input"), and the shape is the SAME one DVP's `DVP_DataSize`
      already uses above (`const:` rows, one dependency each, exactly one applies) -
      not the single-free-enum shape a first reading of the mechanism's own worked
      example might suggest. Checked directly against `app/tests/instance_setting.test.js`
      before writing this: a `depends_on`-gated row with real OPTIONS and no matching
      row for the OTHER live setting state leaves the struct member UNWRITTEN (not
      wrong-but-present) whenever that other state is active - the same class of silent
      gap `DVP_DataSize`'s own comment names ("a separate editable width would let a
      project claim twelve pads and configure eight"). So PSEL/NSEL/Mode are each a PAIR
      of `const:` rows, one per live setting choice, same `sdk_field:`, mutually
      exclusive `depends_on:` - exactly one ever applies per instance, never zero.

      `NSEL`'s FULL enumeration (`ch32h417_opa.h:36-44`) has SIX real values -
      `CHN0`/`CHN1` (external pads, matching this part's own "N0"/"N1" setting choices)
      PLUS `CHN_PGA_8xIN`/`16xIN`/`32xIN`/`64xIN` (internal PGA feedback taps, no
      external pad) - but the "OPA{n} negative input" setting only offers `N0`/`N1`
      today, so only those two are modelled; the four PGA multiplier values would need
      NEW setting choices first (a settings-shape addition, not a params one - not
      built here). Same gap on `Mode`: `OUT_TO_CMP` ("only for OPA1", routes internally
      to the comparator, no pad) has no corresponding choice on "OPA{n} output" either
      (`Disable`/`OUT0`/`OUT1` only) - not modelled for the same reason.

      `OPA_Cmd(OPAx, ENABLE)` (ch32h417_opa.c:84-98) is a SEPARATE call after
      `OPA_Init()`, same gap as DAC's `DAC_Cmd` / CMP's `OPA_CMP_Cmd` (comments above) -
      the fields below configure gain/feedback/speed/routing but do not yet enable
      the op-amp.
    yaml: |
      channel_params:
        struct: OPA_InitTypeDef
        applies_per: channel
        instances:
          1: { sdk_call: OPA_Init, handle: OPA1, setting: "OPA1 positive input", active_choices: [P0, P1] }
          2: { sdk_call: OPA_Init, handle: OPA2, setting: "OPA2 positive input", active_choices: [P0, P1] }
          3: { sdk_call: OPA_Init, handle: OPA3, setting: "OPA3 positive input", active_choices: [P0, P1] }
        params:
          - key: psel_p0
            name: Positive input
            sdk_field: PSEL
            const: CHP0
            depends_on: { instance_setting: "OPA{n} positive input", equals: P0 }
            help: "R32_OPA_CTLR<n> PSEL, ch32h417_opa.h:29-33. Fixed by the OPA<n> positive input row, which is what claims the P0 pad."
          - key: psel_p1
            name: Positive input
            sdk_field: PSEL
            const: CHP1
            depends_on: { instance_setting: "OPA{n} positive input", equals: P1 }
            help: "R32_OPA_CTLR<n> PSEL, ch32h417_opa.h:29-33. Fixed by the OPA<n> positive input row, which is what claims the P1 pad."
          - key: nsel_n0
            name: Negative input
            sdk_field: NSEL
            const: CHN0
            depends_on: { instance_setting: "OPA{n} negative input", equals: N0 }
            help: >
              R32_OPA_CTLR<n> NSEL, ch32h417_opa.h:36-44. Fixed by the OPA<n> negative
              input row, which is what claims the N0 pad. NSEL's other four values
              (CHN_PGA_8xIN/16xIN/32xIN/64xIN, internal PGA feedback taps, no pad) are
              NOT modelled - see the peripheral comment.
          - key: nsel_n1
            name: Negative input
            sdk_field: NSEL
            const: CHN1
            depends_on: { instance_setting: "OPA{n} negative input", equals: N1 }
            help: "R32_OPA_CTLR<n> NSEL, ch32h417_opa.h:36-44. Fixed by the OPA<n> negative input row, which is what claims the N1 pad."
          - key: mode_out0
            name: Output routing
            sdk_field: Mode
            const: OUT_IO_OUT0
            depends_on: { instance_setting: "OPA{n} output", equals: OUT0 }
            help: >
              R32_OPA_CTLR<n> MODE, ch32h417_opa.h:49-53. Fixed by the OPA<n> output
              row, which is what claims the OUT0 pad. OUT_TO_CMP (routes internally to
              the comparator, OPA1 only, no pad) is NOT modelled - see the peripheral
              comment.
          - key: mode_out1
            name: Output routing
            sdk_field: Mode
            const: OUT_IO_OUT1
            depends_on: { instance_setting: "OPA{n} output", equals: OUT1 }
            help: "R32_OPA_CTLR<n> MODE, ch32h417_opa.h:49-53. Fixed by the OPA<n> output row, which is what claims the OUT1 pad."
          - key: fb
            name: PGA feedback resistor
            struct: OPA_InitTypeDef
            sdk_field: FB
            type: enum
            default: Off
            options:
              - { name: Off, value: 0, sdk: FB_OFF }
              - { name: On,  value: 1, sdk: FB_ON }
            help: "R32_OPA_CTLR1 FB_EN1 bit 8 (CH32H417RM.md:50396-50400, OPA1's register; OPA2/3 have the analogous FB_EN2/3 in their own CTLR). Default matches the register reset (0)."
          - key: pgadif
            name: PGA differential input mode
            struct: OPA_InitTypeDef
            sdk_field: PGADIF
            type: enum
            default: Off
            options:
              - { name: Off, value: 0, sdk: DIF_OFF }
              - { name: On,  value: 1, sdk: DIF_ON }
            help: "R32_OPA_CTLR1 PGADIF1 bit 9 (CH32H417RM.md:50388-50395). Connects the N terminal to OPA<n>_CHN1 for differential PGA use. Default matches the register reset (0)."
          - key: hs
            name: High-speed mode
            struct: OPA_InitTypeDef
            sdk_field: HS
            type: enum
            default: Off
            options:
              - { name: Off, value: 0, sdk: HS_OFF }
              - { name: On,  value: 1, sdk: HS_ON }
            help: "R32_OPA_CTLR1 HS1 bit 10 (CH32H417RM.md:50378-50383). Default matches the register reset (0)."

  DAC:
    comment: |
      `DAC_InitTypeDef` (ch32h417_dac.h:22-38) is applied PER CHANNEL by
      `DAC_Init(uint32_t DAC_Channel, DAC_InitTypeDef*)` (ch32h417_dac.h:104), the same
      `channel_params`/`instances` shape this file already uses for SAI's two blocks -
      here keyed to the two existing "Channel 1"/"Channel 2" settings rows instead of a
      channel number.

      `output_buffer` IS A GENUINE DISAGREEMENT, recorded rather than picked quietly:
      `R32_DAC_CTLR` resets to `0x00000000` (CH32H417RM.md:22064) and BOFF1's own bit
      description reads "DAC channel1 output buffer disable control (Recommended to be
      enabled)" (CH32H417RM.md:22318-22320) - both point at `DAC_OutputBuffer_Enable`
      (value 0). The EVT's own example runs the opposite,
      `DAC_OutputBuffer_Disable` (Evt/EXAM/DAC/DAC_Normal_OUT/Common/hardware.c:43).
      Default here is Enable: two independent sources (the reset state and the RM's own
      recommendation) against one example's runtime choice, and a board disabling the
      buffer is plausibly a board fact, not a part fact - the user-visible row makes a
      wrong default one click from fixed either way.

      `DAC_Cmd(DAC_Channel_x, ENABLE)` (ch32h417_dac.h:106) is a SEPARATE call the EVT
      example always makes right after `DAC_Init()` (hardware.c:45) - `channel_params`
      has no slot for a required follow-up call today, so selecting "Output on pin"
      configures the channel's mode but does not yet emit the enable. Same class of gap
      as SAI's Frame/Slot (comment above) and I3C's target/controller split: landing the
      four real `DAC_InitTypeDef` fields rather than waiting on a mechanism that also
      does not exist yet, cited here instead of silently shipping a channel that never
      turns on. REQUEST to AGENT-2: `channel_params.instances.<n>` needs an optional
      second call (`cmd_call`/`cmd_args`, or similar) emitted after `sdk_call` succeeds.
      TASKS.md line.
    yaml: |
      channel_params:
        struct: DAC_InitTypeDef
        applies_per: channel
        instances:
          1: { sdk_call: DAC_Init, handle: DAC_Channel_1, setting: "Channel 1", active_choices: ["Output on pin"] }
          2: { sdk_call: DAC_Init, handle: DAC_Channel_2, setting: "Channel 2", active_choices: ["Output on pin"] }
        params:
          - key: trigger
            name: Trigger
            struct: DAC_InitTypeDef
            sdk_field: DAC_Trigger
            type: enum
            default: None (write DHR to convert)
            options:
              - { name: "None (write DHR to convert)", value: 0, sdk: DAC_Trigger_None }
              - { name: "TIM2 TRGO",  value: 1, sdk: DAC_Trigger_T2_TRGO }
              - { name: "TIM4 TRGO",  value: 2, sdk: DAC_Trigger_T4_TRGO }
              - { name: "TIM5 TRGO",  value: 3, sdk: DAC_Trigger_T5_TRGO }
              - { name: "TIM6 TRGO",  value: 4, sdk: DAC_Trigger_T6_TRGO }
              - { name: "TIM7 TRGO",  value: 5, sdk: DAC_Trigger_T7_TRGO }
              - { name: "TIM8 TRGO",  value: 6, sdk: DAC_Trigger_T8_TRGO }
              - { name: "EXTI line 9", value: 7, sdk: DAC_Trigger_Ext_IT9 }
              - { name: "Software",   value: 8, sdk: DAC_Trigger_Software }
            help: "ch32h417_dac.h:24-25. Default matches R32_DAC_CTLR reset (TEN1=0, CH32H417RM.md:22064) and the EVT example (hardware.c:40)."
          - key: wave
            name: Wave generation
            struct: DAC_InitTypeDef
            sdk_field: DAC_WaveGeneration
            type: enum
            default: None
            options:
              - { name: None,     value: 0, sdk: DAC_WaveGeneration_None }
              - { name: Noise,    value: 1, sdk: DAC_WaveGeneration_Noise }
              - { name: Triangle, value: 2, sdk: DAC_WaveGeneration_Triangle }
            help: "ch32h417_dac.h:27-28. Default matches R32_DAC_CTLR reset (WAVE1=00, CH32H417RM.md:22064) and the EVT example (hardware.c:41)."
          - key: lfsr_mask
            name: Noise mask / triangle amplitude
            struct: DAC_InitTypeDef
            sdk_field: DAC_LFSRUnmask_TriangleAmplitude
            type: enum
            default: "Bit 0 / amplitude 1"
            depends_on: { param: wave, ne: None }
            options:
              - { name: "Bit 0 / amplitude 1",         value: 0,  sdk: DAC_LFSRUnmask_Bit0 }
              - { name: "Bits 1:0 / amplitude 3",      value: 1,  sdk: DAC_LFSRUnmask_Bits1_0 }
              - { name: "Bits 2:0 / amplitude 7",      value: 2,  sdk: DAC_LFSRUnmask_Bits2_0 }
              - { name: "Bits 3:0 / amplitude 15",     value: 3,  sdk: DAC_LFSRUnmask_Bits3_0 }
              - { name: "Bits 4:0 / amplitude 31",     value: 4,  sdk: DAC_LFSRUnmask_Bits4_0 }
              - { name: "Bits 5:0 / amplitude 63",     value: 5,  sdk: DAC_LFSRUnmask_Bits5_0 }
              - { name: "Bits 6:0 / amplitude 127",    value: 6,  sdk: DAC_LFSRUnmask_Bits6_0 }
              - { name: "Bits 7:0 / amplitude 255",    value: 7,  sdk: DAC_LFSRUnmask_Bits7_0 }
              - { name: "Bits 8:0 / amplitude 511",    value: 8,  sdk: DAC_LFSRUnmask_Bits8_0 }
              - { name: "Bits 9:0 / amplitude 1023",   value: 9,  sdk: DAC_LFSRUnmask_Bits9_0 }
              - { name: "Bits 10:0 / amplitude 2047",  value: 10, sdk: DAC_LFSRUnmask_Bits10_0 }
              - { name: "Bits 11:0 / amplitude 4095",  value: 11, sdk: DAC_LFSRUnmask_Bits11_0 }
            help: "ch32h417_dac.h:31-32. One field serves both wave modes (ch32h417_dac.h:57-71 aliases the same values as DAC_TriangleAmplitude_*). Default matches R32_DAC_CTLR reset (MAMP1=0000, CH32H417RM.md:22064) and the EVT example (hardware.c:42)."
          - key: output_buffer
            name: Output buffer
            struct: DAC_InitTypeDef
            sdk_field: DAC_OutputBuffer
            type: enum
            default: Enable
            options:
              - { name: Enable,  value: 0, sdk: DAC_OutputBuffer_Enable }
              - { name: Disable, value: 2, sdk: DAC_OutputBuffer_Disable }
            help: >
              ch32h417_dac.h:36. DISAGREEMENT, recorded rather than averaged: R32_DAC_CTLR
              resets to BOFF1=0 = Enable (CH32H417RM.md:22064) and the RM's own bit text
              calls Enable "Recommended" (CH32H417RM.md:22318-22320); the EVT example runs
              Disable instead (Evt/EXAM/DAC/DAC_Normal_OUT/Common/hardware.c:43). Default
              here is Enable (reset state + RM recommendation outrank one unexplained
              example choice) - change it if your board needs otherwise.

  # RTC's `notes:` record a clock gate this schema cannot express, found by the round-6
  # peripheral-map audit. It is here rather than in the MCU file because `--splice
  # --refresh` deletes hand-added notes from the GENERATED block; see the ETH entry above
  # for the commit where that happened once already.
  RTC:
    yaml: |
      notes: >
        ITS CLOCK GATE IS TWO BITS, AND `codegen.periph_clock` HOLDS ONE PER PERIPHERAL,
        so the RTC deliberately has no entry there and the generated C says so instead of
        writing half of it. The EVT enables both in one call -
        `RCC_HB1PeriphClockCmd(RCC_HB1Periph_PWR | RCC_HB1Periph_BKP, ENABLE);` followed by
        `PWR_BackupAccessCmd(ENABLE);` - at
        data/sources/H417/Evt/EXAM/RTC/RTC_Calendar/Common/hardware.c:94-95, and repeats it
        at :205-206 and :247-248. Both bits are in RCC_HB1PCENR: BKPEN is bit 27 and PWREN
        bit 28 (CH32H417RM.md:3538 and :3535). BKP alone would gate the backup unit and
        leave the power interface off, which is a half-enable that reads exactly like a
        whole one - the failure this file's ETH entry above also records. There is no
        `RCC_*Periph_RTC` macro anywhere in ch32h417_rcc.h: its complete
        `RCC_*Periph_*` block is lines 230-307, and the RTC appears there only as
        `RCC_RTCCLKSource_*` (:226-228) and `RCC_RTCCLKCmd` (:646), which SELECT and run
        the RTC clock rather than gate the bus interface. Tracked in TASKS.md, owner
        AGENT-2 for the schema half.
      params:
        # ch32h417_rtc.h has ZERO typedefs - every row here is applied by CALLING a
        # function, the same shape CH32L103's RTC uses (data/mcus/CH32L103.yaml:1862-
        # 1885). Default is this PART'S OWN EVT example, not L103's: CH32H417's
        # RTC_Calendar example runs RCC_RTCCLKConfig(RCC_RTCCLKSource_LSI) then
        # RTC_SetPrescaler(40000) (hardware.c:112,131) - LSI, not a 32.768 kHz LSE - so
        # 32767 (L103's number) would be the wrong clock's math carried across parts.
        - key: prescaler
          name: Prescaler
          sdk_call: RTC_SetPrescaler
          sdk_args: [$VALUE]
          type: int
          group: Basic
          default: 40000
          min: 0
          max: 1048575
          help: "ch32h417_rtc.h:41. 20-bit field (CH32H417RM.md:9980, RTC_PSCRH/RTC_PSCRL PRL[19:0]). Default matches this part's own EVT example (hardware.c:112,131), which clocks RTC from LSI, not LSE - do not carry over another part's LSE-based number."
        - key: alarm
          name: Alarm value
          sdk_call: RTC_SetAlarm
          sdk_args: [$VALUE]
          type: int
          group: Advanced
          default: 0
          min: 0
          max: 4294967295
          help: "ch32h417_rtc.h:42. A data compare register, not a field with a documented reset recommendation; 0 matches the EVT example's starting point (hardware.c:249)."

  LTDC:
    comment: |
      THE OUTPUT WIDTH IS A WIRING CHOICE, NOT A REGISTER, and that is the whole reason
      this row exists. RM 43.4.5: the global control register `R32_LTDC_GCR` carries four
      polarity bits and an enable, and bits [27:1] are reserved - there is no field that
      narrows the bus. The controller always drives a 24-bit parallel RGB port; a 16- or
      18-bit panel is wired to the HIGH bits of each channel and the low ones are simply
      not connected. So the choice below is "how many lines did you wire", and every line
      it does not claim stays an ordinary pin that any other peripheral may take.

      The subsets are the standard panel wiring (panel MSB to controller MSB), which is
      also how the datasheet numbers the pads: R7/G7/B7 are the most significant.

        RGB888  24 lines  R0-R7  G0-G7  B0-B7      frees nothing
        RGB666  18 lines  R2-R7  G2-G7  B2-B7      frees 6: R0-R1, G0-G1, B0-B1
        RGB565  16 lines  R3-R7  G2-G7  B3-B7      frees 8: R0-R2, G0-G1, B0-B2

      NOT the same thing as an "8-bit mode", which is a question people ask of this
      controller and which has a different answer: `LTDC_LxPFCR.PF[2:0]` (RM 43.4.18)
      offers L8, AL44 and AL88 - eight bits per pixel - but those describe the LAYER'S
      FRAME BUFFER IN MEMORY. The pixel format converter expands every one of them to
      ARGB8888 before the blender, so an 8-bit format saves RAM and frees no pin at all.
      It IS selectable and it IS applied: `Pixel format` is a member of the per-layer
      init below, written by `LTDC_LayerInit()` into `PFCR` beside the window geometry.
      The two axes sit on one peripheral on purpose - the panel wiring and the buffer
      format are the same planning decision - and neither one moves a pin the other owns.
    yaml: |
      # THE PANEL TIMING, and it is peripheral-level where the layer block above is
      # per-layer. `LTDC_Init(&s)` (ch32h417_ltdc.h:224) takes the struct alone - the
      # controller is a singleton, so `no_handle: true` - and every member below is one of
      # its fifteen. The four polarities are what a panel datasheet states; the eight
      # counters are its blanking diagram.
      #
      # THE COUNTERS ARE ACCUMULATED, NOT WIDTHS, and getting that wrong is the classic way
      # an LTDC brings up a blank panel. The header says so member by member
      # (ch32h417_ltdc.h:36-57): AccumulatedHBP ranges "from LTDC_HorizontalSync to 0xFFF",
      # AccumulatedActiveW "from LTDC_AccumulatedHBP", TotalWidth "from
      # LTDC_AccumulatedActiveW". So each is the running total from the start of the line,
      # minus one, and NOT the porch's own width:
      #
      #     HorizontalSync      = HSW - 1
      #     AccumulatedHBP      = HSW + HBP - 1
      #     AccumulatedActiveW  = HSW + HBP + ActiveWidth - 1
      #     TotalWidth          = HSW + HBP + ActiveWidth + HFP - 1
      #
      # and the same four vertically. The defaults are 0 because a timing this tool cannot
      # know is better left at the register's reset value than guessed: there is no
      # `LTDC_StructInit()` default worth copying here (it zeroes them too), and a plausible
      # 800x480 set would be a made-up panel presented as fact.
      params:
        - key: hs_polarity
          name: HSYNC polarity
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_HSPolarity
          type: enum
          default: Active low
          options:
            - { name: Active low , value: 0, sdk: LTDC_HSPolarity_AL }
            - { name: Active high, value: 1, sdk: LTDC_HSPolarity_AH }
          help: "LTDC_GCR.HSPOL (ch32h417_ltdc.h:159-160). Most parallel RGB panels are active low."
        - key: vs_polarity
          name: VSYNC polarity
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_VSPolarity
          type: enum
          default: Active low
          options:
            - { name: Active low , value: 0, sdk: LTDC_VSPolarity_AL }
            - { name: Active high, value: 1, sdk: LTDC_VSPolarity_AH }
          help: "LTDC_GCR.VSPOL (ch32h417_ltdc.h:163-164)."
        - key: de_polarity
          name: Data-enable polarity
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_DEPolarity
          type: enum
          default: Active low
          options:
            - { name: Active low , value: 0, sdk: LTDC_DEPolarity_AL }
            - { name: Active high, value: 1, sdk: LTDC_DEPolarity_AH }
          help: "LTDC_GCR.DEPOL (ch32h417_ltdc.h:167-168). The DE pad is claimed by the `Sync and clock` row."
        - key: pc_polarity
          name: Pixel-clock polarity
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_PCPolarity
          type: enum
          default: Not inverted
          options:
            - { name: Not inverted, value: 0, sdk: LTDC_PCPolarity_IPC }
            - { name: Inverted    , value: 1, sdk: LTDC_PCPolarity_IIPC }
          help: "LTDC_GCR.PCPOL (ch32h417_ltdc.h:171-172). The SDK spells these IPC and IIPC - input pixel clock, and inverted input pixel clock."
        - key: hsync
          name: HSYNC width - 1
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_HorizontalSync
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_SSCR.HSW, 0x000-0xFFF. The panel's horizontal sync pulse width MINUS ONE - every counter in this block is a zero-based end position."
        - key: vsync
          name: VSYNC height - 1
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_VerticalSync
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_SSCR.VSH, 0x000-0x7FF. Vertical sync pulse height minus one. Note the vertical counters are 11 bits where the horizontal ones are 12."
        - key: hbp
          name: Accumulated HBP
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_AccumulatedHBP
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_BPCR.AHBP. HSYNC width + horizontal back porch - 1. The header requires it to be at least HSYNC width - 1 (ch32h417_ltdc.h:42-43), because it is a running total and not the porch on its own."
        - key: vbp
          name: Accumulated VBP
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_AccumulatedVBP
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_BPCR.AVBP. VSYNC height + vertical back porch - 1."
        - key: active_w
          name: Accumulated active width
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_AccumulatedActiveW
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_AWCR.AAW. HSYNC + HBP + the panel's pixel width - 1. Must be at least the accumulated HBP."
        - key: active_h
          name: Accumulated active height
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_AccumulatedActiveH
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_AWCR.AAH. VSYNC + VBP + the panel's line count - 1."
        - key: total_w
          name: Total width
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_TotalWidth
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_TWCR.TOTALW. The whole line including the front porch, minus one - so HSYNC + HBP + width + HFP - 1. This is what the pixel clock divides into to give the line rate."
        - key: total_h
          name: Total height
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_TotalHeigh
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_TWCR.TOTALH, the whole frame including the vertical front porch, minus one. The SDK spells the member TotalHeigh, without the final t (ch32h417_ltdc.h:56)."
        - key: bg_red
          name: Background red
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_BackgroundRedValue
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_BCCR.BCRED. What the panel shows where no layer covers it - the colour behind both layers, not a layer's own default colour."
        - key: bg_green
          name: Background green
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_BackgroundGreenValue
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_BCCR.BCGREEN."
        - key: bg_blue
          name: Background blue
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_BackgroundBlueValue
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_BCCR.BCBLUE."
      # THE LAYER INIT, ONE STRUCT FILLED ONCE PER LAYER - deliverable E's mechanism, and
      # this peripheral is why it was built. `LTDC_LayerInit(LTDC_Layerx, &s)`
      # (ch32h417_ltdc.h:225) keeps the FUNCTION and varies the HANDLE: `LTDC_Layer1` and
      # `LTDC_Layer2` are two register blocks (ch32h417.h:1770-1771), where a timer's four
      # channels vary the function and keep the handle. `instances:` names both per layer,
      # and `setting:` is what decides whether a layer is live at all - the `Layer 1` and
      # `Layer 2` rows above, which claim no pad because a layer is memory, not wiring.
      #
      # THE PIXEL FORMAT MOVED HERE, AND THAT IS THE POINT OF THE CHANGE. It shipped in
      # round 5 as two peripheral-level rows with `sdk_none:` and a long note explaining
      # that the SDK's only setter, `LTDC_LayerPixelFormat()`, is a RECONFIGURE call that
      # rescales `CFBLR` from a layer width that is still 0 before `LTDC_LayerInit()` has
      # run (ch32h417_ltdc.c:622-672) - so calling it from a generated init would write a
      # bogus frame-buffer line length. All of that was true, and the conclusion drawn from
      # it - record the choice, write no register - is now obsolete: `LTDC_PixelFormat` is
      # an ORDINARY MEMBER of the struct this block fills (ch32h417_ltdc.h:88), written by
      # `LTDC_LayerInit()` straight into `PFCR` beside the geometry it belongs with. One
      # row per layer, applied rather than commented, and the two planning-only rows are
      # deleted rather than left beside it saying something different.
      #
      # Every default below is the EVT drop's own `LTDC_LayerStructInit()`
      # (ch32h417_ltdc.c), not a guess: geometry and frame buffer 0, constant alpha 0xFF,
      # format ARGB8888, both blending factors PAxCA.
      channel_params:
        struct: LTDC_Layer_InitTypeDef
        applies_per: layer
        instances:
          1: { sdk_call: LTDC_LayerInit, handle: LTDC_Layer1, setting: "Layer 1", active_choices: [Enabled] }
          2: { sdk_call: LTDC_LayerInit, handle: LTDC_Layer2, setting: "Layer 2", active_choices: [Enabled] }
        params:
          - key: pixel_format
            name: Pixel format
            sdk_field: LTDC_PixelFormat
            type: enum
            default: ARGB8888
            options:
              - { name: ARGB8888, value: 0, sdk: LTDC_Pixelformat_ARGB8888 }
              - { name: RGB888,   value: 1, sdk: LTDC_Pixelformat_RGB888 }
              - { name: RGB565,   value: 2, sdk: LTDC_Pixelformat_RGB565 }
              - { name: ARGB1555, value: 3, sdk: LTDC_Pixelformat_ARGB1555 }
              - { name: ARGB4444, value: 4, sdk: LTDC_Pixelformat_ARGB4444 }
              - { name: L8,       value: 5, sdk: LTDC_Pixelformat_L8 }
              - { name: AL44,     value: 6, sdk: LTDC_Pixelformat_AL44 }
              - { name: AL88,     value: 7, sdk: LTDC_Pixelformat_AL88 }
            help: >
              LTDC_LxPFCR.PF[2:0] (RM 43.4.18) - the format of THIS LAYER's FRAME BUFFER IN
              MEMORY, which is a different axis from `Colour depth` above: the pixel format
              converter expands every one of these to ARGB8888 before the blender, so the
              format decides how much RAM a frame costs and frees NO pin. L8 is 8-bit
              indexed through the 256-entry CLUT; AL44 and AL88 are alpha+luminance.
          - key: h_start
            name: Window left edge
            sdk_field: LTDC_HorizontalStart
            type: int
            default: 0
            min: 0
            max: 4095
            help: "LTDC_LxWHPCR.WHSTPOS, 0x000-0xFFF. Counted in pixel clocks from the end of the horizontal back porch, not from the panel edge - the SDK writes the value through unchanged."
          - key: h_stop
            name: Window right edge
            sdk_field: LTDC_HorizontalStop
            type: int
            default: 0
            min: 0
            max: 65535
            help: "LTDC_LxWHPCR.WHSPPOS. LTDC_LayerInit() shifts it left by 16 into the same register as the left edge (ch32h417_ltdc.c), so give it the POSITION, not a width."
          - key: v_start
            name: Window top edge
            sdk_field: LTDC_VerticalStart
            type: int
            default: 0
            min: 0
            max: 4095
            help: "LTDC_LxWVPCR.WVSTPOS, 0x000-0xFFF, in lines from the end of the vertical back porch."
          - key: v_stop
            name: Window bottom edge
            sdk_field: LTDC_VerticalStop
            type: int
            default: 0
            min: 0
            max: 65535
            help: "LTDC_LxWVPCR.WVSPPOS, shifted left by 16 beside the top edge. A position, not a height."
          - key: alpha
            name: Constant alpha
            sdk_field: LTDC_ConstantAlpha
            type: int
            default: 255
            min: 0
            max: 255
            help: "LTDC_LxCACR.CONSTA. 255 is opaque and is LTDC_LayerStructInit()'s value. Used directly when the blending factors are CA, and multiplied by the pixel's own alpha when they are PAxCA."
          - key: bf1
            name: Blending factor 1
            sdk_field: LTDC_BlendingFactor_1
            type: enum
            default: Pixel alpha x constant alpha
            options:
              - { name: Constant alpha, value: 4, sdk: LTDC_BlendingFactor1_CA }
              - { name: Pixel alpha x constant alpha, value: 6, sdk: LTDC_BlendingFactor1_PAxCA }
            help: "LTDC_LxBFCR.BF1 (ch32h417_ltdc.h:211-212). How THIS layer is weighted in the blend. The `value:` figures are the macros' encodings in that field, 100b and 110b."
          - key: bf2
            name: Blending factor 2
            sdk_field: LTDC_BlendingFactor_2
            type: enum
            default: Pixel alpha x constant alpha
            options:
              - { name: Constant alpha, value: 5, sdk: LTDC_BlendingFactor2_CA }
              - { name: Pixel alpha x constant alpha, value: 7, sdk: LTDC_BlendingFactor2_PAxCA }
            help: "LTDC_LxBFCR.BF2 (ch32h417_ltdc.h:215-216). How what is UNDERNEATH is weighted. Both factors sit in one register and LTDC_LayerInit() ORs them together, which is why they are two rows and not one."
          - key: dc_red
            name: Default colour red
            sdk_field: LTDC_DefaultColorRed
            type: int
            default: 0
            min: 0
            max: 255
            help: "LTDC_LxDCCR.DCRED. What the layer shows OUTSIDE its window, where there is no frame-buffer pixel to fetch."
          - key: dc_green
            name: Default colour green
            sdk_field: LTDC_DefaultColorGreen
            type: int
            default: 0
            min: 0
            max: 255
            help: "LTDC_LxDCCR.DCGREEN."
          - key: dc_blue
            name: Default colour blue
            sdk_field: LTDC_DefaultColorBlue
            type: int
            default: 0
            min: 0
            max: 255
            help: "LTDC_LxDCCR.DCBLUE."
          - key: dc_alpha
            name: Default colour alpha
            sdk_field: LTDC_DefaultColorAlpha
            type: int
            default: 0
            min: 0
            max: 255
            help: "LTDC_LxDCCR.DCALPHA. 0 is the EVT drop's value and means the area outside the window is transparent, so the layer below shows through."
          - key: cfb_address
            name: Frame buffer address
            sdk_field: LTDC_CFBStartAdress
            type: int
            default: 0
            min: 0
            max: 4294967295
            help: >
              LTDC_LxCFBAR.CFBADD, the address the layer scans out of. 0 is what the
              vendor's own LTDC_LayerStructInit() sets, and it means "not decided here":
              the buffer is usually a symbol in your program, so assign
              LTDC_Layerx->CFBAR in the USER CODE block - or give the address here if it
              is a fixed external SDRAM base.
          - key: cfb_line_length
            name: Frame buffer line length
            sdk_field: LTDC_CFBLineLength
            type: int
            default: 0
            min: 0
            max: 8191
            help: "LTDC_LxCFBLR.CFBLL, 0x0000-0x1FFF, in BYTES: window width in pixels x bytes per pixel, plus 3 for the fetch overhead. The SDK does not add the 3 for you."
          - key: cfb_pitch
            name: Frame buffer pitch
            sdk_field: LTDC_CFBPitch
            type: int
            default: 0
            min: 0
            max: 8191
            help: "LTDC_LxCFBLR.CFBP, in BYTES from one line of the buffer to the next. Equal to the line length for a tightly packed buffer, larger when the buffer is wider than the window. LTDC_LayerInit() shifts it left by 16 into the same register."
          - key: cfb_line_number
            name: Frame buffer lines
            sdk_field: LTDC_CFBLineNumber
            type: int
            default: 0
            min: 0
            max: 2047
            help: "LTDC_LxCFBLNR.CFBLNBR, 0x000-0x7FF: how many lines the layer fetches per frame."
      notes: >
        Parallel RGB output, always 24 bits wide at the pad - the width you pick here is
        how many lines you WIRED, not a mode the silicon has (RM 43.4.5 gives the global
        control register no width field). A 16-bit panel takes the top five red, top six
        green and top five blue lines; an 18-bit panel the top six of each. Every line the
        chosen depth does not claim is released and can be assigned to another peripheral
        or used as GPIO - picking RGB565 hands back eight pins, RGB666 six.
        An "8-bit mode" is a different thing and does not free pins: L8, AL44 and AL88
        (RM 43.4.18) are eight-bit-per-pixel FRAME BUFFER formats, and the pixel format
        converter expands them to ARGB8888 before the output stage. Choosing one saves
        memory and changes no pin - and you CAN choose one, per layer, in the Layer 1 and
        Layer 2 blocks of Parameter Settings, so a buffer plan and a pin plan are made in
        the same place.
        TWO LAYERS, EACH WITH ITS OWN INIT. Switch a layer on with the `Layer 1` / `Layer 2`
        rows - they claim no pad, because a layer is a rectangle of memory composited onto
        the same RGB port the colour depth already wired - and its sixteen members are
        filled and applied by `LTDC_LayerInit(LTDC_Layerx, &s)`, once per layer that is on.
        The window edges are POSITIONS rather than sizes, counted from the end of the back
        porch, and the frame buffer's line length is in bytes with the RM's +3 fetch
        overhead included by you rather than by the SDK. The frame buffer ADDRESS defaults
        to 0, which is what the vendor's own `LTDC_LayerStructInit()` sets: the buffer is
        usually a symbol in your program, so assign `LTDC_Layerx->CFBAR` in the USER CODE
        block unless it is a fixed external SDRAM base you can type here.

  FMC:
    comment: |
      THE BUSES ARE SELECTABLE BY WIDTH, NOT ALL-OR-NOTHING, and the reason is a real board:
      an 8080 8-bit parallel TFT (ILI9341 / ST7789 / SSD1963 and friends) is driven by FSMC
      and needs ELEVEN pins - D0-D7, one chip select, NOE, NWE, and ONE address line used as
      the RS/DC command-data select. The generated model offered `Data bus D0-D31: Enabled`
      and `Address bus A0-A25: Enabled` as single switches, so asking for that display
      claimed 103 of the 116 bonded pads on QFN128 and made the part unplannable for the
      most common thing anyone attaches to an FSMC. Measured before this change: FSMC
      control alone 48 pads, plus the data bus 80, plus the address bus 103.

      The widths are the silicon's, not a convenience: `FMC_BCRx.MWID[5:4]` (RM 40, Table
      40-17 at CH32H417RM.md:57002) selects 8 / 16 / 32 bits, and the SDK spells the three
      out as `FMC_MemoryDataWidth_8b` / `_16b` / `_32b` (ch32h417_fmc.h:278-280). The
      address groups are the ones a real design uses: one line for an 8080 RS/DC, then the
      bank sizes.

      EVERY SIGNAL THE GENERATOR ROUTED IS STILL CLAIMABLE - that is a hard requirement, not
      a nicety: a routed signal no choice can name is a dead pad, a `validate_mcu.py` ERROR
      and a coverage row (docs/COVERAGE.md check 1). The 86 signals are covered as
      32 data + 26 address + 5 chip selects + 2 strobes + 7 optional + 1 clock + 13 SDRAM.

      HOW TO WIRE AN 8080 PARALLEL DISPLAY, since that is what this reshaping was for:
        Bus mode ... "8080 LCD, 8-bit"   (or 16-bit, or the NE2 variants)
      and that is the whole pin plan - the preset claims D0-D7, A0 as the panel's RS/DC,
      NE1 as its CS and NOE/NWE as its RD/WR, so the rows below stay on Disable. Add an
      ordinary GPIO output for the panel's RESET and one for the backlight; neither is an
      FSMC signal. With an 8-bit bus A0 is the byte address, so the command register is at
      the bank base and the data register one byte above it - which is why the RS line is
      A0 and not A16.

      The `Memory bus` entries in the same dropdown claim data lines ONLY, and leave the
      address width, the chip select and the strobes to the rows below, because a memory
      wants a real address bus where a display wants exactly one line.
    yaml: |
      settings:
        # ONE dropdown for both jobs, because the alternative is two that can disagree.
        # The four `8080 LCD` entries are COMPLETE wirings - data lines, the RS/DC address
        # line, the chip select and both strobes - so a parallel display is one pick and the
        # rows below stay on `Disable`. The `Memory bus` entries claim only data lines and
        # leave the address width, chip select and strobes to those rows, because a memory
        # needs a real address bus and an LCD needs exactly one line.
        #
        # THERE IS NO 6800 MODE, and that is the silicon, not an omission. FSMC drives an
        # 8080-style bus: separate read and write strobes (`NOE`/`NWE`), and `FMC_BCRx.MTYP`
        # selects SRAM / PSRAM / NOR only (ch32h417_fmc.h:273-275) - there is no register
        # that turns NOE/NWE into a 6800 E + R/W pair. A 6800-wired panel is handled at the
        # PANEL: essentially every controller of this class (ILI9341, ST7789, SSD1963, the
        # HD44780-alikes) has IM[2:0] / PS strap pins that select the 8080 interface, and you
        # strap it to 8080 and use one of the entries below. Offering a "6800" choice here
        # would be offering a mode the controller does not have.
        - name: "Bus mode"
          choices:
            - { name: Disable }
            - { name: "8080 LCD, 8-bit (D0-D7, RS=A0, CS=NE1, RD=NOE, WR=NWE)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, A0, NE1, NOE, NWE] }
            - { name: "8080 LCD, 16-bit (D0-D15, RS=A0, CS=NE1, RD=NOE, WR=NWE)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, A0, NE1, NOE, NWE] }
            - { name: "8080 LCD, 8-bit on CS2 (NE2)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, A0, NE2, NOE, NWE] }
            - { name: "8080 LCD, 16-bit on CS2 (NE2)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, A0, NE2, NOE, NWE] }
            - { name: "Memory bus, 8-bit (D0-D7)", signals: [D0, D1, D2, D3, D4, D5, D6, D7] }
            - { name: "Memory bus, 16-bit (D0-D15)", signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15] }
            - { name: "Memory bus, 32-bit (D0-D31)", signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, D16, D17, D18, D19, D20, D21, D22, D23, D24, D25, D26, D27, D28, D29, D30, D31] }
        - name: "Address lines"
          choices:
            - { name: Disable }
            - { name: "A0 only (8080 RS/DC)", signals: [A0] }
            - { name: "A0-A7", signals: [A0, A1, A2, A3, A4, A5, A6, A7] }
            - { name: "A0-A15", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15] }
            - { name: "A0-A18", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15, A16, A17, A18] }
            - { name: "A0-A25", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15, A16, A17, A18, A19, A20, A21, A22, A23, A24, A25] }
        - name: "Chip select"
          type: checkboxes
          choices:
            - { name: NE1, signals: [NE1] }
            - { name: NE2, signals: [NE2] }
            - { name: NE3, signals: [NE3] }
            - { name: NE4, signals: [NE4] }
            - { name: "NCE2 (NAND)", signals: [NCE2] }
        - name: "NOR/PSRAM and NAND control (FSMC)"
          choices:
            - { name: Disable }
            - { name: "Read/write strobes (NOE, NWE)", signals: [NOE, NWE] }
        - name: "Optional FSMC signals"
          type: checkboxes
          choices:
            - { name: "NWAIT (wait input)", signals: [NWAIT] }
            - { name: "NADV (address valid, muxed bus)", signals: [NADV] }
            - { name: "NBL0 (byte lane 0)", signals: [NBL0] }
            - { name: "NBL1 (byte lane 1)", signals: [NBL1] }
            - { name: "NBL2 (byte lane 2)", signals: [NBL2] }
            - { name: "NBL3 (byte lane 3)", signals: [NBL3] }
            - { name: "INT2 (NAND interrupt)", signals: [INT2] }
        - name: "Clock"
          choices:
            - { name: Disable }
            - { name: Enabled, signals: [CLK] }
        - name: "SDRAM control"
          choices:
            - { name: Disable }
            - { name: Enabled, signals: [BA0, BA1, CAS_N, RAS_N, WE_N, CKE0, CKE1, CS_N0, CS_N1, DQM0, DQM1, DQM2, DQM3] }
        # A REGISTER CHOICE, NOT A PIN CLAIM - EXTMOD (R32_FMC_BCRx[14]) decides whether a
        # second, WRITE-ONLY timing block applies (`FMC_WriteTimingStruct`); no signal list
        # because nothing here claims a pad. It is what `embed: wr`'s params below key off,
        # the same shape `FMC_ExtendedMode` itself uses as a `const:`-per-choice pair.
        - name: "Extended Mode"
          choices:
            - { name: Disable }
            - { name: Enable }
      params:
        # FMC_NORSRAMInitTypeDef (ch32h417_fmc.h:60-116), applied by FMC_NORSRAMInit()
        # (:425, no handle - the bank is a struct member, not an argument). Covers the
        # NOR/PSRAM/SRAM controller this peripheral's own worked example (the 8080 LCD
        # wiring above) is: async or muxed-async NOR/SRAM/PSRAM on Bank1. Two structs
        # nest through ONE pointer each - AGENT-2's `embed:` contract, `agents/BOARD.md`
        # 2026-09-13T19:07Z - so `struct: FMC_NORSRAMTimingInitTypeDef` rows below carry
        # `embed: rw` or `embed: wr` matching which of the SDK's two timing sets they set.
        #
        # `FMC_Bank` is FIXED to NORSRAM1 (NE1) rather than offered: "Chip select" above is
        # a CHECKBOX row, so more than one of NE1-4 can be ticked at once for a multi-bank
        # design, and one scalar `FMC_Bank` value cannot answer "which bank" for all of
        # them - each additional bank needs its OWN `FMC_NORSRAMInit()` call with its own
        # bank id and its own timing, the same `channel_params.instances` shape SERDES and
        # SAI use, keyed to which checkbox is ticked rather than a channel number. Not
        # built this cycle; TASKS.md line. NE1 is what this peripheral's own "how to wire
        # an 8080 parallel display" note above already assumes.
        - key: bank
          name: Bank
          struct: FMC_NORSRAMInitTypeDef
          sdk_field: FMC_Bank
          const: FMC_Bank1_NORSRAM1
          help: "ch32h417_fmc.h:63-64. Fixed to NE1/Bank1 - see the comment above for why the other three banks are not independently configurable yet."
        - key: data_address_mux
          name: Multiplex address/data bus
          struct: FMC_NORSRAMInitTypeDef
          sdk_field: FMC_DataAddressMux
          sdk_enabled: FMC_DataAddressMux_Enable
          sdk_disabled: FMC_DataAddressMux_Disable
          type: bool
          default: false
          help: "ch32h417_fmc.h:66-68, R32_FMC_BCRx MUXE bit 1 (Table 40-17, CH32H417RM.md:56978). Enable only for a multiplexed-bus NOR Flash; needs NADV (Optional FSMC signals above)."
        - key: memory_type
          name: Memory type
          struct: FMC_NORSRAMInitTypeDef
          sdk_field: FMC_MemoryType
          type: enum
          default: SRAM
          options:
            - { name: SRAM,  value: 0, sdk: FMC_MemoryType_SRAM }
            - { name: PSRAM, value: 1, sdk: FMC_MemoryType_PSRAM }
            - { name: NOR,   value: 2, sdk: FMC_MemoryType_NOR }
          help: "ch32h417_fmc.h:70-72, R32_FMC_BCRx MTYP[3:2] (Table 40-17, CH32H417RM.md:56978)."
        - key: memory_data_width
          name: Memory data width
          struct: FMC_NORSRAMInitTypeDef
          sdk_field: FMC_MemoryDataWidth
          type: enum
          default: 8-bit
          options:
            - { name: 8-bit,  value: 0, sdk: FMC_MemoryDataWidth_8b }
            - { name: 16-bit, value: 1, sdk: FMC_MemoryDataWidth_16b }
            - { name: 32-bit, value: 2, sdk: FMC_MemoryDataWidth_32b }
          help: >
            ch32h417_fmc.h:74-76, R32_FMC_BCRx MWID[5:4] (Table 40-17, CH32H417RM.md:56978,
            already the reasoning behind the `Bus mode`/width rows above). NOT derived from
            those rows - keep this the SAME width as whichever `Bus mode`/`Memory bus`
            choice you picked; a mismatch compiles and drives the wrong-width bus.
        - key: burst_access_mode
          name: Burst access mode
          struct: FMC_NORSRAMInitTypeDef
          sdk_field: FMC_BurstAccessMode
          sdk_enabled: FMC_BurstAccessMode_Enable
          sdk_disabled: FMC_BurstAccessMode_Disable
          type: bool
          default: false
          help: "ch32h417_fmc.h:77-79, R32_FMC_BCRx BURSTEN bit 8 (Table 40-17). Only meaningful with a synchronous burst NOR Flash."
        - key: asynchronous_wait
          name: Asynchronous wait signal
          struct: FMC_NORSRAMInitTypeDef
          sdk_field: FMC_AsynchronousWait
          sdk_enabled: FMC_AsynchronousWait_Enable
          sdk_disabled: FMC_AsynchronousWait_Disable
          type: bool
          default: false
          help: "ch32h417_fmc.h:81-83, R32_FMC_BCRx ASYNCWAIT bit 15 (Table 40-17: \"set to 1 if the memory supports this feature\"). Needs NWAIT (Optional FSMC signals above)."
        - key: wait_signal_polarity
          name: Wait signal polarity
          struct: FMC_NORSRAMInitTypeDef
          sdk_field: FMC_WaitSignalPolarity
          type: enum
          default: Low
          options:
