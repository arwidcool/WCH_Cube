# CH32H417 hand-written peripheral additions, for tools/gen_h417_peripherals.py
#
# WHY THIS FILE EXISTS. The `peripherals:` block of data/mcus/CH32H417.yaml below the
# GENERATED marker is rewritten wholesale by
#
#     python tools/gen_h417_peripherals.py --splice --refresh
#
# so anything hand-added to a generated block is destroyed the next time anybody runs it.
# On 2026-09-12 a refresh would have deleted PWR's eight supply rails, LTDC's colour-depth
# reasoning and its notes, and re-declared USBFS/USBHS/USBSS as holding no pin - roughly
# two hundred lines of cited fact, silently, with every gate still green. The generator
# is the authority for that section, so the facts belong where the generator can read
# them, the way dedicated_pins.yaml already holds the pads its AF parser cannot see.
#
# Per peripheral, two optional keys:
#   comment:  prose emitted as a `#` comment block between `category:` and `settings:`
#   yaml:     a YAML fragment emitted verbatim (indented) at the end of the block. Any
#             top-level key it defines suppresses the generator's own version of that key
#             - which is how PWR's `pins:` replaces the plain `pins: { none: true }`.
#
# Every statement here cites the datasheet or the reference manual, same rule as anywhere
# else in data/: a citation is a file:line or a table number, never a family.

# ---------------------------------------------------------------------------------------
# PARAMETER TEMPLATES, anchored once and aliased per instance.
#
# USART4-8, SPI3-4 and I2C3-4 are the SAME register block as USART1, SPI1 and I2C1 - the
# SPL says so in one line each: ch32h417.h:1738-1739 and :1724-1726 cast USART4..USART8 to
# `USART_TypeDef *`, :1734-1735 cast SPI3/SPI4 to `SPI_TypeDef *`, and :1742/:1767 cast
# I2C3/I2C4 to `I2C_TypeDef *`. One struct type, one init function, one set of option
# macros (USART_Init at ch32h417_usart.h:184, SPI_Init at ch32h417_spi.h:198, I2C_Init at
# ch32h417_i2c.h:302), so the parameters are the same parameters.
#
# They are written ONCE and aliased rather than copied nine times, because a copy is nine
# places for one correction to miss: the CH32H417 word lengths are already NOT the CH32V00x
# set, and the SPI prescalers are already named Mode0..Mode7 rather than by divider. Both
# of those are facts that get re-derived wrongly by whoever edits the eighth copy.
#
# `_params` is not `extras:`, so tools/gen_h417_peripherals.py never reads this section -
# it reads `doc["extras"]` only. YAML resolves the aliases before the generator sees them.
_params:

  usart: &usart_params |
    # THE WORD LENGTHS ARE NOT THE CH32V00x SET. ch32h417_usart.h:71-75 offers FIVE -
    # 5b, 6b, 7b, 8b and 9b - where every CH32V00x part in this repo has two. Same block
    # as USART1-3: ch32h417.h:1724-1726 and :1738-1739 cast every one of USART4..USART8
    # to `USART_TypeDef *`, and USART_Init() (ch32h417_usart.h:184) takes any of them.
    params:
      - key: baud
        name: Baud rate
        struct: USART_InitTypeDef
        sdk_field: USART_BaudRate
        type: int
        default: 115200
        min: 110
        max: 25000000
        unit: Bd
        help: "USART_BRR. Ceiling is fCK/16; this part's clock tree is not modelled yet, so the bound is the documented peripheral maximum rather than a computed one."
      - key: word
        name: Word length
        struct: USART_InitTypeDef
        sdk_field: USART_WordLength
        type: enum
        default: 8 bits
        options:
          - { name: 5 bits, value: 4, sdk: USART_WordLength_5b }
          - { name: 6 bits, value: 3, sdk: USART_WordLength_6b }
          - { name: 7 bits, value: 2, sdk: USART_WordLength_7b }
          - { name: 8 bits, value: 0, sdk: USART_WordLength_8b }
          - { name: 9 bits, value: 1, sdk: USART_WordLength_9b }
        help: "USART_CTLR1 M. Five lengths on this part (ch32h417_usart.h:71-75); CH32V003/V005/V006 have only 8b and 9b."
      - key: parity
        name: Parity
        struct: USART_InitTypeDef
        sdk_field: USART_Parity
        type: enum
        default: "None"
        options:
          - { name: "None", value: 0, sdk: USART_Parity_No }
          - { name: Even  , value: 2, sdk: USART_Parity_Even }
          - { name: Odd   , value: 3, sdk: USART_Parity_Odd }
        help: "USART_CTLR1 PCE and PS (ch32h417_usart.h:84-86). With parity on, the parity bit takes the last data bit."
      - key: stop
        name: Stop bits
        struct: USART_InitTypeDef
        sdk_field: USART_StopBits
        type: enum
        default: "1"
        options:
          - { name: "1"  , value: 0, sdk: USART_StopBits_1 }
          - { name: "0.5", value: 1, sdk: USART_StopBits_0_5 }
          - { name: "2"  , value: 2, sdk: USART_StopBits_2 }
          - { name: "1.5", value: 3, sdk: USART_StopBits_1_5 }
        help: "USART_CTLR2 STOP[13:12], in register order: 00 = 1, 01 = 0.5, 10 = 2, 11 = 1.5 (ch32h417_usart.h:78-81)."

  spi: &spi_params |
    # THE PRESCALER MACROS ARE NOT THE CH32V00x SET EITHER. ch32h417_spi.h:106-113 names
    # them SPI_BaudRatePrescaler_Mode0..Mode7, not _2 / _4 / ... / _256. Which divider each
    # Mode selects depends on the SPI clock tree, which is not modelled here, so the options
    # carry the header's own names rather than a division this file cannot yet prove.
    # Copying CH32V006's list would fail verify_sdk_names.py. Same block as SPI1/SPI2:
    # ch32h417.h:1734-1735 casts SPI3 and SPI4 to `SPI_TypeDef *`, and SPI_Init()
    # (ch32h417_spi.h:198) takes either.
    params:
      - key: prescaler
        name: Baud rate prescaler
        struct: SPI_InitTypeDef
        sdk_field: SPI_BaudRatePrescaler
        type: enum
        default: Mode 3
        options:
          - { name: Mode 0, value: 0, sdk: SPI_BaudRatePrescaler_Mode0 }
          - { name: Mode 1, value: 1, sdk: SPI_BaudRatePrescaler_Mode1 }
          - { name: Mode 2, value: 2, sdk: SPI_BaudRatePrescaler_Mode2 }
          - { name: Mode 3, value: 3, sdk: SPI_BaudRatePrescaler_Mode3 }
          - { name: Mode 4, value: 4, sdk: SPI_BaudRatePrescaler_Mode4 }
          - { name: Mode 5, value: 5, sdk: SPI_BaudRatePrescaler_Mode5 }
          - { name: Mode 6, value: 6, sdk: SPI_BaudRatePrescaler_Mode6 }
          - { name: Mode 7, value: 7, sdk: SPI_BaudRatePrescaler_Mode7 }
        help: "SPI_CTLR1 BR[5:3], codes 000..111. The header names these Mode0..Mode7 rather than by divider (ch32h417_spi.h:106-113)."
      - key: cpol
        name: Clock polarity (CPOL)
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPOL
        type: enum
        default: Low
        options:
          - { name: Low , value: 0, sdk: SPI_CPOL_Low }
          - { name: High, value: 1, sdk: SPI_CPOL_High }
        help: "SPI_CTLR1 CPOL, bit 1 (ch32h417_spi.h:94-95)."
      - key: cpha
        name: Clock phase (CPHA)
        struct: SPI_InitTypeDef
        sdk_field: SPI_CPHA
        type: enum
        default: 1 Edge
        options:
          - { name: 1 Edge, value: 0, sdk: SPI_CPHA_1Edge }
          - { name: 2 Edge, value: 1, sdk: SPI_CPHA_2Edge }
        help: "SPI_CTLR1 CPHA, bit 0 (ch32h417_spi.h:98-99)."
      - key: datasize
        name: Data size
        struct: SPI_InitTypeDef
        sdk_field: SPI_DataSize
        type: enum
        default: 8 bits
        options:
          - { name: 8 bits , value: 0, sdk: SPI_DataSize_8b }
          - { name: 16 bits, value: 1, sdk: SPI_DataSize_16b }
        help: "SPI_CTLR1 DFF, bit 11 (ch32h417_spi.h:91-92)."
      - key: firstbit
        name: First bit
        struct: SPI_InitTypeDef
        sdk_field: SPI_FirstBit
        type: enum
        default: MSB First
        options:
          - { name: MSB First, value: 0, sdk: SPI_FirstBit_MSB }
          - { name: LSB First, value: 1, sdk: SPI_FirstBit_LSB }
        help: "SPI_CTLR1 LSBFIRST, bit 7 (ch32h417_spi.h:116-117)."

  i2c: &i2c_params |
    # Same block as I2C1/I2C2: ch32h417.h:1742 and :1767 cast I2C3 and I2C4 to
    # `I2C_TypeDef *`, and I2C_Init() (ch32h417_i2c.h:302) takes either. The SPL's own
    # Init reads only the standard/fast split at 100 kHz (ch32h417_i2c.c:160) - there is no
    # register field above that - so the ceiling below is the documented peripheral maximum
    # and not a computed one, the same bound I2C1 and I2C2 carry.
    params:
      - key: speed
        name: Clock speed
        struct: I2C_InitTypeDef
        sdk_field: I2C_ClockSpeed
        type: int
        default: 100000
        min: 1000
        max: 1000000
        unit: Hz
        help: "I2C_CKCFGR CCR together with F/S. Above 100 kHz the peripheral must be in fast mode (ch32h417_i2c.c:160)."
      - key: duty
        name: Fast-mode duty cycle
        struct: I2C_InitTypeDef
        sdk_field: I2C_DutyCycle
        type: enum
        default: "2:1"
        options:
          - { name: "2:1" , value: 0, sdk: I2C_DutyCycle_2 }
          - { name: "16:9", value: 1, sdk: I2C_DutyCycle_16_9 }
        help: "I2C_CKCFGR DUTY, bit 14 (ch32h417_i2c.h:51-52). Ignored below 100 kHz, where the peripheral runs in standard mode."
      - key: addrmode
        name: Addressing mode
        struct: I2C_InitTypeDef
        sdk_field: I2C_AcknowledgedAddress
        type: enum
        default: 7-bit
        options:
          - { name: 7-bit , value: 0, sdk: I2C_AcknowledgedAddress_7bit }
          - { name: 10-bit, value: 1, sdk: I2C_AcknowledgedAddress_10bit }
        help: "I2C_OAR1 ADDMODE, bit 15 (ch32h417_i2c.h:62-63)."
      - key: addr
        name: Own address
        struct: I2C_InitTypeDef
        sdk_field: I2C_OwnAddress1
        type: int
        default: 0
        min: 0
        max: 1023
        help: "I2C_OAR1 ADD[9:0] (ch32h417_i2c.h:34). Only the low 7 bits are used in 7-bit addressing mode."

  # THE TIMERS ARE FOUR DIFFERENT TIME BASES, NOT ONE. Copying TIM2's `params:` onto
  # TIM6..TIM12 would have been wrong on three counts, and every one of them is a line of
  # the SPL rather than a judgement:
  #
  #   ch32h417_tim.c, TIM_TimeBaseInit()  - CTLR1 (counter mode + clock division) is
  #     written ONLY `if((TIMx == TIM1) || (TIMx == TIM8) || (TIMx == TIM2) || (TIMx ==
  #     TIM3) || (TIMx == TIM4) || (TIMx == TIM5))`, and RPTCR only `if((TIMx == TIM1) ||
  #     (TIMx == TIM8))`. So a `Counter mode` row on TIM6 or TIM7 would be a dropdown
  #     whose value nothing writes - the exact defect round 5 named: a choice the silicon
  #     (here, the SDK that reaches it) cannot honour.
  #   RM 16.4.1, the TIM6/TIM7 CTLR1 bit table (CH32H417RM.md:20474-20487) - bits [6:4]
  #     and [15:8] Reserved. The basic timer has no DIR, no CMS and no CKD field at all,
  #     so the SPL's guard is the silicon and not an SDK shortcut. ARPE is bit 7 and is
  #     there, which is why the preload row stays.
  #   ch32h417_tim.h:125-141 - TIM9..TIM12 have their OWN structure and their own init
  #     function: `TIM9_12_TimeBaseInitTypeDef` (32-bit `TIM_Period`, no repetition
  #     counter) applied by `TIM9_12_TimeBaseInit()` (:556), which writes `ATRLR_32`.
  #     RM 15.4.14 (CH32H417RM.md:20209) confirms a 32-bit ARR[31:0] on x=9/10/11/12
  #     where 15.4.13 gives x=2/3/4/5 sixteen bits.
  #
  # ONE DISAGREEMENT, RECORDED RATHER THAN AVERAGED: the RM states the TIM9-12 ATRLR reset
  # value twice and differently - the register map says `0x0000FFFF` (CH32H417RM.md:18992
  # for TIM9, :19062 for TIM12) and the field description says `0xFFFFFFFF` (:20209). The
  # default below is 4294967295, following the EVT drop - `TIM9_12_TimeBaseStructInit()`
  # sets `TIM_Period = 0xFFFFFFFF` (ch32h417_tim.c) - because EVT outranks the RM. The
  # 16-bit reading is noted here and is not silently discarded.

  tim_gp16: &tim_gp16_params |
    # 16-bit general-purpose time base, the same one TIM2/TIM3/TIM4 carry. Counter mode and
    # clock division ARE applied for this instance: TIM_TimeBaseInit()'s CTLR1 guard names
    # TIM5 (ch32h417_tim.c). No repetition counter - RPTCR is written for TIM1 and TIM8
    # only - so that row is ABSENT here rather than offered and ignored.
    params:
      - key: prescaler
        name: Prescaler (PSC)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Prescaler
        type: int
        default: 0
        min: 0
        max: 65535
        help: "TIMx_PSC. Counter clock = the timer's bus clock / (Prescaler + 1)."
      - key: period
        name: Counter period (ATRLR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Period
        type: int
        default: 65535
        min: 0
        max: 65535
        help: "TIMx_ATRLR, shown at its reset value. One period is (Counter period + 1) counter ticks. 16 bits on this instance (RM 15.4.13)."
      - key: counter
        name: Counter mode
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_CounterMode
        type: enum
        default: Up
        options:
          - { name: Up              , value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down            , value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center aligned 1, value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center aligned 2, value: 3, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center aligned 3, value: 4, sdk: TIM_CounterMode_CenterAligned3 }
        help: "TIMx_CTLR1 DIR (bit 4) and CMS[6:5]."
      - key: ckd
        name: Internal clock division
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        default: "1"
        options:
          - { name: "1", value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "2", value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "4", value: 2, sdk: TIM_CKD_DIV4 }
        help: "TIMx_CTLR1 CKD[9:8]. Divides the clock feeding the digital filters and the dead-time generator, not the counter."
      - key: arpe
        name: Auto-reload preload
        sdk_call: TIM_ARRPreloadConfig
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        sdk_note: "TIM_TimeBaseInitTypeDef has no auto-reload-preload member; it is a call after TIM_TimeBaseInit. ch32h417_tim.h:502."
        type: bool
        default: false
        help: "TIMx_CTLR1 ARPE, bit 7."

  tim_adv: &tim_adv_params |
    # Advanced-control time base, identical to TIM1's. TIM8 is the other instance
    # TIM_TimeBaseInit() writes RPTCR for (`if((TIMx == TIM1) || (TIMx == TIM8))`,
    # ch32h417_tim.c), so the repetition counter is a real row here and nowhere else
    # on this part except TIM1.
    params:
      - key: prescaler
        name: Prescaler (PSC)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Prescaler
        type: int
        default: 0
        min: 0
        max: 65535
        help: "TIMx_PSC. Counter clock = the timer's bus clock / (Prescaler + 1)."
      - key: period
        name: Counter period (ATRLR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Period
        type: int
        default: 65535
        min: 0
        max: 65535
        help: "TIMx_ATRLR, shown at its reset value. One period is (Counter period + 1) counter ticks."
      - key: counter
        name: Counter mode
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_CounterMode
        type: enum
        default: Up
        options:
          - { name: Up              , value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down            , value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center aligned 1, value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center aligned 2, value: 3, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center aligned 3, value: 4, sdk: TIM_CounterMode_CenterAligned3 }
        help: "TIMx_CTLR1 DIR (bit 4) and CMS[6:5]."
      - key: ckd
        name: Internal clock division
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        default: "1"
        options:
          - { name: "1", value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "2", value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "4", value: 2, sdk: TIM_CKD_DIV4 }
        help: "TIMx_CTLR1 CKD[9:8]. Divides the clock feeding the digital filters and the dead-time generator, not the counter."
      - key: arpe
        name: Auto-reload preload
        sdk_call: TIM_ARRPreloadConfig
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        sdk_note: "TIM_TimeBaseInitTypeDef has no auto-reload-preload member; it is a call after TIM_TimeBaseInit. ch32h417_tim.h:502."
        type: bool
        default: false
        help: "TIMx_CTLR1 ARPE, bit 7."
      - key: rcr
        name: Repetition counter (RPTCR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_RepetitionCounter
        type: int
        default: 0
        min: 0
        max: 255
        help: "TIM8_RPTCR. An update event happens every (value + 1) counter cycles. Advanced timer only: TIM_TimeBaseInit() writes RPTCR for TIM1 and TIM8 and no other instance, so it is ABSENT from TIM2-TIM12 rather than offered and ignored."

  tim_basic: &tim_basic_params |
    # BASIC TIMER - A PRESCALER, AN AUTO-RELOAD AND NOTHING ELSE, and the three rows the
    # general-purpose timers have are ABSENT by citation rather than by omission:
    #   counter mode / clock division - RM 16.4.1 (CH32H417RM.md:20474) makes CTLR1 bits
    #     [6:4] and [15:8] Reserved on TIMx (x=6/7): there is no DIR, no CMS, no CKD field.
    #     TIM_TimeBaseInit() agrees by not naming TIM6 or TIM7 in its CTLR1 guard, so a
    #     dropdown here would write to nothing.
    #   repetition counter - RPTCR is written for TIM1 and TIM8 only (same function).
    # ARPE (bit 7) IS present in that same bit table, so the preload row stays and is
    # applied by TIM_ARRPreloadConfig(), which writes CTLR1 unconditionally.
    params:
      - key: prescaler
        name: Prescaler (PSC)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Prescaler
        type: int
        default: 0
        min: 0
        max: 65535
        help: "TIMx_PSC. Counter clock = the timer's HB bus clock / (Prescaler + 1). RM 16.2.1."
      - key: period
        name: Counter period (ATRLR)
        struct: TIM_TimeBaseInitTypeDef
        sdk_field: TIM_Period
        type: int
        default: 65535
        min: 0
        max: 65535
        help: "TIMx_ATRLR, shown at its reset value 0xFFFF (RM 16.4, register map). Up-counting only on a basic timer, so one period is (Counter period + 1) ticks."
      - key: arpe
        name: Auto-reload preload
        sdk_call: TIM_ARRPreloadConfig
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        sdk_note: "TIM_TimeBaseInitTypeDef has no auto-reload-preload member; it is a call after TIM_TimeBaseInit. ch32h417_tim.h:502."
        type: bool
        default: false
        help: "TIMx_CTLR1 ARPE, bit 7 (RM 16.4.1, CH32H417RM.md:20474)."

  tim_gp32: &tim_gp32_params |
    # 32-BIT GENERAL-PURPOSE TIME BASE, WITH ITS OWN STRUCT AND ITS OWN INIT CALL.
    # TIM9..TIM12 are not TIM2 with a wider counter as far as the software is concerned:
    # ch32h417_tim.h:125-141 defines `TIM9_12_TimeBaseInitTypeDef` - 32-bit `TIM_Period`,
    # no `TIM_RepetitionCounter` - and :556 declares `TIM9_12_TimeBaseInit()`, which writes
    # `ATRLR_32` where `TIM_TimeBaseInit()` writes the 16-bit `ATRLR`. Filling a
    # `TIM_TimeBaseInitTypeDef` here and passing it to `TIM_TimeBaseInit()` would compile,
    # write no CTLR1 at all (its guard names TIM1/2/3/4/5/8 only) and truncate the period.
    params:
      - key: prescaler
        name: Prescaler (PSC)
        struct: TIM9_12_TimeBaseInitTypeDef
        sdk_field: TIM_Prescaler
        type: int
        default: 0
        min: 0
        max: 65535
        help: "TIMx_PSC. Still 16 bits on these instances - RM 15.1 says a 32-bit counter with a 16-bit prescaler - so the division factor is 1..65536."
      - key: period
        name: Counter period (ATRLR)
        struct: TIM9_12_TimeBaseInitTypeDef
        sdk_field: TIM_Period
        type: int
        default: 4294967295
        min: 0
        max: 4294967295
        help: >-
          TIMx_ATRLR, 32 bits wide on x=9/10/11/12 (RM 15.4.14, CH32H417RM.md:20209, ARR[31:0]).
          The default is the EVT drop's own reset value, TIM9_12_TimeBaseStructInit() setting
          TIM_Period = 0xFFFFFFFF; note that the RM states this reset twice and differently - the
          register map at CH32H417RM.md:18992 says 0x0000FFFF, the field description at :20209 says
          0xFFFFFFFF - and EVT outranks the RM.
      - key: counter
        name: Counter mode
        struct: TIM9_12_TimeBaseInitTypeDef
        sdk_field: TIM_CounterMode
        type: enum
        default: Up
        options:
          - { name: Up              , value: 0, sdk: TIM_CounterMode_Up }
          - { name: Down            , value: 1, sdk: TIM_CounterMode_Down }
          - { name: Center aligned 1, value: 2, sdk: TIM_CounterMode_CenterAligned1 }
          - { name: Center aligned 2, value: 3, sdk: TIM_CounterMode_CenterAligned2 }
          - { name: Center aligned 3, value: 4, sdk: TIM_CounterMode_CenterAligned3 }
        help: "TIMx_CTLR1 DIR (bit 4) and CMS[6:5), RM 15.4.1 which covers x=2/3/4/5/9/10/11/12. Applied here by TIM9_12_TimeBaseInit(), which writes CTLR1 for every instance it is given."
      - key: ckd
        name: Internal clock division
        struct: TIM9_12_TimeBaseInitTypeDef
        sdk_field: TIM_ClockDivision
        type: enum
        default: "1"
        options:
          - { name: "1", value: 0, sdk: TIM_CKD_DIV1 }
          - { name: "2", value: 1, sdk: TIM_CKD_DIV2 }
          - { name: "4", value: 2, sdk: TIM_CKD_DIV4 }
        help: "TIMx_CTLR1 CKD[9:8]. Divides the clock feeding the digital filters, not the counter."
      - key: arpe
        name: Auto-reload preload
        sdk_call: TIM_ARRPreloadConfig
        sdk_args: [$HANDLE, $VALUE]
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        sdk_note: "Neither time-base struct has an auto-reload-preload member; it is a call after the init. TIM_ARRPreloadConfig() takes any TIM_TypeDef* and writes CTLR1.ARPE unconditionally (ch32h417_tim.h:502)."
        type: bool
        default: false
        help: "TIMx_CTLR1 ARPE, bit 7."

  # THE SAMPLING TIMES ARE NOT THE CH32V00x SET, and this is the third time on this part
  # that copying a sibling's list would have shipped eight wrong numbers. RM 11.3.5
  # (`CH32H417RM.md:14974`) gives SMPx[2:0] as 1.5 / 7.5 / 13.5 / 28.5 / 41.5 / 55.5 /
  # 71.5 / 239.5 cycles; CH32V006's `params:` say 3.5 / 7.5 / 11.5 / 19.5 / 35.5 / 55.5 /
  # 71.5 / 239.5. Five of the eight differ. The macro NAMES are identical
  # (`ADC_SampleTime_CyclesMode0..7`, ch32h417_adc.h:118-125), so `verify_sdk_names.py`
  # would have passed every one of the wrong numbers - the name is right and the label a
  # user reads is wrong, which is the failure this repository is built around.
  #
  # The same bit table gives codes 100..111 a SECOND meaning - 2.5 / 3.5 / 4.5 / 5.5
  # cycles - when `ADC_SMP_SELx` is set. That bit is not modelled (there is no SPL member
  # or call for it), so the labels below are the ADC_SMP_SELx = 0 reading and the other one
  # is stated in the help rather than averaged into it.
  adc: &adc_params |
    params:
      # PER CHANNEL, not per peripheral: ADC_InitTypeDef has no sample-time member at all.
      # Sample time is the fourth argument of ADC_RegularChannelConfig(ADCx, channel, rank,
      # ADC_SampleTime) (ch32h417_adc.h:187), so one call is emitted per ticked channel, in
      # the order they are ticked - which is also the regular sequence rank.
      - key: sample
        name: Sampling time
        sdk_call: ADC_RegularChannelConfig
        sdk_args: [$HANDLE, $CHANNEL, $RANK, $VALUE]
        sdk_repeat: channels
        sdk_note: >-
          ADC_InitTypeDef has NO sample-time member. Sample time is the fourth argument of
          ADC_RegularChannelConfig(ADCx, channel, rank, ADC_SampleTime), so it is set per
          CHANNEL, not per peripheral. ch32h417_adc.h:187.
        type: enum
        default: 13.5 cycles
        options:
          - { name: 1.5 cycles  , value: 0, sdk: ADC_SampleTime_CyclesMode0 }
          - { name: 7.5 cycles  , value: 1, sdk: ADC_SampleTime_CyclesMode1 }
          - { name: 13.5 cycles , value: 2, sdk: ADC_SampleTime_CyclesMode2 }
          - { name: 28.5 cycles , value: 3, sdk: ADC_SampleTime_CyclesMode3 }
          - { name: 41.5 cycles , value: 4, sdk: ADC_SampleTime_CyclesMode4 }
          - { name: 55.5 cycles , value: 5, sdk: ADC_SampleTime_CyclesMode5 }
          - { name: 71.5 cycles , value: 6, sdk: ADC_SampleTime_CyclesMode6 }
          - { name: 239.5 cycles, value: 7, sdk: ADC_SampleTime_CyclesMode7 }
        help: >
          ADCx_SAMPTR1/2 SMPx[2:0], codes 000..111 in this order (RM 11.3.5,
          CH32H417RM.md:14974). These are CH32H417's own figures and they are NOT the
          CH32V00x ones - five of the eight differ. The same bits mean 2.5 / 3.5 / 4.5 /
          5.5 cycles for codes 100..111 when ADC_SMP_SELx is set, which this configurator
          does not set. Total conversion = sampling + 12.5 ADC clocks (RM:13534). Above a
          1 MHz sampling rate the RM advises not going below 3.5 cycles.
      # ADC_Mode, written TWICE and applied ONCE - which reading applies is decided by the
      # `Mode` row above, and both are written out rather than one of them being left to
      # the struct's zero-initialiser. ADC_Mode_Independent happens to be 0x00000000, so
      # omitting the member in independent mode would produce correct code by accident;
      # code that is right by accident is the thing this file exists to stop.
      - key: mode_independent
        name: Dual-ADC mode
        struct: ADC_InitTypeDef
        sdk_field: ADC_Mode
        const: ADC_Mode_Independent
        depends_on: { setting: Mode, equals: Independent }
        help: "ADCx_CTLR1 DUALMOD[19:16] = 0000 (RM 11.3.2). Fixed by the Mode row: an independent ADC has no dual mode to choose."
      - key: mode_dual
        name: Dual-ADC mode
        struct: ADC_InitTypeDef
        sdk_field: ADC_Mode
        type: enum
        default: Regular simultaneous
        depends_on: { setting: Mode, equals: "Dual (with the other ADC)" }
        options:
          - { name: Regular + injected simultaneous     , value: 1, sdk: ADC_Mode_RegInjecSimult }
          - { name: Regular simultaneous + alternate trigger, value: 2, sdk: ADC_Mode_RegSimult_AlterTrig }
          - { name: Injected simultaneous + fast interleaved, value: 3, sdk: ADC_Mode_InjecSimult_FastInterl }
          - { name: Injected simultaneous + slow interleaved, value: 4, sdk: ADC_Mode_InjecSimult_SlowInterl }
          - { name: Injected simultaneous               , value: 5, sdk: ADC_Mode_InjecSimult }
          - { name: Regular simultaneous                , value: 6, sdk: ADC_Mode_RegSimult }
          - { name: Fast interleaved                    , value: 7, sdk: ADC_Mode_FastInterl }
          - { name: Slow interleaved                    , value: 8, sdk: ADC_Mode_SlowInterl }
          - { name: Alternate trigger                   , value: 9, sdk: ADC_Mode_AlterTrig }
        help: >
          ADCx_CTLR1 DUALMOD[19:16], codes 0001..1001 (RM 11.3.2, CH32H417RM.md:14423).
          Only shown when the Mode row says Dual; the two ADCs are one pair, so setting this
          on ADC1 describes what ADC1 and ADC2 do together.
      - key: scan
        name: Scan conversion
        struct: ADC_InitTypeDef
        sdk_field: ADC_ScanConvMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "ADCx_CTLR1 SCAN, bit 8. Converts the whole regular sequence rather than only its first channel - turn it on whenever more than one channel is ticked."
      - key: cont
        name: Continuous conversion
        struct: ADC_InitTypeDef
        sdk_field: ADC_ContinuousConvMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "ADCx_CTLR2 CONT, bit 1. The sequence restarts as soon as it ends instead of waiting for the next trigger."
      - key: nbr
        name: Number of regular channels
        struct: ADC_InitTypeDef
        sdk_field: ADC_NbrOfChannel
        type: int
        default: 1
        min: 1
        max: 16
        help: >
          ADCx_RSQR1 L[23:20], the LENGTH of the regular sequence. Set it to the number of
          channels you ticked on the Channels row: ADC_Init() writes
          (ADC_NbrOfChannel - 1) into the field (ch32h417_adc.c), so this is a count and not
          an index, and leaving it at 0 would write 0xFF - 1 rather than "no channels".
      - key: trig
        name: External trigger
        struct: ADC_InitTypeDef
        sdk_field: ADC_ExternalTrigConv
        type: enum
        default: Software trigger (SWSTART)
        options:
          - { name: TIM1 CC1              , value: 0, sdk: ADC_ExternalTrigConv_T1_CC1 }
          - { name: TIM1 CC2              , value: 1, sdk: ADC_ExternalTrigConv_T1_CC2 }
          - { name: TIM1 CC3              , value: 2, sdk: ADC_ExternalTrigConv_T1_CC3 }
          - { name: TIM2 CC2              , value: 3, sdk: ADC_ExternalTrigConv_T2_CC2 }
          - { name: TIM3 TRGO             , value: 4, sdk: ADC_ExternalTrigConv_T3_TRGO }
          - { name: TIM4 CC4              , value: 5, sdk: ADC_ExternalTrigConv_T4_CC4 }
          - { name: EXTI line 11 / TIM8 TRGO, value: 6, sdk: ADC_ExternalTrigConv_Ext_IT11_TIM8_TRGO }
          - { name: Software trigger (SWSTART), value: 7, sdk: ADC_ExternalTrigConv_None }
        help: >
          ADCx_CTLR2 EXTSEL[19:17], codes 000..111 (RM 11.3.3, CH32H417RM.md:14768).
          NOTE THE LAST ONE'S TWO NAMES, recorded rather than reconciled: the SPL macro is
          spelled ADC_ExternalTrigConv_None (ch32h417_adc.h:78) and the reference manual
          calls code 111 "SWSTART software trigger". They are the same encoding; the label
          here follows the RM because it says what the silicon does, and the macro is the
          SPL's own.
      - key: align
        name: Data alignment
        struct: ADC_InitTypeDef
        sdk_field: ADC_DataAlign
        type: enum
        default: Right
        options:
          - { name: Right, value: 0, sdk: ADC_DataAlign_Right }
          - { name: Left , value: 1, sdk: ADC_DataAlign_Left }
        help: "ADCx_CTLR2 ALIGN, bit 11. 12-bit results in a 16-bit register."
      - key: buffer
        name: Input buffer
        struct: ADC_InitTypeDef
        sdk_field: ADC_OutputBuffer
        type: enum
        default: Disabled
        options:
          - { name: Disabled, value: 0, sdk: ADC_OutputBuffer_Disable }
          - { name: Enabled , value: 1, sdk: ADC_OutputBuffer_Enable }
        help: >
          ADCx_CTLR1 BUFEN, bit 26 (RM 11.3.2). Turn it on when the source impedance is
          above the datasheet's maximum, and then keep the sampling time at 7.5 cycles or
          more. The gain row below NEEDS it on. It is also forced on by the silicon whenever
          TKENABLE or TSVREFE is set, and calibration must happen before that - the SDK
          member is spelled ADC_OutputBuffer even though the bit is an INPUT buffer.
      - key: pga
        name: Input gain (PGA)
        struct: ADC_InitTypeDef
        sdk_field: ADC_Pga
        type: enum
        default: x1
        depends_on: { param: buffer, equals: Enabled }
        options:
          - { name: x1 , value: 0, sdk: ADC_Pga_1 }
          - { name: x4 , value: 1, sdk: ADC_Pga_4 }
          - { name: x16, value: 2, sdk: ADC_Pga_16 }
          - { name: x64, value: 3, sdk: ADC_Pga_64 }
        help: >
          ADCx_CTLR1 PGA[28:27], codes 00..11 (RM 11.3.2, CH32H417RM.md:14423). Amplifies a
          small input before conversion. The RM's own note 2 on that bit field is why this
          row is greyed until the input buffer is on: "ADC_Buffer needs to be enabled to use
          this function."

  # DVP - THE DATA WIDTH IS ALREADY A SETTING, so it is not offered a second time as a
  # dropdown that could disagree with it. `Mode` (Disable / 8-bit / 10-bit / 12-bit) is what
  # claims D8-D11, and `DVP_CR0.DATA_SIZE` has to say the same thing, so the member is
  # written as three `const:` rows with one dependency each - exactly one applies. A
  # separate editable width would let a project claim twelve pads and configure eight.
  dvp: &dvp_params |
    params:
      - key: datasize_8
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_8b
        depends_on: { setting: Mode, equals: 8-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:72). Fixed by the Mode row, which is what claims D8-D11."
      - key: datasize_10
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_10b
        depends_on: { setting: Mode, equals: 10-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:73). Fixed by the Mode row."
      - key: datasize_12
        name: Data width
        struct: DVP_InitTypeDef
        sdk_field: DVP_DataSize
        const: DVP_DataSize_12b
        depends_on: { setting: Mode, equals: 12-bit }
        help: "DVP_CR0 DATA_SIZE (ch32h417_dvp.h:74). Fixed by the Mode row."
      - key: hclk_pol
        name: PCLK edge
        struct: DVP_InitTypeDef
        sdk_field: DVP_HCLK_P
        type: enum
        default: Rising
        options:
          - { name: Rising , value: 0, sdk: DVP_Hclk_P_Rising }
          - { name: Falling, value: 1, sdk: DVP_Hclk_P_Falling }
        help: "DVP_CR0, the pixel-clock edge data is sampled on (ch32h417_dvp.h:77-78). DVP_StructInit() starts at Rising."
      - key: hsync_pol
        name: HSYNC polarity
        struct: DVP_InitTypeDef
        sdk_field: DVP_HSYNC_P
        type: enum
        default: Active low
        options:
          - { name: Active high, value: 0, sdk: DVP_Hsync_P_High }
          - { name: Active low , value: 1, sdk: DVP_Hsync_P_Low }
        help: >
          DVP_CR0 (ch32h417_dvp.h:81-82). The default follows the EVT drop rather than the
          macro that encodes 0: DVP_StructInit() sets DVP_Hsync_P_Low, whose value is 0x04.
      - key: vsync_pol
        name: VSYNC polarity
        struct: DVP_InitTypeDef
        sdk_field: DVP_VSYNC_P
        type: enum
        default: Active low
        options:
          - { name: Active low , value: 0, sdk: DVP_Vsync_P_Low }
          - { name: Active high, value: 1, sdk: DVP_Vsync_P_High }
        help: "DVP_CR0 (ch32h417_dvp.h:85-86). DVP_StructInit() starts at Low."
      - key: caprate
        name: Frame capture rate
        struct: DVP_InitTypeDef
        sdk_field: DVP_FrameCapRate
        type: enum
        default: Every frame
        options:
          - { name: Every frame   , value: 0, sdk: DVP_FrameCapRate_100P }
          - { name: Every 2nd frame, value: 1, sdk: DVP_FrameCapRate_50P }
          - { name: Every 4th frame, value: 2, sdk: DVP_FrameCapRate_25P }
        help: "DVP_CR1 (ch32h417_dvp.h:89-91). The SDK spells these 100P / 50P / 25P - the proportion of frames kept."
      - key: capmode
        name: Capture mode
        struct: DVP_InitTypeDef
        sdk_field: DVP_CaptureMode
        type: enum
        default: Snapshot
        options:
          - { name: Continuous, value: 0, sdk: DVP_CaptureMode_Continuous }
          - { name: Snapshot  , value: 1, sdk: DVP_CaptureMode_Snapshot }
        help: "DVP_CR1 (ch32h417_dvp.h:94-95). Snapshot is the EVT drop's own default (DVP_StructInit)."
      - key: jpeg
        name: JPEG mode
        struct: DVP_InitTypeDef
        sdk_field: DVP_JPEGMode
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR0 bit 6. The sensor sends a JPEG byte stream rather than raw pixels, so the row/column counts below stop describing the transfer."
      - key: rows
        name: Rows per frame
        struct: DVP_InitTypeDef
        sdk_field: DVP_ROW_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_ROW_NUM. The sensor's frame height in lines. 0 is the EVT drop's own starting value (DVP_StructInit) and means the field is left for your own code."
      - key: cols
        name: Bytes per row
        struct: DVP_InitTypeDef
        sdk_field: DVP_COL_NUM
        type: int
        default: 0
        min: 0
        max: 65535
        help: "DVP_COL_NUM. Counted in BYTES, not pixels, so an RGB565 line of 320 pixels is 640. 0 is DVP_StructInit()'s value."
      - key: crop
        name: Crop window
        struct: DVP_InitTypeDef
        sdk_field: DVP_Crop
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "DVP_CR1 bit 5. Captures a rectangle of the sensor's frame instead of all of it; the four window rows below apply only while it is on."
      - key: win_hoff
        name: Window horizontal offset
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_HOFFCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_HOFFCNT, in BYTES from the start of the line - the same unit as Bytes per row."
      - key: win_vst
        name: Window first line
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VST
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VST, the first line of the frame that is kept."
      - key: win_capcnt
        name: Window width
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_CAPCNT
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_CAPCNT, bytes captured per line."
      - key: win_vline
        name: Window height
        struct: DVP_InitTypeDef
        sdk_field: DVP_Window_VLine
        type: int
        default: 0
        min: 0
        max: 65535
        depends_on: { param: crop, equals: true }
        help: "DVP_VLINE, lines captured per frame."
    notes: >
      Digital video port: a parallel camera interface. The Mode row picks the data width
      AND the pads it claims - 8-bit takes D0-D7, 10-bit adds D8-D9, 12-bit adds D10-D11 -
      and Parameter Settings writes the matching DVP_CR0.DATA_SIZE rather than offering the
      width a second time, so the pin plan and the register cannot disagree.
      THE TWO DMA BUFFER ADDRESSES ARE DELIBERATELY NOT ROWS. `DVP_DMA_BUF0_Addr` and
      `DVP_DMA_BUF1_Addr` (ch32h417_dvp.h:31-35) are pointers into your own program's
      memory - a symbol this tool has no way to know - so they are left at the struct's
      zero-initialiser, which is exactly what the vendor's own `DVP_StructInit()` sets them
      to (ch32h417_dvp.c). Assign `DVP->DMA_BUF0` / `DMA_BUF1` in the USER CODE block before
      `DVP_Cmd(ENABLE)`. Every other member of the struct is a row above.

  # IPC - the inter-processor channel between the V5F and V3F cores. It holds no pad (the
  # generator's `pins: { none: true }` stands), but it is not parameterless: which of the
  # four channels this core owns, and which of the two core IDs it sends to and listens on,
  # are exactly the planning decisions a two-core project has to write down somewhere.
  ipc: &ipc_params |
    params:
      - key: channel
        name: Channel
        struct: IPC_InitTypeDef
        sdk_field: IPC_CH
        type: enum
        default: Channel 0
        options:
          - { name: Channel 0, value: 0, sdk: IPC_CH0 }
          - { name: Channel 1, value: 1, sdk: IPC_CH1 }
          - { name: Channel 2, value: 2, sdk: IPC_CH2 }
          - { name: Channel 3, value: 3, sdk: IPC_CH3 }
        help: "IPC_Channel_TypeDef, ch32h417_ipc.h:23-29. Four independent channels; this block configures one of them."
      - key: txcid
        name: Transmit core ID
        struct: IPC_InitTypeDef
        sdk_field: TxCID
        type: enum
        default: CID0
        options:
          - { name: CID0, value: 0, sdk: IPC_TxCID0 }
          - { name: CID1, value: 1, sdk: IPC_TxCID1 }
        help: "IPC_TxCID_TypeDef, ch32h417_ipc.h:32-36. Which core this channel's messages are addressed to."
      - key: rxcid
        name: Receive core ID
        struct: IPC_InitTypeDef
        sdk_field: RxCID
        type: enum
        default: CID0
        options:
          - { name: CID0, value: 0, sdk: IPC_RxCID0 }
          - { name: CID1, value: 1, sdk: IPC_RxCID1 }
        help: "IPC_RxCID_TypeDef, ch32h417_ipc.h:39-43. Which core's messages this channel listens for."
      - key: txie
        name: Transmit interrupt
        struct: IPC_InitTypeDef
        sdk_field: TxIER
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "IPC_InitTypeDef.TxIER (ch32h417_ipc.h:51). Raises the channel's interrupt when the message has been taken."
      - key: rxie
        name: Receive interrupt
        struct: IPC_InitTypeDef
        sdk_field: RxIER
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "IPC_InitTypeDef.RxIER (ch32h417_ipc.h:52). Raises the channel's interrupt when a message arrives."
      - key: auto
        name: Auto acknowledge
        struct: IPC_InitTypeDef
        sdk_field: AutoEN
        sdk_enabled: ENABLE
        sdk_disabled: DISABLE
        type: bool
        default: false
        help: "IPC_InitTypeDef.AutoEN (ch32h417_ipc.h:53)."

  # SWPMI - the single-wire protocol master. `LoopBackMode` is NOT an editable row: the
  # `Mode` setting already offers Loopback beside the two live wirings, so the member is
  # two `const:` rows with one dependency each and the two cannot contradict.
  swpmi: &swpmi_params |
    params:
      - key: bitrate
        name: Bit rate divider
        struct: SWPMI_InitTypeDef
        sdk_field: BitRate
        type: int
        default: 0
        min: 0
        max: 255
        help: >
          SWPMI_BRR. The header states the relation rather than the frequency:
          SWPMI_freq = SWPMI_clk / ((BitRate + 1) * 4), with the resulting rate required to
          land between 100 kbit/s and 2 Mbit/s (ch32h417_swpmi.h:24-27). It is a DIVIDER
          and not a bit rate, which is why this row is a small integer; the clock tree that
          would let the tool compute the rate for you is not modelled on this part yet.
      - key: txbuf
        name: Transmit buffering
        struct: SWPMI_InitTypeDef
        sdk_field: TxBufferingMode
        type: enum
        default: None
        options:
          - { name: "None"  , value: 0, sdk: SWPMI_TxMode_Buffering_None }
          - { name: Single  , value: 2, sdk: SWPMI_TxMode_Buffering_Single }
          - { name: Multiple, value: 10, sdk: SWPMI_TxMode_Buffering_Multi }
        help: "ch32h417_swpmi.h:41-43. The `value:` figures are the macros' own encodings (0x0 / 0x2 / 0xA), which are NOT a dense 0/1/2 enum."
      - key: rxbuf
        name: Receive buffering
        struct: SWPMI_InitTypeDef
        sdk_field: RxBufferingMode
        type: enum
        default: None
        options:
          - { name: "None"  , value: 0, sdk: SWPMI_RxMode_Buffering_None }
          - { name: Single  , value: 1, sdk: SWPMI_RxMode_Buffering_Single }
          - { name: Multiple, value: 5, sdk: SWPMI_RxMode_Buffering_Multi }
        help: "ch32h417_swpmi.h:46-48. Encodings 0x0 / 0x1 / 0x5, again not dense."
      - key: loopback_off
        name: Loopback
        struct: SWPMI_InitTypeDef
        sdk_field: LoopBackMode
        const: DISABLE
        depends_on: { setting: Mode, ne: Loopback }
        help: "ch32h417_swpmi.h:34. Fixed by the Mode row: a live single-wire link is not in loopback."
      - key: loopback_on
        name: Loopback
        struct: SWPMI_InitTypeDef
        sdk_field: LoopBackMode
        const: ENABLE
        depends_on: { setting: Mode, equals: Loopback }
        help: "ch32h417_swpmi.h:34. Fixed by the Mode row: the transceiver is looped back for self-test and the pad carries nothing."

  # I2S - THE MODE ROW ALREADY DECIDES TWO STRUCT MEMBERS, so neither is offered again.
  # `Mode` is Master/Slave x Transmit/Receive, which IS `I2S_Mode` (ch32h417_spi.h:120-123),
  # and it is also what decides whether the MCK pad is claimed - master modes claim it,
  # slave modes do not - which IS `I2S_MCLKOutput` (:139-140). So both members are `const:`
  # rows keyed off that one row, and a project cannot claim the MCK pad while telling the
  # silicon not to drive it.
  i2s: &i2s_params |
    params:
      - key: mode_mtx
        name: I2S mode
        struct: I2S_InitTypeDef
        sdk_field: I2S_Mode
        const: I2S_Mode_MasterTx
        depends_on: { setting: Mode, equals: Master Transmit }
        help: "SPI_I2SCFGR I2SCFG (ch32h417_spi.h:122). Fixed by the Mode row."
      - key: mode_mrx
        name: I2S mode
        struct: I2S_InitTypeDef
        sdk_field: I2S_Mode
        const: I2S_Mode_MasterRx
        depends_on: { setting: Mode, equals: Master Receive }
        help: "SPI_I2SCFGR I2SCFG (ch32h417_spi.h:123). Fixed by the Mode row."
      - key: mode_stx
        name: I2S mode
        struct: I2S_InitTypeDef
        sdk_field: I2S_Mode
        const: I2S_Mode_SlaveTx
        depends_on: { setting: Mode, equals: Slave Transmit }
        help: "SPI_I2SCFGR I2SCFG (ch32h417_spi.h:120). Fixed by the Mode row."
      - key: mode_srx
        name: I2S mode
        struct: I2S_InitTypeDef
        sdk_field: I2S_Mode
        const: I2S_Mode_SlaveRx
        depends_on: { setting: Mode, equals: Slave Receive }
        help: "SPI_I2SCFGR I2SCFG (ch32h417_spi.h:121). Fixed by the Mode row."
      - key: mclk_on
        name: Master clock output
        struct: I2S_InitTypeDef
        sdk_field: I2S_MCLKOutput
        const: I2S_MCLKOutput_Enable
        depends_on: { setting: Mode, in: [Master Transmit, Master Receive] }
        help: "SPI_I2SPR MCKOE (ch32h417_spi.h:139). Not a separate row because the Mode row is what claims the MCK pad: the two master modes route it and the two slave modes do not, so a dropdown here could switch the driver off under a pad the project has claimed."
      - key: mclk_off
        name: Master clock output
        struct: I2S_InitTypeDef
        sdk_field: I2S_MCLKOutput
        const: I2S_MCLKOutput_Disable
        depends_on: { setting: Mode, in: [Slave Transmit, Slave Receive] }
        help: "SPI_I2SPR MCKOE (ch32h417_spi.h:140). A slave takes its clock from the other end, so MCK is not driven and the pad is not claimed."
      - key: standard
        name: Standard
        struct: I2S_InitTypeDef
        sdk_field: I2S_Standard
        type: enum
        default: Philips
        options:
          - { name: Philips      , value: 0, sdk: I2S_Standard_Phillips }
          - { name: MSB justified, value: 1, sdk: I2S_Standard_MSB }
          - { name: LSB justified, value: 2, sdk: I2S_Standard_LSB }
          - { name: PCM short    , value: 3, sdk: I2S_Standard_PCMShort }
          - { name: PCM long     , value: 4, sdk: I2S_Standard_PCMLong }
        help: "SPI_I2SCFGR I2SSTD and PCMSYNC (ch32h417_spi.h:126-130). The macro is spelled `Phillips`, with two l's, in the vendor header; the label here is the correct spelling and the `sdk:` is the header's."
      - key: dataformat
        name: Data format
        struct: I2S_InitTypeDef
        sdk_field: I2S_DataFormat
        type: enum
        default: 16-bit
        options:
          - { name: 16-bit                , value: 0, sdk: I2S_DataFormat_16b }
          - { name: 16-bit in a 32-bit frame, value: 1, sdk: I2S_DataFormat_16bextended }
          - { name: 24-bit                , value: 3, sdk: I2S_DataFormat_24b }
          - { name: 32-bit                , value: 5, sdk: I2S_DataFormat_32b }
        help: "SPI_I2SCFGR DATLEN and CHLEN (ch32h417_spi.h:133-136). The `value:` figures are the macros' own encodings, which are NOT dense - 16b extended is 1 and 24b is 3, because the two fields are packed together."
      - key: audiofreq
        name: Audio sampling frequency
        struct: I2S_InitTypeDef
        sdk_field: I2S_AudioFreq
        type: enum
        default: 48 kHz
        options:
          - { name: 8 kHz    , value: 8000,   sdk: I2S_AudioFreq_8k }
          - { name: 11.025 kHz, value: 11025, sdk: I2S_AudioFreq_11k }
          - { name: 16 kHz   , value: 16000,  sdk: I2S_AudioFreq_16k }
          - { name: 22.05 kHz, value: 22050,  sdk: I2S_AudioFreq_22k }
          - { name: 32 kHz   , value: 32000,  sdk: I2S_AudioFreq_32k }
          - { name: 44.1 kHz , value: 44100,  sdk: I2S_AudioFreq_44k }
          - { name: 48 kHz   , value: 48000,  sdk: I2S_AudioFreq_48k }
          - { name: 96 kHz   , value: 96000,  sdk: I2S_AudioFreq_96k }
          - { name: 192 kHz  , value: 192000, sdk: I2S_AudioFreq_192k }
        help: >
          The rate the prescaler is computed for (ch32h417_spi.h:143-151). Unlike most
          enums in this file the macro IS the number - I2S_AudioFreq_48k is 48000 - so the
          `value:` column is the frequency itself and not a register code. The header also
          defines I2S_AudioFreq_Default as 2, which is a prescaler sentinel rather than a
          rate and is deliberately not offered here.
      - key: cpol
        name: Clock idle state
        struct: I2S_InitTypeDef
        sdk_field: I2S_CPOL
        type: enum
        default: Low
        options:
          - { name: Low , value: 0, sdk: I2S_CPOL_Low }
          - { name: High, value: 1, sdk: I2S_CPOL_High }
        help: "SPI_I2SCFGR CKPOL (ch32h417_spi.h:155-156). The level CK sits at between frames."

extras:

  SDIO:
    comment: |
      THE BUS WIDTH IS THE MODE ROW, and that is why `SDIO_BusWide` is not a second
      dropdown. `Mode` offers SD 1-bit / 4-bit / 8-bit, and those are what claim D0, D0-D3
      and D0-D7 respectively - so a width chosen separately could configure a four-bit bus
      on a project that only wired one data line, which is the offered-but-impossible
      defect in its usual direction. The three `const:` rows below each depend on one of
      those choices, so exactly one is written.
    yaml: |
      params:
        - key: width_1b
          name: Bus width
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_BusWide
          const: SDIO_BusWide_1b
          depends_on: { setting: Mode, equals: SD 1-bit }
          help: "SDIO_CLKCR WIDBUS (ch32h417_sdio.h:103). Fixed by the Mode row, which is what claims the data pads."
        - key: width_4b
          name: Bus width
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_BusWide
          const: SDIO_BusWide_4b
          depends_on: { setting: Mode, equals: SD 4-bit }
          help: "SDIO_CLKCR WIDBUS (ch32h417_sdio.h:104). Fixed by the Mode row."
        - key: width_8b
          name: Bus width
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_BusWide
          const: SDIO_BusWide_8b
          depends_on: { setting: Mode, equals: SD 8-bit }
          help: "SDIO_CLKCR WIDBUS (ch32h417_sdio.h:105). Fixed by the Mode row."
        - key: clkdiv
          name: Clock divider
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_ClockDiv
          type: int
          default: 118
          min: 0
          max: 255
          help: >
            SDIO_CLKCR CLKDIV, 0x00-0xFF. SDIO_CK = SDIOCLK / (CLKDIV + 2), so 118 gives
            the 400 kHz identification clock from a 48 MHz SDIOCLK and is the value every
            card needs until it is initialised. Raise it afterwards in your own code - the
            card's own CSD says how far.
        - key: clkedge
          name: Clock edge
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_ClockEdge
          type: enum
          default: Rising
          options:
            - { name: Rising , value: 0, sdk: SDIO_ClockEdge_Rising }
            - { name: Falling, value: 1, sdk: SDIO_ClockEdge_Falling }
          help: "SDIO_CLKCR NEGEDGE (ch32h417_sdio.h:91-92). Which edge of SDIO_CK the bus is sampled on."
        - key: clkbypass
          name: Clock divider bypass
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_ClockBypass
          type: enum
          default: Disabled
          options:
            - { name: Disabled, value: 0, sdk: SDIO_ClockBypass_Disable }
            - { name: Enabled , value: 1, sdk: SDIO_ClockBypass_Enable }
          help: "SDIO_CLKCR BYPASS (ch32h417_sdio.h:95-96). Feeds SDIOCLK straight to the card and makes the divider above irrelevant - far too fast for identification, so leave it off until the card is up."
        - key: clkpwrsave
          name: Clock power save
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_ClockPowerSave
          type: enum
          default: Disabled
          options:
            - { name: Disabled, value: 0, sdk: SDIO_ClockPowerSave_Disable }
            - { name: Enabled , value: 1, sdk: SDIO_ClockPowerSave_Enable }
          help: "SDIO_CLKCR PWRSAV (ch32h417_sdio.h:99-100). Stops SDIO_CK while the bus is idle. Some cards want a running clock, so the default is off."
        - key: flowctrl
          name: Hardware flow control
          struct: SDIO_InitTypeDef
          sdk_field: SDIO_HardwareFlowControl
          type: enum
          default: Disabled
          options:
            - { name: Disabled, value: 0, sdk: SDIO_HardwareFlowControl_Disable }
            - { name: Enabled , value: 1, sdk: SDIO_HardwareFlowControl_Enable }
          help: "SDIO_CLKCR HWFC_EN (ch32h417_sdio.h:108-109). Stalls the clock rather than overrunning the FIFO."

  HSADC:
    comment: |
      ONLY THE THREE MEMBERS THAT ARE A CONFIGURATION ARE ROWS. `HSADC_InitTypeDef` has
      eleven, and the other eight describe a DMA transfer in progress rather than the
      converter: two 32-bit receive ADDRESSES, three transfer LENGTHS, and the DMA,
      dual-buffer and burst-mode switches that only mean anything once those addresses
      point at real buffers (ch32h417_hsadc.h:22-56). Those are firmware state, not a pin
      or clock plan, and a buffer address is a symbol this tool cannot know - so they are
      left at the struct's zero-initialiser and named in `notes:` rather than offered as
      rows that would write zeros over whatever the user set up.
    yaml: |
      params:
        - key: datasize
          name: Data size
          struct: HSADC_InitTypeDef
          sdk_field: HSADC_DataSize
          type: enum
          default: 16-bit
          options:
            - { name: 16-bit, value: 0, sdk: HSADC_DataSize_16b }
            - { name: 8-bit , value: 1, sdk: HSADC_DataSize_8b }
          help: "ch32h417_hsadc.h:67-68. How wide each sample is in the receive buffer - 8-bit halves the memory a burst costs and throws away the low byte."
        - key: firstcycle
          name: First conversion cycle
          struct: HSADC_InitTypeDef
          sdk_field: HSADC_FirstConversionCycle
          type: enum
          default: "8"
          options:
            - { name: "8" , value: 0, sdk: HSADC_First_Conversion_Cycle_8 }
            - { name: "9" , value: 1, sdk: HSADC_First_Conversion_Cycle_9 }
            - { name: "10", value: 2, sdk: HSADC_First_Conversion_Cycle_10 }
          help: "ch32h417_hsadc.h:60-63. How many cycles the converter takes before its first sample is valid; the three the header offers are 8, 9 and 10."
        - key: clkdiv
          name: Clock division
          struct: HSADC_InitTypeDef
          sdk_field: HSADC_ClockDivision
          type: int
          default: 0
          min: 0
          max: 63
          help: "ch32h417_hsadc.h:32-33, a number between 0x00 and 0x3F. The high-speed ADC's own divider off its clock source; the clock tree that would let this tool show you the resulting sample rate is not modelled on this part yet."
      notes: >
        High-speed ADC. Pick its pads on the `Channels` row - IN0 to IN6, seven dedicated
        analog inputs - and its converter setup in Parameter Settings.
        THE EIGHT DMA MEMBERS OF `HSADC_InitTypeDef` ARE DELIBERATELY NOT ROWS:
        `HSADC_RxAddress0` and `HSADC_RxAddress1` are buffer addresses, symbols in your own
        program that this tool cannot know; `HSADC_BurstMode_TransferLen`,
        `HSADC_BurstMode_DMA_LastTransferLen` and `HSADC_DMA_TransferLen` are the lengths
        of a transfer into them; and `HSADC_DMA`, `HSADC_DualBuffer` and `HSADC_BurstMode`
        only mean anything once those addresses point somewhere real
        (ch32h417_hsadc.h:22-56). They stay at the struct's zero-initialiser, so set them
        in the USER CODE block before starting a conversion. The three rows above are the
        whole of what is a configuration rather than a transfer.

  USART4: { yaml: *usart_params }
  USART5: { yaml: *usart_params }
  USART6: { yaml: *usart_params }
  USART7: { yaml: *usart_params }
  USART8: { yaml: *usart_params }

  SPI3: { yaml: *spi_params }
  SPI4: { yaml: *spi_params }

  I2C3: { yaml: *i2c_params }
  I2S2: { yaml: *i2s_params }
  I2S3: { yaml: *i2s_params }
  I2C4: { yaml: *i2c_params }

  TIM5:  { yaml: *tim_gp16_params }
  TIM6:  { yaml: *tim_basic_params }
  TIM7:  { yaml: *tim_basic_params }
  TIM8:  { yaml: *tim_adv_params }
  TIM9:  { yaml: *tim_gp32_params }
  TIM10: { yaml: *tim_gp32_params }
  TIM11: { yaml: *tim_gp32_params }
  TIM12: { yaml: *tim_gp32_params }

  ADC1: { yaml: *adc_params }
  ADC2: { yaml: *adc_params }

  DVP:   { yaml: *dvp_params }
  IPC:   { yaml: *ipc_params }
  SWPMI: { yaml: *swpmi_params }

  # ETH's `notes:` were hand-added to the GENERATED block on 2026-09-12 (commit 9a502ae,
  # AGENT-4), where `--splice --refresh` deletes them - the generator's loss guard reported
  # "ETH.notes: dropped" on the next run. Moved here, with the four MDI pads moved to
  # dedicated_pins.yaml, so a refresh reproduces both instead of losing them once. The
  # reasoning below is that commit's, kept word for word because it is cited work.
  ETH:
    yaml: |
      notes: >
        MAC plus a BUILT-IN 10/100M PHY: "Single chip can realize Ethernet communication",
        and "MAC and 100M PHY are fully integrated, and the periphery only needs
        capacitance" (CH32H417DS0.md 1.4.31, 1.2). So the ordinary configuration is the
        internal PHY - four media-dependent pads straight to the magnetics, with no
        MAC-to-PHY interface on pins at all, and nothing to select. RGMII is the OTHER
        supported configuration and the only interface the DS names: it is how an external
        1Gbps PHY is attached, which the DS calls "Optional Ethernet controller MAC +
        external 1Gbps PHY". MII and RMII are deliberately NOT offered. Neither word
        appears anywhere in this part's datasheet - its Ethernet section lists only RGMII -
        and a choice the silicon does not have is the defect class this project exists to
        remove. (Before this change the file offered MII and RMII, both invented.)
        The four pads are MDIRN/MDIRP (receive pair) and MDITN/MDITP (transmit pair), DS
        Table 2-1-1 at CH32H417DS0.md:3919-3930. They are dedicated pins rather than GPIO
        alternates, which is why they live in data/sources/H417/dedicated_pins.yaml where
        the generator can see them.

  # RTC's `notes:` record a clock gate this schema cannot express, found by the round-6
  # peripheral-map audit. It is here rather than in the MCU file because `--splice
  # --refresh` deletes hand-added notes from the GENERATED block; see the ETH entry above
  # for the commit where that happened once already.
  RTC:
    yaml: |
      notes: >
        ITS CLOCK GATE IS TWO BITS, AND `codegen.periph_clock` HOLDS ONE PER PERIPHERAL,
        so the RTC deliberately has no entry there and the generated C says so instead of
        writing half of it. The EVT enables both in one call -
        `RCC_HB1PeriphClockCmd(RCC_HB1Periph_PWR | RCC_HB1Periph_BKP, ENABLE);` followed by
        `PWR_BackupAccessCmd(ENABLE);` - at
        data/sources/H417/Evt/EXAM/RTC/RTC_Calendar/Common/hardware.c:94-95, and repeats it
        at :205-206 and :247-248. Both bits are in RCC_HB1PCENR: BKPEN is bit 27 and PWREN
        bit 28 (CH32H417RM.md:3538 and :3535). BKP alone would gate the backup unit and
        leave the power interface off, which is a half-enable that reads exactly like a
        whole one - the failure this file's ETH entry above also records. There is no
        `RCC_*Periph_RTC` macro anywhere in ch32h417_rcc.h: its complete
        `RCC_*Periph_*` block is lines 230-307, and the RTC appears there only as
        `RCC_RTCCLKSource_*` (:226-228) and `RCC_RTCCLKCmd` (:646), which SELECT and run
        the RTC clock rather than gate the bus interface. Tracked in TASKS.md, owner
        AGENT-2 for the schema half.

  LTDC:
    comment: |
      THE OUTPUT WIDTH IS A WIRING CHOICE, NOT A REGISTER, and that is the whole reason
      this row exists. RM 43.4.5: the global control register `R32_LTDC_GCR` carries four
      polarity bits and an enable, and bits [27:1] are reserved - there is no field that
      narrows the bus. The controller always drives a 24-bit parallel RGB port; a 16- or
      18-bit panel is wired to the HIGH bits of each channel and the low ones are simply
      not connected. So the choice below is "how many lines did you wire", and every line
      it does not claim stays an ordinary pin that any other peripheral may take.

      The subsets are the standard panel wiring (panel MSB to controller MSB), which is
      also how the datasheet numbers the pads: R7/G7/B7 are the most significant.

        RGB888  24 lines  R0-R7  G0-G7  B0-B7      frees nothing
        RGB666  18 lines  R2-R7  G2-G7  B2-B7      frees 6: R0-R1, G0-G1, B0-B1
        RGB565  16 lines  R3-R7  G2-G7  B3-B7      frees 8: R0-R2, G0-G1, B0-B2

      NOT the same thing as an "8-bit mode", which is a question people ask of this
      controller and which has a different answer: `LTDC_LxPFCR.PF[2:0]` (RM 43.4.18)
      offers L8, AL44 and AL88 - eight bits per pixel - but those describe the LAYER'S
      FRAME BUFFER IN MEMORY. The pixel format converter expands every one of them to
      ARGB8888 before the blender, so an 8-bit format saves RAM and frees no pin at all.
      It IS selectable and it IS applied: `Pixel format` is a member of the per-layer
      init below, written by `LTDC_LayerInit()` into `PFCR` beside the window geometry.
      The two axes sit on one peripheral on purpose - the panel wiring and the buffer
      format are the same planning decision - and neither one moves a pin the other owns.
    yaml: |
      # THE PANEL TIMING, and it is peripheral-level where the layer block above is
      # per-layer. `LTDC_Init(&s)` (ch32h417_ltdc.h:224) takes the struct alone - the
      # controller is a singleton, so `no_handle: true` - and every member below is one of
      # its fifteen. The four polarities are what a panel datasheet states; the eight
      # counters are its blanking diagram.
      #
      # THE COUNTERS ARE ACCUMULATED, NOT WIDTHS, and getting that wrong is the classic way
      # an LTDC brings up a blank panel. The header says so member by member
      # (ch32h417_ltdc.h:36-57): AccumulatedHBP ranges "from LTDC_HorizontalSync to 0xFFF",
      # AccumulatedActiveW "from LTDC_AccumulatedHBP", TotalWidth "from
      # LTDC_AccumulatedActiveW". So each is the running total from the start of the line,
      # minus one, and NOT the porch's own width:
      #
      #     HorizontalSync      = HSW - 1
      #     AccumulatedHBP      = HSW + HBP - 1
      #     AccumulatedActiveW  = HSW + HBP + ActiveWidth - 1
      #     TotalWidth          = HSW + HBP + ActiveWidth + HFP - 1
      #
      # and the same four vertically. The defaults are 0 because a timing this tool cannot
      # know is better left at the register's reset value than guessed: there is no
      # `LTDC_StructInit()` default worth copying here (it zeroes them too), and a plausible
      # 800x480 set would be a made-up panel presented as fact.
      params:
        - key: hs_polarity
          name: HSYNC polarity
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_HSPolarity
          type: enum
          default: Active low
          options:
            - { name: Active low , value: 0, sdk: LTDC_HSPolarity_AL }
            - { name: Active high, value: 1, sdk: LTDC_HSPolarity_AH }
          help: "LTDC_GCR.HSPOL (ch32h417_ltdc.h:159-160). Most parallel RGB panels are active low."
        - key: vs_polarity
          name: VSYNC polarity
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_VSPolarity
          type: enum
          default: Active low
          options:
            - { name: Active low , value: 0, sdk: LTDC_VSPolarity_AL }
            - { name: Active high, value: 1, sdk: LTDC_VSPolarity_AH }
          help: "LTDC_GCR.VSPOL (ch32h417_ltdc.h:163-164)."
        - key: de_polarity
          name: Data-enable polarity
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_DEPolarity
          type: enum
          default: Active low
          options:
            - { name: Active low , value: 0, sdk: LTDC_DEPolarity_AL }
            - { name: Active high, value: 1, sdk: LTDC_DEPolarity_AH }
          help: "LTDC_GCR.DEPOL (ch32h417_ltdc.h:167-168). The DE pad is claimed by the `Sync and clock` row."
        - key: pc_polarity
          name: Pixel-clock polarity
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_PCPolarity
          type: enum
          default: Not inverted
          options:
            - { name: Not inverted, value: 0, sdk: LTDC_PCPolarity_IPC }
            - { name: Inverted    , value: 1, sdk: LTDC_PCPolarity_IIPC }
          help: "LTDC_GCR.PCPOL (ch32h417_ltdc.h:171-172). The SDK spells these IPC and IIPC - input pixel clock, and inverted input pixel clock."
        - key: hsync
          name: HSYNC width - 1
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_HorizontalSync
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_SSCR.HSW, 0x000-0xFFF. The panel's horizontal sync pulse width MINUS ONE - every counter in this block is a zero-based end position."
        - key: vsync
          name: VSYNC height - 1
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_VerticalSync
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_SSCR.VSH, 0x000-0x7FF. Vertical sync pulse height minus one. Note the vertical counters are 11 bits where the horizontal ones are 12."
        - key: hbp
          name: Accumulated HBP
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_AccumulatedHBP
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_BPCR.AHBP. HSYNC width + horizontal back porch - 1. The header requires it to be at least HSYNC width - 1 (ch32h417_ltdc.h:42-43), because it is a running total and not the porch on its own."
        - key: vbp
          name: Accumulated VBP
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_AccumulatedVBP
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_BPCR.AVBP. VSYNC height + vertical back porch - 1."
        - key: active_w
          name: Accumulated active width
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_AccumulatedActiveW
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_AWCR.AAW. HSYNC + HBP + the panel's pixel width - 1. Must be at least the accumulated HBP."
        - key: active_h
          name: Accumulated active height
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_AccumulatedActiveH
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_AWCR.AAH. VSYNC + VBP + the panel's line count - 1."
        - key: total_w
          name: Total width
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_TotalWidth
          type: int
          default: 0
          min: 0
          max: 4095
          help: "LTDC_TWCR.TOTALW. The whole line including the front porch, minus one - so HSYNC + HBP + width + HFP - 1. This is what the pixel clock divides into to give the line rate."
        - key: total_h
          name: Total height
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_TotalHeigh
          type: int
          default: 0
          min: 0
          max: 2047
          help: "LTDC_TWCR.TOTALH, the whole frame including the vertical front porch, minus one. The SDK spells the member TotalHeigh, without the final t (ch32h417_ltdc.h:56)."
        - key: bg_red
          name: Background red
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_BackgroundRedValue
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_BCCR.BCRED. What the panel shows where no layer covers it - the colour behind both layers, not a layer's own default colour."
        - key: bg_green
          name: Background green
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_BackgroundGreenValue
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_BCCR.BCGREEN."
        - key: bg_blue
          name: Background blue
          struct: LTDC_InitTypeDef
          sdk_field: LTDC_BackgroundBlueValue
          type: int
          default: 0
          min: 0
          max: 255
          help: "LTDC_BCCR.BCBLUE."
      # THE LAYER INIT, ONE STRUCT FILLED ONCE PER LAYER - deliverable E's mechanism, and
      # this peripheral is why it was built. `LTDC_LayerInit(LTDC_Layerx, &s)`
      # (ch32h417_ltdc.h:225) keeps the FUNCTION and varies the HANDLE: `LTDC_Layer1` and
      # `LTDC_Layer2` are two register blocks (ch32h417.h:1770-1771), where a timer's four
      # channels vary the function and keep the handle. `instances:` names both per layer,
      # and `setting:` is what decides whether a layer is live at all - the `Layer 1` and
      # `Layer 2` rows above, which claim no pad because a layer is memory, not wiring.
      #
      # THE PIXEL FORMAT MOVED HERE, AND THAT IS THE POINT OF THE CHANGE. It shipped in
      # round 5 as two peripheral-level rows with `sdk_none:` and a long note explaining
      # that the SDK's only setter, `LTDC_LayerPixelFormat()`, is a RECONFIGURE call that
      # rescales `CFBLR` from a layer width that is still 0 before `LTDC_LayerInit()` has
      # run (ch32h417_ltdc.c:622-672) - so calling it from a generated init would write a
      # bogus frame-buffer line length. All of that was true, and the conclusion drawn from
      # it - record the choice, write no register - is now obsolete: `LTDC_PixelFormat` is
      # an ORDINARY MEMBER of the struct this block fills (ch32h417_ltdc.h:88), written by
      # `LTDC_LayerInit()` straight into `PFCR` beside the geometry it belongs with. One
      # row per layer, applied rather than commented, and the two planning-only rows are
      # deleted rather than left beside it saying something different.
      #
      # Every default below is the EVT drop's own `LTDC_LayerStructInit()`
      # (ch32h417_ltdc.c), not a guess: geometry and frame buffer 0, constant alpha 0xFF,
      # format ARGB8888, both blending factors PAxCA.
      channel_params:
        struct: LTDC_Layer_InitTypeDef
        applies_per: layer
        instances:
          1: { sdk_call: LTDC_LayerInit, handle: LTDC_Layer1, setting: "Layer 1", active_choices: [Enabled] }
          2: { sdk_call: LTDC_LayerInit, handle: LTDC_Layer2, setting: "Layer 2", active_choices: [Enabled] }
        params:
          - key: pixel_format
            name: Pixel format
            sdk_field: LTDC_PixelFormat
            type: enum
            default: ARGB8888
            options:
              - { name: ARGB8888, value: 0, sdk: LTDC_Pixelformat_ARGB8888 }
              - { name: RGB888,   value: 1, sdk: LTDC_Pixelformat_RGB888 }
              - { name: RGB565,   value: 2, sdk: LTDC_Pixelformat_RGB565 }
              - { name: ARGB1555, value: 3, sdk: LTDC_Pixelformat_ARGB1555 }
              - { name: ARGB4444, value: 4, sdk: LTDC_Pixelformat_ARGB4444 }
              - { name: L8,       value: 5, sdk: LTDC_Pixelformat_L8 }
              - { name: AL44,     value: 6, sdk: LTDC_Pixelformat_AL44 }
              - { name: AL88,     value: 7, sdk: LTDC_Pixelformat_AL88 }
            help: >
              LTDC_LxPFCR.PF[2:0] (RM 43.4.18) - the format of THIS LAYER's FRAME BUFFER IN
              MEMORY, which is a different axis from `Colour depth` above: the pixel format
              converter expands every one of these to ARGB8888 before the blender, so the
              format decides how much RAM a frame costs and frees NO pin. L8 is 8-bit
              indexed through the 256-entry CLUT; AL44 and AL88 are alpha+luminance.
          - key: h_start
            name: Window left edge
            sdk_field: LTDC_HorizontalStart
            type: int
            default: 0
            min: 0
            max: 4095
            help: "LTDC_LxWHPCR.WHSTPOS, 0x000-0xFFF. Counted in pixel clocks from the end of the horizontal back porch, not from the panel edge - the SDK writes the value through unchanged."
          - key: h_stop
            name: Window right edge
            sdk_field: LTDC_HorizontalStop
            type: int
            default: 0
            min: 0
            max: 65535
            help: "LTDC_LxWHPCR.WHSPPOS. LTDC_LayerInit() shifts it left by 16 into the same register as the left edge (ch32h417_ltdc.c), so give it the POSITION, not a width."
          - key: v_start
            name: Window top edge
            sdk_field: LTDC_VerticalStart
            type: int
            default: 0
            min: 0
            max: 4095
            help: "LTDC_LxWVPCR.WVSTPOS, 0x000-0xFFF, in lines from the end of the vertical back porch."
          - key: v_stop
            name: Window bottom edge
            sdk_field: LTDC_VerticalStop
            type: int
            default: 0
            min: 0
            max: 65535
            help: "LTDC_LxWVPCR.WVSPPOS, shifted left by 16 beside the top edge. A position, not a height."
          - key: alpha
            name: Constant alpha
            sdk_field: LTDC_ConstantAlpha
            type: int
            default: 255
            min: 0
            max: 255
            help: "LTDC_LxCACR.CONSTA. 255 is opaque and is LTDC_LayerStructInit()'s value. Used directly when the blending factors are CA, and multiplied by the pixel's own alpha when they are PAxCA."
          - key: bf1
            name: Blending factor 1
            sdk_field: LTDC_BlendingFactor_1
            type: enum
            default: Pixel alpha x constant alpha
            options:
              - { name: Constant alpha, value: 4, sdk: LTDC_BlendingFactor1_CA }
              - { name: Pixel alpha x constant alpha, value: 6, sdk: LTDC_BlendingFactor1_PAxCA }
            help: "LTDC_LxBFCR.BF1 (ch32h417_ltdc.h:211-212). How THIS layer is weighted in the blend. The `value:` figures are the macros' encodings in that field, 100b and 110b."
          - key: bf2
            name: Blending factor 2
            sdk_field: LTDC_BlendingFactor_2
            type: enum
            default: Pixel alpha x constant alpha
            options:
              - { name: Constant alpha, value: 5, sdk: LTDC_BlendingFactor2_CA }
              - { name: Pixel alpha x constant alpha, value: 7, sdk: LTDC_BlendingFactor2_PAxCA }
            help: "LTDC_LxBFCR.BF2 (ch32h417_ltdc.h:215-216). How what is UNDERNEATH is weighted. Both factors sit in one register and LTDC_LayerInit() ORs them together, which is why they are two rows and not one."
          - key: dc_red
            name: Default colour red
            sdk_field: LTDC_DefaultColorRed
            type: int
            default: 0
            min: 0
            max: 255
            help: "LTDC_LxDCCR.DCRED. What the layer shows OUTSIDE its window, where there is no frame-buffer pixel to fetch."
          - key: dc_green
            name: Default colour green
            sdk_field: LTDC_DefaultColorGreen
            type: int
            default: 0
            min: 0
            max: 255
            help: "LTDC_LxDCCR.DCGREEN."
          - key: dc_blue
            name: Default colour blue
            sdk_field: LTDC_DefaultColorBlue
            type: int
            default: 0
            min: 0
            max: 255
            help: "LTDC_LxDCCR.DCBLUE."
          - key: dc_alpha
            name: Default colour alpha
            sdk_field: LTDC_DefaultColorAlpha
            type: int
            default: 0
            min: 0
            max: 255
            help: "LTDC_LxDCCR.DCALPHA. 0 is the EVT drop's value and means the area outside the window is transparent, so the layer below shows through."
          - key: cfb_address
            name: Frame buffer address
            sdk_field: LTDC_CFBStartAdress
            type: int
            default: 0
            min: 0
            max: 4294967295
            help: >
              LTDC_LxCFBAR.CFBADD, the address the layer scans out of. 0 is what the
              vendor's own LTDC_LayerStructInit() sets, and it means "not decided here":
              the buffer is usually a symbol in your program, so assign
              LTDC_Layerx->CFBAR in the USER CODE block - or give the address here if it
              is a fixed external SDRAM base.
          - key: cfb_line_length
            name: Frame buffer line length
            sdk_field: LTDC_CFBLineLength
            type: int
            default: 0
            min: 0
            max: 8191
            help: "LTDC_LxCFBLR.CFBLL, 0x0000-0x1FFF, in BYTES: window width in pixels x bytes per pixel, plus 3 for the fetch overhead. The SDK does not add the 3 for you."
          - key: cfb_pitch
            name: Frame buffer pitch
            sdk_field: LTDC_CFBPitch
            type: int
            default: 0
            min: 0
            max: 8191
            help: "LTDC_LxCFBLR.CFBP, in BYTES from one line of the buffer to the next. Equal to the line length for a tightly packed buffer, larger when the buffer is wider than the window. LTDC_LayerInit() shifts it left by 16 into the same register."
          - key: cfb_line_number
            name: Frame buffer lines
            sdk_field: LTDC_CFBLineNumber
            type: int
            default: 0
            min: 0
            max: 2047
            help: "LTDC_LxCFBLNR.CFBLNBR, 0x000-0x7FF: how many lines the layer fetches per frame."
      notes: >
        Parallel RGB output, always 24 bits wide at the pad - the width you pick here is
        how many lines you WIRED, not a mode the silicon has (RM 43.4.5 gives the global
        control register no width field). A 16-bit panel takes the top five red, top six
        green and top five blue lines; an 18-bit panel the top six of each. Every line the
        chosen depth does not claim is released and can be assigned to another peripheral
        or used as GPIO - picking RGB565 hands back eight pins, RGB666 six.
        An "8-bit mode" is a different thing and does not free pins: L8, AL44 and AL88
        (RM 43.4.18) are eight-bit-per-pixel FRAME BUFFER formats, and the pixel format
        converter expands them to ARGB8888 before the output stage. Choosing one saves
        memory and changes no pin - and you CAN choose one, per layer, in the Layer 1 and
        Layer 2 blocks of Parameter Settings, so a buffer plan and a pin plan are made in
        the same place.
        TWO LAYERS, EACH WITH ITS OWN INIT. Switch a layer on with the `Layer 1` / `Layer 2`
        rows - they claim no pad, because a layer is a rectangle of memory composited onto
        the same RGB port the colour depth already wired - and its sixteen members are
        filled and applied by `LTDC_LayerInit(LTDC_Layerx, &s)`, once per layer that is on.
        The window edges are POSITIONS rather than sizes, counted from the end of the back
        porch, and the frame buffer's line length is in bytes with the RM's +3 fetch
        overhead included by you rather than by the SDK. The frame buffer ADDRESS defaults
        to 0, which is what the vendor's own `LTDC_LayerStructInit()` sets: the buffer is
        usually a symbol in your program, so assign `LTDC_Layerx->CFBAR` in the USER CODE
        block unless it is a fixed external SDRAM base you can type here.

  FMC:
    comment: |
      THE BUSES ARE SELECTABLE BY WIDTH, NOT ALL-OR-NOTHING, and the reason is a real board:
      an 8080 8-bit parallel TFT (ILI9341 / ST7789 / SSD1963 and friends) is driven by FSMC
      and needs ELEVEN pins - D0-D7, one chip select, NOE, NWE, and ONE address line used as
      the RS/DC command-data select. The generated model offered `Data bus D0-D31: Enabled`
      and `Address bus A0-A25: Enabled` as single switches, so asking for that display
      claimed 103 of the 116 bonded pads on QFN128 and made the part unplannable for the
      most common thing anyone attaches to an FSMC. Measured before this change: FSMC
      control alone 48 pads, plus the data bus 80, plus the address bus 103.

      The widths are the silicon's, not a convenience: `FMC_BCRx.MWID[5:4]` (RM 40, Table
      40-17 at CH32H417RM.md:57002) selects 8 / 16 / 32 bits, and the SDK spells the three
      out as `FMC_MemoryDataWidth_8b` / `_16b` / `_32b` (ch32h417_fmc.h:278-280). The
      address groups are the ones a real design uses: one line for an 8080 RS/DC, then the
      bank sizes.

      EVERY SIGNAL THE GENERATOR ROUTED IS STILL CLAIMABLE - that is a hard requirement, not
      a nicety: a routed signal no choice can name is a dead pad, a `validate_mcu.py` ERROR
      and a coverage row (docs/COVERAGE.md check 1). The 86 signals are covered as
      32 data + 26 address + 5 chip selects + 2 strobes + 7 optional + 1 clock + 13 SDRAM.

      HOW TO WIRE AN 8080 PARALLEL DISPLAY, since that is what this reshaping was for:
        Bus mode ... "8080 LCD, 8-bit"   (or 16-bit, or the NE2 variants)
      and that is the whole pin plan - the preset claims D0-D7, A0 as the panel's RS/DC,
      NE1 as its CS and NOE/NWE as its RD/WR, so the rows below stay on Disable. Add an
      ordinary GPIO output for the panel's RESET and one for the backlight; neither is an
      FSMC signal. With an 8-bit bus A0 is the byte address, so the command register is at
      the bank base and the data register one byte above it - which is why the RS line is
      A0 and not A16.

      The `Memory bus` entries in the same dropdown claim data lines ONLY, and leave the
      address width, the chip select and the strobes to the rows below, because a memory
      wants a real address bus where a display wants exactly one line.
    yaml: |
      settings:
        # ONE dropdown for both jobs, because the alternative is two that can disagree.
        # The four `8080 LCD` entries are COMPLETE wirings - data lines, the RS/DC address
        # line, the chip select and both strobes - so a parallel display is one pick and the
        # rows below stay on `Disable`. The `Memory bus` entries claim only data lines and
        # leave the address width, chip select and strobes to those rows, because a memory
        # needs a real address bus and an LCD needs exactly one line.
        #
        # THERE IS NO 6800 MODE, and that is the silicon, not an omission. FSMC drives an
        # 8080-style bus: separate read and write strobes (`NOE`/`NWE`), and `FMC_BCRx.MTYP`
        # selects SRAM / PSRAM / NOR only (ch32h417_fmc.h:273-275) - there is no register
        # that turns NOE/NWE into a 6800 E + R/W pair. A 6800-wired panel is handled at the
        # PANEL: essentially every controller of this class (ILI9341, ST7789, SSD1963, the
        # HD44780-alikes) has IM[2:0] / PS strap pins that select the 8080 interface, and you
        # strap it to 8080 and use one of the entries below. Offering a "6800" choice here
        # would be offering a mode the controller does not have.
        - name: "Bus mode"
          choices:
            - { name: Disable }
            - { name: "8080 LCD, 8-bit (D0-D7, RS=A0, CS=NE1, RD=NOE, WR=NWE)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, A0, NE1, NOE, NWE] }
            - { name: "8080 LCD, 16-bit (D0-D15, RS=A0, CS=NE1, RD=NOE, WR=NWE)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, A0, NE1, NOE, NWE] }
            - { name: "8080 LCD, 8-bit on CS2 (NE2)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, A0, NE2, NOE, NWE] }
            - { name: "8080 LCD, 16-bit on CS2 (NE2)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, A0, NE2, NOE, NWE] }
            - { name: "Memory bus, 8-bit (D0-D7)", signals: [D0, D1, D2, D3, D4, D5, D6, D7] }
            - { name: "Memory bus, 16-bit (D0-D15)", signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15] }
            - { name: "Memory bus, 32-bit (D0-D31)", signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, D16, D17, D18, D19, D20, D21, D22, D23, D24, D25, D26, D27, D28, D29, D30, D31] }
        - name: "Address lines"
          choices:
            - { name: Disable }
            - { name: "A0 only (8080 RS/DC)", signals: [A0] }
            - { name: "A0-A7", signals: [A0, A1, A2, A3, A4, A5, A6, A7] }
            - { name: "A0-A15", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15] }
            - { name: "A0-A18", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15, A16, A17, A18] }
            - { name: "A0-A25", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15, A16, A17, A18, A19, A20, A21, A22, A23, A24, A25] }
        - name: "Chip select"
          type: checkboxes
          choices:
            - { name: NE1, signals: [NE1] }
            - { name: NE2, signals: [NE2] }
            - { name: NE3, signals: [NE3] }
            - { name: NE4, signals: [NE4] }
            - { name: "NCE2 (NAND)", signals: [NCE2] }
        - name: "NOR/PSRAM and NAND control (FSMC)"
          choices:
            - { name: Disable }
            - { name: "Read/write strobes (NOE, NWE)", signals: [NOE, NWE] }
        - name: "Optional FSMC signals"
          type: checkboxes
          choices:
            - { name: "NWAIT (wait input)", signals: [NWAIT] }
            - { name: "NADV (address valid, muxed bus)", signals: [NADV] }
            - { name: "NBL0 (byte lane 0)", signals: [NBL0] }
            - { name: "NBL1 (byte lane 1)", signals: [NBL1] }
            - { name: "NBL2 (byte lane 2)", signals: [NBL2] }
            - { name: "NBL3 (byte lane 3)", signals: [NBL3] }
            - { name: "INT2 (NAND interrupt)", signals: [INT2] }
        - name: "Clock"
          choices:
            - { name: Disable }
            - { name: Enabled, signals: [CLK] }
        - name: "SDRAM control"
          choices:
            - { name: Disable }
            - { name: Enabled, signals: [BA0, BA1, CAS_N, RAS_N, WE_N, CKE0, CKE1, CS_N0, CS_N1, DQM0, DQM1, DQM2, DQM3] }
      notes: >
        Flexible memory controller. The data and address buses are picked by WIDTH rather
        than switched on whole, because the width is a real register field
        (`FMC_BCRx.MWID[5:4]`, RM 40 Table 40-17; `FMC_MemoryDataWidth_8b/_16b/_32b` in
        ch32h417_fmc.h:278-280) and because a narrow bus is the common case, not the
        exception. An 8080 8-bit parallel TFT wants `Data bus width: 8-bit`,
        `Address lines: A0 only` (A0 is the panel's RS/DC - on an 8-bit bus A0 is the byte
        address, so the command register sits at the bank base and the data register one
        byte above), `Chip select: NE1`, and `NOR/PSRAM and NAND control: Read/write
        strobes` for the panel's RD and WR. That is eleven pins; switching the whole
        controller on used to claim 103. The panel's RESET and backlight are ordinary
        GPIO outputs and are not FSMC signals.
        The generator emits no FMC init struct yet - `FMC_NORSRAMInit()` needs the timing
        block (address setup, data setup, bus turnaround) which is a property of the panel
        and not of the pin plan - so this peripheral configures pins and the clock enable,
        and the timings go in your own code. Nothing here guesses a number.

  TKEY:
    comment: |
      TKEY HAS NO PAD OF ITS OWN, and this is the citation rather than an assumption from
      a sibling part. RM ch.13 "Touch Key Detection (TKEY)" (CH32H417RM.md:15745): "The
      detection channel reuses 16 external channels of the ADC, and the touch key
      detection is realized through the single conversion mode of the ADC module", and
      RM 13.1 (:15752): "For TKEY detection, the ADC module is needed. To enable TKEY,
      ensure that ADC is powered on (ADON=1), then set the TKENABLE bit in the ADC_CTLR1
      register to 1." The SPL agrees: ch32h417.h:1760-1761 defines TKey1 and TKey2 as
      `ADC_TypeDef *` at ADC1_BASE and ADC2_BASE, and :1880 defines ADC_TKENABLE as an
      ADC_CTLR1 bit. So the pads a touch design claims are ADC1/ADC2's IN0-IN15, and the
      user claims them on the ADC's `Channels` row - the same pad offered twice would be
      a conflict the silicon has not got. DS 1.4.13 and the model table's `ADC/TKey ...
      Channels 16+2` row say the same thing from the datasheet side.
    yaml: |
      pins:
        none: true
        source: "CH32H417RM.md:15745 (RM ch.13: the detection channels reuse the ADC's 16 external channels) and CH32H417DS0.md Table 2-1-1, which carries no TKEY function on any pin row"
      notes: >
        Touch-key capacitance detection: an operating mode of the two ADCs rather than a
        block with pads. Enabling it sets ADC_CTLR1.TKENABLE (ch32h417.h:1880) on an ADC
        that is already powered on, and the channel converted is the first of that ADC's
        regular sequence. Pick the pads on ADC1's or ADC2's `Channels` row; up to 16
        detection channels, one conversion at a time (RM 13.1).

  PWR:
    yaml: |
      pins:
        none: true
        source: "CH32H417DS0.md Table 2-1-1 and Tables 2-2-x: no pin row carries a function of this peripheral (checked by tools/coverage.py)"
        # Seven rails, and the DS states an ORDER between four of them once at the end of
        # 1.4.3 rather than in a table: VDD33 >= VDD33A >= VDDIO >= VIO18. Two more
        # (VDD12A, VDDK) are normally OUTPUTS of internal LDOs and only become inputs if
        # the designer moves the heat off the chip, and VBAT stands outside the ordering
        # because it is switched in only when the others are gone. Modelling that as flat
        # rows would lose the part a designer most needs: which rail may be above which.
        supplies:
          - name: VDD33
            pins: [VDD33]
            range: "2.4-3.6 V (3.15-3.45 V with USB2.0 or Ethernet)"
            note: >
              Main supply, and the highest rail. Powers some I/O pins, the system LDO and the
              built-in USB2.0 and Ethernet PHYs. Must not fall below 2.7 V in Stop mode or
              while VIO18 is switched from low to high. Decouple 0.1 uF per pin plus 10 uF at
              the main pin, next to the Ethernet signals.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDD33A
            pins: [VDD33A]
            range: "1.8-3.6 V (>= 3.0 V for HSADC, >= 2.4 V for ADC and DAC)"
            note: >
              Analog supply for the ADC, temperature sensor, HSADC, OPA, CMP, DAC and PLL.
              Match it to VDDIO when the OPA or DAC is used; otherwise it may be higher. Must
              not exceed VDD33.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDDIO
            pins: [VDDIO]
            range: "1.65-3.6 V"
            note: >
              I/O supply: sets the output high level of the regular I/O pins and feeds the I/O
              LDO that produces VIO18. Must not exceed VDD33 or VDD33A. When VIO18 rises from
              low to high, VDDIO's capacitance must be much larger than VIO18's or the inrush
              pulls VDDIO down. 0.1 uF per pin plus 10 uF at the main pin.
            source: "CH32H417DS0.md 1.4.3"
          - name: VIO18
            pins: [VIO18]
            range: "1.1-3.6 V"
            note: >
              Supply for the high-speed I/O pins. Normally GENERATED by the I/O LDO from
              VDDIO and set by software to 1.2, 1.8, 2.5 or 3.3 V, or switched off. The level
              after power-up is chosen by the pull-down resistor on the XO pin. Short it to
              VDDIO when low-voltage I/O is not needed. 0.1 uF per pin plus 2.2 uF at the
              main pin.
            source: "CH32H417DS0.md 1.4.3, Table 3-2"
          - name: VDD12A
            pins: [VDD12A]
            range: "1.17-1.27 V"
            note: >
              For the USB 3.0 module and the TH PHY. Normally an LDO OUTPUT derived from
              VDD33, so the pin is a decoupling node: 0.1 uF + 2.2 uF. May be fed from an
              external DC-DC instead to move the LDO's heat off the chip - then the external
              voltage must sit slightly above the LDO's output, and the LDO must be off.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDDK
            pins: [VDDK]
            range: "1.17-1.27 V"
            note: >
              Core supply, with the same double role as VDD12A: normally an LDO output from
              VDD33 and a decoupling node (0.1 uF per pin plus 2.2 uF at the main pin), or fed
              externally at a voltage slightly above the LDO's output.
            source: "CH32H417DS0.md 1.4.3"
          - name: VREFP
            pins: [VREFP]
            range: "2.4-3.6 V"
            note: >
              Reference input for the ADC, HSADC and DAC. Must not exceed VDD33A. Tie it to
              VDD33A for ratiometric conversions, or drive it from a reference - there is no
              internal reference pad.
            source: "CH32H417DS0.md 1.4.3"
          - name: VBAT
            pins: [VBAT]
            range: "1.8-3.6 V"
            note: >
              Optional backup supply, outside the VDD33 >= VDD33A >= VDDIO >= VIO18 ordering:
              it is only switched in when VDD33 and VDD33A are off, to run the RTC and the
              external 32 kHz oscillator.
            source: "CH32H417DS0.md 1.4.3"
          - name: VSS / VSSA
            pins: [VSS, VSSA]
            range: "0 V"
            note: >
              Ground, and the analog return for VDD33A and VREFP. Star VSSA to VSS at the pin
              rather than along the digital ground path.
            source: "CH32H417DS0.md Table 2-1-1"
