# CH32H417 hand-written peripheral additions, for tools/gen_h417_peripherals.py
#
# WHY THIS FILE EXISTS. The `peripherals:` block of data/mcus/CH32H417.yaml below the
# GENERATED marker is rewritten wholesale by
#
#     python tools/gen_h417_peripherals.py --splice --refresh
#
# so anything hand-added to a generated block is destroyed the next time anybody runs it.
# On 2026-09-12 a refresh would have deleted PWR's eight supply rails, LTDC's colour-depth
# reasoning and its notes, and re-declared USBFS/USBHS/USBSS as holding no pin - roughly
# two hundred lines of cited fact, silently, with every gate still green. The generator
# is the authority for that section, so the facts belong where the generator can read
# them, the way dedicated_pins.yaml already holds the pads its AF parser cannot see.
#
# Per peripheral, two optional keys:
#   comment:  prose emitted as a `#` comment block between `category:` and `settings:`
#   yaml:     a YAML fragment emitted verbatim (indented) at the end of the block. Any
#             top-level key it defines suppresses the generator's own version of that key
#             - which is how PWR's `pins:` replaces the plain `pins: { none: true }`.
#
# Every statement here cites the datasheet or the reference manual, same rule as anywhere
# else in data/: a citation is a file:line or a table number, never a family.

extras:

  LTDC:
    comment: |
      THE OUTPUT WIDTH IS A WIRING CHOICE, NOT A REGISTER, and that is the whole reason
      this row exists. RM 43.4.5: the global control register `R32_LTDC_GCR` carries four
      polarity bits and an enable, and bits [27:1] are reserved - there is no field that
      narrows the bus. The controller always drives a 24-bit parallel RGB port; a 16- or
      18-bit panel is wired to the HIGH bits of each channel and the low ones are simply
      not connected. So the choice below is "how many lines did you wire", and every line
      it does not claim stays an ordinary pin that any other peripheral may take.

      The subsets are the standard panel wiring (panel MSB to controller MSB), which is
      also how the datasheet numbers the pads: R7/G7/B7 are the most significant.

        RGB888  24 lines  R0-R7  G0-G7  B0-B7      frees nothing
        RGB666  18 lines  R2-R7  G2-G7  B2-B7      frees 6: R0-R1, G0-G1, B0-B1
        RGB565  16 lines  R3-R7  G2-G7  B3-B7      frees 8: R0-R2, G0-G1, B0-B2

      NOT the same thing as an "8-bit mode", which is a question people ask of this
      controller and which has a different answer: `LTDC_LxPFCR.PF[2:0]` (RM 43.4.18)
      offers L8, AL44 and AL88 - eight bits per pixel - but those describe the LAYER'S
      FRAME BUFFER IN MEMORY. The pixel format converter expands every one of them to
      ARGB8888 before the blender, so an 8-bit format saves RAM and frees no pin at all.
      It IS selectable, as `params:` below: `Layer 1 pixel format` and `Layer 2 pixel
      format`, all eight formats. The two axes sit on one peripheral on purpose - the
      panel wiring and the buffer format are the same planning decision - and neither
      one moves a pin the other owns.
    yaml: |
      params:
        # THE LAYER PIXEL FORMAT, SELECTABLE - for PLANNING, and emitting no register write.
        #
        # `LTDC_LxPFCR.PF[2:0]` (RM 43.4.18, RM:65146) picks the format of the layer's FRAME
        # BUFFER IN MEMORY. It is the question people mean by "does this thing do 8-bit", and
        # it is a different axis from `Colour depth` above: the pixel format converter expands
        # every one of these to ARGB8888 before the blender, so the format decides how much RAM
        # a frame costs and frees NO pin. Both live on this peripheral on purpose - you plan the
        # panel wiring and the buffer format in one place.
        #
        # WHY `sdk_none:` RATHER THAN A CALL, and this is the whole design decision. The SDK
        # does have `LTDC_LayerPixelFormat(LTDC_Layerx, fmt)`, and `sdk_args:` would happily
        # pass `LTDC_Layer1` through literally, so emitting it LOOKS easy. Read it first
        # (`ch32h417_ltdc.c:622-672`): it is a RECONFIGURE call, not an init one. It reads the
        # CURRENT `PFCR` to work out the old bytes-per-pixel, divides `CFBLR >> 16` - the frame
        # buffer line length, which `LTDC_LayerInit()` computes from the layer WIDTH - by it to
        # recover a pixel count, then re-multiplies by the new bytes-per-pixel. At reset
        # `CFBLR` is 0 (RM:64570, R32_LTDC_L1PFCR and the L1CFBLR beside it reset 0x00000000),
        # so calling it from a generated init would compute 0/n and write a line length of 3
        # bytes with a pitch of 0. That is wrong-but-compiling code - a broken display the
        # configurator gives you no way to see - and the SDK's own doc comment adds that a
        # shadow-register reload must follow it anyway (`:619-620`).
        #
        # So the row is a PLANNING row: it records the choice, states the cost in the generated
        # C as a comment, and leaves the register to the layer init that owns the geometry. No
        # TODO, no `#error`, and `--strict` stays clean, because nothing here is unfinished -
        # this is the correct amount of code to emit for a value whose register write depends
        # on a number this tool does not own.
        - key: layer1_format
          name: Layer 1 pixel format
          type: enum
          default: ARGB8888
          sdk_none: true
          sdk_note: >-
            no init-time setter. LTDC_LayerPixelFormat() is a RECONFIGURE call - it rescales
            CFBLR from the layer width, which is still 0 before LTDC_LayerInit() has run
            (ch32h417_ltdc.c:622-672) - so calling it here would write a bogus frame-buffer
            line length. This row records the format; your layer init applies it.
          help: >
            Frame-buffer format for layer 1 (LTDC_L1PFCR.PF, RM 43.4.18). Decides bytes per
            pixel in MEMORY, not lines at the pad - every format is expanded to ARGB8888
            before the output stage, so this frees no pin. Use Colour depth above for the
            wiring. L8 is 8-bit indexed through the 256-entry CLUT; AL44 and AL88 are
            alpha+luminance. Reset value is ARGB8888.
          options:
            - { name: ARGB8888, value: 0, sdk: LTDC_Pixelformat_ARGB8888 }
            - { name: RGB888,   value: 1, sdk: LTDC_Pixelformat_RGB888 }
            - { name: RGB565,   value: 2, sdk: LTDC_Pixelformat_RGB565 }
            - { name: ARGB1555, value: 3, sdk: LTDC_Pixelformat_ARGB1555 }
            - { name: ARGB4444, value: 4, sdk: LTDC_Pixelformat_ARGB4444 }
            - { name: L8,       value: 5, sdk: LTDC_Pixelformat_L8 }
            - { name: AL44,     value: 6, sdk: LTDC_Pixelformat_AL44 }
            - { name: AL88,     value: 7, sdk: LTDC_Pixelformat_AL88 }
        - key: layer2_format
          name: Layer 2 pixel format
          type: enum
          default: ARGB8888
          sdk_none: true
          sdk_note: >-
            no init-time setter, same as layer 1 - LTDC_LayerPixelFormat() rescales CFBLR from
            a layer width that is 0 until LTDC_LayerInit() has run (ch32h417_ltdc.c:622-672).
            This row records the format; your layer init applies it.
          help: >
            Frame-buffer format for layer 2 (LTDC_L2PFCR.PF, RM 43.4.18). This controller has
            exactly two layers - LTDC_Layer1 and LTDC_Layer2 (ch32h417.h:1770-1771) - blended
            by alpha (RM:64248). Same rule as layer 1: it decides bytes per pixel in memory and
            frees no pin. Leave it at the reset value if you only use one layer.
          options:
            - { name: ARGB8888, value: 0, sdk: LTDC_Pixelformat_ARGB8888 }
            - { name: RGB888,   value: 1, sdk: LTDC_Pixelformat_RGB888 }
            - { name: RGB565,   value: 2, sdk: LTDC_Pixelformat_RGB565 }
            - { name: ARGB1555, value: 3, sdk: LTDC_Pixelformat_ARGB1555 }
            - { name: ARGB4444, value: 4, sdk: LTDC_Pixelformat_ARGB4444 }
            - { name: L8,       value: 5, sdk: LTDC_Pixelformat_L8 }
            - { name: AL44,     value: 6, sdk: LTDC_Pixelformat_AL44 }
            - { name: AL88,     value: 7, sdk: LTDC_Pixelformat_AL88 }
      notes: >
        Parallel RGB output, always 24 bits wide at the pad - the width you pick here is
        how many lines you WIRED, not a mode the silicon has (RM 43.4.5 gives the global
        control register no width field). A 16-bit panel takes the top five red, top six
        green and top five blue lines; an 18-bit panel the top six of each. Every line the
        chosen depth does not claim is released and can be assigned to another peripheral
        or used as GPIO - picking RGB565 hands back eight pins, RGB666 six.
        An "8-bit mode" is a different thing and does not free pins: L8, AL44 and AL88
        (RM 43.4.18) are eight-bit-per-pixel FRAME BUFFER formats, and the pixel format
        converter expands them to ARGB8888 before the output stage. Choosing one saves
        memory and changes no pin - and you CAN choose one: Parameter Settings carries
        `Layer 1 pixel format` and `Layer 2 pixel format`, all eight formats, so a buffer
        plan and a pin plan are made in the same place. What the generator deliberately does
        NOT emit is the register write: `LTDC_LayerPixelFormat()` rescales the frame-buffer
        line length from a layer width it does not know yet, so the choice is recorded as a
        comment in the generated C and your own layer init applies it.

  FMC:
    comment: |
      THE BUSES ARE SELECTABLE BY WIDTH, NOT ALL-OR-NOTHING, and the reason is a real board:
      an 8080 8-bit parallel TFT (ILI9341 / ST7789 / SSD1963 and friends) is driven by FSMC
      and needs ELEVEN pins - D0-D7, one chip select, NOE, NWE, and ONE address line used as
      the RS/DC command-data select. The generated model offered `Data bus D0-D31: Enabled`
      and `Address bus A0-A25: Enabled` as single switches, so asking for that display
      claimed 103 of the 116 bonded pads on QFN128 and made the part unplannable for the
      most common thing anyone attaches to an FSMC. Measured before this change: FSMC
      control alone 48 pads, plus the data bus 80, plus the address bus 103.

      The widths are the silicon's, not a convenience: `FMC_BCRx.MWID[5:4]` (RM 40, Table
      40-17 at CH32H417RM.md:57002) selects 8 / 16 / 32 bits, and the SDK spells the three
      out as `FMC_MemoryDataWidth_8b` / `_16b` / `_32b` (ch32h417_fmc.h:278-280). The
      address groups are the ones a real design uses: one line for an 8080 RS/DC, then the
      bank sizes.

      EVERY SIGNAL THE GENERATOR ROUTED IS STILL CLAIMABLE - that is a hard requirement, not
      a nicety: a routed signal no choice can name is a dead pad, a `validate_mcu.py` ERROR
      and a coverage row (docs/COVERAGE.md check 1). The 86 signals are covered as
      32 data + 26 address + 5 chip selects + 2 strobes + 7 optional + 1 clock + 13 SDRAM.

      HOW TO WIRE AN 8080 PARALLEL DISPLAY, since that is what this reshaping was for:
        Bus mode ... "8080 LCD, 8-bit"   (or 16-bit, or the NE2 variants)
      and that is the whole pin plan - the preset claims D0-D7, A0 as the panel's RS/DC,
      NE1 as its CS and NOE/NWE as its RD/WR, so the rows below stay on Disable. Add an
      ordinary GPIO output for the panel's RESET and one for the backlight; neither is an
      FSMC signal. With an 8-bit bus A0 is the byte address, so the command register is at
      the bank base and the data register one byte above it - which is why the RS line is
      A0 and not A16.

      The `Memory bus` entries in the same dropdown claim data lines ONLY, and leave the
      address width, the chip select and the strobes to the rows below, because a memory
      wants a real address bus where a display wants exactly one line.
    yaml: |
      settings:
        # ONE dropdown for both jobs, because the alternative is two that can disagree.
        # The four `8080 LCD` entries are COMPLETE wirings - data lines, the RS/DC address
        # line, the chip select and both strobes - so a parallel display is one pick and the
        # rows below stay on `Disable`. The `Memory bus` entries claim only data lines and
        # leave the address width, chip select and strobes to those rows, because a memory
        # needs a real address bus and an LCD needs exactly one line.
        #
        # THERE IS NO 6800 MODE, and that is the silicon, not an omission. FSMC drives an
        # 8080-style bus: separate read and write strobes (`NOE`/`NWE`), and `FMC_BCRx.MTYP`
        # selects SRAM / PSRAM / NOR only (ch32h417_fmc.h:273-275) - there is no register
        # that turns NOE/NWE into a 6800 E + R/W pair. A 6800-wired panel is handled at the
        # PANEL: essentially every controller of this class (ILI9341, ST7789, SSD1963, the
        # HD44780-alikes) has IM[2:0] / PS strap pins that select the 8080 interface, and you
        # strap it to 8080 and use one of the entries below. Offering a "6800" choice here
        # would be offering a mode the controller does not have.
        - name: "Bus mode"
          choices:
            - { name: Disable }
            - { name: "8080 LCD, 8-bit (D0-D7, RS=A0, CS=NE1, RD=NOE, WR=NWE)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, A0, NE1, NOE, NWE] }
            - { name: "8080 LCD, 16-bit (D0-D15, RS=A0, CS=NE1, RD=NOE, WR=NWE)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, A0, NE1, NOE, NWE] }
            - { name: "8080 LCD, 8-bit on CS2 (NE2)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, A0, NE2, NOE, NWE] }
            - { name: "8080 LCD, 16-bit on CS2 (NE2)",
                signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, A0, NE2, NOE, NWE] }
            - { name: "Memory bus, 8-bit (D0-D7)", signals: [D0, D1, D2, D3, D4, D5, D6, D7] }
            - { name: "Memory bus, 16-bit (D0-D15)", signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15] }
            - { name: "Memory bus, 32-bit (D0-D31)", signals: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, D16, D17, D18, D19, D20, D21, D22, D23, D24, D25, D26, D27, D28, D29, D30, D31] }
        - name: "Address lines"
          choices:
            - { name: Disable }
            - { name: "A0 only (8080 RS/DC)", signals: [A0] }
            - { name: "A0-A7", signals: [A0, A1, A2, A3, A4, A5, A6, A7] }
            - { name: "A0-A15", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15] }
            - { name: "A0-A18", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15, A16, A17, A18] }
            - { name: "A0-A25", signals: [A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15, A16, A17, A18, A19, A20, A21, A22, A23, A24, A25] }
        - name: "Chip select"
          type: checkboxes
          choices:
            - { name: NE1, signals: [NE1] }
            - { name: NE2, signals: [NE2] }
            - { name: NE3, signals: [NE3] }
            - { name: NE4, signals: [NE4] }
            - { name: "NCE2 (NAND)", signals: [NCE2] }
        - name: "NOR/PSRAM and NAND control (FSMC)"
          choices:
            - { name: Disable }
            - { name: "Read/write strobes (NOE, NWE)", signals: [NOE, NWE] }
        - name: "Optional FSMC signals"
          type: checkboxes
          choices:
            - { name: "NWAIT (wait input)", signals: [NWAIT] }
            - { name: "NADV (address valid, muxed bus)", signals: [NADV] }
            - { name: "NBL0 (byte lane 0)", signals: [NBL0] }
            - { name: "NBL1 (byte lane 1)", signals: [NBL1] }
            - { name: "NBL2 (byte lane 2)", signals: [NBL2] }
            - { name: "NBL3 (byte lane 3)", signals: [NBL3] }
            - { name: "INT2 (NAND interrupt)", signals: [INT2] }
        - name: "Clock"
          choices:
            - { name: Disable }
            - { name: Enabled, signals: [CLK] }
        - name: "SDRAM control"
          choices:
            - { name: Disable }
            - { name: Enabled, signals: [BA0, BA1, CAS_N, RAS_N, WE_N, CKE0, CKE1, CS_N0, CS_N1, DQM0, DQM1, DQM2, DQM3] }
      notes: >
        Flexible memory controller. The data and address buses are picked by WIDTH rather
        than switched on whole, because the width is a real register field
        (`FMC_BCRx.MWID[5:4]`, RM 40 Table 40-17; `FMC_MemoryDataWidth_8b/_16b/_32b` in
        ch32h417_fmc.h:278-280) and because a narrow bus is the common case, not the
        exception. An 8080 8-bit parallel TFT wants `Data bus width: 8-bit`,
        `Address lines: A0 only` (A0 is the panel's RS/DC - on an 8-bit bus A0 is the byte
        address, so the command register sits at the bank base and the data register one
        byte above), `Chip select: NE1`, and `NOR/PSRAM and NAND control: Read/write
        strobes` for the panel's RD and WR. That is eleven pins; switching the whole
        controller on used to claim 103. The panel's RESET and backlight are ordinary
        GPIO outputs and are not FSMC signals.
        The generator emits no FMC init struct yet - `FMC_NORSRAMInit()` needs the timing
        block (address setup, data setup, bus turnaround) which is a property of the panel
        and not of the pin plan - so this peripheral configures pins and the clock enable,
        and the timings go in your own code. Nothing here guesses a number.

  TKEY:
    comment: |
      TKEY HAS NO PAD OF ITS OWN, and this is the citation rather than an assumption from
      a sibling part. RM ch.13 "Touch Key Detection (TKEY)" (CH32H417RM.md:15745): "The
      detection channel reuses 16 external channels of the ADC, and the touch key
      detection is realized through the single conversion mode of the ADC module", and
      RM 13.1 (:15752): "For TKEY detection, the ADC module is needed. To enable TKEY,
      ensure that ADC is powered on (ADON=1), then set the TKENABLE bit in the ADC_CTLR1
      register to 1." The SPL agrees: ch32h417.h:1760-1761 defines TKey1 and TKey2 as
      `ADC_TypeDef *` at ADC1_BASE and ADC2_BASE, and :1880 defines ADC_TKENABLE as an
      ADC_CTLR1 bit. So the pads a touch design claims are ADC1/ADC2's IN0-IN15, and the
      user claims them on the ADC's `Channels` row - the same pad offered twice would be
      a conflict the silicon has not got. DS 1.4.13 and the model table's `ADC/TKey ...
      Channels 16+2` row say the same thing from the datasheet side.
    yaml: |
      pins:
        none: true
        source: "CH32H417RM.md:15745 (RM ch.13: the detection channels reuse the ADC's 16 external channels) and CH32H417DS0.md Table 2-1-1, which carries no TKEY function on any pin row"
      notes: >
        Touch-key capacitance detection: an operating mode of the two ADCs rather than a
        block with pads. Enabling it sets ADC_CTLR1.TKENABLE (ch32h417.h:1880) on an ADC
        that is already powered on, and the channel converted is the first of that ADC's
        regular sequence. Pick the pads on ADC1's or ADC2's `Channels` row; up to 16
        detection channels, one conversion at a time (RM 13.1).

  PWR:
    yaml: |
      pins:
        none: true
        source: "CH32H417DS0.md Table 2-1-1 and Tables 2-2-x: no pin row carries a function of this peripheral (checked by tools/coverage.py)"
        # Seven rails, and the DS states an ORDER between four of them once at the end of
        # 1.4.3 rather than in a table: VDD33 >= VDD33A >= VDDIO >= VIO18. Two more
        # (VDD12A, VDDK) are normally OUTPUTS of internal LDOs and only become inputs if
        # the designer moves the heat off the chip, and VBAT stands outside the ordering
        # because it is switched in only when the others are gone. Modelling that as flat
        # rows would lose the part a designer most needs: which rail may be above which.
        supplies:
          - name: VDD33
            pins: [VDD33]
            range: "2.4-3.6 V (3.15-3.45 V with USB2.0 or Ethernet)"
            note: >
              Main supply, and the highest rail. Powers some I/O pins, the system LDO and the
              built-in USB2.0 and Ethernet PHYs. Must not fall below 2.7 V in Stop mode or
              while VIO18 is switched from low to high. Decouple 0.1 uF per pin plus 10 uF at
              the main pin, next to the Ethernet signals.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDD33A
            pins: [VDD33A]
            range: "1.8-3.6 V (>= 3.0 V for HSADC, >= 2.4 V for ADC and DAC)"
            note: >
              Analog supply for the ADC, temperature sensor, HSADC, OPA, CMP, DAC and PLL.
              Match it to VDDIO when the OPA or DAC is used; otherwise it may be higher. Must
              not exceed VDD33.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDDIO
            pins: [VDDIO]
            range: "1.65-3.6 V"
            note: >
              I/O supply: sets the output high level of the regular I/O pins and feeds the I/O
              LDO that produces VIO18. Must not exceed VDD33 or VDD33A. When VIO18 rises from
              low to high, VDDIO's capacitance must be much larger than VIO18's or the inrush
              pulls VDDIO down. 0.1 uF per pin plus 10 uF at the main pin.
            source: "CH32H417DS0.md 1.4.3"
          - name: VIO18
            pins: [VIO18]
            range: "1.1-3.6 V"
            note: >
              Supply for the high-speed I/O pins. Normally GENERATED by the I/O LDO from
              VDDIO and set by software to 1.2, 1.8, 2.5 or 3.3 V, or switched off. The level
              after power-up is chosen by the pull-down resistor on the XO pin. Short it to
              VDDIO when low-voltage I/O is not needed. 0.1 uF per pin plus 2.2 uF at the
              main pin.
            source: "CH32H417DS0.md 1.4.3, Table 3-2"
          - name: VDD12A
            pins: [VDD12A]
            range: "1.17-1.27 V"
            note: >
              For the USB 3.0 module and the TH PHY. Normally an LDO OUTPUT derived from
              VDD33, so the pin is a decoupling node: 0.1 uF + 2.2 uF. May be fed from an
              external DC-DC instead to move the LDO's heat off the chip - then the external
              voltage must sit slightly above the LDO's output, and the LDO must be off.
            source: "CH32H417DS0.md 1.4.3"
          - name: VDDK
            pins: [VDDK]
            range: "1.17-1.27 V"
            note: >
              Core supply, with the same double role as VDD12A: normally an LDO output from
              VDD33 and a decoupling node (0.1 uF per pin plus 2.2 uF at the main pin), or fed
              externally at a voltage slightly above the LDO's output.
            source: "CH32H417DS0.md 1.4.3"
          - name: VREFP
            pins: [VREFP]
            range: "2.4-3.6 V"
            note: >
              Reference input for the ADC, HSADC and DAC. Must not exceed VDD33A. Tie it to
              VDD33A for ratiometric conversions, or drive it from a reference - there is no
              internal reference pad.
            source: "CH32H417DS0.md 1.4.3"
          - name: VBAT
            pins: [VBAT]
            range: "1.8-3.6 V"
            note: >
              Optional backup supply, outside the VDD33 >= VDD33A >= VDDIO >= VIO18 ordering:
              it is only switched in when VDD33 and VDD33A are off, to run the RTC and the
              external 32 kHz oscillator.
            source: "CH32H417DS0.md 1.4.3"
          - name: VSS / VSSA
            pins: [VSS, VSSA]
            range: "0 V"
            note: >
              Ground, and the analog return for VDD33A and VREFP. Star VSSA to VSS at the pin
              rather than along the digital ground path.
            source: "CH32H417DS0.md Table 2-1-1"
