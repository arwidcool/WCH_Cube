            - { name: "Mapping 1", value: 1, sdk: DEF_UHSIF_CLKREMAP1 }
            - { name: "Mapping 2", value: 2, sdk: DEF_UHSIF_CLKREMAP2 }
            - { name: "Mapping 3", value: 3, sdk: DEF_UHSIF_CLKREMAP3 }
          help: >
            ch32h417_uhsif.h:38-41. Same caveat as the data mapping above. The EVT example
