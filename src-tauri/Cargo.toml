[package]
name = "wch-cubemx"
version = "0.1.0"
description = "Pinout, peripheral and clock configurator for WCH MCUs"
authors = ["WCHCube"]
edition = "2021"
rust-version = "1.77.2"
default-run = "wch-cubemx"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
